# 中印尼双重国籍条约、三次与四次中日民间贸易协定、农业社生产领导与粮食统购统销、1956 年粮食销售指示、
# 宽大处理城市残余反革命、夏收分配、自留地、成都会议物资分配、嵖岈山公社简章、谢富治 1960 年公安会议报告、
# 紧急指示信（十二条）、信阳地委 1960 年整风救灾报告、张北县致外流社员信、平调退赔、巩固集体经济决定、
# 大庆会战报告通知、中尼边界条约、中巴边界协定，以及 1980 年统战部右派复查报告（回顾 1957 年）。
