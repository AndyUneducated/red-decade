    date: 1988-11
    author: 许寅
    kind: news
    alias: 许寅《未被起诉的人：访原空五军政委陈励耘》
    url: https://web.archive.org/web/20160304220119/http:/www.21ccom.net/articles/rwcq/article_2013123198010.html
    via: 原载《金岛》，共识网 2013-12-31 转载，Wayback 2016-03-04 快照（第 1 页）
    excerpt: true
    keep: [陈励耘何许人也, 县民政局负责人热情地接待了记者, 中国人民解放军军事检察院免予起诉决定书, 军检免字第10号, 被告人陈励耘，男，现年63岁, 被告人陈励耘一案, 1971年3月31日晚至4月1日, 以上罪行，经审查核实, 被告人陈励耘积极追随林彪, 检察长 于克法, 1982年3月10日, 用得着上诉吗, 陈励耘，成都人，1919年生]
