# M5-1 中文原文（维基文库）第 5 批：两篇“无产阶级专政的历史经验”、军衔与兵役、台海危机声明、伍修权联合国发言、
# 惩治贪污条例、三届人大的选举公告、第二次城市工作会议、胡乔木食堂调查、秋收分配与集市贸易、压低口粮标准、
# 潢川县粮食工作检查（信阳事件）、西藏自治区成立、赫鲁晓夫下台、再论陶里亚蒂、1959 年政府工作报告。
# 日期按页面 header（有的用 年/月/日 字段）与落款核对。
# 《关于对去冬今春在粮食工作上所犯严重错误的检查》落款是中共商城县委，1960 年 8 月 26 日，不是潢川；id 按商城改。
# 《惩治贪污条例》header 有两组日期（3 月 28 日、4 月 18 日），按 4 月 18 日中央人民政府委员会批准。
