# M5-1 中文原文（维基文库）第 6 批：三评至六评与八评、陶里亚蒂与多列士两篇、《列宁主义万岁》、劳动教养、
# 劳动保险、领海声明、1960–1964 年四次特赦战犯、中缅边界、中朝条约、统一财经、禁烟、日本战犯、治安处罚、
# 1953 年选举法与召开人大决议、工资改革、逮捕拘留条例、1956 年最高法院报告。
# 法规页面的 header 常被“1987 年清理”模板覆盖成 1987 年，日期按正文题注与落款核对。
# 《列宁主义万岁》header 写 4 月 19 日，来源只注“红旗”，未写期号，只记到月。
# 《1956年最高人民法院工作报告》header 是 1957 年 3 月 9 日，向全国人大常委会所作，id 按报告日期。
# 公安部清理劳教右派的通知 header 是 1961 年 11 月 9 日（正文引 1961 年 10 月 28 日中央指示）。
