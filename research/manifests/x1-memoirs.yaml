  - id: wu-faxian-memoir-cwo
    title: 岁月艰难：吴法宪回忆录
    date: 2006
    author: 吴法宪
    kind: memoir
    tier: 3
    alias: 吴法宪《岁月艰难》网友整理 PDF（书目另见 wu-faxian-memoir）
    url: https://chanworld.org/wp-content/uploads/wpforo/default_attachments/1624916269-CWO.pdf
    via: chanworld.org 论坛附件（“CWO 收集 研究参考 2021”扫描整理本）
    note: 回忆录 2006 年香港北星出版社出版，转录、未核原书；PDF 是网友整理本，文字有 OCR 错字。
    pdf: true
    unwrap: true
    despace: true
    excerpt: true
    keep: [军委决定于一九六六年十一月十三日下午, 大会由总政部主任萧华和副主任刘志坚一起主持, 陈毅在讲话中公开批评了到会的军队院校师生, 十五、一九六七年军委扩大会议, 这个会议破天荒地一直开了三个月, 会议首先制定的是《中共中央关于不得把斗争锋芒指向军队的通知》, 首先是揪斗萧华的事件, 陈伯达在会上首先发言，批评萧华, 他还指责萧华说, 一些省、市、自治区的领导也在“文革”初期被迫害至死, 一九六七年四月三十日晚上，毛泽东请周恩来, 发出《关于对征询召开“九大”的意见的通报》, 一九六七年十月八日晚，在北京外交部街四周的邮箱里, 一九七一年九月二十四日凌晨四点, 空军政委王辉球召集空军司令部, 林立果的这个“讲用报告”很长, 是在空军放了一颗, 事后调来录音听了一遍, 彭德怀专案组整理出了, 黄永胜的批示：“同意”, 宪法修改小组在中南海怀仁堂继续开会, 这次会议上发生了异常激烈的争论, 叶群突然通知黄永胜、我、李作鹏、邱会作四个人, 那天，江青一个人从上午九点一直说到了十二点, 以后给罗瑞卿做的截肢手术很成功, 十一月十一日，中央军委通告各军区、各野战军, 组建不过十个月的年轻的空军导弹部队, 一架U—2飞机在江西上空“咬钩”了, U—2飞机被击落后，刘亚楼立即报告给了周恩来, 中央军委又在北京召开了一次扩大会议，专门讨论军队政治工作的问题, 两个稿子起草完毕后，罗瑞卿主持会议讨论决定, 军队实行了近十年的军衔制]
