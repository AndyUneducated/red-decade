    keep: [1977年5月24日他同王震和我谈话, “三株大毒草”中的《论总纲》我确实是最近才看到的, 1979年1月18日至4月3日，中共中央召开了一个全国理论工作务虚会, 1979年3月21日，陈云同志在中共中央政治局会议上讲话, 中国文学艺术工作者第四次代表大会1979年10月30日在北京开幕, 那天邓小平同志的祝词，博得了, 1984年12月29日至1985年1月5日, 李先念同志的女婿是部队作家, 1987年7月7日，中央开会, 1989年6月21日，王震在中央政治局扩大会议上发表书面讲话, 1989年9月4日，邓小平与中央常委, 中共十三届五中全会召开，全会通过了, 中央转发了一个山西省委《关于农业学大寨运动中经验教训的检查报告》, 原来毛主席提倡工业学大庆，农业学大寨, 后来，才有了1981年2月20日, 1982年2月开始，在全国范围里搞起了, 中央书记处研究室张云声不赞成发展以雇工经营为特征的私人企业, 1982年12月31日，陈云在中共中央政治局扩大会议讨论]
