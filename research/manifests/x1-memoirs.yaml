    keep: [军委决定于一九六六年十一月十三日下午, 大会由总政部主任萧华和副主任刘志坚一起主持, 陈毅在讲话中公开批评了到会的军队院校师生, 十五、一九六七年军委扩大会议, 这个会议破天荒地一直开了三个月, 会议首先制定的是《中共中央关于不得把斗争锋芒指向军队的通知》, 首先是揪斗萧华的事件, 陈伯达在会上首先发言，批评萧华, 他还指责萧华说, 一些省、市、自治区的领导也在“文革”初期被迫害至死, 一九六七年四月三十日晚上，毛泽东请周恩来, 发出《关于对征询召开“九大”的意见的通报》, 一九六七年十月八日晚，在北京外交部街四周的邮箱里, 一九七一年九月二十四日凌晨四点, 空军政委王辉球召集空军司令部, 林立果的这个“讲用报告”很长, 是在空军放了一颗, 事后调来录音听了一遍]
