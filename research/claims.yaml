- id: C034
  statement: 1975 年 10 月 21 日，《人民日报》社论号召“认真执行毛主席提出的”三项指示（学习理论反修防修、安定团结、把国民经济搞上去）。不到五个月，1976 年 3 月 10 日的《人民日报》号召“批判‘三项指示为纲’”，5 月 16 日把它定为“邓小平翻案复辟的政治纲领”。1976 年这两篇文章的批判对象都写作“三项指示为纲”，而不是三项指示本身。1978 年十一届三中全会说，“四人帮”把 1975 年的路线说成“右倾翻案风”，这个“颠倒了的历史必须重新颠倒过来”。
  status: partial
  method: 检索“三项指示”“右倾翻案风”，对读 1975 年 10 月至 1978 年 12 月相关文本。
  evidence:
