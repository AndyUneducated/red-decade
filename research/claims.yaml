    - { cite: rmrb-1976-03-10-fanan, quote: 批判“三项指示为纲”，使刮翻案风的党内走资派完全陷入孤立的境地 }
    - { cite: rmrb-1976-05-16-wenge, quote: “三项指示为纲”，是邓小平翻案复辟的政治纲领 }
    - { cite: ws-1978-12-third-plenum, quote: “四人帮”硬把一九七五年的政治路线和工作成就说成是所谓“右倾翻案风”，这个颠倒了的历史必须重新颠倒过来 }
  caveats: 邓小平 1975 年提出“三项指示为纲”的讲话原文、毛泽东对此的批评原文都未入库，“为纲”二字为何成为批判焦点，本库文本没有直接说明。
