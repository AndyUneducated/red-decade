- id: C004
  statement: 四项并列（“旧思想、旧文化、旧风俗、旧习惯”）最早见于 6 月 1 日《横扫一切牛鬼蛇神》，《十六条》、林彪 8·18 讲话沿用全称。缩写“四旧”进入官方文本是在 8 月 31 日林彪第二次接见讲话，而且加了引号——“横扫‘四旧’”——表明这是从街头借来的说法；到 10 月 1 日，林彪国庆讲话和《红旗》国庆社论都已不加引号，并配上对仗的“立四新”。这一个月里，红卫兵的口号被官方吸收并规范化。
  status: supported
  method: 全语料逐词检索“四旧”“旧思想”，并按日期排列；注意引号的有无。
  evidence:
    - { cite: ws-1966-06-01-sweep, quote: 要彻底破除几千年来一切剥削阶级所造成的毒害人民的旧思想、旧文化、旧风俗、旧习惯 }
    - { cite: ws-1966-08-18-lin-speech, quote: 我们要大破一切剥削阶级的旧思想，旧文化，旧风俗，旧习惯 }
    - { cite: ws-1966-08-31-lin-speech, quote: 他们走上街头，横扫“四旧” }
    - { cite: ws-1966-10-01-lin-speech, quote: 破剥削阶级的四旧，立无产阶级的四新 }
    - { cite: ws-1966-10-01-mao-thought-road, quote: 大破剥削阶级的四旧，大立无产阶级的四新 }
  caveats: “四旧”在红卫兵中最早何时出现，仍需 8 月的红卫兵传单与小报来确定。
  concepts: [four-olds]
  events: [1966-06-01-sweep-editorial, 1966-08-18-first-rally, 1966-08-23-very-good]
  logged: 2026-10-10
  history:
    - { date: 2026-10-10, note: 原结论为“缩写‘四旧’在已收 1966 年官方文本中从未出现”。补入林彪 8·31、10·1 讲话与《红旗》第 13 期社论后被推翻，改写为现结论。这正是原“局限”一栏所预计的情形。 }

