- id: C032
  statement: 推荐入学制下的“文化考查”经历了一进一退，退的时候没有被废除，而是被掏空了内容。1970 年招生意见“废除修正主义的招生考试制度”；1973 年招生意见在群众推荐、政审之后加入“文化考查”，要求入学者“相当于初中毕业以上的实际文化程度”。同年 8 月《人民日报》转载张铁生的信，说他交了“白卷”，却交了一份“发人深省的答卷”。1974 年招生意见把上一年的考查定为“修正主义教育路线”的突出表现，点名批评“闭卷考试”“凭分录取”，但仍保留“文化考查”之名，方法改为“调查访问，座谈讨论”。
  status: supported
  method: 1970、1973、1974 年三份招生意见与张铁生信编者按对读。
  evidence:
    - { cite: ws-1970-06-27-enrollment, quote: 废除修正主义的招生考试制度，实行群众推荐，领导批准和学校复审相结合的办法 }
    - { cite: ws-1973-enrollment, quote: 在群众推荐、政审合格的基础上，重视文化程度，进行文化考查 }
    - { cite: ws-1973-enrollment, quote: 保证入学学生具有相当于初中毕业以上的实际文化程度 }
    - { cite: rmrb-1973-08-10-zhang-tiesheng, quote: 他对物理化学这门课的考试，似乎交了“白卷”，然而对整个大学招生的路线问题，却交了一份颇有见解，发人深省的答卷 }
    - { cite: ws-1974-enrollment, quote: 修正主义教育路线在招生工作中的表现和影响突出反映在文化考查问题上 }
    - { cite: ws-1974-enrollment, quote: 不少地区曾程度不同地出现过沿袭旧高考的办法，搞突然袭击，闭卷考试，单纯考书本知识，凭分录取 }
    - { cite: ws-1974-enrollment, quote: 采用调查访问，座谈讨论等多种形式进行试验 }
  caveats: 1973 年各地实际怎样考查、张铁生的考试成绩，本库没有原始材料。1973、1974 年两份招生意见的日期只到年份。
