- id: C003
  statement: “资产阶级司令部”一词不见于 1966 年任何已收公开文本；《炮打司令部》被引原文只说“某些领导同志”。整个 1966 年下半年到 1967 年上半年，官方用的是“资产阶级反动路线”（见 C011），1967 年元旦社论用了 41 次“资产阶级反动路线”，却没有一次“资产阶级司令部”。“两个司令部”的说法在 1967 年 8 月 5 日周年社论（17 次）和 8 月 7 日《红旗》社论（25 次）中集中出现。罪名从“路线”升级为“司令部”，发生在 1967 年 8 月，是事后加码。
  status: supported
  method: 全语料逐词检索（tools/concordance.ts）；语料扩充到 46 篇后复核，其中 1966 年 10–12 月 6 篇、1967 年 1–7 月 7 篇。
  evidence:
    - { cite: ws-1967-08-bombard-anniv, quote: 原来在无产阶级专政机构内部，存在着两个根本对抗的司令部 }
    - { cite: ws-1967-08-destroy-hq, quote: 党内出现两个司令部之间的斗争，这是必然的现象 }
    - { cite: ws-1967-01-01-to-the-end, quote: 有一两个或几个在中央做工作的负责人，乘毛主席不在北京的机会，抛出了资产阶级反动路线 }
    - { cite: ws-1981-resolution, quote: 党内根本不存在所谓以刘少奇、邓小平为首的“资产阶级司令部” }
  caveats: 红卫兵小报仍然缺失。“炮打司令部”的口号与“两个司令部”的私下说法可能更早在群众组织中流传，结论只限于官方公开文本。
