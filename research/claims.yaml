- id: C036
  statement: 毛泽东去世后的继承之争，围绕的是他 1976 年 4 月 30 日同一天的手迹。9 月 16 日两报一刊社论以“毛主席嘱咐我们”的名义发表“按既定方针办”。10 月 18 日中央通知说，华国锋 10 月 2 日已批示毛泽东原话是“照过去方针办”，“六个字错了三个”，并把它定为“伪造”。10 月 24 日首都大会公开了同一天的另一张手迹“你办事，我放心”，作为毛泽东对华国锋“无限信任”的凭据。这一口号也进入了地方：商丘的一份判决书记载，被告在 10 月 11 日把县委致党中央贺电稿中的“三要三不要”改成了“按既定方针办”。
  status: supported
  method: 检索“既定方针”“过去方针”“你办事”，按日期排列。
  evidence:
    - { cite: rmrb-1976-09-16-mao-editorial, quote: 毛主席嘱咐我们：“按既定方针办” }
    - { cite: ws-1976-10-18-notice, quote: 他们有计划有预谋地伪造了一个“按既定方针办”的所谓毛主席的临终嘱咐 }
    - { cite: ws-1976-10-18-notice, quote: 毛主席一九七六年四月三十日亲笔写的指示是“照过去方针办”，“按既定方针办”六个字错了三个 }
    - { cite: rmrb-1976-10-25-rally, quote: 四月三十日，毛主席又给华国锋同志亲笔写了“你办事，我放心”，表达了毛主席对华国锋同志的无限信任 }
    - { cite: ws-1979-shangqiu-judgment, quote: 同时又把稿中“坚持三要三不要三项基本原则”改为“按既定方针办” }
  caveats: 两张手迹的原件和华国锋 10 月 2 日的批示都未入库，内容只见于胜利一方的通知与报道；被指“伪造”的一方的说法，本库没有。
