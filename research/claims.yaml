    - { cite: ws-1980-indictment, quote: 有三十四万六千多名干部、群众遭到诬陷、迫害，一万六千二百二十二人被迫害致死 }
    - { cite: ws-1980-indictment, quote: 使冀东地区的党员干部、群众八万四千余人遭受诬陷、迫害，张文浩等二千九百五十五人被迫害致死 }
