  statement: 本站 1965–1966 年事件的主要日期来源——《五一六通知》附件大事记——是 1966 年 5 月胜利一方编定的指控性材料。它刻意标注周恩来在按语中的作用、把彭真的每一步都解释为“对抗”，使用时应视为“1966 年官方叙事”而非中立记录。
