- id: C030
  statement: 1981 年决议说，1972 年周恩来提出批判极左思潮，毛泽东却认为任务“仍然是反对‘极右’”。本库文本中，这一转折的时间可以定在 1972 年 9 月到 1973 年 7 月之间。1972 年 9 月 29 日关于干部住房的文件仍要求“结合批林整风……批判无政府主义，批判极‘左’思潮”，这是“极‘左’”在本库官方文本中最后一次出现。从 1973 年 7 月起，“极右实质”成了批林的固定措辞，1973–1974 年有 6 篇文本使用，包括周恩来本人所作的十大政治报告、批林批孔社论和湖北省委批林批孔指示。粉碎“四人帮”后，1977 年十届三中全会仍以“极右”定性四人帮。直到 1981 年决议，“极左”才重新出现在官方文本中，并被用来定性这一时期。
  status: supported
  method: 1966–1981 年全部已收文本逐篇统计“极‘左’”（带引号）、“极左”、“极右”、“形‘左’实右”。
  evidence:
    - { cite: ws-1981-resolution, quote: 一九七二年，在批判林彪的过程中，周恩来同志正确地提出要批判极左思潮的意见 }
    - { cite: ws-1981-resolution, quote: 毛泽东同志却错误地认为当时的任务仍然是反对“极右” }
    - { cite: ws-1973-08-24-zhou-report, quote: 也说出了林彪反党集团的极右实质 }
    - { cite: ws-1974-02-02-editorial, quote: 才能进一步批深批透林彪反革命的修正主义路线的极右实质 }
    - { cite: ws-1974-05-21-hubei-instructions, quote: 指向林彪修正主义路线的极右实质 }
    - { cite: ws-1972-cadre-housing, quote: 要结合批林整风，认真学习中发〔1972〕28号文件，批判无政府主义，批判极“左”思潮 }
    - { cite: ws-1977-07-tenth-third-plenum, quote: 是一伙彻头彻尾的极右派 }
  caveats: 周恩来 1972 年的讲话与毛泽东的意见原文未入库，二者只见于 1981 年决议的转述。6 篇中有 2 篇（1973 年 7 月 1 日、8 月 7 日《人民日报》）的“极右实质”用于“刘少奇一类骗子”（见 C029）。1972 年林彪材料之二也有“极左派”一词，那是所引林彪本人的话，不计入。本库以公开与下发文件为主，内部讲话中的用法不在统计之内。
