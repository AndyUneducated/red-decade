- id: C001
  statement: 《二月提纲》并非“自由化”文件：它完全接受“兴无灭资”、“两条道路斗争”的框架，分歧集中在程序（有领导、慎重、经批准点名）、学术与政治的边界、以及是否整左派。《五一六通知》把这些程序性主张逐条重新定义为阶级立场问题。
  status: supported
  method: 将提纲全文与通知第（一）至（十）点逐句对照（见文献室“逐条对照”）。
  evidence:
    - { cite: ws-1966-02-outline, quote: 是兴无灭资的斗争即社会主义及资本主义两条道路斗争中的一个组成部分 }
    - { cite: ws-1966-02-outline, quote: 报刊上公开点名作重点批判要慎重，有的人要经过有关领导机构批准 }
    - { cite: ws-1966-05-16-notice, quote: 提纲却反复强调斗争中要所谓“有领导”、要“谨慎”、要“慎重”、要“经过有关领导机构批准” }
  caveats: 提纲的实际执行意图只能从胜利一方编写的大事记旁证，彭真方面的自述尚未收集。
  people: [peng-zhen, kang-sheng]
  concepts: [equality-before-truth, class-struggle]
