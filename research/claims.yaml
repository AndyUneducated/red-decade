- id: C031
  statement: 1972–1976 年，“秦始皇”是对立双方共用的影射符号，所指始终是毛泽东。1972 年 1 月下发的林彪材料之二公布了《571 工程纪要》“打倒当代的秦始皇”的原话，同一份材料附上毛泽东 1958 年“我们超过了秦始皇一百倍”的话作为回答。1974 年评法批儒文章把秦始皇改称“杰出政治家”“杰出的法家政治家”；1975 年姚文元仍把“当代的秦始皇”列为林彪集团的罪状。1976 年 4 月，《人民日报》把天安门广场上“秦始皇时代已经过去”的口号定为“影射”的反革命语言。批林批孔中对秦始皇的褒扬，正面回应了这一影射。
  status: partial
  method: 全语料检索“秦始皇”，按日期排列，对读上下文。
  evidence:
    - { cite: ws-1972-lin-material-2, quote: 打倒当代的秦始皇——Ｂ－５２，推翻挂着社会主义招牌的封建王朝 }
    - { cite: ws-1972-lin-material-2, quote: 你骂我们是秦始皇，不对，我们超过了秦始皇一百倍 }
    - { cite: ws-1974-new-tsar, quote: 秦始皇是新兴封建地主阶级的杰出政治家，他顺乎历史发展的潮流，反对孔孟之道，行法家之法 }
    - { cite: ws-1974-wang-anshi, quote: 杰出的法家政治家秦始皇、汉武帝坚决抵抗匈奴奴隶主的侵扰 }
    - { cite: rmrb-1975-03-01-yao-social-basis, quote: 诬蔑为“封建专制”，咒骂为“当代的秦始皇” }
    - { cite: rmrb-1976-04-08-tiananmen, quote: 他们用影射和赤裸裸的反革命语言，猖狂地叫嚣“秦始皇时代已经过去” }
  caveats: 评法批儒文章本身没有提到《571 工程纪要》，“正面回应”是从时间顺序与用语推出的。1958 年讲话为专案材料转引，未用《建国以来毛泽东文稿》核对。
