- id: C033
  statement: 1973 年中央处理知青问题时，承认问题的范围很广，归因却没有触及上山下乡政策本身。李庆霖来信经毛泽东复信后，中央通知要求各省区派人“来中央汇报和统筹解决这一问题”；兵团案通报承认奸污、吊打知青的案件“在其他地方也有发生，有的相当严重”，云南兵团有的团“捆绑吊打成风”。但通报把作案干部定为“林彪修正主义路线的余孽”，把迫害知青解释为“两个阶级、两条路线、两种思想的激烈斗争”的一种反映，同时重申上山下乡“是毛主席革命路线的伟大胜利”；8 月 7 日《人民日报》社论把“变相劳改”一类说法归为“刘少奇一类骗子”的“反动谬论”。
