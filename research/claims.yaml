    - { cite: ws-1973-bingtuan-case, quote: 充满着两个阶级、两条路线、两种思想的激烈斗争，当前摧残迫害上山下乡知识青年就是这个斗争的一种反映 }
    - { cite: ws-1973-bingtuan-case, quote: 取得了丰硕成果，这是毛主席革命路线的伟大胜利 }
