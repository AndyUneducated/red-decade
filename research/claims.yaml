- id: C023
  statement: 中央从 1966 年 9 月起就把边境地区当作例外：新疆伊犁、塔城、阿尔泰等地“不采取群众直接‘罢官’的办法”，由区党委“自上而下调整领导”，并劝离外地串联学生，理由是“不使苏修有机可乘”。两年后边疆省区也是最后一批成立革委会的：云南、福建、广西在 1968 年 8 月相继成立，社论特意回击“中国靠近边疆的省、区成立不了革命委员会”的说法；西藏、新疆在 9 月 5 日同时成立，“至此，全国除台湾省以外的省、市、自治区都成立了革命委员会”。边防考虑减缓了这些省区的夺权进程，却没有使它们免于大规模迫害：起诉书所列受害人数最多的一案——“内人党”案，346,000 余人遭诬陷——就发生在边疆的内蒙古。
  status: partial
  method: 对读 1966 年中央关于边境地区的决定、1968 年 8–9 月边疆省区革委会成立社论与新闻，以及 1980 年起诉书各案人数。
