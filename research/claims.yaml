- id: C011
  statement: “资产阶级反动路线”这个罪名在 1966 年 10 月 1 日《红旗》第 13 期社论中首次公开出现。此前 1966 年 1–9 月的全部已收文本（包括《十六条》、全会公报、林彪 8·18 与 8·31 讲话）都没有这一说法；“两条路线斗争”只在江青主持的《部队文艺工作座谈会纪要》中作为文艺史框架出现过。国庆社论反过来把《十六条》说成“两条路线斗争的产物”，尽管《十六条》本身没有这个词。此后它迅速成为全国通用语，1967 年元旦社论一篇就用了 41 次。被指控的刘少奇在 10 月 23 日的检讨中只承认“右倾机会主义的路线错误”，没有使用这个标签。
  status: supported
  method: 全语料检索“资产阶级反动路线”“两条路线”“路线错误”，按日期排列。
  evidence:
    - { cite: ws-1966-10-01-mao-thought-road, quote: 是两条路线斗争的产物，是以毛主席为代表的无产阶级革命路线战胜资产阶级反动路线的产物 }
    - { cite: ws-1966-10-01-mao-thought-road, quote: 对资产阶级反动路线，必须彻底批判 }
    - { cite: ws-1966-03-army-arts, quote: 文化战线上都存在两个阶级、两条路线的斗争 }
    - { cite: ws-1966-10-liu-self-criticism, quote: 这是一种右倾机会主义的路线错误 }
    - { cite: ws-1967-01-01-to-the-end, quote: 抛出了资产阶级反动路线，反对毛主席的正确路线 }
  caveats: 陈伯达在 10 月中央工作会议上的讲话《无产阶级文化大革命中的两条路线》和《红旗》第 14 期社论尚未入库；内部讲话中这一说法可能早于 10 月 1 日。
