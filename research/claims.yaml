- id: C001
  statement: 《二月提纲》并非“自由化”文件：它完全接受“兴无灭资”、“两条道路斗争”的框架，分歧集中在程序（有领导、慎重、经批准点名）、学术与政治的边界、以及是否整左派。《五一六通知》把这些程序性主张逐条重新定义为阶级立场问题。
  status: supported
  method: 将提纲全文与通知第（一）至（十）点逐句对照（见文献室“逐条对照”）。
  evidence:
    - { cite: ws-1966-02-outline, quote: 是兴无灭资的斗争即社会主义及资本主义两条道路斗争中的一个组成部分 }
    - { cite: ws-1966-02-outline, quote: 报刊上公开点名作重点批判要慎重，有的人要经过有关领导机构批准 }
    - { cite: ws-1966-05-16-notice, quote: 提纲却反复强调斗争中要所谓“有领导”、要“谨慎”、要“慎重”、要“经过有关领导机构批准” }
  caveats: 提纲的实际执行意图只能从胜利一方编写的大事记旁证，彭真方面的自述尚未收集。
  people: [peng-zhen, kang-sheng]
  concepts: [equality-before-truth, class-struggle]
  events: [1966-02-12-outline-issued, 1966-05-16-notice]
  logged: 2026-10-10

- id: C002
  statement: 刘少奇 1966 年 10 月 23 日的检讨在结构上逐项复述了《炮打司令部》的三项指控——“五十多天”、“一九六二年的右倾”、“一九六四年形'左'而实右”——说明检讨是按毛泽东设定的罪名框架书写的，而不是独立的自我陈述。
  status: supported
  method: 两文对读，比对时间段与措辞。
  evidence:
    - { cite: ws-1967-08-bombard-anniv, quote: 可是在五十多天里，从中央到地方的某些领导同志 }
    - { cite: ws-1967-08-bombard-anniv, quote: 联系到一九六二年的右倾和一九六四年形‘左’而实右的错误倾向 }
    - { cite: ws-1966-10-liu-self-criticism, quote: 在今年六月一日以后的五十多天中，我在指导无产阶级文化大革命中发生了路线错误，方向错误 }
    - { cite: ws-1966-10-liu-self-criticism, quote: 在一九六二年我犯过右倾错误，在一九六四年我又犯过形式上是“左”的而实际上是右倾的错误 }
  caveats: 《炮打司令部》原文目前经 1967 年周年社论转引获得，需用《建国以来毛泽东文稿》第 12 册核对。
  people: [liu-shaoqi, mao-zedong]
  concepts: [two-lines]
  events: [1966-08-05-bombard, 1966-10-work-conference]
  logged: 2026-10-10

- id: C003
  statement: “资产阶级司令部”一词不见于 1966 年任何已收公开文本；《炮打司令部》被引原文只说“某些领导同志”。“两个司令部”理论是 1967 年 8 月周年社论系统化的，该社论单篇使用“资产阶级司令部”17 次。这是一个概念被事后加码的典型案例。
  status: partial
  method: 全语料逐词检索（tools/concordance.ts）。
  evidence:
    - { cite: ws-1967-08-bombard-anniv, quote: 原来在无产阶级专政机构内部，存在着两个根本对抗的司令部 }
    - { cite: ws-1981-resolution, quote: 党内根本不存在所谓以刘少奇、邓小平为首的“资产阶级司令部” }
  caveats: 当前语料只有 30 余篇，1966 年 10–12 月的中央文革讲话、红卫兵小报尚未收入；结论可能被新语料推翻。
  concepts: [bourgeois-hq]
  events: [1966-08-05-bombard]
  logged: 2026-10-10

