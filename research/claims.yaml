- id: C012
  statement: 到 1966 年底，对立的群众组织说的是同一套官方话语。由干部子弟组成、反对中央文革的“联动”，12 月 5 日的宣言与上海工总司宣言一样，都要“彻底批判资产阶级反动路线”，都高呼“无产阶级革命造反精神万岁”。冲突不在框架，而在框架里的空位由谁来填——谁是“资产阶级反动路线”的执行者。官方语言因此成了一种各方争夺的资源，而不只是自上而下的命令。
