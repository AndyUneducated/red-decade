- id: C006
  statement: “造反”这个词本身从未被任何一方放弃。它的第一批使用者是清华附中的干部子弟红卫兵（6 月 24 日、7 月 4 日两张大字报），而他们造反的立足点是国家一边：“我们只许左派造反，不许右派造反……反正国家机器在我们手里。”8 月 25 日西城纠察队自称“革命的造反队”，12 月 5 日由老红卫兵组成、矛头指向中央文革的“联动”仍高呼“无产阶级革命造反精神万岁”。变化的是“造反的对象”：11 月 9 日工总司宣言把造反对象明确为“上海市委”与“资产阶级反动路线”，即本地党委。到 1967 年 1 月，“造反派”成为官方承认的名词（《红旗》转载《革命造反有理万岁》一篇即用 21 次），专指造本地党委反、受中央文革支持的一方。也就是说，词没有反转，所指被重新分配了。
  status: supported
  method: 按日期排列“造反”“造反派”在全部语料中的用法，并看每篇的造反对象。
  evidence:
    - { cite: rmrb-1966-08-24-rebel-1, quote: 革命就是造反，毛泽东思想的灵魂就是造反 }
    - { cite: rmrb-1966-08-24-rebel-2, quote: 我们只许左派造反，不许右派造反！你们胆敢造反，我们就立即镇压！这就是我们的逻辑。反正国家机器在我们手里 }
    - { cite: ws-1966-08-xicheng-founding, quote: 纠察队是革命的造反队，是无产阶级专政的工具 }
    - { cite: ws-1966-11-shanghai-wgs, quote: 老实告诉那些党内走资本主义道路当权派的老爷们，我们工人造你们的反是造定了！这个反是被资产阶级反动路线逼出来的 }
    - { cite: ws-1966-11-shanghai-wgs, quote: 上海市委也贯彻执行了一条资产阶级反动路线 }
    - { cite: ws-1966-12-liandong, quote: 无产阶级革命造反精神万岁 }
    - { cite: ws-1967-01-shanghai-urgent, quote: 用毛泽东思想武装起来的革命造反派，坚决揭露这个阴谋 }
  caveats: 1966 年 9–10 月“造反派”一词在群众中的用法，需要造反派小报来补。
  concepts: [rebellion, two-lines]
  events: [1966-06-24-rebel-essays, 1966-08-25-xicheng-picket, 1966-11-09-shanghai-wgs, 1966-12-05-liandong]
  logged: 2026-10-10
  history:
    - { date: 2026-10-10, note: 原结论为“‘造反’一词在四个月内发生了指向反转”。补入工总司宣言、“联动”宣言与 1967 年 1 月文本后修正：词本身双方都用，变的是对象与“造反派”这一名词的归属。状态由“部分支持”改为“证据支持”。 }
    - { date: 2026-10-10, note: M2-7 补入清华附中三论（《人民日报》1966-08-24 转载），把起点从 8 月 25 日前推到 6 月 24 日，并补上最早使用者的立场。结论方向不变。 }

- id: C007
  statement: 《十六条》同时包含最强的约束条款（“要用文斗，不用武斗”、学生“一律不整”、“要保护少数”）与最强的动员语言（“不要怕出乱子”）；十天后林彪 8·18 讲话只保留了动员一面（“使他们威风扫地，永世不得翻身”），8·23 社论为街头行动背书。直到 8 月 31 日第二次接见，林彪才在讲话中重申“要用文斗，不用武斗。不要动手打人”，而此时卞仲耘（8 月 5 日）、老舍（8 月 24 日）等人已经死去；同一篇讲话仍然肯定红卫兵“横扫‘四旧’”。成文约束与口头动员在同一个月里并存，约束的重申晚于暴力，并且始终与对行动的肯定捆绑在一起。
  status: supported
  method: 《十六条》、林彪 8·18 与 8·31 讲话、《好得很！》对读，并与事件日期对照。
  evidence:
    - { cite: ws-1966-08-08-sixteen-points, quote: 在进行辩论的时候，要用文斗，不用武斗 }
    - { cite: ws-1966-08-08-sixteen-points, quote: 要保护少数，因为有时真理在少数人手里 }
    - { cite: ws-1966-08-08-sixteen-points, quote: 不要怕出乱子 }
    - { cite: ws-1966-08-18-lin-speech, quote: 使他们威风扫地，永世不得翻身 }
    - { cite: ws-1966-08-31-lin-speech, quote: 我们一定要按照毛主席的教导，要用文斗，不用武斗。不要动手打人 }
  caveats: 卞仲耘、老舍的死亡日期目前来自通行史实（起诉书只列老舍为“迫害致死”，未给日期），人物数据中标为待核。
  concepts: [verbal-struggle]
  events: [1966-08-08-sixteen-points, 1966-08-18-first-rally, 1966-08-31-second-rally]
  logged: 2026-10-10
  history:
    - { date: 2026-10-10, note: 补入林彪 8·31 讲话，增加“约束的重申晚于暴力”一层（M2-2）。 }

- id: C008
  statement: “无产阶级专政下继续革命”在 1966 年和 1967 年上半年的已收文本中都没有出现。它在 1967 年 11 月 6 日两报一刊社论中首次以“伟大理论”的名义登场，并列出“要点”；1969 年九大报告用了 8 次，并把它上溯到 1957 年的《关于正确处理人民内部矛盾的问题》。也就是说，这一“理论”是在运动开始一年半以后才命名的，然后被回溯成运动的起点。1981 年决议称之为“概括”，与此相符。
  status: supported
  method: 全语料检索“继续革命”，按日期排列；46 篇中只有 1967-11-06 社论、九大报告、1981 年决议三篇出现。
  evidence:
    - { cite: ws-1967-11-06-october-road, quote: 创造性地提出了无产阶级专政下继续革命的伟大理论 }
    - { cite: ws-1967-11-06-october-road, quote: 毛泽东同志关于无产阶级专政下继续革命的理论的要点是 }
    - { cite: ws-1969-04-ninth-report, quote: 提出了无产阶级专政下继续革命的伟大理论 }
    - { cite: ws-1981-resolution, quote: 并曾被概括成为所谓“无产阶级专政下继续革命的理论” }
  caveats: 需核对 1957 年《关于正确处理人民内部矛盾的问题》原文是否含有“继续革命”的提法（九大报告的回溯是否有据）；1967 年 8–10 月的文本尚少。
  concepts: [continuous-revolution]
  logged: 2026-10-10
  history:
    - { date: 2026-10-10, note: 补入 1967-11-06 社论与九大报告，确定首次出现时间；状态由“部分支持”改为“证据支持”。 }

