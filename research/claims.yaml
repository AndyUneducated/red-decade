    - { cite: ws-1969-hubei-report, quote: 要认真学习八三四一部队的“三条原则”和“九个一样”的先进经验，不要亲一派、疏一派，支一派、压一派。 }
    - { cite: ws-1969-sichuan-report, quote: 认真学习八三四一部队的先进经验，对两派群众坚持“三条原则”，真正做到“一碗水端平”。 }
    - { cite: ws-1969-sichuan-report, quote: 违背了毛主席关于革命大联合的教导和林副主席关于“一碗水端平”的指示，亲一派、疏一派，支一派、压一派。 }
