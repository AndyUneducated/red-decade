- id: C035
  statement: 天安门事件的定性先后被改写了三次，每次都由不同的人承担责任。1976 年 4 月，《人民日报》称之为“反革命政治事件”，政治局“根据伟大领袖毛主席提议”撤销邓小平党内外一切职务。1978 年 12 月，十一届三中全会改定为“完全是革命行动”，撤销有关文件，并把颠倒是非归于“四人帮”，没有提到毛泽东在当初定性中的作用。1980 年起诉书把罪责落实为姚文元窜改材料、诬陷群众。1981 年决议第一次写明“中央政治局和毛泽东同志对天安门事件的性质作出了错误的判断”，并把平反迟缓算在华国锋头上。
  status: supported
  method: 1976 年 4 月报道与决议、1978 年三中全会公报、1980 年起诉书、1981 年决议五文对读，检索“天安门事件”“天安门广场”。
  evidence:
    - { cite: rmrb-1976-04-08-tiananmen, quote: 有预谋、有计划、有组织地制造反革命政治事件 }
    - { cite: ws-1976-04-07-deng-resolution, quote: 根据伟大领袖毛主席提议，政治局一致通过，撤销邓小平党内外一切职务，保留党籍，以观后效 }
    - { cite: ws-1978-12-third-plenum, quote: 一九七六年四月五日的天安门事件完全是革命行动 }
    - { cite: ws-1978-12-third-plenum, quote: 全会决定撤销中央发出的有关“反击右倾翻案风”运动和天安门事件的文件 }
    - { cite: ws-1980-indictment, quote: 把群众反“四人帮”、悼念周恩来、拥护邓小平的革命言行诬陷为“发表反革命演说和反革命口号” }
    - { cite: ws-1981-resolution, quote: 当时，中央政治局和毛泽东同志对天安门事件的性质作出了错误的判断 }
    - { cite: ws-1981-resolution, quote: 拖延和阻挠恢复老干部工作和平反历史上冤假错案（包括“天安门事件”）的进程 }
  caveats: 1976 年 4 月政治局关于天安门事件性质的文件、1978 年 11 月北京市委的平反决定都未入库，本库只有华国锋、邓小平两项人事决议。
