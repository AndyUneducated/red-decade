- id: C021
  statement: 1968 年的全国动员是以一条条“最新指示”为单位推进的。九大报告把这一做法总结为“最新指示一发表，立即宣传，立即行动”，称之为“最宝贵的作风”，理由是刘少奇一伙曾“封锁毛主席的指示”，现在毛的思想“直接同广大革命群众见面”。本库 1968 年文本中，“最新指示”在元旦社论里出现 12 次，柳河“五·七”干校报道 15 次；每条新指示带出一次全国性行动——“办学习班”（2 月河北社论）、“工人阶级必须领导一切”与工宣队进校（8 月）、干部下放劳动与“五·七”干校（10 月）、知识青年上山下乡（12 月）。柳河干校学员连夜翻山赶回校部庆祝，并提议把指示传来的 10 月 4 日定为学校“永久的纪念日”。指示以“毛主席最近教导我们”等形式由报刊首次公布，传递绕开了党的组织系统。
  status: supported
  method: 检索“最新指示”（25 个文本命中，1968 年最密），对照同期事件。
  evidence:
    - { cite: ws-1969-04-ninth-report, quote: 最新指示一发表，立即宣传，立即行动，这种最宝贵的作风，必须巩固下来，坚持下去。 }
    - { cite: ws-1969-04-ninth-report, quote: 由于刘少奇一伙反革命修正主义分子封锁毛主席的指示，广大革命群众难以直接听到毛主席的声音 }
    - { cite: ws-1968-01-01-total-victory, quote: 每一个无产阶级革命战士，都应该成为学习最新指示、执行最新指示、宣传最新指示、捍卫最新指示的模范。 }
    - { cite: ws-1968-02-hebei-revcom, quote: 毛主席最近教导我们：办学习班，是个好办法，很多问题可以在学习班得到解决。 }
    - { cite: ws-1968-10-may-seventh, quote: 连夜翻山过河赶到校部，庆祝毛主席最新指示的发表 }
