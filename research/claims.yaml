- id: C037
  statement: “四人帮”一词在本库中最早见于 1976 年 10 月 18 日中央通知，出自通知所引 1975 年 5 月 3 日毛泽东的话“不要搞四人帮”；此前本库所有文本都没有这个词。四人的排列顺序后来有一次明确的改变。1976–1977 年的文件，包括 10 月 18 日通知、10 月 22 日和 25 日《人民日报》的首都游行与大会报道、1977 年十届三中全会公报，一律写作“王洪文、张春桥、江青、姚文元”，与十届一中全会的职位次序一致：王洪文为副主席，张春桥为政治局常委，江青、姚文元为政治局委员。从 1980 年起诉书起，特别法庭判决书、1981 年决议和 1982 年各地判决书一律改为“江青、张春桥、姚文元、王洪文”，起诉书与判决书写明“以江青为首”。
  status: supported
  method: 1976–1989 年全部已收文本统计两种排序与“以江青为首”的出现次数（.probe/term-count.mjs）。
  evidence:
    - { cite: ws-1976-10-18-notice, quote: 不要搞四人帮，你们不要搞了，为什么照样搞呀 }
    - { cite: rmrb-1976-10-25-rally, quote: 热烈庆祝粉碎王洪文、张春桥、江青、姚文元反党集团篡党夺权阴谋的伟大胜利 }
    - { cite: ws-1977-07-tenth-third-plenum, quote: 王洪文、张春桥、江青、姚文元反党集团披着马列主义的外衣 }
    - { cite: ws-1973-08-30-first-plenum, quote: 中央委员会副主席：周恩来、王洪文、康生、叶剑英、李德生 }
    - { cite: ws-1980-indictment, quote: 以江青为首的江青、张春桥、姚文元、王洪文“四人帮”反革命集团 }
    - { cite: ws-1981-resolution, quote: 江青、张春桥、姚文元、王洪文在中央政治局内结成“四人帮” }
