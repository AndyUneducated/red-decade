- id: C010
  statement: 1980 年起诉书给出的迫害人数（如内蒙古“内人党”案 346,000 余人遭诬陷、16,222 人致死；冀东案 84,000 余人、2,955 人致死；云南赵健民案 14,000 余人致死；军队 80,000 余人、1,169 人致死）是官方司法口径，需与地方志和学术统计对照。
  status: open
  method: 摘录起诉书数字；待与地方志、学术研究交叉核对。
