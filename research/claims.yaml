- id: C027
  statement: 1970 年宪法修改草案（本库底本）不设国家主席，却在第二条按人名写定元首与军权：毛泽东是“无产阶级专政的元首”“全国全军的最高统帅”，林彪是“接班人”“副统帅”。九一三后的中央专案材料把“设国家主席”定为林彪集团庐山会议的“核心的问题”。1975 年宪法删去所有人名，改为“中国共产党中央委员会主席统率全国武装力量”，张春桥的修宪报告说明这是“由于不设国家主席”而作的修改。国家元首问题最终以党主席职位吸收军权的办法解决；1976 年 10 月华国锋就任的，也正是党中央主席与中央军委主席两个职务。
