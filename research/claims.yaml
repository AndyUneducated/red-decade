- id: C025
  statement: 1967 年 12 月 8341 部队支左“三项原则”见报时，要求部队“不匆匆忙忙急于表态”，两派都是革命群众组织就“逐步地把他们联合起来”。两年后，中央批转的湖北、四川文件又把同一个样板搬出来：湖北要求解放军“认真学习八三四一部队的‘三条原则’和‘九个一样’”，“不要亲一派、疏一派，支一派、压一派”；四川要求部队“对两派群众坚持‘三条原则’，真正做到‘一碗水端平’”，四川省革委会自己则在检讨中承认“亲一派、疏一派，支一派、压一派”。1969 年重申 1967 年的原则，等于承认这两年里地方革委会和支左部队普遍没有做到。
  status: supported
  method: 对读 1967 年 12 月 18 日《人民日报》8341 部队报道与 1969 年湖北、四川报告。
