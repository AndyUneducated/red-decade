- id: C007
  statement: 《十六条》同时包含最强的约束条款（“要用文斗，不用武斗”、学生“一律不整”、“要保护少数”）与最强的动员语言（“不要怕出乱子”）；十天后林彪 8·18 讲话只保留了动员一面（“使他们威风扫地，永世不得翻身”），8·23 社论为街头行动背书。成文约束与口头动员在同一个月里并存，后者主导了实际走向。
  status: supported
  method: 《十六条》、林彪讲话、《好得很！》对读。
  evidence:
    - { cite: ws-1966-08-08-sixteen-points, quote: 在进行辩论的时候，要用文斗，不用武斗 }
    - { cite: ws-1966-08-08-sixteen-points, quote: 要保护少数，因为有时真理在少数人手里 }
    - { cite: ws-1966-08-08-sixteen-points, quote: 不要怕出乱子 }
    - { cite: ws-1966-08-18-lin-speech, quote: 使他们威风扫地，永世不得翻身 }
  concepts: [verbal-struggle]
  events: [1966-08-08-sixteen-points, 1966-08-18-first-rally]
  logged: 2026-10-10

