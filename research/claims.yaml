- id: C026
  statement: 广东高州县陈焯的大字报是本库唯一一份当时、当地、出自被管制一方的农村杀戮记录：“滥捕滥杀成风，很多地方的五类分子及其子孙已被杀绝，路上伏尸道左及河中流尸逐波”。他为此要求“立即解放地主富农”，结果以“大肆煽动五类分子起来造我无产阶级的反”的罪名被判二十年。同案林氏兄弟的申诉还揭示了“地主富农”身份的一种来源：土改工作队以“地主富农的户数要达到总农户的百分之八”为指标，把原评贫农的四兄弟改划为“工商业兼富农”。这些事实在两份定论文件里都没有位置：1980 年起诉书全文没有“五类分子”“地、富”等词，1981 年决议只在讲 1978 年后的工作时提到为“原地主、富农分子改订了成分”（参见 C013）。
