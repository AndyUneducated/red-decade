- id: C029
  statement: 九一三之后将近两年，公开报刊不点林彪的名，而用“刘少奇一类骗子”指代。1971 年 9 月 18 日中央通知规定林彪事件只传达到省级党委常委，“有关林彪的文字、图画、电影等均暂不改动”；此后下发的中央通知与专案材料直呼“林彪”数十至上百次，而 1972 年元旦社论、1972 年国庆社论、1973 年元旦社论和 1973 年 7 月 1 日、8 月 7 日《人民日报》共用“刘少奇一类骗子”21 次，没有一次出现林彪的名字。1973 年元旦社论说“开展对刘少奇一类骗子的革命大批判……提高了识别真假马克思主义的能力”，8 月 24 日十大政治报告说“开展对林彪一类骗子的革命大批判……提高了识别真假马克思主义的能力”：句式不变，只换了人名。九一三之前的 1971 年文件用的是“刘少奇一类政治骗子”。
  status: supported
  method: 1971–1974 年全部已收文本逐篇统计“林彪”“刘少奇一类骗子”“刘少奇一类政治骗子”“林彪一类骗子”（.probe/term-count.mjs），按日期与文本性质（公开 / 下发）排列。
  evidence:
    - { cite: ws-1971-09-18-notice, quote: 根据内外有别、有步骤地传达的原则，目前只传达到省、市、自治区党委常委以上的党组织。有关林彪的文字、图画、电影等均暂不改动 }
    - { cite: ws-1971-education-summary, quote: 深入批判刘少奇一类政治骗子所鼓吹的唯心论的先验论 }
    - { cite: ws-1972-01-01-editorial, quote: 刘少奇一类骗子里通外国，妄图改变党的路线和政策，改变社会主义制度的阴谋 }
    - { cite: ws-1973-01-01-editorial, quote: 开展对刘少奇一类骗子的革命大批判，进一步清算了他们的反革命罪行，戳穿了他们的谣言和诡辩，提高了识别真假马克思主义的能力 }
    - { cite: ws-1973-08-24-zhou-report, quote: 开展对林彪一类骗子的革命大批判，从思想上、政治上、组织上清算了他们的反革命罪行，提高了识别真假马克思主义的能力 }
