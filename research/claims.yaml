- id: C022
  statement: 1968 年 7–8 月，在八届十二中全会之前，康生系统对旧精英层做了一次逐个机构的清点，四份名单的比例几乎相同：八届中央委员、候补委员 193 人中 88 人（46%），八届中监委 60 人中 37 人（62%），三届人大常委 115 人中 60 人（52%），四届政协常委 159 人中 74 人（47%）被定为“叛徒”“特务”“反革命修正主义分子”等。后三份报告在 8 月 23 日至 27 日五天内完成。比例的稳定说明这是对整个旧体制上层的系统性定性，而不是针对个别人的专案。名单也没有被机械执行：人大常委名单上的朱德、叶剑英，八个月后都当选九届中央政治局委员。
