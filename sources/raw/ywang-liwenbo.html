<blockquote>
<h1>
<b>李文波</b></h1>
</blockquote>
<center><table BORDER=4 COLS=1 WIDTH="80%" >
<tr>
<td>
<br><img SRC="liwenbo1.gif" height=310 width=220 align=RIGHT>
<p><br></p><p>李文波,男，北京北京崇文区的杆栏市居民。1966年8月25日，红卫兵以李文波是前小业主为借口，抄了李文波的家。据说李文波在抄家中还手打了红卫兵。此事立刻传遍北京城，说是“阶级敌人杀害红卫兵”。文革后，据知情者说，李文波根本没有动手打红卫兵，只是曾要求红卫兵让他的妻子上厕所。在当时，这一事件不但导致了李文波及妻子和杆栏市地区大批人被打死，而且，成为在全北京掀起更狂暴的打人高潮的借口。“血债要用血来还”成为红卫兵新的口号。<p><br></p></p>
</td>
