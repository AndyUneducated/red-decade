<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="以一手文献为本，可视化 1949–1989 年中国政治史：时间线、人物网络、命运矩阵、思想谱系与原文阅读。" />
    <title>红色年代 · Red Decade</title>
    <script>
      // set the theme before first paint so night readers never see a white flash
      try {
        var t = localStorage.getItem('rd-theme')
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      html { background: #f6f4ef; }
      html[data-theme='dark'] { background: #161513; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
