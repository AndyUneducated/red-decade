  place: 全国
  summary: 根据 1972 年招生座谈会，1973 年招生意见要求入学学生具有“相当于初中毕业以上的实际文化程度”，继续执行“自愿报名，群众推荐，领导批准，学校复审”，并要求查处“走后门”。
