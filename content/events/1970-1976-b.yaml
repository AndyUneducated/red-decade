  voices:
    - { voice: official1966, text: 贺龙同志已于一九六九年六月九日病故（1974 年 9 月中共中央通知）, cite: ws-1974-he-long-name, quote: true }
    - { voice: official1966, text: 因此，中央决定，对贺龙同志予以平反，恢复名誉（同一通知）, cite: ws-1974-he-long-name, quote: true }
    - { voice: officialLater, text: 但《通知》对贺龙同志的平反是不彻底的，有些提法是错误的（1982 年中共中央决定）, cite: ws-1982-he-long-rehab, quote: true }
    - { voice: officialLater, text: “文化大革命”中被林彪、江青和康生一伙诬陷迫害致死（同一决定）, cite: ws-1982-he-long-rehab, quote: true }
  cites: [ws-1974-he-long-name, ws-1982-he-long-rehab]

