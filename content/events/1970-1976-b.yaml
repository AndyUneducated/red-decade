  title: 村际械斗的“决议”和“条约”
  lane: local
  weight: 1
  place: 原件未注地点
  summary: 两份村级文件显示了宗族、村际械斗的组织化。1975 年 8 月一份“保卫山场，自卫反击决议”由 92 人和 29 人盖章，规定伤亡、坐牢者家属由生产队供养，“通敌”者镇压、不出战者罚款；1976 年 1 月另一村为争山林订立“械斗条约”，由生产队补贴自制鸟枪。
  people: []
  voices:
    - { voice: doc, text: 凡属我水头人氏，必须团结一致，坚决打击和消灭入侵之敌（1975 年 8 月 30 日决议）, cite: ws-1975-08-30-shanchang, quote: true }
    - { voice: doc, text: 水头一、二、三队等92人盖章（同一决议落款）, cite: ws-1975-08-30-shanchang, quote: true }
    - { voice: doc, text: 由队补贴所制武器（如鸟枪，补谷30斤，钱7元，炭烧队里的），一律不准卖（1976 年 1 月 8 日械斗条约）, cite: ws-1976-01-08-xiedou-treaty, quote: true }
