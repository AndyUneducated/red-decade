# 1970–1976 second batch: documents registered in research/manifests/m4-ws-2.yaml

- id: 1970-01-31-yida
  date: 1970-01-31
  title: 中央指示“打击反革命破坏活动”：“一打三反”之“一打”
  lane: center
  weight: 3
  place: 全国
  summary: 中共中央指示称苏联“阴谋对我发动侵略战争”，国内反革命分子“乘机蠢动”，要求“用战备的观点”发动群众，对反革命破坏活动“稳、准、狠地予以打击”，同时要求“严格地审查捕人和杀人的名单”。指示只发到省、军级领导核心，以下口头传达，不登报、不广播。地方随即开展运动，合肥市的通知把它和 2 月 5 日两个文件称为“毛主席亲自批示的中央三个文件”，运动称“一打三反”。
  people: []
  voices:
    - { voice: official1966, text: 苏修正在加紧勾结美帝，阴谋对我发动侵略战争；国内的反革命分子也乘机蠢动，遥相呼应（1970 年 1 月 31 日中共中央指示）, cite: ws-1970-01-31-yida, quote: true }
    - { voice: official1966, text: 对反革命分子的各种破坏活动，必须坚决地稳、准、狠地予以打击（同一指示）, cite: ws-1970-01-31-yida, quote: true }
    - { voice: doc, text: 此件只发到省、军级领导核心，以下各级均由省、军级派人口头传达（指示末尾的发送范围）, cite: ws-1970-01-31-yida, quote: true }
    - { voice: doc, text: 凡属停职反省、隔离反省、重点批斗的案件，由各区、各中层革委会核心小組和中央、省属大厂党委（核心小组）审批（1970 年合肥市通知）, cite: ws-1970-hefei-yida, quote: true }
    - { voice: official1966, text: 广泛地开展了打击反革命分子、反对贪污盗窃、反对投机倒把、反对铺张浪费的“一打三反”运动（1970 年国庆两报一刊社论）, cite: rmrb-1970-10-01-national-day, quote: true }
  cites: [ws-1970-01-31-yida, ws-1970-hefei-yida, rmrb-1970-10-01-national-day]

- id: 1970-02-05-sanfan
  date: 1970-02-05
  title: 反贪污盗窃、反投机倒把、反铺张浪费：“三反”两个文件
  lane: econ
  weight: 2
  place: 全国
  summary: 同日下发两个文件。一是中共中央关于反对贪污盗窃、投机倒把的指示，毛泽东批示“照办”，列举侵吞财物、倒卖票证、“地下工厂、地下商店”等，要求把这场斗争“看作如同打击现行反革命的斗争一样重要”。二是关于反对铺张浪费的通知，严禁新建楼堂馆所，附件中的信访简报举了四川乐山地区设宴欢送支左人员的例子。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 必须把这场斗争看作如同打击现行反革命的斗争一样重要（1970 年 2 月 5 日中共中央指示）, cite: ws-1970-02-05-sanfan, quote: true }
    - { voice: official1966, text: 一切地下工厂、地下商店、地下包工队、地下运输队、地下俱乐部，必须坚决取缔（同一指示）, cite: ws-1970-02-05-sanfan, quote: true }
    - { voice: doc, text: 地方上大办酒席，招待看戏，共花了一万二千六百元（反对铺张浪费通知所附《文化大革命信访简报》，乐山地区）, cite: ws-1970-02-05-langfei, quote: true }
  cites: [ws-1970-02-05-sanfan, ws-1970-02-05-langfei]

- id: 1970-02-24-sun-yefang
  date: 1970-02-24
  title: 《人民日报》批判孙冶方
  lane: ideology
  weight: 1
  place: 北京
  summary: 《人民日报》刊出工人大批判组和纺织工业部写作小组的文章，称孙冶方是刘少奇“在经济学界的一个代表”，并把他主持编写的《社会主义经济论》称为“大毒草”。
  people: [sun-yefang, liu-shaoqi]
  voices:
    - { voice: official1966, text: 反革命分子孙冶方，是叛徒、内奸、工贼刘少奇在经济学界的一个代表（1970 年《人民日报》）, cite: ws-1970-02-24-sun-yefang-critique, quote: true }
  cites: [ws-1970-02-24-sun-yefang-critique]

- id: 1970-06-enrollment
  date: 1970-06
  title: 北大、清华招生试点：从工农兵中选拔学生
  lane: culture
  weight: 2
  place: 北京
  summary: 中央同意北京大学、清华大学关于招生（试点）的请示报告并转发各地参考。报告引毛泽东“要从有实践经验的工人、农民中间选拔学生”，两校计划招生 4100 名；来自工厂的学生每月由学校发 19.5 元伙食费和津贴。1972 年的招生通知称之为“1970年招生试点”。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 我们计划于今年上半年开始招生，两校共招生四千一百名（1970 年北大、清华请示报告）, cite: ws-1970-06-27-enrollment, quote: true }
    - { voice: official1966, text: 要从有实践经验的工人、农民中间选拔学生，到学校学习几年以后，又回到生产实践中去（报告所引毛泽东语）, cite: ws-1970-06-27-enrollment, quote: true }
  cites: [ws-1970-06-27-enrollment, ws-1972-houmen]

- id: 1970-07-chengkun
  date: 1970-07
  title: 成昆铁路建成
  lane: econ
  weight: 1
  place: 四川、云南
  summary: 中共中央致电成都、昆明军区、铁道兵和修建成昆铁路的军民，祝贺这条“具有重要战略意义”的铁路建成，并说“为了加强战备……我们必须修建更多的铁路”。
  people: []
  voices:
    - { voice: official1966, text: 建成了具有重要战略意义的成昆铁路（1970 年中共中央贺电）, cite: ws-1970-chengkun, quote: true }
    - { voice: official1966, text: 为了加强战备，加速社会主义建设，我们必须修建更多的铁路（同一贺电）, cite: ws-1970-chengkun, quote: true }
    - { voice: official1966, text: 二十一年来，特别是无产阶级文化大革命以来，铁路建设有了突飞猛进的发展，取得了巨大的成就（1970 年文章《毛泽东思想指引我们多快好省地修建铁路》）, cite: ws-1970-railway, quote: true }
  cites: [ws-1970-chengkun, ws-1970-railway]

- id: 1970-10-13-canada
  date: 1970-10-13
  title: 中国与加拿大建交
  lane: intl
  weight: 2
  place: 原件未载签署地
  summary: 中加两国政府决定互相承认并建立外交关系。公报中，中国政府重申台湾是中国领土不可分割的一部分，加拿大政府“注意到”这一立场。一个月后的中意建交公报采用了同样的写法。
  people: []
  voices:
    - { voice: doc, text: 加拿大政府注意到中国政府的这一立场（1970 年中加建交公报）, cite: ws-1970-canada, quote: true }
    - { voice: doc, text: 意大利政府注意到中国政府的这一声明（1970 年 11 月中意建交公报）, cite: ws-1970-italy, quote: true }
  cites: [ws-1970-canada, ws-1970-italy]

- id: 1970-11-06-italy
  date: 1970-11-06
  title: 中国与意大利建交
  lane: intl
