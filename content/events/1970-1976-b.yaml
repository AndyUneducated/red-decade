  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 这个问题牵涉到几百万人，开后门来的也有好人，从前门来的也有坏人，需要具体分析，慎重对待（1974 年中共中央通知）, cite: ws-1974-houmen, quote: true }
    - { voice: official1966, text: 当前，批林批孔刚刚展开，又夹着走后门，有可能冲淡批林批孔（同一通知）, cite: ws-1974-houmen, quote: true }
  cites: [ws-1974-houmen]

