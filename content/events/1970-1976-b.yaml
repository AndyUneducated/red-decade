  summary: 国务院、中央军委通报，黑龙江生产建设兵团十六团原团长黄砚田、原参谋长李耀东利用职权奸污、猥亵女知识青年多人，批准判处二人死刑，立即执行。通报把他们定为“林彪修正主义路线的余孽”，要求切实做好知青上山下乡工作。通报中说上山下乡的知识青年有“几百万”。
  people: []
  voices:
    - { voice: official1966, text: 国务院、中央军委批准判处奸污迫害上山下乡女知识青年罪犯黄砚田、李耀东以死刑，立即执行（1973 年通报）, cite: ws-1973-bingtuan-case, quote: true }
    - { voice: official1966, text: 几百万知识青年上山下乡，生气勃勃地活跃在农村的各条战线上（同一通报）, cite: ws-1973-bingtuan-case, quote: true }
  cites: [ws-1973-bingtuan-case]

- id: 1973-enrollment
