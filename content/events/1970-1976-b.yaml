- id: 1974-rufa
  date: 1974
  title: “评法批儒”：儒法斗争史成为政治语言
  lane: ideology
  weight: 2
  place: 全国
  summary: 批林批孔扩展为“儒法斗争”史的写作，报刊文章把历史人物分为法家、儒家，用来比附当前：一篇文章说“法家爱国，儒家卖国”，从司马光到林彪“无一不是卖国投降的无耻之徒”；一篇说苏联“尊孔反法”是为了反华；还有文章组织妇女批判《改良女儿经》。
  people: [lin-biao]
  voices:
    - { voice: official1966, text: 法家爱国，儒家卖国，是一个带有规律性的历史现象（1974 年《论爱国主义者王安石》）, cite: ws-1974-wang-anshi, quote: true }
    - { voice: official1966, text: 苏修尊孔反法，根本的目的，就在于反华（1974 年《孔老二的亡灵和新沙皇的迷梦》）, cite: ws-1974-new-tsar, quote: true }
    - { voice: official1966, text: 广大工农兵对《改良女儿经》等坏书展开了群众性的批判（1974 年批判《改良女儿经》文章）, cite: ws-1974-nvrjing, quote: true }
  cites: [ws-1974-wang-anshi, ws-1974-new-tsar, ws-1974-nvrjing]

- id: 1974-09-29-he-long-rehab
