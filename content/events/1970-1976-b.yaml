- id: 1972-grain
  date: 1972
  title: 国务院粮食问题报告：“高筑墙，广积粮，缓称王”
  lane: econ
  weight: 2
  place: 全国
  summary: 中央转发国务院关于粮食问题的报告。报告说两年来职工人数和粮食销量大幅增加，遇到当年严重自然灾害，征购量减少，“出现了挖库存较多的情况”。转发批语引毛泽东讲的朱升“高筑墙，广积粮，缓称王”，要求不要因为形势好就忘乎所以。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 遇到今年严重的自然灾害，征购量略有减少，就出现了挖库存较多的情况（1972 年中共中央转发批语）, cite: ws-1972-grain, quote: true }
    - { voice: official1966, text: 朱升说：“高筑墙，广积粮，缓称王。”（同一批语，转述毛泽东所讲《明史·朱升传》故事）, cite: ws-1972-grain, quote: true }
  cites: [ws-1972-grain]

- id: 1972-houmen
  date: 1972
  title: 高校招生中的“走后门”
  lane: culture
  weight: 1
  place: 全国
  summary: 1972 年春季高校招生期间的通知说，各地招生“程度不同地存在着‘走后门’现象”，少数干部私留名额、内定名单、指名选送，把自己、亲属和老上级的子女送进大学。通知规定今后“走后门”入学者要退回。
  people: []
  voices:
    - { voice: official1966, text: 将自己、亲属和老上级的子女送进高等学校（1972 年关于招生“走后门”的通知）, cite: ws-1972-houmen, quote: true }
    - { voice: official1966, text: 如再有干部滥用职权、违反招生规定“走后门”者，除对有关干部进行严肃处理外，也要把学生退回（同一通知）, cite: ws-1972-houmen, quote: true }
  cites: [ws-1972-houmen]

- id: 1973-bingtuan-case
  date: 1973
  title: 黑龙江兵团团长、参谋长迫害女知青案判处死刑
  lane: mass
  weight: 2
