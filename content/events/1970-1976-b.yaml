  people: []
  voices:
    - { voice: doc, text: 望接通知后，立即发动群众，认真讨论，提出处理意见，连同讨论结果，及时上报市人民法院（1973 年张家口市革委会通知）, cite: ws-1973-zhangjiakou-masses, quote: true }
    - { voice: doc, text: 此件发至全市各基层单位，只供讨论，不准张贴，讨论后由各区和工业、财贸、文教等系统集中销毁（同一通知）, cite: ws-1973-zhangjiakou-masses, quote: true }
  cites: [ws-1973-zhangjiakou-masses]

