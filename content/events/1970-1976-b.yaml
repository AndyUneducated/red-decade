  title: 中央为贺龙恢复名誉
  lane: center
  weight: 2
  place: 北京
  summary: 中央通知说林彪“要整贺龙同志蓄意已久”，审查一直被林彪、黄永胜、吴法宪、叶群、李作鹏等把持；经查证，所谓“通敌”和“篡夺军权”都不属实，决定为贺龙平反、恢复名誉。通知说贺龙“病故”。1982 年中央另发决定，说他是被“诬陷迫害致死”，1974 年的通知“平反是不彻底的”。
