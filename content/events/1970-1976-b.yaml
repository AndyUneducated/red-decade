  summary: 中意两国政府决定互相承认并建立外交关系，三个月内互派大使。意大利政府承认中华人民共和国政府为中国的唯一合法政府。
  people: []
  voices:
    - { voice: doc, text: 意大利政府承认中华人民共和国政府为中国的唯一合法政府（1970 年中意建交公报）, cite: ws-1970-italy, quote: true }
  cites: [ws-1970-italy]

- id: 1971-02-public-security
  date: 1970-12-11
  end: 1971-02-11
  title: 第十五次全国公安会议：“我们不是靠杀人来统治的”
  lane: center
  weight: 2
  place: 北京
  summary: 会议开了两个月，273 人参加。纪要称会前毛泽东提出“我们不是靠杀人来统治的”，会议期间又对 1971 年中发一号文件批示“照办”。纪要同时要求按“林副主席提出的三条标准”选拔公安干部，“务必使公安机关掌握在可靠人员手里”。
  people: [mao-zedong, lin-biao]
  voices:
    - { voice: official1966, text: 会前，毛主席提出了我們不是靠杀人来統治的重要指示（第十五次全国公安会议纪要）, cite: ws-1971-public-security-15, quote: true }
    - { voice: official1966, text: 按照毛主席指示的接班人的五个条件和林副主席提出的三条标准，培养选拔干部（同一纪要）, cite: ws-1971-public-security-15, quote: true }
  cites: [ws-1971-public-security-15]

- id: 1971-07-01-party-50
  date: 1971-07-01
  title: 建党五十周年社论：仍以林彪为“副统帅”引述
  lane: ideology
  weight: 1
  place: 北京
  summary: 两报一刊编辑部文章《纪念中国共产党五十周年》，以路线斗争为线索讲党史，提出“一个政党的成功或失败，决定于路线是否正确”。文章仍以“林彪同志在党的第九次全国代表大会上的报告中说”开头引述林彪。两个半月后林彪出逃。
  people: [lin-biao, mao-zedong]
  voices:
    - { voice: official1966, text: 一个政党的成功或失败，决定于路线是否正确（1971 年两报一刊编辑部文章）, cite: ws-1971-07-01-party-50, quote: true }
    - { voice: doc, text: 林彪同志在党的第九次全国代表大会上的报告中说（同一文章）, cite: ws-1971-07-01-party-50, quote: true }
  cites: [ws-1971-07-01-party-50]

- id: 1971-07-08-family-planning
  date: 1971-07-08
  title: 国务院批转计划生育报告
  lane: econ
  weight: 2
  place: 全国
  summary: 国务院批转卫生部军管会等三部门报告，引毛泽东“人类在生育上完全无政府主义是不行的”。报告说据 16 个省区统计，1969 年人口自然增长率为千分之二十四，要求到 1975 年城市降到千分之十左右；除少数民族和人口稀少地区外都要抓计划生育。
  people: [mao-zedong, zhou-enlai]
  voices:
    - { voice: official1966, text: 人类在生育上完全无政府主义是不行的，也要有计划生育（国务院批语所引毛泽东语）, cite: ws-1971-family-planning, quote: true }
    - { voice: doc, text: 根据十六个省、市、自治区的统计，一九六九年平均人口自然增长率为千分之二十四（卫生部军管会等报告）, cite: ws-1971-family-planning, quote: true }
    - { voice: doc, text: 力争到一九七五年，一般城市降到千分之十左右（同一报告）, cite: ws-1971-family-planning, quote: true }
  cites: [ws-1971-family-planning]

- id: 1971-08-13-education-summary
  date: 1971-08-13
  title: 《全国教育工作会议纪要》：十七年教育与知识分子的定性
  lane: culture
  weight: 3
  place: 北京
  summary: 全国教育工作会议 4 月 15 日至 7 月 31 日在北京举行，631 人参加；纪要经毛泽东批示“同意”，发到公社党委和大中小学党支部。纪要断定建国后十七年“毛主席的无产阶级教育路线基本上没有得到贯彻执行”，原有教师“大多数”的“世界观基本上是资产阶级的”。
  people: [mao-zedong, liu-shaoqi, lin-biao]
  voices:
    - { voice: official1966, text: 毛主席的无产阶级教育路线基本上没有得到贯彻执行，教育制度、教学方针和方法几乎全是旧的一套（1971 年《全国教育工作会议纪要》）, cite: ws-1971-education-summary, quote: true }
    - { voice: official1966, text: 大多数是拥护社会主义，愿意为人民服务的，但是世界观基本上是资产阶级的（同一纪要，论原有教师队伍）, cite: ws-1971-education-summary, quote: true }
  cites: [ws-1971-education-summary]

- id: 1971-11-wages
  date: 1971-11
  title: 国务院调整部分工人工资
  lane: econ
  weight: 1
  place: 全国
  summary: 国务院通知对 1957 年底前参加工作的三级工、1960 年底前的二级工、1966 年底前的一级工等调整工资，同时要求批判“物质刺激、奖金挂帅”。通知举例说北京郊区粮食加工业二级工 33 元、三级工 36 元，级差不到 5 元。
  people: []
  voices:
    - { voice: official1966, text: 现行的工资制度还存在一些问题，需要随着斗、批、改运动的深入发展，逐步进行改革（1971 年国务院通知）, cite: ws-1971-wages, quote: true }
    - { voice: doc, text: 二级为三十三元，三级为三十六元，工资级差不到五元（同一通知注）, cite: ws-1971-wages, quote: true }
  cites: [ws-1971-wages]

- id: 1971-12-30-diaoyu
  date: 1971-12-30
  title: 外交部声明：钓鱼岛是台湾的附属岛屿
  lane: intl
  weight: 2
  place: 北京
  summary: 美日国会通过“归还”冲绳协定，把钓鱼岛等岛屿划入“归还区域”。中国外交部声明钓鱼岛、黄尾屿、赤尾屿等是台湾的附属岛屿，美日的做法“完全是非法的”。
  people: []
  voices:
    - { voice: official1966, text: 钓鱼岛等岛屿自古以来就是中国的领土（1971 年 12 月 30 日外交部声明）, cite: ws-1971-12-30-diaoyu, quote: true }
    - { voice: official1966, text: 中国人民一定要解放台湾！中国人民也一定要收复钓鱼岛等台湾的附属岛屿（同一声明）, cite: ws-1971-12-30-diaoyu, quote: true }
  cites: [ws-1971-12-30-diaoyu]

- id: 1972-03-13-uk
  date: 1972-03-13
  title: 中英外交关系升格为大使级
  lane: intl
  weight: 1
  place: 原件未载签署地
  summary: 两国把派驻对方首都的外交代表由代办升格为大使。英国政府承认中国关于台湾是中国一个省的立场，并于同日撤销在台湾的官方代表机构。
  people: []
  voices:
    - { voice: doc, text: 联合王国政府承认中国政府关于台湾是中华人民共和国的一个省的立场，决定于一九七二年三月十三日撤销其在台湾的官方代表机构（1972 年中英联合公报）, cite: ws-1972-uk, quote: true }
  cites: [ws-1972-uk]

- id: 1972-04-25-zhejiang
  date: 1972-04-25
  title: 中央批复浙江：“林陈反党集团”只是陈励耘等一小撮
  lane: local
  weight: 1
  place: 浙江
  summary: 浙江省委和驻浙部队十人来京开会后，中央同意他们关于继续揭批“林陈反党集团”的报告，批示称参与反革命活动的“只是陈励耘等一小撮”，犯严重路线错误的只是南萍、熊应堂两人，对犯错误的同志要“惩前毖后，治病救人”。报告署名人中仍有南萍、熊应堂。
  people: [chen-liyun, mao-zedong]
  voices:
    - { voice: official1966, text: 参与林陈反党集团的反革命活动的，只是陈励耘等一小撮。在这次路线斗争中犯了严重方向路线错误的，也只是南萍、熊应堂两同志（1972 年 4 月 25 日中共中央批示）, cite: ws-1972-pishi, quote: true }
  cites: [ws-1972-pishi]

- id: 1972-07-27-army-discipline
  date: 1972-07-27
  title: 中发〔1972〕28 号：整顿军队纪律，退还侵占的房屋
  lane: army
  weight: 2
  place: 天津
  summary: 中共中央、中央军委转发北京军区、六十六军、天津警备区三个党委的报告。批语说侵占学校、医院、工矿企业的房屋，无偿占有地方车辆物资，“走后门，投机倒把”等现象“全国许多地方也有”，要求作为批林整风的一项重要内容来抓。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 这种不正之风，必须引起各级地方和部队党委的严重注意，并且采取坚决的措施加以克服（1972 年 7 月 27 日中共中央、中央军委批语）, cite: ws-1972-beijing-66-tianjin, quote: true }
    - { voice: official1966, text: 军队要统一，军队要整顿（批语所引毛泽东语）, cite: ws-1972-beijing-66-tianjin, quote: true }
  cites: [ws-1972-beijing-66-tianjin]

- id: 1972-09-29-cadre-housing
  date: 1972-09-29
  title: 老干部、高级知识分子住房被挤占调查
  lane: center
  weight: 1
  place: 北京
  summary: 中央同意国务院办公室的调查报告。报告调查的 4 个单位中，老干部、高级知识分子和爱国人士共 230 人，住房被挤占的 177 人，占 67%；中国科学院 95 人中被挤占的 87 人。批语要求被挤占的住房“原则上应予退还”。
  people: [li-xiannian]
  voices:
    - { voice: doc, text: 这次调查的4个重点单位，老干部、高级知识分子和爱国人士共有230人（1972 年国务院办公室调查报告）, cite: ws-1972-cadre-housing, quote: true }
    - { voice: official1966, text: 住房被挤占的，原则上应予退还（1972 年 9 月 29 日批语）, cite: ws-1972-cadre-housing, quote: true }
  cites: [ws-1972-cadre-housing]

