# Events, 1977–1979 (M6 第 1 批)：十一大、1978 宪法、右派摘帽与改正、地富摘帽、早期平反、中美建交、对台、调整方针、第一批改判。

- id: 1977-08-eleventh-congress
  date: 1977-08-12
  end: 1977-08-18
  title: 中共十一大：宣布“第一次文化大革命”胜利结束
  lane: center
  weight: 3
  place: 北京
  summary: 粉碎“四人帮”后的第一次党代会。华国锋作政治报告，宣布文化大革命“以粉碎‘四人帮’为标志，宣告胜利结束”，但仍称之为“第一次”，并重申无产阶级专政下继续革命的理论和“抓纲治国”。邓小平在会上当选副主席。1981 年的历史决议认为这次大会对文革的错误理论“反而加以肯定”。
  people: [hua-guofeng, deng-xiaoping, ye-jianying, li-xiannian, wang-dongxing]
  concepts: [continuous-revolution, class-struggle]
  voices:
    - { voice: doc, text: 这样，历时十一年的我国第一次无产阶级文化大革命，就以粉碎“四人帮”为标志，宣告胜利结束了（1977 年十一大政治报告）, cite: ws-1977-08-12-eleventh-congress-report, quote: true }
    - { voice: doc, text: 第一次无产阶级文化大革命的胜利结束，决不是阶级斗争的结束，决不是无产阶级专政下继续革命的结束（同一报告）, cite: ws-1977-08-12-eleventh-congress-report, quote: true }
    - { voice: official1981, text: 由于当时历史条件的限制和华国锋同志的错误的影响，这次大会没有能够纠正“文化大革命”的错误理论、政策和口号，反而加以肯定（1981 年历史决议）, cite: ws-1981-resolution, quote: true }
  cites: [ws-1977-08-12-eleventh-congress-report, ws-1981-resolution]

- id: 1977-two-whatevers
  date: 1977-02-07
  end: 1978-12
  title: “两个凡是”与真理标准讨论
  lane: ideology
  weight: 3
  place: 北京
  summary: 1977 年 2 月 7 日“两报一刊”社论提出“凡是毛主席作出的决策，我们都坚决维护，凡是毛主席的指示，我们都始终不渝地遵循”。1978 年 5 月《光明日报》以特约评论员名义发表《实践是检验真理的唯一标准》，引发全国讨论，汪东兴等人指责其“砍旗”，邓小平、罗瑞卿、胡耀邦支持。十一届三中全会肯定了讨论，1981 年决议把“两个凡是”列为华国锋的主要错误。两篇文章在维基文库上都没有单独页面，本站暂以决议的转述为据。党史学者韩钢 2008 年据李鑫的检讨和理论务虚会发言等材料另有说法：社论里的“两个凡是”是中央理论学习组在李鑫主持下起草、汪东兴批发的，原意是应对要求邓小平复出和为天安门事件平反的舆论；1977 年 3 月中央工作会议以后华国锋没有再提。
  people: [hua-guofeng, wang-dongxing, deng-xiaoping, hu-yaobang, luo-ruiqing]
  voices:
    - { voice: official1981, text: 他推行和迟迟不改正“两个凡是”（即“凡是毛主席作出的决策，我们都坚决维护，凡是毛主席的指示，我们都始终不渝地遵循”）的错误方针；压制一九七八年开展的对拨乱反正具有重大意义的关于真理标准问题的讨论（1981 年历史决议评华国锋）, cite: ws-1981-resolution, quote: true }
    - { voice: official1981, text: 这次全会坚决批判了“两个凡是”的错误方针，充分肯定了必须完整地、准确地掌握毛泽东思想的科学体系；高度评价了关于真理标准问题的讨论（同一决议评三中全会）, cite: ws-1981-resolution, quote: true }
    - { voice: foreign, text: 'Teng’s differences with the collective leadership led by Hua are currently manifested in a continuing dispute over what role Maoist theory (Mao Tsetung Thought) should play in the solution of China’s problems（1978 年 10 月美国中央情报局评估）', cite: frus-7780v13-d140, quote: true }
    - { voice: foreign, text: 'Hua has recently shifted to the right to endorse a number of Teng’s pragmatic programs designed to accelerate China’s modernization（同一评估）', cite: frus-7780v13-d140, quote: true }
    - { voice: scholar, text: 上述经过说明，这个经典表述不出自华国锋（韩钢 2008 年《还原华国锋》）, cite: aisixiang-2008-han-gang-hua-guofeng, quote: true }
    - { voice: scholar, text: 1977年3月中央工作会议以后，华再未提过“两个凡是”，官方文件、官方媒体也不再出现“两个凡是”（同一文章）, cite: aisixiang-2008-han-gang-hua-guofeng, quote: true }
  cites: [ws-1981-resolution, frus-7780v13-d140, aisixiang-2008-han-gang-hua-guofeng]

- id: 1978-02-fifth-npc
  date: 1978-02-26
  end: 1978-03-05
  title: 五届人大一次会议：十年规划与“一百二十个大型项目”
  lane: econ
  weight: 2
  place: 北京
  summary: 华国锋作政府工作报告，提出 1976–1985 年十年规划，要在八年里新建和续建一百二十个大型项目，并大量引进成套设备，后来被称为“洋跃进”。一年后国务院承认比例失调，改行“调整、改革、整顿、提高”。会议选举叶剑英为人大常委会委员长，华国锋续任总理。
  people: [hua-guofeng, ye-jianying, deng-xiaoping, li-xiannian, yu-qiuli]
  voices:
    - { voice: doc, text: 国家计划新建和续建一百二十个大型项目，其中有十大钢铁基地，九大有色金属基地，八大煤炭基地，十大油气田，三十个大电站，六条铁路新干线和五个重点港口（1978 年政府工作报告）, cite: ws-1978-02-26-gov-report, quote: true }
    - { voice: doc, text: “四人帮”攻击国务院务虚会是“右倾翻案风风源”，把十年规划纲要说成是“修正主义文件”，这完全是恶毒的诽谤和污蔑（同一报告）, cite: ws-1978-02-26-gov-report, quote: true }
    - { voice: scholar, text: 所以，即便把当年的引进规模扩大说成是“洋跃进”，也不是华一个人的主张，事实上邓小平比华国锋更积极（韩钢 2008 年据房维中编年和政治局讨论记录梳理 1977–1978 年引进决策）, cite: aisixiang-2008-han-gang-hua-guofeng, quote: true }
  cites: [ws-1978-02-26-gov-report, aisixiang-2008-han-gang-hua-guofeng]

- id: 1978-03-05-constitution
  date: 1978-03-05
  title: 1978 年宪法：保留“四大”
  lane: center
  weight: 2
  place: 北京
  summary: 五届人大一次会议通过新宪法，取代 1975 年宪法。序言仍写入“无产阶级专政下的继续革命”，第四十五条保留公民“运用‘大鸣、大放、大辩论、大字报’的权利”，叶剑英的修宪报告说这是“为了保障无产阶级领导下的大民主”。1980 年西单墙关闭后，五届人大三次会议删去了这一条。
  people: [ye-jianying, hua-guofeng]
  concepts: [mass-democracy, continuous-revolution]
  voices:
    - { voice: doc, text: 公民有言论、通信、出版、集会、结社、游行、示威、罢工的自由，有运用“大鸣、大放、大辩论、大字报”的权利（1978 年宪法第四十五条）, cite: ws-1978-03-05-constitution, quote: true }
    - { voice: doc, text: 宪法修改草案中规定公民“有运用‘大鸣、大放、大辩论、大字报’的权利”，就是为了保障无产阶级领导下的大民主（叶剑英修宪报告）, cite: ws-1978-03-01-constitution-report, quote: true }
  cites: [ws-1978-03-05-constitution, ws-1978-03-01-constitution-report]

- id: 1978-04-05-rightist-caps
  date: 1978-04-05
  title: 中央决定全部摘掉右派分子帽子
  lane: center
  weight: 3
  summary: 中央统战部、公安部报告：1957 年全国划右派四十五万人，1959–1964 年分五批摘帽约三十余万，还有十万多人戴着帽子，多在农村、街道或劳教场所。中共中央 4 月 5 日批准“全部摘掉”，但通知仍称反右是“一场伟大的政治战线和思想战线上的革命”，报告也说“一般不搞甄别平反”，只对个别“完全搞错了的”改正。改正在半年后才放开。
  people: [hua-guofeng]
  voices:
    - { voice: officialLater, text: 在这场斗争中，全国划为资产阶级右派分子有四十五万人（1978 年统战部、公安部请示报告）, cite: ws-1978-04-rightist-caps-report, quote: true }
    - { voice: officialLater, text: 目前，估计全国大约还有右派分子十万多名（同一报告）, cite: ws-1978-04-rightist-caps-report, quote: true }
    - { voice: officialLater, text: 遵照中央一九六二年的规定，对于右派分子一般不摘甄别平反，只是对于其中个别确实完全搞错了的，才作为个别人的问题，实事求是地予以改正（同一报告）, cite: ws-1978-04-rightist-caps-report, quote: true }
    - { voice: officialLater, text: 一九五七年伟大领导和导师毛主席亲自发动和领导的反右派斗争，是一场伟大的政治战线和思想战线上的革命（1978 年 4 月 5 日中共中央通知）, cite: ws-1978-04-05-cc-notice, quote: true }
  cites: [ws-1978-04-rightist-caps-report, ws-1978-04-05-cc-notice]

- id: 1978-09-17-rightist-correction
  date: 1978-09-17
  title: 中发〔1978〕55 号：划错的右派“应予以改正”
  lane: center
  weight: 3
  summary: 中央批转组织、宣传、统战、公安、民政五部门的实施方案，对“过去错划了的人”予以改正，标准是 1957 年 10 月的《划分右派分子标准》。各地复查后，到 1979 年 7 月中旬改正的占所划右派总数的百分之九十；原文件里的具体人数在流传的文本中以“××”隐去。1980 年统战部复查民主人士中的右派，建议章伯钧、罗隆基、彭文应、储安平、陈仁炳五人维持原案。
  people: [hu-yaobang, zhang-bojun, luo-longji, chu-anping]
  voices:
    - { voice: officialLater, text: 有反必肃，有错必纠，这是我党的一贯方针。已经发现划错了的，尽管事隔多年，也应予以改正（中发〔1978〕55 号）, cite: ws-1978-09-17-cc-notice, quote: true }
    - { voice: officialLater, text: 至七月中旬，属于错划已经改正的有××万余人，占所划右派总数的百分之九十（1979 年五部门请示）, cite: ws-1979-rightist-followup, quote: true }
    - { voice: officialLater, text: 拟维持原案的五人：章伯钧（故）．罗隆基（故）．彭文应（故），储安平（故），陈仁炳（1980 年统战部复查报告）, cite: ws-1980-05-08-rightist-review, quote: true }
  cites: [ws-1978-09-17-cc-notice, ws-1979-rightist-followup, ws-1980-05-08-rightist-review]

- id: 1978-05-21-huang-shuai
  date: 1978-05-21
  title: 《人民日报》：黄帅日记是“一个政治骗局”
  lane: culture
  weight: 1
  place: 北京
  summary: 1973 年北京小学生黄帅给《北京日报》写信、日记摘抄被登出，“四人帮”借此掀起反“师道尊严”。1978 年 5 月《人民日报》发表调查，说这份来信和日记摘抄是“蓄意编造出来的”。黄帅本人此后考入大学。
  people: [huang-shuai, chi-qun, xie-jingyi]
  voices:
    - { voice: officialLater, text: 所谓《一个小学生的来信和日记摘抄》，完全是适应“四人帮”篡党夺权的反革命政治需要，蓄意编造出来的，是一个政治骗局（1978 年《人民日报》）, cite: rmrb-1978-05-21-huang-shuai-exposed, quote: true }
  cites: [rmrb-1978-05-21-huang-shuai-exposed]

- id: 1978-06-12-guo-moruo-death
  date: 1978-06-12
  title: 郭沫若逝世
  lane: culture
  weight: 1
  place: 北京
  summary: 中国科学院院长、全国人大常委会副委员长郭沫若病逝，邓小平致悼词。他在文革中始终在位，没有被打倒。
  people: [guo-moruo, deng-xiaoping]
  voices:
    - { voice: officialLater, text: 一九七八年六月十二日十六时五十分，郭沫若同志的心脏停止了跳动，终年八十六岁（邓小平悼词）, cite: rmrb-1978-06-19-guo-moruo, quote: true }
  cites: [rmrb-1978-06-19-guo-moruo]

- id: 1978-06-30-shi-chuanxiang
  date: 1978-06-30
  title: 掏粪工人时传祥平反
  lane: local
  weight: 1
  place: 北京崇文区
  summary: 劳动模范时传祥文革中被揪斗游街，罪状之一是 1959 年群英会上刘少奇跟他握过手、照过相，另一条是“工贼”；1975 年死去。1978 年 6 月 30 日北京市总工会等联合开会为他平反，这是较早公开报道的平反之一，比刘少奇本人的平反早两年。
  people: [shi-chuanxiang, liu-shaoqi]
  voices:
    - { voice: officialLater, text: 一是时传祥一九五九年出席全国群英会时，刘少奇跟他握过手，照了相（1978 年《人民日报》转述当年的罪状）, cite: rmrb-1978-07-06-shi-chuanxiang, quote: true }
    - { voice: officialLater, text: 今年六月三十日，北京市总工会、北京市环境卫生局和中共北京市崇文区委联合举行大会，为时传祥同志昭雪平反（1978 年《人民日报》）, cite: rmrb-1978-07-06-shi-chuanxiang, quote: true }
  cites: [rmrb-1978-07-06-shi-chuanxiang]

- id: 1978-11-26-wuhan-720-rehab
  date: 1978-11-26
  title: 中央为武汉“七·二〇事件”平反，但“不要登报和广播”
  lane: local
  weight: 2
  place: 武汉
  summary: 湖北省委、武汉军区党委报告，1967 年的“七·二〇事件”是“林彪、‘四人帮’出于篡党夺权的需要而制造的阴谋事件”，要求平反，因此受迫害、打伤打死的人一律昭雪抚恤。中央同意，但要求平反决定和事件经过“不要登报和广播”。当年因此被定为“反革命暴乱”的“百万雄师”成员和陈再道等人至此平反。
  people: [chen-zaidao, wang-li, xie-fuzhi]
  voices:
    - { voice: officialLater, text: 一致认为这个事件是林彪、“四人帮”出于篡党夺权的需要而制造的阴谋事件，完全是歪曲事实，颠倒敌我，混淆是非的，应公开宣布彻底平反（1978 年湖北省委、武汉军区党委报告）, cite: ws-1978-wuhan-720-report, quote: true }
    - { voice: officialLater, text: “七·二○事件”应予平反、昭雪，但平反昭雪的决定和“七·二○事件”经过，不要登报和广播（1978 年中共中央通知）, cite: ws-1978-11-26-wuhan-720-notice, quote: true }
  cites: [ws-1978-wuhan-720-report, ws-1978-11-26-wuhan-720-notice]

- id: 1978-11-tiananmen-rehab
  date: 1978-11-15
  end: 1978-12-22
  title: 天安门事件平反
  lane: center
  weight: 3
  place: 北京天安门广场
  summary: 1978 年 11 月中央工作会议期间，1976 年清明的悼念被正式改称革命行动。十一届三中全会公报确认，并撤销“反击右倾翻案风”和天安门事件的中央文件。1981 年决议把华国锋“拖延和阻挠”这一平反列为他的错误之一。
  people: [deng-xiaoping, hua-guofeng, wu-de, chen-yun]
  voices:
    - { voice: officialLater, text: 会议指出：一九七六年四月五日的天安门事件完全是革命行动（1978 年十一届三中全会公报）, cite: ws-1978-12-third-plenum, quote: true }
    - { voice: official1981, text: 拖延和阻挠恢复老干部工作和平反历史上冤假错案（包括“天安门事件”）的进程（1981 年历史决议评华国锋）, cite: ws-1981-resolution, quote: true }
    - { voice: foreign, text: 'The poster attacks tend to implicate Wang Tung-hsing and Chen Hsi-lien, the Peking Military Region Commander. All three were involved in the suppression of pro-Teng rioters in April 1976（1978 年 11 月 15 日奥克森伯格致布热津斯基备忘录，“三人”指吴德、汪东兴、陈锡联）', cite: frus-7780v13-d153, quote: true }
  cites: [ws-1978-12-third-plenum, ws-1981-resolution, frus-7780v13-d153]

- id: 1978-12-16-us-normalization
  topics: [hk-macau-taiwan]
  date: 1978-12-16
  title: 中美建交联合公报
  lane: intl
  weight: 3
  summary: 中美商定自 1979 年 1 月 1 日起建立外交关系，美国承认中华人民共和国政府是中国唯一合法政府，同时与台湾断交、废约、撤军，保持非官方关系。1979 年 1 月底邓小平访美。美方档案显示，公报发表前邓小平与美国驻华联络处主任伍德科克在北京连谈数次；到 12 月 15 日双方在美国继续对台售武上仍没谈拢，邓小平同意照原定日程建交，但表示如果美方公开说要继续售武，中方会公开回应。
  people: [deng-xiaoping, hua-guofeng]
  voices:
    - { voice: doc, text: 美利坚合众国政府承认中国的立场，即只有一个中国，台湾是中国的一部分（1978 年中美建交公报）, cite: ws-1978-12-15-us-normalization, quote: true }
    - { voice: foreign, text: 'Teng opted for movement rather than legalistic quibbling over details（1978 年 12 月 13 日伍德科克致华盛顿密电，评邓小平的谈判姿态）', cite: frus-7780v13-d167, quote: true }
    - { voice: foreign, text: 'We cannot agree on the arms sales question but we can agree to disagree（1978 年 12 月 15 日伍德科克密电，谈对台售武）', cite: frus-7780v13-d170, quote: true }
  cites: [ws-1978-12-15-us-normalization, frus-7780v13-d167, frus-7780v13-d170]

- id: 1979-01-01-taiwan-message
  topics: [hk-macau-taiwan]
  date: 1979-01-01
  title: 《告台湾同胞书》，停止炮击金门
  lane: intl
  weight: 2
  place: 金门
  summary: 中美建交当天，全国人大常委会发表《告台湾同胞书》，提出“通航通邮”，以和平统一取代“解放台湾”；国防部长徐向前同时宣布停止自 1958 年以来对金门等岛屿的炮击。
  people: [xu-xiangqian, ye-jianying, deng-xiaoping]
  voices:
    - { voice: doc, text: 我们希望双方尽快实现通航通邮，以利双方同胞直接接触，互通讯息，探亲访友，旅游参观，进行学术文化体育工艺观摩（1979 年《告台湾同胞书》）, cite: ws-1979-01-01-taiwan-message, quote: true }
    - { voice: doc, text: 我已命令福建前线部队，从今日起停止对大金门、小金门、大担、二担等岛屿的炮击（1979 年徐向前声明）, cite: ws-1979-01-01-stop-shelling, quote: true }
  cites: [ws-1979-01-01-taiwan-message, ws-1979-01-01-stop-shelling]

- id: 1979-01-landlord-caps
  date: 1979-01
  title: 地主富农“一律摘掉帽子”，子女成份改为“社员”
  lane: center
  weight: 3
  summary: 中发〔1979〕5 号：除极少数外，地主、富农、反革命、坏分子经群众评审、县革委会批准一律摘帽；地富家庭出身的人本人成份一律定为公社社员，子女的家庭出身也不再算地富。据公安部党组后来统计，决定发出前全国有“四类分子”六百一十四万余人；到 1982 年底还剩八万余人没摘帽，此后一律摘掉，从此“不再采用戴帽子的处理办法”。三十年的出身等级在文件上就此取消。
  concepts: [bloodline, class-struggle]
  voices:
    - { voice: officialLater, text: 凡是多年来遵守政府法令、老实劳动、不做坏事的地主富农分子以及反革命分子、坏分子，经过群众评审，县革命委员会批准，一律摘掉帽子，给予农村人民公社社员的待遇（中发〔1979〕5 号）, cite: ws-1979-01-landlord-caps, quote: true }
    - { voice: officialLater, text: '在中央一九七九年一月作出《关于地主、富农分子摘帽问题和地、富子女成份问题的决定》（中发[1979]5号文件）之前，全国共有地富反坏分子六百一十四万余名（公安部党组报告）', cite: ws-1983-four-classes-caps, quote: true }
    - { voice: officialLater, text: 今后，应根据宪法精神，依法办事，这部分人如有违法犯罪的，一律依法论处，不再采用戴帽子的处理办法（同一报告）, cite: ws-1983-four-classes-caps, quote: true }
  cites: [ws-1979-01-landlord-caps, ws-1983-four-classes-caps]

- id: 1979-02-gz-january-seizure
  date: 1979-02-15
  title: 中央否定贵州“一·二五夺权”
  lane: local
  weight: 1
  place: 贵阳
  summary: 1967 年 1 月 25 日李再含等人在贵州夺权，被《人民日报》誉为“西南的春雷”，贵州成为最早成立革委会的省份之一。1979 年中央批示，这次夺权“中央没有正式文件批准”，是“向无产阶级夺权”，此后全省各地的夺权“也是错误的”。夺权骨干孙昌德、徐英年 1982 年被起诉。
  voices:
    - { voice: officialLater, text: 经查，1967年，贵州“一·二五夺权事件”，中央没有正式文件批准（1979 年中共中央批示）, cite: ccrd-1979-gz-jan-seizure, quote: true }
    - { voice: officialLater, text: 在这之后，全省各地区、各单位的夺权也是错误的。所谓“西南的春雷”应予以根本否定（同一批示）, cite: ccrd-1979-gz-jan-seizure, quote: true }
  cites: [ccrd-1979-gz-jan-seizure]

- id: 1979-02-17-vietnam-war
  topics: [global]
  date: 1979-02-17
  end: 1979-03-16
  title: 对越“自卫还击”
  lane: army
  weight: 2
  place: 中越边境
  summary: 解放军从广西、云南两路攻入越南北部，攻占谅山等地后于 3 月撤回。政府工作报告称之为“被迫进行了有节制的自卫还击”，同一报告号召学习“自卫还击战英雄们”。库内没有官方伤亡数字。美方档案显示，邓小平 1 月 30 日访美时已在白宫单独向卡特说明要“教训”越南、行动“十到二十天”后撤出，卡特则念了美方立场，说孤立越南是更好的惩罚；2 月 15 日开战前两天，中方又以邓小平口信正式通知美方。
  people: [deng-xiaoping, xu-shiyou]
  voices:
    - { voice: officialLater, text: 我们在忍无可忍的情况下，被迫进行了有节制的自卫还击（1979 年政府工作报告）, cite: ws-1979-06-18-gov-report, quote: true }
    - { voice: foreign, text: 'The relationship between Peking and Hanoi already has moved into a new and probably protracted stage of open political warfare and heightened military tensions（1978 年 6 月美国中央情报局评估）', cite: frus-7780v13-d125, quote: true }
    - { voice: foreign, text: 'China must still teach Vietnam a lesson（1979 年 1 月 30 日卡特转述与邓小平的单独会谈）', cite: frus-7780v13-d207, quote: true }
    - { voice: foreign, text: 'The action will be quick, lasting 10–20 days, to be followed by withdrawal（同一记录）', cite: frus-7780v13-d207, quote: true }
    - { voice: foreign, text: 'We are forced to make the decision to take necessary self-defense operations against Vietnam（2 月 15 日邓小平致卡特口信，美方档案中的英文本）', cite: frus-7780v13-d212, quote: true }
  cites: [ws-1979-06-18-gov-report, frus-7780v13-d125, frus-7780v13-d207, frus-7780v13-d212]

- id: 1979-06-second-npc-adjustment
  date: 1979-06-18
  end: 1979-07-01
  title: 五届人大二次会议：“调整、改革、整顿、提高”
  lane: econ
  weight: 2
  place: 北京
  summary: 华国锋在政府工作报告里承认比例严重失调、百分之二十四的国营工业企业亏损，提出用三年时间调整国民经济，收缩一年前的十年规划。三个月前，陈云 3 月 21 日在政治局会议上已说比例失调“相当严重”，“要有两三年调整时间，最好三年”。会议通过刑法、刑事诉讼法等七个法律。
  people: [hua-guofeng, chen-yun, li-xiannian, peng-zhen]
  voices:
    - { voice: doc, text: 现在比例失调的情况相当严重。基本建设项目大的一千七百多个，小的几万个。赶快下决心，搞不了的，丢掉一批就是了（1979 年 3 月 21 日陈云在政治局会议上的讲话）, cite: reformdata-1979-chen-yun-adjustment, quote: true }
    - { voice: officialLater, text: 从今年起集中三年的时间，认真搞好国民经济的调整、改革、整顿、提高，把它逐步纳入持久的按比例的高速度发展的轨道（1979 年政府工作报告）, cite: ws-1979-06-18-gov-report, quote: true }
    - { voice: officialLater, text: 有百分之二十四的国营工业企业存在着程度不同的亏损（同一报告）, cite: ws-1979-06-18-gov-report, quote: true }
    - { voice: officialLater, text: 五届人大二次会议通过的七个法律的实施，对于发挥全国人民的社会主义积极性，打击刑事犯罪，维护人民利益，保障现代化建设的顺利进行，正在发挥重要作用（1980 年华国锋讲话）, cite: ws-1980-09-07-hua-npc-speech, quote: true }
  cites: [ws-1979-06-18-gov-report, ws-1980-09-07-hua-npc-speech, reformdata-1979-chen-yun-adjustment]

- id: 1979-yu-luoke-acquittal
  date: 1979
  title: 遇罗克改判无罪
  lane: center
  weight: 2
  place: 北京
  summary: 遇罗克因《出身论》被捕，1970 年被北京市公检法军管会以“现行反革命”判处死刑立即执行。1978 年 11 月起他的父亲遇崇基多次申诉，法院再审认定原判“从认定的事实和适用法律上都是错误的”，撤销原判，宣告无罪。判决书页面未载日期，通行说法是 1979 年；《中学文革报》的创办人牟志京回忆时则说平反在 1980 年。
  people: [yu-luoke, yu-luowen]
  concepts: [bloodline]
  voices:
    - { voice: judicial1980, text: 原判以遇罗克犯反革命罪，判处死刑，从认定的事实和适用法律上都是错误的，应予纠正（遇罗克再审判决）, cite: ws-1979-yu-luoke-acquittal, quote: true }
    - { voice: witness, text: 十三年后的1980年，在遇罗克平反的前夕，我再度召集部分成员相聚时，却从不少人嘴里听到了对当时的冒失的烦恼（牟志京 1999 年回忆《中学文革报》）, cite: mou-zhijing-chushenlun, quote: true }
  cites: [ws-1979-yu-luoke-acquittal, mou-zhijing-chushenlun]

- id: 1979-liu-wenhui-acquittal
  date: 1979
  title: 刘文辉改判无罪
  lane: local
  weight: 1
  place: 上海
  summary: 上海工人刘文辉在文革初期写了“十六条”传单，由弟弟寄往全国十四所大中院校，1967 年 3 月以反革命罪被枪决。家属申诉，1979 年 3 月 17 日上海市高级人民法院仍裁定驳回；继续申诉后，高院才撤销原判，认定“错判错杀”，宣告无罪。判决书上未见改判日期。
  people: [liu-wenhui]
  voices:
    - { voice: judicial1980, text: '因此原判对刘文辉以反革命罪判处死刑,立即执行属于错判错杀,应予平反纠正（上海市高级人民法院改判判决）', cite: ws-1980-liu-wenhui-rehab, quote: true }
  cites: [ws-1980-liu-wenhui-rehab]

- id: 1979-12-zhang-qinli-sentenced
  date: 1979-12-24
  title: 兰考张钦礼被判刑十三年
  lane: local
  weight: 1
  place: 河南兰考
  summary: 张钦礼 1967 年 1 月在兰考夺权，任县革委会主任，把兰考的派性斗争说成“砍还是树焦裕禄红旗”。商丘地区中级人民法院以反革命罪判他有期徒刑十三年，刑期自 1978 年 11 月 16 日起算。这是两案之外各地审判本地文革掌权者的一例。
  voices:
    - { voice: judicial1980, text: 被告张钦礼在文化大革命中，积极追随林彪、“四人帮”，在兰考大搞拉帮结派，包庇重用坏人；颠倒敌我关系，倒转矛头，颠覆无产阶级专政（1979 年商丘地区中级人民法院判决）, cite: ws-1979-shangqiu-judgment, quote: true }
  cites: [ws-1979-shangqiu-judgment]

- id: 1979-12-hua-linsen-sentenced
  date: 1979-12-28
  title: 苏州华林森以反革命罪被判刑
  lane: local
  weight: 1
  place: 苏州
  summary: 工人出身的华林森文革中任苏州市革委会副主任、江苏省革委会副主任，1967 年 1 月为首夺了苏州市委、市人委的权。苏州市中级人民法院以反革命罪判刑。各地在两案之前已开始审判本地的造反派头头。
  voices:
    - { voice: judicial1980, text: 被告华林森在“文化革命”初期，就与汪永珠、邹学祺、赵宝康等结成帮派。一九六七年一月，为首策划、组织夺了苏州市委、市人委的大权（1979 年苏州市中级人民法院判决）, cite: ws-1979-hua-linsen-case, quote: true }
  cites: [ws-1979-hua-linsen-case]

- id: 1979-xu-guangda-memorial
  date: 1979-07-09
  title: 《人民日报》纪念许光达
  lane: army
  weight: 1
  summary: 大将许光达 1969 年在关押中死去，他被列为贺龙“二月兵变”冤案的第二号人物。1979 年《人民日报》发表长文纪念，是贺龙冤案平反前后军队系统的一批公开纪念之一。
  people: [xu-guangda, he-long]
  voices:
    - { voice: officialLater, text: 当时，他在这些野心家和阴谋家捏造的贺龙同志“二月兵变”“篡军反党”这一大冤案中被列为第二号人物（1979 年《人民日报》）, cite: rmrb-1979-07-09-xu-guangda, quote: true }
  cites: [rmrb-1979-07-09-xu-guangda]

- id: 1979-old-cc-files
  date: 1979
  title: 旧的中央文件“自然失效”
  lane: center
  weight: 1
  summary: 三中全会后撤销了一批文革中的中央文件，但数量太多。中央通知：凡与新文件矛盾的旧文件“自然失效”，不再一一宣布撤销；各地的历史遗留问题按三中全会精神重新作结论。这使大批文革文件在没有逐件清理的情况下退出效力。
  voices:
    - { voice: officialLater, text: 中央过去所发文件的内容、提法和决定，同中央新发文件的内容、提法和决定相矛盾、相抵触的，一律应以新的文件为准，旧的文件或其中的有关部分自然失效，除少数特殊情况外，不必再一一宣布撤销（1979 年中共中央通知）, cite: ws-1979-old-cc-files-notice, quote: true }
  cites: [ws-1979-old-cc-files-notice]

- id: 1979-kmt-defectors-policy
  topics: [hk-macau-taiwan]
  date: 1979
  title: 落实原国民党起义投诚人员政策：全国五十余万人，约十余万需安置
  lane: center
  weight: 1
  summary: 中发〔1979〕6 号文件下达半年多后，落实起义投诚人员政策领导小组发出说明：初步查明全国还有五十余万名原国民党起义投诚人员，其中需要落实政策、安置工作或生活的约十余万人。说明随后逐条界定各类人员的政策界限。
  voices:
    - { voice: doc, text: 初步查明，现在全国还有五十余万名原国民党起义投诚人员，其中按照中央6号文件的精神，需要落实政策安置工作或做其他生活安置的约十余万人, cite: ws-kmt-defectors-policy, quote: true }
  cites: [ws-kmt-defectors-policy]

- id: 1977-10-06-college-admissions
  date: 1977-10-06
  title: 教育部招生意见：恢复高校统一考试
  lane: culture
  weight: 3
  summary: 教育部关于 1977 年高校招生工作的意见（国务院 10 月批转）宣布实行“自愿报名，统一考试，地市初选，学校录取，省、市、自治区批准”的办法，取代 1970 年以来的推荐入学。报名对象包括工人、农民、上山下乡和回乡知识青年、复员军人、干部和应届高中毕业生，年龄不超过二十五周岁、未婚，有专长者放宽到三十岁、婚否不限，并要求注意招收 1966、1967 两届高中毕业生。意见仍以“英明领袖华主席”和毛主席的旗帜开篇，把招生质量下降归于“四人帮”，点名张铁生是“交‘白卷’的假典型”。
  voices:
    - { voice: doc, text: 实行自愿报名，统一考试，地市初选，学校录取，省、市、自治区批准的办法, cite: ws-1977-10-college-admissions, quote: true }
    - { voice: doc, text: 要注意招收一九六六、一九六七两届高中毕业生, cite: ws-1977-10-college-admissions, quote: true }
    - { voice: doc, text: 他们把交“白卷”的假典型、反革命小丑张铁生树为样板，反对无产阶级选拔学生的标准，反对招生进行文化考查, cite: ws-1977-10-college-admissions, quote: true }
  cites: [ws-1977-10-college-admissions]

- id: 1979-01-17-kmt-notice-6
  topics: [hk-macau-taiwan]
  date: 1979-01-17
  title: 中发〔1979〕6 号：国民党起义投诚人员“一律摘掉”历史反革命帽子
  lane: center
  weight: 2
  summary: 中共中央转发统战部、调查部、最高法院、公安部、民政部、总政治部的请示报告。报告说林彪、“四人帮”期间对起义投诚人员强加“假起义、真潜伏”等罪名，有的被害致死、受刑致残，不少人被戴上历史反革命分子帽子，判刑、关押、劳改、管制或开除公职、强令回乡，家属子女受株连。报告规定帽子一律摘掉、撤销原判、释放被关押者；文革期间被开除公职的补发工资，文革前处理的不补发；文革中查抄的财物退还。中央通知把这项工作与“台湾归回祖国”联系起来。
  voices:
    - { voice: officialLater, text: 对起义、投诚人员强加以“假起义、真潜伏”等罪名，制造了许多冤案、假案、错案, cite: ws-1979-01-17-cc-notice-6, quote: true }
    - { voice: officialLater, text: 凡因历史问题或主要因历史问题而被戴上历史反革命分子帽子或其他帽子的，一律摘掉, cite: ws-1979-01-17-cc-notice-6, quote: true }
    - { voice: officialLater, text: 文化大革命前处理的，不补发工资，其中生活特别困难的，应给予必要的补助。文化大革命期间处理的，补发工资, cite: ws-1979-01-17-cc-notice-6, quote: true }
  cites: [ws-1979-01-17-cc-notice-6]

- id: 1979-07-01-criminal-law
  date: 1979-07-01
  title: 《刑法》通过：分则第一章“反革命罪”，禁止用大字报侮辱诽谤
  lane: center
  weight: 2
  summary: 五届人大二次会议通过《中华人民共和国刑法》，自 1980 年 1 月 1 日起生效。分则第一章是“反革命罪”，第一百零二条把“以反革命为目的”煽动抗拒法律实施、以标语传单宣传煽动推翻无产阶级专政政权列为犯罪。同时，第一百三十八条“严禁用任何方法、手段诬告陷害干部、群众”，第一百四十五条把用“大字报”“小字报”公然侮辱、诽谤他人列为犯罪。
  voices:
    - { voice: doc, text: 严禁用任何方法、手段诬告陷害干部、群众, cite: ws-1979-07-01-criminal-law, quote: true }
    - { voice: doc, text: 以暴力或者其他方法，包括用＂大字报＂、＂小字报＂，公然侮辱他人或者捏造事实诽谤他人, cite: ws-1979-07-01-criminal-law, quote: true }
    - { voice: doc, text: 以反革命为目的，进行下列行为之一的, cite: ws-1979-07-01-criminal-law, quote: true }
  cites: [ws-1979-07-01-criminal-law]

- id: 1977-04-wang-shenyou-executed
  date: 1977-04
  title: 王申酉在上海公审后被枪决
  lane: local
  weight: 2
  place: 上海卢湾区体育馆
  summary: 华东师范大学物理系学生王申酉 1976 年 9 月因写给女友的长信再次入狱，在狱中写下六万字的“自供状”，否定反右、反右倾和文化大革命，主张充分发展商品经济、开展对外贸易。1977 年春，上海市革委会决定在“五一”前公审镇压一批反革命分子；区法院判他“死缓”，市法院院长怕被认为“右倾”，改为“死刑，立即执行”，市革委会领导一天内同意了 56 个死刑判决。4 月中旬他在卢湾区体育馆三万人的公审大会上第一次听到判决，随即枪决，时年 31 岁。后来上海市委常委为他的平反开了 19 次会；记者写成的长篇通讯因“牵涉到中央领导同志”没有发表。
  people: [wang-shenyou, su-zhenhua, hua-guofeng]
  voices:
    - { voice: witness, text: 上海市革委会领导在一天内听取并同意了56个死刑判决案，平均每6分钟通过一个死刑案，王申酉不幸名在其中（金凤据采访和案卷所记，2001 年发表）, cite: ywang-wang-shenyou, quote: true }
    - { voice: witness, text: 他第一次听到判决书，来不及申辩一个字，立即押赴刑场枪决，年仅31岁（同上）, cite: ywang-wang-shenyou, quote: true }
    - { voice: officialLater, text: 第三种意见认为王申酉应平反，但也不宜评价过高，他是勤奋学习热爱祖国的好青年（上海市委书记陈国栋向记者转述，市委采纳了这种意见）, cite: ywang-wang-shenyou, quote: true }
    - { voice: officialLater, text: 总之，文章虽好，还是不宜发表（中宣部领导对金凤通讯的意见，同上）, cite: ywang-wang-shenyou, quote: true }
    - { voice: scholar, text: 王、李案件的最终判决，都同五号、六号和三十号文件有关（韩钢 2008 年，指 1977 年中央“打击政治谣言”等文件和国务院三十号文件）, cite: aisixiang-2008-han-gang-hua-guofeng, quote: true }
  cites: [ywang-wang-shenyou, aisixiang-2008-han-gang-hua-guofeng]

- id: 1977-11-01-li-qinglin-arrested
  date: 1977-11-01
  title: 李庆霖被捕，后判无期徒刑
  lane: local
  weight: 1
  place: 福建莆田
  summary: 福建莆田小学教师李庆霖 1972 年写信给毛泽东反映下乡知青“无米之炊”，1973 年得到毛泽东复信和三百元，由此成名，1975 年任四届人大常委，1976 年 6 月成为国务院知青工作领导小组成员。粉碎“四人帮”后他被视为“四人帮”的“小爬虫”，1976 年 11 月隔离审查，1977 年 11 月 1 日正式逮捕；一年多以后莆田地区中级人民法院以“现行反革命罪”判处他无期徒刑，剥夺政治权利终身。1994 年 3 月提前出狱。
  people: [li-qinglin]
  voices:
    - { voice: witness, text: 自失去自由，直至获释出狱生还家门，历时17个春秋，如此漫长的岁月，不堪回首！（李庆霖出狱后，《名人传记》2007 年引述）, cite: jwb-2007-li-qinglin, quote: true }
    - { voice: editor, text: 判决书库内没有，罪名和刑期只见于这篇 2007 年的传记文章；文章说他自己“怎么也弄不明白”为什么会被视为“四人帮”的亲信。, cite: jwb-2007-li-qinglin }
  cites: [jwb-2007-li-qinglin]

- id: 1977-12-li-jiulian-executed
  date: 1977-12
  end: 1978-04-30
  title: 李九莲、钟海源在江西先后被处决
  lane: local
  weight: 1
  place: 江西
  summary: 李九莲 1969 年因怀疑文革、怀疑林彪、为刘少奇鸣冤被捕，林彪倒台后获释，结论仍是“现行反革命性质”；1974 年贴出《反林彪无罪》等大字报再次被捕，判刑十五年。1976 年 12 月她在狱中写《我的政治态度》，被定为“恶毒攻击英明领袖华主席”，1977 年 12 月被处决。为她散发传单的钟海源在狱中说“华国锋不如邓小平”，四个月后的 1978 年 4 月 30 日也被处决。两人 1980 年在胡耀邦支持下平反。
  people: [li-jiulian, zhong-haiyuan, hua-guofeng, hu-yaobang]
  voices:
    - { voice: scholar, text: 1976年12月，李九莲在狱中写下了《我的政治态度》，后还当众念出，犯了“恶毒攻击英明领袖华主席”的死罪（何与怀 2024 年《血祭》）, cite: hyh-2024-blood-sacrifice-4, quote: true }
    - { voice: scholar, text: 李九莲被杀四个月后，钟海源也被判处死刑，立即执行（同上）, cite: hyh-2024-blood-sacrifice-4, quote: true }
    - { voice: editor, text: 两人最后的死罪都和华国锋有关，处决都在文革结束一年以后。何与怀记李九莲处决于 1977 年 12 月 24 日，其他记载不一，本站只记到月份。, cite: hyh-2024-blood-sacrifice-4 }
  cites: [hyh-2024-blood-sacrifice-4]

- id: 1979-03-31-zhang-zhixin-rehab
  date: 1979-03-31
  title: 辽宁省委为张志新平反，追认为烈士
  lane: local
  weight: 2
  place: 辽宁沈阳
  summary: 张志新 1975 年 4 月 4 日在沈阳被枪决。1979 年 1 月案情在辽宁省委扩大会议上被揭露，省委第一书记任仲夷要求清查；3 月 31 日省委召开平反昭雪大会，追认她为革命烈士。平反定调为“张志新是反对林彪、‘四人帮’”，她批评毛泽东的言论被笼统地归为神志不清时所讲；任仲夷没有为此请示中央。4 月 5 日《辽宁日报》发表长篇通讯，胡耀邦说她是“刘胡兰式的英雄人物”，5 月 25 日《人民日报》转载，6 月 11 日摘登她的狱中答辩。
  people: [zhang-zhixin, ren-zhongyi, hu-yaobang, hua-guofeng]
  voices:
    - { voice: doc, text: 我认为自己没有错，没有和广大人民为敌，而是和他们出自一个心愿（张志新 1969 年狱中答辩，《人民日报》1979 年 6 月 11 日摘登）, cite: rmrb-1979-06-11-zhang-zhixin, quote: true }
    - { voice: officialLater, text: 宣读了《关于为张志新同志彻底平反昭雪，追认她为革命烈士的决定》，宣布为她恢复名誉，恢复党籍，追认为革命烈士（2014 年《任仲夷画传》摘编）, cite: people-2014-ren-zhongyi-zhang-zhixin, quote: true }
    - { voice: officialLater, text: 将张志新批评毛主席的言论笼统地列入神志不清时所讲（同上）, cite: people-2014-ren-zhongyi-zhang-zhixin, quote: true }
    - { voice: scholar, text: 特别是，她指明毛泽东是文革灾难的“总头子”（何与怀 2024 年《血祭》）, cite: hyh-2024-blood-sacrifice-4, quote: true }
  cites: [people-2014-ren-zhongyi-zhang-zhixin, rmrb-1979-06-11-zhang-zhixin, hyh-2024-blood-sacrifice-4]
