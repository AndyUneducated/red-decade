  summary: 国务院戒严令自 5 月 20 日 10 时生效后，北京市政府发布三道命令：城区八个区戒严，严禁游行、请愿、罢课、罢工，严禁“串联、演讲、散发传单”，执勤人员“有权采取一切手段，强行处置”；外国人不准介入；严禁中外记者“进行挑唆、煽动性宣传报道”。禁止条款里用的“串联”“打、砸、抢”，都是 1966–1968 年的旧词。
  people: [li-peng]
  concepts: [mass-democracy]
  voices:
    - { voice: doc, text: 在戒严期间，严禁游行、请愿罢课、罢工和其他聚众妨害正常秩序的活动（北京市人民政府令第一号第二条）, cite: ws-1989-05-20-martial-law-orders, quote: true }
    - { voice: doc, text: 在戒严期间，发生上述应予禁止的活动，公安干警、武警部队和人民解放军执勤人员有权采取一切手段，强行处置（同一命令第六条）, cite: ws-1989-05-20-martial-law-orders, quote: true }
    - { voice: doc, text: 严禁中外记者利用采访，进行挑唆、煽动性宣传报道（北京市人民政府关于记者采访的命令）, cite: ws-1989-05-20-martial-law-orders, quote: true }
  cites: [ws-1989-05-20-martial-law-orders]

