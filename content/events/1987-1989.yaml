  lane: ideology
  weight: 3
  place: 北京
  summary: 赵紫阳在十三大报告中提出中国“正处在社会主义的初级阶段”，以此论证商品经济、多种所有制和对外开放，并把党的基本路线概括为“一个中心、两个基本点”，即“以经济建设为中心，坚持四项基本原则，坚持改革开放”。
