- id: 1988-04-12-constitution-amendment
  date: 1988-04-12
  title: 宪法修正案：允许私营经济，土地使用权可以转让
  lane: econ
  weight: 2
  summary: 七届人大一次会议通过宪法修正案两条：第十一条增加“国家允许私营经济在法律规定的范围内存在和发展”，称其为社会主义公有制经济的补充；第十条中“不得侵占、买卖、出租”土地的规定改为不得非法转让，土地的使用权可以依法转让。
  voices:
    - { voice: doc, text: 国家允许私营经济在法律规定的范围内存在和发展, cite: ws-1988-04-12-constitution-amendment, quote: true }
    - { voice: doc, text: 土地的使用权可以依照法律的规定转让, cite: ws-1988-04-12-constitution-amendment, quote: true }
  cites: [ws-1988-04-12-constitution-amendment]

- id: 1988-cr-books-rules
  date: 1988
  title: 中宣部、新闻出版署：出版“文革”图书的若干规定
  lane: culture
  weight: 3
  summary: 规定称一些出版社以“文革”期间的“轶事”“秘闻”“内幕”招徕读者，援引“团结一致向前看，历史问题宜粗不宜细”的一贯精神，宣布相当时期内不考虑出版《文革辞典》。九条规定：“文革”辞典等工具书一律不得安排；专门研究或叙述“文革”历史的著作一般不安排，个别选题须层报中宣部审批；回忆录不得违背 1981 年《历史决议》精神，不得使用中央未公开的材料，不得涉及党和国家领导人个人品德；违反者没收利润、罚款、追究领导责任。
  voices:
    - { voice: officialLater, text: 根据中央团结一致向前看，历史问题宜粗不宜细的一贯精神, cite: ws-1988-cr-books-rules, quote: true }
    - { voice: officialLater, text: 有关“文化大革命”的辞典等工具书，今后相当时期内，各出版社均不得安排, cite: ws-1988-cr-books-rules, quote: true }
    - { voice: officialLater, text: 不得随意使用中央未正式公开的历史材料，不得随意涉及党和国家领导人个人品德问题, cite: ws-1988-cr-books-rules, quote: true }
  cites: [ws-1988-cr-books-rules]

