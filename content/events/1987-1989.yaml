  concepts: [continuous-revolution]
  voices:
    - { voice: doc, text: 对这个问题，我们党已经有了明确的回答：我国正处在社会主义的初级阶段（1987 年十三大报告）, cite: ws-1987-10-25-thirteenth-congress-report, quote: true }
    - { voice: doc, text: 在党的思想建设中，必须全面宣传党的基本路线，牢牢掌握一个中心、两个基本点（同一报告）, cite: ws-1987-10-25-thirteenth-congress-report, quote: true }
  cites: [ws-1987-10-25-thirteenth-congress-report]

