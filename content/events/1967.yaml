- id: 1967-11-24-countryside
  date: 1967-11-24
  title: 两报一刊批判刘少奇的“农村修正主义路线”
  lane: econ
  weight: 1
  summary: 编辑部文章《中国农村两条道路的斗争》把 1949 年以来农村政策的分歧都归到刘少奇名下：困难时期的“三自一包”（自由市场、自留地、自负盈亏、包产到户）被说成“瓦解人民公社”的“黑风”；“党内另一个最大的走资派”邓小平主持的“后十条”和王光美的“桃园经验”被说成“形‘左’实右”。各地农村据此批判自留地、集市贸易和“包产到户”。
  people: [liu-shaoqi, deng-xiaoping, wang-guangmei]
  concepts: [two-lines, khrushchev]
  voices:
    - { voice: official1966, text: 在他的煽动下，我国农村刮起了一股“三自一包”（自由市场、自留地、自负盈亏、包产到户）的黑风。（1967 年 11 月编辑部文章）, cite: ws-1967-11-24-countryside, quote: true }
    - { voice: editor, text: 文中被批为“黑风”的包产到户，1977 年后在万里主政的安徽肥西、凤阳等地重新推行，官方后来称之为农村改革的开端。, cite: people-2015-07-23-wan-li }
  cites: [ws-1967-11-24-countryside, ws-1967-taoyuan-survey, people-2015-07-23-wan-li]

