# ── 夏季：揪刘、武汉、“揪军内一小撮” ───────────────────────────
- id: 1967-07-18-liu-struggle
  date: 1967-07-18
  title: 中南海批斗刘少奇、王光美，“揪刘火线”围困中南海
  lane: center
  weight: 3
  place: 北京中南海
  summary: 7 月起北京数十万群众在中南海西门外搭起“揪刘火线”，要求揪出刘少奇。7 月 18 日戚本禹在中南海内组织批斗刘少奇、王光美并抄家，8 月 5 日又在中南海举行批斗大会，刘少奇被拳打脚踢。此后刘少奇被单独关押，与家人隔离。
  people: [liu-shaoqi, wang-guangmei, qi-benyu, jiang-qing, kang-sheng, chen-boda, xie-fuzhi]
  voices:
    - { voice: judicial1980, text: 一九六七年七月，江青、康生、陈伯达擅自决定批斗刘少奇，并由“中央文革小组”成员戚本禹于一九六七年七月十八日组织召开“批斗刘少奇大会”，进行抄家，对刘少奇、王光美进行人身迫害（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 一九六七年七、八月间，康生、谢富治、戚本禹等煽动组织“揪刘火线”围困中南海，冲击国务院（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment, ws-1967-07-09-liu-jiangong-review]

- id: 1967-07-20-wuhan
  date: 1967-07-20
  title: 武汉“七二〇事件”
  lane: army
  weight: 3
  place: 武汉东湖宾馆
  summary: 毛泽东到武汉处理“百万雄师”与“工总”的对立，谢富治、王力宣布武汉军区支左方向错误。7 月 20 日凌晨“百万雄师”和部分军人冲进东湖宾馆，揪走王力殴打。毛泽东当天转移上海；王力、谢富治 22 日回京受到盛大欢迎。中央 7 月 26 日的信称这是“叛变行动”，陈再道、钟汉华撤职，“百万雄师”被打成反革命，湖北此后据统计有十八万余人被打伤打残、六百多人死亡。
  people: [chen-zaidao, zhong-hanhua, wang-li, xie-fuzhi, mao-zedong, zhou-enlai, wang-renzhong]
  voices:
    - { voice: official1966, text: 这是明目张胆地反对我们的伟大的领袖毛主席、反对毛主席的无产阶级革命路线、反对党中央、反对中央军委、反对中央文革小组的叛变行动（1967 年 7 月中央致武汉的信）, cite: ws-1967-07-26-wuhan-notice, quote: true }
    - { voice: editor, text: 同一份中央文件把武汉军区的支左称为“方向、路线错误”，又说“王任重和陈再道则是上述事件的罪魁祸首”——王任重这时已在北京被打倒，并不在武汉。1978 年中央为此事平反。, cite: ws-1967-07-26-wuhan-notice }
  cites: [ws-1967-07-26-wuhan-notice]
  verify: true

- id: 1967-08-01-army-handful
  date: 1967-08-01
  title: 《红旗》社论：“揪军内一小撮”
  lane: army
  weight: 3
  summary: 建军节社论《无产阶级必须牢牢掌握枪杆子》说，“也要把军内一小撮走资本主义道路当权派揭露出来，从政治上和思想上把他们斗倒、斗臭”。各地造反派据此冲击军区、抢夺枪支，全面武斗进入高峰。毛泽东随即批示这一口号不妥，8 月底王力、关锋被隔离审查。
  people: [wang-li, guan-feng, lin-biao, mao-zedong]
  voices:
    - { voice: official1966, text: 同样，也要把军内一小撮走资本主义道路当权派揭露出来，从政治上和思想上把他们斗倒、斗臭（1967 年 8 月 1 日《红旗》社论）, cite: ws-1967-08-01-gun, quote: true }
    - { voice: judicial1980, text: 一九六七年一月，林彪亲笔批示“完全同意”“中央文革小组”成员关锋、王力等提出的“彻底揭穿军内一小撮走资本主义道路的当权派”的口号，阴谋搞乱军队（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1967-08-01-gun, ws-1980-indictment, ws-1967-08-20-pla-pillar]

- id: 1967-08-04-shanghai-diesel
  date: 1967-08-04
  title: 王洪文攻打“上柴联司”
  lane: mass
  weight: 2
  place: 上海柴油机厂
  summary: 上海柴油机厂“联司”反对工总司和张春桥，王洪文调集数万人围攻工厂。起诉书说这次武斗“关押、打伤六百五十人”。此后上海再没有能与工总司抗衡的群众组织，王洪文的地位因此上升。
  people: [wang-hongwen, zhang-chunqiao]
  voices:
    - { voice: judicial1980, text: 一九六七年八月四日，王洪文策划、指挥了围攻“上海柴油机厂革命造反联合司令部”群众组织的武斗事件，关押、打伤六百五十人（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-08-07-wang-li-speech
  date: 1967-08-07
  title: 王力“八七讲话”，外交部被夺权
  lane: intl
  weight: 2
  summary: 王力接见外交部造反派，说“揪陈毅大方向当然对”，鼓动夺外交部的权。外交部造反派一度封闭部党委，以外交部名义发电报，驻外使馆贴大字报、与驻在国冲突，与几十个国家的关系紧张。
  people: [wang-li, chen-yi, zhou-enlai, ji-pengfei, qiao-guanhua]
  voices:
    - { voice: judicial1980, text: 一九六七年八月七日，“中央文革小组”成员王力说：“揪陈毅大方向当然对”，“打倒刘、邓、陈的口号为什么不能喊”？！煽动篡夺外交领导权（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-08-22-british-office
  date: 1967-08-22
  title: 火烧英国驻华代办处
  lane: intl
  weight: 3
  place: 北京
  summary: 香港“反英抗暴”中港英当局查封左派报纸、逮捕记者，外交部 8 月 20 日照会限英方 48 小时内撤销禁令。期满当晚，上万群众冲入英国代办处纵火，殴打代办霍普森等外交官；同时伦敦中国代办处人员与英国警察冲突。周恩来连夜处理，事后毛泽东把责任归于王力，王力、关锋随即倒台。
  people: [zhou-enlai, wang-li, guan-feng, chen-yi]
  verify: true

- id: 1967-08-30-wang-guan-fall
  date: 1967-08-30
  end: 1968-01-13
  title: 王力、关锋、戚本禹相继倒台
  lane: center
  weight: 3
  summary: 8 月 26 日毛泽东在上海对杨成武说“王、关、戚是破坏文化大革命的，不是好人”，要求先把王力、关锋抓起来。8 月 30 日两人被隔离审查，戚本禹 1968 年 1 月被关押。三人被当作“五一六反革命集团”的后台，此后中央文革小组只剩陈伯达、江青、康生、张春桥、姚文元。
  people: [wang-li, guan-feng, qi-benyu, mao-zedong, yang-chengwu, jiang-qing, chen-boda]
  verify: true

- id: 1967-08-renegade-group
  date: 1967-08-09
  title: “六十一人叛徒集团”案公开
  lane: center
  weight: 2
  summary: 报刊文章说“揭出了一个潜伏在党内的、多至几十个人的大叛徒集团”，总头子“正是中国的赫鲁晓夫”：1936 年薄一波、安子文、杨献珍等人经中央同意履行手续出狱，这时被定为叛变，刘少奇被说成主使。1978 年中央为此案平反。
  people: [bo-yibo, an-ziwen, yang-xianzhen, liu-shaoqi, kang-sheng]
  concepts: [khrushchev]
  voices:
    - { voice: official1966, text: 轰然一声，革命的红卫兵小将和广大无产阶级革命派揭出了一个潜伏在党内的、多至几十个人的大叛徒集团（1967 年 8 月报刊文章）, cite: ws-1967-08-09-renegades, quote: true }
  cites: [ws-1967-08-09-renegades]

- id: 1967-08-qinghai-revcom
  date: 1967-08-12
  title: 青海省革命委员会成立
  lane: local
  weight: 1
  summary: 2 月 23 日青海省军区副司令员赵永夫下令开枪镇压“八·一八”，打死百余人。军委十条命令后赵永夫被逮捕，“八·一八”平反。8 月青海以“八·一八”为核心成立革委会，刘贤权任主任。
  people: []
  cites: [ws-1967-08-13-qinghai]
  verify: true

# ── 秋冬：毛泽东南巡、大联合、继续革命理论 ───────────────────────
- id: 1967-09-mao-tour
  date: 1967-07-13
  end: 1967-09-23
  title: 毛泽东视察华北、中南、华东
  lane: center
  weight: 2
  summary: 毛泽东离京三个月，经武汉、上海、长沙、南昌等地，谈话要求各派“在革命的原则下”实现大联合，说“没有根本的利害冲突”，要“解放”大多数干部。国庆社论公开报道“毛主席视察了华北、中南和华东地区”，各地开始收缴武器、办学习班。
  people: [mao-zedong, zhou-enlai, yang-chengwu, wang-dongxing]
  voices:
    - { voice: official1966, text: 在这盛大节日的前夕，我们伟大的领袖毛主席视察了华北、中南和华东地区的喜讯，传遍全国（1967 年国庆社论）, cite: ws-1967-10-cr-victory, quote: true }
  cites: [ws-1967-10-cr-victory, ws-1967-12-21-shengwulian-decision]
  verify: true

- id: 1967-09-05-arms-order
  date: 1967-09-05
  title: “九五命令”：不准抢夺解放军武器
  lane: army
  weight: 2
  summary: 中共中央、国务院、中央军委、中央文革联合发布命令，禁止抢夺人民解放军的武器装备，授权部队在警告无效后自卫还击。8 月间各地抢枪最多，这一命令与毛泽东南巡谈话一起，使全国性的武斗在 9 月以后暂时降温。江青 9 月 5 日的讲话同时把矛头转向“五一六”。
  people: [jiang-qing, zhou-enlai]
  verify: true

- id: 1967-10-17-unite-by-system
  date: 1967-10-17
  title: 按系统、按行业、按班级实现大联合
  lane: mass
  weight: 1
  summary: 中央转发毛泽东的指示，要求各单位“按照系统，按照行业，按照班级”实现革命大联合，跨行业的组织要调整。这一规定拆散了跨单位的造反派联合组织，是“大联合”的组织手段。
  people: [mao-zedong]
  cites: [ws-1967-10-17-unite-by-system]

- id: 1967-10-06-fight-self
  date: 1967-10-06
  title: “斗私，批修”
  lane: ideology
  weight: 1
  summary: 国庆前后报刊发表毛泽东“要斗私，批修”的指示，林彪解释为用毛泽东思想同“自己头脑里的‘私’字作斗争”。运动的口号从打倒走资派转向群众的自我改造，各地大办“毛泽东思想学习班”。
  people: [mao-zedong, lin-biao]
  concepts: [mao-thought]
  cites: [ws-1967-10-06-mao-thought]

- id: 1967-11-06-continuous-revolution
  date: 1967-11-06
  title: 两报一刊：“无产阶级专政下继续革命的理论”
  lane: ideology
  weight: 3
  summary: 纪念十月革命五十周年，两报一刊编辑部文章《沿着十月社会主义革命开辟的道路前进》第一次系统表述“无产阶级专政下继续革命的理论”的六个要点，称之为马克思主义的“第三个伟大的里程碑”。九大政治报告沿用了这一表述；1981 年决议说这一理论使“无产阶级专政下继续革命”一语有了“特定的含义”。
  people: [chen-boda, yao-wenyuan, lin-biao]
  concepts: [continuous-revolution]
  voices:
    - { voice: official1966, text: 毛泽东同志全面地继承、捍卫和发展了马克思列宁主义，创造性地提出了无产阶级专政下继续革命的伟大理论（1967 年 11 月两报一刊编辑部文章）, cite: ws-1967-11-06-october-road, quote: true }
    - { voice: official1981, text: 这些论点主要地出现在作为“文化大革命”纲领性文件的《五·一六通知》和党的九大的政治报告中，并曾被概括成为所谓“无产阶级专政下继续革命的理论”（1981 年决议）, cite: ws-1981-resolution, quote: true }
  cites: [ws-1967-11-06-october-road, ws-1967-11-06-lin-speech, ws-1981-resolution]

- id: 1967-11-18-guangxi-decision
  date: 1967-11-18
  title: 中央关于广西问题的决定
  lane: local
  weight: 2
  summary: 中央同意广西军区和韦国清的检查，说韦国清“不坚持错误，能够诚恳地检查错误，态度是好的”，决定成立以他为首的广西革筹小组。支持韦国清的“联指”与反对他的“四二二”对立由此固定，1968 年演变为大规模屠杀。
  people: [wei-guoqing]
  voices:
    - { voice: doc, text: 韦国清同志在这次无产阶级文化大革命中虽然犯了一些错误，但是，他不坚持错误，能够诚恳地检查错误，态度是好的（1967 年 11 月中央决定）, cite: ws-1967-11-18-guangxi-decision, quote: true }
  cites: [ws-1967-11-18-guangxi-decision]

- id: 1967-11-tianjin-leaflet-case
  date: 1967-11
  title: 天津“中共中央非常委员会”传单案
  lane: center
  weight: 1
  summary: 天津破获一份署名“中共中央非常委员会”的传单。陈伯达、谢富治、吴法宪以追“后台”为名扩大办案，1968 年 12 月又制造“中国（马列）共产党”假案，把朱德、陈毅、李富春、叶剑英等人列为“参加者”。
  people: [chen-boda, xie-fuzhi, wu-faxian, zhu-de, chen-yi, li-fuchun, ye-jianying]
  voices:
    - { voice: judicial1980, text: 陈伯达、谢富治和吴法宪利用一九六七年十一月在天津破获的“中共中央非常委员会”传单案，以追“后台”为名，阴谋诬陷、迫害党和国家领导人（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-10-guangdong-underground
  date: 1967-10
  title: “广东地下党”冤案
  lane: local
  weight: 1
  place: 广东
  summary: 广州军区司令员黄永胜、政委刘兴元主持把解放前广东地下党和游击队干部打成“叛徒”“特务”集团。起诉书说七千一百多人受迫害，林锵云等八十五人死亡。同年新疆也制造了以马明方为首的“新疆叛徒集团”冤案。
  people: [huang-yongsheng, liu-xingyuan]
  voices:
    - { voice: judicial1980, text: 一九六七年十月，黄永胜伙同广州部队政治委员刘兴元……“广东地下党”冤案，使七千一百多人遭到诬陷、迫害，林锵云等八十五人被迫害致死（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-10-shengwulian
  date: 1967-10-11
  title: 湖南“省无联”成立
  lane: mass
  weight: 2
  place: 长沙
  summary: 毛泽东 9 月在长沙要求“在革命的原则下联合起来”后，长沙二十多个造反组织成立“湖南省会无产阶级革命派大联合委员会”（省无联），反对由军队和老干部主导的革委会筹备小组。其成员杨曦光 1968 年 1 月写出《中国向何处去？》，主张推翻“红色资本家阶级”、建立“中华人民公社”；康生、江青随即点名“省无联”是“反革命大杂烩”，组织被取缔，杨曦光判刑十年。
  people: [yang-xiguang, kang-sheng, jiang-qing]
  concepts: [paris-commune]
  cites: [ws-1967-12-21-shengwulian-decision]
  verify: true
