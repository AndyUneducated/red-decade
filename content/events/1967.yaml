  cites: [ws-1967-08-bombard-anniv]

- id: 1967-08-10-hunan-decision
  date: 1967-08-10
  title: 中央关于湖南问题的决定：为“湘江风雷”翻案
  lane: local
  weight: 1
  place: 长沙
  summary: 毛泽东 8 月 7 日批“已阅，同意”。决定说中央文革小组 2 月对湖南省军区关于“湘江风雷”报告的“二·四批示”是错误的，“中央要负责主要的责任”；改组省军区，成立以黎原、华国锋、章伯森等为首的湖南省革委会筹备小组。被军区打击的造反派由此翻身，长沙造反组织 10 月联合成立“省无联”；同一决定又规定“不管哪一派”都不准夺取解放军的枪支。
  people: [mao-zedong, hua-guofeng]
  voices:
    - { voice: doc, text: 从这里得到教训，未经调查清楚，何必那样匆匆忙忙地根据一面之词发出“二·四批示”呢？因此，中央要负责主要的责任。（1967 年 8 月中央决定）, cite: ws-1967-08-10-hunan-decision, quote: true }
  cites: [ws-1967-08-10-hunan-decision, ws-1967-12-21-shengwulian-decision]

- id: 1967-08-15-liu-big-criticism
  date: 1967-08-10
  end: 1967-08-15
  title: 大批判转向刘少奇的全部经历
  lane: ideology
  weight: 1
  summary: 8 月中旬，上海三报刊和两报一刊连续发表长文，把刘少奇几十年的言论逐条清算：8 月 10 日《中国“议会迷”的破产》说他 1946 年的《时局问题报告》鼓吹“和平民主新阶段”和“议会道路”；8 月 15 日《走社会主义道路，还是走资本主义道路？》批判他 1949 年对天津资本家的谈话等。文章仍不点名，称“党内最大的走资本主义道路当权派”或“中国赫鲁晓夫”。
  people: [liu-shaoqi]
  concepts: [khrushchev, two-lines, capitalist-roaders]
  voices:
    - { voice: official1966, text: 他历来是中国最大的“议会迷”，也是当代世界上最大的“议会迷”。（1967 年 8 月 10 日上海《文汇报》等编辑部文章）, cite: ws-1967-08-10-parliament, quote: true }
    - { voice: official1966, text: 中国向何处去？是走社会主义道路，还是走资本主义道路？这不仅是中国政治的根本问题，同时也是关系到世界无产阶级革命命运的问题。（1967 年 8 月 15 日两报编辑部文章）, cite: ws-1967-08-15-socialist-road, quote: true }
  cites: [ws-1967-08-10-parliament, ws-1967-08-15-socialist-road]

- id: 1967-08-16-peng-resolution-published
  date: 1967-08-16
  title: 公开发表庐山会议关于彭德怀的决议
  lane: center
  weight: 2
  summary: 1959 年八届八中全会《关于以彭德怀为首的反党集团的决议》（摘要）在下发八年后首次公开见报，同日《红旗》社论《从彭德怀的失败到中国赫鲁晓夫的破产》把彭德怀说成“以中国赫鲁晓夫为首的资产阶级司令部里面的急先锋”，把庐山会议和打倒刘少奇连成一条线。1981 年决议说这份决议“是完全错误的”。
  people: [peng-dehuai, huang-kecheng, zhang-wentian, zhou-xiaozhou, liu-shaoqi]
  concepts: [khrushchev, bourgeois-hq]
  voices:
    - { voice: official1966, text: 在这种阶级斗争形势下，以中国赫鲁晓夫为首的资产阶级司令部里面的急先锋彭德怀，赤膊上阵了。（1967 年 8 月 16 日《红旗》社论）, cite: ws-1967-08-16-peng-failure, quote: true }
    - { voice: official1981, text: 八届八中全会关于所谓“彭德怀、黄克诚、张闻天、周小舟反党集团”的决议是完全错误的。（1981 年决议）, cite: ws-1981-resolution, quote: true }
  cites: [ws-1967-08-16-peng-failure, ws-1959-08-16-peng-resolution, ws-1981-resolution]

- id: 1967-09-08-tao-zhu-books
  date: 1967-09-08
  title: 姚文元《评陶铸的两本书》，社论点名“五·一六”
  lane: ideology
  weight: 2
  summary: 姚文元在《人民日报》发表长文，批判陶铸 1962 年的《理想，情操，精神生活》和 1964 年的《思想·感情·文采》，说陶铸在八届十一中全会后成为“继续执行资产阶级反动路线的主要代表人物”。次日社论《掌握革命斗争的大方向 深入开展革命的大批判》公开点名“五·一六”是“以貌似极‘左’实质极右的面目出现”的“反革命小集团”。
  people: [yao-wenyuan, tao-zhu, wang-renzhong]
  voices:
    - { voice: official1966, text: 它们是黑《修养》的“姊妹篇”，活龙活现地刻划出陶铸这个修正主义者的反动而丑恶的灵魂。（姚文元，1967 年 9 月）, cite: rmrb-1967-09-08-tao-zhu-books, quote: true }
    - { voice: official1966, text: 最近被广大革命群众揭露出来的、被一小撮坏头头操纵的“五·一六”，就是这样的一个反革命小集团。（1967 年 9 月 9 日社论）, cite: ws-1967-09-tao-zhu-editorial, quote: true }
  cites: [rmrb-1967-09-08-tao-zhu-books, ws-1967-09-tao-zhu-editorial]

- id: 1967-10-14-reopen-schools
  date: 1967-10-14
  title: 中央通知大中小学“一律立即开学”
  lane: culture
  weight: 1
  summary: 中共中央、国务院、中央军委、中央文革小组联合通知“全国各地大学、中学、小学一律立即开学”，一边教学一边改革，“按照教学的班、级、系的系统”实现大联合，教师和干部“大多数是好的或比较好的”，各校“立即积极筹备招生”。通知引毛泽东 1967 年 3 月 7 日的指示，是 3 月中小学复课向大学的推广。
  voices:
    - { voice: doc, text: 全国各地大学、中学、小学一律立即开学。（1967 年 10 月 14 日通知）, cite: ws-1967-10-14-resume-classes-notice, quote: true }
    - { voice: doc, text: 各学校的教师和干部，大多数是好的或比较好的。（同上）, cite: ws-1967-10-14-resume-classes-notice, quote: true }
  cites: [ws-1967-10-14-resume-classes-notice, ws-1967-03-07-resume-classes]

- id: 1967-10-21-cadre-policy
  date: 1967-10-21
  title: 社论《正确地执行毛主席的干部政策》
  lane: center
  weight: 1
  summary: 社论传达毛泽东南巡中的指示：正确对待干部是三结合、大联合和“斗、批、改”的“关键问题”。社论要求让“包括一些犯了错误、不再坚持而又认真改正的革命干部”进入各级革委会，按“惩前毖后，治病救人”办毛泽东思想学习班；同时说“至死不变、愿意带着花冈岩头脑去见上帝的人，肯定有的”。此后各地陆续“解放”一批干部，作为革委会“三结合”中的干部代表。
  people: [mao-zedong]
  concepts: [capitalist-roaders]
  voices:
    - { voice: doc, text: 正确地对待干部，是实行革命三结合，巩固革命大联合，搞好本单位斗、批、改的关键问题，一定要解决好。（毛泽东，1967 年 10 月 21 日社论引）, cite: rmrb-1967-10-21-cadre-policy, quote: true }
  cites: [rmrb-1967-10-21-cadre-policy]

