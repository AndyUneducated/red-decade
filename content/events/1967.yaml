  people: [wei-guoqing]
  voices:
    - { voice: doc, text: 韦国清同志在这次无产阶级文化大革命中虽然犯了一些错误，但是，他不坚持错误，能够诚恳地检查错误，态度是好的（1967 年 11 月中央决定）, cite: ws-1967-11-18-guangxi-decision, quote: true }
  cites: [ws-1967-11-18-guangxi-decision]

