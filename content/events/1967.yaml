    - { voice: editor, text: 同一份中央文件把武汉军区的支左称为“方向、路线错误”，又说“王任重和陈再道则是上述事件的罪魁祸首”——王任重这时已在北京被打倒，并不在武汉。1978 年中央为此事平反。, cite: ws-1967-07-26-wuhan-notice }
