  summary: 缅甸仰光等地发生针对华侨和中国驻缅人员的暴力事件，援缅专家刘逸被刺身亡，外交信使曹达林、张瑞琏被打伤。7 月 3 日周恩来、陈伯达、康生、陈毅等到首都机场迎接刘逸骨灰和两名信使，群众高呼“奈温政府欠下中国人民的血债一定要用血来还！”，缅共中央第一副主席德钦巴登顶也到机场。同一天十多万首都红卫兵和文艺界人士集会声讨“奈温反动政府”，表示支持缅共领导的武装斗争，会后到缅甸驻华使馆门前示威。
  people: [zhou-enlai, chen-boda, kang-sheng, chen-yi]
  voices:
    - { voice: official1966, text: 今天，首都各界革命群众数千人，怀着对缅甸反动政府的满腔怒火，齐集首都机场，高呼口号，迎接被缅甸反动政府指使暴徒刺杀而壮烈牺牲的我援缅专家刘逸同志的骨灰（1967 年 7 月 3 日新华社电）, cite: rmrb-1967-07-04-burma-martyr, quote: true }
    - { voice: official1966, text: 我们坚决支持缅甸人民在缅共领导下进行武装斗争，大造奈温反动政府的反。（1967 年 7 月 3 日首都红卫兵大会报道）, cite: rmrb-1967-07-04-burma-protest, quote: true }
  cites: [rmrb-1967-07-04-burma-martyr, rmrb-1967-07-04-burma-protest]

- id: 1967-07-08-shatoujiao
  topics: [hk-macau-taiwan]
  date: 1967-07-08
  title: 沙头角枪战，香港“反英抗暴”升级
  lane: intl
  weight: 2
  place: 沙头角（深港边境）
  summary: 香港左派“反英抗暴”期间，7 月 8 日沙头角中方群众和“新界”居民集会游行，港英警察开枪，中国外交部照会说打死一人、打伤八人，中方边防哨兵“进行了还击”；外交部副部长罗贵波次日召见英国代办霍普森抗议。8 月 20 日外交部照会限英方“在四十八小时内撤销对香港我三家爱国报纸的停刊令”，次日《人民日报》评论员文章说中国人民对“反英抗暴斗争，是支持定了的”。
  voices:
    - { voice: official1966, text: 香港英国当局八日在沙头角又一次制造血腥暴行，开枪打死示威群众一人、打伤八人、对中国人民进行严重的武装挑衅（1967 年 7 月 9 日新华社电）, cite: rmrb-1967-07-10-hk-border, quote: true }
    - { voice: official1966, text: 我们可以十分明确地告诉英国政府，伟大的中国人民对香港同胞的反英抗暴斗争，是支持定了的。（1967 年 8 月 21 日《人民日报》评论员）, cite: ws-1967-08-hk-british, quote: true }
  cites: [rmrb-1967-07-10-hk-border, ws-1967-08-hk-british]

- id: 1967-07-25-wuhan-rally
  date: 1967-07-25
  title: 天安门百万人集会欢迎谢富治、王力
  lane: center
  weight: 2
  place: 北京天安门
  summary: 王力、谢富治从武汉回京后，7 月 25 日林彪、周恩来、陈伯达、康生、江青等在天安门城楼与“一百万人”集会，欢迎二人“回到毛主席身边”。广场标语有“用鲜血和生命保卫毛主席！”“谁反对中央文革就打倒谁！”；讲话一致要求打倒“党内、军内一小撮走资本主义道路当权派”和“百万雄师”中的“一小撮坏头头”。一周后《红旗》建军节社论正式提出“揪军内一小撮”。
  people: [lin-biao, zhou-enlai, chen-boda, kang-sheng, jiang-qing, xie-fuzhi, wang-li, guan-feng, qi-benyu, yang-chengwu, kuai-dafu, han-aijing, nie-yuanzi, wang-dabin, tan-houlan]
  voices:
    - { voice: official1966, text: 热烈欢迎谢富治同志和王力同志从武汉胜利地、光荣地回到北京，回到毛主席身边，最坚决地支持武汉地区的无产阶级革命派（1967 年 7 月 25 日新华社电）, cite: rmrb-1967-07-26-wuhan-rally, quote: true }
    - { voice: editor, text: 城楼上的名单里，王力、关锋一个多月后被隔离审查，戚本禹 1968 年 1 月被关押，杨成武 1968 年 3 月被撤职。, cite: rmrb-1967-07-26-wuhan-rally }
  cites: [rmrb-1967-07-26-wuhan-rally, ws-1967-08-01-gun]

