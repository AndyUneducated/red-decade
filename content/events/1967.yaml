  cites: [ws-1967-08-09-renegades]

- id: 1967-08-qinghai-revcom
  date: 1967-08-12
  title: 青海省革命委员会成立
  lane: local
  weight: 1
  summary: 中央关于青海问题的决定说，青海省军区副司令员赵永夫篡夺军权后，对西宁“八·一八”等群众组织“进行残酷的武装镇压，打死打伤革命群众三百余人”，“逮捕革命群众近万人”，所谓“八·一八”先开枪“毫无根据”。决定宣布“八·一八”为革命群众组织，赵永夫隔离受审，由司令员刘贤权“全权负责处理青海问题”。8 月青海省革委会成立，《人民日报》社论说它以“八·一八”左派组织为核心。
  people: []
  voices:
