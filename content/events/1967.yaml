    - { voice: doc, text: 不匆匆忙忙急于表态，经过调查研究，如果两派都是革命的群众组织，就逐步地把他们联合起来。（1967 年 12 月 18 日《人民日报》）, cite: rmrb-1967-12-18-8341, quote: true }
  cites: [rmrb-1967-12-18-8341]

