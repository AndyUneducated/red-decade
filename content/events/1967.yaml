  cites: [ws-1967-04-xiuyang, ws-1967-05-great-document]

- id: 1967-05-model-operas
  date: 1967-05-10
  title: 《人民日报》：京剧“样板戏”是文革的“进军号”
  lane: culture
  weight: 2
  summary: 《人民日报》社论称“京剧革命，吹响了我国无产阶级文化大革命的进军号”，把《智取威虎山》《海港》《红灯记》《沙家浜》《奇袭白虎团》称为“京剧样板戏”，说它们“也是无产阶级文化大革命各个阵地上的‘斗批改’的优秀样板”，又把江青 1964 年 7 月在京剧现代戏观摩演出人员座谈会上的讲话称为“一个重要文件”。社论点名“党内最大的走资本主义道路的当权派”是京剧革命“一只最大的拦路虎”。
  people: [jiang-qing]
  voices:
    - { voice: official1966, text: 京剧革命，吹响了我国无产阶级文化大革命的进军号，这是我国无产阶级文化大革命的伟大开端（1967 年 5 月《人民日报》社论）, cite: ws-1967-05-10-opera, quote: true }
  cites: [ws-1967-05-10-opera]

- id: 1967-06-17-h-bomb
  date: 1967-06-17
  title: 第一颗氢弹爆炸
