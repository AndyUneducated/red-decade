    - { voice: official1981, text: 这些论点主要地出现在作为“文化大革命”纲领性文件的《五·一六通知》和党的九大的政治报告中，并曾被概括成为所谓“无产阶级专政下继续革命的理论”（1981 年决议）, cite: ws-1981-resolution, quote: true }
  cites: [ws-1967-11-06-october-road, ws-1967-11-06-lin-speech, ws-1981-resolution]

