  summary: 《人民日报》头版刊登“人民解放军八三四一部队支左工作的三项原则”：宣传毛泽东思想；“不匆匆忙忙急于表态”，两派都是革命群众组织的就“逐步地把他们联合起来”；“向工人群众学习”。
  people: [wang-dongxing, mao-zedong]
