- id: 1967-04-04-yibin-rehab
  date: 1967-04-04
  title: 中央为宜宾刘结挺、张西挺平反
  lane: local
  weight: 1
  summary: 中发〔67〕154 号说宜宾地委刘结挺等人的案件是李井泉“一手制造的，经邓小平、彭真、杨尚昆批准的冤案”。刘、张夫妇随后掌握四川省革筹，1970 年代再次被定为“反革命”。
  people: [liu-jieting, zhang-xiting, li-jingquan, deng-xiaoping, peng-zhen, yang-shangkun]
  cites: [ws-1967-04-04-yibin-rehab]

- id: 1967-04-06-ten-orders
  date: 1967-04-06
  title: 军委“十条命令”：对群众组织“都不准开枪”
  lane: army
  weight: 2
  summary: 二月间各地军队支左中大批抓人，中央的决定说青海“二·二三”事件中赵永夫等“打死打伤革命群众三百余人”，内蒙古、四川、安徽也有镇压。毛泽东批示“此件很好”的军委十条命令规定，对群众组织“都不准开枪”，“不准随意捕人”。被定为“反革命”的组织大批平反，造反派重新得势。
  people: [mao-zedong, lin-biao]
  voices:
    - { voice: doc, text: 对群众组织，无论革命的、或者被反动分子所控制的，或者情况不清楚的，都不准开枪，只能进行政治工作（1967 年 4 月 6 日军委十条命令）, cite: ws-1967-04-06-ten-orders, quote: true }
  cites: [ws-1967-04-06-ten-orders, ws-1967-04-13-inner-mongolia, ws-1967-qinghai-decision]

- id: 1967-04-13-inner-mongolia-decision
  topics: [ethnic-religion]
  date: 1967-04-13
  title: 中央处理内蒙古问题的决定
  lane: local
  weight: 1
  summary: 中央决定说内蒙古军区个别领导人“犯了方向、路线错误”，镇压了呼和浩特三司，责任“主要由王逸伦、王铎负责”，改派刘贤权任军区司令员。随后滕海清率北京军区工作组进入内蒙古，11 月任革委会主任，挖“乌兰夫黑线”和“内人党”由此开始。
  people: [ulanhu, teng-haiqing]
  cites: [ws-1967-04-13-inner-mongolia]

