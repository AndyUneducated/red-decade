- id: 1967-05-07-jinan-compound
  date: 1967-05-07
  title: 济南省革委会大院武斗
  lane: local
  weight: 1
  place: 济南
  summary: 起诉书说，张春桥、姚文元 5 月在济南支持山东省革委会主任王效禹“镇压群众”，张春桥说“你有力量，我就支持你”；5 月 7 日王效禹在省革委会大院制造武斗，拘捕关押三百八十八人，张、姚随后祝贺“打了一个胜仗！”。
  people: [wang-xiaoyu, zhang-chunqiao, yao-wenyuan]
  voices:
    - { voice: judicial1980, text: 张春桥对王效禹说：“你有力量，我就支持你。”王效禹随即在五月七日制造了省革命委员会大院武斗事件，拘捕关押三百八十八人。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-07-gun-protects-pen
  date: 1967-07
  title: 张春桥：“以枪杆子保卫笔杆子革命”
  lane: mass
  weight: 1
  place: 上海
  summary: 起诉书说，1967 年 7 月张春桥在他审定的一份报告中提出“以枪杆子保卫笔杆子革命”，指使王洪文在上海建立由他们控制的武装力量。起诉书把这件事与后来王洪文抓上海民兵连在一起：1976 年王洪文说“上海民兵是我和春桥搞起来的”。
  people: [zhang-chunqiao, wang-hongwen]
  concepts: [verbal-struggle]
  voices:
    - { voice: judicial1980, text: 一九六七年七月，张春桥在他审定的一份报告中提出“以枪杆子保卫笔杆子革命”，指使王洪文等在上海建立由他们控制的武装力量。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-xinjiang-renegades
  topics: [ethnic-religion]
  date: 1967
  title: “新疆叛徒集团”冤案
  lane: local
  weight: 1
  summary: 1942 年 9 月被新疆军阀盛世才逮捕关押的一批共产党干部，1967 年被康生等定为“投敌叛变”、“潜伏我们党内”的“叛徒集团”。起诉书说一百三十一人被诬陷，马明方、张子意、杨之华、方志纯等九十二名干部受迫害，马明方等二十六人死亡。
  people: [kang-sheng]
  voices:
    - { voice: judicial1980, text: 马明方、张子意、杨之华、方志纯等九十二名干部受到迫害，马明方等二十六人被迫害致死。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-11-you-xuetao-group
  date: 1967-11
  end: 1968-11-30
  title: 张春桥的“游雪涛小组”
  lane: local
  weight: 1
  place: 上海
  summary: 起诉书说，张春桥在上海指挥代号“二四四”的“游雪涛小组”，专门跟踪盯梢、绑架、抄家、秘密刑讯和搜集情报。1967 年 11 月到 1968 年 3 月，小组为张春桥编造华东局九十七名领导干部的材料，绘制“华东局黑线人物关系图”，编写三百期简报，诬陷、迫害一百八十三人；张春桥在小组的年度总结上批“谢谢同志们”。
  people: [zhang-chunqiao]
  voices:
    - { voice: judicial1980, text: 从一九六七年十一月至一九六八年三月，这个特务组织为张春桥搜集、编造诬陷中共中央华东局九十七名领导干部的材料，绘制了“华东局黑线人物关系图”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 张春桥在这份总结上亲笔批道：“谢谢同志们。”（同上）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-12-jidong-case
  date: 1967-12
  title: 冀东冤案
  lane: local
  weight: 2
  place: 河北唐山
  summary: 陈伯达 12 月在唐山说，冀东党组织“可能是国共合作的党”，“叛徒在这里起作用”。冀东抗日根据地出身的干部随即被成批打成“叛徒”“国民党”。起诉书说八万四千余名党员干部和群众受诬陷、迫害，张文浩等二千九百五十五人死亡。
  people: [chen-boda]
  voices:
    - { voice: judicial1980, text: 一九六七年十二月，陈伯达在唐山说：中共冀东党组织“可能是国共合作的党，实际上可能是国民党在这里起作用，叛徒在这里起作用”。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 使冀东地区的党员干部、群众八万四千余人遭受诬陷、迫害，张文浩等二千九百五十五人被迫害致死。（同上）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1967-dongbei-gang
  date: 1967
  end: 1969
  title: “东北帮”冤案
  lane: local
  weight: 1
  place: 东北
  summary: 1946 年 2 月吕正操、万毅、张学思等四十二人经东北局决定、由延安新华社联名通电要求释放张学良。1967—1969 年这件事被定为“妄图叛党投敌的一起重大反革命案件”，进而制造出九十人的“东北帮”反革命集团。起诉书说张学思、贾陶、车向忱、陈先舟等死亡。
  voices:
    - { voice: judicial1980, text: 诬陷为“经过长期预谋，妄图叛党投敌的一起重大反革命案件”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 张学思、贾陶、车向忱、陈先舟等被迫害致死。（同上）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

# ── E7 补充：1967 年鞍山军管与上海单松林案
- id: 1967-08-17-anshan
  date: 1967-08-17
  title: 中央决定对鞍山、鞍钢实行军管
  lane: local
  weight: 1
  place: 鞍山
  summary: 鞍山两派发生严重武斗后，中央决定撤销鞍山、鞍钢负责人王鹤寿等四人的一切职务，称王鹤寿是“自首变节分子”和“高饶反党集团的漏网分子”，对他“隔离反省”；支持“鞍钢捍卫毛泽东思想战斗总部”一派，另一派“钢都革命造反派大联合”被要求“站到毛主席革命路线上来”。决定由三十九军军长张峰、政委陈绍昆组成军管会，对鞍山市和鞍山钢铁公司实行全面军事管制，所有武器交卫戍司令部封存。
  people: []
  voices:
    - { voice: doc, text: 中央决定撤销王鹤寿、赵敏、罗定枫、钟剑平四人的党内外一切职务，王鹤寿实行隔离反省。（1967 年中央决定）, cite: ws-1967-anshan-decision, quote: true }
    - { voice: doc, text: 中央决定成立以三十九军军长张峰、政治委员陈绍昆同志为首的鞍山市军事管制委员会，对鞍山市、鞍山钢铁公司实行全面军事管制。（同上）, cite: ws-1967-anshan-decision, quote: true }
  cites: [ws-1967-anshan-decision]

- id: 1967-08-04-shan-songlin
  date: 1967-08-04
  title: 上海工人单松林以“反革命”被判死刑
  lane: local
  weight: 1
  place: 上海
  summary: 上海第一制药厂工人单松林，三十九岁，自 1965 年 1 月起刻制带反对口号的印章，印写传单、标语和匿名信在九个区散发；文革开始后把印章盖在街头张贴的中央文件和毛泽东像上，1967 年 3 月 10 日被当场扭获。上海市中级人民法院判处死刑立即执行，上诉第二天即被驳回。其妻 1979、1980 年申诉均被驳回；此后的复查裁定（维基文库标为 1985 年）认为依《惩治反革命条例》判处死刑“并无不当”，只删去判决书中有关“无产阶级文化大革命”的提法。
  people: []
  voices:
    - { voice: doc, text: 一判处反革命犯单松林死刑立即执行并剥夺政治权利终身（1967 年上海市中级人民法院判决书）, cite: ws-1967-shanghai-court-14, quote: true }
    - { voice: officialLater, text: 原审依据《中华人民共和国惩治反革命条例》第十条第三项判处单松林死刑并无不当。（复查裁定）, cite: ws-1967-shanghai-court-14, quote: true }
    - { voice: officialLater, text: 有关“无产阶级文化大革命”的提法是错误的，应予删除。（同上）, cite: ws-1967-shanghai-court-14, quote: true }
  cites: [ws-1967-shanghai-court-14]
