# Events, 1967 (M3-2 / M3-3): 一月夺权、二月逆流、三支两军、武汉七二〇、“揪军内一小撮”、全面武斗、大联合。
# Sources: 1967 两报一刊社论与中央文件（维基文库）、1980 起诉书、1981 决议。Events with no text in the corpus are marked verify.

# ── 一月夺权 ────────────────────────────────────────────────
- id: 1967-01-01-new-year-editorial
  date: 1967-01-01
  title: 元旦社论：“全国全面展开阶级斗争的一年”
  lane: ideology
  weight: 2
  summary: 《人民日报》《红旗》元旦社论《把无产阶级文化大革命进行到底》，宣布 1967 年“将是全国全面展开阶级斗争的一年”，要向“党内一小撮走资本主义道路的当权派和社会上的牛鬼蛇神，展开总攻击”。运动从学校、机关扩展到工厂和农村。
  people: [mao-zedong, chen-boda]
  concepts: [class-struggle, capitalist-roaders]
  voices:
    - { voice: official1966, text: 一九六七年，将是全国全面展开阶级斗争的一年（1967 年元旦社论）, cite: ws-1967-01-01-to-the-end, quote: true }
  cites: [ws-1967-01-01-to-the-end, ws-1967-01-04-shanghai-letter]

- id: 1967-01-04-shanghai-letter
  date: 1967-01-04
  title: 上海《告上海全市人民书》
  lane: mass
  weight: 2
  place: 上海《文汇报》
  summary: 上海工总司等十一个造反组织在 1 月 4 日夺权后的《文汇报》上发表《告上海全市人民书》，把罢工、停产和铁路中断归咎于上海市委“以经济福利问题来转移斗争的大方向”。1 月 6 日造反派在人民广场召开“打倒上海市委大会”，陈丕显、曹荻秋被批斗。
  people: [wang-hongwen, zhang-chunqiao, yao-wenyuan, chen-pixian, cao-diqiu, geng-jinzhang]
  concepts: [rebellion]
  cites: [ws-1967-01-04-shanghai-letter, ws-1967-01-shanghai-urgent]

- id: 1967-01-11-cc-telegram
  date: 1967-01-11
  title: 中央贺电支持上海造反派：《紧急通告》“好得很”
  lane: center
  weight: 3
  summary: 中共中央、国务院、中央军委、中央文革联名致电上海工总司等三十二个组织，说他们 1 月 9 日的《紧急通告》“好得很”，号召全国“学习上海市革命造反派的经验”。这是中央第一次以四个机关的名义直接向群众组织发电，等于承认造反派夺取市委权力。
  people: [mao-zedong, zhang-chunqiao, wang-hongwen]
  concepts: [rebellion, grasp-revolution]
  voices:
    - { voice: official1966, text: 我们号召全国的党、政、军、民各界，号召全国的工人、农民、革命学生、革命知识分子、革命干部，学习上海市革命造反派的经验（1967 年 1 月 11 日中央贺电）, cite: ws-1967-01-11-cc-telegram, quote: true }
  cites: [ws-1967-01-11-cc-telegram, ws-1967-01-shanghai-urgent, ws-1967-01-12-anti-economism]

- id: 1967-01-13-public-security
  date: 1967-01-13
  title: “公安六条”
  lane: center
  weight: 2
  summary: 中共中央、国务院《关于无产阶级文化大革命中加强公安工作的若干规定》（中发〔67〕19 号）。第二条把“攻击污蔑伟大领袖毛主席和他的亲密战友林彪同志”定为“现行反革命行为”，此后成为大批言论入罪的依据；遇罗克、林昭等人的判决都援用这类罪名。
  people: [xie-fuzhi, lin-biao]
  voices:
    - { voice: doc, text: 凡是投寄反革命匿名信，秘密或公开张贴、散发反革命传单，写反动标语，喊反动口号，以攻击污蔑伟大领袖毛主席和他的亲密战友林彪同志的，都是现行反革命行为，应当依法惩办（“公安六条”第二条）, cite: ws-1967-01-13-public-security, quote: true }
  cites: [ws-1967-01-13-public-security]

- id: 1967-01-22-seize-power-editorial
  date: 1967-01-22
  title: 《人民日报》社论：夺权“好得很！就是好得很！”
  lane: ideology
  weight: 3
  summary: 《人民日报》社论《无产阶级革命派大联合，夺走资本主义道路当权派的权！》号召全国“自下而上地夺权”。同日张春桥在上海说“我们对所有的权都要夺”；次日林彪说“无论上层、中层、下层都要夺”。一个月内山西、山东、贵州、黑龙江等省和青岛等市相继宣布夺权。
  people: [zhang-chunqiao, lin-biao, mao-zedong]
  concepts: [rebellion, capitalist-roaders]
  voices:
    - { voice: official1966, text: 无产阶级革命造反派的大联合，夺走资本主义道路当权派的权好得很！（1967 年 1 月 22 日《人民日报》社论）, cite: ws-1967-01-22-seize-power-editorial, quote: true }
    - { voice: judicial1980, text: 一九六七年一月二十二日，张春桥在上海说：“无产阶级文化大革命自始至终就是夺权，从基层到中央、党权、政权、财权、文权以及其它权”，“我们对所有的权都要夺”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1967-01-22-seize-power-editorial, ws-1980-indictment, ws-1967-01-22-qingdao-order]

- id: 1967-01-23-pla-support-left
  date: 1967-01-23
  title: 中央决定解放军“支左”
  lane: army
  weight: 3
  summary: 中共中央、国务院、中央军委、中央文革《关于人民解放军坚决支持革命左派群众的决定》，取消军队不介入地方运动的规定，要军队“坚决站在无产阶级革命派一边”。哪一派是“左派”由各地军队判断，此后各派争相求得驻军支持，军队本身也卷入派性。
  people: [mao-zedong, lin-biao]
  voices:
    - { voice: doc, text: 人民解放军必须坚决站在无产阶级革命派一边，坚决支持和援助无产阶级革命左派（1967 年 1 月 23 日中央决定）, cite: ws-1967-01-23-pla-left, quote: true }
  cites: [ws-1967-01-23-pla-left, ws-1967-01-25-pla-support]

- id: 1967-01-shanxi-guizhou-heilongjiang
  date: 1967-01-14
  end: 1967-02-03
  title: 各省夺权：山西、山东、贵州、黑龙江
  lane: local
  weight: 2
  summary: 山西以刘格平为首的造反组织 1 月 14 日夺权，25 日《人民日报》社论称这是“继上海市无产阶级革命造反派夺权斗争胜利以后，在一个省的范围内”的“伟大胜利”。贵州、黑龙江（潘复生、汪家道）、山东（王效禹）随后宣布夺权，黑龙江 1 月 31 日成立第一个省级“革命委员会”。中央赞扬的都是有驻军和原领导干部参加的“三结合”，这成为以后革委会的模式。
  people: []
  concepts: [rebellion]
  cites: [ws-1967-01-25-shanxi, ws-1967-02-01-southwest, ws-1967-02-02-northeast, ws-1967-03-01-three-in-one-rmrb]
  verify: true

- id: 1967-02-05-shanghai-commune
  date: 1967-02-05
  end: 1967-02-24
  title: 上海人民公社成立，十九天后改称革命委员会
  lane: local
  weight: 3
  place: 上海人民广场
  summary: 张春桥、姚文元主持成立“上海人民公社”，宣言称“一切权力归上海人民公社！”，以巴黎公社为样板。毛泽东不赞成用“公社”名称，问如果都叫公社，国家是否也要改称“中华人民公社”；2 月 24 日改名上海市革命委员会，张春桥任主任。
  people: [zhang-chunqiao, yao-wenyuan, wang-hongwen, mao-zedong]
  concepts: [paris-commune]
  voices:
    - { voice: official1966, text: 上海人民公社，是二十世纪六十年代在毛泽东思想指导下无产阶级专政条件下产生的崭新的地方国家机构（1967 年《上海人民公社宣言》）, cite: ws-1967-02-05-shanghai-commune, quote: true }
    - { voice: editor, text: 宣言自称“新型的无产阶级专政的地方国家机构”，存在十九天，名称就被毛泽东否定；改称“革命委员会”后，巴黎公社式的直接选举再没有被提起。, cite: ws-1967-02-05-shanghai-commune }
  cites: [ws-1967-02-05-shanghai-commune]

# ── 二月逆流与“三结合” ──────────────────────────────────────
- id: 1967-02-16-february-countercurrent
  date: 1967-02-11
  end: 1967-02-16
  title: “二月逆流”：老帅在怀仁堂拍案
  lane: center
  weight: 3
  place: 北京中南海怀仁堂
  summary: 周恩来主持的碰头会上，谭震林、陈毅、叶剑英、徐向前、聂荣臻、李富春、李先念等人当面批评中央文革搞乱党和军队，谭震林说“我不该活到六十五岁”。张春桥、王力等整理记录报告毛泽东，毛泽东 2 月 18 日严厉批评老帅，此事被称为“二月逆流”，政治局停止活动，中央文革碰头会取而代之。1968 年八届十二中全会又“严肃地批判”了它。
  people: [tan-zhenlin, chen-yi, ye-jianying, xu-xiangqian, nie-rongzhen, li-fuchun, li-xiannian, yu-qiuli, gu-mu, zhou-enlai, zhang-chunqiao, wang-li, jiang-qing, kang-sheng, mao-zedong]
  voices:
    - { voice: official1966, text: 全会严肃地批判了那个反对八届十一中全会决定、反对无产阶级文化大革命、反对以毛主席为首、林副主席为副的无产阶级司令部的一九六七年的“二月逆流”（1968 年八届十二中全会公报）, cite: rmrb-1968-11-02-twelfth-plenum, quote: true }
    - { voice: official1981, text: 一九六七年二月前后，谭震林、陈毅、叶剑英、李富春、李先念、徐向前、聂荣臻等政治局和军委的领导同志，在不同的会议上对“文化大革命”的错误作法提出了强烈的批评，但被诬为“二月逆流”而受到压制和打击（1981 年决议）, cite: ws-1981-resolution, quote: true }
  cites: [ws-1981-resolution, rmrb-1968-11-02-twelfth-plenum]
  verify: true

- id: 1967-02-23-cadres-editorial
  date: 1967-02-23
  title: 《红旗》社论：“必须正确地对待干部”
  lane: ideology
  weight: 1
  summary: 《红旗》社论说经过半年运动证明“我们的干部大多数是好的”，要求在夺权中“正确地对待干部”，把革命领导干部吸收进“三结合”。这是一月夺权后中央第一次公开为干部松绑。
  people: [chen-boda]
  cites: [ws-1967-02-23-cadres]

- id: 1967-03-10-three-in-one
  date: 1967-03-10
  title: “三结合”与“革命委员会”
  lane: center
  weight: 2
  summary: 《红旗》社论公布毛泽东的方针：需要夺权的地方要建立“三结合”的临时权力机构，由“革命群众组织的负责人、人民解放军当地驻军的代表、革命领导干部组成”，名称“叫革命委员会好”。此后到 1968 年 9 月，全国二十九个省级单位都建立了革委会，大多由军人任主任。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 革命的“三结合”的临时权力机构，要由真正代表广大群众的革命群众组织的负责人、人民解放军当地驻军的代表、革命领导干部组成（1967 年 3 月《红旗》社论）, cite: ws-1967-03-10-three-in-one, quote: true }
  cites: [ws-1967-03-10-three-in-one, ws-1967-03-01-three-in-one-rmrb]

- id: 1967-03-19-three-supports
  date: 1967-03-19
  title: 中央军委：“三支两军”
  lane: army
  weight: 2
  summary: 中央军委决定把各总部、军兵种机关的“四大”暂告一段落，抽调三分之一到三分之二的人员投入支左、支农、支工、军管、军训，即“三支两军”。到 1972 年撤回时，先后有二百八十多万人次参加。
  people: [lin-biao, ye-jianying]
  cites: [ws-1967-03-19-three-supports]

- id: 1967-03-18-factory-letter
  date: 1967-03-18
  title: 中共中央给厂矿职工的信：坚持八小时工作制
  lane: econ
  weight: 1
  summary: 夺权后工厂普遍停产、串联，中央发信（中发〔67〕105 号）要求职工“坚持八小时工作制，在八小时工作制的以外时间，坚持文化革命”。同月中央还就农村春耕发了信。
  people: [zhou-enlai]
  voices:
    - { voice: doc, text: 你们应该按照党中央的规定，坚持八小时工作制，在八小时工作制的以外时间，坚持文化革命（1967 年 3 月中共中央给厂矿职工的信）, cite: ws-1967-03-18-cc-letter-factories, quote: true }
  cites: [ws-1967-03-18-cc-letter-factories]

- id: 1967-04-01-qi-benyu-patriotism
  date: 1967-04-01
  title: 戚本禹《爱国主义还是卖国主义？》
  lane: ideology
  weight: 3
  summary: 《红旗》和《人民日报》发表戚本禹批判电影《清宫秘史》的文章，以毛泽东 1950 年代的批评为由，连问“八个为什么”，矛头指向“党内最大的走资本主义道路的当权派”。全文不点名，但谁都知道指的是刘少奇；这是中央报刊第一次公开批判他。
  people: [qi-benyu, liu-shaoqi, mao-zedong, lu-dingyi, zhou-yang]
