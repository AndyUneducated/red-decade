- id: 1967-10-shengwulian
  date: 1967-10-11
  title: 湖南“省无联”成立
  lane: mass
  weight: 2
  place: 长沙
  summary: 毛泽东 9 月在长沙要求“在革命的原则下联合起来”后，长沙二十多个造反组织成立“湖南省会无产阶级革命派大联合委员会”（省无联），反对由军队和老干部主导的革委会筹备小组。其成员杨曦光 1968 年 1 月写出《中国向何处去？》，主张推翻“红色资本家阶级”、建立“中华人民公社”；康生、江青随即点名“省无联”是“反革命大杂烩”，组织被取缔，杨曦光判刑十年。
