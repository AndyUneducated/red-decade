# ── 1969：珍宝岛、九大、战备 ─────────────────────────────────
- id: 1969-03-02-zhenbao
  date: 1969-03-02
  end: 1969-03-17
  title: 珍宝岛冲突
  lane: intl
  weight: 3
  place: 黑龙江珍宝岛
  summary: 中苏边防军在乌苏里江珍宝岛交火。外交部当天照会苏方，说苏军“开枪打死打伤我边防军人员多名”；3 月 15 日双方再次激战。全国随即举行大规模反苏游行，“准备打仗”成为九大和此后几年的主题。
  people: [mao-zedong, zhou-enlai, lin-biao]
  voices:
    - { voice: official1966, text: 一九六九年三月二日晨，苏联边防军侵入中国黑龙江省珍宝岛地区，开枪打死打伤我边防军人员多名，制造了一次极为严重的边境武装冲突（1969 年 3 月 2 日外交部照会）, cite: rmrb-1969-03-03-zhenbao, quote: true }
    - { voice: official1966, text: 不管你们来多少人，不管你们联合什么人一起来，我们都要把你们坚决彻底干净全部消灭之。（1969 年 3 月 4 日两报社论《打倒新沙皇！》）, cite: ws-1969-03-04-new-tsar, quote: true }
    - { voice: witness, text: 一九六九年三月二日，珍宝岛战斗打响了。很快，陈锡联司令员就打来了电话（吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [rmrb-1969-03-03-zhenbao, ws-1969-03-04-new-tsar]

