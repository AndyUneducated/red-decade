  cites: [ws-1968-08-23-zhou-romania, rmrb-1968-08-24-czech]

- id: 1968-10-13-tianjin-wpt
  date: 1968-10-13
  title: 工宣队进驻“上层建筑”各单位
  lane: mass
  weight: 1
  place: 天津等地
  summary: 8 月 25 日中央通知各地“以优秀的产业工人为主体”组成工宣队，分批进驻大、中、小学，“先进大学，后进中，小学”。到 10 月，新华社报道天津工宣队已进驻“上层建筑领域的一千八百多个单位”，“用毛泽东思想对知识分子进行再教育”。这些单位此后由工宣队、军宣队主持清队和“斗、批、改”。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 整顿教育，时机到了。各地应该仿照北京的办法，把大中城市的大，中，小学校逐步管起来。（1968 年 8 月 25 日中央通知）, cite: ws-1968-08-25-wpt-schools, quote: true }
    - { voice: official1966, text: 工人阶级登上了上层建筑各个领域斗、批、改的政治舞台，用毛泽东思想对知识分子进行再教育（1968 年 10 月新华社电）, cite: rmrb-1968-10-14-tianjin-wpt, quote: true }
  cites: [ws-1968-08-25-wpt-schools, rmrb-1968-10-14-tianjin-wpt]

- id: 1968-10-14-fresh-blood
  date: 1968-10-14
  title: “吐故纳新”：整党建党开始
  lane: center
  weight: 1
  summary: 《红旗》社论《吸收无产阶级的新鲜血液》发表毛泽东关于整党的指示：“一个无产阶级的党也要吐故纳新，才能朝气蓬勃。”各地开始在工厂、学校试点恢复党组织生活，清除“叛徒、特务、死不改悔的走资派”出党，吸收造反派中的“优秀分子”入党，为九大召开作组织准备。同月八届十二中全会宣布把刘少奇“永远开除出党”。
  people: [mao-zedong, liu-shaoqi]
  voices:
    - { voice: doc, text: 一个无产阶级的党也要吐故纳新，才能朝气蓬勃。不清除废料，不吸收新鲜血液，党就没有朝气。（毛泽东，1968 年 10 月《红旗》社论引）, cite: ws-1968-10-fresh-blood, quote: true }
  cites: [ws-1968-10-fresh-blood]

- id: 1968-11-graduates
  date: 1968-11
  title: 1968 届大学毕业生“面向农村”分配
  lane: culture
  weight: 1
  summary: 中央通知 1968 年全国约十五万名大专毕业生从 11 月中旬开始分配，“一般都必须去当普通农民、普通工人，大量的必须去当普通农民”，不要强调专业对口，12 月底前必须报到，“过期不报到的，就不再分配工作”。1966—1968 届毕业生工资一律暂按临时标准发给，不转正定级；已进驻工宣队的学校由宣传队掌握分配大权。
  voices:
    - { voice: doc, text: 一般都必须去当普通农民、普通工人，大量的必须去当普通农民。（1968 年中央关于大专院校毕业生分配的通知）, cite: ws-1968-graduates, quote: true }
  cites: [ws-1968-graduates]

- id: 1968-12-29-nanjing-bridge
  date: 1968-12-29
  title: 南京长江大桥全线通车
  lane: econ
  weight: 2
  place: 南京
  summary: 南京长江大桥铁路桥 10 月 1 日先行通车，12 月 29 日公路桥通车，全桥建成。铁路桥长六千七百多米、公路桥四千五百多米，报道称它是“我国自行设计和建造的最大的现代化桥梁”，沟通了南北铁路和公路交通。几天前（12 月下旬）新的氢弹试验成功，报道把两件事都称为“无产阶级文化大革命的又一丰硕成果”。1981 年决议把大桥列为文革期间仍取得的成就，同时说“这一切决不是‘文化大革命’的成果”。
  voices:
    - { voice: official1966, text: 南京长江大桥铁路桥已于今年十月一日正式通车，公路桥于十二月二十九日举行通车典礼。至此，南京长江大桥全部建成，全线通车。（1968 年 12 月新华社电）, cite: rmrb-1968-12-30-bridge, quote: true }
    - { voice: official1981, text: 当然，这一切决不是“文化大革命”的成果，如果没有“文化大革命”，我们的事业会取得大得多的成就。（1981 年决议）, cite: ws-1981-resolution, quote: true }
  cites: [rmrb-1968-12-30-bridge, rmrb-1968-12-30-h-bomb, ws-1981-resolution]

# ── E4 补充：1969 年（边境冲突、对苏谈判、九大前后、林立果）
- id: 1969-01-01-mao-thought-command
  date: 1969-01-01
  title: 元旦社论：“用毛泽东思想统帅一切”
  lane: ideology
  weight: 1
  summary: 两报一刊元旦社论宣布文化大革命“已经取得了伟大的、决定性的胜利”，以八届十二中全会开除刘少奇、工农兵“登上上层建筑斗、批、改的政治舞台”和新的氢弹试验为证，号召以“用毛泽东思想统帅一切”迎接九大。社论引林彪的话：七亿人口“需要有一个统一的思想”，“这就是毛泽东思想”。
  people: [lin-biao, mao-zedong, liu-shaoqi]
  concepts: [mao-thought]
  voices:
    - { voice: official1966, text: 我国是一个伟大的无产阶级专政的社会主义国家，有七亿人口，需要有一个统一的思想，革命的思想，正确的思想，这就是毛泽东思想。（林彪，1969 年元旦社论引）, cite: ws-1969-01-01-mao-thought-command, quote: true }
  cites: [ws-1969-01-01-mao-thought-command]

- id: 1969-02-21-industry
  date: 1969-02-21
  title: 社论《抓革命，促生产，夺取工业战线的新胜利》
  lane: econ
  weight: 1
  summary: 经过 1967—1968 年的停产和武斗，两报一刊社论宣布工业“新发展”的“来势比人们预料的要快”，举新的氢弹试验、南京长江大桥通车、石油工业提前完成“三五”计划和“一九六八年下半年工业总产值，比上半年有大幅度的增长”为例，要求各厂矿“抓革命，促生产”，批判“资产阶级反动技术权威”。社论没有给出与 1966 年相比的数字。
  voices:
    - { voice: official1966, text: 随着无产阶级文化大革命的新胜利，工业生产的有计划、有步骤的新发展，已经在许多重要城市和地区出现。它的来势比人们预料的要快，它的基础比过去任何时候更深厚。（1969 年 2 月社论）, cite: rmrb-1969-02-21-production, quote: true }
  cites: [rmrb-1969-02-21-production]

- id: 1969-03-15-sum-up-experience
  date: 1969-03-15
  title: “要认真总结经验”：落实政策的号召
  lane: center
  weight: 1
  summary: 《红旗》社论《关于总结经验》发表毛泽东的新指示“要认真总结经验”，要了解运动的“全过程”，“从中找出规律性的东西”。新华社说二十九个省级单位连夜游行庆祝。各地革委会和宣传队据此“落实政策”、抓典型；同日珍宝岛发生第二次激战，报道把两件事放在一起。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 到一个单位去了解情况，要了解运动的全过程，开始怎样，后来怎样，现在怎样，群众是怎么搞的，领导是怎么搞的（毛泽东，1969 年 3 月新华社电引）, cite: rmrb-1969-03-16-policy, quote: true }
  cites: [rmrb-1969-03-16-policy]

- id: 1969-06-09-he-long-death
  date: 1969-06-09
  title: 贺龙在关押中去世
  lane: center
  weight: 2
  place: 北京
  summary: 原中央军委副主席、国务院副总理贺龙 1966 年被康生、林彪等指控“二月兵变”“篡军反党”，1967 年 9 月中央同意立案审查，审查一直由林彪、黄永胜、吴法宪、叶群、李作鹏把持。贺龙在关押期间于 1969 年 6 月 9 日去世。1974 年中央通知为他平反，说“二月兵变”“纯系讹传”；1980 年起诉书把他列为被迫害致死的领导人之一。
  people: [he-long, lin-biao, kang-sheng, ye-qun, wu-faxian, huang-yongsheng, li-zuopeng]
  voices:
    - { voice: officialLater, text: 在“九·一三”林彪事件发生以前，对贺龙同志问题的审查，一直为林彪、黄永胜、吴法宪、叶群、李作鹏等人所把持。（1974 年中央通知）, cite: ws-1974-he-long-name, quote: true }
    - { voice: judicial1980, text: 由贺龙的历史投敌叛变，联想贺龙现行反革命活动绝不会没有，可以由历史这个此，到现实这个彼（康生 1968 年语，1980 年起诉书引）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1974-he-long-name, ws-1980-indictment]

- id: 1969-06-10-barluk
  date: 1969-06-10
  title: 新疆巴尔鲁克山边境冲突
  lane: army
  weight: 1
  place: 新疆裕民县巴尔鲁克山
  summary: 珍宝岛冲突之后，中苏在西段边界再起冲突。新华社说 5 月 2 日起苏军出动坦克、装甲车进入巴尔鲁克山西部，干涉中国牧民放牧；6 月 10 日苏军绑走一名牧民，并“首先开枪射击，当场打死我女牧民一名”，中方边防人员“被迫进行了自卫还击”。
  voices:
    - { voice: official1966, text: 六月十日，苏修新沙皇指使其边防军侵入我新疆裕民县巴尔鲁克山西部地区，绑架和打死我牧民，制造了新的流血事件。（1969 年 6 月新华社通讯）, cite: rmrb-1969-06-12-barluk, quote: true }
  cites: [rmrb-1969-06-12-barluk, ws-1969-10-08-mfa-border]

- id: 1969-08-13-tieliekti
  date: 1969-08-13
  title: 铁列克提事件
  lane: army
  weight: 2
  place: 新疆裕民县铁列克提
  summary: 8 月 13 日上午，苏军出动直升机、数十辆坦克装甲车和数百名士兵，在新疆裕民县铁列克提与中国边防巡逻队交火。中国外交部当天照会说苏军进入中国境内“纵深达两公里”，“当场打死打伤中国边防战士多名”，并说苏方“正继续调集大批军队和坦克”。继珍宝岛之后，西段边界也爆发正面冲突。
  voices:
    - { voice: official1966, text: 一九六九年八月十三日上午，苏联方面出动直升飞机两架、坦克、装甲车数十辆和武装部队数百人，侵入中国新疆维吾尔自治区裕民县铁列克提地区纵深达两公里（1969 年 8 月 13 日外交部照会）, cite: rmrb-1969-08-14-tieliekti, quote: true }
    - { voice: witness, text: 一些人，特别是苏联军方，主张对我们实行空袭，甚至动用核武器，打击我们的核攻击力量（吴法宪回忆新疆冲突后苏联领导层的意见）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [rmrb-1969-08-14-tieliekti]

- id: 1969-09-04-ho-chi-minh
  date: 1969-09-04
  title: 胡志明逝世，周恩来赴河内吊唁
  lane: intl
  weight: 1
  place: 河内
  summary: 胡志明逝世。9 月 4 日中共中央发唁电，称他是“中国人民的亲密战友”，重申“七亿中国人民是越南人民的坚强后盾”；当天周恩来率叶剑英、韦国清飞赴河内吊唁。
  people: [zhou-enlai, ye-jianying, wei-guoqing]
  voices:
    - { voice: doc, text: 七亿中国人民是越南人民的坚强后盾，辽阔的中国领土是越南人民的可靠后方。（中共中央唁电引毛泽东语，1969 年 9 月 4 日）, cite: rmrb-1969-09-05-ho-condolence, quote: true }
  cites: [rmrb-1969-09-05-ho-condolence, rmrb-1969-09-05-zhou-hanoi]

- id: 1969-10-01-twentieth-anniversary
  date: 1969-10-01
  title: 国庆二十周年：“随时准备歼灭入侵之敌”
  lane: center
  weight: 1
  place: 北京天安门
  summary: 毛泽东、林彪在天安门检阅游行，林彪代表中央讲话。游行队伍以战备为主题：解放军方阵抬着“提高警惕，保卫祖国”“随时准备歼灭入侵之敌”的标语，“首都民兵师”打出“全民皆兵”，标语车写着毛泽东的话：“特别要反对以原子弹为武器的侵略战争”，“从现在起就要有所准备”。同期七部样板戏在首都再度公演。
  people: [mao-zedong, lin-biao]
  voices:
    - { voice: doc, text: 全世界人民团结起来，反对任何帝国主义，社会帝国主义发动的侵略战争，特别要反对以原子弹为武器的侵略战争！如果这种战争发生，全世界人民就应以革命战争消灭侵略战争，从现在起就要有所准备！（1969 年国庆标语车所写毛泽东语）, cite: rmrb-1969-10-02-national-day, quote: true }
  cites: [rmrb-1969-10-02-national-day, rmrb-1969-09-30-model-operas]

- id: 1969-10-07-border-talks
  date: 1969-10-07
  end: 1969-10-20
  title: 中国政府声明同意举行中苏边界谈判
  lane: intl
  weight: 2
  summary: 10 月 7 日中国政府发表声明，宣布中苏两国政府已商定在北京举行边界谈判，并提出在边界问题全面解决前“维持边界现状，避免武装冲突”，双方武装力量从一切争议地区“撤出或不进入，脱离接触”。次日外交部声明逐条反驳苏联 6 月 13 日声明。
  people: [zhou-enlai, lin-biao]
  voices:
    - { voice: doc, text: 在中苏边界问题通过和平谈判取得全面解决前，维持边界现状，避免武装冲突，中苏双方武装力量从中苏边界一切争议地区……撤出或不进入，脱离接触。（1969 年 10 月 8 日外交部声明重申）, cite: ws-1969-10-08-mfa-border, quote: true }
  cites: [ws-1969-10-08-mfa-border]

- id: 1969-10-18-lin-liguo-air-force
  date: 1969-10-18
  title: 吴法宪把空军指挥权交给林立果
  lane: army
  weight: 2
  place: 北京空军司令部
  summary: 10 月，林彪让空军司令员吴法宪任命其子林立果为空军司令部办公室副主任兼作战部副部长。10 月 18 日吴法宪召集林立果、王飞、周宇驰等，说“空军的一切都要向立果同志汇报，都可以由立果同志调动、指挥”。林立果随后组织“调研小组”，1970 年 10 月改称“联合舰队”，成为 1971 年政变计划的骨干。
  people: [lin-liguo, wu-faxian, lin-biao, wang-fei, zhou-yuchi, ye-qun]
  voices:
    - { voice: judicial1980, text: 空军的一切都要向立果同志汇报，都可以由立果同志调动、指挥。（吴法宪 1969 年 10 月 18 日语，1980 年起诉书引）, cite: ws-1980-indictment, quote: true }
    - { voice: witness, text: 我当时说这话的意思，是因为他可以直接向林彪汇报，可以直接接受林彪的指示，所以就不假思索地冲口出来了这“两个一切”（吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [ws-1980-indictment]

- id: 1969-08-15-jin-xunhua
  date: 1969-08-15
  end: 1969-12-06
  title: 知青金训华之死与“革命青年的榜样”
  lane: mass
  weight: 1
  place: 黑龙江逊克县双河大队
  summary: 上海吴淞二中 1968 届高中毕业生、原上海中学红代会常委金训华 1969 年 5 月到黑龙江逊克县插队，8 月 15 日在山洪中“为了抢救国家物资”溺亡，死后被追认为中共党员。年底《红旗》评论员和《人民日报》长文把他树为“革命青年的榜样”，说他实践了“活着就要拚命干，一生献给毛主席”的“钢铁誓言”。
  people: [jin-xunhua]
  voices:
    - { voice: official1966, text: 今年八月十五日，双河两岸山洪倾泻，金训华为了抢救国家物资，奋战山洪，不幸光荣牺牲。（1969 年 12 月《红旗》评论员）, cite: ws-1969-jin-xunhua, quote: true }
  cites: [ws-1969-jin-xunhua, rmrb-1969-12-06-jin-xunhua]

# ── E5 补充：1968 年专案与地方冤案（数字均为 1980 年特别检察厅起诉书口径）
- id: 1968-01-org-department
  date: 1968-01
  title: 中组部被定为“黑窝子”
  lane: center
  weight: 1
  summary: 起诉书说，1968 年 1 月康生指使中组部负责人郭玉峰列图表、写报告，把 1937 年以后历任中组部部长张闻天、陈云、彭真、邓小平、安子文都说成“叛徒”“特务”“三反分子”或“双料货”，先后担任过副部长的二十二人也被定为“叛徒”“特务”“里通外国分子”“三反分子”。报告说中组部是“黑窝子”，提出把它“彻底解散，宣布撤销”。
  people: [kang-sheng, zhang-wentian, chen-yun, peng-zhen, deng-xiaoping, an-ziwen]
  voices:
    - { voice: judicial1980, text: 一九六八年一月，康生指使郭玉峰，列图表，写报告，诬陷一九三七年以后历任中共中央组织部部长的张闻天、陈云、彭真、邓小平、安子文是“叛徒”、“特务”、“三反分子”或是“双料货”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1968-01-shanghai-committee
  date: 1968-01
  title: 上海市委被定为“黑班子”
  lane: local
  weight: 1
  place: 上海
  summary: 起诉书说，1968 年 1 月张春桥、姚文元把原上海市委定为“资产阶级顽固堡垒”“黑班子”，说第一书记陈丕显“是一个极其狡猾极其阴险的反革命两面派”，市长曹荻秋是“叛徒”。市委书记、市长、副市长和常委等十七人被定为“叛徒”“特务”“走资派”“反革命”，曹荻秋和副市长金仲华死亡。
  people: [zhang-chunqiao, yao-wenyuan, chen-pixian, cao-diqiu]
  voices:
    - { voice: judicial1980, text: 一九六八年一月，张春桥、姚文元诬陷中共上海市委是“资产阶级顽固堡垒”、“黑班子”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 曹荻秋和副市长金仲华被迫害致死。（同上）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1968-01-beijing-public-security
  date: 1968-01
  end: 1968-05
  title: 北京市委与“旧北京市公安局反革命集团”案
  lane: local
  weight: 1
  place: 北京
  summary: 起诉书说，1968 年 1 月康生指称北京市委书记刘仁和副市长冯基平、崔月犁“出卖党政军核心机密，叛党叛国”，批示“应将他们铐起来，进行严厉地突击地审讯”；5 月康生、谢富治又制造“以冯基平、邢相生为首的旧北京市公安局反革命集团”冤案。原北京市委书记七人、副市长六人全被定罪，刘仁、邓拓、吴晗、乐松生死亡。
  people: [kang-sheng, xie-fuzhi, liu-ren, deng-tuo, wu-han]
  voices:
    - { voice: judicial1980, text: 一九六八年一月，康生诬陷刘仁和副市长冯基平、崔月犁等，“出卖党政军核心机密，叛党叛国”并批示“对他们不能用一般对犯人的方法对待”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1968-01-21-zhao-jianmin
  date: 1968-01-21
  title: 云南“赵健民特务案”
  lane: local
  weight: 2
  place: 北京京西宾馆；云南
  summary: 起诉书说，康生在京西宾馆当面对云南省委书记赵健民说“你是个叛徒！”，“我凭四十年革命的经验，有这个敏感”，指他执行“国民党云南特务组的计划”，谢富治当场宣布逮捕。“赵健民特务案”随后在云南大范围株连，一万四千余人被迫害致死。
  people: [kang-sheng, xie-fuzhi]
  voices:
    - { voice: judicial1980, text: 康生、谢富治不准赵健民申辩，由谢富治当场宣布逮捕赵健民。在康生、谢富治的煽动下，制造了“赵健民特务案”，这个冤案使云南大批干部、群众遭到诬陷、迫害，一万四千余人被迫害致死。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 在全省开展追查赵健民“执行国民党云南特务组计划”中，造成大批干部群众被迫害致死致残，这篇文章起了极坏的欺骗、煽动作用（1982 年昆明市人民检察院涂晓雷案起诉书，指 1968 年 11 月 21 日《云南日报》文章）, cite: ws-1982-tu-xiaolei-case, quote: true }
    - { voice: editor, text: 涂晓雷案起诉书把云南的株连归到地方造反派写手身上：他与人合写的《批臭反革命黑“六论”，肃清“二月逆流”流毒》1968 年 11 月 21 日发表在《云南日报》，起诉书说他“对此严重后果”“负有罪责”；1980 年起诉书则把同一冤案归于康生、谢富治的煽动。, cite: ws-1982-tu-xiaolei-case }
  cites: [ws-1980-indictment, ws-1982-tu-xiaolei-case]

- id: 1968-04-north-china-mountaintop
  date: 1968-04
  title: 批判“华北山头主义”
  lane: army
  weight: 1
  summary: 起诉书说，1968 年 4 月林彪指令北京军区召开党委扩大会，批判所谓“华北山头主义”，派黄永胜、吴法宪、谢富治到会；江青、陈伯达说聂荣臻是它的“后台”。同年 11 月黄永胜说聂荣臻“这一辈子也没有干什么好事”。
  people: [nie-rongzhen, lin-biao, huang-yongsheng, wu-faxian, xie-fuzhi, jiang-qing, chen-boda]
  voices:
    - { voice: judicial1980, text: 一九六八年四月，林彪指令北京部队召开党委扩大会，策动批判所谓“华北山头主义”，并派黄永胜、吴法宪和谢富治参加。江青、陈伯达诬陷聂荣臻是“华北山头主义”的后台，阴谋打倒聂荣臻。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1968-06-wen-niansheng
  date: 1968-06
  title: 黄永胜以“文年生案”追查叶剑英
  lane: army
  weight: 1
  place: 广州
  summary: 起诉书说，黄永胜在广州制造陷害广州军区副司令员文年生等的冤案，1968 年 6 月借此追查“黑线”，把逼供得来的材料交给叶群，诬陷叶剑英等开“黑会”、“密谋发动反革命政变”。早在 1967 年 6 月，黄永胜已批准广州市公安局军管会调查叶剑英的“第一号调查方案”。
  people: [huang-yongsheng, ye-qun, ye-jianying]
  voices:
    - { voice: judicial1980, text: 一九六八年六月，黄永胜利用他在广州制造的陷害广州部队副司令员文年生等的冤案，追查“黑线”，将逼供取得的假材料交给叶群，诬陷叶剑英等开“黑会”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1968-07-21-kang-sheng-list
  date: 1968-07-21
  title: 康生给江青的八届中委“名单”
  lane: center
  weight: 2
  summary: 八届十二中全会前三个月，康生给江青写了一封绝密信：“送上你要的名单。”名单把八届中央委员、候补中央委员一百九十三人中的八十八人列为“特务”“叛徒”“里通外国分子”“反党分子”，另有七人列为“靠边站的尚未列入专案的”、二十九人列为“有错误的或历史上要考查的”，起诉书说其中绝大多数也先后受到诬陷、迫害。
  people: [kang-sheng, jiang-qing]
  voices:
    - { voice: judicial1980, text: 一九六八年七月廿一日，康生亲笔写了一封绝密信。信封上署明：“要件即呈江青同志亲启”。信中说：“送上你要的名单。”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 在康生亲笔写的这个名单中，中共第八届中央委员、候补中央委员一百九十三名，有八十八名被分别诬陷为“特务”、“叛徒”、“里通外国分子”、“反党分子”。（同上）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1968-08-23-political-reports
  date: 1968-08-23
  end: 1968-08-27
  title: 中监委、人大常委、政协常委的“政治情况报告”
  lane: center
  weight: 1
  summary: 起诉书说，康生、曹轶欧指使郭玉峰在五天内编出三份报告，后两份经康生亲笔修改、审定：八届中监委六十名委员、候补委员中三十七人，三届人大常委一百一十五人中六十人，四届政协常委一百五十九人中七十四人，被分别定为“叛徒”“特务”“反革命修正主义分子”“里通外国”等。名单上有委员长朱德，副委员长彭真、李井泉、林枫、刘宁一、张治中，以及胡耀邦、梁思成、华罗庚、茅以升、赵朴初等人。
  people: [kang-sheng, zhu-de, peng-zhen, hu-yaobang]
  voices:
    - { voice: judicial1980, text: 在这个报告中，一百一十五名全国人大常委会委员，有六十人被分别诬陷为“叛徒”、“叛徒嫌疑”、“特务”、“特务嫌疑”、“反革命修正主义分子、走资派、三反分子”、“有严重问题”。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1968-11-chen-yi-sayings
  date: 1968-11
  title: 上海编印《陈毅反动言论集》
  lane: center
  weight: 1
  place: 上海
  summary: 起诉书说，1968 年 11 月张春桥指使王洪文、徐景贤借为九大准备材料之名，编出《陈毅反动言论集》，在上海的“九大”代表学习班中散发，诬陷陈毅“投降帝修反”；同时搜集、编造了叶剑英、李先念、陈云、聂荣臻、李富春、谭震林等的材料七十六份、一千一百六十三页。
  people: [zhang-chunqiao, wang-hongwen, xu-jingxian, chen-yi, ye-jianying, li-xiannian, chen-yun, nie-rongzhen, li-fuchun, tan-zhenlin]
  voices:
    - { voice: judicial1980, text: 一九六八年十一月，张春桥指使王洪文、徐景贤等，借为中共第九次全国代表大会准备材料之名，编造所谓《陈毅反动言论集》，在上海的“九大”代表学习班中散发（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

# ── E6 补充：1968 年各省革委会、基层判决书、整党建党（维基文库）
- id: 1968-02-05-hebei-revcom
  date: 1968-02-05
  title: 河北省革委会成立：“华北山河一片红”
  lane: local
  weight: 1
  place: 河北
  summary: 2 月初河北省革命委员会成立，两报 2 月 5 日社论说整个华北地区至此都已建立革委会。社论把成功归于“大力办好毛泽东思想学习班”，引毛泽东“办学习班，是个好办法”的指示，并称“桃园经验”是“在中国赫鲁晓夫导演下，炮制出来的”。
  people: [liu-shaoqi]
  voices:
    - { voice: official1966, text: 至此，整个华北地区都已成立了三结合的革命委员会。（1968 年 2 月两报社论）, cite: ws-1968-02-hebei-revcom, quote: true }
    - { voice: official1966, text: 大力办好毛泽东思想学习班，是全面落实毛主席最新指示的关键。（同上）, cite: ws-1968-02-hebei-revcom, quote: true }
  cites: [ws-1968-02-hebei-revcom]

- id: 1968-03-27-zhejiang-revcom
  date: 1968-03-27
  title: 浙江省革委会成立
  lane: local
  weight: 1
  place: 浙江
  summary: 3 月下旬浙江省革命委员会成立。两报 3 月 27 日社论《紧跟毛主席就是胜利》特别提到毛泽东 1967 年“亲临浙江”视察，说浙江造反派在驻军支持下“排除来自右的和极‘左’方面的干扰”。社论强调浙江“地处海防前线”，要“严防一小撮叛徒、美蒋特务”挑拨离间。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 特别是去年毛主席亲临浙江，视察无产阶级文化大革命，这是对浙江军民最大的鼓舞，最大的教育，最大的鞭策。（1968 年 3 月两报社论）, cite: ws-1968-03-zhejiang-revcom, quote: true }
    - { voice: official1966, text: 浙江地处海防前线，阶级斗争尖锐复杂。（同上）, cite: ws-1968-03-zhejiang-revcom, quote: true }
  cites: [ws-1968-03-zhejiang-revcom]

- id: 1968-04-20-anhui-revcom
  date: 1968-04-20
  title: 安徽省革委会成立：“对派性要进行阶级分析”
  lane: local
  weight: 1
  place: 安徽
  summary: 4 月安徽省革命委员会成立，两报 4 月 20 日社论点名原省委第一书记李葆华、省长黄岩为“代理人”。社论不是一概反对派性，而是说“没有什么抽象的、超阶级的派性”，要坚持“无产阶级革命派的派性”，反对“保守派的派性”和“极‘左’派的派性”。同时提出当前要特别反对“右倾分裂主义，右倾投降主义，右倾保守主义”。
  people: []
  voices:
    - { voice: official1966, text: 我们必须坚持无产阶级革命派的派性，即坚持无产阶级先锋队的党性（1968 年 4 月两报社论）, cite: ws-1968-04-anhui-revcom, quote: true }
    - { voice: official1966, text: 当前，要特别警惕和坚决反对右倾分裂主义，右倾投降主义，右倾保守主义。（同上）, cite: ws-1968-04-anhui-revcom, quote: true }
  cites: [ws-1968-04-anhui-revcom]

- id: 1968-05-01-shaanxi-revcom
  date: 1968-05-01
  title: 陕西省革委会成立：“延安精神永放光芒”
  lane: local
  weight: 1
  place: 陕西
  summary: 5 月 1 日陕西省革命委员会成立。两报社论借毛泽东“延安还是西安”的比喻，把西北的“走资派”上溯到彭德怀、高岗、习仲勋、刘澜涛，称他们“拼凑了一套又一套黑班子”；文革中点名的“代理人”是刘澜涛、赵守一、李启明。
  people: [peng-dehuai, gao-gang, xi-zhongxun]
  voices:
    - { voice: official1966, text: 解放以后，中国赫鲁晓夫及其死党彭德怀、高岗、习仲勋、刘澜涛等党内一小撮走资派，怀着狼子野心，苦心经营，妄图在西北和陕西推翻社会主义，复辟资本主义。（1968 年 5 月两报社论）, cite: ws-1968-05-shaanxi-revcom, quote: true }
  cites: [ws-1968-05-shaanxi-revcom]

- id: 1968-05-10-liaoning-revcom
  date: 1968-05-10
  title: 辽宁省、沈阳市革委会成立大会致敬电
  lane: local
  weight: 1
  place: 沈阳
  summary: 辽宁省和沈阳市革委会成立大会给毛泽东发出长篇致敬电，从九一八、辽沈战役、抗美援朝一直讲到“一月革命”，以三遍“万寿无疆”结尾。电文说已把东北局、辽宁的马明方、顾卓新、喻屏、周桓等作为“大叛徒、大特务”揪出，并称林彪在东北“粉碎了”彭真的“右倾投降主义”。马明方等的“东北叛党集团”案见 1967 年条。
  people: [lin-biao, peng-zhen]
  voices:
    - { voice: official1966, text: 我们终于把中国赫鲁晓夫在东北和辽宁的代理人马明方、顾卓新、喻屏、周桓等大叛徒、大特务和党内一小撮走资派揪了出来（1968 年 5 月 10 日致敬电）, cite: ws-1968-05-liaoning-telegram, quote: true }
    - { voice: official1966, text: 敬祝您，我们伟大的导师，伟大的领袖，伟大的统帅，伟大的舵手万寿无疆！万寿无疆！（同上）, cite: ws-1968-05-liaoning-telegram, quote: true }
  cites: [ws-1968-05-liaoning-telegram, ws-1980-indictment]

- id: 1968-08-21-fujian-revcom
  date: 1968-08-21
  title: 云南、福建革委会相继成立
  lane: local
  weight: 1
  place: 福建；云南
  summary: 8 月云南、福建两省革委会相继成立，两报 8 月 21 日社论点名福建原省委第一书记叶飞和范式人、侯振亚。社论要求“认真做好清理阶级队伍的工作”“随时准备解放台湾”，并批判“多中心即无中心论”。社论同时转述毛泽东“工人阶级是领导阶级”的最新指示，要求工宣队进入福建的学校。云南此前发生的“赵健民特务案”见本年 1 月条。
  people: [ye-fei]
  voices:
    - { voice: official1966, text: 福建省革命委员会的成立，彻底粉碎了中国赫鲁晓夫及其在福建的代理人叶飞、范式人、侯振亚之流妄图复辟资本主义的迷梦。（1968 年 8 月两报社论）, cite: ws-1968-08-fujian-revcom, quote: true }
    - { voice: official1966, text: 我们一定要充分发动群众，认真做好清理阶级队伍的工作。（同上）, cite: ws-1968-08-fujian-revcom, quote: true }
  cites: [ws-1968-08-fujian-revcom]

- id: 1968-08-28-guangxi-revcom
  date: 1968-08-28
  title: 广西革委会成立
  lane: local
  weight: 2
  place: 广西
  summary: 8 月下旬广西壮族自治区革委会成立。两报 8 月 28 日社论点名陶铸、王任重和广西的贺希明、谢王岗，把此前的冲突说成阶级敌人“制造一系列反革命事件”，并驳斥“中国靠近边疆的省、区成立不了革命委员会”的说法。社论引用毛泽东刚提出的工厂“斗、批、改”几个阶段，要求“稳、准、狠地打击”各类“特务分子”。“七三布告”以后广西发生的大规模杀戮，这篇社论没有提及（见 7 月 3 日条）。
  people: [tao-zhu, wang-renzhong, wei-guoqing]
  voices:
    - { voice: official1966, text: 一小撮特务、叛徒、顽固不化的走资派、没有改造好的地、富、反、坏、右和其他反革命分子跳了出来，疯狂进行破坏活动，制造一系列反革命事件（1968 年 8 月两报社论）, cite: ws-1968-08-guangxi-revcom, quote: true }
    - { voice: official1966, text: 建立三结合的革命委员会，大批判，清理阶级队伍，整党，精简机构、改革不合理的规章制度、下放科室人员，工厂里的斗、批、改，大体经历这么几个阶段。（社论所引毛泽东指示）, cite: ws-1968-08-guangxi-revcom, quote: true }
  cites: [ws-1968-08-guangxi-revcom, ws-1968-07-03-notice]

- id: 1968-03-25-gaozhou-posters
  date: 1968-03-25
  end: 1969-03-01
  title: 高州县“地主”兄弟与陈焯的大字报案
  lane: local
  weight: 2
  place: 广东高州县根子公社
  summary: 1968 年 3 月 25 日，被划为地主的林煜谟、林煜训兄弟在公社门口贴大字报，说土改时本评为贫农，工作队为凑“地主富农的户数要达到总农户的百分之八”的指标把他们改划为“工商业兼富农”，合作化时又被“升为地主看待”，要求不再长期管制。随后 25 岁的地主出身学生陈焯也在公社门口贴出大字报，写到当地“滥捕滥杀成风”，呼吁“立即解放地主富农”。县革委会武装保卫组以“反革命”判陈焯有期徒刑二十年（自 1968 年 4 月 26 日起算），1969 年 3 月 1 日判林氏兄弟十八年和十五年。判决书写作林育模、林育训，与大字报署名用字不同；维基文库所录文本未注原件出处。
  people: []
  voices:
    - { voice: doc, text: 我们本来是贫农，我们要求公社和大队不可把我们当作地主长期管制下去了。（1968 年 3 月 25 日林氏兄弟大字报）, cite: ws-1969-03-01-gaozhou-lin, quote: true }
    - { voice: doc, text: 目今，滥捕滥杀成风，很多地方的五类分子及其子孙已被杀绝，路上伏尸道左及河中流尸逐波等等惨象，为世人有目所共睹（1968 年 4 月 8 日陈焯大字报）, cite: ws-gaozhou-chen-zhuo, quote: true }
    - { voice: doc, text: 本组为巩固无产阶级专政和打击阶级敌人的反动气焰，特判处林育模有期徒刑十八年，林育训有期徒刑十五年。（1969 年 3 月 1 日判决书）, cite: ws-1969-03-01-gaozhou-lin, quote: true }
  cites: [ws-1969-03-01-gaozhou-lin, ws-gaozhou-chen-zhuo]

- id: 1968-10-01-workers-national-day
  date: 1968-10-01
  title: 十九周年国庆：工人阶级队伍走在最前
  lane: mass
  weight: 1
  place: 北京天安门
  summary: 1968 年国庆，近万名各地工人代表与五十万首都群众参加庆典，游行队伍以工人为前导。新华社长篇报道把这一年的主题归结为“工人阶级主力军登上了上层建筑各个领域的政治舞台”，并以清华大学为例：7 月 27 日工宣队进驻，8 月 5 日收到芒果，8 月 15 日毛泽东接见其代表，两个月内“结束‘内战’不休的局面”。
  people: [mao-zedong, lin-biao]
  voices:
    - { voice: official1966, text: 同来自全国各地的近万名优秀工人代表以及首都五十万革命群众一道，欢庆伟大的中华人民共和国成立十九周年。（1968 年 10 月新华社）, cite: ws-1968-10-workers-loyal, quote: true }
    - { voice: official1966, text: 七月二十七日，毛主席派他们进驻清华大学；八月五日，毛主席就派人送来了最珍贵的礼物——芒果（同上）, cite: ws-1968-10-workers-loyal, quote: true }
  cites: [ws-1968-10-workers-loyal]

- id: 1968-10-canton-fair
  date: 1968-10
  title: 1968 年秋季广交会照常开幕
  lane: econ
  weight: 1
  place: 广州
  summary: 1968 年秋季中国出口商品交易会在广州开幕。10 月 21 日见报的评论称，苏联宣传“一次又一次地预言中国出口商品交易会开不成”，而交易会“一届又一届”照常举行，每届展出三万多种产品，并举出二十万倍电子显微镜等新产品。评论用大量篇幅讥讽苏联向西方出售黄金、求购小麦。
  people: []
  voices:
    - { voice: official1966, text: 自从无产阶级文化大革命以来，苏修叛徒集团的宣传机器，整天造谣撒谎，一次又一次地预言中国出口商品交易会开不成。（1968 年 10 月评论）, cite: ws-1968-autumn-fair, quote: true }
  cites: [ws-1968-autumn-fair]

- id: 1969-12-16-xinhua-printing
  date: 1969-12-16
  title: 北京新华印刷厂整党建党经验
  lane: center
  weight: 1
  place: 北京
  summary: 北京新华印刷厂是八三四一部队宣传队驻厂抓的典型，1969 年 5 月成立了新党委，12 月发表整党建党调查报告。报告提出把“证据确凿的叛徒、特务、死不改悔的走资派”作为“废料”清除，同时允许犯过错误的干部留党，并规定党委与革委会“是领导与被领导的关系”，党委不另设办事机构。报告还列出建立党委的四个条件，包括“进行过清理阶级队伍的工作，阶级阵线清楚”。
  people: []
  voices:
    - { voice: official1966, text: 他们根据新党章的规定，首先确定了党委会和革委会是领导与被领导的关系。（1969 年 12 月调查报告）, cite: ws-1969-xinhua-printing, quote: true }
    - { voice: official1966, text: 革委会成员大多数是党委会成员，革委会的办事机构就是党委会的办事机构，党委会不另设办事机构（同上）, cite: ws-1969-xinhua-printing, quote: true }
  cites: [ws-1969-xinhua-printing]

# ── E7 补充：1968–1969 年赤脚医生、知识分子再教育、落实政策，湖北、四川问题与集市管制（维基文库）
- id: 1968-09-barefoot-doctors
  date: 1968-09
  title: 《红旗》调查报告推广“赤脚医生”
  lane: culture
  weight: 2
  place: 上海川沙县江镇公社
  summary: 《红旗》发表上海郊区“赤脚医生”调查报告。报告说上海郊县 1960 年有大队卫生员三千九百多人，1961 年被砍到三百多人，1965 年毛泽东“把医疗卫生工作的重点放到农村去”的指示后重建到四千五百多人，平均每个大队一点八人。江镇公社二十八名赤脚医生平均二十三岁，多为小学或初中文化，一半时间参加劳动，每个社员一年只需补贴四、五分钱。报告据此主张医学院校从赤脚医生中招生，批评旧医学教育“脱离政治、脱离实践”。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: “赤脚医生”是上海郊区贫下中农对半农半医卫生员的亲热的称呼。（1968 年《红旗》调查报告）, cite: ws-1968-barefoot-doctors, quote: true }
    - { voice: official1966, text: 两个大队都有一千三百多人，平均每个贫下中农一年补贴“赤脚医生”四、五分钱。（同上）, cite: ws-1968-barefoot-doctors, quote: true }
  cites: [ws-1968-barefoot-doctors]

- id: 1968-09-12-reeducation
  date: 1968-09-12
  title: 评论员文章《关于知识分子再教育问题》
  lane: culture
  weight: 1
  summary: 《人民日报》《红旗》评论员文章阐发 9 月 5 日《红旗》编者按：对早已工作的大中专毕业生“要注意对他们进行再教育”，即由工农兵来改造“从资产阶级教育中接受的资产阶级思想”，并“分期分批地组织他们到工农兵中去”。文章同时强调“要给出路”，说“多数或大多数”旧学校出来的学生能同工农兵结合，“反革命分子、顽固派”是极少数。
  people: []
  voices:
    - { voice: official1966, text: 对过去大量的高等及中等学校毕业生早已从事工作及现正从事工作的人们，要注意对他们进行再教育（1968 年 9 月《红旗》编者按，评论员文章引）, cite: ws-1968-intellectual-reeducation, quote: true }
    - { voice: official1966, text: 不给出路的政策，不是无产阶级的政策（同上）, cite: ws-1968-intellectual-reeducation, quote: true }
  cites: [ws-1968-intellectual-reeducation]

- id: 1968-11-24-policy-editorial
  date: 1968-11-24
  title: 清队中“注意政策”：《新安徽报》社论被转载
  lane: ideology
  weight: 1
  summary: 《新安徽报》11 月 24 日社论说，有些人在清理阶级队伍和整党中“采取了一些十分简单、很不利于对敌斗争的作法”，并逐条批驳“只要大方向正确，具体政策嘛，怎样搞都行”“掌握、执行政策是上级的事”“讲政策会束缚群众的手脚”三种说法。社论被加编者按转载：“此文写得不错，现予转载，以供参考。”社论以贯彻八届十二中全会公报为名。
  people: []
  voices:
    - { voice: official1966, text: 在当前清理阶级队伍、整党建党和其它工作中，不注意政策问题，采取了一些十分简单、很不利于对敌斗争的作法。（1968 年 11 月《新安徽报》社论）, cite: ws-1969-commander-policy, quote: true }
    - { voice: official1966, text: 只要大方向正确，具体政策嘛，怎样搞都行。（社论批驳的说法）, cite: ws-1969-commander-policy, quote: true }
  cites: [ws-1969-commander-policy]

- id: 1969-05-06-qinghua-policy
  date: 1969-05-06
  title: 清华工军宣队文章批“宁‘左’勿右”
  lane: ideology
  weight: 1
  place: 清华大学
  summary: 九大闭幕后，驻清华大学工人、解放军毛泽东思想宣传队发表长文《为落实毛主席的无产阶级政策而斗争》，把清队、斗批改中的主要偏差归为“形‘左’实右或宁‘左’勿右”：不作区别、一律打击，“宁推勿拉”“宁挂勿放”，以“大方向正确”为由不执行政策。文章要求“一个人一个人地落实”政策，对“竹筒倒豆子”彻底坦白者从宽。
  people: []
  voices:
    - { voice: official1966, text: 没有区别对待，就没有政策。（1969 年 5 月驻清华工军宣队文章）, cite: ws-1969-policy-struggle, quote: true }
    - { voice: official1966, text: 坚持“宁推勿拉”、“宁挂勿放”等错误做法，难道能说是符合“大方向”的吗？（同上）, cite: ws-1969-policy-struggle, quote: true }
  cites: [ws-1969-policy-struggle]

- id: 1969-05-27-wuhan-anti-restoration
  date: 1969-05-27
  title: 中央纠正武汉“反复旧”
  lane: local
  weight: 2
  place: 武汉
  summary: 九大期间，武汉市工代会主要负责人和省市革委会个别成员发起“反复旧”运动，矛头指向革委会、军队和“三结合”干部。湖北省、武汉市革委会部分常委在北京开会，5 月 19 日见到毛泽东、林彪，25 日写出报告，承认清队中“个别单位甚至有逼、供、信和扩大化现象”，提出除有证据的现行反革命外“一个不杀，大部不抓”，并要求返城知青“返回农村”。中央 5 月 27 日批示同意，即此后文件中所称的“五·二七指示”。
  people: [lin-biao, mao-zedong]
  voices:
    - { voice: doc, text: 提出所谓“反复旧”运动，把矛头指向省、市革委会、人民解放军和革命干部，把三代会、首先是工代会置于一切之上。（1969 年 5 月 27 日中共中央批示）, cite: ws-1969-hubei-approval, quote: true }
    - { voice: doc, text: 除确有证据的杀人、放火、放毒等现行反革命分子应依法处理外，都应采取“一个不杀，大部不抓”的政策。（1969 年 5 月 25 日湖北省革委会报告）, cite: ws-1969-hubei-report, quote: true }
  cites: [ws-1969-hubei-approval, ws-1969-hubei-report]

- id: 1969-09-27-wuhan-underground
  date: 1969-09-27
  title: 中央取缔武汉“北斗星学会”“决派”，查封《扬子江评论》
  lane: local
  weight: 1
  place: 武汉
  summary: 中央对武汉问题的指示要求“五·二七”指示、“七·二三”布告、“八·二八”命令“不折不扣地执行”，把“北斗星学会”“决派”定为由“叛徒、特务、反革命分子”幕后操纵的地下组织并予取缔，查封群众刊物《扬子江评论》并审查其主要编写人员，下令逮捕王盛荣等三人，并在北京为湖北开办毛泽东思想学习班。
  people: []
  voices:
    - { voice: doc, text: 所谓《扬子江评论》，是一些叛徒、特务、反革命分子幕后操纵的反动刊物，肆无忌惮地大量放毒，必须查封。（1969 年中央指示）, cite: ws-1969-wuhan-instruction, quote: true }
    - { voice: doc, text: 对这类反革命的地下组织，必须坚决取缔。（同上）, cite: ws-1969-wuhan-instruction, quote: true }
    - { voice: officialLater, text: 毛主席曾经指出，湖北清查北、决、扬“搞过了一点”，就是说犯了扩大化的错误，错误的根子的在刘丰，省委也有责任。（1974 年中共中央关于湖北问题的指示）, cite: ws-1974-05-21-hubei-instructions, quote: true }
  cites: [ws-1969-wuhan-instruction, ws-1974-05-21-hubei-instructions]

- id: 1969-11-05-sichuan-meeting
  date: 1969-11-05
  end: 1969-12-24
  title: 四川省革委会在京检讨“支一派、压一派”
  lane: local
  weight: 2
  place: 北京；四川
  summary: 四川省革委会、成都军区负责人 11 月 5 日至 12 月 24 日在北京向中央汇报，报告承认“四川的革命和生产是落后了”，原因“在省革委的领导”：省革委“亲一派、疏一派，支一派、压一派”，以“红十条派”与“反红十条派”划线，致使“武斗不息”；也发动过“反复旧”；“个别领导人”大搞“以我为核心”。措施包括无条件收缴武器、禁用“兵团”“八·二六”“反到底”“红成”“八·一五”等派名、取消一切群众组织小报、改组《四川日报》，并请中央办五千人学习班。报告未点“个别领导人”的名。
  people: []
  voices:
    - { voice: doc, text: 落后的原因不在群众，在省革委的领导。（1969 年四川省革委会、成都军区党委报告）, cite: ws-1969-sichuan-report, quote: true }
    - { voice: doc, text: 今后一律不准用“兵团”、“八·二六”、“反到底”，“红成”、“八·一五”以及类似这两派群众组织的名称，发表讲话、文件，进行一切活动。（同上）, cite: ws-1969-sichuan-report, quote: true }
  cites: [ws-1969-sichuan-report]

- id: 1969-12-21-qionglai-market
  date: 1969-12-21
  title: 邛崃县革委会布告：打击投机倒把、改集市场期
  lane: econ
  weight: 1
  place: 四川邛崃县
  summary: 邛崃县革委会以“七·二三”布告、“八·二八”命令和战备为由发布布告：粮、棉、油料、烟、麻、糖、茶、木材、药材等统购派购物资和耕畜一律不准上市，社队产品不准进入集市，“农村社员不准弃农经商”，只有零星蔬菜、小猪、家禽等三类产品可在指定市场交易；同时废除原有场期，全县场镇一律改为“十天逢两场”。布告称目的是“堵死资本主义道路”。
  people: []
  voices:
    - { voice: doc, text: 农村社员不准弃农经商。（1969 年 12 月邛崃县革委会布告）, cite: ws-qionglai-market, quote: true }
    - { voice: doc, text: 决定废除原有的场期，全县大小场镇，一律改为十天逢两场（同上）, cite: ws-qionglai-market, quote: true }
  cites: [ws-qionglai-market]
