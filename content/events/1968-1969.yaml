  cites: [ws-1968-04-19-lin-zhao-death-sentence]

- id: 1968-05-clean-ranks
  date: 1968-05-25
  title: 清理阶级队伍
  lane: center
  weight: 3
  summary: 中共中央转发《北京新华印刷厂军管会发动群众开展对敌斗争的经验》，要求各地“有步骤地有领导地把清理阶级队伍这项工作做好”，“清理阶级队伍”在全国铺开。十月的八届十二中全会要求“认真做好清理阶级队伍的工作”。全国受害人数没有官方公布；北京市 1968 年 1 月至 1969 年 5 月底清队期间被打死和被迫害自杀的有 3731 人（1987 年北京市大事记）。
  people: [mao-zedong, kang-sheng, xie-fuzhi]
  voices:
    - { voice: official1966, text: 认真做好清理阶级队伍的工作，把混在广大群众中的一小撮反革命分子挖出来（1968 年八届十二中全会公报）, cite: rmrb-1968-11-02-twelfth-plenum, quote: true }
    - { voice: officialLater, text: 中共中央转发《北京新华印刷厂军管会发动群众开展对敌斗争的经验》，要求全国各地区、各单位“有步骤地有领导地把清理阶级队伍这项工作做好”。（1987 年《北京市“文化大革命”大事记》）, cite: ccrd-1987-bj-chronology-192, quote: true }
    - { voice: editor, text: 本条旧摘要还写有“毛泽东批示”的经验、审查对象扩大到历史问题和“五类分子”、各单位设“牛棚”专案组，出自党史著作；库内大事记只记中央转发，暂删。, cite: ccrd-1987-bj-chronology-192 }
  cites: [rmrb-1968-11-02-twelfth-plenum, ccrd-1987-bj-chronology-192]

# ── 1968 夏：停止武斗、工宣队 ────────────────────────────────
- id: 1968-07-03-notice
