  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 毛主席最近指出：“广大干部下放劳动，这对干部是一种重新学习的极好机会，除老弱病残者外都应这样做（1968 年 10 月《人民日报》）, cite: rmrb-1968-10-05-liuhe, quote: true }
    - { voice: official1966, text: 在‘五·七’干校，看到了我过去丢掉了的优良传统，找到了我过去忘掉了的优良作风。（1968 年 10 月新华社报道中的干校学员）, cite: ws-1968-10-may-seventh, quote: true }
  cites: [rmrb-1968-10-05-liuhe, ws-1968-10-may-seventh]

# ── 1968 秋冬：开除刘少奇、上山下乡 ──────────────────────────
