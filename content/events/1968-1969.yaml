    - { voice: witness, text: 四月二十八日下午，九届一中全会正式举行。毛泽东主持了这次会议，并提出了中央政治局、政治局常委会的全部候选人名单（吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [ws-1969-04-28-9th-cc-plenum]

- id: 1969-10-18-order-one
  date: 1969-10-17
  end: 1969-10-18
  title: 林彪“第一个号令”与战备疏散
  lane: army
  weight: 2
  summary: 中苏边界谈判代表团来京前，林彪 10 月 16 日到苏州，17 日口授加强战备、防止敌人突然袭击的紧急指示；18 日晚黄永胜向军委办事组传达，总参以“林彪副主席紧急战备指示（第一个号令）”下达各军区和海、空军。“九一三”后中央文件指它“竟不请示毛主席，党中央”，是“篡党夺权的预演”。经过据余汝信的研究，非一手档案。
  people: [lin-biao, huang-yongsheng, deng-xiaoping, chen-yun, zhu-de, ye-jianying, liu-shaoqi]
  voices:
    - { voice: scholar, text: 林彪于１０月１６日由北京抵达苏州，１０月１７日，口授了“关于加强战备，防止敌人突然袭击的紧急指示”（余汝信，2006 年）, cite: cnd-2006-yu-ruxin-1969-war-prep, quote: true }
    - { voice: official1966, text: 一九六九年十月十八日，林彪趁毛主席不在北京，擅自发布所谓‘林副主席指示第一个号令’，调动全军进入战备状态，这样的大事，竟不请示毛主席，党中央，实际上是一次篡党夺权的预演（1971 年中共中央文件，余汝信文引）, cite: cnd-2006-yu-ruxin-1969-war-prep, quote: true }
    - { voice: editor, text: 本条旧摘要还列有同月老干部疏散名单（朱德、董必武去广东，叶剑英去湖南，邓小平、陈云去江西，刘少奇送开封），出自党史著作，库内尚无原文，暂删。, cite: cnd-2006-yu-ruxin-1969-war-prep }
  cites: [cnd-2006-yu-ruxin-1969-war-prep]

- id: 1969-11-12-liu-death
  date: 1969-11-12
  title: 刘少奇死于开封
  lane: center
  weight: 3
  place: 河南开封
  summary: 1980 年十一届五中全会为刘少奇平反的决议说，他“早在一九六六年冬即被隔离和批斗”，“被完全剥夺了申辩的权利”；1969 年 10 月“于重病中被强行从北京押送到开封‘监护’”，11 月 12 日去世。决议决定“在适当时间”由中共中央商同全国人大常委会为他举行追悼会。
  people: [liu-shaoqi, wang-guangmei]
  voices:
    - { voice: officialLater, text: 一九六九年十月，于重病中被强行从北京押送到开封“监护”，同年十一月十二日被迫害含冤逝世（1980 年中共中央为刘少奇平反的决议）, cite: ws-1980-02-29-liu-rehab, quote: true }
    - { voice: witness, text: 一九六九年十一月十二日，在长期被折磨之后，刘少奇终于在河南开封含冤逝世（吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [ws-1980-02-29-liu-rehab]

- id: 1970-03-05-yu-luoke-executed
  date: 1970-03-05
  title: 遇罗克被枪决
  lane: culture
  weight: 2
  place: 北京工人体育场
  summary: 1966–67 年写作并油印《出身论》、反对“血统论”的遇罗克被捕（牟志京回忆是 1967 年底），在“一打三反”运动中于北京工人体育场公判大会上被判处死刑并立即执行，年二十七岁。牟志京说他起初被判刑 15 年，拒绝在判决书上签字，后来突然改判死刑。1979 年北京市中级人民法院宣告无罪。
  people: [yu-luoke, yu-luowen, mou-zhijing]
  concepts: [bloodline]
  voices:
    - { voice: doc, text: 判处现行反革命分子遇罗克死刑，立即执行（1970 年判决书）, cite: ws-1970-yu-luoke-death-sentence, quote: true }
    - { voice: witness, text: 遇罗克在1967年底被捕之后，曾被判刑15年，罗克拒在判刑书上签字，但不想忽然改判为死刑（牟志京《〈出身论〉与〈中学文革报〉》）, cite: mou-zhijing-chushenlun, quote: true }
  cites: [ws-1970-yu-luoke-death-sentence, mou-zhijing-chushenlun]

# ── E3 补充：1968 年（革委会、对外表态、教育革命、整党、工宣队）
- id: 1968-01-01-total-victory
  date: 1968-01-01
  title: 元旦社论：“夺取无产阶级文化大革命的全面胜利”
  lane: ideology
  weight: 1
  summary: 两报一刊元旦社论宣布文化大革命“已经在一九六七年取得了决定性的胜利”，1968 年的任务是“从思想上、政治上、经济上、组织上”夺取全面胜利。社论把毛泽东思想学习班、革委会的相继建立和导弹、氢弹试验都列为“形势大好”的证据，并要求“节约闹革命”，批判“反革命经济主义的歪风”。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 在我们伟大领袖毛主席的天才领导下，人类历史上第一次无产阶级文化大革命，已经在一九六七年取得了决定性的胜利。（1968 年元旦社论）, cite: ws-1968-01-01-total-victory, quote: true }
  cites: [ws-1968-01-01-total-victory]

- id: 1968-02-hubei-revcom
  date: 1968-02
  title: 湖北省革命委员会成立
  lane: local
  weight: 1
  place: 武汉
  summary: “七二〇事件”半年后，湖北省革委会在武汉成立。两报社论题为《长江万里起宏图》，说湖北造反派“彻底揭露了中国赫鲁晓夫及其在湖北的代理人王任重一伙”，并称赞驻军坚持“支左不支派”。
  people: [wang-renzhong, chen-zaidao, zeng-siyu]
  voices:
    - { voice: official1966, text: 他们在全国亿万军民的强大支持下，迎着阶级斗争的急风暴雨，彻底揭露了中国赫鲁晓夫及其在湖北的代理人王任重一伙，把党内一小撮走资派打得落花流水。（1968 年 2 月两报社论）, cite: ws-1968-02-hubei-revcom, quote: true }
  cites: [ws-1968-02-hubei-revcom, ws-1967-07-26-wuhan-notice]

- id: 1968-02-20-guangdong-revcom
  date: 1968-02-20
  title: 中央批准成立广东省革委会，黄永胜任主任
  lane: local
  weight: 2
  place: 广州
  summary: 中央批示同意成立 180 名委员的广东省革委会，由广州军区司令员黄永胜任主任、孔石泉任第一副主任，副主任中有陈郁、王首道等老干部和群众组织代表。批示说广东“揭出了以陶铸、赵紫阳为首的广东省党内一小撮走资本主义道路当权派”，并“批判了地方主义小集团企图翻案的阴谋活动”。起诉书说，此前的 1967 年 10 月，黄永胜和广州部队政委刘兴元已开始“审查”中共广东地下党，制造的“广东地下党”冤案使七千一百多人遭到诬陷、迫害，八十五人被迫害致死。
  people: [huang-yongsheng, tao-zhu, zhao-ziyang]
  voices:
    - { voice: doc, text: 揭出了以陶铸、赵紫阳为首的广东省党内一小撮走资本主义道路当权派，批判了地方主义小集团企图翻案的阴谋活动（1968 年 2 月 20 日中央批示）, cite: ws-1968-02-guangdong-revcom, quote: true }
  cites: [ws-1968-02-guangdong-revcom, ws-1980-indictment]

- id: 1968-03-30-revcom-good
  date: 1968-03-30
  title: 两报一刊社论《革命委员会好》
  lane: center
  weight: 2
  summary: 社论说全国已有十八个省、市、自治区成立革委会，并发表毛泽东的新指示：革委会的基本经验是有革命干部、军队、革命群众三方面的代表，“实现了革命的三结合”，要“实行一元化的领导，打破重叠的行政机构，精兵简政”。革委会由此定型为党政合一、军人主导的临时政权。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 革命委员会的基本经验有三条：一条是有革命干部的代表，一条是有军队的代表，一条是有革命群众的代表，实现了革命的三结合。（毛泽东，1968 年 3 月 30 日社论引）, cite: ws-1968-03-30-revcom-good, quote: true }
    - { voice: official1981, text: 各部门各地方的党政领导机构几乎都被夺权或改组（1981 年决议）, cite: ws-1981-resolution, quote: true }
  cites: [ws-1968-03-30-revcom-good, ws-1981-resolution]

- id: 1968-04-16-black-americans
  topics: [global]
  date: 1968-04-16
  title: 毛泽东发表支持美国黑人抗暴斗争的声明
  lane: intl
  weight: 1
  summary: 马丁·路德·金遇刺后，毛泽东发表声明，说“美国广大黑人同美国统治集团之间的矛盾，是阶级矛盾”，只有推翻美国垄断资产阶级的统治黑人才能彻底解放，并呼吁世界各国人民声援。这是 1963 年声明的续篇；此后几年的 4 月 16 日前后，国内报刊多次发文纪念。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 美国的种族歧视，是殖民主义、帝国主义制度的产物。美国广大黑人同美国统治集团之间的矛盾，是阶级矛盾。（毛泽东，1968 年 4 月 16 日）, cite: ws-1968-04-16-black-americans, quote: true }
  cites: [ws-1968-04-16-black-americans]

- id: 1968-05-25-france
  topics: [global]
  date: 1968-05-25
  title: 《人民日报》头版报道法国“五月风暴”
  lane: intl
  weight: 1
  summary: 法国学生运动和全国总罢工期间，新华社连日在《人民日报》头版报道，说“法国一千多万工人”坚持总罢工，巴黎青年“接连第三天同反动军警通宵浴血搏斗”，把西方的学潮当作“向腐朽的资本主义制度挑战”。同一时期国内的红卫兵已被要求回校“复课闹革命”，不久工宣队进校。
  voices:
    - { voice: official1966, text: 法国一千多万工人斗志昂扬，坚持全国总罢工。法国的经济生活继续陷于瘫痪状态。（1968 年 5 月 25 日新华社电）, cite: rmrb-1968-05-26-france, quote: true }
  cites: [rmrb-1968-05-26-france]

- id: 1968-05-27-men-he
  date: 1968-05-27
  title: 追授门合“无限忠于毛主席革命路线的好干部”
  lane: army
  weight: 1
  place: 青海
  summary: 中共中央、中央军委、中央文革发布命令，追授青海省军区某部副教导员门合称号，号召全军学习。命令说门合 1967 年 9 月 5 日在巴仓农场支左时，土火箭炸药意外爆炸，他扑上去保护了 27 人。命令特别表彰他“揭露了中国赫鲁晓夫推行‘三自一包’”、抵制“彭德怀、罗瑞卿的资产阶级军事路线”，并把他的誓言概括为“一切想着毛主席，一切服从毛主席，一切紧跟毛主席，一切为着毛主席”。
  people: [men-he]
  concepts: [mao-thought]
  voices:
    - { voice: official1966, text: 门合同志以他光辉的一生，实践了自己的誓言：一切想着毛主席，一切服从毛主席，一切紧跟毛主席，一切为着毛主席。（1968 年 5 月命令）, cite: rmrb-1968-05-28-men-he, quote: true }
  cites: [rmrb-1968-05-28-men-he]

- id: 1968-07-21-machine-tool
  date: 1968-07-21
  title: “七二一指示”：走上海机床厂的道路
  lane: culture
  weight: 2
  place: 上海机床厂
  summary: 新华社发出调查报告《从上海机床厂看培养工程技术人员的道路》，编者按发表毛泽东的指示：“大学还是要办的”，主要是理工科大学，但要缩短学制，“从有实践经验的工人农民中间选拔学生”，学几年后“又回到生产实践中去”。1970 年北大、清华的招生请示就引这段话，实行“群众推荐，领导批准和学校复审相结合的办法”。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 大学还是要办的，我这里主要说的是理工科大学还要办，但学制要缩短，教育要革命，要无产阶级政治挂帅，走上海机床厂从工人中培养技术人员的道路。（毛泽东，1968 年 7 月编者按引）, cite: rmrb-1968-07-22-machine-tool, quote: true }
  cites: [rmrb-1968-07-22-machine-tool, ws-1970-06-27-enrollment]

