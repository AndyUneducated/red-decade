  cites: [ws-1968-07-24-notice]

- id: 1968-07-28-five-leaders
  date: 1968-07-27
  end: 1968-07-28
  title: 工宣队进清华；毛泽东召见“五大领袖”
  lane: mass
  weight: 3
  place: 北京清华大学、人民大会堂
  summary: 7 月 27 日，根据毛泽东的决定，北京 61 个工厂企业近 3 万名工人组成“工农毛泽东思想宣传队”进入清华大学，制止武斗、收缴武器；蒯大富一派开枪、投掷手榴弹，5 名工人被打死，731 人受伤。次日凌晨毛泽东召见聂元梓、蒯大富、韩爱晶、谭厚兰、王大宾，说“现在是轮到你们小将犯错误的时候了”。人数与伤亡据 1987 年北京市大事记；谈话据五人 7 月 30 日整理公布的传达稿。
  people: [mao-zedong, kuai-dafu, nie-yuanzi, han-aijing, tan-houlan, wang-dabin, lin-biao, zhou-enlai, jiang-qing, chi-qun, xie-jingyi]
  voices:
    - { voice: doc, text: 现在是轮到你们小将犯错误的时候了。（1968 年 7 月 30 日五人整理的传达稿）, cite: marxists-1968-07-30-five-leaders, quote: true }
    - { voice: officialLater, text: 致使王松林、张旭涛、潘志鸿、韩忠现、李文元等5名工人惨遭杀害，731人受伤。（1987 年《北京市“文化大革命”大事记》）, cite: ccrd-1987-bj-chronology-192, quote: true }
    - { voice: editor, text: 传达稿是五人据自己的记录整理、经删减的要点，不是谈话全记录。本条旧摘要还写有“红卫兵运动由此结束，几位‘领袖’此后被分配到外地劳动、受审查”，库内尚无出处，暂删。, cite: marxists-1968-07-30-five-leaders }
  cites: [marxists-1968-07-30-five-leaders, ccrd-1987-bj-chronology-192]

- id: 1968-08-26-workers-lead
