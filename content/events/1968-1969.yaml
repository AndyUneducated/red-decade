# Events, 1968–1970 (M3-4 / M3-5): 清理阶级队伍、革委会遍及全国、工宣队、开除刘少奇、上山下乡、珍宝岛、九大、战备疏散。
# Sources: 1968–1969 《人民日报》头版（govopendata）、中央布告与文件（维基文库）、1980 起诉书、1981 决议。

# ── 1968 上半年 ─────────────────────────────────────────────
- id: 1968-01-whither-china
  date: 1968-01-06
  title: 杨曦光《中国向何处去？》
  lane: mass
  weight: 2
  place: 长沙
  summary: 长沙一中学生、“省无联”成员杨曦光（杨小凯）写成大字报《中国向何处去？》，认为文革的对象是“红色资本家阶级”，三结合革委会是“资产阶级篡权”，主张像巴黎公社那样建立“中华人民公社”。1 月 24 日周恩来、康生、陈伯达等接见湖南学习班，康生说文章“绝不是中学生，甚至不是大学生写的”，背后有“反革命黑手”；陈伯达称“省无联”是“反革命的大杂烩”。杨曦光随后被关押，1969 年 11 月判刑十年（据其本人回忆），1983 年湖南省高级法院宣告无罪。
  people: [yang-xiguang, kang-sheng, chen-boda, jiang-qing, zhou-enlai]
  concepts: [paris-commune]
  voices:
    - { voice: doc, text: 要实现“中华人民公社”就必须推翻这个阶级。（《中国向何处去？》）, cite: marxists-1968-01-yang-xiguang-whither-china, quote: true }
    - { voice: official1966, text: 他的理论，绝不是中学生，甚至不是大学生写的。他们背后有反革命黑手（1968 年 1 月 24 日康生讲话记录稿）, cite: ccrd-1968-01-24-hunan-reception, quote: true }
    - { voice: witness, text: 我被以反革命罪判处有期徒刑十年（杨小凯《我的一生》，2003 年口述）, cite: aisixiang-yang-xiaokai-my-life, quote: true }
    - { voice: editor, text: 本条旧摘要把 1 月 24 日的讲话者记为康生、陈伯达、江青；记录稿中讲话的是周恩来、康生、陈伯达，江青在场插话，改从记录稿。原文与讲话都是转录本，未核原件。, cite: ccrd-1968-01-24-hunan-reception }
  cites: [marxists-1968-01-yang-xiguang-whither-china, ccrd-1968-01-24-hunan-reception, aisixiang-yang-xiaokai-my-life, ws-1967-12-21-shengwulian-decision]

- id: 1968-03-yang-yu-fu
  date: 1968-03-22
  title: 杨成武、余立金、傅崇碧被撤职
  lane: army
  weight: 3
  summary: 中共中央决定撤销代总参谋长杨成武、空军政委余立金、北京卫戍区司令员傅崇碧的职务，余立金逮捕法办；黄永胜任总参谋长，温玉成兼北京卫戍区司令员，同时改组军委办事组。1979 年中共中央通知为“杨、余、傅事件”公开平反。经过据 1987 年北京市大事记。
  people: [yang-chengwu, yu-lijin, fu-chongbi, lin-biao, huang-yongsheng, ye-qun, wu-faxian, jiang-qing]
  voices:
    - { voice: officialLater, text: 中共中央决定，撤销杨成武人民解放军代总参谋长、余立金空军政委、傅崇碧北京卫戍区司令员的职务。（1987 年《北京市“文化大革命”大事记》）, cite: ccrd-1987-bj-chronology-192, quote: true }
    - { voice: officialLater, text: 中央已经查明，所谓“杨、余、傅事件”纯系林彪、“四人帮”反党集团制造的冤案（1979 年中共中央通知，大事记引）, cite: ccrd-1987-bj-chronology-192, quote: true }
    - { voice: editor, text: 本条旧摘要写的是 3 月 24 日林彪在人民大会堂万人大会上宣布撤职，以及 1974 年毛泽东说此事“搞错了”，出自党史著作；库内尚无原文，暂删。, cite: ccrd-1987-bj-chronology-192 }
  cites: [ccrd-1987-bj-chronology-192]

- id: 1968-04-26-neirendang
  topics: [ethnic-religion]
  date: 1968-04-26
  end: 1969-05-22
  title: 内蒙古“挖肃”与“内人党”冤案
  lane: local
  weight: 3
  summary: 内蒙古革委会向中央报告说“内蒙古人民革命党”案“初步突破”，要“采取大搞人民战争与专案相结合的方式”。此后在“挖乌兰夫黑线、肃乌兰夫流毒”中逼供株连，蒙古族干部群众首当其冲。1969 年 5 月毛泽东批示内蒙古“已经扩大化了”，中央下令纠正，滕海清离职。
  people: [teng-haiqing, ulanhu, kang-sheng, xie-fuzhi]
  voices:
    - { voice: doc, text: 为彻底揭开盖子，挖出这个叛国集团，采取大搞人民战争与专案相结合的方式，展开攻击（1968 年 4 月内蒙古给中央的报告）, cite: ws-1968-04-26-neirendang-report, quote: true }
    - { voice: doc, text: 以上情况是初步突破，除有些问题与我们已掌握的材料相同，某些情节与巴图交待吻合外，还不能完全肯定鲍荫扎布口供的可靠性（同一报告）, cite: ws-1968-04-26-neirendang-report, quote: true }
    - { voice: judicial1980, text: 内蒙古自治区因“内人党”等冤案，有三十四万六千多名干部、群众遭到诬陷、迫害，一万六千二百二十二人被迫害致死（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 报告本身承认口供“还不能完全肯定”，却决定立即拘留，并以“人民战争”方式扩大。起诉书的数字是官方 1980 年的统计，其他研究者的估计更高，本站不在此取舍。, cite: ws-1968-04-26-neirendang-report }
  cites: [ws-1968-04-26-neirendang-report, ws-1980-indictment]

- id: 1968-04-29-lin-zhao-executed
