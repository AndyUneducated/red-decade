- id: 1969-04-28-first-plenum
  date: 1969-04-28
  title: 九届一中全会：新的政治局常委
  lane: center
  weight: 2
  summary: 选举毛泽东为主席、林彪为副主席，政治局常委为毛泽东、林彪、陈伯达、周恩来、康生。陈伯达排在周恩来之前；一年后他因在庐山支持设国家主席而倒台。
  people: [mao-zedong, lin-biao, chen-boda, zhou-enlai, kang-sheng]
