  people: []
  voices:
    - { voice: official1966, text: 全国山河一片红，这极其壮丽的一幕，是夺取文化大革命全面胜利进程中的重大事件（1968 年 9 月两报社论）, cite: rmrb-1968-09-07-full-victory, quote: true }
    - { voice: official1981, text: 各部门各地方的党政领导机构几乎都被夺权或改组（1981 年决议）, cite: ws-1981-resolution, quote: true }
