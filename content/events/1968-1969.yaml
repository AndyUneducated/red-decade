  people: [lin-biao, mao-zedong, zhou-enlai, chen-boda, kang-sheng, jiang-qing, zhang-chunqiao, yao-wenyuan, ye-qun, huang-yongsheng, wu-faxian, li-zuopeng, qiu-huizuo, xie-fuzhi, wang-dongxing, ji-dengkui, li-desheng, chen-xilian, xu-shiyou]
