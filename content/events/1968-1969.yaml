  title: 姚文元《工人阶级必须领导一切》
  lane: ideology
  weight: 2
  summary: 姚文元在《红旗》发表文章，传达毛泽东“实现无产阶级教育革命，必须有工人阶级领导”的指示，宣布工人宣传队“永远领导学校”。工宣队、军宣队随后进驻全国大中学校和文化、科研单位，“斗、批、改”由他们主持。
  people: [yao-wenyuan, mao-zedong]
  voices:
    - { voice: official1966, text: 工人宣传队进入教育阵地，这是一件惊天动地的大事（1968 年 8 月姚文元文章）, cite: rmrb-1968-08-26-workers-lead, quote: true }
    - { voice: official1966, text: 单靠学生、知识分子不能完成教育战线的斗、批、改、及其他一系列任务，必须有工人、解放军参加，必须有工人阶级的坚强领导（同一文章）, cite: rmrb-1968-08-26-workers-lead, quote: true }
  cites: [rmrb-1968-08-26-workers-lead, ws-1968-09-01-news-front]

