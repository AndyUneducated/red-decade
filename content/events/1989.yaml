# Events, 1989 (人物第 15 批配套)：胡耀邦逝世、四二六社论、绝食、戒严、六月三至四日开枪清场、四中全会。
# Casualty figures are listed side by side by voice; the site does not pick one (2026-10-11 用户决定).

- id: 1989-04-15-hu-death
  date: 1989-04-15
  end: 1989-04-22
  title: 胡耀邦逝世，悼念变成游行
  lane: mass
  weight: 3
  place: 北京天安门广场
  summary: 胡耀邦 4 月 15 日病逝，北京高校学生到天安门广场送花圈，很快提出“重新评价胡耀邦同志的功过”、新闻自由、公布领导人收入等要求。4 月 22 日追悼会时数万学生聚集在人民大会堂外，三名学生跪递请愿书。官方报告说“学潮从一开始就被极少数人所操纵和利用”。
  people: [hu-yaobang, wang-dan, li-peng, zhao-ziyang]
  voices:
    - { voice: doc, text: 在“文化大革命”期间，他不顾个人安危，同林彪、江青反革命集团进行了不懈的斗争（1989 年 4 月 15 日中共中央讣告）, cite: rmrb-1989-04-16-hu-yaobang-obit, quote: true }
    - { voice: doc, text: １９８２年９月至１９８７年１月担任中央委员会总书记（同一讣告；没有提 1987 年 1 月辞职的原因）, cite: rmrb-1989-04-16-hu-yaobang-obit, quote: true }
    - { voice: officialLater, text: 4月15日胡耀邦同志的逝世，使酝酿已久的学潮和动乱提前爆发（1989 年陈希同报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: officialLater, text: 一是重新评价胡耀邦同志的功过，彻底否定1987年初中央对胡耀邦同志辞职的处理（1989 年李鹏报告，转述学潮的要求）, cite: ws-1989-06-zhao-errors-report, quote: true }
  cites: [rmrb-1989-04-16-hu-yaobang-obit, ws-1989-06-30-chen-xitong-report, ws-1989-06-zhao-errors-report]

- id: 1989-04-26-editorial
  date: 1989-04-26
  title: 《人民日报》四二六社论：“必须旗帜鲜明地反对动乱”
  lane: ideology
  weight: 3
  summary: 4 月 25 日邓小平在听取常委汇报时说这“不是一般的学潮，而是一场动乱”；次日《人民日报》社论据此定性。27 日北京十几万学生上街抗议社论。赵紫阳 5 月 4 日的讲话口径不同，官方事后认为这是他“分裂党”的开始；学生此后一再要求撤销社论的定性。
  people: [deng-xiaoping, li-peng, zhao-ziyang]
  voices:
    - { voice: officialLater, text: 《人民日报》4月26日的社论，体现了政治局常委的决定和邓小平同志的讲话精神，指明了动乱的性质（1989 年陈希同报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: doc, text: 常委并报小平同志，我完全同意小平同志就对付当前动乱问题所作出的决策（赵紫阳在朝鲜访问时给中央的回电，李鹏 6 月报告引）, cite: ws-1989-06-zhao-errors-report, quote: true }
    - { voice: officialLater, text: 但是，只过了两天，他突然改变了态度，指责根据常委决定写的《人民日报》社论定性错误，提出要加以纠正（李鹏 6 月报告，指赵紫阳 5 月 3 日起的态度）, cite: ws-1989-06-zhao-errors-report, quote: true }
  cites: [ws-1989-06-30-chen-xitong-report, ws-1989-06-zhao-errors-report]

- id: 1989-05-13-hunger-strike
  date: 1989-05-13
  end: 1989-05-19
  title: 天安门广场绝食
  lane: mass
  weight: 3
  place: 北京天安门广场
  summary: 戈尔巴乔夫来访前两天，数百名学生在广场开始绝食，人数很快增加到三千人，北京各界上百万人上街声援，中苏首脑会谈的欢迎仪式被迫改地点。5 月 18 日李鹏在人民大会堂会见王丹、吾尔开希等学生代表；19 日凌晨赵紫阳到广场看望绝食学生，说“我们来得太晚了”。
  people: [wang-dan, li-peng, zhao-ziyang, liu-xiaobo, yan-jiaqi]
  voices:
    - { voice: officialLater, text: 发动了一场历时7天、前后有3000多人参加的大绝食，从此长期占据了天安门广场（1989 年陈希同报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: officialLater, text: 在长达7天的绝食期间，没有发生一起学生因绝食而死亡的事件（同一报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
  cites: [ws-1989-06-30-chen-xitong-report]

- id: 1989-05-20-martial-law
  date: 1989-05-20
  title: 北京部分地区戒严
  lane: army
  weight: 3
  place: 北京
  summary: 5 月 17 日常委会讨论戒严，赵紫阳反对。19 日晚中央召开首都党政军干部大会，李鹏宣布“采取坚决果断措施”，赵紫阳没有出席。国务院宣布自 20 日上午 10 时起在北京部分地区戒严，但进城部队在各路口被市民和学生拦住，此后两周停在城外。
  people: [li-peng, zhao-ziyang, yang-shangkun, deng-xiaoping, chen-xitong, bao-tong]
  voices:
    - { voice: officialLater, text: 在极端紧急的情况下，中共中央、国务院断然决定于20日上午10时起在首都部分地区实行戒严（1989 年陈希同报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: officialLater, text: 赵紫阳同志顽固坚持同中央正确决策相对立的错误立场，既不同意和李鹏同志一道在大会上发表讲话，也不同意主持大会，甚至连出席一下大会都不同意（同一报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: doc, text: 每一位全国人大常委会委员，每一位全国人大代表，投下神圣的一票，废除戒严令，罢免李鹏总理职务（严家其、包遵信文章，陈希同报告引述）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
  cites: [ws-1989-06-30-chen-xitong-report, ws-1989-06-zhao-errors-report]

- id: 1989-06-04-crackdown
  date: 1989-06-03
  end: 1989-06-04
  title: 戒严部队开枪进城、清场天安门广场
  lane: army
  weight: 3
  place: 北京长安街、天安门广场
  summary: 6 月 3 日晚，戒严部队奉命从西、南、东几路向天安门广场强行开进，在木樨地、西单、六部口等处向阻拦的人群开枪，沿途有军车被烧、军人被打死。4 日凌晨部队包围广场，侯德健、刘晓波等人与部队谈判后，留在纪念碑周围的学生于清晨撤出。死亡人数至今没有官方的完整公布，下面把各方说法并列。
  people: [deng-xiaoping, li-peng, yang-shangkun, chen-xitong, yuan-mu, liu-xiaobo, ding-zilin, wang-dan]
  voices:
    - { voice: officialLater, text: 据现在掌握的情况，暴乱中有3000多名非军人受伤，200余人死亡，包括36名大学生（1989 年 6 月 30 日陈希同向全国人大常委会的报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: officialLater, text: 戒严部队战士、武警战士、公安干警负伤6000多人，死亡数十人（同一报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: officialLater, text: 由于“美国之音”造谣和一些人有意传谣，社会上一度盛传，戒严部队进城之后，“血洗天安门广场”，“有数千人甚至上万人倒在血泊之中”（同一报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
    - { voice: scholar, text: 1989年6月6日，国务院官员召开新闻发表会，发言人袁木表示，据初步统计，包括部队士兵、大学学生、非法分子和误杀群众在内，有近300人死亡（维基百科综述，原出处为当日新闻发布会报道）, cite: wp-1989-casualties, quote: true }
    - { voice: scholar, text: 1990年7月10日，中华人民共和国公安部向国务院提交的内部文件《有关各地动乱、暴乱中伤亡情况统计资料汇总》中统计，1989年整个事件期间全国共有931人死亡，2.2万余人受伤（维基百科综述，该文件未公开）, cite: wp-1989-casualties, quote: true }
    - { voice: witness, text: 合理数字应该是大约有50名士兵或警察死亡，以及400名至800名平民丧生（纪思道 1989 年 6 月 21 日《纽约时报》，维基百科转述）, cite: wp-1989-casualties, quote: true }
    - { voice: witness, text: 2017年底，英国国家档案馆解密的文件显示，有中国国务院职员（名字在文件中被涂黑）称1989年天安门事件至少造成1万多名平民死亡（维基百科转述 VOA 2017 年 12 月报道）, cite: wp-1989-casualties, quote: true }
    - { voice: witness, text: 天安门母亲运动确认的失踪与死伤者清单，1999年有155人、2005年有187人、2010年有195人……2011年8月有202人（遇难者家属逐一核实的名单，维基百科转述）, cite: wp-1989-casualties, quote: true }
    - { voice: editor, text: 这些数字的口径不同：陈希同和袁木的是 6 月初的官方统计，公安部文件是事后的内部汇总，外国电报和记者的是当时的估计，天安门母亲的是按姓名核实的下限。本站并列而不取其一。, cite: wp-1989-casualties }
  cites: [ws-1989-06-30-chen-xitong-report, wp-1989-casualties, wp-tiananmen-mothers, ws-1989-06-05-letter-to-all]

- id: 1989-06-24-fourth-plenum
  date: 1989-06-23
  end: 1989-06-24
  title: 十三届四中全会：撤销赵紫阳全部职务，江泽民任总书记
  lane: center
  weight: 3
  summary: 全会认定赵紫阳“犯了支持动乱和分裂党的错误”，撤销其总书记、常委、政治局委员、中央委员和军委第一副主席职务，“对他的问题继续进行审查”；选举江泽民为总书记，增选江泽民、宋平、李瑞环为政治局常委。此后各地开始清查，参与学潮的人被逮捕、通缉或流亡。
  people: [zhao-ziyang, jiang-zemin, li-ruihuan, li-peng, deng-xiaoping, bao-tong]
  voices:
    - { voice: officialLater, text: 赵紫阳同志在关系党和国家生死存亡的关键时刻犯了支持动乱和分裂党的错误，对动乱的形成和发展负有不可推卸的责任（1989 年十三届四中全会公报）, cite: ws-1989-06-24-fourth-plenum, quote: true }
    - { voice: officialLater, text: 选举江泽民同志为中央委员会总书记（同一公报）, cite: ws-1989-06-24-fourth-plenum, quote: true }
  cites: [ws-1989-06-24-fourth-plenum, ws-1989-06-zhao-errors-report]
