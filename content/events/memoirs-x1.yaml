# X1 据回忆录补的事件。回忆录是 3 级出处，摘要写明“据某某回忆”；有官方文件或判决的并列。

- id: 1962-07-25-beidaihe-work-conference
  date: 1962-07-25
  end: 1962-08-24
  title: 北戴河中央工作会议：批“包产到户”
  lane: center
  weight: 2
  place: 北戴河
  summary: 1962 年 7 月 25 日至 8 月 24 日中共中央在北戴河召开工作会议，8 月 26 日至 9 月 23 日又在北京开八届十中全会的预备会议。据戚本禹回忆，会上毛泽东严厉批评党内一部分人的“包产到户”主张；此前田家英让他把群众来信编成《关于群众对“包产到户”的意见》，通过《群众反映》送中央领导参考，谭震林在这份专辑上批示，说编辑“在为资本主义呼喊，要追查”。戚本禹 8 月 25 日的工作日记记下田家英回京后的传达：会上不少人把“包产到户”批为“两条道路问题”，谭震林最起劲；田家英说自己发了一个“滑头发言”。会议之后是 9 月的八届十中全会。经过只有戚本禹的回忆和日记。
  people: [mao-zedong, tian-jiaying, tan-zhenlin, qi-benyu]
  voices:
    - { voice: witness, text: 北戴河中央工作会议上毛主席严厉批评党内一部分人的“包产到户”的主张（戚本禹回忆）, cite: marxists-qibenyu-2-14-beidaihe, quote: true }
    - { voice: witness, text: 会上不少人批判“包产到户”主张，说这是两条道路问题。谭震林最起劲（戚本禹 1962 年 8 月 25 日工作日记，记田家英的传达）, cite: marxists-qibenyu-2-15-diary, quote: true }
    - { voice: witness, text: 他在北戴河会议上发言一小时，但他没有昧着良心去批判人家“包产到户”是两条道路的斗争（同日日记记田家英语）, cite: marxists-qibenyu-2-15-diary, quote: true }
  cites: [marxists-qibenyu-2-14-beidaihe, marxists-qibenyu-2-15-diary]

- id: 1966-11-16-industry-forum
  date: 1966-11-16
  title: 全国工交座谈会：“十五条”被否定，改出“十条”
  lane: econ
  weight: 2
  place: 北京
  summary: 据戚本禹回忆，1966 年 11 月 16 日起中央召开全国工交座谈会，平时由陶铸主持，余秋里、谷牧、国务院各部部长、各省市管工业的书记和中央文革小组成员参加。会议否定了中央文革小组提出的“十二条”，由余秋里、谷牧组织起草《工交企业进行文化大革命的若干规定》（“十五条”），要求工矿企业的文化大革命仍按“四清”部署进行，不搞“四大”，不搞串连，坚持八小时生产。毛泽东否定“十五条”后，周恩来主持以陈伯达的“十二条”为基础起草，补充为十条；林彪主持常委会讨论时说这次工交会“开得不好”，要“来个180度的大转变”。戚本禹说陶铸与中央文革小组的矛盾在这次会上公开化。会议经过只有戚本禹的回忆，“十二条”“十五条”原文库内没有。最后定稿的《中共中央关于抓革命、促生产的十条规定（草案）》于 12 月 9 日下发（中发〔66〕603 号），保留了“坚持八小时工作制”，但允许工人在业余时间“在本市革命串联”，学生也可以到厂矿串联。
  people: [tao-zhu, chen-boda, zhou-enlai, lin-biao, mao-zedong, qi-benyu]
  voices:
    - { voice: witness, text: 工矿企业的文化大革命仍按“四清”部署结合进行，分期分批，正面教育，不搞“四大”，不搞串连，坚持八小时生产（戚本禹回忆“十五条”的要求）, cite: marxists-qibenyu-3-16-anting, quote: true }
    - { voice: witness, text: 这次工交会开得不好，一些人的思想很不对头，需要来个180度的大转变（林彪语，戚本禹回忆）, cite: marxists-qibenyu-3-16-anting, quote: true }
    - { voice: witness, text: 到1966年11月16日召开的工交座谈会上，陶铸和中央文革小组的矛盾就公开化了（戚本禹回忆）, cite: marxists-qibenyu-3-18-tao-zhu, quote: true }
    - { voice: doc, text: 各单位工人群众之间、工人群众组织之间，可以在业余时间，在本市革命串联，交流文化革命经验（“十条”第十条）, cite: ws-1966-12-09-industry-ten, quote: true }
  cites: [marxists-qibenyu-3-16-anting, marxists-qibenyu-3-18-tao-zhu, ws-1966-12-09-industry-ten]

- id: 1966-11-13-academies-rally
  date: 1966-11-13
  title: 工人体育场十万人大会：老帅动员外地军队院校学员离京
  lane: army
  weight: 1
  place: 北京工人体育场
  summary: 据吴法宪回忆，外地来京的军事院校学员冲击驻京军事机关，经林彪同意，军委在 1966 年 11 月 13 日下午于北京工人体育场召开十万人大会，请贺龙、陈毅、徐向前、叶剑英四位老帅出席，动员学员各自回本单位搞运动。大会由总政治部主任萧华、副主任刘志坚主持，陈毅在讲话中批评学员“无组织、无纪律”，说打砸抢“不叫‘文化大革命’，这叫破坏”。吴法宪又记陈伯达后来指责萧华请老帅开这次大会“都不通知中央文革一声”。经过只有吴法宪的回忆。
  people: [chen-yi, he-long, xu-xiangqian, ye-jianying, xiao-hua, lin-biao, wu-faxian, chen-boda]
  voices:
    - { voice: witness, text: 搞路线斗争，第一要顾全大局（陈毅讲话，吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
    - { voice: witness, text: 他说，这种行为是极端错误的，这不叫“文化大革命”，这叫破坏（吴法宪记陈毅讲话）, cite: wu-faxian-memoir-cwo, quote: true }
    - { voice: witness, text: 你请四位老帅参加首都十万人大会，动员军事院校的师生离京，都不通知中央文革一声（陈伯达指责萧华，吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [wu-faxian-memoir-cwo]

- id: 1967-01-jingxi-hotel-meeting
  date: 1967-01
  title: 京西宾馆军委扩大会议：陈伯达批萧华，叶剑英拍桌
  lane: army
  weight: 2
  place: 北京京西宾馆
  summary: 据吴法宪回忆，1967 年 1 月上旬经毛泽东同意，中央军委在京西宾馆召开扩大会议，由林彪委托叶剑英主持，“破天荒地一直开了三个月”，用开会的名义把各地被揪斗的军队领导人接到北京保护起来；会议首先制定《中共中央关于不得把斗争锋芒指向军队的通知》，1 月 14 日下发，后来又有 1 月 28 日的“军委八条”。会上中央文革小组的陈伯达批评总政治部主任萧华领导军队运动不力。戚本禹转述关锋的话说，叶剑英、聂荣臻当场指责陈伯达想把军队搞乱，叶剑英拍桌时伤了手掌；叶剑英随后向林彪告状，林彪在毛家湾对江青大发脾气。萧华此后被关押七年。批萧华的日期两说不一：戚本禹记在 1967 年 1 月这次会议上，吴法宪说“大约是在一九六七年二月十九日”的一次小型会议；本条从戚本禹，只到月。
  people: [ye-jianying, xiao-hua, chen-boda, guan-feng, nie-rongzhen, xu-xiangqian, lin-biao, jiang-qing, wu-faxian, qi-benyu]
  voices:
    - { voice: witness, text: 这个会议破天荒地一直开了三个月（吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
    - { voice: witness, text: 萧华是个‘资产阶级政客’，他把部队的政治工作引导到了资产阶级的轨道上去了（陈伯达语，吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
    - { voice: witness, text: 叶剑英不买账，对着徐向前拍桌子，反驳陈伯达。拍的时候不小心，拍在了桌上放着的一个茶杯盖上，又用力过猛，据说他的手掌骨折了（戚本禹转述关锋）, cite: marxists-qibenyu-3-20-jingxi, quote: true }
    - { voice: witness, text: 叶剑英告状以后，林彪就把江青叫到毛家湾去大发了一顿脾气，把一个小茶几都推翻了（戚本禹回忆）, cite: marxists-qibenyu-3-20-jingxi, quote: true }
    - { voice: editor, text: 吴法宪说批萧华“大约是在一九六七年二月十九日”，戚本禹把它放在 1967 年 1 月的军委常委扩大会议上，两人都是事后回忆，戚本禹本人不在场。, cite: wu-faxian-memoir-cwo }
  cites: [wu-faxian-memoir-cwo, marxists-qibenyu-3-20-jingxi]

- id: 1967-01-04-down-with-tao-zhu
  date: 1967-01-04
  title: 陈伯达、江青公开批评陶铸，街头出现“打倒陶铸”
  lane: center
  weight: 2
  place: 北京
  summary: 据戚本禹回忆，1966 年 12 月 27、28 日陈伯达在周恩来主持的会上说陶铸与刘少奇、邓小平是一伙的，江青也说要打倒陶铸；叶剑英等人向毛泽东告状，29 日上午毛泽东在会上批评了陈伯达、江青。1967 年 1 月 4 日下午，陈伯达、康生、江青接见“武汉赴广州专揪王任重造反兵团”时公开批评陶铸，5 日讲话印成传单，大街上贴满“打倒陶铸”的标语。戚本禹又说，毛泽东 1 月 8 日在一次中央会议上说陶铸“不老实”，2 月 6 日、10 日两次在会上批评陈伯达、江青“突然袭击”，但陶铸最终仍被打倒。经过只有戚本禹的回忆；同年 9 月姚文元发表《评陶铸的两本书》。
  people: [tao-zhu, chen-boda, jiang-qing, kang-sheng, mao-zedong, ye-jianying, wang-renzhong, qi-benyu]
  voices:
    - { voice: witness, text: 1月5日，陈伯达、江青的讲话就已印成传单公开，大街上贴满了“打倒陶铸”的大标语（戚本禹回忆）, cite: marxists-qibenyu-3-18-tao-zhu, quote: true }
    - { voice: witness, text: 陈伯达你这是“一个政治局常委要打倒另一个政治局常委”，是“突然袭击”（毛泽东语，戚本禹回忆）, cite: marxists-qibenyu-3-18-tao-zhu, quote: true }
    - { voice: witness, text: 说陶是邓小平介绍到中央来的，这个人不老实（戚本禹回忆毛泽东 1967 年 1 月 8 日讲话）, cite: marxists-qibenyu-3-18-tao-zhu, quote: true }
  cites: [marxists-qibenyu-3-18-tao-zhu]

- id: 1967-01-08-yan-hongyan-death
  date: 1967-01-08
  title: 云南省委第一书记阎红彦自杀
  lane: local
  weight: 1
  place: 昆明
  summary: 据吴法宪回忆，1967 年 1 月 8 日阎红彦白天被揪斗七八个小时，晚上打电话给中央请求保护，陈伯达回电话让他“还是出来见群众”；他出来后被群众揪住不放，当天深夜自杀。吴法宪写的是“第二天一出来”“当天深夜”，按字面死期应在 1 月 9 日，库里人物条目记为 1 月 8 日，此处暂按人物条目。经过只有吴法宪的回忆。
  people: [yan-hongyan, chen-boda]
  voices:
    - { voice: witness, text: 你还是出来见群众，不要怕（陈伯达回阎红彦电话，吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
    - { voice: witness, text: 陈伯达的一个电话，就送了阎红彦的命（吴法宪回忆当时的议论）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [wu-faxian-memoir-cwo]

- id: 1967-04-30-mao-unity-meeting
  date: 1967-04-30
  title: 毛泽东召集老帅、副总理开“团结会”
  lane: center
  weight: 1
