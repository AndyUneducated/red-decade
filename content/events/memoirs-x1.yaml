  summary: 据吴法宪回忆，“二月逆流”之后，1967 年 4 月 30 日晚毛泽东请周恩来、李富春、徐向前、聂荣臻、李先念等人到住所开“团结会”。周恩来当晚拟订“五一”首都庆祝大会的领导人名单，名单里有李富春等人，毛泽东批准后他们次日都上了天安门城楼。吴法宪说，当时在报纸上露面就意味着“站出来”了。经过只有吴法宪的回忆。
  people: [mao-zedong, zhou-enlai, li-fuchun, xu-xiangqian, nie-rongzhen, li-xiannian]
  voices:
    - { voice: witness, text: 只要参加了重大活动并且在报纸上一露面，就意味着“站出来”了（吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [wu-faxian-memoir-cwo]

- id: 1967-11-27-ninth-congress-consultation
  date: 1967-11-27
  title: 中央通报征询召开“九大”的意见
  lane: center
  weight: 1
  place: 北京
  summary: 据吴法宪回忆，1967 年 11 月 27 日中共中央、中央文革发出《关于对征询召开“九大”的意见的通报》，说多数人建议 1968 年国庆节前开“九大”，会后接着开人大，罢免刘少奇、解决国家主席问题。“九大”没有按期召开，毛泽东改为先开八届十二中全会解决刘少奇问题。通报原文未见，此处只据吴法宪的转引。
  people: [liu-shaoqi, mao-zedong]
  voices:
    - { voice: witness, text: 关于‘九大’开会的时间，多数同志建议明年秋天国庆节前召开（吴法宪转引通报）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [wu-faxian-memoir-cwo]

- id: 1970-07-31-lin-liguo-report
  date: 1970-07-31
  title: 林立果在空军作“讲用报告”
  lane: army
  weight: 1
