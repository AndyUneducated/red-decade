    - { voice: witness, text: 那天，江青一个人从上午九点一直说到了十二点，一气说了三个小时（吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [wu-faxian-memoir-cwo]

- id: 1970-08-14-constitution-group-dispute
  date: 1970-08-14
  title: 宪法修改小组争论设不设国家主席
  lane: center
  weight: 1
  place: 北京中南海
  summary: 据吴法宪回忆，1970 年 8 月 14 日下午宪法修改小组在怀仁堂开会，实际只有康生、张春桥和吴法宪在场。康生主张不设国家主席，吴法宪坚持要设，相持不下，康生说各自保留意见，提交政治局。吴法宪又要在国务院一章写上毛泽东思想是“一切工作的指导方针”，张春桥反对，说“有人口口声声说天才地，全面地，创造性地发展了马列主义”，吴法宪认为这是冲着林彪的《毛主席语录》再版前言，当场与张春桥争吵。九天后九届二中全会在庐山开幕。经过只有吴法宪的回忆。
  people: [wu-faxian, kang-sheng, zhang-chunqiao, chen-boda, lin-biao]
  voices:
    - { voice: witness, text: 那就各自保留意见吧，以后提交政治局讨论（康生语，吴法宪回忆）, cite: wu-faxian-memoir-cwo, quote: true }
