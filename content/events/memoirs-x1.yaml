  summary: 据吴法宪回忆，九大闭幕后不久的 1969 年 5 月 17 日早上，叶群通知黄永胜、吴法宪、李作鹏、邱会作到江青住的钓鱼台十一号楼开会，姚文元、李德生也在，连江青共七个政治局委员。江青要大家不作记录，从上午九点一个人讲到十二点，先讲自己的经历和与毛泽东的婚姻。经过只有吴法宪的回忆。
  people: [jiang-qing, ye-qun, huang-yongsheng, wu-faxian, li-zuopeng, qiu-huizuo, yao-wenyuan, li-desheng]
