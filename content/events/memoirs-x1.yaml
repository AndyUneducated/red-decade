  summary: 1976 年“反击右倾翻案风”时，国务院政治研究室起草的《论全党全国各项工作的总纲》、科学院《汇报提纲》和《工业二十条》被批为“三株大毒草”。据邓力群回忆，邓小平复出前的 1977 年 5 月 24 日同王震和邓力群谈话，说《论总纲》是最近才看到的，“是香花，不是毒草”，又说这些文章也有缺点。经过只有邓力群的回忆。
