  summary: 据吴法宪回忆，1970 年 7 月 31 日空军政委王辉球召集空军司令部、政治部二级部长以上干部，听林立果作学习毛泽东著作的“讲用报告”，差不多讲了一整天；王辉球、王飞讲话给予很高评价，王飞又宣传吴法宪说过的“两个一切”。吴法宪事后听了录音，觉得口气太大，但打电话对叶群说这是在空军放了一颗“政治卫星”。录音后来在空军“三代会”上播放。经过只有吴法宪的回忆。
  people: [lin-liguo, wu-faxian, wang-fei, zhou-yuchi, ye-qun]
  voices:
    - { voice: witness, text: 他的这个报告讲得很好，是在空军放了一颗“政治卫星”（吴法宪回忆自己对叶群说的话）, cite: wu-faxian-memoir-cwo, quote: true }
    - { voice: witness, text: 我感觉林立果讲话的口气太大（吴法宪回忆听录音的感觉）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [wu-faxian-memoir-cwo]

- id: 1969-01-25-luo-ruiqing-amputation
  date: 1969-01-25
  title: 罗瑞卿在三〇一医院截肢
  lane: army
  weight: 1
  place: 北京
  summary: 罗瑞卿 1966 年 3 月跳楼自杀未遂，受审查期间做了截肢手术。吴法宪在回忆录里引一篇报道说，1969 年 1 月 25 日由三〇一总院副院长曹根慧主持为罗瑞卿截肢，因股骨头已坏死，截肢后又切除了股骨。吴法宪认为这段描述“基本属实”，并说为罗瑞卿做手术的几位医生“九一三事件”后都被捕了。经过只有吴法宪的回忆和他转引的报道。
  people: [luo-ruiqing]
  voices:
    - { voice: witness, text: 一九六九年一月二十五日，由总院副院长曹根慧主持罗瑞卿大将的截肢手术（吴法宪转引的报道）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [wu-faxian-memoir-cwo]

- id: 1969-05-17-jiang-qing-diaoyutai-talk
  date: 1969-05-17
  title: 江青在钓鱼台召集黄吴李邱等谈话
  lane: center
