# ── 1966 年 5 月 五一六 ─────────────────────────────────────
- id: 1966-05-04-politburo
  date: 1966-05-04
  end: 1966-05-26
  title: 政治局扩大会议：彭罗陆杨被定为“反党集团”
  lane: center
  weight: 3
  place: 北京
  summary: 讨论“彭真、陆定一、罗瑞卿、杨尚昆四同志的错误问题”。5 月 16 日通过《通知》。会上林彪讲话大谈“政变”（俗称“五一八讲话”）。
  people: [peng-zhen, luo-ruiqing, lu-dingyi, yang-shangkun, lin-biao, liu-shaoqi]
  voices:
    - { voice: official1981, text: 一九六六年五月中央政治局扩大会议和同年八月八届十一中全会的召开，是“文化大革命”全面发动的标志。, cite: ws-1981-resolution, quote: true }
    - { voice: judicial1980, text: 一九六六年五月，林彪捏造罪名，诬陷陆定一是“反革命分子”。, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 当时的文件称之为“错误问题”，1981 年决议称之为“所谓‘彭真、罗瑞卿、陆定一、杨尚昆反党集团’”；起诉书则只追究林彪、江青一方对其中个人的诬陷，不涉及会议本身。, cite: ws-1981-resolution }
  cites: [ws-1966-05-16-notice-attachment@1966-05-04, ws-1981-resolution, ws-1980-indictment]

