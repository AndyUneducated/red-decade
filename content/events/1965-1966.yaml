- id: 1966-07-29-activists-meeting
  date: 1966-07-29
  title: 人民大会堂师生大会：刘少奇“我也不晓得”
  lane: center
  weight: 1
  place: 人民大会堂
  summary: 北京大专院校和中学师生文化革命积极分子大会。李雪峰宣布市委撤销大中学校全部工作组，邓小平、周恩来、刘少奇讲话。刘少奇说“派工作组是中央决定的，中央同意的”，又说“革命怎么革”，“我也不晓得”。讲话文本是当时群众组织的记录稿，非正式文件。
  people: [liu-shaoqi, deng-xiaoping, zhou-enlai, li-xuefeng]
  voices:
    - { voice: doc, text: 你们问我们革命怎么革，我老实回答你们，我也不晓得（刘少奇讲话记录稿）, cite: ccrd-1966-07-29-liu-shaoqi-speech, quote: true }
    - { voice: officialLater, text: 李雪峰在北京市大专学校和中等学校师生文化大革命积极分子大会上宣布：根据中央和毛主席指示，市委作出了撤销大专学校和中等学校所有工作组的决定。（1987 年《北京市“文化大革命”大事记》）, cite: ccrd-1987-bj-chronology-192, quote: true }
    - { voice: editor, text: 本条旧题作“刘少奇‘老革命遇到新问题’”。库内刘少奇讲话记录稿中没有这句话，说话人与出处待查，故改题。, cite: ccrd-1966-07-29-liu-shaoqi-speech }
  cites: [ccrd-1966-07-29-liu-shaoqi-speech, ccrd-1987-bj-chronology-192]

# ── 1966 年 8 月 十一中全会与红八月 ─────────────────────────
- id: 1966-08-01-plenum
  date: 1966-08-01
  end: 1966-08-12
  title: 八届十一中全会
  lane: center
  weight: 3
  place: 北京
  summary: 通过《十六条》和公报。改选政治局常委：林彪成为唯一副主席，刘少奇由第二降至第八。首都高等院校“革命师生的代表”列席会议。
  people: [mao-zedong, lin-biao, liu-shaoqi, zhou-enlai, deng-xiaoping, tao-zhu, chen-boda, kang-sheng]
  concepts: [successor, mao-thought]
  docs: [ws-1966-08-12-plenum-communique, ws-1966-08-08-sixteen-points]
  voices:
    - { voice: doc, text: 全会一致决定：由把毛泽东思想伟大红旗举得最高、活学活用毛主席著作最好的林彪同志，作为毛主席的第一位助手和毛主席的接班人。（刘少奇检讨）, cite: ws-1966-10-liu-self-criticism, quote: true }
    - { voice: official1981, text: 对所谓“彭真、罗瑞卿、陆定一、杨尚昆反党集团”和对所谓“刘少奇、邓小平司令部”进行了错误的斗争，对党中央领导机构进行了错误的改组。, cite: ws-1981-resolution, quote: true }
  cites: [ws-1966-08-12-plenum-communique, ws-1966-10-liu-self-criticism, ws-1981-resolution]

- id: 1966-08-05-bombard
  date: 1966-08-05
  title: 毛泽东《炮打司令部——我的一张大字报》
  lane: center
  weight: 3
  summary: 全文不足 300 字，不点名地指“从中央到地方的某些领导同志”在“五十多天里”实行“白色恐怖”，并“联系到一九六二年的右倾和一九六四年形'左'而实右的错误倾向”。8 月 7 日印发全会。
  people: [mao-zedong, liu-shaoqi, deng-xiaoping]
  concepts: [bourgeois-hq, two-lines]
  docs: [ws-1967-08-bombard-anniv]
  voices:
    - { voice: doc, text: 联系到一九六二年的右倾和一九六四年形“左”而实右的错误倾向，岂不是可以发人深醒的吗？, cite: ws-1967-08-bombard-anniv, quote: true }
    - { voice: official1966, text: 一年后的周年社论将其解释为揭露了“以中国赫鲁晓夫为首的资产阶级司令部”——原文并无此语。, cite: ws-1967-08-bombard-anniv }
    - { voice: official1981, text: 党内根本不存在所谓以刘少奇、邓小平为首的“资产阶级司令部”。, cite: ws-1981-resolution, quote: true }
  cites: [ws-1967-08-bombard-anniv, ws-1981-resolution]

- id: 1966-08-05-bian-zhongyun
  date: 1966-08-05
  title: 卞仲耘被学生打死
  lane: mass
  weight: 2
  place: 北京师范大学女附中
  summary: 副校长卞仲耘在校内批斗中被殴打致死。工作组撤离后，北京中学的暴力迅速升级。库内尚无当时的文件；经过出自该校学生王友琴 1986 年的亲历回忆，非一手档案。
  people: [bian-zhongyun]
  voices:
    - { voice: witness, text: 五个“黑帮”，五个学校的领导，从厕所被揪到了操场。, cite: wangyouqin-1986-female-barbarity, quote: true }
    - { voice: witness, text: 当时学校“文化革命委员会”的副主席，一个高中三年级的学生，在广播喇叭里说，昨天晚上，校长死了。当然，她不说“校长”，而是说的女校长的姓名，她说“死了”，而不说“打死了”。, cite: wangyouqin-1986-female-barbarity, quote: true }
  cites: [wangyouqin-1986-female-barbarity]

- id: 1966-08-08-sixteen-points
  date: 1966-08-08
  title: 《十六条》通过
  lane: center
  weight: 3
  summary: “这次运动的重点，是整党内那些走资本主义道路的当权派。”“要用文斗，不用武斗。”“大学、专科学校、中学和小学学生中的问题，一律不整。”规定文化革命委员会成员“要象巴黎公社那样，必须实行全面的选举制”。
  people: [mao-zedong, chen-boda]
  concepts: [capitalist-roaders, four-olds, verbal-struggle, paris-commune, mass-democracy, mao-thought]
  docs: [ws-1966-08-08-sixteen-points]
  voices:
    - { voice: doc, text: 在进行辩论的时候，要用文斗，不用武斗。, cite: ws-1966-08-08-sixteen-points, quote: true }
    - { voice: official1981, text: 这两次会议相继通过了《五·一六通知》和《关于无产阶级文化大革命的决定》, cite: ws-1981-resolution, quote: true }
    - { voice: editor, text: 1981 年决议把《十六条》与《五一六通知》并列为“全面发动的标志”，没有提及其中“要用文斗，不用武斗”“一律不整”等约束条款；这些条款在 8–9 月几乎没有被执行（见“红八月”）。, cite: ws-1981-resolution }
  cites: [ws-1966-08-08-sixteen-points, ws-1981-resolution]

- id: 1966-08-12-communique
  date: 1966-08-12
  title: 十一中全会公报
  lane: center
  weight: 2
  summary: 宣布“毛泽东同志是当代最伟大的马克思列宁主义者”，“活学活用，学用结合，急用先学，立竿见影”的学习方法“应当进一步在全党全国推广”。国际部分称苏共新领导“实行没有赫鲁晓夫的赫鲁晓夫修正主义”。
  concepts: [mao-thought, revisionism, khrushchev]
  docs: [ws-1966-08-12-plenum-communique]
  cites: [ws-1966-08-12-plenum-communique]

- id: 1966-08-11-lei-yingfu
  date: 1966-08-11
  end: 1966-08-14
  title: 叶群口授雷英夫诬陷刘少奇材料
  lane: army
  weight: 1
  summary: 据 1980 年起诉书，叶群两次找总参作战部副部长雷英夫口授材料；8 月 14 日林彪让雷以写信形式附上材料，“这样更政治化些”，当天批送江青“酌转”毛泽东。
  people: [ye-qun, lin-biao, jiang-qing, liu-shaoqi]
  voices:
    - { voice: judicial1980, text: 林彪在他的住处告诉雷英夫，用给林彪和毛泽东主席写信的形式，附上诬陷材料，由他批转毛泽东主席，并说“这样更政治化些”。, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1966-08-18-first-rally
  date: 1966-08-18
  title: 天安门第一次接见红卫兵
  lane: mass
  weight: 3
  place: 天安门广场
  summary: 毛泽东清晨五时穿军装走进广场人群，与“百万革命群众”在一起六个多小时。林彪代表毛泽东讲话：“我们要大破一切剥削阶级的旧思想，旧文化，旧风俗，旧习惯……要把……资产阶级反动权威，彻底打倒，打垮，使他们威风扫地，永世不得翻身！”师大女附中一名红卫兵（宋彬彬）为毛泽东戴上红卫兵袖章，“几万个系着红袖章的‘红卫兵’”在城楼和广场维持秩序。至 11 月 26 日共八次接见。
  people: [mao-zedong, lin-biao, zhou-enlai, song-binbin]
  concepts: [four-olds, rebellion, reactionary-authority]
  docs: [ws-1966-08-18-lin-speech, rmrb-1966-08-18-zhou-speech, rmrb-1966-08-19-first-rally]
  voices:
    - { voice: doc, text: 我们坚决地支持你们敢闯、敢干、敢革命、敢造反的无产阶级革命精神！, cite: ws-1966-08-18-lin-speech, quote: true }
    - { voice: official1966, text: 在大会进行中，师大女附中一个“红卫兵”，登上天安门城楼给毛主席戴上了“红卫兵”的袖章。, cite: rmrb-1966-08-19-first-rally, quote: true }
    - { voice: official1966, text: 这个运动规模很大，确实把群众发动起来了，对全国人民的思想革命化有很大的意义。（毛泽东对林彪语，新华社电）, cite: rmrb-1966-08-19-first-rally, quote: true }
    - { voice: doc, text: 无论是北京市的革命师生，还是各地的革命师生，主要的任务都是把本单位的文化大革命搞好，一要斗好，二要批好，三要改好。（周恩来）, cite: rmrb-1966-08-18-zhou-speech, quote: true }
    - { voice: editor, text: 十天前的《十六条》要求“文斗”、“一律不整”学生；林彪讲话则要使打击对象“永世不得翻身”。同一个月里，成文政策的约束与动员性话语并行。, cite: ws-1966-08-08-sixteen-points }
    - { voice: editor, text: 同一讲台上，周恩来把任务限定在“本单位”的斗批改，并要求首都学生“好好接待客人”；全篇没有“造反”二字，而林彪讲话开头就是“敢造反”。两篇讲话由《人民日报》同版刊出。, cite: rmrb-1966-08-18-zhou-speech }
    - { voice: official1981, text: 对毛泽东同志的个人崇拜被鼓吹到了狂热的程度。, cite: ws-1981-resolution, quote: true }
  cites: [ws-1966-08-18-lin-speech, rmrb-1966-08-18-zhou-speech, rmrb-1966-08-19-first-rally, ws-1966-red-flag-index, ws-1981-resolution]

- id: 1966-08-red-august
  date: 1966-08-19
  end: 1966-09-30
  title: “红八月”：破四旧、抄家与打人
  lane: mass
  weight: 3
  place: 北京及全国城市
  summary: 红卫兵上街改街名、砸文物、抄家、批斗、殴打。8 月下旬首都红卫兵纠察队西城指挥部第四号通令规范对“地、富、反、坏、右、资黑六类”抄家，限其 9 月 10 日前离京回原籍，同时规定“国家负责干部的家绝对不许查”。
  people: []
  concepts: [four-olds, bloodline, verbal-struggle]
  docs: [ws-1966-08-xicheng-4, ws-1966-08-23-very-good]
  voices:
    - { voice: official1966, text: “红卫兵”小将们以毛泽东思想为武器，正在横扫一切剥削阶级的旧思想、旧文化、旧风俗、旧习惯的灰尘。……好得很！, cite: ws-1966-08-23-very-good, quote: true }
    - { voice: doc, text: 不是黑六类的家一律不查！国家负责干部的家绝对不许查！（西城纠察队第四号通令）, cite: ws-1966-08-xicheng-4, quote: true }
    - { voice: editor, text: 通令要求“文斗”、“一切缴获要归公”，却以出身划定查抄对象并驱逐出京——这正是《出身论》所批判的“偷换概念”：把斗争矛头从“当权派”转向“黑六类”。, cite: ws-1967-yu-origin-theory }
    - { voice: official1981, text: “文化大革命”初期被卷入运动的大多数人，是出于对毛泽东同志和党的信赖，但是除了极少数极端分子以外，他们也不赞成对党的各级领导干部进行残酷斗争。, cite: ws-1981-resolution, quote: true }
    - { voice: editor, text: 1981 年决议全文没有出现“红卫兵”“抄家”“武斗”“四旧”；1980 年起诉书中“抄家”三次都指对刘少奇、彭罗陆杨等干部或张春桥的特务组织，“红卫兵”两次是“冒充红卫兵”和“交红卫兵审判”。红八月以出身为界的抄家、殴打与驱逐，在两份定论文件中都没有位置（C013）。, cite: ws-1981-resolution }
  cites: [ws-1966-08-xicheng-4, ws-1966-08-23-very-good, ws-1981-resolution, ws-1980-indictment]

- id: 1966-08-23-lao-she
  date: 1966-08-23
  title: 老舍在孔庙遭批斗，次日投湖
  lane: culture
  weight: 2
  place: 北京国子监孔庙、太平湖
  summary: 红卫兵在孔庙焚烧市文化局收存的戏装，把文化局、文联的干部、作家和戏曲艺术家约 30 人押到火场，罚跪抽打，老舍头部被打出血。他次日离家未归，8 月 25 日早晨尸体在太平湖被发现。孔庙经过见 1987 年北京市大事记；投湖经过出自王友琴的调查，非一手档案。
  people: [lao-she]
  voices:
    - { voice: officialLater, text: 将文化局系统领导干部赵鼎新、张梦庚等，著名作家老舍、肖军、骆宾基、端木蕻良等，著名戏曲艺术家荀慧生、白芸生等共约30人，押送到孔庙火场，命令跪在火堆周围，轮番抽打。老舍头部被打出血。（1987 年《北京市“文化大革命”大事记》）, cite: ccrd-1987-bj-chronology-192, quote: true }
    - { voice: scholar, text: 第三天，8月25日早晨，在西城区太平湖上发现了老舍的尸体。（王友琴《文革受难者》）, cite: wangyouqin-lao-she, quote: true }
    - { voice: judicial1980, text: 著名作家、艺术家老舍、赵树理、周信芳、盖叫天、潘天寿、应云卫、郑君里、孙维世等迫害致死。, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 起诉书把老舍之死列入林彪、江青集团的罪责，但没有给出日期和经过；孔庙批斗的实施者是红卫兵学生，这一层在起诉书中不出现。1987 年大事记写的是“红卫兵”，同样没有写投湖。, cite: ccrd-1987-bj-chronology-192 }
  cites: [ccrd-1987-bj-chronology-192, wangyouqin-lao-she, ws-1980-indictment]

