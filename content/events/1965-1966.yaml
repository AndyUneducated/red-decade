- id: 1966-10-01-national-day
  date: 1966-10-01
  title: 国庆：《红旗》社论首提“资产阶级反动路线”
  lane: ideology
  weight: 3
  place: 北京
  summary: 《红旗》第 13 期社论《在毛泽东思想的大路上前进》首次公开提出“资产阶级反动路线”，号召“必须彻底批判”，并把《十六条》说成“两条路线斗争的产物”。同日林彪讲话说“破剥削阶级的四旧，立无产阶级的四新”，“四旧”已不加引号。
  people: [lin-biao, mao-zedong]
  concepts: [two-lines, four-olds]
  docs: [ws-1966-10-01-mao-thought-road, ws-1966-10-01-lin-speech]
  voices:
    - { voice: doc, text: 对资产阶级反动路线，必须彻底批判。, cite: ws-1966-10-01-mao-thought-road, quote: true }
    - { voice: editor, text: 此前 1966 年的已收文本中没有这一说法，被指控者刘少奇在 10 月 23 日检讨中也不用它（C011）。 }
  cites: [ws-1966-10-01-mao-thought-road, ws-1966-10-01-lin-speech]

- id: 1966-10-09-shanghai-raid
  date: 1966-10-09
