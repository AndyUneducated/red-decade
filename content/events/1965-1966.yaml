  people: [jiang-qing, ye-qun]
  voices:
    - { voice: judicial1980, text: 江腾蛟回上海后，组织四十多人，冒充红卫兵，于十月九日凌晨，搜查了赵丹、郑君里、童芷苓、陈鲤庭和顾而已的家。, cite: ws-1980-indictment, quote: true }
  cites: [ws-1980-indictment]

- id: 1966-10-work-conference
  date: 1966-10-09
  end: 1966-10-28
  title: 中央工作会议：批判“资产阶级反动路线”
  lane: center
  weight: 3
  summary: 10 月 16 日陈伯达讲话点名：“提出错误路线的，是错误路线的代表人，即刘少奇和邓小平”，同时批判“自来红”、“高干子弟要掌权”与血统论。10 月 23 日刘少奇、邓小平作检讨。刘少奇检讨的结构——“五十多天”、“一九六二年右倾”、“一九六四年形'左'实右”——与《炮打司令部》的三项指控一一对应。
  people: [liu-shaoqi, deng-xiaoping, chen-boda, lin-biao]
  concepts: [two-lines, bloodline]
  docs: [web-1966-10-16-chen-speech, ws-1966-10-liu-self-criticism]
  voices:
    - { voice: doc, text: 提出错误路线的，是错误路线的代表人，即刘少奇和邓小平，他们要负主要责任。（陈伯达）, cite: web-1966-10-16-chen-speech, quote: true }
    - { voice: doc, text: 我在一九六二年犯了右倾机会主义路线性的错误之后，在一九六四年又犯了形式上是“左”的而实际上是右倾的错误。, cite: ws-1966-10-liu-self-criticism, quote: true }
    - { voice: editor, text: 陈伯达把路线错误分为“提出的”与“执行的”：前者点名刘、邓；后者他说多数是不自觉执行的，性质属于人民内部矛盾（讲话第三、第八条，未收入摘录）。这一区分让地方干部可以检讨过关，同时把罪名集中到两个人身上。陈的讲话底本为网络转录，原件待核。 }
  cites: [web-1966-10-16-chen-speech, ws-1966-10-liu-self-criticism]

- id: 1966-11-01-two-lines-editorial
