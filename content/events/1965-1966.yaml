  people: [luo-ruiqing, lin-biao, ye-qun]
  cites: [ws-1966-04-luo-report]

- id: 1965-12-21-mao-dismissal
  date: 1965-12-21
  title: 毛泽东：“要害问题是'罢官'”
  lane: center
  weight: 3
  place: 杭州
  summary: 毛泽东对陈伯达、艾思奇、关锋说：“嘉靖皇帝罢了海瑞的官，一九五九年我们罢了彭德怀的官。彭德怀也是'海瑞'。”由此把一出历史剧的批判与庐山会议直接相联。次日向彭真、康生、杨成武重复此意，彭真辩称“没有发现吴晗同彭德怀有什么组织联系”。
  people: [mao-zedong, chen-boda, guan-feng, qi-benyu, peng-zhen, kang-sheng, peng-dehuai, wu-han]
  concepts: [class-struggle]
  voices:
    - { voice: official1966, text: 姚文元的文章也很好，点了名……但是没有打中要害。要害问题是“罢官”。, cite: ws-1966-05-16-notice-attachment@1965-12-21, quote: true }
  cites: [ws-1966-05-16-notice-attachment@1965-12-21, ws-1966-05-16-notice-attachment@1965-12-22]

- id: 1965-12-27-wu-self-criticism
  date: 1965-12-27
  title: 吴晗《关于〈海瑞罢官〉的自我批评》
  lane: ideology
  weight: 1
  summary: 吴晗辩称《海瑞罢官》在《论海瑞》基础上写成，而《论海瑞》“是根据庐山会议精神反对右倾机会主义的”。官方大事记评：“这就自己暴露了自己的要害。”
  people: [wu-han, peng-zhen]
  cites: [ws-1966-05-16-notice-attachment@1965-12-27]

