  people: [yang-shangkun]
  verify: true

- id: 1965-11-beijing-silence
  date: 1965-11-11
  end: 1965-11-28
  title: 北京报刊 18 天不转载姚文
  lane: ideology
  weight: 2
  place: 北京
  summary: 官方大事记：“北京各报刊，在十八天内，都未转载姚文元同志的文章。”上海人民出版社出单行本，北京新华书店“奉命不复”征订电报，直到 29 日。
  people: [peng-zhen, yao-wenyuan]
  voices:
    - { voice: official1966, text: 各报刊多次请示是否可以转载，彭真同志和中宣部都不让转载。, cite: ws-1966-05-16-notice-attachment@1965-11-11, quote: true }
  cites: [ws-1966-05-16-notice-attachment@1965-11-11, ws-1966-05-16-notice-attachment@1965-11-24]

