- id: 1965-09-work-conference
  date: 1965-09
  end: 1965-10
  title: 中央工作会议：毛泽东问“吴晗是不是可以批判？”
  lane: center
  weight: 2
  place: 北京
  summary: 在有各大区负责人参加的政治局常委会上，毛泽东问彭真吴晗是否可以批判；彭真答“吴晗有些问题可以批判”。官方大事记称此事彭真直到 1966 年 1 月 2 日前“对康生等同志都没有说过”。同一会议上毛泽东问：“中央出了修正主义，你们怎么办？”
  people: [mao-zedong, peng-zhen, wu-han, kang-sheng]
  concepts: [revisionism]
  voices:
    - { voice: official1966, text: 毛主席早就察觉到吴晗的问题，是资产阶级代表人物向党向社会主义猖狂进攻的问题。, cite: ws-1966-05-16-notice-attachment@1965-09, quote: true }
    - { voice: doc, text: 《五一六通知》称此为“毛泽东同志在一九六五年九月至十月间中央工作会议上……关于批判吴晗的指示”。, cite: ws-1966-05-16-notice }
  cites: [ws-1966-05-16-notice-attachment@1965-09, ws-1966-05-16-notice]

- id: 1965-09-23-peng-equality
  date: 1965-09-23
  title: 彭真：“在真理面前，是人人平等的”
  lane: ideology
  weight: 1
  summary: 彭真在文化部文化厅局长会议上讲话。官方大事记引其语：“在真理面前，是人人平等的，管你是党中央的主席也好。”这句话后来成为《五一六通知》驳斥的第四点。
  people: [peng-zhen, lu-dingyi]
  concepts: [equality-before-truth]
  cites: [ws-1966-05-16-notice-attachment@1965-09-23]

- id: 1965-11-10-yao-article
  date: 1965-11-10
  title: 姚文元《评新编历史剧〈海瑞罢官〉》
  lane: ideology
  weight: 3
  place: 上海《文汇报》
  summary: 上海市委“根据毛主席在这次中央工作会议上的指示”准备的文章，指《海瑞罢官》鼓吹“单干风”、“翻案风”。11 月 12–26 日华东各省报纸先后转载。
  people: [yao-wenyuan, zhang-chunqiao, jiang-qing, wu-han]
  concepts: [class-struggle]
  voices:
    - { voice: official1966, text: 这篇文章指出，《海瑞罢官》鼓吹“单干风”、“翻案风”，是毒草。, cite: ws-1966-05-16-notice-attachment@1965-11-10, quote: true }
    - { voice: official1981, text: 在意识形态领域，也对一些文艺作品、学术观点和文艺界学术界的一些代表人物进行了错误的、过火的政治批判……并且在后来发展成为“文化大革命”的导火线。, cite: ws-1981-resolution, quote: true }
  cites: [ws-1966-05-16-notice-attachment@1965-11-10]

- id: 1965-11-10-yang-removed
  date: 1965-11-10
  title: 杨尚昆被免去中央办公厅主任
  lane: center
  weight: 1
  summary: 与姚文元文章同日。杨尚昆后与彭真、罗瑞卿、陆定一并称“彭罗陆杨”。
  people: [yang-shangkun]
  cites: [ws-1966-05-16-notice-attachment]
  verify: true
  why: 免职日期出自党史著作；库内原文只有 1966 年 5 月政治局扩大会议“讨论彭真、陆定一、罗瑞卿、杨尚昆四同志的错误问题”

- id: 1965-11-beijing-silence
  date: 1965-11-11
  end: 1965-11-28
  title: 北京报刊 18 天不转载姚文
  lane: ideology
  weight: 2
  place: 北京
  summary: 官方大事记：“北京各报刊，在十八天内，都未转载姚文元同志的文章。”上海人民出版社出单行本，北京新华书店“奉命不复”征订电报，直到 29 日。
  people: [peng-zhen, yao-wenyuan]
  voices:
    - { voice: official1966, text: 各报刊多次请示是否可以转载，彭真同志和中宣部都不让转载。, cite: ws-1966-05-16-notice-attachment@1965-11-11, quote: true }
  cites: [ws-1966-05-16-notice-attachment@1965-11-11, ws-1966-05-16-notice-attachment@1965-11-24]

