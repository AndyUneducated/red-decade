- id: 1966-02-08-wuhan-report
  date: 1966-02-08
  title: 彭真等向毛泽东汇报提纲
  lane: center
  weight: 2
  place: 武汉
  summary: 官方大事记称“毛主席的意见同彭真同志的意见是完全对立的”，毛泽东两次问彭真“吴晗是不是反党反社会主义？”；对“整风”整左派一说回答“这样的问题，三年以后再说”。彭真事后电话告知常委“文件已经毛主席同意”。两种说法孰是孰非，是二月提纲之争的核心。
  people: [mao-zedong, peng-zhen, xu-liqun, guan-feng]
  voices:
    - { voice: official1966, text: 毛主席是不赞成这个所谓“五人小组汇报提纲”的……彭真同志竟然用欺骗手法，打电话告诉常委同志，说文件已经毛主席同意。, cite: ws-1966-05-16-notice-attachment@1966-02-08, quote: true }
    - { voice: editor, text: 本条只有胜利一方编写的大事记作为来源，彭真一方的叙述尚待查找（见研究队列）。, cite: ws-1966-05-16-notice-attachment@1966-02-08 }
  cites: [ws-1966-05-16-notice-attachment@1966-02-08]
  verify: true

