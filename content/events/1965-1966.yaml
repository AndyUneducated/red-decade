    - { voice: official1981, text: 成立了所谓“中央文革小组”并让它掌握了中央的很大部分权力。, cite: ws-1981-resolution, quote: true }
    - { voice: official1981, text: 林彪、江青、康生、张春桥等人主要利用所谓“中央文革小组”的名义，乘机煽动“打倒一切、全面内战”。, cite: ws-1981-resolution, quote: true }
  cites: [ws-1966-05-ccrg-list, ws-1981-resolution]

- id: 1966-05-29-qhfz-redguards
