  lane: local
  weight: 3
  place: 上海 / 安亭
  summary: 王洪文、潘国平等成立“上海工人革命造反总司令部”。据潘国平 1996 年的访谈，工人随即乘火车北上，被上海市委“锁在安亭”，现场最多时一万多人，许多人睡在列车与铁轨之间；11 月 12 日凌晨中央文革小组派张春桥到场，他起初说不了解情况，不肯承认工总司。回上海第二天，张春桥在文化广场签了五条书面协议，其中包括承认工总司是“革命的合法组织”，工人北上的后果“全部由华东局、上海市委负责”。
  people: [wang-hongwen, pan-guoping, zhang-chunqiao, cao-diqiu]
  concepts: [rebellion, two-lines]
  docs: [ws-1966-11-shanghai-wgs]
  voices:
    - { voice: doc, text: 我们上海市工人革命造反总司令部就在以毛主席为代表的无产阶级革命路线与资产阶级反动路线的大搏斗中宣告成立了！, cite: ws-1966-11-shanghai-wgs, quote: true }
    - { voice: witness, text: 在事件的现场最多时有一万多工人，很多人睡在列车与铁轨之间（1996 年潘国平答亚衣访谈）, cite: bjzc-1996-09-pan-guoping, quote: true }
    - { voice: witness, text: 张春桥在上面签了字（同一访谈，指回上海第二天在文化广场的书面协议）, cite: bjzc-1996-09-pan-guoping, quote: true }
    - { voice: witness, text: 他和“中央文革小组”代表张春桥谈判，后者签字承认了“工总司”是“革命群众组织”（2018 年魏承思《起起伏伏潘司令》）, cite: nfpeople-2018-pan-guoping, quote: true }
  cites: [ws-1966-11-shanghai-wgs, bjzc-1996-09-pan-guoping, nfpeople-2018-pan-guoping]

