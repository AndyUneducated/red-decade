# ── 1966 年 5 月 五一六 ─────────────────────────────────────
- id: 1966-05-04-politburo
  date: 1966-05-04
  end: 1966-05-26
  title: 政治局扩大会议：彭罗陆杨被定为“反党集团”
  lane: center
  weight: 3
  place: 北京
  summary: 讨论“彭真、陆定一、罗瑞卿、杨尚昆四同志的错误问题”。5 月 16 日通过《通知》。5 月 18 日林彪讲话大谈“政变”（见“五一八讲话”）。
  people: [peng-zhen, luo-ruiqing, lu-dingyi, yang-shangkun, lin-biao, liu-shaoqi]
  voices:
    - { voice: official1981, text: 一九六六年五月中央政治局扩大会议和同年八月八届十一中全会的召开，是“文化大革命”全面发动的标志。, cite: ws-1981-resolution, quote: true }
    - { voice: judicial1980, text: 一九六六年五月，林彪捏造罪名，诬陷陆定一是“反革命分子”。, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 当时的文件称之为“错误问题”，1981 年决议称之为“所谓‘彭真、罗瑞卿、陆定一、杨尚昆反党集团’”；起诉书则只追究林彪、江青一方对其中个人的诬陷，不涉及会议本身。, cite: ws-1981-resolution }
  cites: [ws-1966-05-16-notice-attachment@1966-05-04, ws-1981-resolution, ws-1980-indictment]

- id: 1966-05-18-lin-coup-speech
  date: 1966-05-18
  title: 林彪“五一八讲话”：政变与天才
  lane: army
  weight: 3
  place: 北京
  summary: 政治局扩大会议上的长篇讲话，开头即说“我没有写出稿子来，凭口来讲”。前半篇讲“防止反革命政变”，历数中国历代宫廷政变和 1960 年以来亚非拉“六十一次政变”，称毛泽东“调兵遣将……电台、广播电台、军队和公安系统都做了布置”；后半篇讲毛泽东是“天才”，“毛主席的话，句句是真理，一句超过我们一万句”。
  people: [lin-biao, mao-zedong, peng-zhen, luo-ruiqing, lu-dingyi, yang-shangkun]
  concepts: [coup, mao-thought, khrushchev]
  docs: [ws-1966-05-18-lin-speech]
  voices:
    - { voice: doc, text: 毛主席最近几个月，特别注意防止反革命政变，采取了很多措施。, cite: ws-1966-05-18-lin-speech, quote: true }
    - { voice: doc, text: 谁反对他，全党共诛之，全国共讨之。在他身后，如果有谁做赫鲁晓夫那样的秘密报告，一定是野心家，一定是大坏蛋，全党共诛之，全国共讨之。, cite: ws-1966-05-18-lin-speech, quote: true }
    - { voice: doc, text: 毛主席的话，句句是真理，一句超过我们一万句。, cite: ws-1966-05-18-lin-speech, quote: true }
    - { voice: editor, text: 讲话把彭罗陆杨的问题从“错误问题”（会议议题的说法）提升为“反革命政变”的危险，但没有给出任何政变计划的事实，只说“有很多现象，很多材料，我在这里不去详细说了”。指控的依据是一种可能性和一份历史政变清单。, cite: ws-1966-05-18-lin-speech }
    - { voice: official1981, text: 对毛泽东同志的个人崇拜被鼓吹到了狂热的程度。, cite: ws-1981-resolution, quote: true }
  cites: [ws-1966-05-18-lin-speech, ws-1981-resolution]

