- id: 1966-05-16-notice
  date: 1966-05-16
  title: 《五一六通知》
  lane: center
  weight: 3
  summary: 撤销二月提纲和五人小组，“重新设立文化革命小组，隶属于政治局常委之下”。逐条驳斥提纲十点，并宣称“有些正在受到我们信用，被培养为我们的接班人，例如赫鲁晓夫那样的人物，他们现正睡在我们的身旁”。共印 39,985 份，发到县委和军队团级党委。
  people: [mao-zedong, peng-zhen, kang-sheng, chen-boda]
  concepts: [khrushchev, capitalist-roaders, equality-before-truth, monsters, successor]
  docs: [ws-1966-05-16-notice, ws-1966-02-outline]
  voices:
    - { voice: doc, text: 混进党里、政府里、军队里和各种文化界的资产阶级代表人物，是一批反革命的修正主义分子，一旦时机成熟，他们就会要夺取政权。, cite: ws-1966-05-16-notice, quote: true }
    - { voice: official1981, text: 这些论点主要地出现在作为“文化大革命”纲领性文件的《五·一六通知》和党的九大的政治报告中。, cite: ws-1981-resolution, quote: true }
  cites: [ws-1966-05-16-notice, ws-1981-resolution]

- id: 1966-05-18-deng-tuo-death
  date: 1966-05-18
  title: 邓拓自杀
  lane: culture
  weight: 2
  place: 北京
  summary: 《评“三家村”》发表后第 8 天。前一夜他给彭真、刘仁并市委写下遗书。1987 年北京市大事记把死期记在 5 月 18 日，只写“含冤去世”。起诉书把邓拓与刘仁、吴晗、乐松生并列为“被迫害致死”，归入林彪、江青、康生、谢富治指使的北京市委冤案，但没有给出日期和方式。
  people: [deng-tuo]
  voices:
    - { voice: doc, text: 遗憾的是我近来旧病都发作了，再拖下去徒然给党和人民增加负担。（邓拓 5 月 17 日夜遗书）, cite: ccrd-1966-05-17-deng-tuo-letter, quote: true }
    - { voice: officialLater, text: 市委书记处书记、中共中央华北局候补书记邓拓含冤去世。（1987 年《北京市“文化大革命”大事记》）, cite: ccrd-1987-bj-chronology-192, quote: true }
    - { voice: judicial1980, text: 刘仁、邓拓、吴晗、乐松生被迫害致死。, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 邓拓死于 5 月，早于中央文革小组成立和林彪、江青掌握实权；起诉书把这桩死亡与 1968 年的北京市公安局冤案写在同一段里，时间上的因果并不清楚。“自杀”是据遗书“当我要离开你们的时候”的语意和通行说法，大事记与起诉书都没有写死亡方式。遗书是 CCRD 据《邓拓全集》的转录，未核原件。, cite: ccrd-1966-05-17-deng-tuo-letter }
  cites: [ccrd-1966-05-17-deng-tuo-letter, ccrd-1987-bj-chronology-192, ws-1980-indictment]

- id: 1966-05-23-tian-jiaying
  date: 1966-05-23
  title: 田家英自杀
  lane: center
  weight: 1
  place: 中南海
  summary: 毛泽东秘书。据当时奉命接管其工作的戚本禹回忆，5 月 21 日下午安子文、王力、戚本禹到中南海永福堂宣布他停职反省，23 日上午他被发现在永福堂西厢房自缢。经过与日期出自当事人回忆，非一手档案。
  people: [tian-jiaying, qi-benyu]
  voices:
    - { voice: witness, text: 1966年5月21日上午，安子文打电话通知我，让我在下午二时半，到中共中央组织部与他和王力会合，然后一起去中南海找田家英谈话。（戚本禹回忆录）, cite: marxists-qibenyu-tian-jiaying, quote: true }
    - { voice: witness, text: 第三天，即1966年5月23日上午约十时许，田家英的勤务员小陈，第一个发现田家英在永福堂的西厢房里上吊自杀了。（戚本禹回忆录）, cite: marxists-qibenyu-tian-jiaying, quote: true }
    - { voice: editor, text: 本条旧摘要作“被停职审查后次日自杀”；按戚本禹回忆，宣布停职与死亡相隔一天，改从回忆录。, cite: marxists-qibenyu-tian-jiaying }
  cites: [marxists-qibenyu-tian-jiaying]

- id: 1966-05-25-nie-dazibao
  date: 1966-05-25
  title: 聂元梓等七人大字报
  lane: mass
  weight: 3
  place: 北京大学
  summary: 哲学系聂元梓等七人在大饭厅东墙贴出《宋硕、陆平、彭珮云在文化革命中究竟干些什么？》。攻击的不是某个观点，而是程序：北京市委大学部和北大党委要求运动“加强领导，坚守岗位”，“北大不宜贴大字报”，引导到“开小组会，写小字报”。6 月 1 日晚中央人民广播电台播出，次日《人民日报》全文刊登并配评论员文章。
  people: [nie-yuanzi, lu-ping, song-shuo, peng-peiyun, kang-sheng]
  concepts: [mass-democracy]
  docs: [rmrb-1966-06-02-nie-dazibao, ws-1966-06-02-hail-pku]
  voices:
    - { voice: doc, text: 你们为什么这样害怕大字报？害怕开声讨大会？, cite: rmrb-1966-06-02-nie-dazibao, quote: true }
    - { voice: doc, text: 全国第一张马列主义的大字报和人民日报评论员的评论，写得何等好呵！（《炮打司令部》）, cite: ws-1967-08-bombard-anniv, quote: true }
    - { voice: editor, text: 大字报引述的宋硕“指示”——“有领导”、“坚持讲道理”、“从理论上彻底驳倒”——与《二月提纲》的程序性主张同出一辙（C001）；大字报把它们重新定义为“压制群众革命”。这是五一六通知对提纲的那套论证，在基层第一次被群众用来对付本单位党委。, cite: ws-1966-02-outline }
  cites: [rmrb-1966-06-02-nie-dazibao, ws-1966-06-02-hail-pku, ws-1967-08-bombard-anniv]

