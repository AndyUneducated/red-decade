  people: [zhou-enlai, peng-zhen, deng-tuo, zhou-yang, xu-liqun, yao-zhen]
  concepts: [equality-before-truth]
  cites: [ws-1966-05-16-notice-attachment@1965-11-28]

- id: 1965-11-30-peoples-daily
  date: 1965-11-30
  title: 《人民日报》在“学术研究”栏转载姚文
  lane: ideology
  weight: 2
  summary: 按语按彭真意见作为学术问题讨论，“既容许批评的自由，也容许反批评的自由”。按语最后一段引用毛泽东语录，“这是周恩来同志加的”。前一日《解放军报》转载时称《海瑞罢官》“是一株大毒草”，《北京日报》按语则强调“有不同意见”。
  people: [peng-zhen, zhou-enlai]
  voices:
    - { voice: official1966, text: 没有表示支持姚文元同志文章。按语的最后一段……这是周恩来同志加的。, cite: ws-1966-05-16-notice-attachment@1965-11-30, quote: true }
    - { voice: editor, text: 同一篇文章的四家按语（解放军报 / 北京日报 / 人民日报 / 光明日报）被上海报纸按“发表先后”排列、把解放军报放在第一，彭真“极为不满”——转载顺序本身成了政治信号。, cite: ws-1966-05-16-notice-attachment@1965-12-06 }
  cites: [ws-1966-05-16-notice-attachment@1965-11-29, ws-1966-05-16-notice-attachment@1965-11-30]

