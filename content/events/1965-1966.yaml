    - { voice: official1966, text: “红卫兵”小将们以毛泽东思想为武器，正在横扫一切剥削阶级的旧思想、旧文化、旧风俗、旧习惯的灰尘。……好得很！, cite: ws-1966-08-23-very-good, quote: true }
    - { voice: doc, text: 不是黑六类的家一律不查！国家负责干部的家绝对不许查！（西城纠察队第四号通令）, cite: ws-1966-08-xicheng-4, quote: true }
    - { voice: editor, text: 通令要求“文斗”、“一切缴获要归公”，却以出身划定查抄对象并驱逐出京——这正是《出身论》所批判的“偷换概念”：把斗争矛头从“当权派”转向“黑六类”。, cite: ws-1967-yu-origin-theory }
    - { voice: official1981, text: “文化大革命”初期被卷入运动的大多数人，是出于对毛泽东同志和党的信赖，但是除了极少数极端分子以外，他们也不赞成对党的各级领导干部进行残酷斗争。, cite: ws-1981-resolution, quote: true }
    - { voice: editor, text: 1981 年决议全文没有出现“红卫兵”“抄家”“武斗”“四旧”；1980 年起诉书中“抄家”三次都指对刘少奇、彭罗陆杨等干部或张春桥的特务组织，“红卫兵”两次是“冒充红卫兵”和“交红卫兵审判”。红八月以出身为界的抄家、殴打与驱逐，在两份定论文件中都没有位置（C013）。, cite: ws-1981-resolution }
  cites: [ws-1966-08-xicheng-4, ws-1966-08-23-very-good, ws-1981-resolution, ws-1980-indictment]

