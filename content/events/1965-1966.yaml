- id: 1966-06-24-rebel-essays
  date: 1966-06-24
  end: 1966-07-27
  title: 清华附中红卫兵“三论造反精神”
  lane: mass
  weight: 3
  place: 清华大学附属中学
  summary: 落款“清华大学附属中学 红卫兵”的三张大字报，分别署 6 月 24 日、7 月 4 日、7 月 27 日，贴出时正值工作组在校。毛泽东 8 月 1 日复信表示“热烈的支持”（据陈伯达 10 月讲话转引）；8 月 21 日《红旗》第 11 期以“革命大字报选”刊出，配本刊评论员《向革命的青少年致敬》，8 月 24 日《人民日报》转载。
  concepts: [rebellion]
  docs: [rmrb-1966-08-24-rebel-1, rmrb-1966-08-24-rebel-2, rmrb-1966-08-24-rebel-3, rmrb-1966-08-24-salute-youth]
  voices:
    - { voice: doc, text: 革命就是造反，毛泽东思想的灵魂就是造反。, cite: rmrb-1966-08-24-rebel-1, quote: true }
    - { voice: doc, text: 我们只许左派造反，不许右派造反！你们胆敢造反，我们就立即镇压！这就是我们的逻辑。反正国家机器在我们手里。（再论）, cite: rmrb-1966-08-24-rebel-2, quote: true }
    - { voice: doc, text: 我们就是要把你们打翻在地上，再踏上一只脚！, cite: rmrb-1966-08-24-rebel-1, quote: true }
    - { voice: official1966, text: 本刊特选几篇大字报，公之于世，让广大人民群众来作鉴定。（《红旗》评论员）, cite: rmrb-1966-08-24-salute-youth, quote: true }
    - { voice: doc, text: 在八月一日，他就向清华大学附属中学红卫兵写信，说：“我向你们表示热烈的支持”。（陈伯达 10 月 16 日讲话）, cite: web-1966-10-16-chen-speech, quote: true }
    - { voice: editor, text: “造反”在这里的第一义不是反对权力：再论宣称“国家机器在我们手里”，造反权只属于左派，右派造反要“立即镇压”。造反的发明者把自己放在国家一边——这与 11 月工总司造本地党委的反，是同一个词的两种用法（C006）。 }
  cites: [rmrb-1966-08-24-rebel-1, rmrb-1966-08-24-rebel-2, rmrb-1966-08-24-rebel-3, rmrb-1966-08-24-salute-youth, web-1966-10-16-chen-speech]

# ── 1966 年 6–7 月 工作组“五十多天” ─────────────────────────
- id: 1966-06-01-sweep-editorial
  date: 1966-06-01
  title: 《人民日报》社论《横扫一切牛鬼蛇神》
  lane: ideology
  weight: 3
  summary: 陈伯达率工作组接管《人民日报》后的首篇社论。提出“彻底破除几千年来一切剥削阶级所造成的毒害人民的旧思想、旧文化、旧风俗、旧习惯”——这是本站语料中“四旧”四项并列的最早出处。
  people: [chen-boda]
  concepts: [monsters, four-olds]
  docs: [ws-1966-06-01-sweep]
  voices:
    - { voice: judicial1980, text: 一九六六年六月，陈伯达组织编写和审定的“横扫一切牛鬼蛇神”等社论，为林彪、江青反革命集团搞乱全国，乱中夺权，制造反革命舆论。, cite: ws-1980-indictment, quote: true }
  cites: [ws-1966-06-01-sweep, ws-1980-indictment]

- id: 1966-06-03-new-committee
  date: 1966-06-03
  title: 北京市委改组，工作组进驻北大
  lane: local
  weight: 2
  place: 北京
  summary: 新华社 6 月 3 日电：中共中央决定由华北局第一书记李雪峰兼任北京市委第一书记，调吉林省委第一书记吴德任第二书记。新市委随即决定派张承先为首的工作组进驻北京大学，撤销陆平、彭珮云的一切职务，“由工作组代行党委的职权”。刘少奇检讨：“特别在报纸上发表了派工作组到北京大学代行党委职权以后，这种派工作组的要求就更加强烈了。”
  people: [li-xuefeng, zhang-chengxian, liu-shaoqi, lu-ping, peng-peiyun]
  docs: [rmrb-1966-06-04-new-committee, rmrb-1966-06-04-pku-committee]
  voices:
    - { voice: doc, text: 在北京大学党委改组期间，由工作组代行党委的职权。, cite: rmrb-1966-06-04-pku-committee, quote: true }
    - { voice: official1966, text: 我们党中央改组了北京市委，建立了新市委。这是非常英明、非常正确的决定。, cite: ws-1966-06-red-flag-long-live, quote: true }
    - { voice: editor, text: 派工作组的决定以新市委名义公开见报，刘少奇检讨承认正是这条消息让各地纷纷要求派工作组。五十天后被定为“路线错误”的做法，起点是一条公开的、经中央改组的市委决定。, cite: ws-1966-10-liu-self-criticism }
  cites: [rmrb-1966-06-04-new-committee, rmrb-1966-06-04-pku-committee, ws-1966-10-liu-self-criticism, ws-1966-06-red-flag-long-live]

- id: 1966-06-workteams
  date: 1966-06-01
  end: 1966-07-18
  title: 工作组的“五十多天”
  lane: center
  weight: 3
  place: 北京各高校、中学
  summary: 刘少奇主持的中央汇报会议决定派出工作组，规定“不让群众上街游行，不让把大字报贴到马路上去，要内外有别”。许多学校出现“排除干扰”斗争、“学生斗学生”，一些学生被定为“反革命分子”、“右派”或“假左派”。
  people: [liu-shaoqi, deng-xiaoping, wang-guangmei, zhang-chengxian, kuai-dafu]
  concepts: [two-lines]
  voices:
    - { voice: doc, text: 在五十多天里，从中央到地方的某些领导同志……实行资产阶级专政，将无产阶级轰轰烈烈的文化大革命运动打下去。（《炮打司令部》）, cite: ws-1967-08-bombard-anniv, quote: true }
    - { voice: doc, text: 在今年六月一日以后的五十多天中，我在指导无产阶级文化大革命中发生了路线错误，方向错误。……第一位要负责任的，就是我。（刘少奇检讨）, cite: ws-1966-10-liu-self-criticism, quote: true }
    - { voice: editor, text: 刘少奇检讨中“当时我们没有就是否应当派工作组的问题进行过讨论”与“当时群众纷纷要求……派工作组”并存——派工作组既是惯例，也是回应；被定性为“路线错误”是事后的。, cite: ws-1966-10-liu-self-criticism }
  cites: [ws-1966-10-liu-self-criticism, ws-1967-08-bombard-anniv]

- id: 1966-06-18-pku-incident
  date: 1966-06-18
  title: 北大“六一八事件”
  lane: mass
  weight: 2
  place: 北京大学
  summary: 学生自发揪斗数十名干部、教师，有体罚、戴高帽。工作组将其定为“乱斗”加以制止；刘少奇主持的会议批发北大简报第九号，认为处理“正确的，及时的”。这一判断后来被定为“把革命师生群众的革命行动，说成是反革命事件”。
  people: [zhang-chengxian, liu-shaoqi]
  voices:
    - { voice: doc, text: 批发了北京大学文化革命简报第九号到各地党委……这就给全国定了一种基调。（刘少奇检讨）, cite: ws-1966-10-liu-self-criticism, quote: true }
  cites: [ws-1966-10-liu-self-criticism]

- id: 1966-06-tsinghua-kuai
  date: 1966-06-09
  end: 1966-08
  title: 清华工作组与蒯大富
  lane: mass
  weight: 2
  place: 清华大学
  summary: 据 1967 年《红旗》的调查，工作组 6 月 9 日进校，先令全体干部“撤职罢官”；6 月 24 日至 7 月 15 日“大搞所谓‘反蒯’”，以“下楼”为条件动员干部批蒯大富；7 月 16 日起转为批斗“黑帮”，8 月初撤出。王光美参与其事，刘少奇称清华是“这一错误路线的典型例子”。蒯大富被定为“反革命”一说尚无原文。
  people: [wang-guangmei, kuai-dafu, liu-shaoqi]
  voices:
    - { voice: doc, text: 我过问过的，王光美同志参加过的清华大学前一段文化革命运动中所犯的错误，是这一错误路线的典型例子。（刘少奇检讨）, cite: ws-1966-10-liu-self-criticism, quote: true }
    - { voice: official1966, text: 从六月二十四日到七月十五日。工作组大搞所谓“反蒯”。, cite: ws-1966-qinghua-workteam-survey, quote: true }
    - { voice: editor, text: 调查报告发表于 1967 年 3 月批判刘少奇期间，出自反工作组一方，把干部一律写作“王××”“蒋××”。工作组自己的记录与蒯大富的大字报原文都还没有入库。 }
  cites: [ws-1966-10-liu-self-criticism, ws-1966-qinghua-workteam-survey]

- id: 1966-06-13-exam-postponed
  date: 1966-06-13
  title: 高校招生推迟，高考停止
  lane: culture
  weight: 2
  summary: 中共中央、国务院 6 月 13 日发出通知，1966 年高校招生“推迟半年进行”，理由是高考“基本上没有跳出资产阶级考试制度的框框”，“必须彻底改革”。6 月 18 日见报，同日《人民日报》社论《彻底搞好文化革命　彻底改革教育制度》。此后高考中断至 1977 年。
  docs: [rmrb-1966-06-18-exam-postponed, rmrb-1966-06-18-education-editorial]
  voices:
    - { voice: doc, text: 决定一九六六年高等学校招收新生的工作推迟半年进行, cite: rmrb-1966-06-18-exam-postponed, quote: true }
    - { voice: editor, text: 通知只说“推迟半年”，并安排未完成运动的高中毕业生留校、已完成的“下乡下厂参加生产劳动”。“中断十一年”不是当时的决定，而是推迟一再延续的结果。恢复统一考试见 1977 年 10 月教育部招生意见。 }
  cites: [rmrb-1966-06-18-exam-postponed, rmrb-1966-06-18-education-editorial]

- id: 1966-07-16-yangtze
  date: 1966-07-16
  title: 毛泽东畅游长江
  lane: center
  weight: 1
  place: 武汉
  summary: 据新华社电，毛泽东在武汉“历时一小时零五分，游程近三十华里”。两天后回到北京。消息却迟至 7 月 24 日才发出、25 日见报——恰在 24 日决定撤回工作组之后。
  people: [mao-zedong]
  docs: [rmrb-1966-07-25-yangtze]
  voices:
    - { voice: official1966, text: 我们伟大的领袖毛主席，在一九六六年七月十六日，再一次乘风破浪，畅游长江。, cite: rmrb-1966-07-25-yangtze, quote: true }
    - { voice: editor, text: 游泳与报道相隔八天。报道发出的时间，与毛泽东回京（18 日）、决定撤回工作组（24 日）衔接；“健康”与“重返前台”的含义是读者从时间顺序里读出来的，报道本身只写游泳和欢呼。, cite: ws-1966-10-liu-self-criticism }
  cites: [rmrb-1966-07-25-yangtze, ws-1966-10-liu-self-criticism]

- id: 1966-07-18-mao-returns
