  summary: 毛泽东同康生、江青、张春桥等谈话，称中宣部是“阎王殿”，“我历来主张，凡中央机关作坏事，我就号召地方造反，向中央进攻。各地要多出些孙悟空，大闹天宫。”并说中宣部、北京市委、五人小组“要解散”。这是 1966 年文本中“造反”一词的最早用例之一。
