  cites: [ws-1959-09-17-wu-han-hai-rui]

- id: 1960-03-11-anshan
  date: 1960-03-11
  title: 鞍山市委关于技术革新和技术革命运动的报告
  lane: econ
  weight: 1
  place: 鞍山
  summary: 1960 年 3 月 11 日，中共鞍山市委向中央报告工业战线的技术革新和技术革命运动，称运动已形成“波澜壮阔的群众运动”，并把它归功于两年“连续大跃进”和总路线精神“深入人心”。
  voices:
    - { voice: doc, text: 在中央和省委的正确领导下，鞍山地区的技术革新和技术革命，已经形成波澜壮阔的群众运动，并已进入一个新的阶段（鞍山市委报告）, cite: ws-1960-03-11-anshan-innovation, quote: true }
  cites: [ws-1960-03-11-anshan-innovation]

- id: 1961-03-anhui-responsibility
  date: 1961-03-06
  end: 1961-05-03
  title: 安徽试行“包工包产责任制”
  lane: econ
  weight: 2
  place: 安徽
  summary: 按安徽省委的报告，安徽从 1961 年 3 月 6 日开始试行包工包产责任制，3 月 20 日接到“希圣同志”从广州打来的电话后即停止。报告说试行地方社员“生产积极性大大提高”，但有少数群众把它“误解为包产到户，甚至误解为分田”。5 月 3 日，这份报告根据中央书记处的指示转发各地。
  voices:
    - { voice: doc, text: 我省试行包工包产责任制的办法是从三月六日开始的，到三月二十日接到希圣同志由广州发来的电话后即行停止（安徽省委报告）, cite: ws-1961-05-03-anhui-responsibility, quote: true }
    - { voice: doc, text: 在试行这个办法的地方，社员的生产责任心大大加强，生产积极性大大提高（同上）, cite: ws-1961-05-03-anhui-responsibility, quote: true }
    - { voice: doc, text: 但是，在试行中，有些地方由于宣传工作做得不深不透，以致有少数群众把这个办法误解为“包产到户”，甚至误解为“分田”（同上）, cite: ws-1961-05-03-anhui-responsibility, quote: true }
  cites: [ws-1961-05-03-anhui-responsibility]

- id: 1961-06-15-sixty-revised
  date: 1961-06-15
  title: 农村人民公社工作条例修正草案（1961 年 6 月）：食堂由社员决定
  lane: econ
  weight: 2
  summary: 1961 年 6 月 15 日的《农村人民公社工作条例（修正草案）》规定公社分公社、生产大队、生产队三级，以生产大队为基本核算单位；生产队办不办食堂“完全由社员讨论决定”，办食堂的实行“自愿参加”和“自由退出”。1962 年 9 月的再修正草案把基本核算单位下放到生产队。
  voices:
    - { voice: doc, text: 三十六、在生产队办不办食堂，完全由社员讨论决定（1961 年修正草案）, cite: ws-1961-06-15-sixty-revised, quote: true }
    - { voice: doc, text: 凡是要办食堂的，都办社员的合伙食堂，实行自愿参加、自由结合、自己管理、自负开销和自由退出的原则（同上）, cite: ws-1961-06-15-sixty-revised, quote: true }
    - { voice: doc, text: 生产大队是基本核算单位（同上）, cite: ws-1961-06-15-sixty-revised, quote: true }
  cites: [ws-1961-06-15-sixty-revised, ws-1962-09-27-sixty-articles]

- id: 1961-industry-seventy
  date: 1961
  title: 《国营工业企业工作条例（草案）》（“工业七十条”）
  lane: econ
  weight: 1
  summary: 1961 年中共中央制定《国营工业企业工作条例（草案）》，规定国营工业企业实行“党委领导下的行政管理上的厂长负责制”，作为企业管理的根本制度。
  voices:
    - { voice: doc, text: 在国营工业企业中，实行党委领导下的行政管理上的厂长负责制，这是我国企业管理的根本制度（工业七十条草案）, cite: ws-1961-industry-seventy, quote: true }
  cites: [ws-1961-industry-seventy]

- id: 1962-10-20-sino-indian-war
  date: 1962-10-20
  title: 中印边界战争
  lane: intl
  weight: 3
  summary: 1962 年 10 月 20 日，中印边界东段和西段爆发大规模武装冲突。《人民日报》编辑部 10 月 27 日的文章称是印度军队在这一天“发动了大规模的全面进攻”，并称印度把东北边界推到中国不承认的麦克马洪线附近，“侵占了属于中国的九万多平方公里的领土”。本站目前只有中方文本，印方说法待补。
  voices:
    - { voice: official1966, text: 在他们的进攻部署完成之后，印度军队终于在1962年10月20日发动了大规模的全面进攻（人民日报编辑部，1962 年 10 月 27 日）, cite: ws-1962-10-27-nehru-philosophy, quote: true }
    - { voice: official1966, text: 把印度的东北边界强力推移到中国从来不承认的所谓麦克马洪线附近，侵占了属于中国的九万多平方公里的领土（同上）, cite: ws-1962-10-27-nehru-philosophy, quote: true }
  cites: [ws-1962-10-27-nehru-philosophy, ws-1959-09-08-zhou-nehru, ws-1961-12-06-mfa-india]

- id: 1965-09-03-people-war
  date: 1965-09-03
  title: 林彪《人民战争胜利万岁》
  lane: army
  weight: 2
  summary: 1965 年 9 月 3 日，抗日战争胜利二十周年之际，林彪发表《人民战争胜利万岁》，把抗战胜利归于毛泽东的人民战争理论，把“以农村包围城市，最后夺取城市”说成中国革命的胜利道路，并称掌握人民战争这个武器对付美帝国主义已成为许多国家人民的“迫切需要”。
  people: [lin-biao, mao-zedong]
  concepts: [mao-thought]
  voices:
    - { voice: official1966, text: 依靠农民，建立农村根据地，以农村包围城市，最后夺取城市，这是中国革命所走过的胜利的道路（林彪文章）, cite: ws-1965-09-03-people-war, quote: true }
    - { voice: official1966, text: 掌握和运用人民战争这个武器来对付美帝国主义及其走狗，已经成为许多国家人民的迫切需要（同上）, cite: ws-1965-09-03-people-war, quote: true }
  cites: [ws-1965-09-03-people-war]
