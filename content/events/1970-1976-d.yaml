- id: 1973-05-23-civil-restore
  date: 1973-05-23
  title: 恢复邮电部，气象、测绘回归政府
  lane: army
  weight: 2
  place: 全国
  summary: 林彪事件后，国务院、中央军委同日发出三个通知，执行中央 1973 年 3 月 6 日的批准：恢复邮电部，撤销电信总局，邮政、电信重新合并归地方；中央气象局划归国务院、由农林部领导；国务院重建国家测绘总局，任务移交后“军队测绘机构要作相应的缩减”。
  people: []
  voices:
    - { voice: official1966, text: 关于恢复邮电部、调整邮电体制问题，中央已于一九七三年三月六日批准（1973 年 5 月 23 日国务院、中央军委通知）, cite: ws-cat2-post, quote: true }
    - { voice: official1966, text: 决定中央气象局划归国务院建制，由农林部领导，并恢复总参谋部气象局（同日通知）, cite: ws-cat2-weather, quote: true }
    - { voice: official1966, text: 任务移交后，军队测绘机构要作相应的缩减和调整（同日通知，测绘部门）, cite: ws-cat2-survey, quote: true }
  cites: [ws-cat2-post, ws-cat2-weather, ws-cat2-survey, ws-1970-post-reform]

- id: 1973-06-26-export-contracts
  date: 1973-06-26
  title: 国务院：出口合同只交货七成
  lane: econ
  weight: 1
  place: 全国
  summary: 国务院通知说外贸增长、春季广交会成交踊跃，但出口合同执行不好：11 个口岸一季度对资本主义市场的实际交货只占应交货的 73.7%，外商“已有强烈反映”，要求“重合同，守信用”。
  people: []
  voices:
    - { voice: official1966, text: 今年一季度对资本主义市场出口，实际交货只占应交货的百分之七十三点七（1973 年 6 月 26 日国务院通知）, cite: ws-cat2-export, quote: true }
    - { voice: official1966, text: 我们是社会主义国家，说了话应当算数（同一通知）, cite: ws-cat2-export, quote: true }
  cites: [ws-cat2-export]

- id: 1974-foreign-graves
  date: 1974
  title: 清理在华外国人坟墓
  lane: intl
  weight: 1
  place: 全国
  summary: 外国使馆不断要求查看在华外国人坟墓，外交部的请示说，据九省市调查，文革前夕在华外国人坟墓有五万多座，文革中被红卫兵摧毁，约六成已平毁、三成受损，近年对外国人察看坟墓的要求“一般均予婉拒”。
  people: []
  voices:
    - { voice: doc, text: 文化大革命前夕，外国人坟墓约有5万多座（外交部请示，1974 年国务院批转）, cite: ws-cat3-foreign-graves, quote: true }
    - { voice: doc, text: 文化大革命中，红卫兵和革命群众激于义愤，摧毁了帝国主义侵略者和一些其他外国人坟墓。目前，已平毁的外国人墓约60％（同一请示）, cite: ws-cat3-foreign-graves, quote: true }
  cites: [ws-cat3-foreign-graves]

- id: 1974-brazil-venezuela
  date: 1974-06-28
  title: 中国与委内瑞拉、巴西建交
  lane: intl
  weight: 1
  place: 加拉加斯
  summary: 1974 年 6 月 28 日两国代表在加拉加斯换文，中委建交；同年中国还与巴西建交，两份公报都沿用“注意到”台湾立场的写法。
  people: []
  voices:
    - { voice: doc, text: 为此，由两国政府授权的代表于一九七四年六月二十八日在加拉加斯城互换了有关信件（中委建交公报）, cite: ws-1974-venezuela, quote: true }
    - { voice: doc, text: 巴西联邦共和国政府注意到中国政府的这一立场（中巴建交公报）, cite: ws-1974-brazil, quote: true }
  cites: [ws-1974-venezuela, ws-1974-brazil]

- id: 1975-foreign-technicians
  date: 1975
  title: 接待西方技术人员：“崇洋迷外”的帽子
  lane: econ
  weight: 1
  place: 全国
  summary: 国务院批转国家建委、外贸部报告。报告说 1972 年以来从资本主义国家进口了一些成套设备并聘请外国技术人员，但有的单位把采纳外国技术人员的合理建议说成“崇洋迷外”，要求适当扩大他们的活动范围、改善生活条件。
  people: []
  voices:
    - { voice: official1966, text: 一九七二年以来，我国从资本主义国家进口了一些成套设备（1975 年国家建委、外贸部报告）, cite: ws-cat3-foreign-technicians, quote: true }
    - { voice: official1966, text: 有的单位不能正确对待外国技术人员的建议和意见，把采纳外国技术人员的合理建议，说成是“崇洋迷外”（同一报告）, cite: ws-cat3-foreign-technicians, quote: true }
  cites: [ws-cat3-foreign-technicians]
