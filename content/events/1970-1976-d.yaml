# 1969–1976 fourth batch: documents registered in research/manifests/m4-ws-3.yaml

- id: 1969-11-05-telecom-army
  date: 1969-11-05
  title: 电信划归军队：邮电部拆分、气象局并入总参
  lane: army
  weight: 2
  place: 全国
  summary: 根据周恩来 1969 年 6 月 10 日的指示，邮电部从中央到基层拆开，电信划归军队、实行“半军事化管理”，邮政并入交通部门。划归军队的有近三万个单位、约二十万职工。一个月后，中央气象局与总参军事气象局合并，归总参谋部领导。1973 年 5 月这些安排被撤回。
  people: [zhou-enlai, lin-biao]
  voices:
    - { voice: official1966, text: 邮电体制的改革，就是将邮电部的电信、邮政从中央到基层都分开，电信部分划归军队领导，邮政部分与铁道、交通部门合并（1969 年 11 月 5 日国务院、中央军委通知）, cite: ws-1970-post-reform, quote: true }
    - { voice: doc, text: 划归军队领导的事业、企业单位近三万个，职工约二十万人（铁道部、交通部、邮电部军管会和通信兵部报告）, cite: ws-1970-post-reform, quote: true }
    - { voice: official1966, text: 两局合并后仍称中央气象局，归总参谋部领导（1969 年 12 月 4 日国务院、中央军委通知）, cite: ws-1970-weather-merge, quote: true }
  cites: [ws-1970-post-reform, ws-1970-weather-merge, ws-cat2-post]

- id: 1970-small-steel
  date: 1970
  title: “五小”工业与“以钢为纲”：烟台“小钢联”
  lane: econ
  weight: 1
  place: 山东烟台
  summary: 《办好小钢铁》介绍烟台地区两年多里“土法上马”建成从采矿到轧钢的地方小型钢铁联合企业，称该地区县以上“五小”工业比 1966 年增加近一倍。次年另一篇长文把“以钢为纲”定为毛泽东为钢铁工业制定的方针。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 建成了一个较为完整的具有采矿、选矿、球团、烧结、炼铁、炼钢、轧钢的地方小型钢铁联合企业（1970 年《办好小钢铁》）, cite: ws-1970-small-steel, quote: true }
    - { voice: official1966, text: 今年，这个地区县以上的“五小”工业比一九六六年增加了将近一倍（同一文章）, cite: ws-1970-small-steel, quote: true }
    - { voice: official1966, text: 发展工业“以钢为纲”的伟大方针，正确阐明了钢铁工业和其它工业的辩证关系（1971 年《在毛泽东思想指引下发展我国钢铁工业》）, cite: ws-cat2-steel, quote: true }
  cites: [ws-1970-small-steel, ws-cat2-steel]

- id: 1970-zhiqing-reeducation
  date: 1970
  title: 知青“再教育”：“先抓人头，后抓锄头”
  lane: mass
  weight: 1
  place: 全国
  summary: 1970 年的两篇文章把知青下乡定为“培养和造就革命接班人的重要途径”，“不是单纯安置劳动力的临时措施”；一个大队的经验文章说，不能只看知青“脸晒黑了”，更要看“心炼红了没有”。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 知识青年到农村去，同贫下中农相结合，不是单纯安置劳动力的临时措施（1970 年《抓好下乡知识青年的工作》）, cite: ws-1970-zhiqing-work, quote: true }
    - { voice: official1966, text: 不能光看他脸晒黑了，更重要的是看他心炼红了没有（1970 年《用一分为二的观点对知识青年进行再教育》）, cite: ws-1970-zhiqing-yifenwei, quote: true }
  cites: [ws-1970-zhiqing-work, ws-1970-zhiqing-yifenwei]

- id: 1970-chile
  date: 1970
  title: 中国与智利建交
  lane: intl
  weight: 1
  place: 巴黎（两国驻法国大使签署）
  summary: 两国驻法国大使黄镇和伯恩斯坦在巴黎签署协议建交。智利政府“注意到”中国关于台湾的声明，沿用了同年中加公报的写法。同年中国还与埃塞俄比亚建交。
  people: []
  voices:
    - { voice: doc, text: 中国政府重申：台湾是中华人民共和国领土不可分割的一部分。智利政府注意到中国政府的这一声明（中智建交公报）, cite: ws-1970-chile, quote: true }
    - { voice: doc, text: 中华人民共和国政府是代表全中国人民的唯一合法政府（中埃建交公报）, cite: ws-1970-ethiopia, quote: true }
  cites: [ws-1970-chile, ws-1970-ethiopia, ws-1970-canada]

- id: 1971-04-16-assets
  date: 1971-04-16
  title: 国务院部署清产核资：积压物资五十二亿元
  lane: econ
  weight: 1
  place: 全国
  summary: 国务院批转国家计委、财政部报告。报告说毛泽东 1968 年 12 月批示上海外贸积压浪费“似有普遍性”以后，各地清出积压物资 52 亿元；生产建设单位库存中积压物资约占 20%，设备利用率低于历史水平，要求两年内完成清产核资。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 各地区、各部门相继开展清仓查库工作，清出积压物资五十二亿元，已利用十六亿元（1971 年国家计委、财政部报告）, cite: ws-cat2-assets, quote: true }
    - { voice: doc, text: 生产建设单位的库存物资中，积压物资占百分之二十左右（同一报告）, cite: ws-cat2-assets, quote: true }
  cites: [ws-cat2-assets]

