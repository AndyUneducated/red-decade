- id: 1971-06-08-farm-mech
  date: 1971-06-08
  title: 国务院召开农业机械化会议：1980 年基本实现农业机械化
  lane: econ
  weight: 1
  place: 北京
  summary: 国务院通知 8 月在北京召开全国农业机械化会议，要求制订“一九八〇年前基本上实现农业机械化”的规划，农机制造以地方为主、产品以中小型为主。这一目标 1975 年在农业学大寨会议上再次提出。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 在自力更生的基础上，制订出一九八〇年前基本上实现农业机械化的规划（1971 年 6 月 8 日国务院通知）, cite: ws-cat2-farm-mech, quote: true }
  cites: [ws-cat2-farm-mech, rmrb-1975-10-21-dazhai-close]

- id: 1971-08-02-seismology
  date: 1971-08-02
  title: 成立国家地震局
  lane: econ
  weight: 1
  place: 全国
  summary: 国务院通知调整中央地震工作小组，撤销其办公室，成立国家地震局，由中国科学院代管，提出“以预防为主”、专业队伍与群众业余队伍结合开展地震预报。五年后发生唐山大地震。
  people: []
  voices:
    - { voice: official1966, text: 撤销中央地震工作小组办公室，成立国家地震局，作为中央地震工作小组的办事机构，由中国科学院代管（1971 年国务院通知）, cite: ws-cat2-seismology, quote: true }
  cites: [ws-cat2-seismology]

- id: 1971-10-25-belgium
  date: 1971-10-25
  title: 中国与比利时建交
  lane: intl
