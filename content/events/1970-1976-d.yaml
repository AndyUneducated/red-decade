- id: 1971-12-indo-pak
  date: 1971-12
  title: 印巴战争：中国斥苏联支持印度、反对“伪孟加拉国”
  lane: intl
  weight: 2
  place: 南亚
  summary: 印度军队 11 月下旬起进攻巴基斯坦。中方文章驳斥苏联塔斯社 12 月 5 日的声明，称东巴问题“完全是巴基斯坦的内政”，指苏联支持印度“制造一个伪‘孟加拉国’”。中国到 1975 年 10 月才与孟加拉国建交。
  people: []
  voices:
    - { voice: official1966, text: 他们这么干，就是明目张胆地支持印度反动派制造一个伪“孟加拉国”（1971 年 12 月《驳塔斯社声明》）, cite: ws-cat2-tass, quote: true }
    - { voice: doc, text: 中华人民共和国政府和孟加拉人民共和国政府决定自一九七五年十月四日起建立外交关系并互派大使（1975 年中孟建交公报）, cite: ws-1975-bangladesh, quote: true }
  cites: [ws-cat2-tass, ws-1975-bangladesh]

- id: 1971-12-temp-workers
  date: 1971-12
  title: 临时工改固定工
  lane: econ
  weight: 1
  place: 全国
  summary: 国务院通知，常年性岗位一律使用固定工、不再招临时工，现有临时工经群众评议可改为固定工；同时批判刘少奇推行的“两种劳动制度”。通知还规定“擅自离开工作岗位，闹无政府主义的人”在改正前不能转正。
  people: [liu-shaoqi]
  voices:
    - { voice: official1966, text: 常年性的生产、工作岗位，应该使用固定工，不得再招用临时工（1971 年国务院通知）, cite: ws-cat2-temp-workers, quote: true }
    - { voice: official1966, text: 至今擅自离开工作岗位，闹无政府主义的人，在没有改正错误之前，不能改为固定工（同一通知）, cite: ws-cat2-temp-workers, quote: true }
  cites: [ws-cat2-temp-workers]

- id: 1971-zhiqing-line
  date: 1971
  title: 知青工作转向“路线教育”与“扎根农村”
  lane: mass
  weight: 1
  place: 全国
  summary: 1971 年的几篇经验文章显示知青工作的新问题：有的知青认为“路线斗争咱不管”，有的看到邻队搞“工分挂帅”就想效仿，有的城市居民区干部认为知青下乡后“就是贫下中农的事了”，个别知青“名义上下了乡，实际上却长期蹲在城里”。
  people: []
  voices:
    - { voice: official1966, text: 好好劳动当社员，路线斗争咱不管（1971 年《加强党的路线教育　帮助知识青年扎根农村》所批评的看法）, cite: ws-cat2-zhiqing-line, quote: true }
    - { voice: official1966, text: 邻近生产队有的人搞“工分挂帅”、“物质刺激”，几个知识青年看了以后，竟认为这种办法不错（1971 年《要重视知识青年的读书学习》）, cite: ws-cat2-zhiqing-study, quote: true }
    - { voice: official1966, text: 个别知识青年名义上下了乡，实际上却长期蹲在城里吃闲饭（1971 年扬州琼花居民区经验）, cite: ws-cat2-zhiqing-rural, quote: true }
  cites: [ws-cat2-zhiqing-line, ws-cat2-zhiqing-study, ws-cat2-zhiqing-rural]

- id: 1972-capital-construction
  date: 1972
  title: 国务院整顿基本建设：“战线有些长，浪费大”
  lane: econ
  weight: 1
  place: 全国
  summary: 根据 1972 年全国计划会议纪要，国务院批转国家计委、建委、财政部的意见，承认基本建设“战线有些长，浪费大，制度松弛，贪大求洋”，规定一切基建纳入计划、“一律不准搞计划外工程”，并试点投资“大包干”。
  people: []
  voices:
    - { voice: official1966, text: 主要是战线有些长，浪费大，制度松弛，贪大求洋的思想比较严重（1972 年国务院批转意见）, cite: ws-cat2-capital-construction, quote: true }
    - { voice: official1966, text: 各地区、各部门，一律不准搞计划外工程（同一意见）, cite: ws-cat2-capital-construction, quote: true }
  cites: [ws-cat2-capital-construction]

