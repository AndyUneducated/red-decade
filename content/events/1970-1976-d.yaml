  cites: [ws-1971-belgium]

- id: 1971-11-02-peru
  date: 1971-11-02
  title: 中国与秘鲁建交：承认二百浬海域主权
  lane: intl
  weight: 1
  place: 渥太华
  summary: 两国驻加拿大大使换文建交。公报中中国承认秘鲁对沿岸二百浬海域的主权；1972 年中阿公报也承认阿根廷的二百海里管辖权。
  people: []
  voices:
    - { voice: doc, text: 中国政府承认秘鲁对邻接其海岸的二百浬范围以内的海域的主权（1971 年中秘建交公报）, cite: ws-1971-peru, quote: true }
    - { voice: doc, text: 中华人民共和国承认阿根廷共和国对邻接其海岸的二百海里范围以内的海域的管辖权（1972 年中阿公报）, cite: ws-1972-argentina, quote: true }
  cites: [ws-1971-peru, ws-1972-argentina]

- id: 1971-recognitions
  date: 1971
  title: 1971 年的建交潮
  lane: intl
  weight: 2
  place: 多国
  summary: 1971 年中国先后与尼日利亚、科威特、奥地利、土耳其、伊朗、比利时、秘鲁等国建交。公报措辞因国而异：对非洲国家强调反殖民主义，对科威特写入“支持阿拉伯反对帝国主义和犹太复国主义”，对伊朗写入支持其“保护本国资源”。
  people: []
  voices:
    - { voice: doc, text: 鉴于中华人民共和国支持阿拉伯反对帝国主义和犹太复国主义斗争的尊贵立场（中科建交公报）, cite: ws-1971-kuwait, quote: true }
    - { voice: doc, text: 中华人民共和国政府坚决支持伊朗王国政府为维护民族独立和国家主权以及保护本国资源而进行的正义斗争（中伊建交公报）, cite: ws-1971-iran, quote: true }
    - { voice: doc, text: 尼日利亚联邦共和国政府承认中华人民共和国政府为代表全中国人民的唯一合法政府（中尼建交公报）, cite: ws-1971-nigeria, quote: true }
    - { voice: doc, text: 土耳其政府承认中华人民共和国政府为中国的唯一合法政府（中土建交公报）, cite: ws-1971-turkey, quote: true }
  cites: [ws-1971-kuwait, ws-1971-iran, ws-1971-nigeria, ws-1971-turkey, ws-1971-austria, ws-1971-belgium, ws-1971-peru]

- id: 1971-laos-statement
