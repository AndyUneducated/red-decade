    - { voice: doc, text: 根据历史的经验和“文化大革命”的教训，草案关于公民的各项基本权利的规定，不仅恢复了一九五四年宪法的内容，而且规定得更加切实和明确，还增加了新的内容。例如关于公民的人格尊严不受侵犯的条文，是新增加的（1982 年 11 月 26 日彭真关于宪法修改草案的报告）, cite: reformdata-1982-peng-zhen-constitution-report, quote: true }
  cites: [ws-1982-12-04-constitution, ws-1978-03-05-constitution, reformdata-1982-peng-zhen-constitution-report]

- id: 1982-economic-crime-campaign
