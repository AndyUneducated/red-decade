    - { voice: doc, text: 我们要有两手，一手就是坚持对外开放和对内搞活经济的政策，一手就是坚决打击经济犯罪活动（同一讲话）, cite: reformdata-1982-deng-economic-crime, quote: true }
  cites: [ws-1982-procuratorate-report, reformdata-1982-deng-economic-crime]

