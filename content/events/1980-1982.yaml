  end: 1982-12
  title: 打击经济领域严重犯罪
  lane: econ
  weight: 1
  summary: 1982 年开展打击“经济领域中的严重犯罪活动”。最高人民检察院年底的工作报告把它和整顿城乡社会治安并列为一年的中心工作，同时强调检察机关只办“触犯刑法”的案件，一般违纪交党纪、政纪处理。4 月 10 日中央政治局讨论中共中央、国务院的打击经济犯罪决定时，邓小平说卷进来的“不是小量的，而是大量的”，要“从快从严从重”，每个省四五月间“要抓几个大案”。
  people: [deng-xiaoping]
  voices:
