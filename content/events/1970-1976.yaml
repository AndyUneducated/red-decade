  title: 公布毛泽东关于理论问题的指示：学习无产阶级专政理论
  lane: ideology
  weight: 2
  place: 北京
  summary: 《人民日报》《红旗》编者按公布毛泽东“最近”关于理论问题的指示：要搞清楚“对资产阶级专政”的问题；八级工资制、按劳分配、货币交换“跟旧社会没有多少差别”，只能在无产阶级专政下加以限制；“林彪一类如上台，搞资本主义制度很容易”。随后姚文元、张春桥发表长文，全国开展学习无产阶级专政理论运动。
  people: [mao-zedong, yao-wenyuan, zhang-chunqiao]
  voices:
    - { voice: official1966, text: 列宁为什么说对资产阶级专政，这个问题要搞清楚。这个问题不搞清楚，就会变修正主义。要使全国知道（毛泽东指示，1975 年 2 月 22 日公布）, cite: rmrb-1975-02-22-marx-dictatorship, quote: true }
    - { voice: official1966, text: 现在还实行八级工资制，按劳分配，货币交换，这些跟旧社会没有多少差别（同一指示）, cite: rmrb-1975-02-22-marx-dictatorship, quote: true }
    - { voice: official1966, text: 要告诉春桥、文元把列宁著作中好几处提到这个问题的找出来，印大字本送我。大家先读，然后写文章。要春桥写这类文章（1975 年 2 月 18 日中共中央通知所附指示全文，比公开发表的多出点名部分）, cite: ws-1975-02-18-notice, quote: true }
    - { voice: official1966, text: 所以，林彪一类如上台，搞资本主义制度很容易（同一通知）, cite: ws-1975-02-18-notice, quote: true }
  cites: [rmrb-1975-02-22-marx-dictatorship, ws-1975-02-18-notice]

