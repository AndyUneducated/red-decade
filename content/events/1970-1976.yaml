# Events, 1970–1976（M4 第一批）：卫星与“五·二〇声明”、林彪事件的逐级传达、中美接近、十大、批林批孔、四届人大与七五宪法、
# 理论问题指示与《水浒》评论、反击右倾翻案风、1976 年的悼念、唐山地震与毛泽东追悼会、十月的决定与庆祝。
# Sources: 当时的《人民日报》、中共中央文件与会议文献（维基文库），美国《对外关系文件》（FRUS 1969–1976 第十七、十八卷）。
# 当时的官方说法用 official1966；美国政府当时的谈话记录、报告与情报评估用 foreign，只代表美方当时的观察与判断。

- id: 1970-04-24-dongfanghong-1
  date: 1970-04-24
  title: 第一颗人造地球卫星“东方红一号”发射
  lane: econ
  weight: 2
  place: 发射地点当时未公布
  summary: 新华社 4 月 25 日公报宣布，4 月 24 日中国成功发射第一颗人造地球卫星，重 173 公斤，播送《东方红》乐曲。报道把它归功于“以毛主席为首、林副主席为副的党中央”，称之为“无产阶级文化大革命的又一丰硕成果”。
  people: [mao-zedong, lin-biao]
  voices:
    - { voice: doc, text: 一九七○年四月二十四日，我国成功地发射了第一颗人造地球卫星（1970 年新华社新闻公报）, cite: rmrb-1970-04-26-satellite, quote: true }
    - { voice: doc, text: 卫星重一百七十三公斤，用二○·○○九兆周的频率，播送《东方红》乐曲（同日《人民日报》标题）, cite: rmrb-1970-04-26-satellite, quote: true }
    - { voice: official1966, text: 是毛主席无产阶级革命路线的伟大胜利，是无产阶级文化大革命的又一丰硕成果（同日《人民日报》）, cite: rmrb-1970-04-26-satellite, quote: true }
  cites: [rmrb-1970-04-26-satellite]
- id: 1970-05-20-mao-statement
  topics: [global]
  date: 1970-05-20
  title: 毛泽东“五·二〇声明”：“当前世界的主要倾向是革命”
  lane: intl
  weight: 2
  place: 北京
  summary: 美军进入柬埔寨后，毛泽东以个人名义发表声明，支持西哈努克和印度支那三国人民，号召“全世界人民团结起来，打败美国侵略者及其一切走狗”。声明中“当前世界的主要倾向是革命”一句，此后被 1972 年元旦社论等反复引用。美国情报部门同月的评估认为，北京借柬埔寨局势削弱苏联在印度支那的影响。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 新的世界大战的危险依然存在，各国人民必须有所准备。但是，当前世界的主要倾向是革命（毛泽东 1970 年 5 月 20 日声明）, cite: rmrb-1970-05-21-mao-statement, quote: true }
    - { voice: official1966, text: 我热烈支持柬埔寨国家元首诺罗敦·西哈努克亲王反对美帝及其走狗的斗争精神（同一声明）, cite: rmrb-1970-05-21-mao-statement, quote: true }
    - { voice: foreign, text: 'Peking’s careful campaign to exploit Sihanouk, recently emphasized in a major pronouncement by Mao himself, is also intended to diminish Soviet influence in Indochina（1970 年 5 月美国情报评估）', cite: frus-v17-d82, quote: true }
  cites: [rmrb-1970-05-21-mao-statement, frus-v17-d82, ws-1972-01-01-editorial]

- id: 1971-04-14-pingpong
  date: 1971-04-14
  title: 乒乓外交：周恩来会见美国等国乒乓球队
  lane: intl
  weight: 2
  place: 北京人民大会堂
  summary: 参加第三十一届世乒赛后，加拿大、哥伦比亚、英格兰、尼日利亚和美国的乒乓球代表团应邀访华。4 月 14 日周恩来同时会见五国代表团，新华社把美国代表团同其他四国并列报道。三个月后基辛格秘密访华。
  people: [zhou-enlai]
  voices:
    - { voice: doc, text: 中华人民共和国国务院总理周恩来今天下午会见了应邀前来我国进行访问的加拿大、哥伦比亚、英格兰、尼日利亚和美国的乒乓球代表团全体成员（1971 年 4 月 14 日新华社）, cite: rmrb-1971-04-15-pingpong, quote: true }
    - { voice: official1966, text: 各国运动员通过友好往来，交流经验，互相学习，必将进一步增进各国人民之间的友谊（同日《人民日报》标题）, cite: rmrb-1971-04-15-pingpong, quote: true }
  cites: [rmrb-1971-04-15-pingpong]
- id: 1971-07-09-kissinger-secret
  date: 1971-07-09
  end: 1971-07-11
  title: 基辛格秘密访华，7 月 16 日公告尼克松将访华
  lane: intl
  weight: 3
  place: 北京
  summary: 基辛格 7 月 9 日至 11 日在北京同周恩来会谈，叶剑英在座。7 月 16 日双方同时发表公告：周恩来代表中国政府邀请尼克松于 1972 年 5 月以前访华，尼克松“愉快地接受了这一邀请”。美方会谈记录里，周恩来向基辛格谈起文化大革命，基辛格回国后向尼克松报告这次会谈“为你和毛泽东翻开历史新的一页打下了基础”。
  people: [zhou-enlai, ye-jianying, mao-zedong]
  voices:
    - { voice: doc, text: 周恩来总理和尼克松总统的国家安全事务助理基辛格博士，于一九七一年七月九日至十一日在北京进行了会谈（1971 年 7 月 16 日公告）, cite: rmrb-1971-07-16-nixon-announcement, quote: true }
    - { voice: doc, text: 周恩来总理代表中华人民共和国政府邀请尼克松总统于一九七二年五月以前的适当时间访问中国（同一公告）, cite: rmrb-1971-07-16-nixon-announcement, quote: true }
    - { voice: foreign, text: 'He appeared to be genuinely anguished when talking about the difficulties which had cropped up during the Cultural Revolution（美方 7 月 10 日会谈记录，记周恩来谈文革）', cite: frus-v17-d140, quote: true }
    - { voice: foreign, text: 'We have laid the groundwork for you and Mao to turn a page in history（基辛格 7 月 14 日给尼克松的访华报告）', cite: frus-v17-d144, quote: true }
    - { voice: foreign, text: 我们谋求同中华人民共和国建立新的关系的行动不会以牺牲我们老朋友们的利益为代价（尼克松宣布将访华的声明，中译）, cite: ws-1971-nixon-announce, quote: true }
  cites: [rmrb-1971-07-16-nixon-announcement, frus-v17-d139, frus-v17-d140, frus-v17-d144, ws-1971-nixon-announce]

- id: 1971-10-06-huang-wu-li-qiu
  date: 1971-10-06
  title: 中央通知：黄永胜、吴法宪、李作鹏、邱会作离职反省
  lane: army
  weight: 2
  place: 北京
  summary: 林彪出逃后，中央 9 月 18 日、28 日两次发通知，先在地、师以上党委传达。10 月 6 日的通知说，中央已决定黄永胜、吴法宪、李作鹏、邱会作“离职反省、彻底交代”，军委各总部、各军兵种开始揭发批判。美国方面此后的评估把这看作对军队高层的清洗，认为它改变了毛泽东的接班前景，文职领导人此后仍在设法削减军人的政治权力。
  people: [huang-yongsheng, wu-faxian, li-zuopeng, qiu-huizuo, lin-biao, mao-zedong]
  voices:
    - { voice: official1966, text: 中央决定黄永胜、吴法宪、李作鹏、邱会作离职反省、彻底交代以后，军委各总部、各军兵种党组织也开始对黄、吴、李、邱揭发批判（1971 年 10 月 6 日中共中央通知）, cite: ws-1971-10-06-notice, quote: true }
    - { voice: foreign, text: 'The purge has obviously altered the prospects for the succession to Mao Tse-tung（1972 年 7 月美国国家情报评估）', cite: frus-v17-d240, quote: true }
    - { voice: foreign, text: 'The civilian leaders now find the military reluctant to relinquish their authority, even in the wake of Lin’s death while fleeing toward the Soviet Union（1973 年 3 月美国国务院分析）', cite: frus-v18-d23, quote: true }
    - { voice: witness, text: 一九七一年九月二十四日凌晨四点，我的秘书张叔良接到中央办公厅的电话通知，要我上午八时到人民大会堂福建厅参加军委办事组的会议（吴法宪回忆，他在这次会上被收审，早于 10 月 6 日通知）, cite: wu-faxian-memoir-cwo, quote: true }
  cites: [ws-1971-10-06-notice, frus-v17-d240, frus-v18-d23, wu-faxian-memoir-cwo]

- id: 1971-10-20-kissinger-second
  date: 1971-10-20
  title: 基辛格第二次访华，筹备尼克松之行
  lane: intl
  weight: 1
  place: 北京
  summary: 基辛格率团再次访华，为尼克松访问商定具体安排。他在给尼克松的报告里记下了一个细节：沿途一些标语被涂掉，随员认为其中一些是新近涂的。基辛格在京期间，联合国大会于 10 月 25 日表决恢复中国席位。
  people: [zhou-enlai]
  voices:
    - { voice: foreign, text: 'my staff assures me that at least some of the blotted-out slogans looked freshly done（基辛格给尼克松的访华报告）', cite: frus-v17-d163, quote: true }
  cites: [frus-v17-d163, frus-v17-d156]
- id: 1971-10-24-lin-affair-public
  date: 1971-10-24
  title: 林彪事件向全国工农兵传达
  lane: mass
  weight: 2
  place: 全国
  summary: 中央通知把林彪事件的传达范围扩大到全体党员、战士、职工、社员和大中学生，限 11 月底以前传达完毕。传达文件包括毛泽东的《我的一点意见》。“地、富、反、坏、右”、正在受审查的人和外国人都不能听传达。
  people: [lin-biao, mao-zedong]
  voices:
    - { voice: official1966, text: 中央决定：各地、各单位自接到通知之日起，将林彪叛党叛国事件，向全国广大工农兵群众传达（1971 年 10 月 24 日中共中央通知）, cite: ws-1971-10-24-notice, quote: true }
    - { voice: doc, text: 地、富、反、坏、右、资本家，有严重政治历史问题和正在进行审查的人，都不能听传达。外国人也不能听传达（同一通知）, cite: ws-1971-10-24-notice, quote: true }
    - { voice: doc, text: 但最迟应在十一月底以前传达完毕（同一通知）, cite: ws-1971-10-24-notice, quote: true }
  cites: [ws-1971-10-24-notice, ws-1971-10-06-notice]

- id: 1971-11-14-571-notice
  date: 1971-11-14
  title: 中央通报查获《“571工程”纪要》
  lane: center
  weight: 2
  place: 北京
  summary: 中央通知说，在林立果设在空军学院的秘密据点查获了《“571工程”纪要》，证明政变“早有预谋”。通知概括其内容：国内要实行“地主买办资产阶级的法西斯专政”，国际上要“投降苏修社会帝国主义”。两个月后《纪要》原文作为“材料之二”下发，要求逐条批判。
  people: [lin-biao, lin-liguo]
  voices:
    - { voice: official1966, text: 从林彪的儿子林立果在北京空军学院的秘密据点里，查获了林彪一伙制定的反革命政变纲领《“571工程”纪要》（1971 年 11 月中共中央通知）, cite: ws-1971-11-14-notice, quote: true }
    - { voice: official1966, text: 在国际，他们要投降苏修社会帝国主义，联苏联美反共反华反革命（同一通知）, cite: ws-1971-11-14-notice, quote: true }
  cites: [ws-1971-11-14-notice]

- id: 1971-12-11-lin-material-1
  date: 1971-12-11
  title: 林陈集团“材料之一”下发，批林整风展开
  lane: center
  weight: 1
  place: 全国
  summary: 中央下发专案组整理的《粉碎林陈反党集团反革命政变的斗争》（材料之一），按上一通知的范围组织传达讨论。此后“材料之二”（1972 年 1 月）、“材料之三”（1972 年 7 月）陆续下发，“批林整风”成为 1972 年的主要运动。
  people: [lin-biao, chen-boda]
  voices:
    - { voice: official1966, text: 现将中央专案组整理的《粉碎林陈反党集团反革命政变的斗争》（材料之一）发给你们，请你们立即组织传达和讨论（1971 年 12 月中共中央通知）, cite: ws-1971-12-11-notice, quote: true }
  cites: [ws-1971-12-11-notice, ws-1971-12-lin-chen-material-1]

- id: 1972-01-01-tianxia-daluan
  date: 1972-01-01
  title: 1972 年元旦社论：世界形势“天下大乱”
  lane: intl
  weight: 1
  place: 北京
  summary: 元旦社论引用毛泽东“五·二〇声明”，用“乱”字概括国际形势，并把恢复联合国席位、同十五个国家建交列为过去一年的外交胜利。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 今日世界形势的特点，可以用一个字来概括，就是“乱”，或者叫“天下大乱”（1972 年元旦社论）, cite: ws-1972-01-01-editorial, quote: true }
    - { voice: official1966, text: 我国又同十五个国家建立了外交关系，特别是我国在联合国的合法权利得到恢复（同一社论）, cite: ws-1972-01-01-editorial, quote: true }
  cites: [ws-1972-01-01-editorial]
- id: 1972-01-10-chen-yi-memorial
  date: 1972-01-10
  title: 陈毅追悼会，毛泽东出席
  lane: center
  weight: 2
  place: 北京八宝山革命公墓
  summary: 陈毅 1 月 6 日因肠癌去世，终年七十一岁。10 日在八宝山开追悼会，毛泽东出席，并慰问陈毅的夫人张茜和子女；周恩来致悼词，西哈努克夫妇应邀参加。
  people: [chen-yi, mao-zedong, zhou-enlai, jiang-qing, ye-jianying, zhang-chunqiao, li-xiannian]
  voices:
    - { voice: doc, text: 因患肠癌，治疗无效，于一九七二年一月六日在北京不幸逝世。终年七十一岁（1972 年 1 月 10 日新华社）, cite: rmrb-1972-01-11-chenyi-memorial, quote: true }
    - { voice: official1966, text: 我们的伟大领袖毛主席参加了追悼会，并向陈毅同志的家属张茜同志及其子女亲切慰问（同一报道）, cite: rmrb-1972-01-11-chenyi-memorial, quote: true }
  cites: [rmrb-1972-01-11-chenyi-memorial]
- id: 1972-01-13-lin-material-2
  date: 1972-01-13
  title: “材料之二”下发：逐条批判《“571工程”纪要》
  lane: center
  weight: 2
  place: 全国
  summary: 中央同日发两个通知：一是扩大“材料之一”的发放，工矿发到班组、农村发到生产队、军队发到排；二是下发“材料之二”，内容是《“571工程”纪要》的出笼经过和原文，要求先在干部中、再向群众传达，“逐条逐段地批判”。《纪要》称毛泽东为“当代的秦始皇”，这些话由此传到了全国的生产队。
  people: [lin-biao, lin-liguo, ye-qun, mao-zedong]
  voices:
    - { voice: official1966, text: 传达讨论的重点是批判林彪一伙炮制的《“571工程”纪要》反革命纲领（1972 年 1 月 13 日中共中央通知）, cite: ws-1972-01-13-notice-4, quote: true }
    - { voice: doc, text: 农村发至生产队，三十户以下的发两份，三十户至五十户的发三份（同日另一通知）, cite: ws-1972-01-13-notice-3, quote: true }
    - { voice: doc, text: 打倒当代的秦始皇——Ｂ－５２，推翻挂着社会主义招牌的封建王朝（《“571工程”纪要》原文，录自“材料之二”）, cite: ws-1972-lin-material-2, quote: true }
  cites: [ws-1972-01-13-notice-3, ws-1972-01-13-notice-4, ws-1972-lin-material-2]

- id: 1972-02-21-mao-nixon
  topics: [global]
  date: 1972-02-21
  title: 毛泽东会见尼克松
  lane: intl
  weight: 3
  place: 北京中南海
  summary: 尼克松到京当天下午，毛泽东在中南海会见他，基辛格、周恩来在座。新华社只说进行了“认真、坦率的谈话”。美方记录显示，毛泽东在谈话中提到了林彪出逃。访问前基辛格给尼克松的备忘录说，去年秋天的神秘事件说明毛、周接近美国冒了很大风险。
  people: [mao-zedong, zhou-enlai]
  voices:
    - { voice: doc, text: 毛泽东主席今天下午在中南海会见美国总统理查德·尼克松，同他进行了认真、坦率的谈话（1972 年 2 月 21 日新华社）, cite: rmrb-1972-02-22-mao-nixon, quote: true }
    - { voice: foreign, text: 'In our country also there is a reactionary group which is opposed to our contact with you.……The result was that they got on an airplane and fled abroad（美方谈话记录，毛泽东语）', cite: frus-v17-d194, quote: true }
    - { voice: foreign, text: 'the mysterious events last fall and the alleged Lin Piao challenge underline the great gamble Mao and Chou have taken in dealing with us and inviting you（基辛格 2 月 19 日给尼克松的备忘录）', cite: frus-v17-d193, quote: true }
  cites: [rmrb-1972-02-22-mao-nixon, frus-v17-d194, frus-v17-d193]

- id: 1972-02-27-shanghai-communique
  topics: [hk-macau-taiwan]
  date: 1972-02-27
  title: 中美上海公报
  lane: intl
  weight: 2
  place: 上海
  summary: 尼克松访华（2 月 21–28 日）期间访问北京、杭州、上海，27 日在上海达成联合公报。公报采取双方各自表述立场的写法，中方部分以“哪里有压迫，哪里就有反抗”开头。
  people: [zhou-enlai, mao-zedong, ji-pengfei]
  voices:
    - { voice: doc, text: 中华人民共和国和美利坚合众国领导人经过这么多年一直没有接触之后，现在有机会坦率地互相介绍彼此对各种问题的观点（1972 年 2 月 27 日联合公报）, cite: rmrb-1972-02-28-shanghai-communique, quote: true }
    - { voice: official1966, text: 中国方面声明：哪里有压迫，哪里就有反抗（同一公报）, cite: rmrb-1972-02-28-shanghai-communique, quote: true }
  cites: [rmrb-1972-02-28-shanghai-communique, frus-v17-d203]

- id: 1972-07-02-lin-material-3
  date: 1972-07-02
  title: “材料之三”下发，以毛泽东南巡谈话为武器批林整风
  lane: center
  weight: 1
  place: 全国
