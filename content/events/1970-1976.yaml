  weight: 2
  place: 北京
  summary: 《人民日报》社论公布毛泽东关于《水浒》的谈话，号召开展评论：宋江“投降，搞修正主义”，“屏晁盖于一百○八人之外”。评《水浒》成为 1975 年秋的全国性运动。
  people: [mao-zedong]
  voices:
    - { voice: official1966, text: 《水浒》这部书，好就好在投降。做反面教材，使人民都知道投降派（毛泽东语，1975 年 9 月 4 日社论公布）, cite: rmrb-1975-09-04-shuihu, quote: true }
    - { voice: official1966, text: 《水浒》只反贪官，不反皇帝。屏晁盖于一百○八人之外（同一社论引毛泽东语）, cite: rmrb-1975-09-04-shuihu, quote: true }
  cites: [rmrb-1975-09-04-shuihu]

- id: 1975-10-21-mao-kissinger
  topics: [global]
  date: 1975-10-21
  title: 毛泽东会见基辛格：“我们都死了以后，你们还活着”
  lane: intl
  weight: 1
  place: 北京
  summary: 基辛格为福特访华做准备，邓小平陪同见毛泽东。美方记录里，毛泽东指着邓小平说他七十一岁，又说自己、邓小平、周恩来、叶剑英都死了以后，基辛格还会活着。基辛格向福特报告，毛泽东说大问题是国际形势、小问题是台湾。
  people: [mao-zedong, deng-xiaoping, zhou-enlai, ye-jianying]
  voices:
    - { voice: foreign, text: 'And after we’re all dead, myself, him (Teng), Chou En-lai, and Yeh Chien-ying, you will still be alive（美方谈话记录，毛泽东语）', cite: frus-v18-d124, quote: true }
    - { voice: foreign, text: 'he said that the big issue is the international situation and the small issue is Taiwan（1975 年 11 月基辛格给福特的简报）', cite: frus-v18-d132, quote: true }
  cites: [frus-v18-d124, frus-v18-d132]

- id: 1975-12-01-ford
  date: 1975-12-01
  title: 福特访华，邓小平主持接待
  lane: intl
  weight: 1
  place: 北京
  summary: 美国总统福特到京，周恩来委托邓小平主持欢迎宴会；12 月 2 日毛泽东会见福特。基辛格行前给福特的简报说，已有迹象表明邓小平可能面临政治挑战。两天后北大清华大批判组的文章见报。
  people: [deng-xiaoping, zhou-enlai, mao-zedong, li-xiannian, wu-de, qiao-guanhua]
  voices:
    - { voice: doc, text: 邓小平副总理代表中国政府和周恩来总理对美国客人来访表示欢迎（1975 年 12 月 1 日新华社）, cite: rmrb-1975-12-02-ford, quote: true }
    - { voice: foreign, text: 'we have other indications that Teng may be the object of a political challenge（1975 年 11 月基辛格给福特的简报）', cite: frus-v18-d132, quote: true }
    - { voice: foreign, text: 'And Teng Hsiao-p’ing does not like the Soviet Union either（美方 12 月 2 日毛泽东—福特谈话记录）', cite: frus-v18-d134, quote: true }
  cites: [rmrb-1975-12-02-ford, frus-v18-d132, frus-v18-d134]

- id: 1975-12-04-education-direction
  date: 1975-12-04
  title: 北大清华大批判组《教育革命的方向不容篡改》
  lane: culture
  weight: 2
  place: 北京
  summary: 文章不点名地批判教育界要把教育革命“扭”回去的说法，把争论定性为是坚持教育革命还是“为修正主义教育路线翻案”。
  people: []
  voices:
    - { voice: official1966, text: 说什么文化大革命以来，教育革命这也不行，那也不是，教育革命的方向“总没有解决好”，因而“就是要扭”（北京大学、清华大学大批判组文章）, cite: rmrb-1975-12-04-education-direction, quote: true }
    - { voice: official1966, text: 是坚持教育要革命的方向，把无产阶级教育革命进行到底，还是为修正主义教育路线翻案（同一文章）, cite: rmrb-1975-12-04-education-direction, quote: true }
  cites: [rmrb-1975-12-04-education-direction]
- id: 1976-01-01-mao-poems
  date: 1976-01-01
  title: 发表毛泽东词二首：《重上井冈山》《鸟儿问答》
  lane: culture
  weight: 1
  place: 北京
  summary: 《人民日报》元旦转载《诗刊》1 月号发表的毛泽东 1965 年两首词。《念奴娇·鸟儿问答》讽刺“订了三家条约”和“土豆烧熟了，再加牛肉”，结句为“不须放屁，试看天地翻覆”。
  people: [mao-zedong]
  voices:
    - { voice: doc, text: 还有吃的，土豆烧熟了，再加牛肉。不须放屁，试看天地翻覆（毛泽东《念奴娇·鸟儿问答》）, cite: rmrb-1976-01-01-mao-poems, quote: true }
  cites: [rmrb-1976-01-01-mao-poems]

- id: 1976-01-15-zhou-memorial
  date: 1976-01-15
  title: 周恩来追悼大会，邓小平致悼词
  lane: center
  weight: 2
  place: 北京人民大会堂
  summary: 追悼大会由王洪文主持，邓小平致悼词，五千多人参加。按周恩来遗言，骨灰撒在江河和土地上。美国方面次日的评估认为邓小平最有可能接任总理，但没有周恩来居间协调，他的处境会更难。
  people: [zhou-enlai, deng-xiaoping, wang-hongwen, mao-zedong]
  voices:
    - { voice: official1966, text: 周恩来同志的一生，是为共产主义事业光辉战斗的一生，是坚持继续革命的一生（邓小平悼词）, cite: rmrb-1976-01-16-zhou-memorial, quote: true }
    - { voice: doc, text: 遵照周恩来同志生前的遗言，周恩来同志的骨灰撒在祖国的江河里和土地上（同日《人民日报》标题）, cite: rmrb-1976-01-16-zhou-memorial, quote: true }
    - { voice: foreign, text: 'Teng Hsiao-p’ing is the odds-on favorite to move up to the premiership（1976 年 1 月 16 日美方评估）', cite: frus-v18-d140, quote: true }
    - { voice: foreign, text: 'Without Chou’s authority, prestige, and special talents, Teng may find the going even tougher（同一评估）', cite: frus-v18-d140, quote: true }
  cites: [rmrb-1976-01-16-zhou-memorial, frus-v18-d140]

- id: 1976-04-07-hua-deng-resolutions
  date: 1976-04-07
  title: 政治局两项决议：华国锋任第一副主席、总理，撤销邓小平一切职务
  lane: center
  weight: 3
  place: 北京
  summary: 天安门广场事件两天后，政治局根据毛泽东提议通过两项决议：华国锋任中共中央第一副主席、国务院总理；认定邓小平问题“已经变为对抗性的矛盾”，撤销其党内外一切职务，“保留党籍，以观后效”。1981 年历史决议认为这是错误的。
  people: [hua-guofeng, deng-xiaoping, mao-zedong]
  voices:
    - { voice: official1966, text: 根据伟大领袖毛主席提议，中共中央政治局一致通过，华国锋同志任中国共产党中央委员会第一副主席，中华人民共和国国务院总理（1976 年 4 月 7 日决议）, cite: ws-1976-04-07-hua-resolution, quote: true }
    - { voice: official1966, text: 认为邓小平问题的性质已经变为对抗性的矛盾（同日另一决议）, cite: ws-1976-04-07-deng-resolution, quote: true }
    - { voice: official1966, text: 撤销邓小平党内外一切职务，保留党籍，以观后效（同一决议）, cite: ws-1976-04-07-deng-resolution, quote: true }
    - { voice: official1981, text: 并且错误地撤销了邓小平同志的党内外一切职务（1981 年历史决议）, cite: ws-1981-resolution, quote: true }
  cites: [ws-1976-04-07-hua-resolution, ws-1976-04-07-deng-resolution, ws-1981-resolution]

- id: 1976-07-28-tangshan
  date: 1976-07-28
  title: 唐山大地震
  lane: local
  weight: 3
  place: 河北唐山、丰南
  summary: 7 月 28 日 3 时 42 分，唐山—丰南一带发生 7.5 级地震（当时测定），天津、北京有较强震感。新华社当天只说震中地区“遭到不同程度的损失”；中共中央慰问电承认唐山“破坏和损失极其严重”，同时号召灾区“以阶级斗争为纲，深入批邓”。这两篇报道都没有提伤亡人数。
  people: []
  voices:
    - { voice: doc, text: 我国河北省冀东地区的唐山—丰南一带，七月二十八日三时四十二分发生强烈地震（1976 年 7 月 28 日新华社）, cite: rmrb-1976-07-29-tangshan, quote: true }
    - { voice: official1966, text: 尤其是唐山市遭到的破坏和损失极其严重（中共中央慰问电）, cite: rmrb-1976-07-29-tangshan-condolence, quote: true }
    - { voice: official1966, text: 以阶级斗争为纲，深入批邓，团结起来，向严重的自然灾害进行斗争（同一慰问电）, cite: rmrb-1976-07-29-tangshan-condolence, quote: true }
  cites: [rmrb-1976-07-29-tangshan, rmrb-1976-07-29-tangshan-condolence]

- id: 1976-09-16-jiding-fangzhen
  date: 1976-09-16
  title: 两报一刊社论：“按既定方针办”
  lane: ideology
  weight: 2
  place: 北京
  summary: 毛泽东去世一周后，两报一刊社论《毛主席永远活在我们心中》公布毛泽东“嘱咐”：“按既定方针办”，并要求把批邓、反击右倾翻案风继续深入下去。这句话在 9 月 18 日追悼大会的报道中再次出现。一个月后，中央通知说这是“四人帮”伪造的临终嘱咐：毛泽东 4 月 30 日的手书是“照过去方针办”，华国锋 10 月 2 日已在批示中指出。
  people: [mao-zedong, deng-xiaoping, hua-guofeng, wang-hongwen, zhang-chunqiao, jiang-qing, yao-wenyuan]
  voices:
    - { voice: official1966, text: 毛主席嘱咐我们：“按既定方针办”（1976 年 9 月 16 日两报一刊社论）, cite: rmrb-1976-09-16-mao-editorial, quote: true }
    - { voice: official1966, text: 当前，要把毛主席亲自发动的批判邓小平、反击右倾翻案风的斗争继续深入地开展下去（同一社论）, cite: rmrb-1976-09-16-mao-editorial, quote: true }
    - { voice: official1966, text: 他们有计划有预谋地伪造了一个“按既定方针办”的所谓毛主席的临终嘱咐，在九月十六日的两报一刊社论中发表（1976 年 10 月 18 日中共中央通知）, cite: ws-1976-10-18-notice, quote: true }
    - { voice: official1966, text: 毛主席一九七六年四月三十日亲笔写的指示是“照过去方针办”，“按既定方针办”六个字错了三个（同一通知）, cite: ws-1976-10-18-notice, quote: true }
  cites: [rmrb-1976-09-16-mao-editorial, rmrb-1976-09-19-mao-memorial, ws-1976-10-18-notice]
- id: 1976-09-18-mao-memorial
  date: 1976-09-18
  title: 毛泽东追悼大会
  lane: center
  weight: 2
  place: 北京天安门广场
  summary: 中央规定 9 月 11–17 日在人民大会堂吊唁，18 日下午三时在天安门广场开追悼大会，全国县以上地区同时开会收听实况。大会由王洪文主持，华国锋致悼词，全国默哀三分钟。
  people: [mao-zedong, hua-guofeng, wang-hongwen, ye-jianying, zhang-chunqiao, jiang-qing, yao-wenyuan]
  voices:
    - { voice: doc, text: 九月十八日北京时间下午三时，在天安门广场举行隆重的追悼大会（中共中央等关于悼念活动的决定）, cite: ws-1976-09-mao-funeral-notice, quote: true }
    - { voice: doc, text: 全国县以上地区，要在九月十八日下午三时召开有工农兵以及其他各界代表参加的追悼会（同一决定）, cite: ws-1976-09-mao-funeral-notice, quote: true }
    - { voice: official1966, text: 首都参加大会的百万群众和全国八亿人民肃立，默哀三分钟（1976 年 9 月 18 日新华社）, cite: rmrb-1976-09-19-mao-memorial, quote: true }
  cites: [ws-1976-09-mao-funeral-notice, rmrb-1976-09-19-mao-memorial]

- id: 1976-10-08-memorial-hall
  date: 1976-10-08
  title: 决定建毛主席纪念堂、出版《毛泽东选集》第五卷
  lane: center
  weight: 2
  place: 北京
  summary: 拘押“四人帮”两天后，中央、人大常委会、国务院、军委联合决定在北京建毛主席纪念堂，安放遗体供瞻仰；中共中央另决定尽快出版《毛泽东选集》第五卷，筹备《毛泽东全集》，编辑出版工作由“以华国锋同志为首的中共中央政治局直接领导”。
  people: [hua-guofeng, mao-zedong]
  voices:
    - { voice: official1966, text: 在首都北京建立伟大的领袖和导师毛泽东主席纪念堂（1976 年 10 月 8 日决定）, cite: rmrb-1976-10-09-memorial-hall, quote: true }
    - { voice: official1966, text: 出版《毛泽东选集》和《毛泽东全集》的工作，由以华国锋同志为首的中共中央政治局直接领导（中共中央同日决定）, cite: rmrb-1976-10-09-mao-works, quote: true }
  cites: [rmrb-1976-10-09-memorial-hall, rmrb-1976-10-09-mao-works]

- id: 1976-10-21-celebrations
  date: 1976-10-21
  end: 1976-10-24
  title: 首都庆祝游行与百万人大会：庆祝华国锋任主席、粉碎“四人帮”
  lane: mass
  weight: 2
  place: 北京天安门广场
  summary: 10 月 21 日北京一百五十万军民游行，24 日天安门广场百万人大会，华国锋出席，吴德讲话。声讨“四人帮”用的是“党内资产阶级的典型代表”“不肯改悔的正在走的走资派”，同半年前批邓时的说法一样。
  people: [hua-guofeng, wu-de, ye-jianying, li-xiannian, wang-dongxing, chen-xilian, wang-hongwen, zhang-chunqiao, jiang-qing, yao-wenyuan]
  voices:
    - { voice: official1966, text: 今天，首都一百五十万军民欢欣鼓舞，豪情满怀，举行声势浩大的庆祝游行（1976 年 10 月 21 日新华社）, cite: rmrb-1976-10-22-parade, quote: true }
    - { voice: official1966, text: 指出他们是党内资产阶级的典型代表，是不肯改悔的正在走的走资派（同一报道）, cite: rmrb-1976-10-22-parade, quote: true }
    - { voice: official1966, text: 首都一百万军民，今天欢欣鼓舞，豪情满怀，在雄伟庄严的天安门广场举行隆重、盛大的庆祝大会（1976 年 10 月 24 日新华社）, cite: rmrb-1976-10-25-rally, quote: true }
    - { voice: official1966, text: 妄图扭转批判不肯改悔的走资派邓小平的修正主义路线，反击右倾翻案风的大方向（半年前，1976 年 4 月 5 日吴德广播讲话）, cite: rmrb-1976-04-08-wude, quote: true }
  cites: [rmrb-1976-10-22-parade, rmrb-1976-10-25-rally, rmrb-1976-04-08-wude]
