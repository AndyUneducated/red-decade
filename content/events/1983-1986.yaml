- id: 1985-unified-purchase-reform
  date: 1985
  title: 改革农产品统购派购制度
  lane: econ
  weight: 2
  summary: 1985 年起粮棉等主要农产品取消统购派购，改为合同定购和市场收购。统购统销始于 1953 年，是大跃进饥荒时期征购过头的制度基础。同年统计公报也承认总需求超过总供给、物价上涨幅度较大。
  people: []
  voices:
    - { voice: officialLater, text: 1985年我国农村在改革农产品统购派购制度、调整产业结构方面迈出了重大的一步（1985 年统计公报）, cite: rmrb-1986-03-01-stats-1985, quote: true }
    - { voice: officialLater, text: 表现在固定资产投资规模过大，社会购买力超过商品供应量，进口增加过快，物价上涨幅度较大（同一公报）, cite: rmrb-1986-03-01-stats-1985, quote: true }
  cites: [rmrb-1986-03-01-stats-1985]

