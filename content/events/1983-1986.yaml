  summary: 处遗的善后以钱和证书为主。龙州县查明文革中被枪杀、打死、迫害自杀 325 人，给家属发平反证书，并按项目发安葬费、抚恤费、抚养费、生活困难补助、建房费；崇左县组织三百多人清查大案要案，拨款八十万二千五百元抚恤，安排 93 名遗属子女工作。
  people: []
