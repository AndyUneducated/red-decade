    - { voice: officialLater, text: 并拨款802500元对受害者家属进行抚恤（崇左县文革大事件）, cite: ccrd-1987-gx-chongzuo-25, quote: true }
  cites: [ccrd-1987-gx-longzhou-66, ccrd-1987-gx-chongzuo-25]

