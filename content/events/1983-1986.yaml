- id: 1984-liandong-rehab
  date: 1984
  title: 中组部、公安部、团中央：“联动”“西纠”彻底平反
  lane: mass
  weight: 2
  place: 北京
  summary: 1966 年“首都红卫兵西城纠察队”和“首都中学红卫兵联合行动委员会”是北京的中学红卫兵组织，江青公开要求镇压“西纠”，1967 年《红旗》社论把“联动”列为反动组织，数百人被捕关押。北京市公安局 1979 年已为他们平反，这份文件稿再次宣布彻底平反，并要求公安机关逐人作平反结论；同时规定其中犯有严重错误或罪行的极少数人按清理“三种人”的规定处理。受迫害与加害，在同一份平反文件里分开处理。
  people: []
  concepts: [bloodline]
  voices:
    - { voice: officialLater, text: 林彪、江青反革命集团对这两个红卫兵组织的各种诬陷和迫害，在全国造成了很坏的影响，应彻底平反，恢复名誉（1984 年平反通知稿）, cite: ws-1984-liandong-rehab, quote: true }
    - { voice: officialLater, text: 对这两个中学红卫兵组织中极少数犯有严重错误或罪行的人，应按中央《关于清理“三种人”若干问题的补充通知》规定处理（同一文件）, cite: ws-1984-liandong-rehab, quote: true }
  cites: [ws-1984-liandong-rehab]

- id: 1984-09-26-hongkong-declaration
