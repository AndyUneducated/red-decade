  summary: 同日判决的还有刘庆棠。他是《红色娘子军》洪常青的扮演者，文革中从芭蕾舞剧团演员升为文化部副部长，1982 年 9 月被捕，1983 年 3 月起诉。样板戏系统的人，到此也进了审判。
