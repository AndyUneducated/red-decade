  cites: [ws-1984-09-26-hongkong-declaration, ws-1984-hongkong-report]

- id: 1984-10-20-economic-reform
  date: 1984-10-20
  title: 《关于经济体制改革的决定》：“有计划的商品经济”
  lane: econ
  weight: 3
  place: 北京
  summary: 十二届三中全会决定把改革重点从农村转向城市，把社会主义经济定义为“在公有制基础上的有计划的商品经济”，并把旧体制的弊端写成政企不分、统得过死、忽视价值规律和市场、分配平均主义。
  people: [zhao-ziyang, hu-yaobang, deng-xiaoping, zhang-chunqiao]
  concepts: [two-lines]
  voices:
    - { voice: doc, text: 是在公有制基础上的有计划的商品经济（1984 年《关于经济体制改革的决定》对社会主义经济的定义）, cite: ws-1984-10-20-economic-reform, quote: true }
    - { voice: doc, text: 这种模式的主要弊端是：政企职责不分，条块分割，国家对企业统得过多过死，忽视商品生产、价值规律和市场的作用，分配中平均主义严重（同一决定）, cite: ws-1984-10-20-economic-reform, quote: true }
  cites: [ws-1984-10-20-economic-reform]

- id: 1984-12-03-ban-cadre-business
  date: 1984-12-03
  title: 中共中央、国务院禁止党政机关和干部经商
  lane: econ
  weight: 1
  summary: 城市改革刚开始，中央就发现党政机关和干部利用权力办公司，决定一律不准独资、合股、兼职取酬、搭干股分红。
  people: []
  voices:
