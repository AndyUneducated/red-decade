# Events, 1983–1986 (M6 第 3 批)：复查冤案的数字、严打、整党与清理“三种人”、文革要员的最后几场审判、广西与零陵“处遗”、农村改制与城市改革、香港、人物去世与平反、1986 年学潮。

- id: 1983-01-yang-yong-death
  date: 1983-01
  title: 杨勇去世
  lane: army
  weight: 1
  summary: 副总参谋长杨勇去世，人民日报 1 月 16 日刊出生平。生平说他文革中被林彪、江青方面诬陷、失去自由。
  people: [yang-yong]
  voices:
    - { voice: officialLater, text: 在“文化大革命”中，遭到林彪、江青反革命集团的恶毒诬陷和残酷迫害，在失去自由的艰难困境中坚信胜利，坚持斗争（1983 年杨勇生平）, cite: rmrb-1983-01-16-yang-yong, quote: true }
  cites: [rmrb-1983-01-16-yang-yong]

- id: 1983-04-guangxi-chuyi
  date: 1983-04
  title: 广西部署“处遗”：处理文革遗留问题
  lane: local
  weight: 2
  place: 广西
  summary: 1983 年 4 月自治区党委工作会议之后，依据区党委（83）54、55 号文件，广西各县把原来的“落实政策领导小组”改为“处理‘文革’遗留问题领导小组”，组长多由县委副书记或县长担任，下设审案、信访等组，清查 1967–1968 年的杀人案，给死者家属发平反证书和抚恤。宾阳县的领导小组 5 月 10 日经南宁地委批准成立。这是 1967–1968 年广西大规模杀人第一次被系统清查，各县的死亡数字大多出自这次清查。
  people: []
  concepts: [factionalism]
  voices:
    - { voice: officialLater, text: 县委把处理“文革”遗留问题作为一项主要任务来抓，把原落实政策领导小组改为“处遗”领导小组（天等县文革大事件）, cite: ccrd-1987-gx-tiandeng-39, quote: true }
    - { voice: officialLater, text: 县委把处理“文革”遗留问题作为一项主要任务来抓，把原落实政策领导小组改为“处遗”领导小组（靖西县，措辞相同）, cite: ccrd-1987-gx-jingxi-79, quote: true }
  cites: [ccrd-1987-gx-tiandeng-39, ccrd-1987-gx-jingxi-79, ccrd-1987-gx-binyang-159]

- id: 1983-06-court-review-figures
  date: 1983-06
  title: 最高法院报告：文革刑事案件复查一百二十万件，改判三十万件
  lane: center
  weight: 3
  place: 北京
  summary: 最高人民法院在六届人大一次会议上报告，从 1978 年下半年开始复查文革期间判处的刑事案件，原则是“全错的全平，部分错的部分平，不错的不平”。到 1981 年底复查一百二十万件，改判纠正三十万零一千余件，涉及当事人三十二万六千余人。这是官方公布的文革刑事冤案规模最直接的数字。
  people: []
  voices:
    - { voice: officialLater, text: 全错的全平，部分错的部分平，不错的不平（第八次全国人民司法工作会议提出的复查原则，1983 年最高人民法院工作报告）, cite: ws-1983-06-supreme-court-report, quote: true }
    - { voice: officialLater, text: 改判纠正了冤、假、错案三十万零一千余件，涉及当事人三十二万六千余人（同一报告，截至 1981 年底）, cite: ws-1983-06-supreme-court-report, quote: true }
  cites: [ws-1983-06-supreme-court-report, ws-1982-supreme-court-report]

- id: 1983-06-household-contract
  date: 1983-06-06
  title: 政府工作报告确认家庭联产承包责任制
  lane: econ
  weight: 2
  place: 北京
  summary: 赵紫阳在六届人大一次会议上作政府工作报告，把农民“创造”的家庭联产承包责任制写成十一届三中全会以来的基本农村政策，要求“继续稳定和完善”。1962 年邓子恢支持安徽“责任田”被批为“单干风”，到这时同类做法成为国家政策。
  people: [zhao-ziyang]
  concepts: [two-lines]
  voices:
    - { voice: officialLater, text: 特别重要的是，我国农民在党的领导下创造了多种形式的家庭联产承包责任制，克服长期存在的生产上的瞎指挥和分配上的平均主义（1983 年政府工作报告）, cite: ws-1983-06-gov-report, quote: true }
  cites: [ws-1983-06-gov-report]

- id: 1983-09-02-strike-hard
  date: 1983-09-02
  title: 人大常委会两项决定：“严打”开始
  lane: center
  weight: 3
  place: 北京
  summary: 六届人大常委会第二次会议通过《关于严惩严重危害社会治安的犯罪分子的决定》和《关于迅速审判严重危害社会治安的犯罪分子的程序的决定》，前者允许在刑法规定的最高刑以上判刑直至死刑，后者允许不受刑事诉讼法规定的送达期限限制。三年多里法院审结刑事案件一百四十万余件，判决一百七十二万余人；公安部 1988 年说战役 1987 年初结束。1979 年刚通过的刑法和刑事诉讼法，在战役期间被这两项决定放宽了刑罚上限和程序期限。
  people: []
  concepts: [mass-democracy]
  voices:
    - { voice: doc, text: 可以在刑法规定的最高刑以上处刑，直至判处死刑（1983 年 9 月 2 日人大常委会决定）, cite: ws-1983-09-02-strike-hard, quote: true }
    - { voice: doc, text: 可以不受刑事诉讼法第一百一十条规定的关于起诉书副本送达被告人期限以及各项传票、通知书送达期限的限制（同日程序决定）, cite: ws-1983-09-02-swift-trial, quote: true }
    - { voice: officialLater, text: 自1983年8月到1986年底，全国各级人民法院共审结刑事案件140万余件，判决人犯172.1万多名（1987 年最高人民法院工作报告）, cite: ws-1987-04-supreme-court-report, quote: true }
    - { voice: officialLater, text: 到1987年初，“严打”战役胜利结束，基本改变了社会治安的非正常状况（1988 年公安部报告）, cite: ws-1988-09-public-security-report, quote: true }
  cites: [ws-1983-09-02-strike-hard, ws-1983-09-02-swift-trial, ws-1987-04-supreme-court-report, ws-1988-09-public-security-report]

- id: 1983-10-11-party-rectification
  date: 1983-10-11
  title: 整党决定：清理“三种人”
  lane: center
  weight: 3
  place: 北京
  summary: 十二届二中全会通过《关于整党的决定》，用三年时间分期分批整党，重点之一是清理“三种人”，即追随林彪、江青集团造反起家的人、帮派思想严重的人和打砸抢分子。北京大兴、湖南零陵等地 1980 年代中期对文革杀人的调查，很多是由“核查三种人”的班子做的。
  people: [hu-yaobang, deng-xiaoping]
  concepts: [factionalism]
  voices:
    - { voice: doc, text: 清理“三种人”，是纯洁组织的关键问题（1983 年《关于整党的决定》）, cite: ws-1983-10-11-party-rectification, quote: true }
  cites: [ws-1983-10-11-party-rectification]

- id: 1983-11-02-zhao-dengcheng-sentenced
  date: 1983-11-02
  title: 赵登程判刑十五年：“中国（马列）共产党”假案
  lane: center
  weight: 1
  place: 北京
  summary: 北京市中级人民法院判决。赵登程原是空军某军副军长，文革中进入公安部领导小组、任“中央专案审查小组第三办公室”副主任，1972 年已被逮捕。判决认定他 1968 年按谢富治授意“抓组织、追后台”，参与制造“中国（马列）共产党”假案，把矛头指向陈毅、李富春、叶剑英、徐向前等人。
  people: [xie-fuzhi, chen-yi, li-fuchun, ye-jianying, xu-xiangqian]
  voices:
    - { voice: judicial1980, text: 参与制造“中国（马列）共产党”假案，诬陷党和国家领导人（1983 年起诉书所列第一项）, cite: ws-1983-zhao-dengcheng-case, quote: true }
    - { voice: judicial1980, text: 判处被告人赵登程有期徒刑十五年，剥夺政治权利三年（1983 年 11 月 2 日判决）, cite: ws-1983-zhao-dengcheng-case, quote: true }
  cites: [ws-1983-zhao-dengcheng-case]

- id: 1983-11-02-qi-jinghe-sentenced
  date: 1983-11-02
  title: 康生秘书齐景和判刑十七年
  lane: center
  weight: 1
  place: 北京
  summary: 同日北京市中级人民法院判决齐景和。他原是康生的秘书，文革中兼任中央专案审查小组第一办公室“刘仁专案组”和“彭真、刘仁专案组”副组长，判决认定的第一项罪行是诬陷、迫害刘少奇。庭审有辩护律师出庭。
  people: [kang-sheng, liu-shaoqi, liu-ren, peng-zhen]
  voices:
    - { voice: judicial1980, text: 判处被告人齐景和有期徒刑十七年，剥夺政治权利四年（1983 年 11 月 2 日判决）, cite: ws-1983-qi-jinghe-case, quote: true }
  cites: [ws-1983-qi-jinghe-case]

- id: 1983-11-02-liu-qingtang-sentenced
  date: 1983-11-02
