# Doctrines, lines and labels (主义). kind: core | line | heterodox | foreign | label
# parents: what it grew out of; against: what it was formulated against.
# terms are matched verbatim against the corpus, like concepts.
# pos: editorial placement on two axes, each from -1 to 1, at given moments:
#   x 经济：指令计划、公有化、平均主义 (-1) ↔ 市场、多种所有制、物质刺激 (+1)
#   y 政治：阶级斗争、群众动员、集中 (-1) ↔ 宽松、制度化、多元 (+1)
# For a label (罪名), pos is where its accusers placed the accused, not where they stood.

- id: marxism-leninism
  name: 马克思列宁主义
  short: 马列主义
  kind: core
  from: 1921-07
  terms: [马克思列宁主义, 马列主义]
  carriers: []
  summary: 中共建党时的指导思想，1945 年七大党章并列为“马克思列宁主义的理论与中国革命的实践之统一的思想——毛泽东思想”的来源。1949–1989 年间各派都以它为合法性来源，争的是谁“坚持”、谁“背叛”。
  cites: [ws-1969-04-constitution]

- id: stalin-model
  name: 苏联模式（斯大林模式）
  short: 苏联模式
  kind: foreign
  from: 1949-06
  to: 1956-04
  parents: [marxism-leninism]
  terms: [斯大林]
  summary: 1949 年 6 月《论人民民主专政》宣布“一边倒”，此后第一个五年计划照搬苏联的指令计划、重工业优先和一长制。1956 年 4 月《论十大关系》提出“以苏联为鉴戒”，开始寻求不同道路。
  pos:
    - { at: 1953, x: -0.85, y: -0.3, note: 指令计划、重工业优先，政治上是官僚集中而非群众动员 }

- id: new-democracy
  name: 新民主主义
  kind: core
  from: 1940-01
  to: 1953-06
  parents: [marxism-leninism]
  terms: [新民主主义]
  carriers: [毛泽东, 刘少奇]
  summary: 毛泽东 1940 年《新民主主义论》：革命分两步，先建立各革命阶级联合专政、允许私人资本存在的新民主主义社会。1953 年 6 月毛泽东批评“确立新民主主义社会秩序”的提法，转向过渡时期总路线。
  pos:
    - { at: 1949, x: 0.3, y: 0.25, note: 《共同纲领》下的五种经济成分并存、多党合作 }
    - { at: 1952, x: 0.15, y: 0.1 }

- id: mao-thought
  name: 毛泽东思想
  kind: core
  from: 1945-06
  parents: [marxism-leninism]
  terms: [毛泽东思想]
  carriers: [毛泽东, 林彪, 刘少奇]
  concepts: [mao-thought]
  summary: 1945 年七大写入党章，提法出自刘少奇的修改党章报告；1956 年八大党章未写，1969 年九大党章恢复并冠以“顶峰”之意。1981 年决议把它界定为“党的集体智慧的结晶”，并与毛泽东晚年的错误“区别开来”。它在光谱上的位置随谁解释它而变。
  pos:
    - { at: 1949, x: 0.0, y: 0.1 }
    - { at: 1958, x: -0.8, y: -0.5, note: 大跃进时期 }
    - { at: 1966, x: -0.8, y: -1.0, note: 林彪“顶峰论”下的解释 }
    - { at: 1981, x: -0.1, y: 0.2, note: 1981 年决议重新界定 }
  notes:
    - { voice: official1981, text: 毛泽东思想是马克思列宁主义在中国的运用和发展，是被实践证明了的关于中国革命的正确的理论原则和经验总结，是中国共产党集体智慧的结晶。, cite: ws-1981-resolution }
  cites: [ws-1981-resolution]

- id: transition-line
  name: 过渡时期总路线（社会主义改造）
  short: 过渡时期总路线
  kind: line
  from: 1953-06
  to: 1956-12
  parents: [mao-thought, stalin-model]
  against: [new-democracy]
  terms: [过渡时期总路线, 社会主义改造]
  carriers: [毛泽东]
  summary: “在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造。”原定十五年左右，实际 1956 年底基本完成。
  pos:
    - { at: 1953, x: -0.4, y: -0.1 }
    - { at: 1956, x: -0.8, y: -0.2, note: 合作化与公私合营高潮 }

- id: eighth-congress
  name: 八大路线
  kind: line
  from: 1956-09
  to: 1957-10
  parents: [mao-thought]
  against: [stalin-model]
  carriers: [刘少奇, 邓小平, 周恩来, 陈云]
  summary: 八大决议称国内主要矛盾已是“人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾”，阶级斗争不再是主要任务；周恩来、陈云主张反冒进，经济上“既反保守又反冒进”。1957 年 10 月八届三中全会上毛泽东改称无产阶级和资产阶级的矛盾仍是主要矛盾。
  pos:
    - { at: 1956-09, x: -0.3, y: 0.45 }

- id: hundred-flowers
  name: 双百方针（百花齐放、百家争鸣）
