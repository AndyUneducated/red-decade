  from: 1957-06
  to: 1978-09
  parents: [mao-thought]
  against: [hundred-flowers]
  terms: [资产阶级右派, 右派分子]
  summary: 反右运动的罪名。官方后来公布划定右派 55 万余人；1978 年中央决定全部摘帽，随后绝大多数予以改正，仅保留章伯钧、罗隆基等极少数不改正。
  pos:
    - { at: 1957-07, x: 0.2, y: 0.9, note: 批判者描述的“右派”：要“轮流坐庄”、“党天下” }
  notes:
    - { voice: official1981, text: 反右派斗争被严重地扩大化了，把一批知识分子、爱国人士和党内干部错划为“右派分子”，造成了不幸的后果。, cite: ws-1981-resolution }

- id: three-red-banners
