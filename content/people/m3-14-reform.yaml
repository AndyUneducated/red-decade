    - h: 国务院秘书长
      from: 1952-09
      to: 1962-08
      text: |
        1952 年 9 月调任中宣部部长，1953 年起任政务院（后为国务院）秘书长，“1959年4月任国务院副总理兼秘书长，负责国务院常务工作”。生平说他“在国务院协助周恩来总理工作长达10年”。
      cites: [rmrb-2002-05-31-xi-zhongxun]
    - h: “《刘志丹》小说问题”
      from: 1962-09
      to: 1978-03
      text: |
        1962 年工人出版社准备出版李建彤的小说《刘志丹》，康生在八届十中全会上指这部小说是为高岗翻案，毛泽东随即说“利用小说进行反党活动，是一大发明”。生平的说法是：“1962年9月，在中共八届十中全会上，习仲勋同志因所谓‘《刘志丹》小说问题’，遭康生诬陷，在‘文化大革命’中又受到残酷迫害，被审查、关押、监护前后长达16年之久。”1965 年他被下放到洛阳矿山机器厂任副厂长，文革中被揪回西安批斗，此后长期监护。1980 年起诉书把他列入“被诬陷的中共中央委员、候补中央委员”。
      verify: true
      cites: [rmrb-2002-05-31-xi-zhongxun, ws-1980-indictment]
    - h: 广东“先走一步”
      from: 1978-04
      to: 2002-05-24
      text: |
        1978 年 4 月他到广东任省委第二书记，年底任第一书记，主持平反“李一哲”等冤案。他“率先向党中央提出……让广东在改革开放中先走一步的请求，得到了邓小平同志的赞同”。1979 年 7 月 15 日中央、国务院批转广东、福建两省的报告，“中央确定，对两省对外经济活动实行特殊政策和灵活措施，给地方以更多的主动权”，“关于出口特区，可先在深圳、珠海两市试办”。
        1980 年 9 月任全国人大常委会副委员长，1981 年 6 月任中央书记处书记，1982 年起负责书记处日常工作。1987 年 1 月的政治局扩大会议上，他据说是少数为胡耀邦说话的人之一，这一点官方生平没有提。1988 年任七届人大副委员长，2002 年 5 月 24 日在北京病逝。
      verify: true
      cites: [rmrb-2002-05-31-xi-zhongxun, ws-1979-07-15-guangdong-fujian]
