    - h: 南泥湾与新疆
      from: 1908-04-11
      to: 1952
      text: |
        生平说他“１９０８年４月１１日出生在湖南省浏阳县的一个农民家庭”，十三岁到长沙拉人力车、当铁路搬道工，1927 年入党，在湘鄂赣和湘赣根据地带兵。抗战中任八路军第三五九旅旅长，1941 年起在陕北南泥湾屯垦。1949 年率第一兵团进军新疆，任新疆分局书记，1950 年代初在新疆镇压反抗、推行土改。
      verify: true
      cites: [rmrb-1993-03-20-wang-zhen]
    - h: 铁道兵与农垦
      from: 1953
      to: 1966-05
      text: |
        1953 年任铁道兵司令员兼政委，修建黎湛、鹰厦铁路，1955 年授上将军衔。“１９５４年，中央根据王震的建议，批准驻新疆部队的八个师集体转业成立新疆军区生产建设兵团”；1956 年任农垦部部长，此后组织转业官兵和支边青年开发黑龙江北大荒和新疆、海南、云南的农场。
      cites: [rmrb-1993-03-20-wang-zhen]
    - h: 文革
      from: 1966-06
      to: 1976-10
      text: |
        1968 年 12 月谢富治等人制造“中国（马列）共产党”假案，起诉书说名单中“参加的有董必武、叶剑英、李先念、贺龙、刘伯承、徐向前、聂荣臻、谭震林、余秋里、王震、廖承志等”。1969 年他被下放江西。生平说他在文革中“保护了许多干部和知识分子”，“１９７２年，他参与国务院的业务领导，分管外贸、黄金和供销社等部门的工作”；1975 年 1 月任国务院副总理，支持邓小平整顿。1976 年 10 月“他坚决支持党中央采取的果断措施”，即抓捕“四人帮”。
      verify: true
      cites: [ws-1980-indictment, rmrb-1993-03-20-wang-zhen]
    - h: 反对“两个凡是”，也反对“自由化”
      from: 1976-10
      to: 1993-03-12
      text: |
        生平说他“反对‘两个凡是’的观点，积极支持真理标准问题的讨论”，又“坚决主张充分肯定毛泽东的历史地位和毛泽东思想”。1978 年 12 月三中全会增选为政治局委员。1980 年代他任中央顾问委员会副主任、中央党校校长，在“清除精神污染”和 1987 年反自由化中立场强硬，“一贯支持邓小平提出的坚持四项基本原则，反对资产阶级自由化的方针”。1988 年 4 月当选国家副主席。李鹏 1989 年 6 月的报告把他与陈云、李先念、彭真、邓颖超、徐向前、聂荣臻、薄一波列为“在关键时刻对平息暴乱发挥了重要作用”的老同志。1993 年 3 月 12 日在广州病逝。
      verify: true
      cites: [rmrb-1993-03-20-wang-zhen, ws-1978-12-third-plenum, ws-1989-06-zhao-errors-report]
  assess:
    - { voice: officialLater, text: 他反对“两个凡是”的观点，积极支持真理标准问题的讨论。他坚决主张充分肯定毛泽东的历史地位和毛泽东思想（1993 年新华社生平）, cite: rmrb-1993-03-20-wang-zhen, quote: true }
