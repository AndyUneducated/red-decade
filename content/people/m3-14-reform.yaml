  bio: 河南滑县人，1938 年入党。建国后长期在广东工作，1965 年任广东省委第一书记，1967 年被造反派夺权、批斗。1971 年复出，1975 年起主政四川，推行扩大企业自主权和包产到组，1980 年任政治局常委、国务院总理。1987 年 1 月胡耀邦辞职后代理总书记，十三大正式当选。1989 年学潮中反对把运动定性为“动乱”，6 月的十三届四中全会认定他“犯了支持动乱和分裂党的错误”，撤销全部职务。此后在北京家中被软禁十五年，2005 年 1 月 17 日病逝。
  life:
    - h: 广东
      from: 1919-10
      to: 1971-03
      text: |
        2005 年的官方消息只给出一段简历：“１９１９年１０月生于河南省滑县，１９３２年３月加入中国共产主义青年团，１９３７年参加革命工作，１９３８年２月加入中国共产党”，此后“在地方先后担任过中共县委、地委、省委主要领导职务”。1951 年他南下广东，在土改、合作化中历任华南分局、广东省委书记处书记，1965 年任省委第一书记。1967 年 1 月广东造反派夺权，他被批斗、关押，后下放湖南湘潭一家工厂当钳工。
      verify: true
      cites: [xinhua-2005-01-29-zhao-ziyang]
    - h: 四川与国务院
      from: 1971-04
      to: 1986-12
      text: |
        1971 年复出任内蒙古自治区党委书记，1972 年回广东，1975 年 10 月调任四川省委第一书记。四川在大跃进中饿死人极多，他到任后放宽自留地、试行包产到组，又在宁江机床厂等企业试点扩大自主权，“要吃粮，找紫阳”的说法与安徽的“要吃米，找万里”并称。1980 年 2 月五中全会“选举胡耀邦、赵紫阳两同志为中央政治局常委”，9 月接替华国锋任国务院总理，主持价格、企业和沿海开放等改革。
      verify: true
      cites: [rmrb-1980-03-01-fifth-plenum]
    - h: 总书记
      from: 1987-01-16
      to: 1989-05-31
      text: |
        1987 年 1 月政治局扩大会议“一致推选赵紫阳同志代理党中央总书记”，10 月十三大正式当选，提出“社会主义初级阶段”的提法。1988 年夏的价格“闯关”引发抢购和通货膨胀，他的经济主导权随之削弱。
        1989 年 4 月胡耀邦逝世后学潮兴起，他在出访朝鲜期间致电同意邓小平的决策，4 月 26 日《人民日报》社论定性为“动乱”。按李鹏 6 月的报告，他回国后“指责根据常委决定写的《人民日报》社论定性错误，提出要加以纠正”，5 月 4 日在亚洲开发银行年会上的讲话“公开把中央内部分歧暴露于世”；5 月 16 日他向来访的戈尔巴乔夫说“在最重要的问题上，仍然需要邓小平同志掌舵”。报告说他曾提出“向学生承认社论是错误的，可以说社论稿曾发到朝鲜经他批准，由他承担责任”。5 月 19 日凌晨他到天安门广场看望绝食学生，此后不再公开露面；当天晚上中央宣布北京戒严。
      verify: true
      cites: [rmrb-1987-01-17-politburo, ws-1989-06-zhao-errors-report]
    - h: 撤职与软禁
      from: 1989-06
      to: 2005-01-29
      text: |
        1989 年 6 月 23–24 日十三届四中全会审议通过李鹏代表政治局提出的报告，认为他“在关系党和国家生死存亡的关键时刻犯了支持动乱和分裂党的错误，对动乱的形成和发展负有不可推卸的责任”，撤销他的总书记、政治局常委、政治局委员、中央委员和中央军委第一副主席职务，“对他的问题继续进行审查”。审查始终没有公开结论，他在北京富强胡同的家中被软禁到去世。
        2005 年 1 月 17 日他在北京病逝，官方没有发表生平，只在遗体火化当天发了一则消息，结论是“在１９８９年春夏之交的政治风波中赵紫阳同志犯了严重错误”。
      verify: true
      cites: [ws-1989-06-24-fourth-plenum, xinhua-2005-01-29-zhao-ziyang]
  assess:
    - { voice: officialLater, text: 赵紫阳同志在关系党和国家生死存亡的关键时刻犯了支持动乱和分裂党的错误，对动乱的形成和发展负有不可推卸的责任，其错误的性质和造成的后果是极为严重的（1989 年十三届四中全会公报）, cite: ws-1989-06-24-fourth-plenum, quote: true }
    - { voice: officialLater, text: 特别是他主持中央工作以来，消极对待坚持四项基本原则、反对资产阶级自由化的方针，严重忽视党的建设、精神文明建设和思想政治工作（1989 年十三届四中全会公报）, cite: ws-1989-06-24-fourth-plenum, quote: true }
    - { voice: officialLater, text: 在改革开放前期，赵紫阳同志先后担任过中央和国家重要领导职务，为党和人民的事业作出过有益的贡献。在１９８９年春夏之交的政治风波中赵紫阳同志犯了严重错误（2005 年新华社消息）, cite: xinhua-2005-01-29-zhao-ziyang, quote: true }
    - { voice: editor, text: 1989 年的定性是“支持动乱和分裂党”，2005 年的官方消息改称“犯了严重错误”，“动乱”一词也换成了“政治风波”。1989 年宣布的“继续进行审查”此后没有公开过结论。, cite: xinhua-2005-01-29-zhao-ziyang }
