  bio: 祖籍安徽贵池，生于香港，清华大学学生，1935 年入党，“一二·九”运动的主要组织者之一。建国后长期在商业部门工作，任商业部副部长、第一副部长。文革中受迫害，1973 年任外贸部第一副部长。1979 年任国务院副总理，兼国家计委主任，主持“六五”到“八五”计划的编制，主张控制建设规模、抑制通货膨胀。1987 年任政治局常委，是 1989 年 5 月主张戒严的常委之一。1994 年 12 月 11 日病逝。
  life:
    - h: “一二·九”
      from: 1917-09-06
      to: 1949
      text: |
        生平说他“祖籍安徽省贵池县，１９１７年９月６日出生于香港”，1934 年考入清华大学，1935 年 11 月入党，任北平学联秘书长、党团书记。“姚依林和彭涛、黄敬、郭明秋等同志在党组织的领导下，具体组织和直接指挥数千名北平爱国学生”，举行了“一二·九”和“一二·一六”两次示威。此后在平津和晋察冀做地下和财经工作。
      verify: true
      cites: [rmrb-1994-12-19-yao-yilin]
    - h: 商业部与外贸部
      from: 1949-10
      to: 1979-06
      text: |
        建国后历任贸易部、商业部副部长，1960 年代任商业部第一副部长，主管全国的副食品和日用品供应。“１９６６年‘文化大革命’开始后，姚依林同志遭受严重迫害”；1980 年起诉书把他列入“被诬陷的中共中央委员、候补中央委员”。“１９７３年１１月，姚依林同志任对外贸易部第一副部长”，此后在“反击右倾翻案风”中“顶着巨大压力，极其艰难地维持对外贸易工作”。
      verify: true
      cites: [rmrb-1994-12-19-yao-yilin, ws-1980-indictment]
    - h: 计委与政治局常委
      from: 1979-07
      to: 1994-12-11
      text: |
        1979 年 7 月任国务院副总理，1980 年 2 月五中全会选为中央书记处书记，兼国家计委主任。他主持编制“六五”到“八五”计划，“强调要抑制通货膨胀，保持社会供求总量的平衡”，在 1988 年的物价风波后主持“治理整顿”。1987 年十三届一中全会当选政治局常委。
        1989 年学潮期间，按李鹏的报告，赵紫阳 5 月 3 日纪念五四讲话之前，“尚昆、依林、锡铭等同志和我一再提出，在他的讲话中针对动乱中提出的纲领，应加上明确反对资产阶级自由化的内容，但都遭到他的拒绝”。5 月中旬的常委会上他与李鹏一起主张戒严。1992 年十四大后退出领导职务，1994 年 12 月 11 日在北京病逝。
      verify: true
      cites: [rmrb-1994-12-19-yao-yilin, rmrb-1980-03-01-fifth-plenum, ws-1989-06-zhao-errors-report]
  assess:
    - { voice: officialLater, text: 姚依林同志是“一二·九”抗日爱国运动的主要领导人之一（1994 年新华社生平）, cite: rmrb-1994-12-19-yao-yilin, quote: true }
    - { voice: officialLater, text: 尚昆、依林、锡铭等同志和我一再提出，在他的讲话中针对动乱中提出的纲领，应加上明确反对资产阶级自由化的内容，但都遭到他的拒绝（1989 年李鹏报告）, cite: ws-1989-06-zhao-errors-report, quote: true }
    - { voice: editor, text: 1935 年他组织北平学生上街，1989 年他是同意对北京学生戒严的政治局常委。, cite: rmrb-1994-12-19-yao-yilin }
