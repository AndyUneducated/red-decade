  bio: 江苏盐城人，1932 年入党，1937 年到延安。1941 年 2 月起任毛泽东的秘书、政治局秘书，直到 1966 年 6 月，是 1945 年《关于若干历史问题的决议》的主要起草人之一，建国后任新华社社长、中宣部副部长。文革中靠边站，1975 年任国务院政治研究室负责人，协助邓小平整顿。1978 年起草三中全会文件，1980 年任中央书记处书记，主持起草 1981 年《关于建国以来党的若干历史问题的决议》。1980 年代是反对“资产阶级自由化”的主要理论家。1992 年 9 月 28 日病逝。
  life:
    - h: 毛泽东的秘书
      from: 1912-06-01
      to: 1966-06
      text: |
        生平说他“1912年6月1日出生于江苏省盐城县鞍湖乡”，1932 年在盐城入党，1935–1937 年在上海任左翼文化总同盟书记。1937 年 7 月到延安，“从1941年2月起，任毛泽东同志的秘书、中共中央政治局秘书。他担任这个职务，一直继续到1966年6月‘文化大革命’爆发以前”。他参加了 1945 年《关于若干历史问题的决议》的起草。建国后任新闻总署署长、新华社社长、中宣部副部长，起草和修改了许多中央文件和《人民日报》社论。
      verify: true
      cites: [rmrb-1992-10-04-hu-qiaomu]
    - h: 文革与政研室
      from: 1966-06
      to: 1976-10
      text: |
        文革开始后他不再担任秘书，生平说他“受到‘四人帮’的迫害”。1975 年任国务院政治研究室主任，“主持修改《关于工业发展的若干问题》和关于科学院工作的《汇报提纲》等重要文件”。1976 年“反击右倾翻案风”中政研室被批为“邓记谣言公司”，他本人也被迫写材料批判邓小平。
      verify: true
      cites: [rmrb-1992-10-04-hu-qiaomu]
    - h: 两个历史决议
      from: 1976-10
      to: 1992-09-28
      text: |
        1977 年起主持新成立的中国社会科学院。生平说他“全力支持邓小平同志批评‘两个凡是’的错误方针”，1978 年 12 月“负责全会的文件起草工作”，1980 年 2 月五中全会上被选为中央书记处书记。“1980年至1981年，他在邓小平等同志主持下，负责《关于建国以来党的若干历史问题的决议》起草工作”。他因此是 1945 年和 1981 年两个历史决议的共同起草人。
        1980 年代他在“清除精神污染”和 1987 年反对资产阶级自由化中与周扬等人争论“人道主义和异化”问题，生平说他“旗帜鲜明地反对资产阶级自由化等错误思潮，又不固守某些不符合实际的‘条条’、‘本本’”。十三大后退居二线，1992 年 9 月 28 日在北京病逝。
      verify: true
      cites: [rmrb-1992-10-04-hu-qiaomu, rmrb-1980-03-01-fifth-plenum]
  assess:
    - { voice: officialLater, text: 他旗帜鲜明地反对资产阶级自由化等错误思潮，又不固守某些不符合实际的“条条”、“本本”，能够根据新的实践经验，提出新的理论观点（1992 年新华社生平）, cite: rmrb-1992-10-04-hu-qiaomu, quote: true }
    - { voice: officialLater, text: 1980年至1981年，他在邓小平等同志主持下，负责《关于建国以来党的若干历史问题的决议》起草工作（1992 年新华社生平）, cite: rmrb-1992-10-04-hu-qiaomu, quote: true }
    - { voice: editor, text: 当了二十五年毛泽东秘书的人，主持起草了判定“文化大革命”是“严重挫折和损失”的 1981 年决议。生平对 1976 年他批判邓小平一事只字未提。, cite: rmrb-1992-10-04-hu-qiaomu }
