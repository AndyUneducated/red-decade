  bio: 山东东平人，原名万明礼，1936 年入党。1958 年起任北京市委书记处书记、副市长，主持人民大会堂等“十大建筑”工程。文革中随彭真的旧市委被打倒，1973 年恢复工作。1975 年任铁道部部长，按邓小平的部署整顿铁路，1976 年再次被打倒。1977 年任安徽省委第一书记，支持肥西、凤阳的包产到户。1980 年任中央书记处书记、国务院副总理，主管农业；1988–1993 年任全国人大常委会委员长。2015 年 7 月 15 日病逝。
