    - h: 辞职与逝世
      from: 1987-01
      to: 1989-04-22
      text: |
        1986 年底多地发生学潮。1987 年 1 月 16 日政治局扩大会议上，“胡耀邦同志在会议上检讨了他担任党中央总书记期间，违反党的集体领导原则、在重大的政治原则问题上的失误，并请求中央批准他辞去党中央总书记职务”；会议推选赵紫阳代理总书记，保留他的政治局委员和常委职务。十三大后他只是政治局委员。
        1989 年 4 月 8 日他在政治局会议上突发心肌梗塞，4 月 15 日逝世。按李鹏 6 月的报告，悼念活动很快变成政治性的游行，学生的第一条要求就是“重新评价胡耀邦同志的功过，彻底否定1987年初中央对胡耀邦同志辞职的处理”。4 月 22 日追悼会后，运动没有平息。
      verify: true
      cites: [rmrb-1987-01-17-politburo, rmrb-1989-04-16-hu-yaobang-obit, ws-1989-06-zhao-errors-report]
