  bio: 湖南浏阳人，铁路工人出身，1927 年入党。抗战中率三五九旅在南泥湾垦荒，1949 年进军新疆。1953 年任铁道兵司令员，1955 年授上将军衔，1956 年起任农垦部部长，开发北大荒和新疆生产建设兵团。文革中被列入“中国（马列）共产党”假案的“参加者”，1972 年参与国务院经济工作，1975 年任国务院副总理。1976 年支持抓捕“四人帮”，此后反对“两个凡是”，又坚决反对“资产阶级自由化”，1988 年任国家副主席。1989 年是支持戒严的元老之一。1993 年 3 月 12 日在广州病逝。
