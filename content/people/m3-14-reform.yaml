# M3 people round 2, batch 14: 改革一代领导. 胡耀邦、赵紫阳、万里、习仲勋 (改革派), 胡乔木、王震、姚依林 (反对“自由化”一方).
# Texts: 1979 中发 50 号, 1980 五中全会公报, 1987 政治局扩大会议公报, 1989 胡耀邦讣告, 1989 十三届四中全会公报与李鹏报告,
# 新华社生平 (1992 胡乔木, 1993 王震, 1994 姚依林, 2002 习仲勋, 2015 万里), 2005 赵紫阳火化消息, 1980 起诉书.
