  bio: 湖南浏阳人，少年参加红军和长征。建国后任川北区党委书记，1952 年起任青年团中央第一书记，1964 年底短期主持陕西省委。文革中被批斗、下放五七干校，1975 年在科学院协助邓小平整顿。1977 年底任中央组织部部长，主持平反冤假错案。1980 年五中全会任中央书记处总书记，1981 年任中央委员会主席，1982 年改任总书记。1987 年 1 月在政治局扩大会议上检讨“在重大的政治原则问题上的失误”，辞去总书记。1989 年 4 月 15 日病逝，悼念活动随即演变为全国性的抗议。
  life:
    - h: 从红小鬼到团中央
      from: 1915-11-20
      to: 1966-05
      text: |
        1915 年生于湖南浏阳，讣告说他“在青少年时期就投身于中国共产党领导的土地革命，参加了著名的二万五千里长征”。抗战中任中央军委总政治部组织部长，解放战争中任第十八兵团政治部主任。建国后“历任中共川北区党委书记兼行署主任，青年团中央第一书记，中共陕西省委第一书记，中共西北局第二书记”。陕西的任职只有半年左右：1964 年底到任，1965 年因病和工作分歧离开。
      verify: true
      cites: [rmrb-1989-04-16-hu-yaobang-obit]
    - h: 文革
      from: 1966-06
      to: 1977-02
      text: |
        文革开始后团中央被当作“修正主义”机关冲击，他被揪斗、靠边站，1969 年下放河南潢川的团中央五七干校。1975 年邓小平主持整顿期间，他到中国科学院主持工作，起草《汇报提纲》；1976 年“反击右倾翻案风”中再次被批判、停职。讣告说他“不顾个人安危，同林彪、江青反革命集团进行了不懈的斗争”。1980 年起诉书把他列入“被诬陷的中共中央委员、候补中央委员”。
      verify: true
      cites: [rmrb-1989-04-16-hu-yaobang-obit, ws-1980-indictment]
    - h: 组织部与总书记
      from: 1977-03
      to: 1986-12
      text: |
        1977 年任中央党校副校长，推动“实践是检验真理的唯一标准”的讨论；年底任中央组织部部长。讣告说他“为拨乱反正、平反冤假错案、落实干部政策做了大量的工作，表现出非凡的实事求是的胆略和勇气”。1978 年 12 月三中全会增选为政治局委员和中纪委第三书记。1980 年 2 月五中全会决定“设立中央书记处作为中央政治局和它的常务委员会领导下的经常工作机构，并且选举胡耀邦同志为中央委员会总书记”，同时与赵紫阳一起增补为政治局常委。1981 年六中全会上他接替华国锋任中央委员会主席，1982 年十二大取消主席职务，他改任总书记。
