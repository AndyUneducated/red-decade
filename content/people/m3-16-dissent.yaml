    - { voice: officialLater, text: 魏京生背叛祖国，向外国人供给我国军事情报；并违反我国宪法，撰写反动文章，进行反革命宣传鼓动，危害了国家和人民的根本利益，已构成反革命罪（1979 年北京市中级人民法院判决，新华社报道）, cite: rmrb-1979-10-17-wei-jingsheng-trial, quote: true }
    - { voice: editor, text: 判决把“军事情报”放在第一项，但报道里起诉书引用的都是他的文章；情报的内容是“参战部队的指挥员姓名、出兵数目、战斗进展和伤亡人数”，是对一名外国人口头谈的。, cite: rmrb-1979-10-17-wei-jingsheng-trial }
  factions: [democracy]
