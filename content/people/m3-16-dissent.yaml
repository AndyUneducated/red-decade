- id: jin-guantao
  name: 金观涛
  born: 1947
  tier: 3
  role1966: 北京大学化学系学生
  pinyin: Jīn Guāntāo
  gender: m
  birthplace: 浙江义乌
  positions: []
  bio: 浙江义乌人，北京大学化学系毕业，1980 年代与妻子刘青峰提出中国封建社会是“超稳定结构”的观点，主编《走向未来》丛书（陈希同报告称“副主编”），任电视纪录片《河殇》总顾问，是“新启蒙”的代表人物之一。陈希同报告说他在 1988 年 12 月的讨论会上说“社会主义的尝试及其失败，是二十世纪人类的两大遗产之一”。1989 年后在香港中文大学任教、主编《二十一世纪》，2008 年起在台湾政治大学任教。
  life:
    - h: 化学系与超稳定结构
      from: 1947
      to: 1983
      text: |
        1947 年生于浙江义乌。1970 年毕业于北京大学化学系，原本受的是科学训练，文革中开始转向人文和社会科学。1970 年代末、1980 年代初与刘青峰发表了一批历史、哲学和文学作品，包括小说《公开的情书》。
      cites: [zhwiki-jin-guantao]
    - h: 走向未来
      from: 1984
      to: 1989-05
      text: |
        1984 年 4 月与刘青峰出版《兴盛与危机——论中国封建社会的超稳定结构》，用控制论和系统论解释中国传统社会长期停滞而不崩溃的原因，在史学界引起很大争议。同年与刘青峰主编《走向未来》丛书，到 1989 年被列为禁书前出了约八十本。1988 年任电视纪录片《河殇》总顾问。陈希同报告说，1988 年 12 月 7 日北京大学未来学会的讨论会上，他“在发言中说：‘社会主义的尝试及其失败，是二十世纪人类的两大遗产之一。’”1989 年 2 月夫妇二人与北京知识界共 33 人联名致函邓小平，要求释放魏京生等政治犯。（此前数据作“1980 年发表《兴盛与危机》”。）
      cites: [zhwiki-jin-guantao, ws-1989-06-30-chen-xitong-report]
    - h: 香港与台湾
      from: 1989-06
      text: |
        “六四”后被北京市长陈希同点名批判。他与刘青峰此前已到香港中文大学访问研究，此后留校任教，发起并主编《二十一世纪》双月刊，曾任当代中国文化研究中心主任。2005 年起任中国美术学院南山讲座教授，2008 年 7 月退休后到台湾政治大学中国文学系任教。
      cites: [zhwiki-jin-guantao]
  assess:
    - { voice: officialLater, text: 金观涛在发言中说：“社会主义的尝试及其失败，是二十世纪人类的两大遗产之一。”（1989 年陈希同报告）, cite: ws-1989-06-30-chen-xitong-report, quote: true }
  factions: [democracy]
  fate:
    - { date: 1984, s: rise, note: 与刘青峰主编《走向未来》丛书（维基百科，未核原件）, cite: zhwiki-jin-guantao }
    - { date: 1989-06, s: sidelined, note: 被陈希同点名批判，留在香港中文大学（此前数据作 1990）（维基百科，未核原件）, cite: zhwiki-jin-guantao }
  cites: [ws-1989-06-30-chen-xitong-report, zhwiki-jin-guantao]
