  bio: 安徽芜湖人，北京大学中文系古典文献专业出身，1964 年至 1976 年任中华书局哲学编辑，1981 年起在中国社会科学院历史研究所研究中国思想史。1980 年代主编《走向未来》丛书，参与“文化热”讨论。1989 年 2 月与 42 位知识分子联名要求释放政治犯，5 月与严家其等发表《我们再也不能沉默了》《五一七宣言》，戒严后在香港《明报》呼吁人大罢免李鹏。“六四”后被指为“幕后黑手”，1991 年以反革命宣传煽动罪被判处有期徒刑五年，出狱后留在北京写作，长期受监控，2007 年去世。
  life:
    - h: 古典文献与思想史
      from: 1937-09
      to: 1988
      text: |
        1937 年 9 月生于安徽芜湖，早年读过五年私塾，1953 年入芜湖第一中学，1959 年入北京大学中文系古典文献专业。1963 年起在《人民日报》《光明日报》《历史研究》《哲学研究》等报刊发表中国思想史论文。1964 年 9 月至 1976 年 9 月任中华书局哲学编辑，1976 年 10 月至 1980 年在国家出版局研究室，1981 年起在中国社会科学院历史研究所。1980 年代初主编《走向未来》丛书。（此前数据作“《走向未来》丛书的编者之一”；role1966 此前作“青年学者”。）
      cites: [zhwiki-bao-zunxin]
    - h: 1989 年
      from: 1989-02
      to: 1989-06
      text: |
        陈希同的报告把他列为“精英”分子之一：2 月 26 日他与张显扬、李洪林、戈扬等 42 人联名写信要求释放“政治犯”；5 月 13 日晚与严家其、苏绍智等在北京大学贴出《我们再也不能沉默了》；14 日与严家其、李洪林、戴晴、于浩成、李泽厚等 12 人发出《紧急呼吁》；17 日与严家其发表《五一七宣言》；戒严后又与严家其在香港《明报》发表《兼告李鹏书》，呼吁“废除戒严令，罢免李鹏总理职务”。
      cites: [ws-1989-06-30-chen-xitong-report]
    - h: 判刑以后
      from: 1989-06
      to: 2007-10
      text: |
        “六四”后他与陈子明、王军涛、刘晓波等被当局指为事件的“幕后黑手”，被捕入狱，判刑五年；判决的月份和罪名据通行资料，待核。出狱后长期受到监控，以研究写作为生，参加过声援刘荻、杜导斌和天安门母亲的签名。2007 年 10 月 23 日突发大面积脑溢血，28 日在北京去世；11 月 3 日的追悼会受到严密戒备，部分人士被阻止参加。
