  bio: 江苏武进人，1930 年代参加左翼运动坐过国民党的监狱，1937 年入党，建国后任上海作协书记处书记、《文艺月报》副主编。1957 年被划为右派，文革中再次被关押。1979 年平反后在上海写杂文，自称“资产阶级自由化老祖宗”；1987 年 1 月 13 日被上海市纪委开除党籍，是当年三个被点名的人中最早的。1989 年在上海参加游行，被关押一年多，1992 年出国，2001 年在纽约去世。
  life:
    - h: 两次挨整
      from: 1918-02-04
      to: 1979
      text: |
        少年时在上海当学徒，参加左翼文艺活动，1934 年被国民党判刑入狱，1937 年出狱后到延安，入党。建国后在上海文艺界任职。1957 年因杂文被划为右派，1962 年摘帽。文革中因所谓“恶毒攻击”被关押，1970 年代中期才放出来。
      verify: true
