      text: |
        1984 年 5 月 16 日他与几位同事在北京中关村创办四通公司，七人用两万元借款起家，主要生产、销售电子产品，1987 年营业额达五亿元。陈希同报告说，戒严后“四通公司总经理万润南在国际饭店召集‘高自联’的部分头头开会，提出了退出天安门广场的6个条件，即‘军队回去，戒严取消，李鹏下台，邓小平、杨尚昆退休，赵紫阳复出’”；四通社会发展研究所还向人大常委征集签名，要求召开紧急会议。
      cites: [zhwiki-wan-runnan, ws-1989-06-30-chen-xitong-report]
    - h: 流亡
      from: 1989-06
      to: 2025-10-13
      text: |
        “六四”后他因支持学生运动被通缉，流亡海外。1989 年 9 月流亡人士在巴黎成立“民主中国阵线”，他任秘书长，后当选第二、三任主席，此后居住在法国。2025 年 10 月 13 日在巴黎近郊的克雷伊医院病逝。
      cites: [zhwiki-wan-runnan]
