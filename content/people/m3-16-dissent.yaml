  bio: 吉林长春人，生于长春、长于哈尔滨，1944 年入党，《中国青年报》记者。1956 年发表特写《在桥梁工地上》《本报内部消息》，1957 年被划为“极右分子”，开除党籍，下放劳动二十多年。1979 年改正，发表报告文学《人妖之间》，揭露黑龙江宾县王守信贪污案，任《人民日报》记者、中国作家协会副主席，被读者称为“刘青天”。1987 年 1 月被人民日报社纪委开除党籍，1988 年赴美讲学，1989 年后不能回国，2005 年在美国新泽西去世。
  life:
    - h: 两次开除党籍之前
      from: 1925-02-07
      to: 1979
      text: |
        少年时在哈尔滨读书，自学俄文，1944 年入党，建国后任《中国青年报》记者。1956 年受苏联“干预生活”文学的影响，写了揭露官僚主义的特写《在桥梁工地上》《本报内部消息》。1957 年反右运动中被划为“极右分子”，1958 年开除党籍，下放山西、山东农村劳动，文革中又被关进干校。
      verify: true
    - h: 刘青天
      from: 1979
      to: 1987-01-23
      text: |
        1979 年右派问题改正，恢复党籍。同年发表《人妖之间》，写黑龙江宾县燃料公司经理王守信与地方干部结成的贪污网，年底调《人民日报》任记者，此后写了《一个人和他的影子》《第二种忠诚》等，读者来信和上访的人常找到他家里。1985 年当选中国作家协会副主席。1986 年底学潮后，他和方励之、王若望一起被点名为“资产阶级自由化”的代表人物。
      verify: true
    - h: 开除与流亡
      from: 1987-01-23
      to: 2005-12-05
      text: |
        1987 年 1 月 23 日中共人民日报社机关纪委决定开除他的党籍，说他“攻击四项基本原则是‘陈腐的、曾经把中国几次引向灾难的过时观念……’”，说《人妖之间》《千秋功罪》“都是为了展示一个真理，就是中国共产党的腐败”，还把新闻工作者接受党的领导说成是当“三孙子”。1988 年他应邀赴美讲学，1989 年以后被拒绝回国，在普林斯顿等地写作，2005 年 12 月 5 日在新泽西去世。
      verify: true
      cites: [rmrb-1987-01-25-liu-binyan]
  assess:
    - { voice: officialLater, text: 刘宾雁严重违反党章、党纪和党的决议，在许多地方发表讲演、文章，否定四项基本原则，鼓吹资产阶级自由化（1987 年人民日报社纪委决定）, cite: rmrb-1987-01-25-liu-binyan, quote: true }
    - { voice: officialLater, text: 刘宾雁诋毁共产党“堕落”，说他写《人妖之间》、《千秋功罪》“都是为了展示一个真理，就是中国共产党的腐败”（同一决定）, cite: rmrb-1987-01-25-liu-binyan, quote: true }
  factions: [democracy, rightists]
  fate:
