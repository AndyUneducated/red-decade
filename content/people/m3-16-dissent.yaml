    - { date: 1979, s: restored, note: 获得平反，任《人民日报》记者（维基百科，未核原件）, cite: zhwiki-liu-binyan }
    - { date: 1985, s: rise, note: 作协第四届大会当选为副主席（此前数据作 1985-01）（维基百科，未核原件）, cite: zhwiki-liu-binyan }
    - { date: 1987-01-23, s: purged, note: 人民日报社纪委开除党籍, cite: rmrb-1987-01-25-liu-binyan }
    - { date: 1989-06, s: sidelined, note: 在美国公开反对镇压，开始流亡，被禁止回国；11 月被开除作协会籍（维基百科，未核原件）, cite: zhwiki-liu-binyan }
    - { date: 2005-12-05, s: dead, note: 直肠癌，在美国新泽西去世（维基百科，未核原件）, cite: zhwiki-liu-binyan }
