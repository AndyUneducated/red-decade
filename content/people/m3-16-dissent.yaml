  bio: 江苏武进人，1930 年代参加左翼运动坐过国民党的监狱，1937 年入党，建国后任上海作协书记处书记、《文艺月报》副主编。1957 年被划为右派，文革中再次被关押。1979 年平反后在上海写杂文，自称“资产阶级自由化老祖宗”；1987 年 1 月 13 日被上海市纪委开除党籍，是当年三个被点名的人中最早的。1989 年在上海参加游行，被关押一年多，1992 年出国，2001 年在纽约去世。
  life:
    - h: 两次挨整
      from: 1918-02-04
      to: 1979
      text: |
        少年时在上海当学徒，参加左翼文艺活动，1934 年被国民党判刑入狱，1937 年出狱后到延安，入党。建国后在上海文艺界任职。1957 年因杂文被划为右派，1962 年摘帽。文革中因所谓“恶毒攻击”被关押，1970 年代中期才放出来。
      verify: true
    - h: 自由化老祖宗
      from: 1979
      to: 1989-04
      text: |
        1979 年右派问题改正，此后写了大量杂文，批评党政不分、言论管制。1987 年 1 月 13 日上海市纪委决定开除他的党籍，决定说他“自1979年以来，特别是近两年来，经常借作报告、发表文章的机会，鼓吹资产阶级自由化，反对四项基本原则，屡教不改”，把社会主义说成是“空洞无物的幻想”，“声称‘要为资产阶级自由化辩护，我就是要自由化，不给我自由，我就要斗’，公然以‘资产阶级自由化老祖宗’自居”。
      cites: [rmrb-1987-01-15-wang-ruowang]
    - h: 1989 与出国
      from: 1989-05
      to: 2001-12-19
      text: |
        1989 年 5 月他在上海走上街头支持学生，6 月被捕，关押一年多，1990 年获释后被监视居住。1992 年获准赴美国，此后在纽约参加海外民主运动，2001 年 12 月 19 日在纽约去世。
      verify: true
