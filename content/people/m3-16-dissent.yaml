# M3 people round 2, batch 16: 民主墙与 1980 年代异议者。魏京生（民主墙），刘宾雁、王若望（1987 年开除党籍），
# 包遵信、苏绍智、陈子明、戴晴、戈扬、万润南、金观涛（1989 年陈希同报告点名的知识界人士）。
# Texts: 魏京生《第五个现代化》（节选）、1979 年新华社公审报道、1987 年两份开除党籍决定（人民日报）、
# 1989 年陈希同报告。在世人物只写公开经历和公开文本；生卒只录有把握的部分，其余经历来自通行资料，verify。

- id: wei-jingsheng
  name: 魏京生
  born: 1950-05-20
  tier: 2
  role1966: 北京中学生
  pinyin: Wèi Jīngshēng
  gender: m
  birthplace: 北京
  origin: 安徽巢县
  positions: []
  bio: 北京人，祖籍安徽巢县，北京动物园电工。1978 年 12 月 5 日在西单“民主墙”贴出署名大字报《第五个现代化》，说没有民主，“一切现代化不过是一个新的诺言”，随后主编民间刊物《探索》，1979 年 3 月又贴文警告邓小平“要民主还是要新的独裁”。3 月 29 日被捕，10 月以向外国人提供军事情报和反革命宣传煽动罪被判处有期徒刑十五年，是民主墙时期判刑最重的人。1993 年获释，次年再次被捕，1995 年判刑十四年，1997 年以保外就医名义被送往美国。
  life:
    - h: 民主墙
      from: 1950-05-20
      to: 1979-03-29
      text: |
        文革开始时他是北京的中学生，参加过红卫兵，后来当兵，1970 年代在北京动物园当电工。1978 年 11 月西单墙上开始大量张贴大字报，12 月 5 日他贴出《第五个现代化：民主及其他》，署了真名和住址。文章说“我们要自己掌握自己的命运，不要神仙和皇帝不要相信有什么救世主”，把当时的制度称为“披着社会主义外衣的封建君主制”。1979 年 1 月起他与人合办油印刊物《探索》，3 月 25 日贴出《要民主还是要新的独裁》，点名邓小平。
      verify: true
      cites: [wjs-1978-fifth-modernization]
    - h: 两次判刑
      from: 1979-03-29
      to: 1997-11
      text: |
        新华社报道说，他“被捕前是北京市公园服务管理处工人”，“于今年三月二十九日将他逮捕”。起诉书的第一项指控是，对越作战开始后第四天，他“向外国人供给了我国参战部队的指挥员姓名、出兵数目、战斗进展和伤亡人数等军事情报”；第二项是文章中说无产阶级专政的国家制度“是披着社会主义外衣的封建君主制”，煽动“把权力从这些老爷们手里夺过来”。10 月 16 日北京市中级人民法院判处他有期徒刑十五年，刑满后剥夺政治权利三年；他没有请律师，自己辩护。11 月高级法院驳回上诉。1993 年 9 月提前获释，1994 年 4 月再次被拘，1995 年 12 月以阴谋颠覆政府罪被判处有期徒刑十四年。
      verify: true
      cites: [rmrb-1979-10-17-wei-jingsheng-trial]
    - h: 流亡
      from: 1997-11
      text: |
        1997 年 11 月他以保外就医的名义被直接从监狱送上飞往美国的飞机，此后在海外从事公开的民主运动。1989 年 2 月方励之致信邓小平、陈军等 33 人联名要求大赦时，点名的就是他；陈希同报告称之为“要求实行大赦，释放严重触犯刑律的魏京生等所谓‘政治犯’”。
      verify: true
      cites: [ws-1989-06-30-chen-xitong-report]
  assess:
    - { voice: doc, text: 没有这第五个现代化，一切现代化不过是一个新的诺言（魏京生 1978 年 12 月大字报）, cite: wjs-1978-fifth-modernization, quote: true }
    - { voice: officialLater, text: 魏京生背叛祖国，向外国人供给我国军事情报；并违反我国宪法，撰写反动文章，进行反革命宣传鼓动，危害了国家和人民的根本利益，已构成反革命罪（1979 年北京市中级人民法院判决，新华社报道）, cite: rmrb-1979-10-17-wei-jingsheng-trial, quote: true }
    - { voice: editor, text: 判决把“军事情报”放在第一项，但报道里起诉书引用的都是他的文章；情报的内容是“参战部队的指挥员姓名、出兵数目、战斗进展和伤亡人数”，是对一名外国人口头谈的。, cite: rmrb-1979-10-17-wei-jingsheng-trial }
  factions: [democracy]
  fate:
    - { date: 1978-12-05, s: rise, note: 西单墙贴出《第五个现代化》, cite: wjs-1978-fifth-modernization }
    - { date: 1979-03-29, s: detained, note: 被捕, cite: rmrb-1979-10-17-wei-jingsheng-trial }
    - { date: 1993-09-14, s: sidelined, note: 奥运申办投票前获释（维基百科，未核原件）, cite: zhwiki-wei-jingsheng }
    - { date: 1994-04-01, s: detained, note: 以“收容审查”名义被关押，1995-12-13 一审判刑十四年（维基百科，未核原件）, cite: zhwiki-wei-jingsheng }
    - { date: 1997-11-16, s: sidelined, note: 以“保外就医”名义押送美国（维基百科，未核原件）, cite: zhwiki-wei-jingsheng }
