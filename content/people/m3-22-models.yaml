# M3 people round 2, batch 22: 劳模与典型。工业（王进喜）、城市劳动者（时传祥）、农业合作化（李顺达、申纪兰、王国藩、史来贺、吕玉兰）、
# 知识青年（邢燕子、金训华）和军队（门合）的典型，以及他们在文革中的不同遭遇：被批斗致死、随典型升迁、1977 年后被清理。
# Texts: 1968 年《人民日报》门合两文（含其父门进忠回忆），1969 年《人民日报》金训华通讯与《红旗》评论员文章，1972 年《人民日报》王进喜长文，
# 1978 年新华社时传祥平反报道，2003 年《人民日报》史来贺报道；行龙李顺达个人生活史；申纪兰生平；江山编吕玉兰年谱；
# 唐山市委王国藩条；《北京日报》邢燕子讣闻、农业部邢燕子条；2019 年《人民日报》王进喜文；2021 年《河北日报》门合条。

- id: wang-jinxi
  name: 王进喜
  born: 1923-10-08
  died: 1970-11-15
  deathKind: natural
  tier: 3
  role1966: 大庆油田“铁人”、钻井队出身的全国劳动模范
  pinyin: Wáng Jìnxǐ
  gender: m
