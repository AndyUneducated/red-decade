    - { voice: official1966, text: 金训华同志是在我国伟大的无产阶级文化大革命中涌现出来的青年。他坚决实行了同工农民众相结合。他是革命青年的榜样。（1969 年《红旗》评论员）, cite: ws-1969-jin-xunhua, quote: true }
    - { voice: editor, text: 1969 年的两篇文本是在他死后为上山下乡树立典型而写，通讯把两根电柱写成“传递毛主席的声音”的“输电、通讯线路的组成部分”，把三次被浪打入旋涡写成对“活命哲学”的批判；同去的五名民兵是否遇险，文本没有交代。, cite: rmrb-1969-12-06-jin-xunhua }
  factions: [models]
