    - { kind: other, name: 王铁人 }
  birthplace: 甘肃玉门赤金堡
  party: 中国共产党
  joinedParty: 1956-04-29
  positions:
    - { title: 队长, orgName: 1205钻井队, from: 1958, to: 1961, cite: xinhua-2019-wang-jinxi, verify: true }
    - { title: 大队长, orgName: 大庆油田钻井二大队, from: 1961, cite: rmrb-1972-01-27-wang-jinxi, verify: true }
    - { title: 副主任, orgName: 大庆革命委员会, from: 1968-05, to: 1970-11-15, cite: rmrb-1972-01-27-wang-jinxi }
    - { title: 中央委员, orgName: 中共中央委员会, from: 1969-04, to: 1970-11-15, cite: rmrb-1972-01-27-wang-jinxi }
  bio: 甘肃玉门人，1950 年成为新中国第一代钻井工人，1956 年入党。1960 年率 1205 钻井队从玉门赶到大庆参加石油会战，腿伤未愈时跳进泥浆池压住井喷，被房东称为“铁人”。1964 年当选第三届全国人大代表。1967 年初大庆有人说“铁人也是假的”，他一度被关进密室逼签。1968 年任大庆革委会副主任，1969 年在九大当选中央委员。1970 年 11 月因胃癌病逝，年仅 47 岁。
  life:
    - h: 玉门的钻井工人
      from: 1923-10-08
      to: 1960-02
      text: |
        1923 年 10 月 8 日生于甘肃玉门赤金堡的贫苦农家。1950 年春通过操作考核成为新中国第一代钻井工人；1956 年 4 月 29 日入党，不久任贝乌 5 队队长，创下月进尺 5009.3 米的全国钻井纪录，被誉为“钻井闯将”。1959 年到北京出席全国群英会，看到公共汽车因为没有汽油而背着煤气包。
      cites: [xinhua-2019-wang-jinxi, rmrb-1972-01-27-wang-jinxi]
    - h: 大庆会战
      from: 1960-02
      to: 1966-05
      text: |
        1960 年 2 月松辽石油大会战打响，他带 1205 钻井队 3 月 25 日到萨尔图，没有吊车就人拉肩扛卸下钻机，破冰端水开钻，4 月 19 日打完萨 55 井。4 月 29 日搬家时右腿被砸伤，第二口井打到 700 米发生井喷，他扔掉拐杖跳进泥浆池，用身体搅拌水泥浆压住井喷。房东赵大娘说：“你们的王队长可真是个铁人呐！”1961 年任钻井二大队大队长，困难时期组织职工家属打土坯盖“干打垒”、开荒种地。1964 年作为大庆工人代表出席第三届全国人大。
      cites: [xinhua-2019-wang-jinxi, rmrb-1972-01-27-wang-jinxi]
    - h: “铁人也是假的”
      from: 1966-05
      to: 1970-11-15
      text: |
        据 1972 年《人民日报》的长文，1967 年初大庆的一场辩论会上有人喊“大庆红旗是假的，铁人也是假的”，他回答：“我是铁人还是泥人，关系不大。大庆这面红旗是谁也动摇不了的。”此后有人编造材料攻击他，一度把他关进密室，逼他在否定大庆红旗的纸条上签字，他拒绝了。解放军进驻大庆后，他四处劝两派联合、反对“停产闹革命”。1968 年 5 月大庆革委会成立，他任副主任；1969 年 4 月出席九大，当选中央委员。1970 年 4 月确诊胃癌晚期，11 月 15 日病逝。
      cites: [rmrb-1972-01-27-wang-jinxi, xinhua-2019-wang-jinxi]
  assess:
    - { voice: official1966, text: 一九六○年秋，会战刚刚打响，叛徒、内奸、工贼刘少奇和薄一波之流便接连窜到大庆，污蔑石油会战是“大混战”，胡说什么“会战乱糟糟的，不象搞工业的样子”。（1972 年《人民日报》）, cite: rmrb-1972-01-27-wang-jinxi, quote: true }
    - { voice: officialLater, text: 曾经发出“宁肯少活20年，拼命也要拿下大油田”誓言的王进喜，把自己的一生毫无保留地献给了祖国的石油事业。（2019 年《人民日报》）, cite: xinhua-2019-wang-jinxi, quote: true }
    - { voice: editor, text: 1972 年的长文把会战的阻力归于刘少奇、薄一波，把他在文革中受的冲击归于“一小撮阶级敌人”，没有点任何人的名字；2019 年的文章只写会战和病逝，1966–1970 年间的经历一句未提。, cite: rmrb-1972-01-27-wang-jinxi }
  factions: [models]
  fate:
    - { date: 1960-04, s: rise, note: 被称为“铁人”, cite: xinhua-2019-wang-jinxi }
    - { date: 1967, s: attacked, note: 被说成“假铁人”，一度被关押逼签, cite: rmrb-1972-01-27-wang-jinxi, verify: true }
    - { date: 1968-05, s: power, note: 大庆革委会副主任, cite: rmrb-1972-01-27-wang-jinxi }
    - { date: 1969-04, s: power, note: 九届中央委员, cite: rmrb-1972-01-27-wang-jinxi }
    - { date: 1970-11-15, s: dead, note: 胃癌, cite: xinhua-2019-wang-jinxi }
  cites: [rmrb-1972-01-27-wang-jinxi, xinhua-2019-wang-jinxi]

- id: shi-chuanxiang
  name: 时传祥
  born: 1915
  died: 1975-05-19
  deathKind: persecuted
  tier: 3
  role1966: 北京市崇文区清洁队掏粪工人、第三届全国人大代表
  pinyin: Shí Chuánxiáng
  gender: m
  birthplace: 山东齐河
  party: 中国共产党
  positions:
    - { title: 掏粪工人, orgName: 北京市崇文区清洁队, from: 1930, to: 1971, cite: rmrb-1978-07-06-shi-chuanxiang, verify: true }
  bio: 山东齐河人，十五岁逃荒到北京当掏粪工人。1959 年出席全国群英会时刘少奇与他握手合影，后当选第三届全国人大代表。1966 年国庆在天安门城楼上与毛泽东握手，一个多月后江青说他是“工贼”，陈伯达说他“被资产阶级收买了”。此后被批斗数百次，1968 年遭毒打、被减口粮，1971 年秋被遣回山东老家。1973 年 8 月周恩来过问后被接回北京治病，1975 年 5 月去世，1978 年 6 月平反。
  life:
    - h: 国庆观礼
      from: 1915
      to: 1966-11
      text: |
        十五岁时揣着糠饼子从山东老家逃荒到北京当掏粪工人。1959 年出席全国群英会，刘少奇跟他握手、照了相。1966 年国庆，他作为北京市观礼代表团副团长住进中南海，周恩来在国宴上给他敬酒；10 月 1 日在天安门城楼上，毛泽东走过来和他握了手。
      cites: [rmrb-1978-07-06-shi-chuanxiang]
    - h: “工贼”
      from: 1966-11
      to: 1973-08-21
      text: |
        毛泽东接见后一个多月，江青说“时传祥是工贼”，陈伯达说“时传祥被资产阶级收买了”。1966 年底一些人冲到崇文区清洁队强行揪斗他，罪状两条：刘少奇跟他握过手、照过相；他在群众大会上讲过忆苦思甜，被说成某群众组织的“头头”。1967 年元旦他在北京一个学院的操场上挨批斗，又被反剪双手、背插“工贼”标签押上卡车在市区游斗。到 1968 年已被批斗数百次，有人拿旧社会粪霸写的“证明”说他是富农。1968 年五一节后的一个深夜他被“特别审讯”，挨了皮鞭、木棍，又被用缠钢丝的三角皮带抽打；口粮从每月六十斤半减到三十六斤。“工贼”帽子因为没有证据定不了案，1971 年秋他被赶回山东齐河县赵官公社大胡大队。
      cites: [rmrb-1978-07-06-shi-chuanxiang]
    - h: 接回北京
      from: 1973-08-21
      to: 1978-06-30
      text: |
        1973 年 8 月 21 日凌晨，周恩来听万里等汇报北京工作时问起他，听说他受了残酷迫害，说：“难道文化大革命是要打倒一个掏粪工人！？”并指示派人接他回北京平反、道歉、治病。他住进宣武医院，万里到医院探望。多年的摧残已造成脑部弥漫性损伤和严重的脑软化症，1975 年 5 月 19 日去世。1978 年 6 月 30 日，北京市总工会、北京市环境卫生局和中共北京市崇文区委联合举行大会为他昭雪平反。
      cites: [rmrb-1978-07-06-shi-chuanxiang]
  assess:
    - { voice: officialLater, text: 江青强加给时传祥的“工贼”帽子，因为毫无证据，定不了案，少数别有用心的人，就想把时传祥赶走。（1978 年新华社）, cite: rmrb-1978-07-06-shi-chuanxiang, quote: true }
    - { voice: editor, text: 1978 年的平反报道把迫害全部归于“四人帮”，揪斗、审讯、毒打他的人只写作“不明真相的人”“少数别有用心的人”，没有一个名字；报道以“毛主席的关怀，周总理的指示”作结，没有追问文化大革命本身。, cite: rmrb-1978-07-06-shi-chuanxiang }
  factions: [models]
  fate:
    - { date: 1966-10-01, s: normal, note: 天安门城楼上与毛泽东握手, cite: rmrb-1978-07-06-shi-chuanxiang }
    - { date: 1966-12, s: attacked, note: 被揪斗，扣上“工贼”帽子, cite: rmrb-1978-07-06-shi-chuanxiang }
    - { date: 1971, s: sidelined, note: 被遣回山东老家, cite: rmrb-1978-07-06-shi-chuanxiang }
    - { date: 1973-08-21, s: restored, note: 周恩来指示接回北京治病, cite: rmrb-1978-07-06-shi-chuanxiang }
    - { date: 1975-05-19, s: dead, cite: rmrb-1978-07-06-shi-chuanxiang }
  rehab:
    - { date: 1978-06-30, text: 北京市总工会、北京市环境卫生局和中共北京市崇文区委联合举行大会为他昭雪平反, cite: rmrb-1978-07-06-shi-chuanxiang }
  cites: [rmrb-1978-07-06-shi-chuanxiang]

- id: li-shunda
  name: 李顺达
  born: 1915
  died: 1983-07-01
  tier: 3
  role1966: 山西平顺县西沟大队党总支书记、全国劳动模范
  pinyin: Lǐ Shùndá
  gender: m
  birthplace: 河南林县
  party: 中国共产党
  joinedParty: 1938-07
  positions:
    - { title: 组长, orgName: 李顺达互助组, from: 1943-02-06, to: 1951-12-10, cite: sxu-li-shunda }
    - { title: 社长, orgName: 西沟初级农业生产合作社, from: 1951-12-10, to: 1956, cite: sxu-li-shunda, verify: true }
  bio: 河南林县人，在山西平顺西沟当佃农，1938 年入党。1943 年组织了全国较早的农业互助组，1950 年获全国劳模称号，1951 年办起西沟初级社，申纪兰任副社长。1963 年起率先学大寨，文革后期对照搬大寨经验提出质疑，被批为晋东南“反大寨势力”总后台。1977 年“揭批清”中被列“十二条”罪状，他拒不承认，被取消十一大代表资格，省、地、县职务全被撤销，只留下村党总支书记。1981 年 5 月平反，1983 年去世。
  life:
    - h: 佃农与减租
      from: 1915
      to: 1943-02-06
      text: |
        1915 年生于河南林县合涧东山底村的贫苦农家，父亲李发全是木工、泥瓦匠，在山西晋城做包工；1929 年他 14 岁跟父亲到晋城帮工学艺。后来随母亲流落到山西平顺西沟租地主的地种。边区政府颁布减租法令后，他带头减租，又发动西沟 18 户佃农向地主减租，到 1939 年全西沟没有一户再租地主的地。1938 年 7 月经西沟地下党员张魁仁介绍入党。
      cites: [sxu-li-shunda]
    - h: 互助组与初级社
      from: 1943-02-06
      to: 1963
      text: |
        1943 年 2 月 6 日，他组织李达才、路文全等五户贫农成立李顺达互助组，是全国较早的农业生产互助组织。1949、1950、1951 年三次受到毛泽东接见；1950 年出席第一次全国工农兵劳动模范大会，获全国劳模称号。1951 年 3 月长治地委以“李顺达互助组影响大，还是更慎重些好”为由，没有批准他试办合作社；同年 12 月 10 日西沟初级农业生产合作社成立，他任社长，申纪兰任副社长。
      cites: [sxu-li-shunda]
    - h: “反大寨势力”总后台
      from: 1963
      to: 1981-05
      text: |
        西沟 1963 年初就开始学大寨，他是全国第一个学大寨的劳模。文革后期他对照搬大寨经验提出质疑，坚持“定额记工”，被长治地委在大会上批评“割资本主义尾巴，你不割”，扣上晋东南“反大寨势力”总后台的罪名。1977 年“揭批清”运动中他被列出“十二条”罪状；省委一些领导动员他只要承认一条就能当选十一大代表，他说：“现在叫我欺骗党，欺骗人民，骗取个人荣誉，当党代表，我不当！”结果被取消代表资格，省委常委、省革委副主任、晋东南地委书记、平顺县委书记职务全被撤销，只保留了西沟村党总支书记。1978 年夏他从中央党校回村，工作组把高音喇叭对着他家播放批判文章，又砍光了西沟六百多棵核桃树。1981 年 5 月，经中共中央、国务院介入，山西省委为他和受株连的人平反。
      cites: [sxu-li-shunda]
  assess:
    - { voice: scholar, text: 这场由山西省委主要领导人发动的批判李顺达的错误运动，在晋东南地区遭到了广大社员群众的抵制（行龙）, cite: sxu-li-shunda, quote: true }
    - { voice: editor, text: 行龙文没有写出“山西省委主要领导人”的名字。他被批判和撤职的具体日期、1966–1976 年间的遭遇，这篇文章也没有交代；卒日取通行说法，待核。, cite: sxu-li-shunda }
  factions: [models]
  fate:
    - { date: 1950, s: rise, note: 全国劳模, cite: sxu-li-shunda }
    - { date: 1977, s: attacked, note: “揭批清”中被定为“反大寨势力”总后台, cite: sxu-li-shunda }
    - { date: 1978, s: sidelined, note: 省、地、县职务全被撤销, cite: sxu-li-shunda, verify: true }
    - { date: 1981-05, s: restored, note: 山西省委为他平反, cite: sxu-li-shunda }
    - { date: 1983-07-01, s: dead, verify: true }
  rehab:
    - { date: 1981-05, text: 经中共中央、国务院介入，山西省委停止批判，为他和受株连的干部、群众平反, cite: sxu-li-shunda }
  cites: [sxu-li-shunda]

- id: shen-jilan
  name: 申纪兰
  born: 1929-12
  died: 2020-06-28
  deathKind: natural
  deathPlace: 山西长治
  tier: 3
  role1966: 山西平顺县西沟村干部、全国人大代表
  pinyin: Shēn Jìlán
  gender: f
  birthplace: 山西平顺
  party: 中国共产党
  joinedParty: 1953-09
  positions:
    - { title: 副社长, orgName: 西沟初级农业生产合作社, from: 1951-12, to: 1956, cite: people-2020-shen-jilan, verify: true }
    - { title: 副书记, orgName: 中共平顺县委, from: 1971, to: 1973, cite: people-2020-shen-jilan, verify: true }
    - { title: 主任, orgName: 山西省妇女联合会, from: 1973, to: 1983, cite: people-2020-shen-jilan }
    - { title: 副主任, orgName: 长治市人大常委会, from: 1984, to: 2017, cite: people-2020-shen-jilan }
  bio: 山西平顺人，1951 年任西沟初级社副社长，发动妇女下地并争取到男女同工同酬，1953 年《人民日报》的通讯使她闻名全国，次年男女同工同酬写入宪法。1954 年起连任第一至第十三届全国人大代表，是唯一一位连任十三届的代表。1971 年任平顺县委副书记，1973–1983 年任山西省妇联主任，1984–2017 年任长治市人大常委会副主任。获“共和国勋章”。2020 年在长治去世。
  life:
    - h: 同工同酬
      from: 1929-12
      to: 1966
      text: |
        1929 年 12 月生于山西平顺县龙溪镇杨威村的农民家庭。1951 年 12 月西沟初级农业生产合作社成立，她被选为副社长，发动西沟妇女参加农业生产，争取实行男女同工同酬。1953 年 1 月 25 日《人民日报》发表长篇通讯《“劳动就是解放，斗争才有地位”》，她的事迹引起全国反响；同年 9 月入党。1954 年当选第一届全国人大代表，同年男女同工同酬写入宪法。
      cites: [people-2020-shen-jilan]
    - h: 县委、妇联与人大
      from: 1971
      to: 2020-06-28
      text: |
