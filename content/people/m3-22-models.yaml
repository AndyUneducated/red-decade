  life:
    - h: 刘庄支书
      from: 1948
      to: 2003
      text: |
        1948 年刘庄解放，次年入党。1952 年冬 21 岁任村党支部书记。1956 年上级要把夏庄乡 21 个初级社并成一个高级社，提名他当社长，他认为条件不成熟，拒不到任，在乡里宣布成立高级社的同一天另办刘庄高级社，被扣上“目无领导”“本位主义”的帽子，“开会、发文件没刘庄的份儿”。大跃进中公社要求亩产小麦 7.5 万公斤，他只拿 3 亩地试验，结果亩产仅 130 公斤。文革中有人来刘庄串联，他在群众大会上宣布：“谁离开生产出外串联不记工分、不发盘缠；贴大字报，集体一分钱不报销。”又说：“咱农民没苗咋吃饭？谁要草就叫他吃草好了，咱要除草留苗。”2003 年春去世。
      cites: [rmrb-2003-09-15-shi-laihe]
  assess:
    - { voice: officialLater, text: 中共中央组织部曾把他的名字与雷锋、焦裕禄、王进喜、钱学森列在一起（2003 年《人民日报》）, cite: rmrb-2003-09-15-shi-laihe, quote: true }
