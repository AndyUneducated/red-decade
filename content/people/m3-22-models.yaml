- id: men-he
  name: 门合
  born: 1928
  died: 1967-09-05
  deathKind: accident
  deathPlace: 巴仓农场
  tier: 3
  role1966: 中国人民解放军军官
  pinyin: Mén Hé
  gender: m
  birthplace: 河北涞源
  party: 中国共产党
  joinedRevolution: 1948-11
  bio: 河北涞源人，贫农家庭出身，少年时在宣化为地下党送信。1946 年随家人回到解放了的涞源，参加“青救会”并入党，1948 年 11 月参军，后成为军官。1967 年 9 月 5 日在巴仓农场带领 27 名工人装制防雹土火箭，炸药即将连锁爆炸时他扑上去，壮烈牺牲。中共中央、中央军委追授他“无限忠于毛主席革命路线的好干部”称号，1968 年《人民日报》称他的“四个一切”是“共产主义一代新人”的典型。
  life:
    - h: 长工之子
      from: 1928
      to: 1948-11
      text: |
        他的父亲门进忠 1968 年回忆：老家在河北唐县，全家逃荒到涞源南上屯落户，他 1928 年出生，八岁就跟父亲给地主干活。1941 年全家到宣化，父亲与地下党取得联系，他常给地下党传送信件和情报。1946 年全家由地下党送回已经解放的涞源，他参加“青救会”，带青年站岗放哨、监视敌人，随后入党。
      cites: [rmrb-1968-06-04-men-he, hebcdi-2021-men-he]
    - h: 巴仓农场
      from: 1948-11
      to: 1967-09-05
      text: |
        1948 年 11 月参军，在部队成长为军官。父亲回忆，1961 年秋他回家探亲，反对涞源县“开小片荒地”，说“这是往资本主义路上走啊”。1967 年 9 月 5 日，他带领巴仓农场的 27 名工人装制防雹土火箭，始终站在离炸药最近的地方；意外发生后，在炸药和装好的火箭即将引起连锁爆炸时，他扑向炸药，壮烈牺牲。
      cites: [hebcdi-2021-men-he, rmrb-1968-06-04-men-he]
  assess:
    - { voice: official1966, text: 门合同志就是这一代新人最典型的代表。（1968 年《人民日报》）, cite: rmrb-1968-05-31-men-he, quote: true }
    - { voice: witness, text: 合子的话正说在我的心里。成立合作社、人民公社时，我都是带头参加。（门进忠，1968）, cite: rmrb-1968-06-04-men-he, quote: true }
    - { voice: editor, text: 1968 年的文章把“一切想着毛主席，一切服从毛主席，一切紧跟毛主席，一切为着毛主席”当作他最高的品质，并借他批判“三自一包”；2021 年《河北日报》保留了“无限忠于毛主席革命路线的好干部”的称号，不再提“四个一切”。入党时间，河北日报作 1946 年 10 月，父亲回忆作 1947 年土改那年，本站不录。, cite: hebcdi-2021-men-he }
  factions: [models]
  fate:
    - { date: 1967-09-05, s: dead, note: 扑向即将爆炸的炸药, cite: hebcdi-2021-men-he }
  afterlife:
    - { date: 1968, text: 中共中央、中央军委追授“无限忠于毛主席革命路线的好干部”称号, cite: hebcdi-2021-men-he, verify: true }
    - { date: 1968-05-31, text: 《人民日报》发表《共产主义一代新人的典型——赞门合的“四个一切”》, cite: rmrb-1968-05-31-men-he }
  cites: [hebcdi-2021-men-he, rmrb-1968-06-04-men-he, rmrb-1968-05-31-men-he]
