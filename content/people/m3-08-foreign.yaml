# M3 people, batch 8: the Foreign Ministry — 姚登山, 乔冠华, 姬鹏飞.
# Texts: 邹一民 on 姚登山 (excerpt, quotes 王力's 1967-08-08 letter), 乔冠华's 1971 UN speech and the
# 1975 NPC announcements from People's Daily (research/manifests/web-m3-people.yaml).

- id: yao-dengshan
  name: 姚登山
  born: 1918
  died: 1998
  tier: 3
  role1966: 驻印度尼西亚大使馆参赞、临时代办
  pinyin: Yáo Dēngshān
  gender: m
  ethnicity: 汉族
  aka:
    - { kind: other, name: 姚忠 }
  birthplace: 山西襄汾
