    - { title: 部长, orgName: 外交部, from: 1974-11, to: 1976-12, cite: rmrb-1975-01-19-state-council-list }
    - { title: 中央委员, orgName: 中国共产党中央委员会, from: 1973-08, to: 1977-08, verify: true }
  bio: 江苏盐城人，留学德国，1940 年代以“乔木”笔名在香港、重庆写国际评论。1949 年后长期在外交部，参加朝鲜停战谈判和日内瓦会议，1964 年任副部长。1967 年外交部造反派要求停止陈毅、姬鹏飞和他的对外活动。1971 年 11 月率团首次出席联合国大会，15 日发言称“国家要独立，民族要解放，人民要革命”。1974 年 11 月任外交部长，1975 年四届人大确认。1976 年批邓期间与江青方面接近，10 月后被审查，12 月免职。1983 年在北京病逝。
  life:
    - h: 国际评论家
      from: 1913
      to: 1963
      text: |
        1913 年生于江苏盐城，清华大学哲学系毕业后留学日本、德国，获图宾根大学博士学位。1939 年入党，在香港、重庆以“乔木”等笔名为《时事晚报》《新华日报》写国际评论。1949 年后任外交部外交政策委员会副主任，1951–1953 年参加朝鲜停战谈判，1954 年随周恩来出席日内瓦会议。
      verify: true
    - h: 文革中的外交部
      from: 1964
      to: 1973
      text: |
        1964 年任外交部副部长。1967 年外交部造反派“联络站”要挟周恩来接受“停止陈（毅）、姬（鹏飞）、乔（冠华）对外活动”的要求，8 月 15 日姚登山在外贸部造反派的大会上说“这边是打倒陈姬乔”。1971 年 11 月 15 日他以中国代表团团长身份在联合国大会第二十六届会议上首次发言，指名批评美国和“一、两个超级大国”。1973 年 8 月十大当选中央委员。
      cites: [zou-yimin-yao-dengshan, rmrb-1971-11-17-qiao-un]
      verify: true
    - h: 外交部长与免职
      from: 1974-11
      to: 1983-09-22
      text: |
        1974 年 11 月接替姬鹏飞任外交部长，1975 年 1 月四届人大一次会议的国务院名单仍列他为外交部部长。1976 年批邓、毛泽东去世前后他和妻子章含之被认为向江青靠拢，10 月“四人帮”被捕后受审查，12 月免去外交部长职务，由黄华接任。1977 年 8 月十一大未再当选中央委员。1983 年 9 月 22 日在北京病逝。
      cites: [rmrb-1975-01-19-state-council-list]
      verify: true
  assess:
    - { voice: official1966, text: 国家要独立，民族要解放，人民要革命，这已成为不可抗拒的历史潮流。（1971 年 11 月 15 日联大发言）, cite: rmrb-1971-11-17-qiao-un, quote: true }
    - { voice: official1966, text: 现在，新的世界大战的危险依然存在，但是，当前世界的主要倾向是革命。, cite: rmrb-1971-11-17-qiao-un, quote: true }
    - { voice: editor, text: 1976 年底的免职没有公开的中央文件说明；常见的说法是他在批邓中表态积极、与江青往来，属于“与四人帮有牵连”而非帮派成员，此后未再起用。 }
