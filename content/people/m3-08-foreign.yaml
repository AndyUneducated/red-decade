  positions:
    - { title: 驻印度尼西亚大使馆参赞、临时代办, orgName: 外交部, from: 1966-03, to: 1967-04-30, cite: zou-yimin-yao-dengshan }
  bio: 山西襄汾人，抗战中在家乡打游击，1950 年由军队调入外交部。1967 年 4 月作为驻印尼临时代办被印尼当局驱逐，回国时周恩来、陈毅到机场迎接，5 月 1 日毛泽东在天安门城楼接见，被称为“红色外交战士”。此后四个月里他紧跟王力、关锋、戚本禹，支持外交部造反派“打倒陈毅”、夺取外交部权力，8 月 8 日王力亲笔来信支持他。9 月起被隔离审查，1971 年 6 月在批斗大会上被当场逮捕，关押九年多。1980 年外交部给予留党察看处分，同年 8 月出狱，1998 年在北京去世。
  life:
    - h: 游击队长到外交官
      from: 1918
      to: 1966
      text: |
        邹一民记述，他 1918 年生于山西襄汾陶寺乡陈庄村，贫农出身，青年时参加过阎锡山的“防共团”，20 岁入党，抗战中在家乡领导游击支队。1950 年从第六十二军军政干校调到北京参加军委武官训练班，随后进入外交部，先后任驻丹麦、芬兰使馆一等秘书、参赞，西欧司专员，驻锡兰使馆参赞，总务司副司长。1966 年 3 月任驻印尼大使馆参赞，4 月 7 日大使姚仲明被召回后任临时代办。
      cites: [zou-yimin-yao-dengshan]
    - h: 红色外交战士
      from: 1967-04
      to: 1967-08
      text: |
        1967 年 4 月他被印尼当局宣布为“不受欢迎的人”。4 月 30 日回到北京，周恩来、陈毅和数千群众到机场迎接，5 月 1 日晚毛泽东、林彪在天安门城楼接见，媒体称他为“红色外交战士”。此后四个月他紧跟王力、关锋、戚本禹，与外交部造反派“联络站”站在一起，要挟周恩来接受“停止陈（毅）、姬（鹏飞）、乔（冠华）对外活动”等要求。8 月 8 日王力亲笔写信，说他的讲话“也是对的”。8 月 15 日他在外贸部造反派的大会上说“这边是打倒陈姬乔”，引起两派武斗；同月“反帝反修联络站”的学生冲入英国驻华代办处放火（8 月 22 日夜），他还在外交公寓指挥揪斗英国代办。
      cites: [zou-yimin-yao-dengshan]
    - h: 审查、逮捕与出狱
      from: 1967-09
      to: 1998
      text: |
        9 月 1 日起他家四次被红卫兵抄家，他本人多次被学生批斗；9 月 14 日起在外交部和三个五七干校受批判和隔离审查。1971 年 6 月 11 日外交部召开批斗大会，北京市公安局军管会代表“当场接受群众要求”，把他作为“现行反革命分子”逮捕，此后关押九年多。外交部党委的结论是他犯有反对周恩来、坚持打倒陈毅等严重错误，给予留党察看一年（1971 年 11 月至 1972 年 11 月），宣布时处分期早已过去。1980 年 8 月出狱，恢复行政十级待遇，1985 年离休，1998 年在北京病逝。
      cites: [zou-yimin-yao-dengshan]
  assess:
    - { voice: official1966, text: 戚本禹同志讲的几句话，是正确的。你讲的话，也是对的。（1967 年 8 月 8 日王力致姚登山信）, cite: zou-yimin-yao-dengshan, quote: true }
    - { voice: witness, text: 姚登山在文化大革命时期犯有严重错误，他犯有反对周总理、坚持打倒陈毅等错误。（1980 年外交部党委结论，邹一民转述）, cite: zou-yimin-yao-dengshan, quote: true }
    - { voice: editor, text: 他没有受过审判。1971 年的逮捕是在批斗大会上“当场接受群众要求”执行的，九年后以党内处分了结，处分期早已过去。, cite: zou-yimin-yao-dengshan }
  factions: [rebels]
  fate:
