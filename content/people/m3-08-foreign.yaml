- id: qiao-guanhua
  name: 乔冠华
  born: 1913-03-28
  died: 1983-09-22
  tier: 3
  role1966: 外交部副部长
  pinyin: Qiáo Guānhuá
  gender: m
  ethnicity: 汉族
  aka:
    - { kind: pen, name: 乔木 }
  birthplace: 江苏盐城
  origin: 江苏盐城
  deathKind: natural
  deathPlace: 北京
  party: 中国共产党
  positions:
