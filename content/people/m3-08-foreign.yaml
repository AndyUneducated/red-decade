  birthplace: 山西临猗
  origin: 山西临猗
  deathKind: natural
  deathContested: true
  deathPlace: 北京
  party: 中国共产党
  positions:
    - { title: 副部长, orgName: 外交部, from: 1955, to: 1971, verify: true }
    - { title: 代理部长、部长, orgName: 外交部, from: 1971, to: 1974-11, verify: true }
    - { title: 委员, orgName: 全国人民代表大会常务委员会, from: 1975-01-17, to: 1978-03, cite: rmrb-1975-01-19-npc-sc-list }
    - { title: 部长, orgName: 中共中央对外联络部, from: 1979-01, to: 1982-04, verify: true }
    - { title: 主任, orgName: 国务院港澳事务办公室, from: 1983, to: 1990, verify: true }
  bio: 山西临猗人，宁都起义参加红军，长征中在红军卫生部门工作，抗战和解放战争中在新四军、华东野战军做政治工作。1950 年起任驻民主德国大使，1955 年回国任外交部副部长，后为常务副部长。1967 年外交部造反派要求撤销他的常务副部长职务、停止他的对外活动。陈毅不能工作后他主持外交部日常工作，1971 年任代部长，后任部长，1974 年 11 月由乔冠华接替，1975 年改任人大常委。1979 年后任中联部部长、国务院副总理、国务委员，1983–1990 年任港澳办主任，主持起草香港、澳门基本法。2000 年在北京去世。
  life:
    - h: 红军军医到驻德大使
      from: 1910
      to: 1954
      text: |
        1910 年生于山西临猗，1931 年随第二十六路军宁都起义加入红军，同年入党，在红军卫生部门工作，参加长征。抗战中任新四军第一师政治部主任，解放战争中任华东野战军第一纵队政委等职。1950 年任驻民主德国外交使团团长，后为大使。
      verify: true
    - h: 常务副部长与代部长
      from: 1955
      to: 1974-11
      text: |
        1955 年回国任外交部副部长，后为常务副部长。1967 年外交部“联络站”向周恩来提出“撤消姬鹏飞常务副部长职务”“停止陈（毅）、姬（鹏飞）、乔（冠华）对外活动”。1969 年后陈毅不能主持工作，他在周恩来领导下主管外交部日常工作，1971 年任代理部长，1972 年陈毅去世后为部长，经历了尼克松访华和中日建交。1974 年 11 月由乔冠华接任部长。
      cites: [zou-yimin-yao-dengshan]
      verify: true
    - h: 人大、中联部与港澳办
      from: 1975
      to: 2000-02-10
      text: |
        1975 年 1 月四届人大一次会议当选人大常委会委员，此后兼任常委会秘书长。1979 年 1 月任中联部部长，同年任国务院副总理，1982 年后为国务委员。1983 年起任国务院港澳事务办公室主任，参与中英、中葡谈判，1985–1990 年任香港特别行政区基本法起草委员会主任委员。1988–1993 年任全国人大常委会副委员长。2000 年 2 月 10 日在北京去世。官方讣告称病逝；儿子姬胜德 1999 年因受贿被捕，境外报刊有他服毒自尽之说，未见证实。
      cites: [rmrb-1975-01-19-npc-sc-list]
      verify: true
  assess:
    - { voice: editor, text: 1975 年四届人大的国务院名单中外交部部长是乔冠华，他出现在人大常委会委员名单里。这一调动发生在 1974 年 11 月，原因未见公开说明。, cite: rmrb-1975-01-19-state-council-list }
    - { voice: editor, text: 死因官方未说明为自杀，境外传闻与其子受贿案有关，这里标为有争议。 }
