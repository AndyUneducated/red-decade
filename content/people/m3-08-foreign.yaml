    - { date: 1967-04-30, s: rise, note: “红色外交战士”回国, cite: zou-yimin-yao-dengshan }
    - { date: 1967-08-08, s: power, note: 王力来信支持, cite: zou-yimin-yao-dengshan }
    - { date: 1967-09-01, s: attacked, note: 抄家、批斗, cite: zou-yimin-yao-dengshan }
    - { date: 1967-09-14, s: detained, note: 隔离审查, cite: zou-yimin-yao-dengshan }
    - { date: 1971-06-11, s: detained, note: 批斗大会上被逮捕, cite: zou-yimin-yao-dengshan }
    - { date: 1980-08, s: normal, note: 出狱, cite: zou-yimin-yao-dengshan }
