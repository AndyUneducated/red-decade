    - { date: 1955-01, s: attacked, note: 公开批判（维基百科，未核原件）, cite: zhwiki-hu-feng }
    - { date: 1955-05-17, s: detained, note: 被捕，1965 年判刑, verify: true }
    - { date: 1979-01, s: restored, note: 获释（维基百科，未核原件）, cite: zhwiki-hu-feng }
    - { date: 1980-09-29, s: restored, note: 中央通知平反, cite: cpc-1980-09-29-hu-feng-rehab }
    - { date: 1985-06-08, s: dead, note: 病逝（维基百科，未核原件）, cite: zhwiki-hu-feng }
  rehab:
    - { date: 1980-09-29, text: 中共中央批转复查报告，宣布“胡风反革命集团”案是错案，予以平反, cite: cpc-1980-09-29-hu-feng-rehab }
    - { date: 1988-06-18, text: 中办补充通知，取消对其文艺思想和宗派活动的指责, cite: cpc-1980-09-29-hu-feng-rehab }
  cites: [ws-1955-08-25-purge-directive, cpc-1980-09-29-hu-feng-rehab]

- id: zhang-bojun
  name: 章伯钧
  born: 1895
  died: 1969-05-17
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 1957 年被划为右派，摘帽后仍未改正
  pinyin: Zhāng Bójūn
  gender: m
  birthplace: 安徽桐城
  positions:
    - { title: 部长, orgName: 交通部, from: 1949-10, to: 1958-02, verify: true }
    - { title: 主席, orgName: 中国农工民主党, from: 1947-02, to: 1958, verify: true }
    - { title: 副主席, orgName: 中国民主同盟, from: 1949, to: 1958, cite: ws-1980-ufwd-rightist-review }
  bio: 安徽桐城人，早年留学德国，参加南昌起义，后随邓演达创建第三党（后来的农工民主党），抗战中参与发起民盟。建国后任交通部长、农工党主席、民盟副主席、《光明日报》社长。1957 年鸣放中主张“轮流坐庄”、“政治设计院”，被定为“章罗同盟”首领、头号右派，1958 年撤去各项职务。1969 年病逝。1980 年复查时中央统战部认为他“并非错划，不应改正”，至今未改正。
  life:
    - h: 从武昌到南昌
      from: 1895-11-17
      to: 1927-11
      text: |
        1895 年 11 月 17 日生于安徽桐城后方乡一个地主家庭，6 岁丧父，由两位叔叔抚养。1916 年考入武昌高等师范学校英文部，与恽代英、萧楚女相识，五四运动时是武昌高师学生会代表。1920 年毕业后回安徽教书。1925 年在柏林结识邓演达，两人观点相近。1926 年回国任中山大学文学院教授，随即参加北伐；1927 年 8 月参加南昌起义，任起义军总指挥部政治部副主任，起义失败后到香港，从此脱离中共。
      cites: [zhwiki-zhang-bojun]
    - h: 第三党与民主党派
      from: 1927-11
      to: 1955
      text: |
        此后追随邓演达创建“第三党”（即后来的中国农工民主党）。1933 年参加福建事变，失败后流亡日本；1935 年回香港，把第三党改组为中华民族解放行动委员会；1938 年任国民参政会参政员。他是民盟和农工民主党的创始人和领导人之一。建国后任全国政协常委、中央人民政府委员、政务院政务委员、交通部部长、民盟副主席、农工民主党主席和《光明日报》社社长。
      cites: [zhwiki-zhang-bojun]
    - h: 头号右派
      from: 1956
      to: 1966-05
      text: |
