    - { voice: official1981, text: 一九五五年三月召开的党的全国代表会议，总结了反对野心家高岗、饶漱石阴谋分裂党、篡夺党和国家最高权力的重大斗争（1981 年决议）, cite: ws-1981-resolution, quote: true }
