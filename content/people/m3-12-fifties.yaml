        1966 年 8 月 24 日被国务院机关事务管理局的“革命群众”押到吉祥戏院，被红卫兵打成重伤，一位管片民警把他送进协和医院才幸存；住宅被占，他被迁到呼家楼的普通居民楼。有人要他写张劲夫是叛徒的证明，他把纸撕碎。1975 年 4 月毛泽东、周恩来指示摘去他的右派帽子。1977 年 5 月 13 日在北京病逝。1980 年中央统战部报告把他列在“拟予改正”的二十二人之首。
