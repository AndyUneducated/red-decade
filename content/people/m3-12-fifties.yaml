  pinyin: Hú Fēng
  gender: m
  birthplace: 湖北蕲春
  positions:
    - { title: 理事, orgName: 中国作家协会, from: 1953, to: 1955-05, verify: true }
  bio: 湖北蕲春人，左翼文艺理论家，鲁迅晚年的学生和友人，主编《七月》《希望》。建国后因“主观战斗精神”等文艺主张与周扬等人长期对立，1954 年向中央递交《关于解放以来的文艺实践情况的报告》（“三十万言书”）。1955 年 5 月《人民日报》公布“胡风反革命集团”材料，他被捕，全国随即展开肃反运动，株连两千余人。1965 年判处有期徒刑十四年，文革中加判无期徒刑。1979 年获释，1980 年中央为“胡风反革命集团”案平反，1985 年 6 月 8 日病逝，1988 年彻底平反。
  life:
    - h: 左翼文艺与“三十万言书”
      from: 1902
      to: 1955-04
      text: |
        1902 年生于湖北蕲春，1930 年代在上海参加左联，与鲁迅过从甚密，抗战中主编《七月》，团结了阿垅、路翎等一批青年作家。他主张作家的“主观战斗精神”，反对公式化，与周扬、林默涵等人的分歧延续到建国后。1954 年 7 月他向中央递交长篇报告，系统批评文艺领导工作，次年 1 月被公开批判。
      verify: true
    - h: “胡风反革命集团”
      from: 1955-05
      to: 1979-01
      text: |
        1955 年 5 月起《人民日报》分三批公布《关于胡风反革命集团的材料》，毛泽东为之写了序言和按语，胡风 5 月 17 日被捕。中央当年 8 月的指示说，各机关“都在肅清胡風反革命集團的鬥爭的基礎上，開始展開了肅清一切暗藏的反革命分子的鬥爭”，并认为“利用胡風事件，大張旗鼓地發動群眾”是正确的。1965 年他被判处有期徒刑十四年，文革中在四川改判无期徒刑，1979 年 1 月获释。
      verify: true
      cites: [ws-1955-08-25-purge-directive]
    - h: 三次平反
      from: 1980-09-29
      to: 1988-06-18
      text: |
        1980 年 9 月 29 日中共中央批转公安部、最高人民检察院、最高人民法院党组的复查报告，通知说此案“是在当时的历史条件下，混淆了两类不同性质的矛盾，将有错误言论、宗派活动的一些同志定为反革命分子、反革命集团的一件错案”。同年 11 月 3 日北京市高级人民法院宣告胡风无罪。这次平反仍保留了对他文艺思想、宗派活动和政治历史的结论，1985 年公安部撤销了历史问题的结论；他 1985 年 6 月 8 日病逝。1988 年 6 月 18 日中办补充通知又“取消了对胡风的文艺思想和宗派活动等问题的严厉指责”。
      cites: [cpc-1980-09-29-hu-feng-rehab]
  assess:
    - { voice: official1966, text: 利用胡風事件，大張旗鼓地發動群眾來進行肅清一切暗藏的反革命分子的運動，是正確的（1955 年 8 月中共中央指示）, cite: ws-1955-08-25-purge-directive, quote: true }
    - { voice: officialLater, text: 混淆了两类不同性质的矛盾，将有错误言论、宗派活动的一些同志定为反革命分子、反革命集团的一件错案（1980 年中共中央通知）, cite: cpc-1980-09-29-hu-feng-rehab, quote: true }
  factions: [dissent]
  fate:
