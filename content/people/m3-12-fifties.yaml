      from: 1909
      to: 1945
      text: |
        1909 年生于江苏宜兴望族，出生六天丧母，14 岁丧父，由伯父储南强抚养。1928 年升入光华大学文科。1933 年 7 月进南京《中央日报》编副刊。1936 年赴英国，9 月入爱丁堡大学（此前数据作伦敦政治经济学院）；1938 年回国，随《中央日报》迁重庆任撰述、编辑，此后在湖南蓝田国立师范学院讲授英国史和世界政治。
