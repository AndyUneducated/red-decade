  bio: 江西安福人，清华学校毕业后留学美国、英国，获伦敦政治经济学院政治学博士，1920 年代末在《新月》上批评国民党、主张人权。抗战中参与创建民盟，任宣传部长。建国后任民盟副主席、森林工业部部长。1957 年被定为“章罗同盟”首领之一，划为右派，1958 年撤职。1965 年 12 月病逝。1980 年复查维持原案，未改正。
  life:
    - h: 清华、《新月》与人权论
