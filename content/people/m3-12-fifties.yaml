      text: |
        文革开始后作为著名“大右派”几乎每天被批斗，1966 年 8 月 31 日在青龙桥投河自杀未遂，在九三学社被关押几天后放回家，9 月上旬失踪，生死不明。维基百科列出隐居、出国、自杀、被打死后秘密火化几种说法，都没有确证。1980 年中央统战部复查维持原案，未予改正。
      cites: [zhwiki-chu-anping, ws-1980-ufwd-rightist-review]
  assess:
