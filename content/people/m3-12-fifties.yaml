      to: 1949
      text: |
        1910 年 11 月 2 日生于吴江县松陵镇。1928 年入东吴大学医预科，一年后觉得“要治病人先得治社会”，转入燕京大学师从吴文藻，1933 年毕业，1935 年清华研究院社会学人类学系毕业。1936 年底赴伦敦政治经济学院师从马林诺夫斯基，1938 年以《江村经济》获博士学位。同年夏回国任教云南大学，主持云南大学与燕京大学合办的社会学研究室。1945 年加入民盟，此后任西南联大、清华大学教授和清华副教务长。
      cites: [zhwiki-fei-xiaotong]
    - h: 民族访问与民族学院
      from: 1950
      to: 1956
      text: |
        1950 年至 1952 年任中央民族访问团中南访问团代理团长兼广西分团团长。1952 年至 1957 年任中央民族学院副院长、中国科学院哲学社会科学学部委员。
      cites: [zhwiki-fei-xiaotong]
    - h: 右派与文革
      from: 1957
      to: 1978
      text: |
        1957 年 3 月 24 日发表《知识分子的早春天气》，6 月被划为右派，7 月以“向人民服罪”为题自我检讨，8 月在民盟整风座谈会上“揭发”罗隆基。1958 年 1 月全国人大常委会建议罢免他的人大民族委员会委员职务。1966 年 9 月 1 日在中央民族学院与吴文藻、潘光旦等被批斗、押去劳动，1967 年 6 月 10 日目睹潘光旦死去。
      cites: [zhwiki-fei-xiaotong, ws-1958-npc-rightists-removal]
    - h: 改正与晚年
      from: 1979
      to: 2005-04-24
      text: |
        1979 年受胡乔木委托主持恢复社会学，任中国社会学会会长。1980 年中央统战部把他列入“拟予改正”的二十二人，同年他任审判林彪、江青集团的特别法庭审判员。此后任社科院社会学研究所所长，1983 年至 1988 年任全国政协副主席，1988 年提出“中华民族多元一体格局”，1988 年至 1998 年任全国人大常委会副委员长。晚年他评价自己作为“走安全路线”的知识分子领头人“实际上是带头改造”，“这个我一直到现在都认为我有罪的，我对知识分子不起”。2005 年 4 月 24 日在北京逝世。
      cites: [zhwiki-fei-xiaotong, ws-1980-ufwd-rightist-review]
  assess:
    - { voice: officialLater, text: 这两份意见书的基本内容是可取的，不是反党反社会主义的，不是“章罗同盟”的纲领（1980 年中央统战部报告，指民盟中央 1957 年的科学体制和高校领导制度意见书）, cite: ws-1980-ufwd-rightist-review, quote: true }
  factions: [rightists]
  fate:
    - { date: 1957-06, s: attacked, note: 被划为右派（此前数据作 1957-07）（维基百科，未核原件）, cite: zhwiki-fei-xiaotong }
    - { date: 1958-01-31, s: sidelined, note: 被建议罢免人大民族委员会委员职务, cite: ws-1958-npc-rightists-removal }
    - { date: 1966-09-01, s: attacked, note: 文革中被批斗（此前数据作 1966-08）（维基百科，未核原件）, cite: zhwiki-fei-xiaotong }
    - { date: 1980, s: restored, note: 右派问题改正, cite: ws-1980-ufwd-rightist-review }
    - { date: 1988-04, s: power, note: 全国人大常委会副委员长（维基百科，未核原件）, cite: zhwiki-fei-xiaotong }
    - { date: 2005-04-24, s: dead, note: 病逝（维基百科，未核原件）, cite: zhwiki-fei-xiaotong }
  cites: [ws-1958-npc-rightists-removal, ws-1980-ufwd-rightist-review]

- id: long-yun
  name: 龙云
  born: 1884
  died: 1962-06-27
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 1962 年已去世
  pinyin: Lóng Yún
  gender: m
  ethnicity: 彝族
  birthplace: 云南昭通
  positions:
    - { title: 副主席, orgName: 国防委员会, from: 1954-09, to: 1958-02, cite: ws-1958-npc-rightists-removal }
  bio: 云南昭通人，彝族。1927 年起主政云南近二十年，人称“云南王”，抗战中保证滇缅公路运输，1945 年被蒋介石以武力解除职务。1949 年在香港通电起义，建国后任西南军政委员会副主席、国防委员会副主席。1957 年在人大发言批评苏联借债要高利息、凉山彝区土改为时过早等，被划为右派，1958 年被罢免国防委员会副主席等职。1962 年病逝。1980 年复查拟予改正。
  life:
    - h: 滇军
      from: 1884-11-19
      to: 1927-07
      text: |
        1884 年 11 月 19 日生于云南恩安（今昭通）炎山乡一个黑彝地主家庭，族名纳吉乌梯，幼年丧父，16 岁才与表弟卢汉到昭通城读书习武。辛亥革命后加入援川滇军，1912 年 7 月入云南陆军讲武堂，1913 年毕业，此后在唐继尧身边当侍从、近卫，逐级升到军长、镇守使。1927 年 2 月与胡若愚等四镇守使发动“二六政变”逼唐继尧下台；6 月 14 日被胡若愚扣押，囚于铁笼一个多月，左眼在炮击中受伤失明。
      cites: [zhwiki-long-yun]
    - h: “云南王”
      from: 1927-08
      to: 1949
      text: |
        1927 年 8 月回到昆明接任第三十八军军长、代理省务委员会主席，此后统一云南，主政十八年，人称“云南王”。抗战初期表示出兵两万支援全国抗战，主持抢建滇缅公路，派卢汉率滇军参加台儿庄等二十多次战役。他对西南联大的爱国民主运动态度比较开明，1944 年秘密加入民盟。1945 年 10 月 3 日蒋介石以第五军出兵五华山，他与警卫营对峙三天后放弃，此后被软禁，1946 年 5 月随政府到南京；1948 年 12 月 8 日在陈纳德等帮助下飞广州转香港，结束三年两个月的软禁，在香港加入民革。1949 年 8 月 13 日与 44 人在香港联名发表声明，与蒋介石决裂（此前数据作 1949 年在香港通电起义）。
      cites: [zhwiki-long-yun]
    - h: 右派
      from: 1950
      to: 1962-06-27
      text: |
        1950 年 1 月从香港到北京，6 月任西南军政委员会副主席，1954 年 9 月任国防委员会副主席、全国人大常委会委员，1956 年任民革中央副主席。1957 年在全国人大云南组发言，说苏联借债要高利息、限期归还，“太欺负我们的党和国家了”，云南农村解放后应该休养生息，凉山彝区马上搞阶级斗争和土改“为时尚早”（此前数据作批评苏联在东北拆走工厂设备、中国负担朝鲜战争全部军费），随后被扣上“反党”、“反社会主义”的罪名，1957 年春被划为右派，是少数民族六大右派之首。1958 年 1 月全国人大常委会建议罢免他的人大常委会委员和“国防委员会副主席的职务”，2 月 1 日撤销。1959 年 12 月复任全国政协常委。1962 年 6 月 27 日在北京病逝。
      cites: [ws-1958-npc-rightists-removal, zhwiki-long-yun]
    - h: 身后
      from: 1966
      text: |
        文革中他在北京的家被北航红卫兵抄家封门，夫人顾映秋被批斗，他在石林的题字被刮掉。1980 年中央统战部复查拟予改正，此后石林的题字又被放回。
      cites: [zhwiki-long-yun, ws-1980-ufwd-rightist-review]
  assess:
    - { voice: doc, text: 罢免龙云国防委员会副主席的职务（1958 年全国人大常委会建议）, cite: ws-1958-npc-rightists-removal, quote: true }
  factions: [rightists]
  rehab:
    - { date: 1980, text: 中央统战部右派复查报告把他列入拟予改正的爱国人士, cite: ws-1980-ufwd-rightist-review }
  fate:
    - { date: 1949-08-13, s: normal, note: 与 44 人在香港联名发表声明，与蒋中正决裂（原记在香港通电起义）（此前数据作 1949）（维基百科，未核原件）, cite: zhwiki-long-yun }
    - { date: 1954-09, s: power, note: 国防委员会副主席（维基百科，未核原件）, cite: zhwiki-long-yun }
    - { date: 1957, s: attacked, note: 春季被划为右派（此前数据作 1957-07）（维基百科，未核原件）, cite: zhwiki-long-yun }
    - { date: 1958-01-31, s: purged, note: 被建议罢免各项职务, cite: ws-1958-npc-rightists-removal }
    - { date: 1962-06-27, s: dead, note: 病逝（维基百科，未核原件）, cite: zhwiki-long-yun }
  cites: [ws-1958-npc-rightists-removal, ws-1980-ufwd-rightist-review]

- id: huang-shaohong
  name: 黄绍竑
  born: 1895
  died: 1966-08-31
  deathKind: suicide
  deathPlace: 北京
  tier: 3
  role1966: 全国政协委员，1957 年被划为右派
  pinyin: Huáng Shàohóng
  gender: m
  birthplace: 广西容县
  positions:
    - { title: 委员, orgName: 全国人民代表大会常务委员会, from: 1954-09, to: 1958-02, cite: ws-1958-npc-rightists-removal }
  bio: 广西容县人，新桂系首领之一，与李宗仁、白崇禧并称，历任国民政府浙江、湖北省主席。1949 年作为国民党和谈代表团成员留在北平，参加新政权，任政务院政务委员、全国人大常委会委员。1957 年被划为右派，1958 年被罢免人大常委会委员职务。1966 年 8 月文革中受红卫兵冲击，8 月 31 日在北京自杀。1980 年复查拟予改正。
  life:
    - h: 新桂系
      from: 1895-12-01
      to: 1931
      text: |
        1895 年生于广西容县珊萃村的望族，叔祖、叔父都是进士，父亲是举人。1909 年入广西陆军第三中学，1912 年入武昌陆军军官预备学校，1914 年结业后入保定陆军军官学校，1916 年毕业回广西陆军。新桂系统一广西后，他是仅次于李宗仁的二号首领，与李宗仁、白崇禧并称三巨头，1926 年 6 月 1 日任广西省政府主席。
      cites: [zhwiki-huang-shaohong]
    - h: 投蒋与和谈
      from: 1932
      to: 1949-08
      text: |
        新桂系历次反蒋战争中他指挥屡屡失利，威望受挫，在李、白谅解下离开桂系投蒋，1932 年 5 月 3 日任内政部长。此后三度任浙江省政府主席，1937 年 1 月任湖北省政府主席；抗战中任第二战区、第三战区司令长官，1947 年当选监察院副院长。1949 年 4 月 1 日作为和谈代表到北平，4 月 16 日带着中共的要求飞回南京请示，4 月 21 日飞往香港（此前数据作和谈破裂后没有返回南京）。8 月 15 日与龙云、刘建绪等 44 人在香港发表声明。
      cites: [zhwiki-huang-shaohong]
    - h: 右派
      from: 1949-09
      to: 1966-05
      text: |
        1949 年 9 月从香港回到大陆，出席第一届政协，此后任政务院政务委员、全国人大常委会委员、民革中央常委。1957 年 5 月发表《党不应直接向人民发号施令》，6 月被划为右派，1958 年 1 月全国人大常委会建议罢免他的人大常委会委员和人大法案委员会委员职务。1960 年因“确有悔改”摘去右派帽子。1965 年 7 月 20 日李宗仁从美国回到北京，他到场迎接。
      cites: [ws-1958-npc-rightists-removal, zhwiki-huang-shaohong]
    - h: 自杀
      from: 1966-06
      to: 1966-08-31
      text: |
        文革开始后受到严重冲击。1966 年 8 月 31 日下午他去李宗仁家，对程思远说担心的是李宗仁，与李宗仁谈了什么不得而知；当天在北京以剃刀割颈自杀。1980 年中央统战部复查拟予改正（报告写作“黄绍肱”），1980 年代民革为他平反、恢复名誉。
      cites: [zhwiki-huang-shaohong, ws-1980-ufwd-rightist-review]
  assess:
    - { voice: doc, text: 常务委员会决定建议大会罢免黄绍竑、龙云、陈铭枢全国人民代表大会常务委员会委员的职务（1958 年全国人大常委会建议）, cite: ws-1958-npc-rightists-removal, quote: true }
  factions: [rightists]
  rehab:
