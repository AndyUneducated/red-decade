  bio: 陕西横山人，陕甘边根据地创建者之一。建国后任中共中央东北局书记、中央人民政府副主席，1952 年调任国家计划委员会主席。1953 年联络饶漱石等人，企图改组中央、自任总书记或副主席兼总理，1954 年 2 月七届四中全会上受到揭发批判，同年 8 月自杀。1955 年 3 月全国代表会议定为“高岗、饶漱石反党联盟”首脑，开除党籍。
  life:
    - h: 陕北红军
      from: 1905
      to: 1945-09
      text: |
        1905 年生于陕西米脂县武镇（今属横山）一个贫苦农民家庭，1925 年秋入榆林中学，1926 年入党，此后在陕北组织农民抗租抗捐、在国民党军中做兵运。1933 年 8 月任陕甘边红军临时总指挥部政治委员，后任红二十六军第四十二师政委；1935 年陕北肃反中与刘志丹、习仲勋等被捕，中央红军到达陕北后获释。抗战中留守陕北，任陕甘宁边区保安司令、边区参议会议长，1941 年 5 月任中共西北中央局书记，1945 年 6 月当选政治局委员。
      cites: [zhwiki-gao-gang]
    - h: “东北王”
      from: 1945-10
      to: 1952-10
      text: |
        1945 年 10 月下旬与张闻天等飞赴东北，1946 年 6 月任东北局副书记，主持后方和土地改革。辽沈战役后林彪、罗荣桓率军入关，他留在东北，先后任东北局第一书记、东北人民政府主席、东北军区司令员兼政委，维基百科称他是当时六个大区里唯一一个身兼党、政、军三职的人。1949 年 9 月当选中央人民政府副主席。朝鲜战争中负责志愿军的后勤保障，三次入朝与彭德怀商议；东北率先开展的“三反”经验被推向全国。
      cites: [zhwiki-gao-gang]
    - h: 高饶事件
      from: 1952-11
      to: 1955-03-31
      text: |
        1952 年底调中央任国家计划委员会主席。按 1955 年全国代表会议的决议，他“从一九四九年起”就以夺取党和国家领导权力为目的进行阴谋活动，把东北“当成为高岗的独立王国”；到中央后鼓吹党分为“根据地和军队的党”和“白区的党”两个，认为自己应当担任“党中央的总书记或副主席，并担任国务院总理”。1954 年 2 月七届四中全会揭发后，他“以自杀来表示他对党的最后背叛”。维基百科记他 2 月 17 日开枪自杀未遂，8 月初又试图触电自杀，8 月 17 日服大量安眠药身亡。1955 年 3 月 31 日全国代表会议开除他的党籍。
      cites: [ws-1955-03-31-gao-rao-resolution, zhwiki-gao-gang]
    - h: 身后
      from: 1955-04
      text: |
        葬于北京万安公墓。1966 年 5 月文革开始时，他的墓碑被砸去半截。1981 年《历史决议》仍称他和饶漱石是阴谋分裂党、篡夺最高权力的“野心家”。2011 年陕西人民出版社出版戴茂林、赵晓光的《高岗传》，是中国境内第一部公开出版的高岗传记。
      cites: [zhwiki-gao-gang, ws-1981-resolution]
  assess:
