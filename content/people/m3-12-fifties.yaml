    - { date: 1966-08, s: attacked, note: 受到严重冲击（此前数据作红卫兵抄家批斗）（维基百科，未核原件）, cite: zhwiki-huang-shaohong }
    - { date: 1966-08-31, s: dead, note: 自杀（维基百科，未核原件）, cite: zhwiki-huang-shaohong }
