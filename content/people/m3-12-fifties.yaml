  bio: 安徽桐城人，早年留学德国，参加南昌起义，后随邓演达创建第三党（后来的农工民主党），抗战中参与发起民盟。建国后任交通部长、农工党主席、民盟副主席、《光明日报》社长。1957 年鸣放中主张“轮流坐庄”、“政治设计院”，被定为“章罗同盟”首领、头号右派，1958 年撤去各项职务。1969 年病逝。1980 年复查时中央统战部认为他“并非错划，不应改正”，至今未改正。
  life:
    - h: 第三党与民盟
      from: 1895
      to: 1956
      text: |
        1895 年生于安徽桐城，留学德国，1920 年代参加北伐和南昌起义，1930 年起与邓演达等组建中华革命党（第三党），1947 年改称中国农工民主党，他任主席；1941 年参与发起中国民主政团同盟。建国后任中央人民政府委员、交通部长。
      verify: true
    - h: 头号右派
      from: 1956
      to: 1969-05-17
      text: |
        按 1980 年中央统战部的复查报告，他 1956 年说中国是“一个上帝，九百万清教徒，统治着五亿农民，非造反不可”，主张“有在朝党和在野党，你不行我来，我不行你来”，要“轮流坐庄”；1957 年又说“共产党以前扶植各民主党派，是‘周公辅成王’，现在成王长大成人了，周公要还政”。1957 年 7 月《人民日报》社论点名“章罗同盟”，他被划为右派。1958 年 1 月全国人大常委会认定他已丧失继续执行人大代表职务的合法根据，2 月撤销交通部长职务。1969 年 5 月 17 日在北京病逝。
      cites: [ws-1980-ufwd-rightist-review, ws-1958-npc-rightists-removal]
  assess:
