    - { date: 1955-01, s: attacked, note: 公开批判, verify: true }
    - { date: 1955-05-17, s: detained, note: 被捕，1965 年判刑, verify: true }
    - { date: 1979-01, s: restored, note: 获释, verify: true }
    - { date: 1980-09-29, s: restored, note: 中央通知平反, cite: cpc-1980-09-29-hu-feng-rehab }
    - { date: 1985-06-08, s: dead, note: 病逝, cite: cpc-1980-09-29-hu-feng-rehab, verify: true }
  rehab:
    - { date: 1980-09-29, text: 中共中央批转复查报告，宣布“胡风反革命集团”案是错案，予以平反, cite: cpc-1980-09-29-hu-feng-rehab }
    - { date: 1988-06-18, text: 中办补充通知，取消对其文艺思想和宗派活动的指责, cite: cpc-1980-09-29-hu-feng-rehab }
