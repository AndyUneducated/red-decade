  bio: 江西临川人，抗战时期任新四军政治委员、华中局书记，1949 年后任华东局第一书记、华东军政委员会主席。1953 年调任中央组织部部长，与高岗结盟反对刘少奇、周恩来。1955 年 3 月被开除党籍，同年 4 月被捕，1965 年以“反革命罪”判处有期徒刑十四年，1975 年 3 月死于辽宁的劳改农场。
  life:
    - h: 青年团、工会与海外
      from: 1903
      to: 1939-10
      text: |
        1903 年生于江西临川，1922 年入上海大学，1923 年入社会主义青年团，1925 年转入共产党，1927 年参加上海工人武装起义。1929 年调东北任团满洲省委书记、代理中共满洲省委书记，1930 年被捕（维基百科说建国后已查清狱中没有叛变），1931 年出狱赴苏联。1932 年回上海做工会工作，1935 年再赴苏联任全总驻赤色职工国际代表，1936 年起被派往美国、法国做华侨工作。
      cites: [zhwiki-rao-shushi]
    - h: 新四军与华东
      from: 1939-11
      to: 1951
      text: |
        1939 年 11 月从美国回国，任东南局副书记。1941 年 1 月皖南事变中项英离队，他与叶挺以东南局名义致电中央，提议撤项英职、由他在政治上负责，中央复电肯定。此后任华中局副书记兼新四军政治部主任，1942 年 3 月接替刘少奇任华中局代理书记、新四军代理政委。抗战胜利后随新四军主力到山东，任华东局书记、新四军兼山东军区政委。建国后任华东局第一书记兼上海市委第一书记、华东军政委员会主席。
      cites: [zhwiki-rao-shushi]
    - h: 组织部长与开除党籍
      from: 1952
      to: 1975-03-02
      text: |
        1952 年调北京任中央组织部部长（此前数据作 1953 年）。按 1955 年全国代表会议决议，他是“高岗反党阴谋活动的主要同盟者”，“利用他的 中央组织部部长有职务发动以反对中央领导同志为目的的斗争”（原文如此）；决议还说他在华东“违抗中央镇压反革命的政策而竭力保护反革命分子”，“从党的七届四中全会到现在，饶漱石从无悔改之意”。1955 年 3 月 31 日被开除党籍，4 月以“饶漱石、潘汉年、扬帆反革命集团头子”的罪名被捕。1965 年 8 月最高人民法院判处他有期徒刑十四年，判决书说他包庇了扬帆和胡均鹤；9 月 23 日假释，文革开始后 1967 年重新收监，1975 年 3 月 2 日病死于监狱（此前数据作死于辽宁的劳改农场）。
      cites: [ws-1955-03-31-gao-rao-resolution, zhwiki-rao-shushi]
    - h: 身后
      from: 1986-08
      text: |
        1986 年 8 月出版的《毛泽东著作选读》注释写道，他任华东局第一书记兼上海市委第一书记时直接领导潘汉年等的反特工作，由于潘汉年被错定为“内奸分子”，他主持反特工作中的一些活动被错定为内奸活动，“他因此被认定犯有反革命罪并被判刑”。
      cites: [zhwiki-rao-shushi]
  assess:
    - { voice: official1966, text: 饶漱石是高岗反党阴谋活动的主要同盟者（1955 年全国代表会议决议）, cite: ws-1955-03-31-gao-rao-resolution, quote: true }
    - { voice: editor, text: 1955 年决议说高饶“始终没有在任何党的组织或任何党的会议上或公众中公开提出过任何反对党中央的纲领”。饶漱石此后没有公开受审，1965 年的判决书未见公布；1986 年《毛泽东著作选读》的注释承认他的反特工作被错定为内奸活动，但中央至今没有为他正式平反。, cite: ws-1955-03-31-gao-rao-resolution }
