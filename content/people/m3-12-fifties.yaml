      from: 1945
      to: 1956
      text: |
        1945 年与黄炎培、胡厥文等发起民主建国会。1949 年 2 月到北平，参加新政协筹备，任《共同纲领》第三起草小组召集人，负责经济部分；建国后任政务院政务委员。1952 年 8 月任新设的粮食部部长，参与制定粮食统购统销政策；毛泽东嫌“征购”“配售”的说法不好听，他提议改称“计划收购”“计划供应”，简称“统购统销”。
      cites: [zhwiki-zhang-naiqi]
    - h: 右派
      from: 1957
      to: 1966-05
      text: |
        1957 年整风中，他 4 月 15 日在民建的座谈会上说“不要神化任何个人”，“没有哪个人是神，包括毛主席在内”，5 月在《人民日报》发文批评“以党代政”，这些后来都成了罪名。6 月反右开始后他成为“极右派”、“右派头子”。1958 年 1 月全国人大常委会认定他已丧失继续执行人大代表职务的合法根据，1 月 31 日撤销粮食部部长职务，工资由行政四级降为十级。他始终不承认自己是右派，1960 年质疑“大跃进”，1962 年又连续发言批评反右和“大跃进”违反宪法和经济规律。
      cites: [ws-1958-npc-rightists-removal, zhwiki-zhang-naiqi]
