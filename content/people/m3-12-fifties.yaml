    - h: 《观察》
      from: 1946
      to: 1957-03
      text: |
        1946 年创办《观察》，任社长和主编，宗旨是“代表一般自由思想分子”，对国民党和共产党都有批评，同时任复旦大学政治系教授。1948 年 11 月《观察》刊出军事通讯《徐淮战局的变幻》，蒋介石说军事机密被泄露，12 月 25 日杂志被查封、工作人员被捕。1949 年他参加民主人士东北参观团，11 月《观察》复刊，1950 年终刊后任新华书店副总经理，1952 年任出版总署发行局副局长，加入九三学社，1954 年当选全国人大代表。
      cites: [zhwiki-chu-anping]
    - h: “党天下”
      from: 1957-04
      to: 1966-05
      text: |
        1957 年 4 月 1 日经胡乔木推荐任《光明日报》总编辑。6 月 1 日在中央统战部召开的座谈会上发言，以“向毛主席和周总理提些意见”为题，批评“党天下”的思想是一切宗派主义现象的根源。1980 年中央统战部报告的说法是，他“把我们党在国家政治生活中的领导地位攻击为‘党天下’”。6 月 8 日《人民日报》社论《这是为什么？》发表，揭发批判随之而来，他被划为右派。11 月 11 日与《光明日报》社长章伯钧同时被免职（此前数据作 6 月辞职）；1958 年 1 月九三学社撤销他的中央委员等职，全国人大常委会认定他已丧失继续执行人大代表职务的合法根据。此后只在商务印书馆做不署名的校译，1960 年被下放到全国政协劳动基地改造一年。
