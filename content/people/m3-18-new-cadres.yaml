  cites: [rmrb-1973-08-10-zhang-tiesheng]

- id: huang-shuai
  name: 黄帅
  died: 2017-12-10
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 北京儿童（1973 年为中关村第一小学五年级学生）
  pinyin: Huáng Shuài
  gender: f
  birthplace: 北京
  bio: 北京海淀区中关村第一小学五年级学生。1973 年秋因日记里给班主任提意见与老师冲突，10 月 21 日署名给报社写信。12 月 12 日《北京日报》以《一个小学生的来信和日记摘抄》发表，12 月 28 日《人民日报》头版转载并加编者按，称她“敢于向修正主义教育路线的流毒开火”，全国中小学随即掀起“破师道尊严”运动。1978 年 5 月《人民日报》发文说来信是家长授意写成的“政治骗局”，同时说“小学生是无辜的，是受害者”。2017 年在北京去世。
  life:
    - h: 来信
      from: 1973-09
      to: 1973-12-28
      text: |
        来信说：“我是中关村第一小学五年级二班的学生。九月听了红卫兵节目报道的兰州十四中学红卫兵帮助老师的事迹，受到启发，随后我给老师写了三篇日记提意见。”信的结尾是：“究竟我犯了啥严重错误？难道还要我们毛泽东时代的青少年再做旧教育制度‘师道尊严’奴役下的奴隶吗？”《北京日报》编者按称她是“十二岁的小学生”，“以反潮流的革命精神，提出了教育革命中的一个大问题”。
      cites: [rmrb-1973-12-28-huang-shuai]
    - h: “破师道尊严”
      from: 1973-12-28
      to: 1976-10
      text: |
        转载之后，全国学校大批“师道尊严”。1978 年《人民日报》说，“就拿北京为例，短短几个月内，仅学校的玻璃，就被砸碎二十多万平方米”；她本人被请去写文章、作报告、上银幕。
      cites: [rmrb-1978-05-21-huang-shuai-exposed]
    - h: “政治骗局”
      from: 1976-10
      to: 2017-12-10
      text: |
        1978 年 5 月 21 日《人民日报》称，看过她的全部日记并调查核实后认定，“‘小学生的来信’，实际是‘小学生家长的来信’”：家长 10 月 18 日给学校写了长信，19 日到区教育局听到“师道尊严”一词，20 日这个词第一次出现在她的日记里，21 日的信“一式几份”寄给四家报刊。文章同时说，“其实，在这个事件中，小学生是无辜的，是受害者”。此后她上中学、上大学，后来在北京工业大学出版社当编辑，2017 年 12 月 10 日因癌症在北京去世。
      verify: true
      cites: [rmrb-1978-05-21-huang-shuai-exposed]
  assess:
    - { voice: doc, text: 究竟我犯了啥严重错误？难道还要我们毛泽东时代的青少年再做旧教育制度“师道尊严”奴役下的奴隶吗？（黄帅署名来信，1973 年 10 月 21 日）, cite: rmrb-1973-12-28-huang-shuai, quote: true }
    - { voice: official1966, text: 黄帅敢于向修正主义教育路线的流毒开火，生动地反映出毛泽东思想哺育的新一代的革命精神面貌。（《人民日报》1973 年编者按）, cite: rmrb-1973-12-28-huang-shuai, quote: true }
    - { voice: officialLater, text: 所谓《一个小学生的来信和日记摘抄》，完全是适应“四人帮”篡党夺权的反革命政治需要，蓄意编造出来的，是一个政治骗局。（《人民日报》1978 年）, cite: rmrb-1978-05-21-huang-shuai-exposed, quote: true }
    - { voice: editor, text: 1978 年的文章说来信结尾那句话出自家长；两份《人民日报》文本都把她当作别人手中的工具，一次是“革命小将”，一次是“受害者”。, cite: rmrb-1978-05-21-huang-shuai-exposed }
  factions: [rebels]
  fate:
    - { date: 1973-12-12, s: rise, note: 《北京日报》发表来信和日记, cite: rmrb-1973-12-28-huang-shuai }
    - { date: 1978-05-21, s: sidelined, note: 《人民日报》称来信是“政治骗局”, cite: rmrb-1978-05-21-huang-shuai-exposed }
  cites: [rmrb-1973-12-28-huang-shuai, rmrb-1978-05-21-huang-shuai-exposed]

- id: li-qinglin
  name: 李庆霖
  died: 2004-02-19
  deathKind: natural
  deathPlace: 福建莆田
  tier: 3
  role1966: 福建莆田县城郊公社下林小学教师
  pinyin: Lǐ Qìnglín
  gender: m
  bio: 福建莆田县城郊公社下林小学教师。儿子 1969 年下乡后口粮、生活费没有着落，他多次上访无果，1972 年 12 月 20 日写信给毛泽东。1973 年 4 月 25 日毛泽东复信并寄去三百元，6 月中共中央把来信和复信印发全国，连同五月中央工作会议拟定的《关于当前知识青年下乡工作中几个问题的解决意见》一起学习，调整知青政策。他随即升任县知青办副主任、四届人大常委、国务院知青领导小组成员。1976 年 11 月被隔离审查，1977 年被捕，后以现行反革命罪判处无期徒刑，1994 年提前出狱。2004 年在莆田去世。
  life:
    - h: 告御状
      from: 1969
      to: 1973-06-10
      text: |
        儿子李良模 1969 年到荻芦公社插队，口粮和生活费“仅发了11个月就停了”。他走上上访之路，“几次上访未果，李庆霖决定斗胆上书‘告御状’”，1972 年 12 月 20 日写了两千多字的信。信经王海容转交到毛泽东手中。1973 年 4 月 25 日毛泽东复信：“李庆霖同志，寄上三百元，聊补无米之炊。全国此类事甚多，容当统筹解决。”6 月 10 日中共中央通知把复信和来信“印发至公社、街道以上各级党委，并传达到上山下乡知识青年和广大群众”。
      cites: [jwb-2007-li-qinglin, ws-1973-06-10-li-qinglin-notice]
    - h: 平步青云
      from: 1973-06-10
      to: 1976-10
      text: |
        此后他从小学革命领导小组副组长升为县知青办副主任、县革委会教育组副组长，1974 年任福建省高考招生办公室副组长，1975 年当选四届人大常委，1976 年 6 月成为国务院知青工作领导小组成员。1973 年 11 月他在《红旗》上发表《谈反潮流》，1976 年春在莆田地委干部大会上与造反派一起占据主席台，指责地委书记执行“右倾翻案风路线”。
      cites: [jwb-2007-li-qinglin]
    - h: 无期徒刑
      from: 1976-11
      to: 2004-02-19
      text: |
        1976 年 11 月被隔离审查，1977 年 11 月 1 日正式逮捕，一年多以后莆田地区中级人民法院以现行反革命罪判处无期徒刑，剥夺政治权利终身。1994 年 3 月提前出狱，靠每月 210 元困难救济生活，2004 年 2 月 19 日去世。墓碑上刻着毛泽东的那封复信。
      cites: [jwb-2007-li-qinglin]
  assess:
    - { voice: doc, text: 李庆霖同志，寄上三百元，聊补无米之炊。全国此类事甚多，容当统筹解决。（毛泽东复信，1973 年 4 月 25 日）, cite: jwb-2007-li-qinglin, quote: true }
    - { voice: official1966, text: 伟大领袖毛主席一九七三年四月二十五日对李庆霖同志的来信作了重要答复。（中共中央 1973 年 6 月 10 日通知）, cite: ws-1973-06-10-li-qinglin-notice, quote: true }
    - { voice: editor, text: 中央通知印发了他的信，四年后他以现行反革命罪被判无期；《名人传记》的叙述只说他被视为“四人帮”的“小爬虫”，判决书本身未见公开。, cite: jwb-2007-li-qinglin }
  factions: [rebels]
  fate:
    - { date: 1973-04-25, s: rise, note: 毛泽东复信, cite: jwb-2007-li-qinglin }
    - { date: 1975-01, s: rise, note: 四届人大常委, cite: jwb-2007-li-qinglin }
    - { date: 1976-11, s: detained, note: 隔离审查, cite: jwb-2007-li-qinglin }
    - { date: 1977-11-01, s: detained, note: 正式逮捕，后判无期徒刑, cite: jwb-2007-li-qinglin }
    - { date: 1994-03, s: sidelined, note: 提前出狱, cite: jwb-2007-li-qinglin }
  cites: [jwb-2007-li-qinglin, ws-1973-06-10-li-qinglin-notice]
