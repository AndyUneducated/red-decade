- id: zhang-tiesheng
  name: 张铁生
  born: 1950
  tier: 3
  role1966: 辽宁城市中学生
  pinyin: Zhāng Tiěshēng
  gender: m
  bio: 1968 年下乡的知识青年，辽宁兴城县白塔公社枣山大队第四生产队队长。1973 年大学招生考试时在物理化学试卷背面写信，说自己忙于夏锄无暇复习，不愿“胡答一气”。《辽宁日报》7 月 19 日以《一份发人深省的答卷》发表，《人民日报》8 月 10 日转载，他被称为“白卷英雄”，当年的文化考试随之作废。后入铁岭农学院，1975 年当选四届人大常委。1976 年后被捕，1983 年判处有期徒刑十五年。
  life:
    - h: 答卷
      from: 1968
      to: 1973-08-10
      text: |
        《辽宁日报》编者按介绍：“张铁生同志是一九六八年的下乡知识青年，共青团员，现任兴城县白塔公社枣山大队第四生产队队长。”信里说：“每天近十八个小时的繁重劳动和工作，不允许我搞业务复习”，“对于那些多年来不务正业、逍遥浪荡的书呆子们，我是不服气的，而有着极大的反感，考试被他们这群大学迷给垄断了”。信末署“白塔公社考生 张铁生”，日期是一九七三年六月三十日。《人民日报》编者按说这封信“提出了教育战线上两条路线、两种思想斗争中的一个重要问题，确实发人深思”。
      cites: [rmrb-1973-08-10-zhang-tiesheng]
    - h: 从典型到囚犯
      from: 1973-08-10
      to: 1991
      text: |
        1973 年他被铁岭农学院录取，此后多次在各地作报告，1975 年当选第四届全国人大常委会委员。1976 年 10 月后被隔离审查，1983 年以反革命罪被判处有期徒刑十五年，1991 年刑满释放，后在企业工作。
      verify: true
  assess:
    - { voice: doc, text: 所以自己愿意遵守纪律，坚持始终，老老实实地退场。（张铁生 1973 年 6 月 30 日）, cite: rmrb-1973-08-10-zhang-tiesheng, quote: true }
    - { voice: official1966, text: 他对物理化学这门课的考试，似乎交了“白卷”，然而对整个大学招生的路线问题，却交了一份颇有见解，发人深省的答卷。（《辽宁日报》编者按，《人民日报》1973 年 8 月 10 日转载）, cite: rmrb-1973-08-10-zhang-tiesheng, quote: true }
    - { voice: editor, text: “白卷”一词出自编者按里的“似乎交了‘白卷’”；信本身写在理化试卷背面，说的是没有时间复习。, cite: rmrb-1973-08-10-zhang-tiesheng }
  factions: [rebels]
  fate:
    - { date: 1973-08-10, s: rise, note: 《人民日报》转载他的信, cite: rmrb-1973-08-10-zhang-tiesheng }
