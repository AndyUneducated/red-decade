  life:
    - h: 钳工与钻头
      from: 1933-05
      to: 1973-04
      text: |
        1950 年在上海当学徒，1953 年 6 月到国营六一八厂（北京永定机械厂）当钳工，1958 年入党。“早年在工厂工作时发明了三尖七刃麻花钻，大大提高了钻头的使用性能和寿命，在国内外引起重大反响，被称为‘倪志福钻头’。”1959 年出席全国群英会，1965 年获国家科委发明证书；1965 年至 1973 年历任副总工程师、总工程师。
