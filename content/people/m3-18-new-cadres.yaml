- id: zhuang-zedong
  name: 庄则栋
  born: 1940
  died: 2013-02-10
  deathKind: natural
  deathPlace: 北京
  tier: 2
  role1966: 中国乒乓球队主力队员
  pinyin: Zhuāng Zédòng
  gender: m
  birthplace: 江苏扬州
  positions:
    - { title: 主任, orgName: 国家体育运动委员会, from: 1975-01-17, to: 1976-10, cite: rmrb-1975-01-19-state-council-list }
  bio: 江苏扬州人，1961、1963、1965 年三次获得世乒赛男单冠军。1971 年名古屋世乒赛期间与美国选手科恩的接触促成美国乒乓球队访华，即“乒乓外交”。1975 年 1 月任国家体委主任。1976 年 10 月后被隔离审查，多年后才恢复自由，1980 年代中期起在北京市少年宫任教。2013 年在北京去世。
  life:
    - h: 三连冠
      from: 1940
      to: 1966
      text: |
        1957 年入选北京市乒乓球队，1961 年成为国家队主力，在第 26、27、28 届世乒赛上三次获得男子单打冠军，是中国第一个世乒赛男单“三连冠”。他的名气大到林彪 1966 年 5 月 18 日在政治局扩大会议上讲毛泽东是天才时，也拿他作比：“打乒乓球，你懂得了规则，你也打不过庄则栋、徐寅生。”
      cites: [xinhua-2013-zhuang-zedong, ws-1966-05-18-lin-speech]
    - h: 乒乓外交与体委主任
      from: 1971-04
      to: 1976-10
      text: |
        1971 年名古屋世乒赛期间，“面对‘搭错车’的美国乒乓球运动员科恩的一个不经意的友好举动，开启了一段‘乒乓外交’的佳话”。1972 年他率中国乒乓球代表团回访美国，受到尼克松接见。1975 年 1 月四届人大任命他为国家体育运动委员会主任。
      cites: [xinhua-2013-zhuang-zedong, rmrb-1975-01-19-state-council-list]
    - h: 审查以后
      from: 1976-10
      to: 2013-02-10
      text: |
        1976 年 10 月后因与江青的关系被隔离审查，数年后才获释，下放到地方工作。1980 年代中期起在北京市少年宫教乒乓球，1987 年与日本人佐佐木敦子结婚。2013 年 2 月 10 日在北京去世。
      verify: true
      cites: [xinhua-2013-zhuang-zedong]
  assess:
