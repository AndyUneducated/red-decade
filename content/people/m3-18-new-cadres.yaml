# M3 people round 2, batch 18: 1970 年代被提拔或被树立的新人与“典型”。毛远新、王海容（毛泽东身边），
# 吴桂贤、倪志福、孙健、李素文（工人、劳模出身的中央领导），庄则栋（乒乓外交），张铁生、黄帅、李庆霖（报刊树立的“反潮流”典型）。
# Texts: 1975 年国务院、人大常委会名单，1977 年十届三中全会公报，1980 年起诉书，1982 年迟群案判决，
# 张铁生信、黄帅来信（人民日报 1973）、1978 年《揭穿一个政治骗局》，中发〔1973〕21 号，新华社讣告与生平，家属所撰生平。
# 在世人物（毛远新、张铁生）只写公开经历和公开文本。

