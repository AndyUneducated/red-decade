- id: yang-xianzhen
  name: 杨献珍
  born: 1896-07-29
  died: 1992-08-25
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 中央党校原校长，1964 年因“合二而一”受批判
  pinyin: Yáng Xiànzhēn
  gender: m
  birthplace: 湖北郧县
  party: 中国共产党
  positions:
    - { title: 校长, orgName: 中共中央党校, from: 1955, to: 1961, verify: true }
  bio: 湖北郧县人，1926 年入党，1931 年在北平被捕，1936 年与薄一波等人按中央同意的手续出狱（即后来的“六十一人案”）。建国后任马列学院副院长，1955 年起任中央高级党校校长。1950 年代提出“综合经济基础论”、主张“思维与存在的同一性”有限度，1964 年因宣讲“合二而一”被康生、陈伯达组织全国批判，撤销职务。文革中被定为“叛徒”，关押八年，1975 年下放陕西。1978 年后平反，1992 年病逝。
  life:
    - h: 草岚子监狱与马列学院
      from: 1896-07-29
      to: 1954
      text: |
        1896 年生于湖北郧县，1926 年入党，1931 年在北平被捕，关在草岚子监狱。1936 年经中央同意，与薄一波、安子文等人履行登报“反共启事”手续出狱，文革中这批人被定为“六十一人叛徒集团”。抗战中在太行区和北方局做理论工作，1948 年起任马列学院（后改高级党校）副院长。
      verify: true
    - h: “合二而一”
      from: 1955
      to: 1966-05
      text: |
        1955 年起任中央高级党校校长。1971 年批判他的文章说，1952 年他提出“综合经济基础论”，1958 年又讲要“利用矛盾的同一性”。1964 年党校教员艾恒武、林青山在《光明日报》发表《“一分为二”与“合二而一”》，主张对立面也有统一；康生、陈伯达把这篇文章与杨献珍挂钩，发动全国报刊批判，把它说成与毛泽东“一分为二”唱对台戏的“阶级调和论”。他随即被撤去党校的领导职务。
        1971 年中央党校写作组的批判文章说，“一九六四年，叛徒、内奸、工贼刘少奇指使他在哲学界的代理人、叛徒杨献珍挑起了一场关于一分为二和‘合二而一’的激烈论战”，“合二而一”这个词是他从“明代封建文人方以智的《东西均》一书中找到的”。
      verify: true
      cites: [ws-1971-03-29-heer-reactionary, ws-1971-01-09-philosophy-struggle]
    - h: 关押与平反
      from: 1966-06
      to: 1992-08-25
      text: |
        文革中他作为“六十一人叛徒集团”成员被关押，1975 年获释后被下放到陕西潼关。1978 年中央为“六十一人案”平反，他回到北京，1980 年起诉书把他列入“被诬陷的中共中央委员、候补中央委员”。此后任中央党校顾问、全国政协常委，1992 年 8 月 25 日在北京病逝。
      verify: true
      cites: [ws-1980-indictment]
  assess:
    - { voice: official1966, text: 一九六四年，叛徒、内奸、工贼刘少奇指使他在哲学界的代理人、叛徒杨献珍挑起了一场关于一分为二和“合二而一”的激烈论战（1971 年《红旗》中央党校写作组文章）, cite: ws-1971-03-29-heer-reactionary, quote: true }
    - { voice: official1966, text: 叛徒杨献珍一伙散布过种种流言，说什么这是“与政治无关的学术争论”（1971 年《人民日报》中央党校写作组文章）, cite: ws-1971-01-09-philosophy-struggle, quote: true }
    - { voice: editor, text: 这两篇 1971 年的批判文章署名“中央党校革命大批判写作组”——批判他的，是他当过校长的那所学校；而党校本身 1966 年起已经停办。, cite: ws-1971-01-09-philosophy-struggle }
  factions: [academics]
  fate:
