  bio: 湖南湘潭人，1936 年入党，抗战初期任毛泽东的秘书。建国后任湖南省委书记、第一书记，1958 年大跃进中对浮夸和高征购有所保留。1959 年庐山会议上同情彭德怀的意见，八届八中全会把他定为“以彭德怀为首的反党集团”成员，撤去省委第一书记职务。1962 年后在广州任中南局委员、中国科学院中南分院副院长。文革初被批斗，1966 年 12 月 26 日在广州自杀。1979 年平反。
  life:
    - h: 毛泽东的秘书与湖南省委
      from: 1912-02-11
      to: 1959-06
      text: |
        1912 年生于湖南湘潭，在北平读书时参加学生运动，1936 年入党。抗战初期到延安，任毛泽东的秘书，曾受派与国民党谈判；此后在晋察冀工作。建国后回湖南，1953 年起主持省委工作。大跃进中湖南没有像河南、四川那样大放“卫星”，他对高指标、高征购持保留态度。
      verify: true
    - h: 庐山会议
      from: 1959-07
      to: 1966-05
      text: |
        1959 年 7 月庐山会议期间，他在小组会和私下谈话中赞同彭德怀的意见，并与黄克诚、李锐等私下议论毛泽东的作风。八届八中全会决议把“彭德怀、黄克诚、张闻天、周小舟等”定为“右倾机会主义反党集团”，认为把他们“调离国防、外交、省委第一书记等工作岗位是完全必要的”。此后他被撤去湖南省委第一书记，下放到人民公社劳动；1962 年七千人大会后部分恢复，调广州任中南局委员、中国科学院中南分院副院长。
      verify: true
      cites: [ws-1959-08-16-peng-resolution]
    - h: 自杀
      from: 1966-06
      to: 1966-12-26
      text: |
