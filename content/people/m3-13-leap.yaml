  bio: 福建龙岩人，1926 年入党，闽西根据地创建人之一。建国后任中南局第三书记，1953 年起任中央农村工作部部长、国务院副总理，主管农业合作化。1955 年主张合作化稳步发展、砍掉一批办不好的合作社，被毛泽东批为“小脚女人”。1962 年春支持安徽“责任田”和包产到户，被批为“单干风”，农村工作部随即撤销。1965 年任全国政协副主席，文革中受批判，1972 年 12 月 10 日病逝。1981 年决议肯定他“提出了农业中要实行生产责任制的观点”。
  life:
    - h: 闽西与中南
      from: 1896-08-17
