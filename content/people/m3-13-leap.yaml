- id: sun-yefang
  name: 孙冶方
  born: 1908-10-24
  died: 1983-02-22
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 中国科学院经济研究所所长，已被批为“修正主义”
  pinyin: Sūn Yěfāng
  gender: m
  birthplace: 江苏无锡
  party: 中国共产党
  positions:
    - { title: 副局长, orgName: 国家统计局, from: 1955, to: 1957, verify: true }
    - { title: 所长, orgName: 中国科学院经济研究所, from: 1957, to: 1968, verify: true }
  bio: 江苏无锡人，经济学家，1924 年入党，留学莫斯科中山大学。1957 年起任中国科学院经济研究所所长，主张社会主义经济也要讲价值规律、以利润作为考核企业的综合指标。1964 年被康生、陈伯达点名为“中国的利别尔曼”，受批判、下放；1968 年 4 月被捕，关押在秦城监狱七年。1975 年获释，1977 年恢复名誉，晚年继续写作《社会主义经济论》，1983 年 2 月 22 日病逝。
  life:
    - h: 莫斯科、华中与统计局
      from: 1908-10-24
      to: 1956
      text: |
        1908 年生于江苏无锡，1924 年入党，次年赴莫斯科中山大学学习，回国后在上海从事左翼经济研究。1970 年的批判文章说，四十年代初刘少奇任华中党校校长时，“孙冶方就是当时的教育科长”，刘少奇“在一封题为《答宋亮》的黑信里，疯狂地反对毛泽东思想。这个宋亮，就是孙冶方”。建国后在华东和国家统计局工作，1955 年任统计局副局长。
      verify: true
      cites: [ws-1970-02-24-sun-yefang-critique]
    - h: 价值规律与“利润挂帅”
      from: 1957
      to: 1968-03
      text: |
        1957 年起任经济研究所所长，大跃进前后发表《把计划和统计放在价值规律的基础上》等文章，主张用利润作为考核企业的主要综合指标。1964 年康生、陈伯达在经济所派工作组，把他定为“中国的利别尔曼”和“修正主义者”。1970 年的批判文章把他的主张概括为“五把杀人不见血的软刀子”，引他的话说：“利润是考核企业的最重要综合指标，只要掌握了利润，就象牵着牛鼻子，牛腿（其它指标）自然就跟着跑。”
      verify: true
      cites: [ws-1970-02-24-sun-yefang-critique]
    - h: 秦城七年
      from: 1968-04
      to: 1983-02-22
      text: |
        1968 年 4 月他被捕，关押在秦城监狱。1970 年 2 月《人民日报》的批判文章说：“孙冶方，人，打倒了；权，被夺了；政治上的罪行，正在清算。”他在狱中没有纸笔，靠默记反复构思《社会主义经济论》。1975 年 4 月获释，1977 年恢复名誉，任经济研究所顾问，1983 年 2 月 22 日在北京病逝。
      verify: true
      cites: [ws-1970-02-24-sun-yefang-critique]
  assess:
    - { voice: official1966, text: 反革命分子孙冶方，是叛徒、内奸、工贼刘少奇在经济学界的一个代表，是刘少奇反革命修正主义经济路线的一个代言人（1970 年《人民日报》批判文章）, cite: ws-1970-02-24-sun-yefang-critique, quote: true }
    - { voice: editor, text: 1970 年的文章署名是北京针织总厂的工人批判组与纺织工业部写作小组，在批判“利润挂帅”的同时又说“那种不要经济核算，否定为社会主义理财，连成本计算和利润指标也不要了的观点和做法，是错误的”。, cite: ws-1970-02-24-sun-yefang-critique }
  factions: [academics]
  fate:
    - { date: 1957, s: normal, note: 经济研究所所长, verify: true }
    - { date: 1964, s: attacked, note: 被批“中国的利别尔曼”（维基百科，未核原件）, cite: zhwiki-sun-yefang }
    - { date: 1968-04, s: detained, note: 被捕，关押秦城, verify: true }
    - { date: 1970-02-24, s: detained, note: 《人民日报》点名批判, cite: ws-1970-02-24-sun-yefang-critique }
    - { date: 1975-04, s: restored, note: 获释, verify: true }
    - { date: 1983-02-22, s: dead, note: 病逝（维基百科，未核原件）, cite: zhwiki-sun-yefang }
  cites: [ws-1970-02-24-sun-yefang-critique]
