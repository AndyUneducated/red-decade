- id: lu-xianwen
  name: 路宪文
  tier: 3
  role1966: 1960 年撤职，1962 年开除党籍
  pinyin: Lù Xiànwén
  gender: m
  birthplace: 山西陵川
  party: 中国共产党
  positions:
    - { title: 第一书记, orgName: 中共信阳地委, from: 1958-11, to: 1960-09-20, verify: true }
  bio: 山西陵川人，1937 年入党，抗战时期在太行根据地做地方工作，南下后在河南信阳历任副专员、地委书记，1958 年 11 月任信阳地委第一书记。1959 年秋起在全区推行“反瞒产”，挤光农民口粮、禁止外流，酿成“信阳事件”。地委 1962 年的处分决定说“全区死亡百余万人，占全区人口总数的百分之十三”。1960 年 9 月被撤职查办，1962 年 7 月被开除党籍并被建议判刑。
  life:
    - h: 从太行到信阳
      from: 1937-09
      to: 1959-09
      text: |
        按 1962 年的处分决定，他 1937 年 9 月参加工作、同年 12 月入党，“历任县‘牺盟会’协助员、县委宣传部长、分区武工队副政委、县长、县委书记、副专员、信阳地委第一书记等职”。1959 年 9 月河南省三级干部会上，他亲自主持小组会斗争平舆县委书记处书记兼县长曹铭的“右倾”，会上发生推打，决定把这次斗争会称为全区违法乱纪的“开端”。
      cites: [ws-1962-07-10-lu-xianwen-punishment]
    - h: 反瞒产与饿死人
      from: 1959-10
      to: 1960-09
      text: |
        1959 年 10 月全区已出现“粮食征购透底、食堂停伙现象，部分地区已开始死人”。他派工作组到鸡公山“硬顶”，推广鸡公山反瞒产“假现场会”、确山万人反瞒产大会和罗山集中五类分子反瞒产的经验，各县“先后召开了假现场会474次，挤光了群众的口粮”。对打人成风，他说：“群众运动总是要死些人的”。决定说全区“被打致死群众达六万七千余人”。
        他同时掩盖真相：叫人砍掉被剥了皮的榆树、扒掉倒塌的房子、掩埋路边死尸，追查匿名写信反映情况的教师和干部。1960 年 4 月地委向省委的报告只报 1959 年 11 月以来“死亡 71658人（包括正常死亡在内），占总人口的 0.85%”，并把原因归于“自然灾害的袭击”和浮肿病、紫疳病等疫病。
      cites: [ws-1962-07-10-lu-xianwen-punishment, ws-1960-04-04-xinyang-deaths-report]
    - h: 撤职与开除党籍
      from: 1960-09-20
      to: 1962-07-10
      text: |
        1960 年 9 月他被撤职查办，同年冬中央和河南省委派人整风整社，原地委书记处书记王达夫、延炳玉等人随后被停职反省；1961 年 4 月地委的处理意见说王达夫“没有对路宪文的罪恶活动进行斗争”。1962 年 5 月他检讨说：“当时我的思想上视粮食为珠宝，只要搞了粮食就能解决问题”。7 月 6 日地委常委决定“给予路宪文开除党籍的处分，并建议政府判处适当徒刑，以平民愤”。此后的经历未见公开文书。
      cites: [ws-1961-04-29-xinyang-cadres-disposal, ws-1962-07-10-lu-xianwen-punishment]
  assess:
    - { voice: official1966, text: 路宪文已经从骄傲自满、贪名利、图荣誉的严重个人主义，发展成为一个政治上思想上完全叛变无产阶级立场，堕落成为一个蜕化变质分子（1962 年信阳地委处分决定）, cite: ws-1962-07-10-lu-xianwen-punishment, quote: true }
    - { voice: doc, text: 当时我的思想上视粮食为珠宝，只要搞了粮食就能解决问题，发展到不讲政策，不讲方法，不择手段的严重程度（路宪文 1962 年 5 月检讨）, cite: ws-1962-07-10-lu-xianwen-punishment, quote: true }
    - { voice: editor, text: 同一个地委，1960 年 4 月报“死亡 71658人”并归因于疫病，1962 年 7 月说“全区死亡百余万人”。处分决定也承认此事“和‘五风’错误、执行左倾盲干有极大关系，上级应负很大责任”，但追责止于地委一级。, cite: ws-1962-07-10-lu-xianwen-punishment }
  factions: [provincial]
  fate:
    - { date: 1958-11, s: power, note: 信阳地委第一书记（维基百科，未核原件）, cite: zhwiki-lu-xianwen }
    - { date: 1959-10, s: power, note: 全区推行反瞒产, cite: ws-1962-07-10-lu-xianwen-punishment }
    - { date: 1960-09-20, s: purged, note: 撤职查办（维基百科，未核原件）, cite: zhwiki-lu-xianwen }
    - { date: 1962-07-06, s: purged, note: 开除党籍，建议判刑, cite: ws-1962-07-10-lu-xianwen-punishment }
  cites: [ws-1962-07-10-lu-xianwen-punishment, ws-1960-04-04-xinyang-deaths-report, ws-1961-04-29-xinyang-cadres-disposal]

- id: deng-zihui
