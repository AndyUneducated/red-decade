    - { date: 1964-07, s: attacked, note: “合二而一”受全国批判（维基百科，未核原件）, cite: zhwiki-yang-xianzhen }
    - { date: 1964-12, s: sidelined, note: 撤去党校领导职务, verify: true }
    - { date: 1967, s: detained, note: 作为“六十一人叛徒集团”成员关押, verify: true }
    - { date: 1975, s: sidelined, note: 获释，下放陕西潼关, verify: true }
    - { date: 1978, s: restored, note: 平反回京（维基百科，未核原件）, cite: zhwiki-yang-xianzhen }
    - { date: 1992-08-25, s: dead, note: 病逝（维基百科，未核原件）, cite: zhwiki-yang-xianzhen }
