# M3 people round 2, batch 13: 庐山会议与大跃进. 黄克诚、周小舟 (1959 “反党集团”), 信阳地委第一书记路宪文,
# 邓子恢 (合作化与包产到户), 杨献珍 (“合二而一”) and 孙冶方 (“利润挂帅”). Texts: 1959 八届八中全会决议, 1967《红旗》社论,
# 1972 中发 12 号, 1960 年 4 月与 1961 年 4 月信阳地委报告, 1962 路宪文处分决定, 1970–1971 两报一刊批判文章,
# 1978 三中全会公报, 1980 起诉书, 1981 决议. Careers from general reference, verify.

