# M9 补人物：林彪集团案里的驾驶员和办公室人员，上海 1976 年 10 月武装叛乱策划者，以及几位受害者。

- id: chen-xiuwen
  name: 陈修文
  died: 1971-09-13
  deathKind: killed
  deathPlace: 北京怀柔
  tier: 3
  role1966: 空军飞行员
  pinyin: Chén Xiūwén
  gender: m
  bio: 空军直升机驾驶员、中队长。1971 年 9 月 13 日凌晨被骗驾驶 3685 号直升机载周宇驰、于新野、李伟信从沙河机场外逃，发觉后设法飞回，在北京怀柔降落时与周宇驰夺枪搏斗被杀害。中央材料称他“烈士”。
  life:
    - h: 被骗起飞
      from: 1971-09-13
      to: 1971-09-13
      text: |
        9 月 13 日三点十五分，周宇驰、于新野、李伟信携带机密文件和美钞在北京沙河机场劫持 3685 号直升机外逃，向蒙古乌兰巴托方向飞去。中央材料说陈修文是“被骗去驾驶直升飞机”的。
      cites: [ws-1980-indictment, ws-1972-lin-material-3]
    - h: 飞回
      from: 1971-09-13
      to: 1971-09-13
      text: |
        起诉书说他“发觉后，采取措施飞回到北京市怀柔县”，降落时被周宇驰杀害。李伟信和另一驾驶员陈士印被活捉。
      cites: [ws-1980-indictment, ws-1972-lin-material-3]
    - h: 烈士
      from: 1971-09-18
      to: 1972
      text: |
        1971 年 9 月 18 日中央通知说“周宇驰、于新野打死驾驶员”；1972 年材料称“驾驶员中队长陈修文烈士与叛徒周宇驰夺枪搏斗，被杀害”，“在机上与叛徒搏斗，光荣牺牲”。
      cites: [ws-1971-09-18-notice, ws-1972-lin-material-2, ws-1972-lin-material-3]
  factions: [models]
  fate:
    - { date: 1971-09-13, s: dead, note: 在直升机上被周宇驰杀害, cite: ws-1980-indictment }
  cites: [ws-1980-indictment, ws-1971-09-18-notice, ws-1972-lin-material-2, ws-1972-lin-material-3]

- id: pan-jingyin
  name: 潘景寅
  died: 1971-09-13
