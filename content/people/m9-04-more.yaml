      from: 1971-09-12
      to: 1971-09-12
      text: |
        9 月 12 日 256 号专机被秘密调往山海关供林彪、叶群、林立果使用；周恩来追查时，胡萍谎报是飞行训练。
      cites: [ws-1981-01-25-judgment]
    - h: 起飞与坠毁
      from: 1971-09-13
      to: 1971-09-13
      text: |
        12 日深夜林彪一行仓皇登机，“不等副驾驶员、领航员、通讯服务员上机，飞机航行灯也没有开”，13 日零点三十二分强行起飞，在温都尔汗机毁人亡。9 月 18 日中央通知写明同机的有“驾驶员潘景寅”。
      cites: [ws-1980-indictment, ws-1971-09-18-notice]
