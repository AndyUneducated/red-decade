  bio: 傅雷的妻子。1966 年 8 月底红卫兵在他们家里搜出所谓“反党罪证”（一面小镜子和一张褪色的旧画报），9 月 2 日夜她与傅雷给她的哥哥朱人秀写下遗书，交代房租、寄存物品和火葬费，随后两人自尽。
