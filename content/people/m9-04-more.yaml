      from: 1966-09-02
      to: 1966-09-02
      text: |
        遗书落款“傅雷 梅馥一九六六年九月二日夜”，托朱人秀：“因为你是梅馥的胞兄，因为我们别无至亲骨肉，善后事只能委托你了。”留给保姆周菊娣六百元存单，“她是劳动人民，一生孤苦，我们不愿她无故受累”；“现钞53.30元，作为我们火葬费”。
      cites: [fu-lei-1966-09-02-note]
