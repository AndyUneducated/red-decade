- id: jiang-guozhang
  name: 蒋国璋
  tier: 3
  role1966: 空四军干部
  pinyin: Jiǎng Guózhāng
  gender: m
  bio: 空四军司令部军务处处长，林立果在上海秘密建立的“上海小组”主要成员，负责组建和训练“教导队”。1971 年 9 月 12 日晚接李伟信电话，通知“小组”和“教导队”全体带武器准备随机出发，报告了王维国。林彪出逃后与王维国订立攻守同盟，解散“教导队”和“上海小组”。
  life:
    - h: 上海小组
      from: 1970-05
      to: 1971-03
      text: |
        “上海小组”原是为林立果“找对象”的“找人小组”，又称“八人小组”，由蒋国璋、袭著显等八人组成；1970 年 5 月经林立果、王维国整顿，成为林立果“进行反革命阴谋活动的工具”。
      cites: [ws-1982-wang-weiguo-case, ws-1972-lin-material-3]
    - h: 教导队
      from: 1971-03
      to: 1971-09-12
      text: |
        1971 年 3 月下旬起在上海新华一村秘密据点组建“教导队”，具体工作由他和袭著显负责，进行捕俘、格斗、巷战等训练。李伟信笔供记林立果的话：“小组里以袭著显、蒋国璋为主”。9 月 9 日“上海小组”进入“一等准备”，他报告了王维国。
      cites: [ws-1982-wang-weiguo-case, ws-1972-lin-material-2]
    - h: 九月十二日以后
      from: 1971-09-12
      to: 1971-09-13
      text: |
        12 日晚李伟信打电话要他立即报告王维国：“明天有一架大飞机到上海，‘小组’全体、‘教导队’全体带武器和战斗化行李随机出发。”他作了安排并报告王维国。13 日林彪出逃、中央下达禁航令后，与王维国、袭著显订立攻守同盟，解散“教导队”和“上海小组”。
      cites: [ws-1982-wang-weiguo-case]
  factions: [lin]
  fate:
    - { date: 1971-03, s: power, note: 负责“教导队”, cite: ws-1982-wang-weiguo-case }
  cites: [ws-1982-wang-weiguo-case, ws-1972-lin-material-2, ws-1972-lin-material-3]

