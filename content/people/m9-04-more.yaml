  deathPlace: 蒙古温都尔汗
  tier: 3
  role1966: 空军飞行员
  pinyin: Pān Jǐngyín
  gender: m
  bio: 三叉戟 256 号专机驾驶员。1971 年 9 月 13 日凌晨驾驶载林彪、叶群、林立果、刘沛丰的飞机从山海关机场强行起飞，副驾驶员、领航员、通讯员都未上机，飞机在蒙古温都尔汗坠毁，机上全部死亡。
  life:
