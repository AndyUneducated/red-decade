# M9 补人物：林彪集团案里的次要人物。依据 1971–1972 年中共中央下发的“林陈反党集团”材料和 1980 年特别检察厅起诉书。

- id: lei-yingfu
  name: 雷英夫
  tier: 3
  role1966: 总参谋部作战部副部长
  pinyin: Léi Yīngfū
  gender: m
  bio: 1966 年任解放军总参谋部作战部副部长，8 月 18 日在天安门大会的负责人名单上。起诉书说，8 月 11 日、12 日叶群两次找他，把林彪、叶群捏造的诬陷刘少奇的材料口授给他，要他写成材料；14 日林彪让他以给林彪和毛泽东写信的形式附上材料，当天批送江青“酌转”毛泽东。
  life:
    - h: 总参作战部
      from: 1966-08-18
      to: 1966-08-18
      text: |
        1966 年 8 月 19 日《人民日报》报道毛泽东首次接见红卫兵的大会，雷英夫列在“参加群众大会的各方面的负责人”名单中。
      cites: [rmrb-1966-08-19-first-rally]
    - h: 叶群口授
      from: 1966-08-11
      to: 1966-08-13
      text: |
        8 月 11 日、12 日，刘少奇仍是国家主席并刚在八届十一中全会上重新当选政治局常委，叶群两次找他，把诬陷刘少奇的材料口授给他，指使他写成材料。13 日林彪看了他写的材料。
      cites: [ws-1980-indictment]
    - h: 给林彪、毛泽东的信
      from: 1966-08-14
      to: 1966-08-14
      text: |
        14 日林彪在住处告诉他用给林彪和毛泽东写信的形式附上材料，由林彪批转，“这样更政治化些”。当天林彪把信和材料批送江青“酌转”毛泽东。1981 年判决书叙述林彪、江青集团共谋诬陷刘少奇，首先写的就是此事。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
  factions: [lin]
  fate:
    - { date: 1966-08-14, s: normal, note: 按林彪授意写信诬陷刘少奇, cite: ws-1980-indictment }
  cites: [ws-1980-indictment, ws-1981-01-25-judgment]

- id: liu-peifeng
  name: 刘沛丰
  died: 1971-09-13
  deathKind: accident
  deathPlace: 蒙古温都尔汗
  tier: 3
  role1966: 空军干部
  pinyin: Liú Pèifēng
  gender: m
  bio: 空军党委办公室（即空军司令部办公室）处长，林立果“联合舰队”骨干，叶群给他定的代号是“催子”“棰子”。1969 年 2 月林彪亲笔写信给周宇驰和他，要他们“让老虎多单独行动”。1971 年 9 月 10 日从北戴河把林彪给黄永胜的亲笔信带回北京，13 日凌晨随林彪、叶群、林立果登上三叉戟，在蒙古温都尔汗机毁人亡。
  life:
    - h: “让老虎多单独行动”
      from: 1969-02-16
      to: 1970-05-03
      text: |
        1969 年 2 月 16 日林彪写信给周宇驰、刘沛丰，要他们“让老虎多单独行动”，“以便锻炼他”的“独立工作能力”（“老虎”是林立果的小名）。1970 年 5 月 2 日晚林彪、叶群“接见”王飞、周宇驰、刘沛丰等，林彪问“谁是你们的头”；次日他们开会共推林立果为“头”。
      cites: [ws-1972-lin-material-3, ws-1980-indictment]
    - h: 黑会与北戴河
      from: 1971-04-23
      to: 1971-08
      text: |
        于新野的工作日记记载，1971 年 4 月 23 日晚批陈整风汇报会期间，周宇驰、刘沛丰、于新野等开会，讨论“准备加快、提前”实行“571”计划。李伟信供述，1971 年 8 月刘沛丰在北戴河对他说，前几天天天四五点钟才睡，叶群天天找林立果研究“571”。他还和林立果到深圳、沙头角拍摄地形照片。
      cites: [ws-1972-lin-material-2]
    - h: 九一三
      from: 1971-09-08
      to: 1971-09-13
      text: |
        9 月 8 日至 11 日林立果、周宇驰向他传达林彪的武装政变手令。9 月 10 日他从北戴河带回林彪写给黄永胜的信：“很惦念你……有事时可与王飞同志面洽。”12 日深夜与林彪、叶群、林立果到山海关机场登机，13 日零点三十二分强行起飞，飞机在温都尔汗坠毁。
      cites: [ws-1980-indictment, ws-1971-09-18-notice]
  factions: [lin]
  fate:
    - { date: 1970-05-02, s: rise, note: 联合舰队骨干, cite: ws-1980-indictment }
    - { date: 1971-09-13, s: dead, note: 随林彪乘机外逃，坠机身亡, cite: ws-1971-09-18-notice }
  cites: [ws-1980-indictment, ws-1972-lin-material-2, ws-1972-lin-material-3, ws-1971-09-18-notice]

- id: yu-xinye
  name: 于新野
  died: 1971-09-13
  deathKind: suicide
  deathPlace: 北京怀柔
  tier: 3
  role1966: 空军干部
  pinyin: Yú Xīnyě
  gender: m
  bio: 空军党委办公室副处长，林立果“联合舰队”骨干。1971 年 3 月在上海与林立果、周宇驰、李伟信制订武装政变计划，《“571工程”纪要》是他手记的；他还搜集摘录了二十八例政变和谋杀事例，抄正本送林彪、叶群。9 月 12 日与王飞等拟定南逃广州名单，13 日凌晨与周宇驰、李伟信劫持直升机外逃，迫降后与周宇驰开枪自杀。
  life:
    - h: 《“571工程”纪要》
      from: 1971-03-18
      to: 1971-03-31
      text: |
        1971 年 3 月 18 日随林立果从杭州回上海，当晚林立果对他和李伟信说“要设想一个政变计划”。20 日周宇驰到上海后四人开会，22 日至 24 日写出《“571工程”纪要》。李伟信等证实并经笔迹核对，纪要是于新野手记的。3 月 31 日他专程到杭州接陈励耘到上海开会。
      cites: [ws-1972-lin-material-2, ccom-chen-liyun-interview]
    - h: 政变事例与“加快、提前”
      from: 1971-04-23
      to: 1971-09-08
      text: |
        他搜集摘录政变和谋杀事例二十八例、一百二十六页，抄正本送林彪、叶群。他的工作日记记下 4 月 23 日晚的黑会讨论“准备加快、提前”实行“571”。9 月 8 日被派到杭州与陈励耘密商用改装的伊尔-10 强击机谋害毛泽东。
      cites: [ws-1972-lin-material-3]
    - h: 南逃与直升机
      from: 1971-09-12
      to: 1971-09-13
      text: |
        9 月 12 日晚与王飞召集“七人黑会”，拟定随林彪南逃广州的行动计划和人员名单。13 日三点十五分与周宇驰、李伟信携带机密文件和美钞在沙河机场劫持 3685 号直升机外逃，驾驶员陈修文发觉后飞回怀柔，降落时被周宇驰杀害；周宇驰、于新野开枪自杀。
      cites: [ws-1980-indictment, ws-1972-lin-material-3, ws-1971-09-18-notice]
  factions: [lin]
  fate:
