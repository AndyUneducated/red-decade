      text: |
        笔供说，3 月 18 日晚林立果在卧室里对于新野和他说：“根据目前局势，要设想一个政变计划。”21 日起林立果、周宇驰、于新野商量，后来叫他也去；计划代号由林立果定为“571”，“即‘武装起义’的谐音”，由于新野执笔。林立果还要他打听张春桥家是否由他们警卫处管。
