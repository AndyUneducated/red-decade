    - { date: 1971-09-13, s: dead, note: 直升机迫降后开枪自杀, cite: ws-1971-09-18-notice }
  cites: [ws-1972-lin-material-2, ws-1972-lin-material-3, ws-1980-indictment, ws-1971-09-18-notice]

