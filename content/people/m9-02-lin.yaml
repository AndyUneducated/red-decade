    - h: 被俘
      from: 1971-09-13
      to: 1972
      text: |
        13 日凌晨与周宇驰、于新野乘直升机外逃，驾驶员陈修文与周宇驰夺枪搏斗被杀；迫降后周、于自杀，李伟信被俘获。他的笔供证实了《“571工程”纪要》的形成和于新野、刘沛丰的言行。
      cites: [ws-1972-lin-material-2, ws-1980-indictment]
