  gender: f
  positions: []
  bio: 中国人民大学哲学系副教授。十七岁的儿子蒋捷连 1989 年 6 月 3 日夜在北京木樨地附近被戒严部队枪击身亡。此后她和丈夫蒋培坤、张先玲等遇难者家属逐一寻访死者和伤残者，形成“天安门母亲”群体，持续公开要求“公开六四真相，追究事件责任”，长期受到监控和软禁。
  life:
    - h: 天安门母亲
      from: 1989-06-03
      text: |
        维基百科说，天安门母亲运动“主要发起者为六四事件死者蒋捷连之母、中国人民大学前哲学系副教授丁子霖，约始于2000年初”。她从 1990 年代初开始逐户寻访，按综述，群体确认的“失踪与死伤者清单，1999年有155人、2005年有187人、2010年有195人，2011年8月有202人”（脚注号略）。群体的诉求包括“死难者家属有权公开悼念在六四事件中遇难的亲人”和“公开六四真相，追究事件责任”。每到 6 月前后，她和其他成员常被限制出行或软禁。
