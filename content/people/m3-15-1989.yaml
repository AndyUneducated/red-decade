  bio: 四川安岳人，1949 年入北京大学中文系，同年入党，此后长期在北京工作，文革中被批斗、下放。1983 年任北京市市长，1988 年兼任国务委员。1989 年学潮中是戒严的积极执行者，6 月 30 日代表国务院向全国人大常委会作《关于制止动乱和平息反革命暴乱的情况报告》，这是官方对事件经过和伤亡人数的正式说法。1992 年任北京市委书记、政治局委员；1995 年因北京市副市长王宝森案被撤职，1998 年以贪污罪、玩忽职守罪被判处有期徒刑十六年，2013 年病逝。
