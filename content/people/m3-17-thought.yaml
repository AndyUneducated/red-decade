    - { voice: editor, text: 这段经过出自 2014 年人民出版社的画传，属于后来的纪念性叙述；他把张志新批评毛泽东的言论说成“神志不清时所讲”，是平反得以通过的条件。, cite: people-2014-ren-zhongyi-zhang-zhixin }
  factions: [provincial, reform]
  fate:
    - { date: 1966, s: attacked, note: 文革爆发后在黑龙江省委书记兼哈尔滨市委第一书记任上被解职、批斗（维基百科，未核原件）, cite: zhwiki-ren-zhongyi }
    - { date: 1978-09-04, s: rise, note: 中央任命为辽宁省委第一书记、省革委会主任, cite: dswxyjy-2015-ren-zhongyi }
    - { date: 1979-03-31, s: rise, note: 主持为张志新平反, cite: people-2014-ren-zhongyi-zhang-zhixin }
    - { date: 1980-11-09, s: rise, note: 中央任命为广东省委第一书记, cite: dswxyjy-2015-ren-zhongyi }
    - { date: 1985-07-04, s: sidelined, note: 中央批准广东新班子，离任省委第一书记；9 月 23 日增选为中顾委委员, cite: dswxyjy-2015-ren-zhongyi }
  cites: [people-2014-ren-zhongyi-zhang-zhixin]

- id: liu-wenhui
  name: 刘文辉
  born: 1937
  died: 1967-03-23
  deathKind: executed
  deathPlace: 上海
  tier: 3
  role1966: 上海工人（右派，监督改造中）
  pinyin: Liú Wénhuī
  gender: m
  birthplace: 上海
  origin: 江苏无锡
  bio: 江苏无锡人，1937 年生于上海，造船厂学徒出身。1957 年被划为右派，1962 年被指控“蓄谋叛国投敌”押回上海监督改造。1966 年 9 月 28 日写成万言书《驳文化大革命十六条》，由弟弟刘文忠寄往全国十四所大中院校，11 月被捕。1967 年 3 月 9 日被上海市中级人民法院判处死刑，23 日在文化广场示众后枪决，被认为是文革中第一个被公开处决的人。上海市高级人民法院后来改判“错判错杀”，宣告他无罪。
  life:
    - h: 学徒与右派
      from: 1937
      to: 1966-09
      text: |
        1937 年生于上海，籍贯江苏无锡。1952 年从大同中学初二辍学，进沪东造船厂当学徒。1957 年在厂里被划为“右派分子”，下放到浙江嵊泗机械厂当辅助工；1962 年又被指控有“蓄谋叛国投敌”等“现行反革命罪行”，押回上海“监督改造”。文革开始后他写过两本小册子《冒牌的阶级斗争与实践破产论》《通观五七年来的各项运动》，被红卫兵抄家时抄走，下落不明。
      cites: [zhwiki-liu-wenhui, ws-1980-liu-wenhui-rehab]
    - h: 《驳文化大革命十六条》
      from: 1966-09-28
      to: 1967-03-23
      text: |
        “刘文辉撰写《驳文化大革命十六条》万言书是在1966年9月28日的深夜。”他和弟弟刘文忠把文章复写了十四份，刘文忠国庆节休假时到杭州，匿名寄给北大、清华、复旦等十四所学校。11 月 26 日他被捕。1967 年 3 月 9 日上海市中级人民法院判处他死刑，判决书说他“编写了反革命的‘十六条’，分别散发到全国八大城市十四所大中院校”；次日上海市高级人民法院驳回上诉。3 月 23 日下午，在一场名为“坚决保卫无产阶级文化大革命，严厉镇压反革命”的大会之后，他在上海文化广场示众，随即枪决。
      cites: [hyh-2024-blood-sacrifice-4, zhwiki-liu-wenhui, ws-1980-liu-wenhui-rehab]
    - h: 改判无罪
      from: 1979-03-17
      to: 1982-01-06
      text: |
        家属申诉后，上海市高级人民法院 1979 年 3 月 17 日先裁定驳回。亲属继续申诉，复查结论是：传单“主要内容系对文化大革命中的极左路线不满，其余属思想认识与教育问题，均不构成犯罪”，原判认定的“恶毒攻击、污蔑伟大领袖”“妄图进行反革命暴乱”等“均属不实之词”，原判“属于错判错杀，应予平反纠正”，撤销三份原裁判，宣告他无罪。判决书页面没有写日期，维基百科作 1982 年 1 月 6 日。弟弟刘文忠先后被关押十三年。
      cites: [ws-1980-liu-wenhui-rehab, zhwiki-liu-wenhui]
  assess:
    - { voice: scholar, text: 刘文辉就在上海最大的文化广场示众后枪决！成为文革中第一个被公开杀害的人。（何与怀）, cite: hyh-2024-blood-sacrifice-4, quote: true }
    - { voice: judicial1980, text: 因此原判对刘文辉以反革命罪判处死刑,立即执行属于错判错杀,应予平反纠正。（上海市高级人民法院）, cite: ws-1980-liu-wenhui-rehab, quote: true }
    - { voice: editor, text: 改判把万言书定性为对“极左路线不满”，没有回应它反对的是中共中央的《十六条》本身；1979 年 3 月的第一次复查还维持了原判。, cite: ws-1980-liu-wenhui-rehab }
  factions: [dissent]
  rehab:
    - { date: 1982-01-06, text: 上海市高级人民法院判决撤销原判，认定“属于错判错杀，应予平反纠正”，宣告刘文辉无罪（日期据维基百科，判决书页面未载；此前数据作 1979）, cite: ws-1980-liu-wenhui-rehab }
  fate:
    - { date: 1957, s: purged, note: 在沪东造船厂被划为右派分子，下放浙江嵊泗（维基百科，未核原件）, cite: zhwiki-liu-wenhui }
    - { date: 1962, s: attacked, note: 被指控“蓄谋叛国投敌”，押回上海监督改造（维基百科，未核原件）, cite: zhwiki-liu-wenhui }
    - { date: 1966-11-26, s: detained, note: 因《驳文化大革命十六条》被捕（维基百科，未核原件）, cite: zhwiki-liu-wenhui }
    - { date: 1967-03-09, s: detained, note: 判处死刑, cite: hyh-2024-blood-sacrifice-4 }
    - { date: 1967-03-23, s: dead, note: 在上海文化广场示众后枪决, cite: hyh-2024-blood-sacrifice-4 }
  cites: [hyh-2024-blood-sacrifice-4, ws-1980-liu-wenhui-rehab, zhwiki-liu-wenhui]

- id: wang-peiying
  name: 王佩英
  born: 1915-03-14
  died: 1970-01-27
  deathKind: executed
  deathPlace: 北京
  tier: 3
  role1966: 铁道部铁路专业设计院职工，已公开要求退党
  pinyin: Wáng Pèiyīng
  gender: f
  birthplace: 河南开封
  bio: 河南开封人，女，1952 年入党，1955 年随家迁到北京，在铁道部铁路专业设计院当保育员、宿舍服务员。1960 年代初公开支持刘少奇，说毛泽东应退出领导层，1965 年要求退党，随后被单位送进精神病院。1968 年 6 月医院出具“无精神异常”的证明把她交回单位，10 月 21 日被捕，1970 年 1 月 27 日公审后处决，时年五十四岁。1980 年平反、恢复党籍，2011 年北京市高级人民法院改判无罪。
  life:
    - h: 开封到北京
      from: 1915-03-14
      to: 1960-11
      text: |
        1915 年生于开封，7 岁丧母、12 岁丧父，在天主教会办的静宜女子中学读完初中。1934 年与张以成结婚，抗战中丈夫秘密加入中共，她 1948 年加入青年团。1949 年后先后在郑州邮局、郑州铁路局工作，1950 年申请入党，1952 年 5 月正式入党（1980 年的平反决定作“一九五〇年参加中国共产党”）。1955 年全家迁到北京，她在铁道部系统的托儿所当保育员，1959 年初因不慎把热水泼到孩子身上，调到铁路专业设计院当单身宿舍服务员。1960 年 11 月丈夫病故。
      cites: [zhwiki-wang-peiying]
    - h: 退党与精神病院
      from: 1961
      to: 1968-06-06
      text: |
        1961、1962 年毛泽东与刘少奇的分歧逐渐公开，她支持刘少奇，认为“毛主席应该退出历史舞台，不然他以后没有退路”。1965 年 4 月要求退党，说“过去共产党抛头颅撒热血为了解放人类，而现在共产党是高官厚禄、养尊处优”（后来的判决把这些言论和退党都归在“1964年夏”）。当时刘少奇还是国家主席，单位为了摆脱麻烦，把她送进北京安定医院。1968 年 6 月 6 日医院出具出院证明：“无精神异常，在住院期间思想反动，对党不满，经过思想教育仍不改，故由机关接出处理。”
      cites: [zhwiki-wang-peiying, hyh-2024-blood-sacrifice-4]
    - h: 牛棚与刑场
      from: 1968-06-06
      to: 1970-01-27
      text: |
        出院后她被押进设计院宿舍的牛棚，挨打并被强迫劳动。1968 年 9 月 9 日、9 月 30 日、10 月 4 日，她在食堂高喊“刘少奇万岁”。10 月 21 日北京市公安局军管会以“现行反革命”罪名逮捕她；1969 年下半年被戴上牲口嚼子押到各区游斗。1970 年 1 月 18 日谢富治等向中共中央请示判处死刑，22 日获批，27 日在北京工人体育场公审，当天押赴芦沟桥枪决。为防她喊口号，她的咽喉被细绳勒住，可能在囚车上就已被勒死。判决书说她“书写反革命标语一千九百余张，反动诗词三十余首”。
      cites: [zhwiki-wang-peiying, hyh-2024-blood-sacrifice-4]
    - h: 两次平反
