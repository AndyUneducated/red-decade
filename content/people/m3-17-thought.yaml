  gender: m
  birthplace: 河北威县
  positions:
    - { title: 第一书记, orgName: 中共辽宁省委员会, from: 1978, to: 1980-11, verify: true }
    - { title: 第一书记, orgName: 中共广东省委员会, from: 1980-11, to: 1985-07, verify: true }
  bio: 河北威县人，1936 年入党。文革前任中共哈尔滨市委第一书记，文革中被打倒。1977 年起先后主持旅大市委和辽宁省委，1979 年不经请示中央为张志新平反，追认为烈士。1980 年 11 月接替习仲勋任广东省委第一书记，主持经济特区初创时期的广东，1985 年退居二线。2005 年在广州去世。
  life:
    - h: 哈尔滨
      from: 1914-09-05
      to: 1977
      text: |
        河北威县人，抗战时期在冀南工作。1950 年代起在东北任职，文革前任中共哈尔滨市委第一书记，文革开始后被批斗打倒，后来恢复工作。
      verify: true
    - h: 辽宁：张志新案
      from: 1978
      to: 1980-11
      text: |
        他调到辽宁时张志新已死近两年。1979 年 1 月案情在省委扩大会议上被揭露，他要求“公安司法部门应抓紧清查这一案件”；3 月 9 日省委常委会听取复审汇报，他主张定为烈士、彻底平反、开追悼大会。为了平反能通过，他把定性限定为“张志新是反对林彪、‘四人帮’ ”。华国锋到辽宁视察时，他请华国锋给张志新题字，华国锋没有理睬；他对下属说“我们还是按省委的决定干”。被问到是否向中央请示，他说：“没有。有错必纠嘛，这是共产党人义不容辞的职责。”3 月 31 日省委召开平反昭雪大会。
      cites: [people-2014-ren-zhongyi-zhang-zhixin]
    - h: 广东
      from: 1980-11
      to: 1985-07
      text: |
        1980 年 11 月接替习仲勋任中共广东省委第一书记，正值深圳、珠海、汕头经济特区刚刚设立，1985 年离任。
      verify: true
  assess:
