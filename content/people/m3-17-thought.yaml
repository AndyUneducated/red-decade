  bio: 上海工人家庭出身，1963 年考入华东师范大学物理系。文革初因日记中同情邓拓、吴晗被抄家、关押，此后留校监督劳动，自学多门外语，精读《资本论》。1976 年 9 月因一封写给女友的长信再次入狱，在狱中重写成六万字的“供状”，否定反右、反右倾和文化大革命，主张发展商品经济、对外开放。1977 年 4 月在卢湾区体育馆公审后枪决，时年三十一岁。1981 年平反。
  life:
    - h: 日记
      from: 1963
      to: 1976-09
      text: |
        “王申酉是工人家庭出身，1963年17岁时考入华东师范大学物理系”。1966 年 6 月他在日记里写下，这场动乱“将使国家倒退至少十年!”造反派抄了他的家，展览他从初中到大学的日记，用皮鞭抽打他，随后送进监狱。关了两年释放后，学校不分配工作，留校监督劳动。他在奉贤“五七”干校大量阅读马恩原著，精读《资本论》。
      cites: [ywang-wang-shenyou]
    - h: 六万字“供状”与六分钟
      from: 1976-09
      to: 1977-04
      text: |
        毛泽东去世时，监管他的工人要抢看他写给女友的长信，厮打之后他再次入狱。审判员要他把被撕毁的信重写出来，他在六天内写了六万字，内容包括“我的马克思主义世界观，关于苏联历史，关于中国历史，关于‘文化大革命’，关于毛主席”。1977 年春上海决定在“五一”前公审镇压一批反革命分子，区法院判“死缓”，市法院院长怕被认为“右倾”，改为“死刑，立即执行”。上海市革委会领导一天内同意了 56 个死刑判决，平均每 6 分钟一个。4 月他在卢湾区体育馆三万人的公审大会上第一次听到判决，随即枪决。
      cites: [ywang-wang-shenyou]
    - h: 平反
      from: 1980
      to: 1981
      text: |
        为他平反，上海市委常委先后开了 19 次会，有三种意见，最后采纳的是“王申酉应平反，但也不宜评价过高，他是勤奋学习热爱祖国的好青年”。1980 年秋多家报社记者组成联合采访组写出长篇通讯，中宣部以“牵涉到中央领导同志(指华国锋)”为由没有准许发表。平反的正式时间来自通行资料。
