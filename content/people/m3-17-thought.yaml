    - { voice: officialLater, text: 第三种意见认为王申酉应平反，但也不宜评价过高，他是勤奋学习热爱祖国的好青年。（陈国栋向记者转述的上海市委意见）, cite: ywang-wang-shenyou, quote: true }
    - { voice: editor, text: 张志新的平反被大张旗鼓地宣传，王申酉案却因为处决发生在华国锋主持中央期间而没有公开报道。, cite: ywang-wang-shenyou }
