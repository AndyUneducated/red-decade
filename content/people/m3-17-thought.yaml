# M3 people round 2, batch 17: 因言论和文字被处死的“思想犯”。刘文辉、王佩英、陆兰秀、张志新、史云峰、李九莲、
# 钟海源、王申酉，以及 1979 年主持为张志新平反的任仲夷。
# Texts: 张志新 1969 年狱中答辩（人民日报 1979-06-11 摘录）、人民网 2014 年摘编《任仲夷画传》、
# 何与怀 2024 年《血祭》第四部分（节选）、金凤回忆王申酉案（节选）、刘文辉平反判决书；
# Y3 起补入维基百科各人条目（节选，未核原件）。
# 生年只在有把握时填写；其余经历来自通行资料的部分标 verify。

- id: zhang-zhixin
  name: 张志新
  born: 1930-12-05
  died: 1975-04-04
  deathKind: executed
  deathPlace: 辽宁沈阳
  tier: 2
  role1966: 中共辽宁省委宣传部文艺处干事
  pinyin: Zhāng Zhìxīn
  gender: f
  birthplace: 天津
  bio: 天津人，1955 年入党，在中共辽宁省委宣传部文艺处工作。文革中在批斗会上和交代材料里公开表示怀疑林彪、江青，不同意打倒刘少奇，也批评毛泽东晚年的错误。1969 年 9 月被捕，1970 年判无期徒刑，在狱中拒不认罪，1975 年 4 月加判死刑，4 日在沈阳被枪决，行刑前被割断喉管。1979 年 3 月中共辽宁省委为她平反并追认为烈士，《人民日报》等报刊随后连续报道，成为思想解放运动中最有名的冤案。
  life:
    - h: 省委宣传部
      from: 1930-12-05
      to: 1969-09-24
      text: |
        1930 年生于天津，“解放后参加革命，上了大学，参加过解放军， 1955年加入中国共产党，后来在中共辽宁省委宣传部文艺处工作”。文革开始后，她在一次次批斗会上责问：什么“一句顶一万句”？什么“不理解的也要执行”？她反感林彪的“顶峰论”，认为把接班人写进党章不好，认为武斗成灾是江青在搞名堂。按她自己的说法，这些看法“经过一定组织形式允许和运动中勒令作的交代”才说出来，“从未和任何人私下散布过（包括自己的爱人在内）”。
      cites: [people-2014-ren-zhongyi-zhang-zhixin, hyh-2024-blood-sacrifice-4, rmrb-1979-06-11-zhang-zhixin]
    - h: 狱中
      from: 1969-09-24
      to: 1975-04-04
      text: |
        1969 年 9 月 24 日被捕。10 月她在狱中写下长篇答辩，说“我之所以至今不能认罪，因为我对路线斗争及与之有关的一系列问题的疑问，起之有因、看法观点立之有据、坚持不改有理”，又说“我认为自己没有错，没有和广大人民为敌”。1970 年 8 月 24 日以现行反革命罪判处无期徒刑。在长期监禁中她仍不改口，被说成“装疯卖傻”“抗拒改造”。1975 年 4 月 3 日宣布加处死刑，4 日执行。临刑前，行刑者把她按倒在地割断喉咙，防止她喊口号。
      cites: [rmrb-1979-06-11-zhang-zhixin, people-2014-ren-zhongyi-zhang-zhixin, hyh-2024-blood-sacrifice-4]
    - h: 平反与宣传
      from: 1979-01
      to: 1979-06-16
      text: |
        1979 年 1 月案情在辽宁省委扩大会议上被揭露，新任省委第一书记任仲夷要求清查。3 月 31 日辽宁省委召开平反昭雪大会，追认她为革命烈士。平反只定性为“张志新是反对林彪、‘四人帮’ ”，她批评毛泽东的言论被“笼统地列入神志不清时所讲”。4 月 5 日《辽宁日报》发表长篇通讯《为真理而献身》；胡耀邦说她是“刘胡兰式的英雄人物”，5 月 25 日《人民日报》转载报道，6 月 11 日摘登她的狱中答辩，《光明日报》《中国青年报》相继跟进。
      cites: [people-2014-ren-zhongyi-zhang-zhixin, rmrb-1979-06-11-zhang-zhixin]
  assess:
    - { voice: doc, text: 走自己的路，让人家去说吧！想要革命吗？你就应当是强者——这就是一个共产党员的宣言！（张志新 1969 年狱中答辩）, cite: rmrb-1979-06-11-zhang-zhixin, quote: true }
    - { voice: officialLater, text: 张志新同志是一个很好的党员，坚持真理，坚持党性，坚持斗争，宁死不屈。（任仲夷 1979 年 3 月 9 日在辽宁省委常委会上）, cite: people-2014-ren-zhongyi-zhang-zhixin, quote: true }
    - { voice: scholar, text: 特别是，她指明毛泽东是文革灾难的“总头子”。（何与怀）, cite: hyh-2024-blood-sacrifice-4, quote: true }
    - { voice: editor, text: 1979 年的平反和宣传都只说她反对林彪、“四人帮”；《人民日报》摘登的答辩里也没有出现毛泽东的名字。她被处死时林彪已死四年，人民网的叙述把加刑归于“‘四人帮’死党指令”，没有点名。, cite: people-2014-ren-zhongyi-zhang-zhixin }
  factions: [dissent]
  fate:
    - { date: 1969-09-24, s: detained, note: 被捕, cite: hyh-2024-blood-sacrifice-4 }
    - { date: 1970-08-24, s: detained, note: 以现行反革命罪判处无期徒刑, cite: people-2014-ren-zhongyi-zhang-zhixin }
    - { date: 1975-04-04, s: dead, note: 加判死刑后在沈阳枪决, cite: people-2014-ren-zhongyi-zhang-zhixin }
  rehab:
    - { date: 1979-03-31, text: 中共辽宁省委召开平反昭雪大会，宣读《关于为张志新同志彻底平反昭雪，追认她为革命烈士的决定》, cite: people-2014-ren-zhongyi-zhang-zhixin }
  cites: [rmrb-1979-06-11-zhang-zhixin, people-2014-ren-zhongyi-zhang-zhixin, hyh-2024-blood-sacrifice-4]

- id: ren-zhongyi
  name: 任仲夷
  born: 1914-09-05
