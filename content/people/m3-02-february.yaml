  bio: 江西吉安人，红军时期失去左臂的“独臂将军”。1958 年任石油部长，组织大庆石油会战；1964 年底被毛泽东点名组建“小计委”，取代李富春主持国家计委，负责三线建设规划。文革初期被造反派揪斗，靠周恩来保护很快回到工作岗位，在“中国（马列）共产党”假案中被列为“成员”。1970–1980 年任计委主任，其后任总政治部主任，1999 年在北京病逝。
  life:
    - h: 独臂将军
