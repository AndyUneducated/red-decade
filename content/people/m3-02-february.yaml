      verify: true
      cites: [klein-clark-1971]
    - h: 财经总管
      from: 1949
      to: 1966
      text: |
        1949 年任中央财经委员会主任，主持统一财经、平抑物价和粮食统购统销。1954 年任国务院副总理，1956 年八大当选中共中央副主席、政治局常委。1956–1957 年与周恩来一起“反冒进”，1958 年南宁会议上受毛泽东批评。大跃进失败后，1962 年 2 月在国务院会议上提出经济处于“非常时期”，主张大幅调整，并在私下支持包产到户。刘少奇 1966 年的检讨说：“由于我当时过份信任陈云同志，并且偏听他的意见……所以我向中央和毛主席推荐陈云同志作中央财经小组的组长”。此后他以养病为由退出一线。
      cites: [ws-1966-10-liu-self-criticism, ws-1981-resolution]
      verify: true
    - h: 文革
      from: 1966
      to: 1977
      text: |
        1966 年 8 月八届十一中全会上不再任中央副主席，仍名列政治局常委末位。1967 年“二月逆流”后受到批判，1981 年决议说“朱德、陈云同志也受到错误的批判”；1968 年康生指使郭玉峰诬陷历任中组部长张闻天、陈云、彭真、邓小平、安子文是“叛徒”“特务”。九大只当选中央委员，1969 年 10 月疏散到江西南昌，在一家化工石油机械厂“蹲点”近三年。1972 年回京，协助周恩来研究外贸问题。
      cites: [ws-1981-resolution, ws-1980-indictment]
      verify: true
    - h: 复出与“鸟笼”
      from: 1978
      to: 1995
      text: |
        1978 年 11 月中央工作会议上首先提出为“六十一人案”、天安门事件、彭德怀等平反，十一届三中全会增选为中央副主席、政治局常委，并任中纪委第一书记。1979 年起主持国务院财经委员会，提出“调整、改革、整顿、提高”，压缩基建与引进规模。此后主张“计划经济为主、市场调节为辅”，以“鸟笼经济”比喻搞活与计划的关系。1987 年任中顾委主任，1989 年支持戒严。1995 年 4 月 10 日在北京病逝。
