      from: 1914
      to: 1949
      text: |
        1914 年生于山东荣成，在北平参加左联活动，1932 年入党。抗战时期在东北军和山东从事统战、兵运工作，后任鲁南区党委书记等职；解放战争中任中共滨海地委书记、新海连特区工委书记等。1949 年后任济南市委书记兼市长。
      verify: true
