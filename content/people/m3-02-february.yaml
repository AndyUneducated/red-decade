    - h: 基本建设
      from: 1952
      to: 1966
      text: |
        1952 年调上海任市委宣传部长、秘书长，1954 年调中央任国家建委副主任，后任国家经委副主任。1965 年 3 月国家基本建设委员会重设，他任主任，负责三线建设的施工组织。
      verify: true
      cites: [ccp-org-history]
    - h: 文革
      from: 1966
      to: 1975
      text: |
        1966 年 8 月刘少奇到北京建筑工业学院听取两派意见，因建材部归口国家建委，他也被派到该院；刘少奇 1967 年的检讨说：“由于建筑材料工业部是归口由国家建委领导的，所以谷牧同志也到你们学院参加文化大革命”。1967 年他被造反派揪斗，1980 年起诉书把他列入被诬陷、迫害的国务院各部委主要负责人。1969 年起回到国家建委工作，1970 年后主持国家基本建设革命委员会。
      cites: [ws-1967-07-09-liu-jiangong-review, ws-1980-indictment]
      verify: true
    - h: 对外开放
      from: 1975
      to: 2009
      text: |
        1975 年 1 月四届人大任国务院副总理。1978 年 5–6 月率中国政府代表团考察法国、瑞士、比利时、丹麦、联邦德国，回国后的报告促成了大规模引进外资和设备的决策。1979 年起任国家进出口管理委员会、外国投资管理委员会主任，主管广东、福建两省的特殊政策和深圳等经济特区的筹建；1984 年主持十四个沿海开放城市的部署。1982 年任国务委员，1988 年退休。2009 年 11 月 6 日在北京病逝。
      verify: true
      cites: [vogel-deng]
  assess:
