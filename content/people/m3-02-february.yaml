    - h: “石油帮”与总政
      from: 1977
      to: 1999
      text: |
        1977 年十一大当选政治局委员，主持“工业学大庆”和 1978 年的“洋跃进”计划，与康世恩等被称为“石油帮”。1979 年后调整中计划指标被批评过高，1980 年 8 月计委主任由姚依林接任，他改任国家能源委员会主任、书记处书记。1982 年 9 月任总政治部主任，1987 年退休。1999 年 2 月 3 日在北京病逝。
