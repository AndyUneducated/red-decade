  bio: 长沙人，1919 年赴法勤工俭学，在法国入党，与蔡畅结为夫妇。回国后从事军队政治工作，长征后任中央财经部门负责人，建国后长期主持国家计委，是第一个五年计划的主要制定者。1966 年八届十一中全会进入政治局常委，1967 年 2 月因参加对中央文革的抗争被归入“二月逆流”，九大后退出政治局。1975 年 1 月四届人大召开前夕在北京病逝。
  life:
    - h: 勤工俭学
      from: 1900
      to: 1925
      text: |
        1900 年生于长沙。1919 年赴法国勤工俭学，1922 年加入旅欧中国少年共产党并转为中共党员，与周恩来、赵世炎、邓小平等同在旅欧支部。1923 年与蔡畅结婚。后转莫斯科学习，1925 年回国。
      verify: true
      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 军队政治工作与中央苏区
      from: 1925
      to: 1945
      text: |
        北伐时任国民革命军第二军副党代表兼政治部主任。大革命失败后在上海、江西做地下工作，1931 年后在中央苏区任江西省委书记、红军总政治部代主任，参加长征。到陕北后历任中央组织部副部长、中央财政经济部部长，主持延安大生产运动的经济工作。
      verify: true
      cites: [klein-clark-1971]
    - h: 东北与计委
      from: 1945
      to: 1966
      text: |
        抗战胜利后到东北，任东北局副书记，主管后方工业与财经。1952 年参与筹建国家计委，1954 年 9 月任国务院副总理兼国家计委主任，主持编制第一、第二个五年计划。1964 年毛泽东另组以余秋里为首的“小计委”，计委日常工作逐步移交。
      verify: true
      cites: [klein-clark-1971, ccp-org-history]
    - h: 二月逆流与晚年
      from: 1966-08
      to: 1975
      text: |
        1966 年 8 月八届十一中全会上进入政治局常委。1967 年 2 月在京西宾馆、怀仁堂的会议上与谭震林、陈毅、叶剑英等一同批评中央文革，被列入“二月逆流”。1968 年谢富治等炮制的“中国（马列）共产党”假案中，他被诬为这个子虚乌有的党的“总理”。九大只当选中央委员，退出政治局；1973 年十大再次当选中央委员。1975 年 1 月 9 日病逝，四届人大没有再提名他。
      cites: [ws-1981-resolution, ws-1980-indictment]
      verify: true
  assess:
    - { voice: official1981, text: 一九六七年二月前后，谭震林、陈毅、叶剑英、李富春、李先念、徐向前、聂荣臻等政治局和军委的领导同志，在不同的会议上对“文化大革命”的错误作法提出了强烈的批评, cite: ws-1981-resolution, quote: true }
    - { voice: judicial1980, text: 诬陷朱德是“中国（马列）共产党”中央的“书记”，陈毅是“副书记兼国防部长”，李富春是“总理”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: scholar, text: 李富春在怀仁堂冲突中发言不多，研究者通常把他视为“二月逆流”中被牵连的温和者；他在 1967 年后仍名义上保留副总理、计委主任，实际经济工作转到李先念主持的国务院业务组。, cite: macfarquhar-schoenhals }
  factions: [premier]
