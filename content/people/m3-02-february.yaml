  bio: 湖北黄安木匠出身，红四方面军将领，西路军失败后突围到新疆。抗战时创建鄂豫边根据地，1946 年率中原军区部队突围。建国后主政湖北，1954 年起任财政部长二十年。文革中虽被列入“二月逆流”，却是少数一直在台上的经济领导人，与周恩来一起维持国务院运转。1976 年参与粉碎“四人帮”，后任中共中央副主席、国家主席、全国政协主席。1992 年在北京病逝。
