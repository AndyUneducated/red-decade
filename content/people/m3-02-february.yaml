  bio: 山西定襄人，1925 年入党，1931 年被捕，1936 年按北方局决定办理出狱手续，抗战初在山西组建决死队。建国后任财政部长、国家经委主任、国务院副总理。文革中被定为“六十一人叛徒集团”首要成员，关押近十二年。1978 年平反，后任国务院副总理、中顾委常务副主任，在 1987 年胡耀邦下台和 1989 年戒严中站在元老一方。2007 年在北京病逝。
  life:
    - h: 草岚子监狱
      from: 1908
      to: 1937
      text: |
        1908 年生于山西定襄，在太原读书时参加学生运动，1925 年入党，在山西、天津从事兵运和地下工作。1931 年在北平被捕，关押在草岚子监狱。1936 年中共中央北方局（刘少奇主持）为保存干部，决定狱中党员按国民党要求登报发表“反共启事”出狱，他与刘澜涛、安子文等六十一人照此出狱。这一经过在文革中被定为“集体叛变”。
      verify: true
      cites: [klein-clark-1971, ws-1968-liu-case-report, ws-1980-02-29-liu-rehab]
    - h: 决死队与晋冀鲁豫
      from: 1937
      to: 1949
      text: |
        出狱后回山西，利用阎锡山的“牺牲救国同盟会”组建山西青年抗敌决死队第一纵队，任政委，是“新军”的主要创建者。1941 年后任太岳军区政委、中共中央晋冀鲁豫中央局副书记、晋冀鲁豫军区副政委，后任华北局第一书记、华北军区政委。
      verify: true
      cites: [klein-clark-1971]
    - h: 财政部长与国家经委
      from: 1949
      to: 1966
      text: |
        1949 年 10 月任财政部长，1953 年因推行“新税制”在全国财经会议上受毛泽东批评，同年离开财政部。1956 年 5 月任国家经委主任，同年八大当选政治局候补委员，任国务院副总理，主管工业和交通。
      verify: true
      cites: [klein-clark-1971, ccp-org-history]
    - h: “六十一人叛徒集团”
      from: 1966
      to: 1978
      text: |
        1966 年下半年康生等重提草岚子出狱旧案，年底他在广州养病时被北京红卫兵揪回批斗。1967 年 3 月中共中央批转关于“六十一人自首叛变”的材料，他与刘澜涛、安子文、杨献珍等被定为叛徒，此后关押近十二年。1968 年刘少奇专案审查报告说：“刘少奇指使薄一波、刘澜涛、安子文等六十一个叛徒，公开发表‘反共启事’，投降国民党，叛变共产党。”聂元梓等人还捏造“彭真、薄一波、安子文——胡仁奎、李伦特务案”。
      cites: [ws-1968-liu-case-report, ws-1982-10-05-nie-yuanzi-case, ws-1980-indictment]
      verify: true
    - h: 平反与元老
      from: 1978
      to: 2007
      text: |
        1978 年 12 月中共中央以 75 号文件否定“六十一人案”，十一届三中全会公报说会议“纠正了过去对彭德怀、陶铸、薄一波、杨尚昆等同志所作的错误结论”。1979 年任国务院副总理，1982 年任中顾委常务副主任，1983 年起主持整党。1987 年 1 月在批评胡耀邦的“党内生活会”上发言激烈，1989 年支持戒严。晚年著有《若干重大决策与事件的回顾》。2007 年 1 月 15 日在北京病逝。
      cites: [ws-1978-12-third-plenum, ws-1980-02-29-liu-rehab]
      verify: true
  assess:
    - { voice: official1966, text: 刘少奇指使薄一波、刘澜涛、安子文等六十一个叛徒，公开发表“反共启事”，投降国民党，叛变共产党（1968 年刘少奇专案审查报告）, cite: ws-1968-liu-case-report, quote: true }
    - { voice: officialLater, text: 指使薄一波、刘澜涛、安子文等六十一人“投降国民党、叛变共产党”的问题，已由中共中央一九七八年十二月十六日中发75号文件予以否定（1980 年刘少奇平反报告）, cite: ws-1980-02-29-liu-rehab, quote: true }
    - { voice: officialLater, text: 会议审查和纠正了过去对彭德怀、陶铸、薄一波、杨尚昆等同志所作的错误结论，肯定了他们对党和人民的贡献（1978 年十一届三中全会公报）, cite: ws-1978-12-third-plenum, quote: true }
    - { voice: scholar, text: 研究者指出六十一人出狱是经中共中央批准的组织决定，文革中把它定为叛变的主要目的是坐实刘少奇“招降纳叛”；薄一波本人复出后则成为 1980 年代政治上最保守的元老之一。, cite: macfarquhar-schoenhals }
