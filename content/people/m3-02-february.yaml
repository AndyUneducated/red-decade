      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 大庆会战与“小计委”
      from: 1950
      to: 1966
      text: |
        1955 年授中将，任总后勤部政委、财务部长。1958 年 2 月转任石油工业部长，1960 年组织大庆石油会战，次年大庆基本建成。1964 年毛泽东批评计委工作，年底另组以他为首的“小计委”，1965 年 1 月他任计委副主任主持日常工作，编制以三线建设为中心的第三个五年计划。
      verify: true
      cites: [klein-clark-1971, ccp-org-history]
    - h: 文革
      from: 1966
      to: 1976
      text: |
        1967 年初石油部、计委造反派揪斗他，周恩来出面保护，不久即回到计委工作，参加国务院业务组。据 1980 年起诉书，1968 年 12 月谢富治等制造的“中国（马列）共产党”假案中，他与董必武、叶剑英、李先念、徐向前、聂荣臻、谭震林等一起被诬为“参加的”人，罪名是“里通外国”“准备武装叛乱”。1970 年起任计委主任，1975 年任国务院副总理。
