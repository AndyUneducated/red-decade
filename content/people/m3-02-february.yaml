  bio: 山西五台人，黄埔一期，1927 年入党，红四方面军总指挥，十大元帅之一。1967 年 1 月临危受命任全军文革小组组长，在京西宾馆军委会议上拍案反对冲击军队，被列入“二月逆流”；同年 7 月武汉事件后清华井冈山公开提出“打倒徐向前”，抄他的住所。九大后退出政治局。1977 年恢复政治局委员，1978 年任国防部长，1990 年在北京病逝。
  life:
    - h: 黄埔与鄂豫皖
      from: 1901
      to: 1937
      text: |
        1901 年生于山西五台，师范毕业后当小学教员。1924 年考入黄埔军校第一期，参加东征、北伐。1927 年入党，参加广州起义。1929 年到鄂豫皖苏区，1931 年起任红四方面军总指挥，与张国焘、陈昌浩共同领导红四方面军。长征中在川西北与中央红军会合，1936 年冬率西路军西渡黄河，次年失败后只身回到延安。
      verify: true
      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 抗战与山西
      from: 1937
      to: 1955
      text: |
        抗战时期任八路军一二九师副师长，开辟冀南、鲁西根据地；1942 年回延安，曾代理抗大校长。解放战争中任华北军区第一兵团司令员，指挥晋中战役和太原战役，1949 年攻克太原。建国后任总参谋长，因病长期休养，1955 年授元帅衔。
      verify: true
      cites: [klein-clark-1971]
    - h: 全军文革与“打倒徐向前”
      from: 1966
      to: 1969
      text: |
        1966 年 8 月八届十一中全会当选政治局委员，同年任中央军委副主席。1967 年 1 月刘志坚被打倒后接任全军文化革命小组组长，与叶剑英一起在京西宾馆的军委会议上拍桌子反对造反派冲击军事机关，二月被归入“二月逆流”。据 1980 年起诉书，1967 年 4 月在叶群授意下，蒯大富派人编造诬陷他的材料，发表“炮轰徐向前，打倒拿枪杆子的刘、邓──徐向前”；6 月邱会作指使总后编印传单称他是“一颗大定时炸弹”。7 月武汉事件后，据 1983 年蒯大富案判决，蒯大富“具体提出了‘打倒’……徐向前的反革命口号”，29 日派人抄他的住所和办公室并企图绑架，抢走五箱机密文件。九大只当选中央委员，1969 年 10 月疏散到河南开封。
      cites: [ws-1980-indictment, ws-1982-12-kuai-dafu-case, ws-1981-resolution]
      verify: true
    - h: 国防部长与晚年
      from: 1977
      to: 1990
      text: |
        1977 年 8 月十一大重新当选政治局委员，1978 年 3 月任国务院副总理兼国防部长，1981 年辞去部长。1985 年 9 月与叶剑英、聂荣臻等一批老同志退出政治局，1987 年卸任军委副主席。1990 年 9 月 21 日在北京病逝。
      verify: true
      cites: [klein-clark-1971]
  assess:
    - { voice: judicial1980, text: 诬陷徐向前是埋藏在党内、军内的“一颗大定时炸弹，是个标准的个人野心家和阴谋家”，提出“打倒徐向前”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 具体提出了“打倒”中共中央政治局委员、中共中央军委副主席徐向前的反革命口号（1983 年蒯大富案判决）, cite: ws-1982-12-kuai-dafu-case, quote: true }
    - { voice: official1981, text: 谭震林、陈毅、叶剑英、李富春、李先念、徐向前、聂荣臻等政治局和军委的领导同志，在不同的会议上对“文化大革命”的错误作法提出了强烈的批评, cite: ws-1981-resolution, quote: true }
    - { voice: scholar, text: 红四方面军和西路军的历史使徐向前在延安以后长期处于边缘，研究者认为这也是他在文革中容易被造反派当作“军内走资派”靶子的原因之一。, cite: macfarquhar-schoenhals }
