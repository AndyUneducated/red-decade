  bio: 山东荣成人，1932 年入党，抗战时期在山东做统战和根据地工作。建国后长期在国家建委、经委主持基本建设，1965 年任国家建委主任，负责三线建设施工。文革初陪同刘少奇到北京建筑工业学院，后被揪斗，1969 年复出。1975 年任国务院副总理；1978 年率团考察西欧五国，此后主管对外开放和经济特区筹建，是改革开放初期对外经济工作的主要负责人。2009 年在北京病逝。
  life:
