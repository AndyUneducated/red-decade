  bio: 上海青浦人，商务印书馆学徒出身，1925 年入党，遵义会议后赴莫斯科，延安时期任中组部长。建国后主管财经，是计划经济的主要设计者，1956 年起为中共中央副主席。1957 年“反冒进”和 1962 年主张包产到户、估计“非常时期”受毛泽东批评，此后长期养病，文革中失去副主席职务，1969 年疏散到南昌。1978 年十一届三中全会复出任中央副主席、中纪委第一书记，主持经济调整，此后是改革时期主张“计划为主”的元老，1995 年在北京病逝。
  life:
