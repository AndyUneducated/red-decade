  bio: 陕北绥德人，1927 年入党，1931 年在天津被捕，1936 年作为“六十一人”之一出狱。抗战时期在太岳区工作，建国后主持中组部日常工作近十八年，1956 年任部长。1953 年他私拟政治局名单被高岗利用，受毛泽东批评。文革中被定为“叛徒”，关押多年，1978 年平反，1980 年病逝。
  life:
    - h: 被捕与出狱
      from: 1909
      to: 1937
      text: |
        1909 年生于陕西绥德（今子洲县），在绥德师范读书时参加学生运动，1927 年入党。1931 年在天津被捕，关押在北平草岚子监狱，1936 年按北方局决定与薄一波等一同办理出狱手续。
      verify: true
      cites: [klein-clark-1971, ws-1968-liu-case-report]
    - h: 太岳与中组部
      from: 1937
      to: 1956
      text: |
        出狱后在山西参加牺盟会和决死队工作，任太岳区党委书记等职。1949 年后任中央组织部副部长，主持日常工作，兼任中央人事部部长。1953 年全国财经会议期间，他私下草拟了一份政治局委员名单，被高岗拿去散布，毛泽东为此批评了他，此事成为高饶事件的一个环节。
      verify: true
      cites: [klein-clark-1971, macfarquhar-schoenhals]
    - h: 部长与“叛徒”
      from: 1956-11
      to: 1980
      text: |
        1956 年 11 月任中央组织部部长。1966 年被康生点名，1967 年随“六十一人案”被定为叛徒，被撤职关押。据起诉书，1968 年 1 月康生指使郭玉峰诬陷 1937 年以后历任中组部长“张闻天、陈云、彭真、邓小平、安子文是‘叛徒’、‘特务’、‘三反分子’或是‘双料货’”，并提出把中组部“彻底解散，宣布撤销”。1967 年起的大批判文章还称他为“大叛徒安子文”。1978 年 12 月 75 号文件否定“六十一人案”，他获平反，1980 年 1 月 25 日在北京病逝。
      cites: [ws-1980-indictment, ws-1967-11-24-countryside, ws-1980-02-29-liu-rehab]
      verify: true
  assess:
    - { voice: official1966, text: 一九五○年一月，他在对大叛徒安子文的黑“指示”中（1967 年《红旗》社论）, cite: ws-1967-11-24-countryside, quote: true }
