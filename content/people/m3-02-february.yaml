  rank: { rank: 中华人民共和国元帅, date: 1955-09-27 }
  bio: 四川江津人，留法勤工俭学时入党，黄埔军校政治教官，红一军团政委，抗战中创建晋察冀根据地。建国后主管国防科技，领导“两弹一星”。1967 年 2 月参与对中央文革的抗争，被列入“二月逆流”；1968 年林彪、江青借“华北山头主义”批判打击他，1969 年疏散到邯郸。1977 年恢复政治局委员，1992 年在北京病逝，是最后一位去世的元帅。
  life:
    - h: 留法与黄埔
      from: 1899
      to: 1927
      text: |
        1899 年生于四川江津的农户家庭。1919 年赴法勤工俭学，在工厂做工，1922 年加入旅欧中国少年共产党，1923 年转为中共党员，后到莫斯科东方大学和红军学校学习。1925 年回国任黄埔军校政治部秘书兼政治教官，1927 年参加南昌起义、广州起义。据 1980 年刘少奇平反报告，南昌起义前他曾受周恩来派遣到庐山向刘少奇传达起义决定。
      verify: true
      cites: [klein-clark-1971, ws-1980-02-29-liu-rehab]
    - h: 红一军团与晋察冀
      from: 1931
      to: 1949
      text: |
        1932 年起任红一军团政委，与军团长林彪搭档，参加长征。抗战初任八路军一一五师副师长，平型关战役后率部留在五台山区，创建晋察冀军区并任司令员兼政委十一年。解放战争中任华北军区司令员，指挥平津战役中的华北部队。
      verify: true
      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 国防科技
      from: 1949
      to: 1966
      text: |
        建国后任华北军区司令员、北京市长、代总参谋长。1956 年 11 月任国务院副总理，1958 年起兼国防科委和国家科委主任，主管导弹和原子弹研制。1964 年 10 月第一颗原子弹爆炸，1966 年 10 月导弹核武器试验成功。1966 年 4 月批判罗瑞卿的报告专门提到，罗瑞卿“否认聂荣臻同志直接领导的国防科委所取得的重大成就”。
      cites: [ws-1966-04-luo-report]
      verify: true
    - h: 二月逆流与“华北山头主义”
      from: 1966-08
      to: 1976
      text: |
        1966 年 8 月当选政治局委员。1967 年初在军委会议上与叶剑英、徐向前一同反对冲击军队，后被列入“二月逆流”。据起诉书，1968 年 4 月林彪指令北京部队召开党委扩大会，批判所谓“华北山头主义”，“江青、陈伯达诬陷聂荣臻是‘华北山头主义’的后台，阴谋打倒聂荣臻”；11 月黄永胜说他“这一辈子也没有干什么好事”；1971 年 1 月江青又说华北是“坏人当了道”。九大只当选中央委员，1969 年 10 月疏散到河北邯郸。九一三事件后回京，参加军委工作。
      cites: [ws-1980-indictment, ws-1981-resolution]
      verify: true
    - h: 晚年
      from: 1977
      to: 1992
      text: |
        1977 年 8 月十一大重新当选政治局委员，1985 年 9 月退出，1987 年卸任军委副主席。1989 年春与徐向前联名表态，要求军队不对群众开枪，此后又表示支持戒严（两次表态的措辞与先后以当时报道为准）。1992 年 5 月 14 日在北京病逝。
      verify: true
      cites: [vogel-deng]
  assess:
    - { voice: doc, text: 林彪、聂荣臻同志不同意罗瑞卿提出的在国防工业中马上取消军代表的主张（1966 年批判罗瑞卿报告）, cite: ws-1966-04-luo-report, quote: true }
    - { voice: judicial1980, text: 江青、陈伯达诬陷聂荣臻是“华北山头主义”的后台，阴谋打倒聂荣臻（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
