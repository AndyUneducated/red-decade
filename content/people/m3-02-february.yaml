  bio: 湖南攸县人，店员出身，1926 年入党，参加湘赣边秋收暴动后上井冈山，长期在闽西、新四军和华东战场任职，1949 年后主政浙江，1959 年起任国务院副总理主管农业。1967 年 2 月 16 日怀仁堂碰头会上当面痛斥张春桥，是“二月逆流”中言辞最激烈的一个，此后被打倒，九大落选中央委员，1969 年疏散到桂林。1973 年十大恢复中央委员，1975 年任全国人大常委会副委员长，1983 年在北京病逝。
  life:
    - h: 店员与井冈山
      from: 1902
      to: 1937
      text: |
        1902 年生于湖南攸县，少年时在书店当学徒、店员，参加工人运动，1926 年入党。1927 年参加湘赣边秋收暴动，次年上井冈山，在红四军中任党代表、政治部主任。后到闽西任红十二军政委、福建军区司令员。1934 年主力长征后留在闽西坚持三年游击战争。
      verify: true
      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 新四军、华东与浙江
      from: 1938
      to: 1954
      text: |
        抗战时期任新四军第三支队副司令员、第六师师长兼政委，在苏南、苏中作战。解放战争中任华东野战军副政委，参加淮海、渡江战役，淮海战役总前委五位成员之一。1949 年 5 月起任中共浙江省委书记、浙江军区政委，1952 年调华东局。
      verify: true
      cites: [klein-clark-1971]
    - h: 主管农业
      from: 1954
      to: 1966
      text: |
        1954 年调中央，1956 年八大当选中央书记处书记，1958 年 5 月增选政治局委员，1959 年 4 月任国务院副总理，后兼国务院农林办公室主任，是大跃进中农业“高产”宣传的主要组织者之一，也在 1960 年后参与农村政策调整。
      verify: true
      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 怀仁堂与“二月逆流”
      from: 1967-01
      to: 1973
      text: |
        1967 年 1 月农林口各部被造反派夺权，他本人被揪斗。2 月 16 日周恩来在怀仁堂主持政治局碰头会，他当着张春桥的面质问陈丕显为何被揪，据多种记述说：“你们的目的，就是要整掉老干部”，并起身要退出会场，被陈毅劝住（转述，原话以王年一、MacFarquhar 等引述为准）。次日他写信给林彪表示要“斗争到底”。2 月 18 日毛泽东召集会议严厉批评这次“大闹怀仁堂”，此后他被停职检讨，成为“二月逆流”的头号人物。1981 年历史决议把这次抗争列为对“文化大革命”错误作法的“强烈的批评”。九大未被选为中央委员，1969 年 10 月按“一号命令”疏散到广西桂林。
      cites: [ws-1981-resolution, ws-1969-04-ninth-report, wang-nianyi-turmoil, macfarquhar-schoenhals]
      verify: true
    - h: 复出
      from: 1973
      to: 1983
      text: |
        1973 年 8 月十大上重新当选中央委员，1975 年 1 月四届人大当选全国人大常委会副委员长。1980 年的起诉书称，上海方面曾“搜集、编造了诬陷叶剑英、李先念、陈云、陈毅、聂荣臻、李富春、谭震林等的材料共七十六份”。1982 年任中央顾问委员会副主任，1983 年 9 月 30 日在北京病逝。
      cites: [ws-1980-indictment]
      verify: true
  assess:
    - { voice: official1966, text: 这股逆流，矛头对着以毛主席为首的无产阶级司令部（1969 年九大报告）, cite: ws-1969-04-ninth-report, quote: true }
    - { voice: official1981, text: 一九六七年二月前后，谭震林、陈毅、叶剑英、李富春、李先念、徐向前、聂荣臻等政治局和军委的领导同志，在不同的会议上对“文化大革命”的错误作法提出了强烈的批评，但被诬为“二月逆流”而受到压制和打击（1981 年历史决议）, cite: ws-1981-resolution, quote: true }
    - { voice: judicial1980, text: 搜集、编造了诬陷叶剑英、李先念、陈云、陈毅、聂荣臻、李富春、谭震林等的材料共七十六份，一千一百六十三页（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: scholar, text: 研究者多把怀仁堂冲突看作老干部唯一一次在正式会议上集体正面反对中央文革；毛泽东的震怒使此后几年政治局实际停摆，由中央文革碰头会取代。, cite: macfarquhar-schoenhals }
