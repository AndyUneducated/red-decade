    - { title: 副委员长, orgName: 全国人民代表大会常务委员会, from: 1980, to: 1983-06, cite: rmrb-1984-02-14-su-yu }
    - { title: 常委, orgName: 中央顾问委员会, from: 1982-09, to: 1984-02-05, cite: rmrb-1984-02-14-su-yu }
  bio: 湖南会同人。参加南昌起义，跟随朱德、陈毅上井冈山；红军主力长征后在浙南坚持三年游击战争。抗战和解放战争中长期辅助陈毅指挥华东部队，指挥苏中战役、豫东战役，是淮海战役总前委成员。1954–1958 年任总参谋长，1955 年授大将。1958 年后任国防部副部长、军事科学院第一政委；文革中任国务院业务组成员，分管交通、港口。1984 年在北京去世。
  life:
    - h: 从南昌到淮海
      from: 1907-08-10
      to: 1949-10
      text: |
        1926 年在常德加入共青团，1927 年参加南昌起义，起义失败后“坚决地跟随朱德、陈毅同志”，1928 年上井冈山。1935 年率挺进师进入浙南，与中央失去联系，坚持三年游击战争。此后历任新四军第一师师长、华中野战军司令员、华东野战军副司令员和代司令员，1948 年 11 月作为总前委成员直接指挥华东野战军参加淮海战役。
      cites: [rmrb-1984-02-14-su-yu]
      verify: true
    - h: 总参谋长
      from: 1951
      to: 1958
      text: |
        1951 年起任副总参谋长，1954 年至 1958 年任总参谋长，1955 年授大将军衔。1958 年军委扩大会议上他受到批判，被免去总参谋长职务；1984 年的生平只写“1958年以后，粟裕同志任国防部副部长，军事科学院副院长”，没有提批判。
      cites: [rmrb-1984-02-14-su-yu]
      verify: true
    - h: 军事科学院与业务组
      from: 1958
      to: 1976-10
      text: |
        1958 年以后任国防部副部长、军事科学院副院长、第一政委，协助叶剑英创建军事科学院。生平说他“针对林彪一伙对毛泽东军事思想的严重歪曲，提出要学习和运用军事辩证法”。文革中任国务院业务组成员，在周恩来领导下分管交通、邮电和港口建设。1980 年起诉书把他列入“被诬陷的中共中央委员、候补中央委员”名单。
      cites: [rmrb-1984-02-14-su-yu, ws-1980-indictment]
    - h: 晚年
      from: 1976-10
      to: 1984-02-05
      text: |
        1980 年当选五届全国人大常委会副委员长，1982 年任中顾委常委。因重病退出第一线后继续整理战争经验。1984 年 2 月 5 日在北京去世。
      cites: [rmrb-1984-02-14-su-yu]
  assess:
    - { voice: officialLater, text: 在十年动乱中，粟裕同志曾任国务院业务组成员。他在周恩来同志直接领导下，分管交通、邮电和港口建设，在极其复杂困难的情况下，坚决抵制了“四人帮”对国民经济的干扰破坏（1984 年生平）, cite: rmrb-1984-02-14-su-yu, quote: true }
    - { voice: judicial1980, text: 被诬陷的中共中央委员、候补中央委员还有：……萧劲光、粟裕、肖克（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 生平从“1954年至1958年，任总参谋长”直接接到“1958年以后”，中间的军委扩大会议批判没有写；对他的公开平反要到 1994 年。, cite: rmrb-1984-02-14-su-yu }
  factions: [marshals]
  fate:
    - { date: 1954, s: power, note: 总参谋长, cite: rmrb-1984-02-14-su-yu }
    - { date: 1958, s: sidelined, note: 军委扩大会议受批判，免去总参谋长, verify: true }
    - { date: 1980, s: restored, note: 五届全国人大常委会副委员长, cite: rmrb-1984-02-14-su-yu }
    - { date: 1984-02-05, s: dead, verify: true }
  cites: [rmrb-1984-02-14-su-yu, ws-1980-indictment]

- id: xiao-hua
  name: 萧华
