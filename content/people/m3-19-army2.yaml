  bio: 湖北黄安人，1927 年参加黄麻起义，1929 年参加红军。西路军失败后被俘，越狱归队。抗战时组建“秦赖支队”，1951 年任第十五军军长率部入朝，1952 年指挥上甘岭战役。1957 年起任昆明军区司令员，文革中受迫害；1973 年复出任成都军区司令员，1975 年起在北京军区任第二政委、第一政委、司令员十二年，1984 年任国庆阅兵总指挥。1987 年进入政治局，1988 年任国务委员兼国防部长、授上将。1993 年任全国人大常委会副委员长，1997 年在北京去世。
  life:
    - h: 从黄麻到上甘岭
      from: 1927
      to: 1953-06
      text: |
        1927 年加入赤卫队，参加黄麻起义，1929 年 8 月参加红军，1930 年入党。西路军失败后在祁连山打游击，被俘后在狱中组织党支部，“终于逃离虎口”。抗战中组建“秦赖支队”。1949 年 2 月任第二野战军十五军军长，1951 年率部入朝，1952 年 10 月直接指挥上甘岭战役，“与６万之敌浴血奋战４３昼夜”。
      cites: [xinhua-1997-qin-jiwei]
      verify: true
    - h: 昆明军区
      from: 1953-06
      to: 1973-07
      text: |
        回国后历任云南军区、昆明军区副司令员，1957 年从南京军事学院毕业后任昆明军区司令员、云南省委书记处书记。“在‘文化大革命’中，他遭到林彪、江青一伙的迫害。”1980 年起诉书把他列入被诬陷、迫害的“中国人民解放军高级干部”名单。
      cites: [xinhua-1997-qin-jiwei, ws-1980-indictment]
    - h: 北京军区
      from: 1973-07
      to: 1988-04
      text: |
        1973 年 7 月恢复工作，任成都军区司令员；1975 年 10 月至 1987 年 11 月先后任北京军区第二政委、第一政委、司令员。1981 年组织华北军事大演习，1984 年任国庆三十五周年阅兵总指挥。1987 年 11 月当选十三届政治局委员。
      cites: [xinhua-1997-qin-jiwei]
    - h: 国防部长
      from: 1988-04
      to: 1997-02-02
      text: |
        1988 年 4 月任国务委员、中央军委委员、国防部长，9 月授上将。1989 年戒严期间他是国防部长，官方生平这一段只写“多次率团出访”。1993 年 3 月当选第八届全国人大常委会副委员长，1997 年 2 月 2 日在北京去世。
      cites: [xinhua-1997-qin-jiwei]
  assess:
    - { voice: officialLater, text: 在“文化大革命”中，他遭到林彪、江青一伙的迫害。为了党和人民的利益，他对林彪、江青反革命集团的倒行逆施进行了坚决的抵制和斗争（新华社生平，1997 年）, cite: xinhua-1997-qin-jiwei, quote: true }
    - { voice: judicial1980, text: 中国人民解放军高级干部：……杨嘉瑞、秦基伟、胡荣贵（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 生平从 1988 年任国防部长直接写到 1993 年当选人大副委员长，没有提 1989 年戒严和清场。, cite: xinhua-1997-qin-jiwei }
  factions: [provincial, reform]
  fate:
    - { date: 1957, s: power, note: 昆明军区司令员, cite: xinhua-1997-qin-jiwei }
    - { date: 1967, s: attacked, note: 遭林彪、江青一伙迫害（年份待核）, verify: true }
    - { date: 1973-07, s: restored, note: 成都军区司令员, cite: xinhua-1997-qin-jiwei }
    - { date: 1988-04, s: power, note: 国务委员兼国防部长, cite: xinhua-1997-qin-jiwei }
