    - { date: 1987-11, s: power, note: 总政治部主任, cite: xinhua-2013-yang-baibing }
    - { date: 1992-10, s: sidelined, note: 进入政治局，离开军委, cite: xinhua-2013-yang-baibing }
    - { date: 2013-01-15, s: dead, cite: xinhua-2013-yang-baibing }
