    - { title: 副主席, orgName: 中国人民政治协商会议全国委员会, from: 1983-06, to: 1985-08-12, cite: people-xiao-hua }
  bio: 江西兴国人，1930 年入党，17 岁任“少共国际师”政委，长征中协助刘伯承与彝族首领小叶丹结盟。抗战时任八路军一一五师政治部主任，解放战争中指挥长春围困战。1950 年起任空军政委、总政治部副主任、总干部部部长，1964 年任总政治部主任，1965 年写成《长征组歌》。1966 年 2 月部队文艺工作座谈会纪要说他和杨成武“指示我们一定要按照江青同志的意见办”；1967 年起被关押七年。1975 年复出，1983 年任全国政协副主席，1985 年去世。
  life:
    - h: 少共国际师
      from: 1916-01-21
      to: 1949-10
      text: |
        1928 年入共青团，参加兴国暴动，1930 年调入红军并入党。1933 年 8 月任“少共国际师”第一任政委。长征中协助刘伯承同彝族首领小叶丹“歃血结盟”。抗战时任八路军一一五师政治部主任、东进抗日挺进纵队司令员，解放战争中与萧劲光指挥长春围困战，提出“攻心为上，攻城为下”。
      verify: true
    - h: 总政治部
      from: 1950-03
      to: 1967
      text: |
        1950 年 3 月任空军政委，后任总政治部副主任，1956 年任总干部部部长，1959 年任中央军委副秘书长，1964 年 9 月任总政治部主任、中央军委常委。“1965年创作完成《长征组歌》”。1966 年 2 月江青在上海召开部队文艺工作座谈会，纪要说“萧华同志和杨成武同志，对这次座谈都表示热情赞助和支持，指示我们一定要按照江青同志的意见办”。
      cites: [people-xiao-hua, ws-1966-03-army-arts]
    - h: 关押
      from: 1967
      to: 1975-07
      text: |
        “‘文化大革命’中受到林彪、江青一伙的迫害，被非法关押7年之久。”1967 年 1 月他被江青等点名，总政治部随即被改组，具体经过没有进入本站已收的文件。1980 年起诉书把他列入“被诬陷的中共中央委员、候补中央委员”名单。
      cites: [people-xiao-hua, ws-1980-indictment]
      verify: true
    - h: 复出
      from: 1975-07
      to: 1985-08-12
      text: |
        1975 年 7 月恢复工作，任军事科学院第二政委；1977 年 4 月调任兰州军区政委兼甘肃省委书记。1983 年 6 月当选第六届全国政协副主席，1985 年 8 月 12 日在北京病逝。
      cites: [people-xiao-hua]
  assess:
    - { voice: doc, text: 萧华同志和杨成武同志，对这次座谈都表示热情赞助和支持，指示我们一定要按照江青同志的意见办（1966 年部队文艺工作座谈会纪要）, cite: ws-1966-03-army-arts, quote: true }
    - { voice: officialLater, text: “文化大革命”中受到林彪、江青一伙的迫害，被非法关押7年之久。（人民网“开国将帅名录”）, cite: people-xiao-hua, quote: true }
    - { voice: editor, text: 1966 年的纪要把他写成支持江青的总政治部主任，一年后他被江青点名打倒；两份文本相隔不到一年。, cite: ws-1966-03-army-arts }
  factions: [marshals]
  fate:
    - { date: 1964-09, s: power, note: 总政治部主任, cite: people-xiao-hua }
    - { date: 1967, s: detained, note: 被关押七年, cite: people-xiao-hua }
    - { date: 1975-07, s: restored, note: 军事科学院第二政委, cite: people-xiao-hua }
    - { date: 1985-08-12, s: dead, cite: people-xiao-hua }
  cites: [people-xiao-hua, ws-1966-03-army-arts, ws-1980-indictment]

- id: yang-yong
  name: 杨勇
  died: 1983-01-06
  deathKind: natural
