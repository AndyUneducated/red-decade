    - { title: 委员, orgName: 中共中央政治局, from: 1956-09, to: 1982-09, cite: rmrb-1986-10-17-liu-bocheng }
    - { title: 副委员长, orgName: 全国人民代表大会常务委员会, from: 1959-04, to: 1983-06, cite: rmrb-1986-10-17-liu-bocheng }
    - { title: 副主席, orgName: 中共中央军事委员会, from: 1966-01, to: 1982-09, note: 止点待核, cite: rmrb-1986-10-17-liu-bocheng }
  bio: 四川开县人，早年是川军将领，1916 年作战中失去右眼。1926 年入党，参与领导泸顺起义、南昌起义，长征中任红军总参谋长。抗战时任八路军一二九师师长，与政委邓小平创建晋冀豫根据地，此后“刘邓”并称，指挥中原野战军、第二野战军。1950 年底起创办军事学院，1955 年授元帅。1966 年 1 月起任中央军委副主席，文革中身患重病。1986 年在北京去世。
  life:
    - h: 川中名将
      from: 1892-12-04
      to: 1926-05
      text: |
        1911 年参加响应辛亥革命的学生军，此后在护国、护法战争中历任连长、旅参谋长、团长，“1916年3月在攻克丰都县城的作战中右眼中弹致残”，被誉为“川中名将”。1923 年结识杨闇公、吴玉章，1924 年起随吴玉章考察，接受马克思主义。
      cites: [rmrb-1986-10-17-liu-bocheng]
    - h: 刘邓
      from: 1926-05
      to: 1950-12
      text: |
        1926 年 5 月入党，同年 12 月与杨闇公、朱德发动泸州、顺庆起义；1927 年任南昌起义参谋团参谋长；长征中任红军总参谋长。抗战时任八路军一二九师师长，1938 年起“与政治委员邓小平、副师长徐向前等”指挥作战，创建晋冀豫抗日根据地。解放战争中与邓小平率部千里跃进大别山，参加淮海战役和西南战役。
      cites: [rmrb-1986-10-17-liu-bocheng]
    - h: 军事学院
      from: 1950-12
      to: 1966-01
      text: |
        1950 年底出任军事学院院长，后兼政治委员，主张“治军必先治校”，在学院陆续开设海军、空军、炮兵、装甲兵等系。1957 年 9 月调任高等军事学院院长兼政委，1959 年后负责军委战略小组。1958 年军委扩大会议反“教条主义”时他是被批评的对象之一，此后辞去军事学院职务；1986 年的生平没有提这件事。
      cites: [rmrb-1986-10-17-liu-bocheng]
      verify: true
    - h: 文革与晚年
      from: 1966-01
      to: 1986-10-07
      text: |
        1966 年 1 月起任中央军委副主席。1980 年起诉书说，谢富治等制造“中国（马列）共产党”假案时，把他和朱德、陈毅、叶剑英等一起列为“参加的”人，诬陷他们“里通外国”。1977 年 7 月十届三中全会公报写“政治局委员刘伯承同志因病请假”。1982 年后因年龄和健康原因不再担任领导职务，1986 年 10 月 7 日在北京去世。
      cites: [ws-1980-indictment, ws-1977-07-tenth-third-plenum, rmrb-1986-10-17-liu-bocheng]
  assess:
    - { voice: officialLater, text: “文化大革命”中，他对林彪、江青反革命集团反党乱军的活动进行了坚决抵制和斗争，虽然身患重病，仍然关心党和国家的前途和命运。（1986 年生平）, cite: rmrb-1986-10-17-liu-bocheng, quote: true }
    - { voice: judicial1980, text: 参加的有董必武、叶剑英、李先念、贺龙、刘伯承、徐向前、聂荣臻、谭震林、余秋里、王震、廖承志等，诬陷他们“里通外国”，“准备武装叛乱”，要搞“政变”。（1980 年起诉书，“马列共产党”假案一条）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 生平写他在文革中“坚决抵制和斗争”，但没有举出具体事例；本站收录的文革文件里，他只出现在名单和请假记录中。, cite: rmrb-1986-10-17-liu-bocheng }
  factions: [marshals]
  fate:
    - { date: 1955-09, s: power, note: 授元帅, cite: rmrb-1986-10-17-liu-bocheng }
    - { date: 1966-01, s: power, note: 中央军委副主席, cite: rmrb-1986-10-17-liu-bocheng }
    - { date: 1982-09, s: sidelined, note: 因年龄和健康原因退出领导职务, verify: true }
    - { date: 1986-10-07, s: dead, verify: true }
  cites: [rmrb-1986-10-17-liu-bocheng, ws-1980-indictment, ws-1977-07-tenth-third-plenum]

- id: su-yu
  name: 粟裕
  born: 1907-08-10
  died: 1984-02-05
