  cites: [xinhua-1997-qin-jiwei, ws-1980-indictment]

- id: yang-baibing
  name: 杨白冰
  aka: [杨尚正]
  born: 1920-09-09
  died: 2013-01-15
  deathKind: natural
  deathPlace: 北京
  tier: 2
  role1966: 成都军区政治部副主任
  pinyin: Yáng Báibīng
  gender: m
  birthplace: 重庆
  positions:
    - { title: 政治委员, orgName: 北京军区, from: 1985-06, to: 1987-11, cite: xinhua-2013-yang-baibing }
    - { title: 主任, orgName: 中国人民解放军总政治部, from: 1987-11, to: 1992-10, cite: xinhua-2013-yang-baibing }
    - { title: 秘书长, orgName: 中共中央军事委员会, from: 1989-11, to: 1992-10, cite: xinhua-2013-yang-baibing }
    - { title: 委员, orgName: 中共中央政治局, from: 1992-10, to: 1997-09, cite: xinhua-2013-yang-baibing }
  bio: 杨尚昆之弟，原名杨尚正，1920 年生于重庆。1938 年到延安入党，长期做部队政治工作，1960 年任成都军区政治部副主任。文革中被诬为“反革命”逮捕关押八年。1979 年复出，1985 年任北京军区政委，1987 年任总政治部主任，1989 年 11 月起兼中央军委秘书长，1992 年十四大进入政治局，同时离开军委。2013 年在北京去世。
  life:
    - h: 政治工作
      from: 1938-01
      to: 1966
      text: |
        受四哥杨闇公、五哥杨尚昆影响，1938 年 1 月奔赴延安，3 月入党。抗战中在一二九师政治部工作，解放战争中随部进军大别山，任中原野战军、第二野战军组织部门干部。1955 年 6 月任成都军区政治部组织部部长，1960 年 10 月任成都军区政治部副主任。
      cites: [xinhua-2013-yang-baibing]
      verify: true
    - h: 关押八年
      from: 1966
      to: 1979-04
      text: |
        生平说他“遭受残酷迫害，被诬陷为‘反革命’逮捕关押８年”，没有写起止年份。此时杨尚昆已作为“彭罗陆杨”之一被打倒。
      cites: [xinhua-2013-yang-baibing]
      verify: true
    - h: 总政治部与 1989
      from: 1979-04
      to: 1992-10
      text: |
        1979 年 4 月任北京军区政治部副主任，1982 年 10 月任副政委，1985 年 6 月任北京军区政委。1987 年 11 月任总政治部主任，1988 年 4 月任国家军委委员，9 月授上将；1989 年 11 月至 1992 年 10 月任中央军委秘书长兼总政治部主任。1989 年戒严时杨尚昆任国家主席、军委第一副主席，他任总政治部主任；生平只说“面对国际国内的复杂形势，为加强军队建设做了大量卓有成效的工作”。
      cites: [xinhua-2013-yang-baibing]
    - h: 离开军委
      from: 1992-10
      to: 2013-01-15
      text: |
        1992 年 10 月十四届一中全会当选政治局委员，同时不再担任中央军委秘书长和总政治部主任。2013 年 1 月 15 日在北京去世。
      cites: [xinhua-2013-yang-baibing]
  assess:
    - { voice: officialLater, text: “文化大革命”中，杨白冰同志遭受残酷迫害，被诬陷为“反革命”逮捕关押８年。（新华社生平，2013 年）, cite: xinhua-2013-yang-baibing, quote: true }
    - { voice: editor, text: 生平对 1989 年只写“面对国际国内的复杂形势”；1992 年他进入政治局却离开军委，生平也没有解释。, cite: xinhua-2013-yang-baibing }
  factions: [reform]
  fate:
