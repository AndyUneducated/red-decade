# M3 people round 2, batch 19: 军队二。刘伯承、粟裕（元帅、大将），萧华、杨勇、廖汉生、许光达、张爱萍、王尚荣（文革中被关押的总部和大军区领导），
# 秦基伟、杨白冰（1980 年代的军队领导，1989 年分别任国防部长、总政治部主任）。
# Texts: 1980 年起诉书（被诬陷的中央委员名单、军队高级干部名单、黄永胜“总参出了不少坏人”），1966 年部队文艺工作座谈会纪要，
# 1977 年十届三中全会公报，《人民日报》1979 年许光达文、1983 年杨勇悼词、1984 年粟裕生平、1986 年刘伯承生平，
# 新华社秦基伟、张爱萍、廖汉生、杨白冰生平，人民网“开国将帅名录”萧华、王尚荣条。

- id: liu-bocheng
  name: 刘伯承
  born: 1892-12-04
  died: 1986-10-07
  deathKind: natural
