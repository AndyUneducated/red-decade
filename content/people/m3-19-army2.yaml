    - { title: 副总参谋长, orgName: 中国人民解放军总参谋部, from: 1977-09, to: 1983-01-06, verify: true }
  bio: 湖南浏阳文家市人，1930 年入党，长征中率部突破湘江封锁线。抗战时在平型关负伤坚持指挥，后任冀鲁豫军区司令员；解放战争中任第二野战军第五兵团司令员。1953 年入朝，后任志愿军司令员。回国后任北京军区司令员、副总参谋长。文革中被诬陷关押，1972 年后任沈阳军区副司令员、新疆军区司令员，1977 年再任副总参谋长，1978 年彻底平反，后任中央军委常委、副秘书长、中央书记处书记。1983 年去世。生年有 1912、1913 两说，不录。
  life:
    - h: 浏阳到朝鲜
      from: 1927
      to: 1958
      text: |
        童年参加湖南农民运动，1927 年入共青团，1930 年入党并参加红军，长征中“突破湘江封锁线”。抗战中“在平型关大战中，负伤坚持指挥部队”，后任鲁西军区、冀鲁豫军区司令员。解放战争中任晋冀鲁豫野战军第七纵队、第一纵队司令员和第二野战军第五兵团司令员。1949 年后兼任贵州省军区司令员、贵州省人民政府主席，1953 年入朝，任志愿军副司令员、司令员。
      cites: [rmrb-1983-01-16-yang-yong]
    - h: 北京军区
      from: 1958
      to: 1967
      text: |
        回国后任北京军区司令员、副总参谋长，“组织部队开展群众性的练兵活动，获得优异成绩，受到党中央和毛泽东同志的赞扬”。1967 年被撤职关押，具体日期悼词没有写。
      cites: [rmrb-1983-01-16-yang-yong]
      verify: true
    - h: 关押与复出
      from: 1967
      to: 1983-01-06
      text: |
        悼词说他“遭到林彪、江青反革命集团的恶毒诬陷和残酷迫害，在失去自由的艰难困境中坚信胜利，坚持斗争”。1980 年起诉书把他列入“被诬陷的中共中央委员、候补中央委员”名单。林彪事件后重新工作，任沈阳军区副司令员、新疆军区司令员和新疆区党委第二书记，再任副总参谋长；“1978年彻底平反”，任总参党委第二书记、中央军委常委、副秘书长。1982 年十二大当选中央委员和中央书记处书记，1983 年 1 月 6 日去世。
