  birthplace: 四川南溪
  origin: 四川南溪
  deathKind: persecuted
  deathPlace: 北京
  party: 中国共产党
  positions:
    - { title: 副院长兼总导演, orgName: 中央实验话剧院, from: 1956-09, to: 1968-03, cite: dangshi-2012-sun-weishi }
  bio: 中共早期党员孙炳文之女，孙炳文 1927 年被国民党杀害后，周恩来、邓颖超视她如女儿。1937 年到延安，在抗大和马列学院学习，与江青同在延安演过戏；1940 年代在苏联学戏剧。回国后导演《保尔·柯察金》等剧，1956 年提议并参与组建中央实验话剧院，任副院长兼总导演。1966 年被批为“反动学术权威”；1967 年 12 月丈夫金山入狱，她家被抄；1968 年 3 月 1 日以“苏修特务”罪名被关进北京市公安局看守所，10 月 14 日死在狱中，戴着手铐，尸体随即火化，不留骨灰。1977 年平反。生年有 1920、1921 两说，这里不录。
  life:
    - h: 烈士遗孤
      from: 1920
      to: 1946
      text: |
        生于四川南溪，父亲孙炳文是朱德的朋友、周恩来介绍入党的中共党员，1927 年在上海龙华被杀。1936 年化名李琳在上海演戏，认识了金山，也认识了当时叫蓝苹的江青。1937 年到武汉投奔周恩来，随后与母亲任锐同赴延安，进抗大、马列学院；1938 年与江青同演话剧《血祭上海》。此后去苏联学习戏剧。
      verify: true
    - h: 中央实验话剧院
      from: 1946
      to: 1966-05
      text: |
        1950 年代先后任中国青年艺术剧院导演、中央戏剧学院导演干部训练班主任。1956 年 9 月文化部按她的提议组建中央实验话剧院，欧阳予倩任院长，她任副院长兼总导演，导演《同甘共苦》《桃花扇》《一仆二主》《黑奴恨》《大雷雨》等剧。1960 年代初导演据柯切托夫小说改编的话剧《叶尔绍夫兄弟》，在人民大会堂小礼堂内部连演三个月。
      cites: [dangshi-2012-sun-weishi]
      verify: true
    - h: 五角楼
      from: 1966-06
      to: 1968-10-14
      text: |
        1966 年文革开始后她被当作“反动学术权威”批判，但因出身背景，一时没有被关押。1967 年 9 月哥哥孙泱（中国人民大学副校长）被迫害致死；12 月丈夫金山以“特嫌”罪名被关进秦城，她家被抄，大量与中共高层往来的信件、照片被抄走。1968 年 3 月 1 日她以“苏修特务”罪名被捕，与林利、李莎同天被抓，作为所谓“李立三、李莎反革命集团”的同案犯。她被关在北京市公安局看守所的五角楼，10 月 14 日死在那里，死后手铐仍锁着双手。尸体在江青授意下被迅速火化，妹妹孙新世去要骨灰，得到的回答是“不留反革命的骨灰”。
      cites: [dangshi-2012-sun-weishi]
    - h: 平反
      from: 1968-10
      to: 1977-06
      text: |
        1975 年 10 月邓小平对孙新世的申诉批示，“如孙无问题，可以将骨灰放到八宝山”，不久邓小平下台，事情搁置。1977 年 6 月她被平反，6 月 9 日文化部艺术局在八宝山革命公墓为她举行遗像安放仪式。1980 年起诉书和 1981 年判决书都把她列为被迫害致死的著名艺术家。
      cites: [ws-1981-01-25-judgment, ws-1980-indictment]
      verify: true
  assess:
    - { voice: judicial1980, text: 著名作家、艺术家老舍、赵树理、周信芳、盖叫天、潘天寿、应云卫、郑君里、孙维世等人（1981 年判决书所列被迫害致死的社会各界知名人士）, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: officialLater, text: 1968年10月14日，孙维世死在五角楼，死后一副冰冷的手铐依旧锁着双手（2012 年人民网党史频道转载文章，转述 2008 年《党史纵横》）, cite: dangshi-2012-sun-weishi, quote: true }
    - { voice: witness, text: 孙维世的脾气太直太爆了！不然她也不会死得那么惨（邓颖超语，同文转引）, cite: dangshi-2012-sun-weishi, quote: true }
    - { voice: editor, text: 她被捕的直接原因，各种说法都指向江青和叶群，但没有公开的专案材料。1981 年判决书只把她列入被迫害致死的名单，没有写明由谁负责。, cite: ws-1981-01-25-judgment }
  factions: [academics]
