  bio: 生于扬州，长于南通。1930 年代以《十字街头》《马路天使》成名，1939 年去新疆演剧被盛世才关了五年。1949 年后在上海电影制片厂主演《武训传》《李时珍》《林则徐》《聂耳》，1957 年入党。1966 年 10 月 9 日他家是江腾蛟带人抄的五家之一；1967 年 12 月被关押，单独监禁五年多，狱中编号 139。出狱后长期没有角色，1978 年任全国政协委员。1980 年 10 月 8 日《人民日报》发表他在病床上写的《管得太具体 文艺没希望》，两天后他因胰腺癌在北京去世。
  life:
    - h: 从《马路天使》到新疆监狱
      from: 1915
      to: 1949
      text: |
        原名赵凤翱，1915 年生于扬州，祖籍山东肥城，两岁随家迁南通。1931 年考入上海美专学国画，1933 年参加左翼戏剧家联盟，进入电影界，主演《十字街头》《马路天使》。1938 年赴新疆开展戏剧工作，被军阀盛世才关押五年，1944 年获释。战后回上海，在昆仑公司主演《乌鸦与麻雀》等片。
      verify: true
    - h: 抄家与入狱
      from: 1949
      to: 1973
      text: |
        1949 年后主演《武训传》《李时珍》《林则徐》《聂耳》《烈火中永生》。1966 年 10 月 9 日凌晨，江腾蛟组织四十多人冒充红卫兵搜查了他和郑君里、童芷苓、陈鲤庭、顾而已的家。1967 年 11 月底他被上海青年话剧院的造反派批斗殴打，12 月被关押，长期单独监禁，五年多后才放回家。
      cites: [ws-1980-indictment]
      verify: true
    - h: 遗言
      from: 1978
      to: 1980-10-10
      text: |
        1978 年任第五届全国政协委员。他从 1960 年起准备演鲁迅，后来又准备演周恩来，都没有拍成。1980 年 9 月他在病床上写《管得太具体　文艺没希望》，10 月 8 日刊于《人民日报》第五版，两天后病逝。文中说：“如果党管文艺管得太具体，文艺就没有希望，就完蛋了。”
      cites: [rmrb-1980-10-08-zhao-dan]
      verify: true
  assess:
    - { voice: doc, text: 文艺，是文艺家自己的事，如果党管文艺管得太具体，文艺就没有希望，就完蛋了（1980 年 10 月 8 日《人民日报》）, cite: rmrb-1980-10-08-zhao-dan, quote: true }
    - { voice: doc, text: “四人帮”管文艺最具体，连演员身上一根腰带、一个补钉都管，管得八亿人民只剩下八个戏（同上）, cite: rmrb-1980-10-08-zhao-dan, quote: true }
    - { voice: doc, text: 层层把关、审查审不出好作品，古往今来没有一个有生命力的好作品是审查出来的（同上）, cite: rmrb-1980-10-08-zhao-dan, quote: true }
    - { voice: judicial1980, text: 搜查了赵丹、郑君里、童芷苓、陈鲤庭和顾而已的家（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
  factions: [academics]
