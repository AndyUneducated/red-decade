- id: zheng-junli
  name: 郑君里
  born: 1911-12-06
  died: 1969-04-23
  tier: 3
  role1966: 上海电影制片厂导演
  pinyin: Zhèng Jūnlǐ
  gender: m
  ethnicity: 汉族
  aka:
    - { kind: other, name: 郑重 }
    - { kind: other, name: 千里 }
  birthplace: 上海
  origin: 广东中山
  deathKind: persecuted
  deathPlace: 上海
  positions:
    - { title: 导演, orgName: 上海电影制片厂, from: 1949-11, to: 1967-11, cite: ywang-zheng-junli }
  bio: 原籍广东中山，生于上海。南国社出身，1930 年代是联华公司的演员，抗战中参加救亡演剧队，战后在昆仑公司与蔡楚生合导《一江春水向东流》，独立导演《乌鸦与麻雀》。1949 年后任上海电影制片厂导演，拍了《林则徐》《聂耳》《枯木逢春》。1930 年代他与蓝苹（江青）、唐纳相熟。1966 年 10 月 9 日，江腾蛟按叶群的布置带人冒充红卫兵抄了他和赵丹等五家，要找江青当年的信件；1967 年 11 月他被隔离审查，1969 年 4 月 23 日在关押中病死，年 58 岁。
  life:
    - h: 从南国社到昆仑
      from: 1911
      to: 1949
      text: |
        1928 年进南国艺术剧院戏剧科学习，后加入田汉的南国社。1932 年起任联华影业公司演员，演过《新女性》《大路》《迷途的羔羊》。1937 年参加上海救亡演剧三队，后任抗敌剧团副团长。1946 年后任昆仑影业公司导演，与蔡楚生合导《一江春水向东流》，独立导演《乌鸦与麻雀》。
      verify: true
    - h: 抄家
      from: 1949
      to: 1967-11
      text: |
        1949 年后任上海电影制片厂导演，导演《林则徐》《聂耳》《枯木逢春》等片。据 1980 年起诉书，1966 年 10 月叶群对江腾蛟说“江青同志有一封信落在郑君里、顾而已他们手里”，要他“搜查一下郑君里、顾而已、赵丹、童芷芩等五个人的家，凡是书信、日记本、笔记本之类的东西都拿来”。10 月 9 日凌晨，江腾蛟组织的四十多人冒充红卫兵抄了这五家，抄得的东西分两次送到叶群在北京的住处；1967 年 1 月，在江青亲自监视下，其中有关江青的信件、照片被烧毁。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
    - h: 死于关押
      from: 1967-11
      to: 1969-04-23
      text: |
        1967 年 11 月起被隔离审查，此后一直关押，1969 年 4 月 23 日死去。《上海电影志》写作“在‘隔离审查’中倍受折磨，于1969年4月23日死于狱中”；另有记载说他患肝癌，在上海中山医院去世。1981 年判决书把他列为被迫害致死的著名艺术家，并写明 1966 年 10 月的搜查“致使他们受到人身迫害”。
      cites: [ywang-zheng-junli, ws-1981-01-25-judgment]
  assess:
    - { voice: judicial1980, text: 江青勾结叶群，指使江腾蛟在上海非法搜查郑君里、赵丹、顾而已、童芷苓、陈鲤庭五人的家，致使他们受到人身迫害（1981 年判决书）, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: officialLater, text: 郑君里在“隔离审查”中倍受折磨，于1969年4月23日死于狱中（《上海电影志》，1999）, cite: ywang-zheng-junli, quote: true }
    - { voice: editor, text: 判决书只说搜查是为了江青的“一封信”，没有说信的内容。各种回忆都说那是江青 1930 年代在上海的旧信，郑君里早已把它烧掉，这一点无法从公开文书核实。, cite: ws-1980-indictment }
  factions: [academics]
  fate:
    - { date: 1949-11, s: normal, note: 上海电影制片厂导演, verify: true }
    - { date: 1966-10-09, s: attacked, note: 被冒充红卫兵的人抄家, cite: ws-1980-indictment }
    - { date: 1967-11, s: detained, note: 隔离审查, verify: true }
    - { date: 1969-04-23, s: dead, note: 死于关押中, cite: ywang-zheng-junli }
    - { date: 1978, s: restored, note: 平反, verify: true }
  cites: [ywang-zheng-junli, ws-1980-indictment, ws-1981-01-25-judgment]

