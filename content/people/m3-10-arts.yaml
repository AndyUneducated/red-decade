        1955 年主演《南岛风云》，此后演《枯木逢春》《早春二月》《舞台姐妹》等片。1956 年 1 月 10 日毛泽东在上海中苏友好大厦接见了她，此后又多次接见。1962 年被评为“新中国二十二大电影明星”之一。
      cites: [whb-2018-11-23-shangguan-yunzhu]
      verify: true
    - h: 四楼
