  bio: 江苏江阴长泾镇人，1937 年逃难到上海，在照相馆当营业员时进入影剧界。1940 年代在昆仑公司主演《一江春水向东流》《万家灯火》《丽人行》《乌鸦与麻雀》，1949 年后在上影主演《南岛风云》，又演《早春二月》《舞台姐妹》，1962 年被评为“新中国二十二大电影明星”之一。1956 年起多次受毛泽东接见。1965 年底查出乳腺癌，做了两次手术。文革中《早春二月》《舞台姐妹》被批，她被专案组反复审讯、殴打，1968 年 11 月 23 日凌晨从家中四楼跳下身亡，年 48 岁。1978 年 12 月上影为她平反。
