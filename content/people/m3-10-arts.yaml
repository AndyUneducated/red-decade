    - { date: 1956-09, s: normal, note: 中央实验话剧院副院长兼总导演, cite: dangshi-2012-sun-weishi }
    - { date: 1966, s: attacked, note: 被批为“反动学术权威”, cite: dangshi-2012-sun-weishi }
    - { date: 1967-12, s: attacked, note: 金山入狱，家被抄, cite: dangshi-2012-sun-weishi }
    - { date: 1968-03-01, s: detained, note: 以“苏修特务”罪名被捕, cite: dangshi-2012-sun-weishi }
    - { date: 1968-10-14, s: dead, note: 死在北京市公安局看守所, cite: dangshi-2012-sun-weishi }
