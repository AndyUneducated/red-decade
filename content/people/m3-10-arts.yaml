    - { date: 1978, s: restored, note: 第五届全国政协委员, verify: true }
    - { date: 1980-10-08, s: normal, note: 《人民日报》发表《管得太具体　文艺没希望》, cite: rmrb-1980-10-08-zhao-dan }
