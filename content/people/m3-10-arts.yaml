# M3 people, batch 10: film, theatre and opera people who died in, or barely survived, the 1966–68 purges
# of the arts world. Texts: 1980 indictment and 1981 judgment (the 1966-10 Shanghai house searches and the
# list of famous people persecuted to death), 赵丹's 1980 People's Daily article, the 上海电影志 entry on
# 郑君里 (via 王友琴), and later press and memoir pieces kept as excerpts. Dates not in these texts are verify.

- id: sun-weishi
  name: 孙维世
  died: 1968-10-14
  tier: 3
  role1966: 中央实验话剧院副院长兼总导演
  pinyin: Sūn Wéishì
  gender: f
  ethnicity: 汉族
  aka:
    - { kind: other, name: 孙光英 }
