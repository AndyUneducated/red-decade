  bio: 安徽桐城人，黄梅戏旦角，十几岁唱红安庆一带。1953 年进安徽省黄梅戏剧团，1955 年以电影《天仙配》中的七仙女名满全国，1959 年又主演《女驸马》，后任剧团副团长、全国政协委员。文革中被指为“文艺黑线人物”，并被追究 1964 年的所谓“天津黑会”反江青；1968 年 4 月 5 日《红安徽》报点了她的名，连日逼供，搭档王少舫也贴出揭发她的大字报。4 月 7 日夜她服下大量安眠药，8 日清晨死去。剧团的军代表以“肚子里有发报机”为由，当众剖开了她的遗体。1978 年 5 月安徽省委为她平反。
  life:
    - h: 七仙女
      from: 1930
      to: 1965
      text: |
        原名严鸿六，1930 年生于桐城罗岭。十岁学唱黄梅调，因唱戏不容于家族，改艺名凤英，在桐城、怀宁、安庆唱红。1953 年调入安徽省黄梅戏剧团；1954 年在华东区戏曲观摩会演中以《天仙配》获演员一等奖，1955 年电影《天仙配》上映，1959 年主演电影《女驸马》，1963 年主演《牛郎织女》。
      verify: true
    - h: 《红安徽》点名
      from: 1966
      to: 1968-04-08
      text: |
        据她丈夫王冠亚 1988 年对苏晓康的口述，为追究 1964 年的“天津黑会”反江青，1968 年 4 月 5 日《红安徽》报点了她的名，省艺校造反派来逼供。王少舫贴出大字报揭发她，她极为伤心；4 月 7 日写了一夜材料反驳，又找柏龙驹作证被婉拒。当夜她服了大量安眠药、留下绝命书。王冠亚找来医生和军代表，军代表还要录口供，不让医生进门；送到医院后，她于 8 日早上五点死去。
      cites: [su-xiaokang-yan-fengying]
    - h: 剖腹
      from: 1968-04-08
      to: 1978-05
      text: |
        死后不到一小时，剧团领导以“有人检举她是国民党特务，是奉了上级命令自杀而死的”为由，要剖开遗体找“特务工具”。王冠亚拒绝签字。据他后来的文章，剖腹时军代表刘万泉站在下方监视，医生从咽部一直劈到耻骨，只找出一百多粒安眠药。王冠亚写道，江青“委实没到合肥来”，直接责任在剧团里整她的人，而刘万泉后来被评为学习毛泽东思想积极分子。1978 年 5 月 23 日安徽省委为她平反，8 月 21 日举行骨灰安放仪式。
      cites: [su-xiaokang-yan-fengying]
      verify: true
  assess:
