# M9 补人物：1973–1983 年审判文书里的被告。生平只取文书写到的公职、行为与判决，不录住址等私人信息。

- id: zhao-dengcheng
  name: 赵登程
  tier: 3
  role1966: 空军某军副军长
  pinyin: Zhào Dēngchéng
  gender: m
  origin: 河北定县
  bio: 河北定县人，原任空军某军副军长。文革中调公安部，任公安部领导小组、核心小组成员，1968 年 12 月起任“中央专案审查小组第三办公室”副主任，在谢富治授意下与李震制造“中国（马列）共产党”假案，诬陷朱德是这个“党”的“书记”；又替康生、曹轶欧把康生妻妹苏枚的自杀办成“谋杀案”。1969–1971 年率国防科委工作组在九院二二一厂“查破案件”，私设监狱四十余处，五十多人被迫害致死。1972 年 10 月被捕，1983 年被判处有期徒刑十五年。
  life:
    - h: 专案三办
      from: 1968-05
      to: 1969-08
      text: |
        1968 年 5 月起主管所谓“苏枚案”：康生的妻妹、中央政法干校政治部副主任苏枚 1967 年 4 月服安眠药自杀，康生、曹轶欧硬说是“反革命谋杀”。他与公安部副部长李震给康生、曹轶欧写报告，说这是副校长石磊“策划主谋”、医生闻伯俊“以医疗为掩护”的阴谋，对四名被拘押者刑讯逼供，六十多名干部和家属受株连。1968 年 12 月任专案三办副主任后，逼供经济研究所见习研究员周慈敖等，制造“中国（马列）共产党”假案，诬陷朱德、陈毅、李富春、叶剑英等是其成员。1969 年 4 月朱德等当选九届中央委员，他仍对办案人说“不要动摇，要继续搞下去”。
      cites: [ws-1983-zhao-dengcheng-case]
    - h: 二二一厂
      from: 1969-11
      to: 1971-11
      text: |
        与国防科委副主任赵启民任国防科委工作组负责人，到九院二二一厂（核武器研制基地）“查破案件”，说“不杀人打不开局面”，私设监狱四十余处，自制手铐二百余副，制造“国民党西北派遣军”“赵传国反革命阴谋集团”等假案。九院副院长王志刚、矿区公安局长黄启之、电厂党委书记李建华被迫害致死，副教授钱晋在批斗中被打死。起诉书统计，二二一厂和九〇二地区四千余人被隔离审查、关押，三百余人伤残，五十余人死亡。
      cites: [ws-1983-zhao-dengcheng-case]
    - h: 受审
      from: 1972-10-18
      to: 1983
      text: |
        1972 年 10 月 18 日被逮捕。1983 年 2 月北京市人民检察院分院以阴谋颠覆政府罪、诬告陷害罪起诉，法院判处有期徒刑十五年，剥夺政治权利三年。
      cites: [ws-1983-zhao-dengcheng-case]
  assess:
    - { voice: judicial1980, text: “‘八大’王明选为中央委员，‘九大’王效禹选为中央委员，不是垮台了吗？！不要动摇，要继续搞下去！”（他对办案人员说，判决书引）, cite: ws-1983-zhao-dengcheng-case, quote: true }
  factions: [ccrg]
  fate:
    - { date: 1968-12, s: power, note: 中央专案审查小组第三办公室副主任, cite: ws-1983-zhao-dengcheng-case }
    - { date: 1972-10-18, s: detained, note: 被逮捕, cite: ws-1983-zhao-dengcheng-case }
    - { date: 1983, s: detained, note: 判处有期徒刑十五年, cite: ws-1983-zhao-dengcheng-case }
  cites: [ws-1983-zhao-dengcheng-case]

- id: qi-jinghe
  name: 齐景和
  tier: 3
  role1966: 康生的秘书
  pinyin: Qí Jǐnghé
  gender: m
  origin: 河北平山
  bio: 河北平山人，康生的秘书。文革中兼任中央专案审查小组第一办公室“刘仁专案组”和“彭真、刘仁专案组”副组长，按康生的意图写报告诬陷王光美是“美国女特务”、刘仁“充当了日本特务”，1968 年 1 月他的报告促成康生批示把刘仁、冯基平、徐子荣、崔月犁“铐起来”关进监狱；刘仁、徐子荣死于狱中。他还写报告诬陷贺龙组织“反革命‘地下军’”。1976 年 10 月任中组部干部组负责人。1983 年 11 月被判处有期徒刑十七年。
  life:
    - h: 刘仁专案组
      from: 1967-08
      to: 1968-05
      text: |
        1967 年 8 月起多次向康生写报告，说刘仁的“要害是三特问题”，把 1945 年经批准允许美军情报人员到解放区参观一事说成与美特“进行政治交易”。1968 年 3 月至 5 月主持写了三份报告，诬陷王光美是“美国女特务”，刘少奇与王光美结婚是“勾结美帝国主义”的阴谋。1968 年 1 月 3 日他把北京市公安局对敌斗争的正常工作说成出卖情报；次日康生批示逮捕，刘仁、崔月犁、冯基平、徐子荣 1 月 9 日被加铐关进监狱。徐子荣 1969 年 6 月、刘仁 1973 年 10 月死于狱中。
      cites: [ws-1983-qi-jinghe-case]
    - h: 贺龙“地下军”
      from: 1967-09
      to: 1968-05
      text: |
        1967 年 12 月至 1968 年 5 月亲自修改审定四份报告送康生，诬陷贺龙“以开展国防体育运动为名，积极策划反革命‘地下军’”；把北京市体委无线电俱乐部拆除部分电台说成“反革命破坏事件”，市体委副主任贾桂荣等五人因此在 1967 年 12 月 28 日被捕。
      cites: [ws-1983-qi-jinghe-case]
    - h: 判决
      from: 1976-10
      to: 1983-11-02
      text: |
        1976 年 10 月时任中共中央组织部干部组负责人。1983 年 11 月 2 日北京市中级人民法院判处有期徒刑十七年，剥夺政治权利四年。
      cites: [ws-1983-qi-jinghe-case]
  assess:
    - { voice: judicial1980, text: 美国特务通过王（光美）控制头号走资派、国家元首（齐景和 1967 年 9 月对专案组人员说，判决书引）, cite: ws-1983-qi-jinghe-case, quote: true }
  factions: [ccrg]
  fate:
    - { date: 1967, s: power, note: 刘仁专案组副组长, cite: ws-1983-qi-jinghe-case }
    - { date: 1983-11-02, s: detained, note: 判处有期徒刑十七年, cite: ws-1983-qi-jinghe-case }
  cites: [ws-1983-qi-jinghe-case]

- id: chen-ada
  name: 陈阿大
  tier: 3
  role1966: 上海良工阀门厂工人
  pinyin: Chén Ādà
  gender: m
  origin: 浙江绍兴
  bio: 浙江绍兴人，上海良工阀门厂工人，1966 年与王洪文、潘国平等组织“工总司”，参与安亭事件、冲砸《解放日报》社和 1967 年一月夺权。此后任上海市革委会常委、工交组负责人、市总工会副主任，参与指挥 1967 年 8 月围攻上海柴油机厂。1976 年参与上海武装叛乱的准备。1982 年 7 月被起诉，判处有期徒刑十六年。
  life:
    - h: 工总司与一月夺权
      from: 1966-11
      to: 1967-01-06
      text: |
        1966 年 11 月 6 日至 9 日与王洪文、潘国平、叶昌明、黄金海等密谋召开大会，提出“我们要夺权”；11 月 10 日王洪文、潘国平在上海站、安亭站拦截列车，他到两站参与。12 月初参与冲砸《解放日报》社，报纸停刊六天。1967 年 1 月 5 日参加张春桥、姚文元召集的会议，按他的主张在人民广场召开大会，1 月 6 日宣布“彻底打倒”上海市委。
      cites: [ws-1982-chen-ada-case]
    - h: 上柴与工交系统
      from: 1967-07
      to: 1975-10
      text: |
        1967 年 7–8 月在王洪文指挥下与戴立清、叶昌明、王秀珍等策划围攻上海柴油机厂，8 月 4 日调集上千辆汽车和船只水陆围攻，他下令从中华造船厂调登陆艇封江；这次事件关押、伤残六百五十人。此后在工交系统参与制造冤案，1969 年起参与把写文章反驳徐景贤的煤气公司技术员桑伟川定为“现行反革命”，1975 年 10 月参与决定将其逮捕判刑七年。
      cites: [ws-1982-chen-ada-case]
    - h: 1976 年与受审
      from: 1976-02
      to: 1982-07-02
      text: |
        1976 年 2–3 月在各种会议上说邓小平“是个地地道道的买办资产阶级”。10 月“四人帮”被捕后参与上海的武装叛乱准备。1982 年 7 月 2 日上海市人民检察院分院起诉，法院判处有期徒刑十六年，剥夺政治权利三年。
      cites: [ws-1982-chen-ada-case]
  factions: [shgang, rebels]
  fate:
    - { date: 1966-11, s: rise, note: 工总司负责人之一, cite: ws-1982-chen-ada-case }
    - { date: 1967-02, s: power, note: 上海市革委会常委、工交组负责人, cite: ws-1982-chen-ada-case }
    - { date: 1982, s: detained, note: 判处有期徒刑十六年, cite: ws-1982-chen-ada-case }
  cites: [ws-1982-chen-ada-case]

- id: hua-linsen
  name: 华林森
  tier: 3
  role1966: 苏州工人
  pinyin: Huá Línsēn
  gender: m
  origin: 上海宝山
  bio: 上海宝山人，工人出身。文革初在苏州与汪永珠、邹学祺等结成一派，1967 年 1 月为首夺了苏州市委、市人委的权，此后苏州两派武斗三个多月。1968 年参与制造“陈、杨反革命集团”假案；1974 年起建“苏州市民兵指挥部”，设二十一个关押所，非法关押八千四百余人。先后任苏州市革委会副主任、市委副书记、江苏省总工会主任、省革委会副主任。1979 年 12 月被判处有期徒刑十八年。
  life:
    - h: 夺权与武斗
      from: 1966
      to: 1968-05
      text: |
        文革初期与汪永珠、邹学祺、赵宝康等结成帮派，1967 年 1 月为首策划夺了苏州市委、市人委的权，此后煽动派性，苏州两派武斗延续三个多月，他亲到武斗人员驻地讲话。1968 年 5 月他这一派捏造“陈、杨反革命集团”假案，一百多名区、局领导干部被打成“反革命集团”成员和“叛徒”“特务”，三人被迫害致死。
      cites: [ws-1979-hua-linsen-case]
    - h: “第二武装”
      from: 1974
      to: 1976-10
      text: |
        1974 年初为首策划建立“第二武装”，带人到市人武部造反，要挟市委建立“苏州市民兵指挥部”，自任领导组组长。全市设二十一个“关押所”、八个“劳动教育学习班”，非法关押八千四百余人，五人被迫害致死。1974 年到 1976 年 10 月在全市突击提干、突击入党。
      cites: [ws-1979-hua-linsen-case]
    - h: 判决
      from: 1977-01-06
      to: 1979-12-28
      text: |
        1977 年 1 月 6 日起羁押。1979 年 12 月 28 日苏州市中级人民法院依据《惩治反革命条例》判处有期徒刑十八年，剥夺政治权利五年。
      cites: [ws-1979-hua-linsen-case]
  factions: [rebels, provincial]
  fate:
    - { date: 1967-01, s: power, note: 夺苏州市委、市人委权, cite: ws-1979-hua-linsen-case }
    - { date: 1977-01-06, s: detained, note: 羁押, cite: ws-1979-hua-linsen-case }
    - { date: 1979-12-28, s: detained, note: 判处有期徒刑十八年, cite: ws-1979-hua-linsen-case }
  cites: [ws-1979-hua-linsen-case]

- id: liu-yinnong
  name: 刘殷农
  tier: 3
  role1966: 昆明青年
  pinyin: Liú Yīnnóng
  gender: m
  origin: 云南昆明
  bio: 云南昆明人。文革中任云南省革委会常委、昆明市革委会副主任、昆明市委常委。1968 年起和同伙诬陷云南省委书记赵健民与昆明军区副司令员陈康等结成“反革命联盟”，康生点名制造“赵健民特务案”后，他们在昆明追查“滇挺”“地下银行”“左派政府”。起诉书统计全省因此制造冤假案一万五千余件，一万七千多人被打死、逼死，说他负有直接或间接的责任。1982 年被判处有期徒刑十七年。
  life:
    - h: “赵健民之流”
      from: 1967-12
      to: 1969-01
      text: |
        1967 年 12 月 30 日指派人把省外贸局临时工袁保华抓到工人文化宫审讯，袁被刑讯致死。1968 年 3 月诬陷赵健民、陈康、云南军区政委张力雄结成“反革命联盟”，同期把省委书记刘明辉、孙雨亭、高治国等诬为“叛徒”“特务”。12 月 14 日与林敬荣、胡延观在《云南日报》联名发表《撕破赵健民复辟资本主义的遮羞布》。1969 年 1 月 18 日在昆明市级机关学习班大会上煽动追查“滇挺”“地下银行”“地下公检法”。
      cites: [ws-1982-liu-yinnong-case]
    - h: 后果
      from: 1968
      to: 1976
      text: |
        起诉书说，全省追查“赵健民特务案”和“赵健民之流”中制造冤假案一万五千余件，直接受迫害的干部群众一百三十八万余人，被打死、逼死的一万七千多人，伤残六万一千人；仅昆明地区被迫害致死一千四百七十三人。起诉书还列有他“阴谋颠覆政府”“策动反革命武装叛乱”两项。
      cites: [ws-1982-liu-yinnong-case]
    - h: 判决
      from: 1982-04-09
      to: 1982
      text: |
        1982 年 4 月 9 日昆明市人民检察院起诉，昆明市中级人民法院判处有期徒刑十七年，剥夺政治权利四年。
      cites: [ws-1982-liu-yinnong-case]
  factions: [rebels, provincial]
  fate:
    - { date: 1968, s: power, note: 云南省革委会常委、昆明市革委会副主任, cite: ws-1982-liu-yinnong-case }
    - { date: 1982, s: detained, note: 判处有期徒刑十七年, cite: ws-1982-liu-yinnong-case }
  cites: [ws-1982-liu-yinnong-case]

- id: xu-yingnian
  name: 徐英年
  tier: 3
  role1966: 贵阳地球化学研究所研究生
  pinyin: Xú Yīngnián
  gender: m
  origin: 江苏金坛
  bio: 江苏金坛人，贵阳地球化学研究所研究生。1967 年 1 月在贵阳造反派联络站会上说“我们要夺权”，25 日在北京与李再含商定贵州夺权，主持起草《夺权通告》。夺权后任贵州省革委会常委、党的核心小组成员、省委委员。1968 年在李再含指使下组织武装攻打安龙县龙广区，打死九人。1982 年被判处有期徒刑六年。
  life:
    - h: 贵州夺权
      from: 1967-01-18
      to: 1967-02
      text: |
        1967 年 1 月 18 日在贵阳地区造反派联络站负责人会上说，文革“围绕的一个中心问题，就是权的问题”，“凡有了条件的都要夺权，条件不成熟的要创造条件”。1 月 25 日在北京与李再含密谋，往贵阳打电话传达“贵州也该夺权”，并主持起草《夺权通告》交给李再含。
      cites: [ws-1982-xu-yingnian-case]
    - h: 龙广
      from: 1968-09-17
      to: 1968-12-15
      text: |
        为镇压安龙县龙广区反对李再含的群众，1968 年 9 月 17 日在兴义与康岩中主持会议，兵分两路武装攻打龙广，坐镇指挥，“九·一八”事件打死九人，逼死一人，伤残十四人。同年 12 月指使人攻打兴义县手管局办公楼，打死群众四人。
      cites: [ws-1982-xu-yingnian-case]
    - h: 判决
      from: 1982-03-25
      to: 1982-12-21
      text: |
        1982 年 3 月 25 日被拘留，4 月 2 日逮捕。11 月贵州省人民检察院起诉，12 月判处有期徒刑六年，剥夺政治权利二年。
      cites: [ws-1982-xu-yingnian-case]
  assess:
    - { voice: judicial1980, text: 无产阶级文化大革命以来，围绕的一个中心问题，就是权的问题（徐英年 1967 年 1 月 18 日讲话，判决书引）, cite: ws-1982-xu-yingnian-case, quote: true }
  factions: [rebels, provincial]
  fate:
    - { date: 1967-01-25, s: rise, note: 与李再含策划贵州夺权, cite: ws-1982-xu-yingnian-case }
    - { date: 1982-04-02, s: detained, note: 逮捕，年底判处有期徒刑六年, cite: ws-1982-xu-yingnian-case }
  cites: [ws-1982-xu-yingnian-case]

- id: sun-changde
  name: 孙昌德
  tier: 3
  role1966: 贵阳地球化学研究所研究实习员
  pinyin: Sūn Chāngdé
  gender: m
  origin: 辽宁营口
  bio: 辽宁营口人，1963 年留学回国，分配在中国科学院地质研究所，1966 年 9 月调贵阳地球化学研究所任研究实习员。1967 年 1 月参与夺取《贵州日报》社领导权，李再含夺取贵州省领导权后任“贵州造反总指挥部”总指挥，后任贵州省革委会常委、副主任、党的核心小组成员。他受李再含指派到安顺“支持夺权”，亲笔写逮捕“命令”；参与 1967 年 8 月镇压贵州工学院师生和 1969 年 7 月“端据点”，后者打死五十五人。1982 年被判处有期徒刑十年。
  life:
    - h: 夺权
      from: 1967-01-15
      to: 1967-02-06
      text: |
        1967 年 1 月 15 日晚至 16 日参加“贵阳地区造反派联络站”会议，参与夺取《贵州日报》社领导权，任报社“接管委员会”成员。下旬李再含等夺取贵州省领导权后，他任“贵州造反总指挥部”总指挥，随后任省革委会常委、副主任。2 月 6 日起草决议说“最关键的问题是夺权没夺权和夺权彻底不彻底的问题”。
      cites: [ws-1982-sun-changde-case]
    - h: 安顺、贵工、端据点
      from: 1967-03
      to: 1969-07-29
      text: |
        1967 年 3 月受李再含指派到安顺，说“徐永春是个大障碍”，把工人徐永春、张英定为“反革命分子”，亲自签字逮捕，二人分别被判刑十年、七年。8 月 17 日传达李再含的指令，调动电台指挥镇压贵州工学院师生，打死一人，打伤九十一人，抓二百余人。1969 年 7 月提出用武力“端据点”的所谓“南宁办法”，29 日指使人调工人进城，这次事件打死五十五人，打伤一百零八人。
      cites: [ws-1982-sun-changde-case]
    - h: 判决
      from: 1982-04-01
      to: 1982-12-21
      text: |
        1982 年 3 月 25 日被拘留，4 月 1 日逮捕，11 月 27 日贵州省人民检察院起诉，12 月判处有期徒刑十年，剥夺政治权利三年。
      cites: [ws-1982-sun-changde-case]
  factions: [rebels, provincial]
  fate:
    - { date: 1967-01, s: power, note: 贵州造反总指挥部总指挥、省革委会副主任, cite: ws-1982-sun-changde-case }
    - { date: 1982-04-01, s: detained, note: 逮捕，年底判处有期徒刑十年, cite: ws-1982-sun-changde-case }
  cites: [ws-1982-sun-changde-case]

- id: hu-yong
  name: 胡勇
  tier: 3
  role1966: 长沙汽车电器厂职工
  pinyin: Hú Yǒng
  gender: m
  aka: [{ kind: original, name: 胡世满 }]
  origin: 湖南湘潭
  bio: 原名胡世满，湖南湘潭人，初中文化，1957 年参加工作，在长沙汽车电器厂。文革初鼓吹“拳头里面出政权”，打伤厂里的劳动模范和干部；后任湖南省革筹小组成员、省革委会副主任、省总工会副主任、省委候补委员。1974 年和 1976 年两次与唐忠富、叶卫东等策划进入省委班子、围攻省委。1979 年 4 月被捕，1982 年被判处有期徒刑十五年。
  life:
    - h: “拳头里面出政权”
      from: 1967-01
      to: 1967-11
      text: |
        1967 年 1 月诬陷本厂省劳动模范刘孝安是“湖南最大的工贼、大土匪、假标兵”，押到长沙、湘潭等地游斗；5 月 5 日为夺厂里的民兵武器，把拒绝交枪的厂武装部副部长王德文打断肋骨；6 月用木棒打伤代理党委书记王明江。起诉书称 1967 年 1 月至 11 月被他直接、间接迫害和打伤的干部群众有七至八人。
      cites: [ws-1982-hu-yong-case]
    - h: 两次图谋省委
      from: 1974-02
      to: 1976-10
      text: |
        1974 年 2 月与唐忠富等在湖南宾馆拟定进省委领导班子的名单，密谋由唐忠富、章伯森任省委书记，自己等任常委；同月以“唐勇忠”笔名铅印散发传单《为革命造反派辩护》六千份。1976 年与唐忠富、叶卫东串连各地，在省委礼堂召开“促转弯子”大会，6 月 20 日与叶卫东到株洲煽动。
      cites: [ws-1982-hu-yong-case, ws-1982-ye-weidong-case]
    - h: 判决
      from: 1979-04-03
      to: 1982
      text: |
        1979 年 4 月 3 日被捕。1982 年 5 月 31 日长沙市中级人民法院以阴谋颠覆政府罪和反革命杀人、伤人罪判处有期徒刑十五年，剥夺政治权利三年；他上诉称“没有推翻无产阶级政权和社会主义制度的目的”，被驳回。
      cites: [ws-1982-hu-yong-case]
  factions: [rebels, provincial]
  fate:
    - { date: 1968, s: power, note: 湖南省革委会副主任, cite: ws-1982-hu-yong-case }
    - { date: 1979-04-03, s: detained, note: 被捕, cite: ws-1982-hu-yong-case }
    - { date: 1982-05-31, s: detained, note: 判处有期徒刑十五年, cite: ws-1982-hu-yong-case }
  cites: [ws-1982-hu-yong-case]

- id: ye-weidong
  name: 叶卫东
  tier: 3
  role1966: 中学教员
  pinyin: Yè Wèidōng
  gender: m
  aka: [{ kind: original, name: 叶冬初 }]
  origin: 湖南宁远
  bio: 原名叶冬初，湖南宁远人，大学文化，1961 年参加工作，做过大学助教、中学教员，文革中任长沙市一中革委会副主任。1966 年 11 月带人冲砸湖南省委机关，12 月刻写诬称省委要“举行反革命军事政变”的“001”号密令；1967 年 1 月 15 日把省委第一书记张平化抓走关押十天。后任湖南省革筹小组成员、省革委会副主任。1976 年与唐忠富、胡勇围攻省委。1978 年被捕，1982 年被判处有期徒刑十三年。
  life:
    - h: 冲省委、抓张平化
      from: 1966-11-14
      to: 1967-07
      text: |
        1966 年 11 月 14 日与彭少云、郁明谏等组织百余人以抄“黑材料”为名冲进湖南省委机关，封闭两座办公楼二十余天。12 月 20 日起草刻写“001”号密令，诬称省委、长沙市委元旦前后“可能动用武装”。1967 年 1 月 15 日晚纠集人把张平化抓走，关在长沙新华电影院地下室十天。同年 4 月、7 月煽动“打倒张平化”。
      cites: [ws-1982-ye-weidong-case]
    - h: 1976 年
      from: 1976-04
      to: 1976-10
      text: |
        1976 年 4 月至 10 月与唐忠富、胡勇密谋向省委夺权，5 月两次带人到省委机关围攻省委主要领导人，6 月 4 日的“促转弯子”大会动用两百多辆汽车游行。他对各地来人说：“一九六八年的夺权，现在又被他们夺过去了”。原定 10 月 11 日再到省委开大会，因“四人帮”被捕未成。
      cites: [ws-1982-ye-weidong-case]
    - h: 判决
      from: 1977-03-08
      to: 1982
      text: |
        1977 年 3 月 8 日离职审查，10 月 17 日拘留，1978 年 9 月 30 日逮捕。1982 年 5 月 31 日长沙市中级人民法院判处有期徒刑十三年，剥夺政治权利三年；上诉被驳回。
      cites: [ws-1982-ye-weidong-case]
  factions: [rebels, provincial]
  fate:
    - { date: 1967-01-15, s: rise, note: 拘禁省委第一书记张平化, cite: ws-1982-ye-weidong-case }
    - { date: 1968, s: power, note: 湖南省革委会副主任, cite: ws-1982-ye-weidong-case }
    - { date: 1977-03-08, s: detained, note: 离职审查，次年逮捕, cite: ws-1982-ye-weidong-case }
    - { date: 1982-05-31, s: detained, note: 判处有期徒刑十三年, cite: ws-1982-ye-weidong-case }
  cites: [ws-1982-ye-weidong-case]

- id: huang-yantian
  name: 黄砚田
  died: 1973
  deathKind: executed
  tier: 3
  role1966: 解放军干部
  pinyin: Huáng Yàntián
  gender: m
  origin: 江苏泗阳
  bio: 江苏泗阳人，1943 年入伍，1944 年入党。1969 年调黑龙江生产建设兵团，任十六团团长，利用职权奸污、猥亵女知识青年多人。1973 年国务院、中央军委批准判处死刑，立即执行，并通报全国，把他定为“林彪修正主义路线的余孽”。
  life:
    - h: 军人
      from: 1943
      to: 1969
      text: |
        1943 年入伍，1944 年入党。通报说他“背着‘自来红’、‘有战功’的包袱”。
      cites: [ws-1973-bingtuan-case]
    - h: 十六团
      from: 1969
      to: 1973
      text: |
        1969 年调到兵团后任十六团团长，与参谋长李耀东利用职权奸污女知识青年多人、调戏猥亵数十人。兵团党委多次批评，他“屡教不改”。
      cites: [ws-1973-bingtuan-case]
    - h: 处决与通报
      from: 1973
      to: 1973
      text: |
        国务院、中央军委批准判处死刑，立即执行，通报发至县、团级，要求各地严惩迫害知青的犯罪，“罪大恶极，不杀不足以平民愤的，要坚决杀掉”。
      cites: [ws-1973-bingtuan-case]
  factions: [provincial]
  fate:
    - { date: 1969, s: power, note: 黑龙江兵团十六团团长, cite: ws-1973-bingtuan-case }
    - { date: 1973, s: dead, note: 判处死刑，立即执行, cite: ws-1973-bingtuan-case }
  cites: [ws-1973-bingtuan-case]

