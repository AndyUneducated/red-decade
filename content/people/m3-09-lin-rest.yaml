  bio: 河北乐亭人，冀东八路军出身，在空军当过航校干事、刘亚楼秘书，1966 年 5 月调回空军司令部办公室。林立果 1967 年进入空军后由他带领，此后成为“联合舰队”的核心：1969 年林彪亲笔写信要他“让老虎多单独行动”；1971 年 3 月与林立果在上海制订《“571工程”纪要》，又秘密练习驾驶直升机。9 月他向江腾蛟、王飞等传达林彪手令、布置谋杀和南逃。9 月 13 日凌晨得知林彪出逃，与于新野、李伟信劫持直升机外逃，被驾驶员陈修文迫降在怀柔，他开枪打死陈修文后与于新野自杀。1981 年判决书列他为已死亡的六名主犯之一。
  life:
    - h: 刘亚楼的秘书
      from: 1935
      to: 1966-05
      text: |
        1935 年生于河北乐亭，1946 年参加冀东八路军。1949 年调入空军第一航校，体检不合格不能飞行，任宣传科干事；后调北京任空军司令员刘亚楼的秘书。1963 年下放到盐城某部任营教导员，1964 年 8 月任虹桥机场空军某飞行大队政委，1966 年 5 月下旬调回空军司令部办公室。
      verify: true
    - h: 联合舰队
      from: 1967
      to: 1971-08
      text: |
        1969 年 2 月 16 日，林彪写信给他和刘沛丰，要他们“让老虎多单独行动”（老虎是林立果的小名）。同年 10 月吴法宪任命林立果为空军司令部办公室副主任兼作战部副部长，10 月 18 日把林立果、王飞和“空军司令部办公室副主任周宇驰等”召集在一起，宣布“空军的一切都要向立果同志汇报”，周宇驰、王飞随即在空军党委和机关传达。1970 年 5 月他与王飞召集会议向林彪表“忠心”，推林立果为“头”；10 月这个“调研小组”组成为“联合舰队”。1971 年 3 月他与林立果、于新野、李伟信在上海制订《“571工程”纪要》；5 月起秘密练习驾驶直升机，飞到南昌、庐山、广州、北戴河等地。
      cites: [ws-1972-lin-material-3, ws-1980-indictment]
    - h: 九一三
      from: 1971-09
      to: 1971-09-13
      text: |
        9 月 5 日他从顾同舟处探听到毛泽东在长沙的谈话内容，密报林立果、叶群。8 日林彪的手令写的是“盼照立果、宇驰同志传达的命令办”；8 日至 11 日他和林立果在空军学院和西郊机场的据点向江腾蛟、王飞等传达手令，策划谋杀。11 日王维国向他密报毛泽东已离开上海；12 日他布置南逃广州，把周恩来追查 256 号专机的情况报告林立果。13 日凌晨 3 时 15 分，他与于新野、李伟信带着窃取的大批机密文件和美钞，在沙河机场劫持 3685 号直升机外逃。驾驶员陈修文发觉后飞回北京，在怀柔迫降，降落时陈修文被他打死，他和于新野随即自杀，李伟信被俘。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, ws-1972-lin-material-3]
  assess:
    - { voice: official1966, text: 直升飞机迫降后，周、于二贼自杀，李伟信和另一驾驶员陈士印被我活捉（1972 年中共中央《粉碎林陈反党集团反革命政变的斗争》材料之三）, cite: ws-1972-lin-material-3, quote: true }
    - { voice: judicial1980, text: 驾驶员陈修文发觉后，采取措施飞回到北京市怀柔县，降落时陈修文被周宇驰杀害（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 他和林立果都没有活到受审，“571工程纪要”由谁起草、他在谋杀计划中实际做了多少，只能依据于新野笔记、李伟信供词和直升机上缴获的文件。, cite: ws-1972-lin-material-3 }
  factions: [lin]
  fate:
