  bio: 山东临淄人，1938 年参加八路军，1948 年参加空军筹建，此后一直在空军司令部，林立果进空军时他是办公室主任，1969 年升副参谋长兼办公室主任。他与周宇驰同为“联合舰队”的骨干：1970 年 5 月召集会议向林彪表“忠心”，1971 年 9 月替林彪、叶群给黄永胜送密件，林彪信中说黄“有事时可与王飞同志面洽”；12 日又参与拟定南逃广州的人员名单。九一三后被关押，在狱中患精神分裂症，原定的两案主犯资格由江腾蛟替代，1981 年起取保候审三十多年不结案，2014 年在北京病逝。
  life:
    - h: 空军机关
      from: 1922
      to: 1968
      text: |
        1922 年生于山东淄博临淄，1938 年参加八路军，任清河特委书记秘书、高苑县委书记。1948 年冬参加空军筹建，空军成立后一直在司令部工作。1967 年林立果进入空军司令部办公室当秘书时，他是办公室主任，把带林立果的事交给副主任周宇驰。
      verify: true
    - h: 调研小组与联合舰队
      from: 1969
      to: 1971-09
      text: |
        据起诉书，1969 年 10 月 18 日吴法宪把林立果、王飞和周宇驰召集在一起，宣布“空军的一切都要向立果同志汇报”；林立果随后“伙同周宇驰、王飞等组成‘调研小组’”。他还与吴法宪、参谋长梁璞一起诬陷、迫害空军干部。1970 年 5 月 3 日他和周宇驰召集会议，吹捧林彪是“革命导师和领袖”、林立果是“全才”。1971 年 9 月 8 日林立果让他把叶群给黄永胜的密封亲启件送去，10 日上午送达；林彪给黄永胜的信又交到他手上备用。12 日他与于新野、贺德全等拟定南逃人员名单，当晚又召集“七人黑会”，草拟随林彪南逃广州的行动计划和名单。
      cites: [ws-1980-indictment, ws-1972-lin-material-3]
    - h: 精神病与取保候审
      from: 1971-09
      to: 2014-10
      text: |
        九一三后被隔离审查，关押在秦城。1979 年底总政林案办把他列为主犯，1980 年 6 月秦城监狱报告他出现精神分裂症状，送安定医院，主犯改由江腾蛟替代。1981 年起取保候审，此后一直没有起诉、判决或结论，2014 年 10 月在空军总医院去世。
      verify: true
