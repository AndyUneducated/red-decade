- id: chi-qun
  name: 迟群
  born: 1932
  tier: 3
  role1966: 中央警卫团（八三四一部队）政治部宣传科副科长
  pinyin: Chí Qún
  gender: m
  ethnicity: 汉族
  birthplace: 山东乳山
  origin: 山东乳山
  party: 中国共产党
  joinedRevolution: 1949
  positions:
    - { title: 宣传科副科长, orgName: 八三四一部队, to: 1968, cite: ws-1982-chi-qun-case }
    - { title: 党委副书记、革委会副主任, orgName: 清华大学, from: 1968, to: 1971, verify: true }
    - { title: 副组长, orgName: 国务院科教组, from: 1970-07, to: 1975-01, verify: true }
    - { title: 党委书记、革委会主任, orgName: 清华大学, from: 1971, to: 1976-10, cite: ws-1982-chi-qun-case }
  bio: 山东乳山人，1949 年参军，文革前是中央警卫团（八三四一部队）政治部宣传科副科长。1968 年 7 月随“首都工人、解放军毛泽东思想宣传队”进驻清华，与谢静宜一起逐步掌握清华，1971 年任清华党委书记、革委会主任，兼国务院科教组副组长。1973–1976 年他在江青、张春桥、姚文元指挥下领导“北大、清华大批判组”（梁效），从批林批孔转向批邓，炮制诬陷邓小平的文章六十余篇；与谢静宜搜集材料整教育部长周荣鑫，致其被批斗致死；又按江青的指派炮制马振扶中学事件。1976 年 10 月被隔离审查，1983 年 11 月被北京市中级人民法院判处有期徒刑十八年。出狱后病逝，卒年有 1999、2001 两说，这里不录。
  life:
    - h: 八三四一部队
      from: 1932
      to: 1968
      text: |
        1932 年生于山东海阳县西黄岛村（今属乳山），1949 年参加解放军，后入党，任中央警卫团政治部宣传科副科长。1983 年的判决书称他“原任中国人民解放军某部政治部宣传科副科长”。
      cites: [ws-1982-chi-qun-case]
      verify: true
    - h: 进驻清华
      from: 1968
      to: 1973-09
      text: |
        1968 年 7 月清华武斗失控后，毛泽东派工宣队、军宣队进驻，他随八三四一部队的军宣队进校，任清华大学党委副书记、革委会副主任；1970 年国务院科教组成立后为主要成员，1971 年任清华党委书记、革委会主任，兼科教组副组长。1973 年 10 月至 1974 年 1 月，他与谢静宜在清华搞“反右倾回潮”，把六十余名师生列为审查重点，批斗校党委副书记何东昌，把教务处副处长邢家鲤（“利用养猫反党”）、教师陈世猷打成“现行反革命”。
      cites: [ws-1982-chi-qun-case]
      verify: true
    - h: 梁效与马振扶
      from: 1974
      to: 1976-10
      text: |
        1974 年 1 月他受江青指派，与谢静宜去河南唐河县马振扶中学调查女学生张玉勤自杀，把事情说成是“修正主义教育路线给逼死的”，并把江青、王洪文要对该校教师“判重刑”的指令传达给南阳地委，致使校长罗长奇等被捕判刑。1974 年批林批孔中，“四人帮”指使他和谢静宜利用清华据点煽动批“现代大儒”、批“周公”。1975 年 9 月至 1976 年 10 月，他按张春桥、姚文元的意图“亲自点题，提供材料，交待要点”，指挥“北大、清华写作班子”炮制诬陷邓小平的文章六十余篇，其中三十九篇以“梁效”“高路”等名义发表；“评三株大毒草”等小册子印了八千万册。1976 年 3 月 26 日他与谢静宜带人以“汇报清华大学运动”为名当面围攻邓小平。又与谢静宜收集教育部长周荣鑫的讲话送给江青，策划成立“教育部临时领导小组”夺周荣鑫的权，4 月 7 日对教育部的人说“周荣鑫的黑后台倒了”，五天后周荣鑫在批斗会上昏倒，当晚死去。
      cites: [ws-1982-chi-qun-case, ws-1980-indictment]
    - h: 审判
      from: 1976-10
      to: 1983-11-02
      text: |
        1976 年 10 月“四人帮”被捕后被隔离审查，1977 年 8 月 5 日被逮捕。1983 年北京市中级人民法院公开审理，法庭审查各种证据九十五件，“迟群供认了主要犯罪事实”；11 月 2 日以积极参加反革命集团罪、反革命宣传煽动罪、诬告陷害罪判处有期徒刑十八年、剥夺政治权利四年。
      cites: [ws-1982-chi-qun-case]
  assess:
    - { voice: judicial1980, text: 被告人迟群积极参加江青反革命集团推翻人民民主专政的政权和社会主义制度的阴谋活动（1983 年北京市中级人民法院判决书）, cite: ws-1982-chi-qun-case, quote: true }
    - { voice: doc, text: 走资派还在走，不只邓小平一个人，要看到有这么一层人（1976 年 3 月迟群在清华大学讲话，判决书引）, cite: ws-1982-chi-qun-case, quote: true }
    - { voice: doc, text: 你的大字报提出了一个很重要的问题，就是走资派还在走（1975 年 11 月迟群对吴炜煜语，起诉书引）, cite: ws-1982-chi-qun-case, quote: true }
    - { voice: editor, text: 同案的谢静宜因“坦白认罪较好”被免予起诉，辩护律师曾在法庭上说某些重要意图是江青通过谢静宜转达给他的。, verify: true }
