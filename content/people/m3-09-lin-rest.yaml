        1967 年 3 月任空四军第二政委、上海市革委会常委，1969 年任第一政委，九大当选中央候补委员。1970 年九届二中全会上，吴法宪找他和陈励耘谈话，要他们在小组会上讲设国家主席和“天才”问题。据 1982 年起诉书，他在林立果指挥下整顿为林立果找对象的“上海小组”，要求成员“每一件工作、行动，都要考虑大局”，“大局就是副部长（指林立果）”。1971 年 3 月按林立果、周宇驰的指使在上海新华一村修建秘密据点（“要修地下室，门窗要装防弹玻璃，院墙要开暗门”），组建由他领导的“教导队”，进行捕俘、格斗、打巷战等特种训练，又在军械修理厂试制 7.62 毫米冲锋枪八支，送给林立果两支。3 月 31 日参加上海秘密会议，被指定为上海的“头”。
      cites: [ws-1982-wang-weiguo-case, ws-1971-12-lin-chen-material-1, ws-1980-indictment]
    - h: 九月密报
      from: 1971-09
      to: 1971-09-20
      text: |
        9 月 10 日下午毛泽东在上海找他和王洪文谈话。11 日毛离开上海，他两次打电话找周宇驰，密报毛已离开和谈话内容；12 日晨又派儿子乘飞机到北京当面详细报告。当晚周宇驰通过李伟信通知“上海小组”：明天有一架大飞机到上海，小组和教导队全副武装随机出发，“告王政委明日上机场”。他听后说：“这次出发，可能和我把毛主席来上海的情况向林立果他们讲了有关。”13 日林彪出逃后，他指使手下销毁罪证，解散“上海小组”和“教导队”。
      cites: [ws-1982-wang-weiguo-case]
    - h: 审判
      from: 1971-09-20
      to: 1993-06-06
      text: |
        1971 年 9 月 20 日被隔离审查，1980 年 7 月 28 日被逮捕。1982 年 3 月 1 日至 9 日中国人民解放军军事法院公开审理，以积极参加反革命集团罪判三年、策动叛乱罪判十二年，合并执行十四年，剥夺政治权利三年和二级独立自由勋章、二级解放勋章；判决书说“王维国不承认是犯罪”。他以“事实有的有出入”和“受蒙骗、被利用”为由上诉，最高人民法院裁定驳回。刑期到 1985 年 9 月 19 日止，出狱后安置在河北永年，1993 年 6 月 6 日病逝。
      cites: [ws-1982-wang-weiguo-case]
      verify: true
