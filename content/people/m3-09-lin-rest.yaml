    - { voice: official1966, text: 王飞、周宇驰召集会议，向林彪表“忠心”，无耻吹捧林彪是“革命导师和领袖”，吹捧林立果是“全才”（1972 年中央材料之三）, cite: ws-1972-lin-material-3, quote: true }
    - { voice: editor, text: 他是“联合舰队”里卷入最深的活人之一，却从未受审。起诉书和判决书都写到他的行为，但没有列他为被告。 }
