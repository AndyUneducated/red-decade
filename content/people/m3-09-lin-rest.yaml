  bio: 成都人，抗大出身，长期在空军做政治工作，1964 年起任驻杭州的空五军政委，文革中兼浙江省革委会副主任，1969 年由周恩来提名为九届中央候补委员。他主持修建了给林彪住的杭州“704 工程”；1970 年庐山会议上受吴法宪鼓动，1971 年 3 月在上海秘密会议上被林立果指定为杭州的“头”。中央 1972 年的材料说，9 月 8 日于新野到杭州与他密商用改装的伊尔─10 飞机谋害毛泽东。9 月 20 日被隔离审查，1982 年 3 月军事检察院认定他只参加了上海会议、“罪行较轻”，免予起诉。此后住在浙江嘉善，没有恢复组织生活，2004 年去世。
  life:
