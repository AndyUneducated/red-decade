  bio: 河南商丘人，1952 年参军，从中央机要学校毕业后进中共中央办公厅机要局，长期做毛泽东的机要员。1968 年随八三四一部队的宣传队进驻清华，与迟群一起掌握清华和北大，后任北京市委书记，十大当选中央委员，四届人大当选人大常委。1974–1976 年与迟群一起在江青授意下搞马振扶中学事件、批林批孔、批邓，整教育部长周荣鑫，1976 年 3 月 26 日与迟群当面围攻邓小平。1976 年 10 月被隔离审查，此后因“坦白认罪较好”被免予起诉，以退休干部身份在北京生活，2017 年去世。
  life:
