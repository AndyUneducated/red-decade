      verify: true
    - h: 清华与北京市委
      from: 1968
      to: 1975
      text: |
        1968 年随八三四一部队的军宣队进驻清华，任清华大学党委副书记、革委会副主任，后任北京市委书记、北京市革委会副主任、团市委书记。1973 年 8 月十大当选中央委员。据迟群案判决书，1973 年 10 月至 1974 年 1 月她与迟群在清华搞“反右倾回潮”，批斗六十余名师生；1974 年 1 月与迟群受江青指派去马振扶中学。1980 年起诉书列她为“中共北京市委书记谢静宜”，说“四人帮”指使她和迟群在批林批孔中批“现代大儒”、批“周公”，影射周恩来。1975 年 1 月四届人大当选人大常委会委员。
      cites: [ws-1982-chi-qun-case, ws-1980-indictment, rmrb-1975-01-19-npc-sc-list]
