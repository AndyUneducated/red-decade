    - { voice: judicial1980, text: 江腾蛟在林彪叛逃的第二天，交代了自己的罪行, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: judicial1980, text: 判处被告人江腾蛟有期徒刑十八年，剥夺政治权利五年, cite: ws-1981-01-25-judgment, quote: true }
