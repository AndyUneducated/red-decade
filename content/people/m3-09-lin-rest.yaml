# M3 people, batch 9: the rest of the Lin Biao group (the "联合舰队" and the three Shanghai-meeting
# "heads"), two Canton/Nanjing commanders, and the two who ran Tsinghua for 江青 (迟群, 谢静宜).
# Texts: 1980 indictment, 1981 judgment, 1971–72 central Lin Biao materials, the 1982 王维国 case,
# the 1983 迟群 case, the 1975 NPC list, and 许寅's 1988 interview quoting 陈励耘's 1982 non-prosecution
# decision. Dates not in these texts come from general reference and are marked verify.

