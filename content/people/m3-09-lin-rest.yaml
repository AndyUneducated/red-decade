  bio: 湖北红安人，11 岁参加红军，抗战中在新四军、解放战争中在东北部队做政治工作，1955 年授少将。1966 年底任南京军区空军政委，1968 年 4 月因在南京军区制造动乱被撤职，调到北京空军机关。此后成为林立果的“联合舰队”在南方的联络人：1966 年 10 月受叶群指使在上海抄了郑君里、赵丹等五人的家；1971 年 3 月在上海秘密会议上被指定为南京、上海、杭州“三点联系”的负责人，9 月被派为上海地区谋杀毛泽东的“第一线指挥”。林彪出逃次日即交代。1981 年作为十名主犯之一被判有期徒刑十八年，2009 年在北京病逝。
  life:
    - h: 红小鬼到空军政委
      from: 1919
      to: 1965
      text: |
        1919 年生于湖北黄安（今红安），1930 年参加红军和共青团，1937 年入党。抗战时在新四军第二师任团政治处主任，解放战争时在东北民主联军、第四野战军第三十八军任师政治部主任，参加辽沈、平津战役。1949 年后任师政委、军政治部主任、广州军区防空军政委、空四军政委，1955 年授少将，1962 年任南京军区空军副政委兼空四军政委。
      verify: true
    - h: 抄家与撤职
      from: 1966
      to: 1970
      text: |
        据 1980 年起诉书，1966 年 10 月江青勾结叶群，叶群让吴法宪把他找到北京，说“江青同志有一封信落在郑君里、顾而已他们手里”，要他搜查郑君里、顾而已、赵丹、童芷苓等五人的家。他回上海后组织四十多人冒充红卫兵，10 月 9 日凌晨搜查了赵丹、郑君里、童芷苓、陈鲤庭和顾而已的家，把搜得的东西分两次送到叶群住处。1966 年 12 月任南京军区空军政委兼空四军第一政委，1968 年 4 月被撤职，此后到北京参加空军党委常委办公会议。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
    - h: 三点联系与第一线指挥
      from: 1971-03
      to: 1971-09
      text: |
        1971 年 3 月 31 日，林立果按《“571工程”纪要》建立“指挥班子”的计划，在上海召集他和王维国、陈励耘、周建平秘密开会，指定南京以周建平、上海以王维国、杭州以陈励耘为“头”，由他“进行三点联系、配合、协同作战”。9 月 8 日林彪下达武装政变手令后，林立果、周宇驰向他传达，派他担任上海地区第一线指挥，密谋用火焰喷射器、四零火箭打毛泽东的专列，或炸苏州附近的硕放铁路桥。计划落空后，9 月 12 日他又接受南逃广州的布置。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, ws-1972-lin-material-3]
    - h: 主犯
      from: 1971-09-14
      to: 2009
      text: |
        判决书说他“在林彪叛逃的第二天，交代了自己的罪行”，并揭发了同案犯。1973 年被开除党籍。王飞因精神病不能出庭后，他成为两案十名主犯中唯一的“联合舰队”成员，1981 年 1 月 25 日以积极参加反革命集团罪、策动武装叛乱罪、反革命杀人罪（未遂）被判有期徒刑十八年、剥夺政治权利五年。后保外就医，住在太原，2009 年 5 月 8 日在北京病逝。
      cites: [ws-1981-01-25-judgment]
      verify: true
  assess:
