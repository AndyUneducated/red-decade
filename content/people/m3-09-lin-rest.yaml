      from: 1919
      to: 1968
      text: |
        1919 年生于成都，1935 年在成都天府中学读书时接触中共地下党，1937 年 8 月进抗大，1938 年 3 月入伍、7 月入党，此后一直在部队工作。1964 年 7 月任空五军政委，驻杭州。
      cites: [ccom-chen-liyun-interview]
    - h: 704 工程与庐山
      from: 1969
      to: 1971-03
      text: |
        1969 年 4 月当选九届中央候补委员。据他 1988 年的说法，1969 年初江腾蛟来杭州，提出给林彪修一幢房子，他与浙江的南萍、熊应堂商量后请示汪东兴，汪同意并审看了设计，这就是后来的“704 工程”（今浙江宾馆）。1970 年九届二中全会上，吴法宪找他和王维国谈话，要他们在小组会上讲设国家主席和“天才”问题；会后林立果找他们“安抚、鼓气”，说“首长（指林彪）知道你们受损失，很难过”。
      cites: [ws-1971-12-lin-chen-material-1]
      verify: true
    - h: 杭州的“头”与免予起诉
      from: 1971-03
      to: 2004-12
      text: |
        1971 年 3 月 31 日晚，林立果派于新野到杭州接他去上海开会，会上指定他为杭州的“头”，他“接受了委派”。中央 1972 年的材料说他供认林立果当月看过一架改装的伊尔─10 强击机的火箭打靶，9 月 8 日于新野到杭州同他密商用这架飞机谋害毛泽东。9 月 20 日被隔离审查，1980 年 7 月 29 日被逮捕。1982 年 3 月 10 日军事检察院的决定认定他构成参加反革命罪，但“鉴于未发现被告人陈励耘参加‘上海会议’后有新的犯罪活动，罪行较轻”，决定免予起诉。他没有申诉：“用得着上诉吗？我已经关了十多年。”此后按一般干部待遇退出现役，住在浙江嘉善，2004 年 12 月病逝。
      cites: [ccom-chen-liyun-interview, ws-1972-lin-material-3]
  assess:
    - { voice: judicial1980, text: 鉴于未发现被告人陈励耘参加“上海会议”后有新的犯罪活动，罪行较轻（1982 年军事检察院免予起诉决定书）, cite: ccom-chen-liyun-interview, quote: true }
    - { voice: official1966, text: 一九七一年九月八日，林彪反党集团派于新野到杭州同陈励耘密商了用这架飞机谋害伟大领袖毛主席的罪恶计划（1972 年中央材料之三）, cite: ws-1972-lin-material-3, quote: true }
    - { voice: witness, text: 用得着上诉吗？我已经关了十多年。再上诉，再审理，什么时候出得来？（1988 年陈励耘答记者）, cite: ccom-chen-liyun-interview, quote: true }
    - { voice: editor, text: 1972 年的中央材料把伊尔─10 飞机一事写成他参与谋杀的证据，1982 年的免予起诉决定书只认定了上海会议一条，没有提这件事。 }
