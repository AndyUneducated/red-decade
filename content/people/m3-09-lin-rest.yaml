    - { date: 1969-10-18, s: rise, note: 吴法宪交权给林立果，周宇驰在场, cite: ws-1980-indictment }
    - { date: 1971-03, s: power, note: 制订《“571工程”纪要》, cite: ws-1980-indictment }
    - { date: 1971-09-13, s: dead, note: 劫机迫降后自杀, cite: ws-1972-lin-material-3 }
