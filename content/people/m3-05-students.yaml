  bio: 生于吉林敦化，在长沙长大，父亲杨第甫是湖南省委干部。文革中是长沙一中学生，参加造反派，1968 年初写《中国向何处去？》，认为文革要推翻的是一个“红色资本家阶级”，主张建立巴黎公社式的“中华人民公社”。文章被康生、陈伯达等点名为“反动思潮”，省无联被取缔，他被捕判刑十年。1978 年出狱后改名杨小凯，自学经济学，1988 年获普林斯顿大学博士学位，后任澳大利亚莫纳什大学教授，以“新兴古典经济学”闻名。2004 年在墨尔本因肺癌去世。
