  bio: 清华大学学生，1967 年 4 月 14 日从蒯大富的井冈山兵团中分裂出“四一四”派并成为其负责人。四一四主张“解放”大多数干部，被蒯大富一派称为“保守”；1968 年 4 月至 7 月两派在清华“百日大武斗”，7 月 27 日工宣队进校后结束。他没有进入北京市革委会领导层，后来也没有被判刑，晚年写有回忆录。生卒年未查实。
  life:
    - h: 从井冈山到四一四
      from: 1966
      to: 1967-04
      text: |
        1966 年在清华参加反工作组的造反派，蒯大富的“井冈山兵团”成立后是其中一员。1967 年春，围绕如何对待清华干部、是否“解放”大多数干部，兵团内部分裂；4 月 14 日反对蒯大富的一方成立“井冈山兵团四一四总部”，他是主要负责人。
      verify: true
      cites: [walder-fractured]
    - h: 百日大武斗
      from: 1967-04
      to: 1968-07
      text: |
        1967 年下半年两派在清华对峙，各自得到中央不同人物的支持。1968 年 4 月 23 日起两派动用长矛、土枪和自制手榴弹武斗，持续约一百天，死伤多人。7 月 27 日首都工农毛泽东思想宣传队进入清华，蒯大富一派开枪抵抗，四一四一方接受宣传队，武斗结束。
      verify: true
      cites: [walder-fractured, ws-1982-12-kuai-dafu-case]
    - h: 此后
      from: 1968-08
      to: 2004
      text: |
        红卫兵组织解散后分配到外地工作，没有被追究刑事责任。2004 年在香港出版回忆录《清华大学文革纪事：一个红卫兵领袖的自述》。
      verify: true
      cites: [walder-fractured]
  assess:
