      to: 2004
      text: |
        出狱后改名杨小凯，在湖南新华印刷厂当校对，后进入中国社会科学院数量经济研究所、武汉大学。1983 年赴美国普林斯顿大学读经济学，1988 年获博士学位，此后在澳大利亚莫纳什大学任教，提出以分工为核心的“新兴古典经济学”。1980 年代末起写文章主张宪政。2004 年 7 月 7 日在墨尔本因肺癌去世。
