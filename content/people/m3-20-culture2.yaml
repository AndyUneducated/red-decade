  party: 中国共产党
  positions:
    - { title: 院长, orgName: 北京人民艺术剧院, from: 1952-06, to: 1966, verify: true }
    - { title: 院长, orgName: 北京人民艺术剧院, from: 1978-06-30, to: 1996-12-13, cite: chinanews-2010-cao-yu }
  bio: 原籍湖北潜江，生于天津，原名万家宝。1934 年发表《雷雨》，随后写出《日出》《原野》《北京人》，是中国现代话剧的奠基者之一。1949 年后参与创建中央戏剧学院和北京人民艺术剧院，任人艺院长。文革中作为“反动权威”被关押、劳动，1973 年后被逼一遍遍写“认罪检查”，又被派去首都剧场和人艺宿舍看传达室。1978 年 6 月平反，恢复院长职务。1996 年在北京去世。
  life:
    - h: 《雷雨》
      from: 1910-09-24
      to: 1949-02
      text: |
        1923 年考入南开中学，1925 年加入南开新剧团。1930 年转入清华大学西洋文学系，1934 年在《文学季刊》发表《雷雨》，1936 年发表《日出》，1937 年发表《原野》。抗战中随国立剧专迁往四川，写了《蜕变》《北京人》，改编巴金的《家》。1949 年 2 月经香港到北平，参加新政协筹备会。
      cites: [chinawriter-cao-yu]
    - h: 北京人艺
      from: 1949-02
      to: 1966
      text: |
        参与创建中央戏剧学院和北京人民艺术剧院，任人艺院长。
      cites: [chinawriter-cao-yu]
      verify: true
    - h: 看大门
      from: 1966
      to: 1978-06-30
      text: |
        据他自己后来说，他“被关了几年，后来又劳动”。1973 年下半年军宣队、工宣队进驻人艺，称要占领“反革命修正主义文艺黑线桥头堡”，他家大门上被贴了“打倒反动权威、反革命文人曹禺！”的标语。上级要他写出“上纲上线”的认罪检查才能“解放”，他被特准不参加劳动专写检查，却一次次被军宣队政委以“认识不深刻”打回；后来由编剧梁秉堃代笔，套用“两报一刊”社论的语言写成，他对承认“反革命”三个字仍有顾虑。长期折磨之后他住进协和医院，出院后被派到首都剧场传达室看大门、打扫院子，因日本剧团来访怕被外宾看见，又被转到史家胡同人艺宿舍传达室，传呼电话、倒垃圾。
      cites: [chinanews-2010-cao-yu]
    - h: 平反与晚年
      from: 1978-06-30
      to: 1996-12-13
      text: |
        1978 年 6 月 30 日北京市文化局发文为他平反落实政策，恢复北京人艺院长职务。1996 年冬去世。
      cites: [chinanews-2010-cao-yu]
      verify: true
  assess:
    - { voice: witness, text: 他们逼着你招供，供了以后不但别人相信，甚至连你自己也相信，觉得自己是个大坏蛋，不能生存于这个世界，造成自卑感，觉得自己犯了大错误，不要写戏了，情愿去扫街。（曹禺文革后答赵浩生问，梁秉堃转引）, cite: chinanews-2010-cao-yu, quote: true }
    - { voice: editor, text: 中国作家网转载的《曹禺生平》从 1949 年直接写到他和同事“经过四十多年的奋斗”建成北京人艺，同样不提文革；他在文革中的遭遇主要靠梁秉堃等同事的回忆。, cite: chinawriter-cao-yu }
  factions: [academics]
  fate:
    - { date: 1952-06, s: normal, note: 北京人艺院长, verify: true }
    - { date: 1966, s: attacked, note: 被打成“反动权威”, cite: chinanews-2010-cao-yu, verify: true }
    - { date: 1978-06-30, s: restored, note: 平反，恢复院长职务, cite: chinanews-2010-cao-yu }
    - { date: 1996-12-13, s: dead, verify: true }
  cites: [chinawriter-cao-yu, chinanews-2010-cao-yu]

