  bio: 生于北京，原名焕鼎，祖上是元朝梁王，蒙古族。1917 年起在北京大学讲印度哲学，1921 年出版《东西文化及其哲学》，1930 年代在山东邹平主持乡村建设运动，抗战中参与发起民盟。1950 年应邀到北京，长期任全国政协委员。1953 年 9 月在会上说工人生活“在九天”、农民“在九地”，被毛泽东当众斥为“以笔杀人”“伪君子”。1966 年 8 月被红卫兵抄家。1973–1974 年批林批孔中他公开表示只批林、不批孔，在政协学习组被批判半年多，答以“三军可夺帅也匹夫不可夺志”。1978 年起任第五、六届全国政协常委。1988 年在北京去世。
  life:
    - h: 北大与乡村建设
