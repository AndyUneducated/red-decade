    - { voice: officialLater, text: 对学术问题，他敢于坚持自己认定的真理，舌战名家，不曾却阵，为我国学术争鸣创一代新风，为后来学人树光辉榜样。（同上）, cite: rmrb-1982-05-23-ma-yinchu, quote: true }
