    - { title: 校长, orgName: 中国科学技术大学, from: 1958-09, to: 1978-06-12, cite: rmrb-1978-06-19-guo-moruo }
  bio: 四川乐山人，诗人、剧作家、历史学家、古文字学家。1920 年代创办创造社，1927 年参加南昌起义并入党，1928 年后旅居日本研究古代史和甲骨金文；抗战中在周恩来领导下组织国统区文化界。1949 年后任政务院副总理、中国科学院院长、全国文联主席、全国人大常委会副委员长。1966 年 4 月他在人大常委会上说自己以前写的东西“应该全部把它烧掉”，此后一直留在高位，是九届、十届中央委员。1978 年在北京去世，邓小平致悼词。
  life:
    - h: 创造社与南昌起义
      from: 1892-11-16
      to: 1949-10
      text: |
        早年建立文学团体“创造社”。1926 年参加北伐，任国民革命军总政治部副主任；蒋介石清党后写讨蒋檄文《请看今日之蒋介石》。1927 年参加南昌起义，同年 8 月入党。1928 年起旅居日本研究中国古代史和古文字学。抗战爆发后回国，在周恩来领导下组织国统区进步文化人士，写了许多历史剧。
      cites: [rmrb-1978-06-19-guo-moruo]
    - h: 科学院与文联
      from: 1949-10
      to: 1966-04
      text: |
        1949 年被选为全国文联主席，此后历任中央人民政府委员、政务院副总理兼文化教育委员会主任、中国科学院院长、中国科学技术大学校长，第一至第五届全国人大常委会副委员长。他也是文化界的门面：1966 年 2 月 3 日五人小组扩大会上，彭真为“学术批判不要过头”辩护时，说的是“象郭沫若这样的人都很紧张了”。
      cites: [rmrb-1978-06-19-guo-moruo, ws-1966-05-16-notice-attachment]
    - h: “全部把它烧掉”
      from: 1966-04
      to: 1976-10
      text: |
        1966 年 4 月 14 日，全国人大常委会第三十次会议听取石西民关于社会主义文化革命的报告，他即席发言：自己写了几百万字，“拿今天的标准来讲，我以前所写的东西，严格地说，应该全部把它烧掉，没有一点价值”；又说工农兵学毛主席著作“比我们这些知识分子学得好得多”。发言 5 月 5 日由《人民日报》转载。此后他当选九届、十届、十一届中央委员，1975 年继续任四届全国人大常委会副委员长。
      cites: [rmrb-1966-05-05-guo-moruo, rmrb-1978-06-19-guo-moruo, rmrb-1975-01-19-npc-sc-list]
    - h: 晚年
      from: 1976-10
      to: 1978-06-12
      text: |
        1976 年 10 月写诗欢呼“大快人心事，揪出‘四人帮’”。1978 年春抱病参加全国科学大会，“欢呼我国科学的春天的到来”。6 月 12 日在北京去世，终年 86 岁，邓小平在追悼会上致悼词。
      cites: [rmrb-1978-06-19-guo-moruo]
  assess:
    - { voice: doc, text: 拿今天的标准来讲，我以前所写的东西，严格地说，应该全部把它烧掉，没有一点价值。（1966 年 4 月 14 日人大常委会发言）, cite: rmrb-1966-05-05-guo-moruo, quote: true }
    - { voice: officialLater, text: 他是继鲁迅之后，在中国共产党领导下，在毛泽东思想指引下，我国文化战线上又一面光辉的旗帜。（1978 年邓小平悼词）, cite: rmrb-1978-06-19-guo-moruo, quote: true }
    - { voice: officialLater, text: 他坚持无产阶级专政下继续革命，在党内历次路线斗争中，在思想文化界反对资产阶级的斗争中，在国际反帝反修斗争中，立场坚定，旗帜鲜明，坚决站在毛主席革命路线一边。（同上）, cite: rmrb-1978-06-19-guo-moruo, quote: true }
    - { voice: editor, text: 1978 年 6 月的悼词仍用“无产阶级专政下继续革命”“第十一次路线斗争”这类华国锋时期的说法，对他 1966 年的自我否定和文革中的表态都没有提。, cite: rmrb-1978-06-19-guo-moruo }
  factions: [academics]
  fate:
    - { date: 1949, s: normal, note: 中国科学院成立，任首任院长，直到 1978 年去世（此前数据作 1949-11，维基只记年份）（维基百科，未核原件）, cite: enwiki-guo-moruo }
    - { date: 1966-04-14, s: normal, note: 在人大常委会上全盘否定自己的著作, cite: rmrb-1966-05-05-guo-moruo }
    - { date: 1969-04, s: normal, note: 九届中央委员, cite: rmrb-1978-06-19-guo-moruo }
    - { date: 1978-06-12, s: dead, cite: rmrb-1978-06-19-guo-moruo }
  cites: [rmrb-1966-05-05-guo-moruo, rmrb-1978-06-19-guo-moruo, ws-1966-05-16-notice-attachment, rmrb-1975-01-19-npc-sc-list]

- id: ba-jin
