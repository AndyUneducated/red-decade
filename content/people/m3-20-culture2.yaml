      cites: [aisixiang-chen-xiaoping-liang-feng, gpnu-liang-shuming]
      verify: true
    - h: 九天九地
      from: 1950-01
      to: 1966-08
      text: |
        1950 年初应邀来北京，任全国政协委员。1953 年 9 月 11 日，他在讨论过渡时期总路线的会上说，有人说如今工人的生活在九天，农民的生活在九地。次日毛泽东即席讲话，说照顾农民是“小仁政”，有人“班门弄斧”。17 日周恩来讲话称他一贯反动，毛泽东插话：“你虽没有以刀杀人，却是以笔杀人的。”18 日他再次发言，要看毛泽东“有无雅量”，毛泽东答：“你要的这个雅量，我大概不会有。”他被表决赶下讲台，几天后写检讨，此后会议“通知照发，但参不参加自便”，政协委员没有撤销。
      cites: [aisixiang-chen-xiaoping-liang-feng]
    - h: 只批林不批孔
      from: 1966-08
      to: 1976-10
      text: |
        1966 年 8 月被红卫兵赶出居室、抄家批斗约二十天，此后在小屋里写《儒佛异同论》。1973 年 10 月批林批孔开始，他在政协直属学习组一直沉默，被人指责“保持沉默本身就是一种态度”；江青在首都体育馆的大会上也点了他的名。1974 年 2 月 22 日至 25 日，他用两个半天作了《今天我们应该如何评价孔子》等长篇发言，说自己“只批林不批孔”。此后政协各学习小组批判他半年多，9 月 19 日至 21 日连开三天大会，23 日召集人问他感想，他答“三军可夺帅也匹夫不可夺志”。
      cites: [aisixiang-chen-xiaoping-liang-feng, gpnu-liang-shuming, rujia-gan-chunsong-liang-shuming]
    - h: 晚年
      from: 1976-10
      to: 1988-06-23
      text: |
        任第五、六届全国政协常委；1980 年后相继任宪法修改委员会委员、中国文化书院院务委员会主席。1985 年 12 月冯友兰九十寿辰前，他写信说冯“曾谄媚江青”，不愿赴寿宴，读了冯寄来的《三松堂自序》后同意相见。1988 年 6 月 23 日在北京去世。官方生平的起草者原想写他 1953 年“受到不实事求是的批判”，中央书记处改为“受到批评”，家属拒绝，最后整段删去。
