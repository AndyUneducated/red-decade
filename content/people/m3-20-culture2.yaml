  assess:
    - { voice: scholar, text: 其间毛主席频频插话，分量很重，如：“你虽没有以刀杀人，却是以笔杀人的。”“人家说你是好人，我说你是伪君子。”（陈晓平概述 1953 年 9 月 17 日会议）, cite: aisixiang-chen-xiaoping-liang-feng, quote: true }
    - { voice: witness, text: 至于林彪是不是要走孔子的路，行孔孟之道，我却不敢相信。我不认为林彪受害于孔子。（梁漱溟 1974 年在政协学习组的发言，干春松转引）, cite: rujia-gan-chunsong-liang-shuming, quote: true }
    - { voice: witness, text: 在本组23日会上，召集人曾征问我对大会有何感想，我答云：‘三军可夺帅也匹夫不可夺志’。（梁漱溟回忆 1974 年 9 月，干春松转引）, cite: rujia-gan-chunsong-liang-shuming, quote: true }
    - { voice: witness, text: 7月6日，中央书记处批回《生平》稿，把“受到不实事求是的批判”改为“受到批评”。（胡治安回忆 1988 年起草梁漱溟生平）, cite: gmw-2004-liang-shuming-shengping, quote: true }
    - { voice: editor, text: 1988 年的官方生平最后对 1953 年一字不提：起草者想写“不实事求是”，中央书记处只肯写“批评”，家属宁可不提。他一生最出名的一件事，就这样从盖棺论定里消失了。, cite: gmw-2004-liang-shuming-shengping }
