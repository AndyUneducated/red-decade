# M3 people round 2, batch 20: 文化学术二。郭沫若（自我否定后留在高位）、巴金、曹禺、夏衍、阳翰笙（文艺界被批斗关押者），
# 梁漱溟、马寅初（1950 年代就被批判的“诤友”），赵九章（被迫害致死的科学家）、华罗庚、冯友兰（梁效顾问）。
# Texts: 1966 年郭沫若人大常委会发言，1978 年邓小平悼词，1966 年五一六通知附件，1967 年《红旗》京剧社论，1971 年批田汉文章，
# 1980 年起诉书，1981 年判决书；《人民日报》1982 年马寅初、1985 年华罗庚生平；新华社巴金生平；巴金《怀念萧珊》；
# 中国作家网曹禺生平、阳翰笙条；梁秉堃、沈轶伦、陈晓平、干春松文；胡治安回忆起草梁漱溟生平；《中国科学报》赵九章文。

- id: guo-moruo
  name: 郭沫若
