  bio: 浙江吴兴人，生于河南开封，气象学家、地球物理学家。1938 年获柏林大学博士，1944 年起主持中央研究院气象研究所，1949 年参与组织气象所拒迁台湾。1950 年起任中科院地球物理所所长，1955 年当选学部委员。1958 年起主持人造卫星预研，1966 年任中科院卫星设计院院长。文革中被“靠边站”、写检查，1968 年 10 月 26 日去世；1980 年起诉书把他列为被迫害致死的科学家之一。1970 年“东方红一号”发射时他已去世 18 个月。1978 年平反，1999 年追授“两弹一星”功勋奖章。
  life:
    - h: 气象所
      from: 1907-10-15
      to: 1949-10
      text: |
        出身中医世家，五四运动后改学科学。1933 年清华大学物理系毕业，1938 年获德国柏林大学博士，回国后在西南联大任教。1944 年经竺可桢推荐任中央研究院气象研究所代所长，1949 年参与组织气象所拒迁台湾。
      cites: [kxb-2019-zhao-jiuzhang]
    - h: 地球物理所与卫星
      from: 1949-10
      to: 1966-06
      text: |
        1950 年任中科院地球物理研究所第一任所长，1955 年当选学部委员。从 1957 年起倡议发展中国自己的人造卫星，1958 年任中科院“581”组副组长，主持卫星和探空火箭预研。1966 年任新成立的中科院卫星设计院院长。
      cites: [kxb-2019-zhao-jiuzhang]
    - h: 靠边站
      from: 1966-06
      to: 1968-10-26
      text: |
        文革中不断受到冲击，被“靠边站”。同事潘厚任回忆，他在地球物理所小楼的门堂里，以大木箱当桌、小木箱当凳，佝偻着身子写“检查”。1968 年 8 月康生指使中组部编造的《关于三届人大常委委员政治情况的报告》把他列入被诬陷的六十名人大常委之中。1968 年 10 月 26 日清晨去世，年 61 岁。
      cites: [kxb-2019-zhao-jiuzhang, ws-1980-indictment]
  rehab:
    - { date: 1978, text: 经邓小平批示，中国科学院为他平反昭雪，在八宝山举行骨灰安放仪式, cite: kxb-2019-zhao-jiuzhang }
  assess:
    - { voice: judicial1980, text: 著名地球物理学家赵九章、冶金学家叶渚沛、理论物理学家张宗燧、昆虫学家刘崇乐、植物分类学家陈焕镛、冶金陶瓷学家周仁等被迫害致死。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: witness, text: 年轻人自行车轮胎破了，在门口修理，他也过去看看。看得出他很想帮忙，但形势所迫，他无法多言。（潘厚任回忆，《中国科学报》2019）, cite: kxb-2019-zhao-jiuzhang, quote: true }
    - { voice: editor, text: 本站所引材料都只写他“去世”或“被迫害致死”，没有写具体死因。, cite: kxb-2019-zhao-jiuzhang }
  factions: [academics]
  fate:
    - { date: 1950, s: normal, note: 地球物理所所长, cite: kxb-2019-zhao-jiuzhang }
    - { date: 1966, s: attacked, note: 靠边站、写检查, cite: kxb-2019-zhao-jiuzhang }
    - { date: 1968-10-26, s: dead, cite: kxb-2019-zhao-jiuzhang }
  cites: [kxb-2019-zhao-jiuzhang, ws-1980-indictment, ws-1981-01-25-judgment]

- id: hua-luogeng
  name: 华罗庚
  born: 1910-11-12
  died: 1985-06-12
  deathKind: natural
  deathPlace: 日本东京
  tier: 3
  role1966: 中国科学院数学研究所所长、中国科学技术大学副校长
  pinyin: Huà Luógēng
  gender: m
  birthplace: 江苏金坛
  party: 中国共产党
  positions:
    - { title: 所长, orgName: 中国科学院数学研究所, from: 1952, to: 1966, cite: rmrb-1985-06-22-hua-luogeng, verify: true }
    - { title: 委员, orgName: 全国人民代表大会常务委员会, from: 1954-09, to: 1985-06-12, cite: rmrb-1985-06-22-hua-luogeng }
    - { title: 副主席, orgName: 中国人民政治协商会议全国委员会, from: 1983-06, to: 1985-06-12, cite: rmrb-1985-06-22-hua-luogeng }
  bio: 江苏金坛人，只有初中文凭，靠自学成为数学家。经熊庆来推荐 1931 年进清华，后赴剑桥，抗战中在西南联大写成《堆垒素数论》，1946 年赴美，任伊利诺大学终身教授。1950 年回国，任中科院数学所所长、中国科大数学系主任和副校长。1950 年代末起推广“优选法”“统筹法”。文革中受迫害，手稿被盗，周恩来出面保护；他一直是全国人大常委会委员。1979 年入党，1985 年 6 月 12 日在东京作学术报告时心脏病发作去世。
  life:
    - h: 自学成才
      from: 1910-11-12
      to: 1950
      text: |
        出身金坛城市贫民家庭，初中毕业后读了一年职业学校，因家贫在父亲的杂货铺当学徒，业余自学数学。论文受到清华大学数学系主任熊庆来重视，1931 年经推荐到清华工作，从管理员做到讲师，又到剑桥研究。1938 年任西南联大教授，写成《堆垒素数论》。1946 年秋赴美，任普林斯顿高等研究院研究员、伊利诺大学终身教授。
      cites: [rmrb-1985-06-22-hua-luogeng]
    - h: 数学所与双法
      from: 1950
      to: 1966-06
      text: |
        1950 年回国，先后任清华大学教授、中国科学院数学研究所所长、中国数学会理事长、中国科学技术大学数学系主任和副校长。1950 年代末起走出书斋推广“优选法”“统筹法”，1964、1965 年毛泽东两次写信勉励他。
      cites: [rmrb-1985-06-22-hua-luogeng]
    - h: 身处逆境
      from: 1966-06
      to: 1976-10
      text: |
        据 1985 年的生平，他文革中受到林彪、江青集团迫害，周恩来出面保护，支持他继续推广“双法”；他的手稿在“十年浩劫”中被盗走。1968 年 8 月康生指使中组部编造的报告把他列入被诬陷的六十名人大常委之中。1975 年 1 月他仍被列为第四届全国人大常委会委员。
      cites: [rmrb-1985-06-22-hua-luogeng, ws-1980-indictment, rmrb-1975-01-19-npc-sc-list]
    - h: 入党与去世
      from: 1976-10
      to: 1985-06-12
      text: |
        1979 年入党。用近三年时间凭记忆重写被盗的手稿，写成《计划经济大范围最优化的数学理论》。任中国科学院副院长、民盟副主席，1983 年起任全国政协副主席。1985 年 6 月 12 日晚在日本东京逝世，终年 74 岁。
      cites: [rmrb-1985-06-22-hua-luogeng]
  assess:
    - { voice: officialLater, text: 十年动乱期间，当华罗庚同志受到林彪、江青反革命集团迫害时，周恩来同志以大无畏的精神挺身而出，保护华罗庚同志，支持他继续从事“双法”的研究和推广工作。（1985 年新华社生平）, cite: rmrb-1985-06-22-hua-luogeng, quote: true }
    - { voice: judicial1980, text: 一百一十五名全国人大常委会委员，有六十人被分别诬陷为“叛徒”、“叛徒嫌疑”、“特务”、“特务嫌疑”、“反革命修正主义分子、走资派、三反分子”、“有严重问题”。（1980 年起诉书，名单中有华罗庚、赵九章）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 生平说他文革中“身处逆境”、手稿“被盗走”，但没有写是怎样被迫害的；同一时期他一直保留全国人大常委会委员的名义。, cite: rmrb-1985-06-22-hua-luogeng }
  factions: [academics]
  fate:
    - { date: 1950, s: normal, note: 回国, cite: rmrb-1985-06-22-hua-luogeng }
    - { date: 1966, s: attacked, note: 受迫害，手稿被盗, cite: rmrb-1985-06-22-hua-luogeng }
    - { date: 1975-01, s: normal, note: 四届全国人大常委会委员, cite: rmrb-1975-01-19-npc-sc-list }
    - { date: 1985-06-12, s: dead, note: 在东京作学术报告时去世, cite: rmrb-1985-06-22-hua-luogeng }
  cites: [rmrb-1985-06-22-hua-luogeng, ws-1980-indictment, rmrb-1975-01-19-npc-sc-list]

- id: feng-youlan
  name: 冯友兰
  born: 1895-12-04
  died: 1990-11-26
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 北京大学哲学系教授
  pinyin: Féng Yǒulán
  gender: m
  aka:
    - { kind: courtesy, name: 芝生 }
  birthplace: 河南唐河
  positions:
    - { title: 教授, orgName: 北京大学, from: 1952, to: 1990-11-26, cite: pku-feng-youlan, verify: true }
    - { title: 常委, orgName: 中国人民政治协商会议全国委员会, from: 1983-06, to: 1990-11-26, cite: pku-feng-youlan }
  bio: 河南唐河人，哲学家，1918 年毕业于北大哲学系，1923 年获哥伦比亚大学博士，1930 年代写成两卷本《中国哲学史》，长期任清华文学院院长。1949 年后任北大哲学系教授。文革初被抄家、批斗、关进“牛棚”，1968 年秋获释。1973 年批林批孔中发表批孔和自我批判的发言，被《光明日报》转载，同年秋成为“梁效”顾问，1974 年写《咏史》诗，其中有“则天敢于做皇帝”句。晚年自承当时“有哗众取宠之心”，口述完成七卷本《中国哲学史新编》。1990 年在北京去世。
  life:
    - h: 中国哲学史
      from: 1895-12-04
      to: 1949-10
      text: |
        1918 年毕业于北京大学哲学系，1920 年赴美，1923 年获哥伦比亚大学哲学博士。回国后历任中州大学、广州大学、燕京大学教授，清华大学哲学系主任和文学院院长，西南联大教授。1930 年代初写成两卷本《中国哲学史》。1948 年任清华大学校务会议代主席。
      cites: [pku-feng-youlan]
    - h: 改造
      from: 1949-10
      to: 1966-07
      text: |
        1949 年 10 月写信给毛泽东，表示过去讲的是封建哲学，要用五年时间以马克思主义观点重写中国哲学史；毛泽东回信说“不必急于求效，可以慢慢地改，总以采取老实态度为宜”。此后任北大哲学系教授。1957 年 4 月应邀到毛泽东家做客，毛泽东说“好好的鸣吧，百家争鸣，你就是一家嘛”。
      cites: [aisixiang-chen-xiaoping-liang-feng, pku-feng-youlan]
    - h: 牛棚
      from: 1966-07
      to: 1973
      text: |
        1966 年 7 月燕南园的家被查封，工资降到最少每月 24 元，子女也被批斗。病中开刀做了一半就被赶出医院，第二天拖着尿瓶挨批斗。工宣队进驻后被关进“牛棚”，1968 年秋获释，据说是因为毛泽东说过“北京大学有一个冯友兰，是讲唯心主义哲学的”。1971 年 5 月谢静宜来家转达毛泽东的问候，他写了感谢信和诗。
      cites: [aisixiang-chen-xiaoping-liang-feng]
    - h: 梁效顾问
      from: 1973
      to: 1976-10
      text: |
        1973 年批林批孔中，他在校内作了两次批孔和批判自己尊孔思想的发言，刊于《北京大学学报》，《光明日报》等全文转载并加编者按。同年秋迟群、谢静宜在清华开会成立北大、清华两校大批判组，笔名“梁效”，他任顾问。1974 年 6 月参加江青到会的大批判组会议，随后在天津住院时写了《咏史》二十五首，其中有“则天敢于做皇帝，亘古中华一女雄”。
      cites: [aisixiang-chen-xiaoping-liang-feng]
    - h: 新编
      from: 1976-10
      to: 1990-11-26
      text: |
        四人帮倒台后，“则天敢于做皇帝”两句被批为吹捧江青。他在《三松堂自序》里说自己当时“确有哗众取宠之心”。1985 年 12 月九十寿辰前，梁漱溟来信说他“曾谄媚江青”，读过《三松堂自序》后两人见面。他从 1980 年起口述写作七卷本《中国哲学史新编》，1990 年 7 月完成，11 月 26 日在北京友谊医院去世。
      cites: [aisixiang-chen-xiaoping-liang-feng, pku-feng-youlan]
  assess:
    - { voice: witness, text: 我当时自以为是跟着毛主席、党中央走的，鼓励我的那些群众也是这样想的，至少也是这样说的。可是我当时也确有哗众取宠之心。（冯友兰《三松堂自序》，陈晓平转引）, cite: aisixiang-chen-xiaoping-liang-feng, quote: true }
    - { voice: witness, text: 某教授的文章我拜读过了，我与他相熟，前不久还碰见他呢。我怀疑他文章所说的是否是他内心要说的真话。（梁漱溟回忆 1973 年政协学习会上的发言，干春松转引）, cite: rujia-gan-chunsong-liang-shuming, quote: true }
    - { voice: scholar, text: 冯友兰成为“梁效”的顾问，主要任务是查阅一些成语、典故的出处。（陈晓平，据《三松堂自序》）, cite: aisixiang-chen-xiaoping-liang-feng, quote: true }
    - { voice: editor, text: 他在梁效里到底做了什么，说法分歧很大。本站收的陈晓平一文为他辩护，说他只是查典故；批评者则把《咏史》中“则天敢于做皇帝”一类诗句看作迎合江青。本站只收录了辩护一方的文本和他本人的检讨。, cite: aisixiang-chen-xiaoping-liang-feng }
  factions: [academics]
  fate:
    - { date: 1966-07, s: attacked, note: 抄家、批斗、关“牛棚”, cite: aisixiang-chen-xiaoping-liang-feng }
    - { date: 1968, s: normal, note: 秋天放出“牛棚”, cite: aisixiang-chen-xiaoping-liang-feng }
    - { date: 1973, s: rise, note: 任“梁效”顾问, cite: aisixiang-chen-xiaoping-liang-feng }
    - { date: 1990-11-26, s: dead, cite: pku-feng-youlan }
  cites: [pku-feng-youlan, aisixiang-chen-xiaoping-liang-feng, rujia-gan-chunsong-liang-shuming]
