  birthplace: 四川成都
  positions:
    - { title: 委员, orgName: 全国人民代表大会常务委员会, from: 1978-03, to: 1983-06, cite: xinhua-2005-ba-jin }
    - { title: 副主席, orgName: 中国人民政治协商会议全国委员会, from: 1983-06, to: 2005-10-17, cite: xinhua-2005-ba-jin }
    - { title: 主席, orgName: 中国作家协会, from: 1984, to: 2005-10-17, cite: xinhua-2005-ba-jin, verify: true }
  bio: 四川成都人，原名李尧棠。1929 年以“巴金”笔名发表《灭亡》，1930 年代写成《家》《春》《秋》，是五四以来影响最大的小说家之一。1949 年后任上海文联、作协领导，与靳以创办《收获》。文革中被关进上海作协的“牛棚”，劳动、写交代、被拉出去“示众”；妻子萧珊因为是他的妻子也被关进“牛棚”、扫马路，患病得不到治疗，1972 年去世。晚年写成五卷《随想录》。1983 年起任全国政协副主席，后任中国作家协会主席。2005 年在上海去世，终年 101 岁。
  life:
    - h: 《家》
      from: 1904-11-25
      to: 1949-10
      text: |
        受五四运动影响开始阅读《新青年》，1922 年发表诗作。1927 年赴巴黎，写成第一部长篇《灭亡》，1929 年第一次以“巴金”笔名在《小说月报》发表。回国后写出《家》《春》《秋》、“爱情的三部曲”，主持文化生活出版社。抗战中任郭沫若主持的《救亡日报》编委，写《火》《憩园》《寒夜》。1949 年出席第一届全国政协。
      cites: [xinhua-2005-ba-jin]
    - h: 上海文坛
      from: 1949-10
      to: 1966-08
      text: |
        1949 年后历任平明出版社总编辑，《文艺月报》《收获》《上海文学》主编，上海市文联副主席、上海市作家协会主席、中国作家协会副主席，第一至第三届全国人大代表。两次去朝鲜战场，根据他的小说《团圆》改编的电影《英雄儿女》影响很大。
      cites: [xinhua-2005-ba-jin]
    - h: 牛棚
      from: 1966-08
      to: 1976-10
      text: |
        据他 1978 年写的《怀念萧珊》，他每天在作协上海分会的“牛棚”里劳动、学习、写交代、写检查、写思想汇报，外地来串联的人可以随意点名叫他出去“示众”、自报罪行，任何人都可以闯进他家拿走东西。萧珊也被关进“牛棚”、挂上“牛鬼蛇神”的小纸牌、扫马路；她患了病得不到治疗，逝世前三个星期才靠开后门住进医院，肠癌已转成肝癌。1972 年 8 月 13 日去世，向遗体告别的只有二三十人。
      cites: [ifeng-ba-jin-xiao-shan]
    - h: 《随想录》
      from: 1976-10
      to: 2005-10-17
      text: |
        1978 年 3 月当选第五届全国人大常委会委员。年近八旬时写完五卷《随想录》，《怀念萧珊》是其中一篇。1983 年起连任第六至第十届全国政协副主席，后任中国作家协会主席。2005 年 10 月 17 日在上海去世，享年 101 岁。
      cites: [xinhua-2005-ba-jin, ifeng-ba-jin-xiao-shan]
  assess:
    - { voice: witness, text: 我想，这是多不公平！她究竟犯了什么罪？她也给关进“牛棚”，挂上“牛鬼蛇神”的小纸牌，还扫过马路。究竟为什么？理由很简单，她是我的妻子。（巴金《怀念萧珊》，1978）, cite: ifeng-ba-jin-xiao-shan, quote: true }
    - { voice: officialLater, text: 几十年来，他与中国共产党肝胆相照、风雨同舟。（2005 年新华社生平）, cite: xinhua-2005-ba-jin, quote: true }
    - { voice: editor, text: 新华社生平从“新中国成立后”的任职直接写到“进入改革开放新时期后”，全文没有提到文化大革命；而他晚年最有名的作品《随想录》写的正是文革。, cite: xinhua-2005-ba-jin }
  factions: [academics]
  fate:
    - { date: 1966-08, s: attacked, note: 关进作协上海分会“牛棚”, cite: ifeng-ba-jin-xiao-shan }
    - { date: 1978-03, s: restored, note: 当选五届全国人大常委会委员, cite: xinhua-2005-ba-jin }
    - { date: 1983-06, s: normal, note: 全国政协副主席, cite: xinhua-2005-ba-jin }
    - { date: 2005-10-17, s: dead, cite: xinhua-2005-ba-jin }
  cites: [xinhua-2005-ba-jin, ifeng-ba-jin-xiao-shan]

