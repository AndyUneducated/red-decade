  bio: 浙江嵊县人，经济学家、教育家。抗战中抨击官僚资本，被国民党关进集中营数年。1951 年任北京大学校长。1950 年代中期提出以节制生育为中心的“新人口论”，主张计划生育、推迟结婚年龄，随后在康生、陈伯达策动下被扣上“中国的马尔萨斯”“反党反社会主义”的帽子，被迫辞去北大校长，离开全国人大常委会，此后二十年默默无闻。1979 年后平反，任北大名誉校长。1982 年在北京去世，按遗愿不开追悼会。
  life:
    - h: 民主战士
      from: 1882-06-24
      to: 1949-10
      text: |
        抗战中写文章、作讲演，反对官僚资本主义和通货膨胀，被国民党监禁到集中营数年；出狱后继续呼吁“打倒官僚资本”。
      cites: [rmrb-1982-05-23-ma-yinchu]
    - h: 新人口论
      from: 1949-10
      to: 1979
      text: |
        1950 年代中期提出“新人口论”，认为人口“增殖太快”，“影响积累、影响工业化”，主张“实行计划生育”“推迟结婚年龄”；又主张国民经济综合平衡，不能片面强调重工业。随后在康生、陈伯达策动下受到批判，被扣上“资产阶级代表人物”“中国的马尔萨斯”“反党反社会主义”等帽子。他“孤军作战”，不肯检讨，最后辞去北大校长职务，随后离开人大常委会。此后二十年默默无闻；1960 年代曾上书中央领导，就学习毛泽东思想、防止个人崇拜等问题直言。
      cites: [rmrb-1982-05-23-ma-yinchu]
    - h: 平反
      from: 1979
      to: 1982-05-10
      text: |
        十一届三中全会后彻底平反，新人口论和综合平衡理论被肯定为正确，恢复职务和名誉，任全国人大常委、政协常委、北大名誉校长。1981 年举行了百岁寿辰活动。1982 年 5 月去世，按遗愿不开追悼会，骨灰一部分安放八宝山，一部分归葬嵊县。
      cites: [rmrb-1982-05-23-ma-yinchu]
  assess:
