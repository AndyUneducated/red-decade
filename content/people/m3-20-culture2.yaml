    - { title: 副部长, orgName: 文化部, from: 1955-07, to: 1965, cite: thepaper-2016-xia-yan, verify: true }
  bio: 浙江杭州人，原名沈乃熙，剧作家、电影编剧，1930 年代上海左翼文艺和电影运动的组织者之一。1949 年后任上海市委宣传部长，1955 年起任文化部副部长分管电影，1965 年文化部整风后被免职。文革中作为“四条汉子”之一被批斗，1966 年 12 月被红卫兵抓走，随后由卫戍区“监护”，1968 年被看守踢断右腿致残，1975 年 7 月才从秦城获释，前后失去自由八年七个月。1977 年后复出，1995 年在北京去世。
  life:
    - h: 左翼文艺
      from: 1900-10-30
      to: 1949-05
      text: |
        1920 年代留学日本，回国后在上海从事左翼文艺和电影工作，写过话剧《上海屋檐下》；抗战中办《救亡日报》，在桂林、香港、重庆做统战工作。
      verify: true
    - h: 文化部
      from: 1949-05
      to: 1966-06
      text: |
        1949 年随军进入上海，任上海市委宣传部长，后调任文化部副部长分管电影。1965 年初文化部整风结束，他被正式免去副部长职务，赋闲在家；1966 年 2 月赴山西介休参加四清，不久因病回家。
      cites: [thepaper-2016-xia-yan]
      verify: true
    - h: 阎王殿与监护
      from: 1966-06
      to: 1975-07-12
      text: |
