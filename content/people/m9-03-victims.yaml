    - { date: 1961-01-16, s: detained, note: 开除党籍、逮捕, cite: ws-1962-04-23-xu-wenbo-punishment }
  cites: [ws-1962-04-23-xu-wenbo-punishment]

- id: zhang-nianzhong
  name: 张念仲
  tier: 3
  role1966: 原商城县委第一书记（1960 年被捕）
  pinyin: Zhāng Niànzhòng
  gender: m
  origin: 河北滦南
  bio: 河北滦南人，1944 年入党，1949 年南下河南光山，1956 年调商城县，历任县委农村工作部长、书记处书记、第一书记、第二书记。1959 年冬任县委第二书记时亲率一百零四名干部到上石桥公社张畈、龙堂两个大队反瞒产，两个大队死亡一千零七十一人。1960 年 5 月铁佛寺水库决口前不采取措施，淹死一千一百四十多人。1960 年 11 月 5 日被捕。商城县委 1961 年的材料说全县死亡九万六千余人。
  life:
    - h: 张畈、龙堂
      from: 1959-11-25
      to: 1960-01
      text: |
        1959 年 11 月 25 日率副县长、公安局长等一百零四名干部进张畈、龙堂反瞒产，说“现在不是粮食问题，是思想问题，是富裕中农向党进攻”，要“斗深、斗透、斗臭，斗死了给他抬去埋掉”。工作队用二十余种手段逼粮，两个大队原有四千五百九十六人，死亡一千零七十一人。他亲自主持斗争的生产组长芦伯成十天后死去。
      cites: [ws-1961-zhang-nianzhong]
    - h: 铁佛寺水库
      from: 1960-05-17
      to: 1960-05-18
      text: |
        1960 年 5 月 17 日暴雨，完成百分之八十的铁佛寺水库水位上涨，工地负责人两次告急，他说“不准惊慌，不要大惊小怪”；夜里见水已涨至坝面，未采取措施离开。凌晨大坝溃决，淹死一千一百四十多人，他上报一千零九十人。
      cites: [ws-1961-zhang-nianzhong]
    - h: 瞒报与被捕
      from: 1960-04
      to: 1961-03-31
      text: |
        1960 年 4 月全县已掌握死亡二万八千多人，他在省六级干部会议期间只报一万二千人。1960 年 11 月 5 日被捕。1961 年 3 月 31 日商城县委的材料称他是“商城事件”、铁佛寺水库决口惨案的“罪魁祸首”。
      cites: [ws-1961-zhang-nianzhong]
  assess:
    - { voice: doc, text: 对富裕农民的斗争，要斗深、斗透、斗臭，斗死了给他抬去埋掉（张念仲语，中共商城县委 1961 年材料引）, cite: ws-1961-zhang-nianzhong, quote: true }
  factions: [provincial]
  fate:
    - { date: 1959-11-25, s: power, note: 商城县委第二书记, cite: ws-1961-zhang-nianzhong }
    - { date: 1960-11-05, s: detained, note: 被捕, cite: ws-1961-zhang-nianzhong }
  cites: [ws-1961-zhang-nianzhong]

