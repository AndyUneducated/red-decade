- id: xu-wenbo
  name: 许文波
  tier: 3
  role1966: 原罗山县委第一书记（1961 年被捕）
  pinyin: Xǔ Wénbō
  gender: m
  origin: 河北涞水
  bio: 河北涞水人，1944 年参加工作，1947 年入党，1948 年南下，1949 年到河南罗山县，1956 年任县委第一书记。1959 年冬“信阳事件”中依靠“五类分子”反瞒产，提出干部要过“五关”，设卡收容外逃农民；县委 1962 年的处分决定说全县实际死亡三万五千余人，他上报只死三千二百二十四人。1961 年 1 月被开除党籍、逮捕，县委建议判处十年。
  life:
    - h: 罗山
      from: 1949-04
      to: 1959-10
      text: |
        1949 年 4 月到罗山，历任小学校长、区教育助理员、县教育科长、团县委书记、县委组织部长、副书记，1956 年任县委第一书记。处分决定说他私改党龄，把 1947 年入党改为 1945 年。
      cites: [ws-1962-04-23-xu-wenbo-punishment]
    - h: 反瞒产与“五关”
      from: 1959-10-30
      to: 1960-04-21
      text: |
        1959 年 11 月批准召开全县五类分子评查会，8 日在路宪文召集的五县会议上介绍依靠五类分子反瞒产的经验。11 月 17 日说“死人是不可抗拒的疾病，不是饿死的”；12 月 17 日在凡店现场会上提出干部要过呼喊、停伙、不搞生产、外流、造谣“五关”。全县设收容所六个、关卡四十八处，被收容的灾民死亡六百五十九人。1960 年 1 月省委书记宋致和来检查时，他汇报全县因疫病死亡一千多人，当时已死一万三千余人。
      cites: [ws-1962-04-23-xu-wenbo-punishment]
    - h: 处分
      from: 1961-01-16
      to: 1962-04-23
      text: |
        经河南省委批准，1961 年 1 月 16 日被开除党籍、逮捕法办。1962 年 1 月 20 日罗山县委常委决定维持开除党籍，建议政府判处十年有期徒刑，定为“阶级异己分子”。
      cites: [ws-1962-04-23-xu-wenbo-punishment]
  assess:
    - { voice: doc, text: 前三关地委应该负责任，后两关是自己的发挥（许文波 1962 年 1 月 8 日交代，罗山县委处分决定引）, cite: ws-1962-04-23-xu-wenbo-punishment, quote: true }
