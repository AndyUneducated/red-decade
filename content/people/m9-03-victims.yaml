  life:
    - h: 苏枚案
      from: 1967-04-06
      to: 1968-10
      text: |
        1967 年 4 月 6 日康生的妻妹、中央政法干校政治部副主任苏枚服安眠药自杀身死。康生、曹轶欧硬把自杀说成“反革命谋杀”，该校副校长石磊、医生闻伯俊被拘押；1968 年赵登程、李震按他们的意图写报告，制造“石、闻、宋反革命集团谋杀苏枚”假案，六十多名干部和家属受株连。
      cites: [ws-1983-zhao-dengcheng-case]
    - h: 三个“政治情况的报告”
      from: 1968-08-23
      to: 1968-08-27
      text: |
        康生、曹轶欧指使郭玉峰 8 月 23 日编造《关于中央监委委员政治情况的报告》，六十名委员、候补委员中三十七人被诬；27 日编造三届人大常委、四届政协常委的报告，分别诬陷六十人、七十四人。
      cites: [ws-1980-indictment]
    - h: 中央委员
      from: 1967-05-01
      to: 1969-10-01
      text: |
        1967 年“五一”和 7 月北京欢迎谢富治、王力自武汉归来大会的报道把她列在中央和国务院各部门负责人中。1969 年国庆报道列她为在京的中共中央委员。
      cites: [rmrb-1967-05-02-may-day, rmrb-1967-07-26-wuhan-rally, rmrb-1969-10-02-national-day]
  factions: [ccrg]
  fate:
    - { date: 1967-04, s: power, cite: ws-1983-zhao-dengcheng-case }
    - { date: 1969-10-01, s: power, note: 九届中央委员, cite: rmrb-1969-10-02-national-day }
  cites: [ws-1980-indictment, ws-1983-zhao-dengcheng-case, rmrb-1969-10-02-national-day]

