    - { title: 文化部部长, orgName: 文化部, from: 1975-01, to: 1976-10, verify: true }
  bio: 山东乳山人，胶东文工团出身，后在上海音乐学院研究和教授民族音乐。1960 年代中期参与京剧现代戏音乐设计，受到江青赏识，是《智取威虎山》《海港》等“样板戏”的主要音乐设计者，1968 年在《文汇报》提出被称为“三突出”的创作原则。1971 年任国务院文化组副组长，1975 年任文化部长。1976 年 10 月被隔离审查，1977 年 8 月在关押中服毒自杀。本条生平全部来自一般参考，待核。
  life:
    - h: 胶东与上海音乐学院
      from: 1925
      to: 1964
      text: |
        1925 年生于山东乳山的农民家庭，1946 年参加胶东文协文工团。1949 年进入上海的中央音乐学院华东分院（后上海音乐学院）学习，留校任教，研究民歌和曲艺音乐，著有《民歌与说唱音乐》等，在民族音乐理论方面有一定成就。
      verify: true
      cites: [macfarquhar-schoenhals]
    - h: 样板戏与“三突出”
      from: 1965
      to: 1970
      text: |
        1965 年在《文汇报》发表关于京剧音乐改革的文章，引起江青注意，参加上海京剧院《智取威虎山》《海港》的音乐设计。1968 年 5 月 23 日在《文汇报》发表《让文艺舞台永远成为宣传毛泽东思想的阵地》，提出“在所有人物中突出正面人物，在正面人物中突出英雄人物，在英雄人物中突出主要英雄人物”，后由姚文元概括为“三突出”，成为样板戏时期的官方创作公式。
      verify: true
      cites: [macfarquhar-schoenhals, wang-nianyi-turmoil]
    - h: 文化部长与自杀
      from: 1971
      to: 1977
      text: |
        1971 年 5 月国务院文化组成立，任副组长（组长吴德），实际主持日常工作；1975 年 1 月四届人大任文化部长，与浩亮（钱浩梁）、刘庆棠、刘春桥等掌握文艺界。1976 年 10 月“四人帮”被捕后被隔离审查，1977 年 8 月服毒自杀（日期与细节待核）。
      verify: true
      cites: [wang-nianyi-turmoil]
  assess:
    - { voice: scholar, text: 研究者评价于会泳是文革中少有的真正懂专业的文艺官员：他在京剧唱腔和配器上的创新被音乐界普遍承认，而他总结的“三突出”则成了压制其他创作的教条。, cite: macfarquhar-schoenhals }
