  bio: 江西弋阳人，红军出身，1947 年起长期负责毛泽东的警卫，建国后任中办警卫局长、公安部副部长。1965 年接替杨尚昆任中共中央办公厅主任，掌管中南海与中央警卫团（八三四一部队），文革中是毛泽东身边最贴近的执行者。1976 年 10 月 6 日指挥八三四一部队拘捕“四人帮”，次年任中共中央副主席。1978 年中央工作会议上因坚持“两个凡是”、主管专案阻挠平反而受批评，1980 年辞职。2015 年在北京去世。
  life:
    - h: 红军与毛泽东的警卫
      from: 1916
      to: 1949
      text: |
        1916 年生于江西弋阳的农民家庭，1929 年参加红军，1932 年入党，在红一方面军做卫生、政治工作，参加长征。抗战时期在八路军总部、延安的卫生和保卫部门任职。1947 年胡宗南进攻延安、中央转战陕北时，任中央警卫部队负责人，此后一直负责毛泽东的安全。
      verify: true
      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 中办警卫局与江西
      from: 1949
      to: 1965
      text: |
        1949 年后任中共中央办公厅警卫局局长、中央警卫师师长兼政委，1955 年兼任公安部副部长。1958 年下放江西，任江西省副省长、省委书记处书记，负责垦殖场工作。1965 年 11 月杨尚昆被调离后，回京任中共中央办公厅主任。
      verify: true
      cites: [klein-clark-1971, ccp-org-history]
    - h: 文革中的中南海
      from: 1966
      to: 1976
      text: |
        文革中负责中南海与中央领导人的警卫，向被批斗的刘少奇等传达中央意见，1967 年 7 月 4 日按中央意见通知刘少奇向北京建工学院“新八一”写检查。1966 年 4 月批判罗瑞卿的报告专门记录他为毛泽东作证。1967 年夏中央办公厅秘书局的人写信给他和周恩来，要求当面批判刘少奇，信被戚本禹转给江青、康生、陈伯达，随后发生中南海内的批斗和抄家。1968 年 7 月他派八三四一部队参加进驻清华、北大的工人宣传队，“六厂二校”的经验由此推向全国。1969 年九大当选政治局候补委员。1970 年庐山会议上他在华北组发言赞成设国家主席，后作检讨。1976 年 10 月 6 日晚在怀仁堂指挥八三四一部队对王洪文、张春桥、姚文元实施隔离，同时在中南海拘捕江青。
      cites: [ws-1967-07-09-liu-jiangong-review, ws-1966-04-luo-report, ws-1983-11-02-qi-benyu-case, ws-1969-04-28-9th-cc-plenum]
      verify: true
    - h: 副主席与辞职
      from: 1977
      to: 2015
      text: |
        1977 年 8 月十一大当选中共中央副主席、政治局常委，兼管中央专案和《毛泽东选集》编辑。1978 年 11 月中央工作会议上被批评支持“两个凡是”、压制真理标准讨论、阻挠为天安门事件和老干部平反，12 月中办主任一职由姚依林接任。1980 年 2 月十一届五中全会同意他与纪登奎、吴德、陈锡联辞去中央领导职务。此后任中顾委委员，晚年写有关于毛泽东与林彪集团斗争的回忆录。2015 年 8 月 21 日在北京去世。
      verify: true
      cites: [ws-1978-12-third-plenum, vogel-deng]
