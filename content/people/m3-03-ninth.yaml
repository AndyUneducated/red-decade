  bio: 湖南平江人，平江起义后参加红军，长征中任团政委，抗战和解放战争中在山东、刘邓部队任政委，1949 年后主政贵州，1957 年起任海军第一政委。文革中被林彪方面的李作鹏等打倒，1972 年恢复职务，1973 年十大进入政治局候补委员。1976 年 10 月粉碎“四人帮”后率中央工作组接管上海，任上海市委第一书记，1977 年当选政治局委员，1979 年在北京病逝。
