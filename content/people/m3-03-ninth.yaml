  bio: 山西昔阳贫农，幼年逃荒、扛长工，1948 年入党，1953 年起任大寨党支部书记。1963 年洪灾后大寨“自力更生”重建，1964 年毛泽东号召“农业学大寨”，他成为全国农业典型。文革中掌握昔阳县和山西省的权力，1973 年进入政治局，1975 年任国务院副总理主管农业，主持两次全国农业学大寨会议。1980 年辞去副总理，同年中央批转文件否定大寨经验中的“左”的做法。1986 年在北京病逝。
  life:
    - h: 长工与支书
      from: 1915
      to: 1963
      text: |
        1915 年生于山西昔阳的贫农家庭，幼年随父逃荒到大寨，给地主扛长工。抗战时期昔阳被日军占领，他曾被迫在村里的伪组织中任职，这段经历在 1960–1970 年代成为反复被提出又被压下的问题（细节待核）。1945 年昔阳解放后参加互助组，1948 年入党，1953 年任大寨村党支部书记，组织治理“七沟八梁一面坡”。
      verify: true
      cites: [ccp-figures-bios]
    - h: “农业学大寨”
      from: 1963
      to: 1966
      text: |
        1963 年 8 月大寨遭特大洪灾，他提出不要国家救济、自力更生重建，受到山西省委和中央表彰。1964 年毛泽东发出“农业学大寨”的号召，12 月三届人大周恩来的政府工作报告把大寨经验概括为“政治挂帅、思想领先”“自力更生、艰苦奋斗”“爱国家、爱集体”。1966 年八届十一中全会公报列入“关于工业学大庆，农业学大寨，全国学人民解放军，加强政治思想工作的号召”。
      cites: [ws-1966-08-12-plenum-communique]
      verify: true
    - h: 从昔阳到中央
      from: 1967
      to: 1980
      text: |
        1967 年 1 月他在昔阳夺权，3 月任山西省革委会副主任，《红旗》杂志当年刊出他署名的《大寨在毛泽东思想的光辉照耀下前进》。此后昔阳全县推行“大寨式”的大队核算、取消自留地和家庭副业，并在“学大寨”中开展大规模的阶级斗争。1969 年九大当选中央委员，1973 年十大当选政治局委员，1975 年 1 月任国务院副总理，9 月在昔阳主持第一次全国农业学大寨会议。
      cites: [ws-1967-red-flag-index, ws-1977-07-tenth-third-plenum]
      verify: true
    - h: 大寨的否定
      from: 1978
      to: 1986
      text: |
        十一届三中全会后包产到户兴起，大寨经验受到质疑。1980 年 9 月他辞去国务院副总理，11 月中共中央批转山西省委关于农业学大寨问题的检查报告，认定大寨和昔阳的许多做法是“左”的。1982 年十二大后不再任政治局委员，1983 年到北京东郊农场任顾问。1986 年 3 月 26 日在北京病逝。
      verify: true
      cites: [vogel-deng]
  assess:
    - { voice: doc, text: 大寨在毛泽东思想的光辉照耀下前进（1967 年《红旗》杂志，署名大寨大队党支部书记陈永贵）, cite: ws-1967-red-flag-index, quote: true }
    - { voice: official1966, text: 关于工业学大庆，农业学大寨，全国学人民解放军，加强政治思想工作的号召（1966 年八届十一中全会公报）, cite: ws-1966-08-12-plenum-communique, quote: true }
    - { voice: scholar, text: 研究者指出大寨在 1960 年代的成绩含有国家投入和数字夸大，文革中的“学大寨”更多是推行集体化与阶级斗争的政治运动；陈永贵本人则是毛泽东“农民当副总理”象征的产物。, cite: yang-jisheng-overturn }
