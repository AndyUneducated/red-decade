    - { date: 1975-01, s: power, note: 文化部长, verify: true }
    - { date: 1976-10, s: detained, note: 隔离审查, verify: true }
    - { date: 1977-08-28, s: dead, note: 服毒自杀, verify: true }
  cites: [macfarquhar-schoenhals, wang-nianyi-turmoil]

- id: chen-yonggui
  name: 陈永贵
