    - { date: 1966-09, s: power, note: 调任华北局书记处书记、北京市委常务书记, cite: czmingren-liu-jianxun }
    - { date: 1968-01, s: power, note: 河南省革委会主任, cite: czmingren-liu-jianxun }
    - { date: 1978-10-16, s: sidelined, note: 调离河南, cite: czmingren-liu-jianxun }
    - { date: 1983-04-23, s: dead, cite: czmingren-liu-jianxun }
  cites: [czmingren-liu-jianxun]
