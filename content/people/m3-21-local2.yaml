  bio: 文革前是青岛市副市长。1967 年初组织造反派先后夺取青岛市和山东省党政大权，任山东省革命委员会主任，《红旗》刊出他的文章《放手发动群众，粉碎反革命复辟阴谋》。1967 年 5 月在张春桥、姚文元支持下制造山东省革委会大院武斗事件，拘捕关押 388 人。1971 年 3 月被撤职，由杨得志接任。1979 年被开除党籍。
  life:
    - h: 夺权
      from: 1967-01
      to: 1967-05
      text: |
        文革开始后支持学生造反，1967 年初组织指挥造反派先后夺取青岛市委、市人委和山东省委、省人委的权力，2 月 3 日山东省革命委员会成立，他任主任。3 月 30 日出版的《红旗》1967 年第 5 期刊登他的文章《放手发动群众，粉碎反革命复辟阴谋》，与潘复生的《跟着毛主席革命到底》同期。
      cites: [ws-1967-red-flag-index]
      verify: true
    - h: 省革委会大院武斗
      from: 1967-05
      to: 1969
      text: |
        1967 年 5 月张春桥、姚文元在济南，张春桥对他说：“你有力量，我就支持你。”他随即在 5 月 7 日制造了省革命委员会大院武斗事件，拘捕关押 388 人；事后张春桥、姚文元又表示支持，祝贺“打了一个胜仗！”1981 年特别法庭判决书把此事与上海康平路事件、上海柴油机厂武斗并列，作为林彪、江青集团“挑动群众组织之间的大规模武斗”的例证。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
    - h: 撤职
      from: 1969
      to: 1979
      text: |
        山东地情档案的省革委会任职表记他任主任至 1971 年 3 月，由杨得志接任。1979 年 2 月被开除党籍。
      cites: [sdcg-shandong-rgw]
      verify: true
  assess:
    - { voice: judicial1980, text: 张春桥对王效禹说：“你有力量，我就支持你。”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 一九六七年五月，张春桥、姚文元在济南支持山东省革命委员会主任王效禹制造了省革命委员会大院武斗事件，拘捕关押三百八十八人。（1981 年特别法庭判决书）, cite: ws-1981-01-25-judgment, quote: true }
