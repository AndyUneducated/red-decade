# M3 people round 2, batch 21: 地方二。被打倒的省委第一书记（叶飞、江渭清、谭启龙、王恩茂，被迫害致死的卫恒），
# 军区司令员（韩先楚），文革中上台的省级负责人（王效禹、潘复生、解学恭）和少数留任的第一书记（刘建勋）。
# Texts: 1967 年江渭清电报、潘复生检查、张春桥在南京的讲话、《红旗》目录，1980 年起诉书，1981 年判决书；
# 新华社叶飞、韩先楚、谭启龙生平；全国政协王恩茂条；《人民日报》1986 年怀念卫恒文；陵川县政府卫恒条；
# 黑龙江省情网潘复生传；沧州名人网刘建勋传；山东地情档案省革委会任职表；天津 1978 年揭批查资料；陈大斌小靳庄回忆。

