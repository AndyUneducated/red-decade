  bio: 湖南平江人，红军长征后在湘鄂赣边坚持三年游击战争，解放战争中任华东野战军第六纵队政委。1949 年后长期主持江苏，任江苏省委第一书记、南京军区第三政委、华东局书记处书记。1967 年 1 月被造反派揪到南京大学等处批斗、游街，向中央发电报“认罪请罪”、请求撤销自己的职务。后来复出，任江西省委第一书记。2000 年在南京去世。
  life:
    - h: 湘鄂赣与华野六纵
