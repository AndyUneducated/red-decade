      cites: [rmrb-1999-04-29-ye-fei]
  assess:
    - { voice: officialLater, text: “文化大革命”期间，叶飞同志受到诬陷和迫害，他身处逆境，始终坚信党和人民，与林彪、江青反革命集团的倒行逆施进行了针锋相对的斗争。（1999 年新华社生平）, cite: rmrb-1999-04-29-ye-fei, quote: true }
    - { voice: editor, text: 生平用一句话概括了他在文革中的十年，没有写他何时、因何被打倒，也没有写他被关押在哪里，接着就写 1975 年出任交通部部长。, cite: rmrb-1999-04-29-ye-fei }
  factions: [provincial]
  fate:
