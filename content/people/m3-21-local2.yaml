      text: |
        1910 年 11 月生于湖南平江，1926 年参加革命，1929 年入党。红军主力长征后在湘鄂赣边坚持三年游击战争。解放战争中任华东野战军第六纵队政委等职，参加莱芜、孟良崮、豫东、淮海、渡江等战役。
      cites: [xhrb-2015-07-09-jiang-weiqing]
    - h: 江苏
      from: 1949-04
      to: 1967-01
      text: |
        新中国成立后长期在江苏工作，历任中共江苏省委第一书记、南京军区第三政委和代理第一政委、中共中央上海局书记、华东局书记处书记。
      cites: [xhrb-2015-07-09-jiang-weiqing]
    - h: “认罪请罪”
      from: 1967-01
      to: 1967-05
      text: |
        1967 年 1 月 22 日他给毛泽东、中央、华东局发电报：省委从 15 日起“已成瘫痪状态”，他和陈光、许家屯、彭冲被先后带到南京大学、南京工学院等单位“批判、揭、斗争、挂牌、游街”。电报说自己执行了“以刘、邓为首的资产阶级反动路线”，“现在我已被监督劳动，隔离反省”，建议中央、华东局派人主持省委，并撤销他的职务。这份电报由南京大学造反派小报《农奴戟》公开刊出。
      cites: [ccrd-1967-01-22-jiang-weiqing]
    - h: 揪回南京？
      from: 1967-05
      to: 1974
      text: |
        1967 年 5 月他已在北京。张春桥 5 月 14 日在南京对两派讲话时说：周恩来来信问他和姚文元，江苏有人要求揪江渭清回来开斗争会，现在是否适宜；他们认为“不是时候”，因为两派打得不可开交，“开的时候说不定另外一派来了，要抢他走”。1980 年起诉书把他列入被林彪、江青集团诬陷的中央委员、候补中央委员。
      cites: [marxists-1967-zhang-chunqiao-jiangsu, ws-1980-indictment]
    - h: 江西
      from: 1974
      to: 2000-06-16
      text: |
        复出后任中共江西省委第一书记。2000 年 6 月 16 日在南京去世。
      cites: [xhrb-2015-07-09-jiang-weiqing]
  assess:
    - { voice: doc, text: 因为我在无产阶级文化大革命中，违背以毛主席为代表的无产阶级革命路线，执行一条以刘、邓为首的资产阶级反动路线。（1967 年 1 月 22 日江渭清给毛泽东、中央、华东局的电报）, cite: ccrd-1967-01-22-jiang-weiqing, quote: true }
    - { voice: doc, text: 你把个江渭清搞来干什么呢？看你们打架啊！看你们在打架，他才高兴呢！（1967 年 5 月 14 日张春桥在南京的讲话）, cite: marxists-1967-zhang-chunqiao-jiangsu, quote: true }
    - { voice: judicial1980, text: 汪峰、方毅、王尚荣、刘震、张劲夫、李颉伯、廖志高、江渭清、谭启龙、张仲良、张平化（1980 年起诉书所列被诬陷的中央委员、候补中央委员）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 电报的“认罪”是写给中央的，却由造反派小报公开刊出；电报一面说自己“已被监督劳动，隔离反省”，一面仍以省委书记的身份向中央提出主持省委工作的人选。, cite: ccrd-1967-01-22-jiang-weiqing }
  factions: [provincial]
  fate:
    - { date: 1967-01-15, s: attacked, note: 被带到南京大学、南京工学院批斗、挂牌游街, cite: ccrd-1967-01-22-jiang-weiqing }
    - { date: 1967-01-22, s: detained, note: 自称“已被监督劳动，隔离反省”, cite: ccrd-1967-01-22-jiang-weiqing }
    - { date: 1974-02, s: restored, note: 江西省委第一书记（此前数据作 1974）（维基百科，未核原件）, cite: zhwiki-jiang-weiqing }
    - { date: 2000-06-16, s: dead, cite: xhrb-2015-07-09-jiang-weiqing }
  cites: [xhrb-2015-07-09-jiang-weiqing, ccrd-1967-01-22-jiang-weiqing, marxists-1967-zhang-chunqiao-jiangsu, ws-1980-indictment]

