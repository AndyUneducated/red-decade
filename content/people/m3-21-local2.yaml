      text: |
        1913 年 2 月生于湖北红安一个贫苦农民家庭，1927 年参加农民协会，1930 年参加游击队并入党，1933 年编入红二十五军，从战士升到师长。随红二十五军长征到陕北，参加劳山、直罗镇、东征、西征等战役，两次负重伤。
      cites: [rmrb-1986-10-12-han-xianchu]
    - h: 志愿军副司令员
      from: 1950-10
      to: 1966-05
      text: |
        1950 年冬入朝，任志愿军副司令员、十九兵团司令员，参与指挥第一至第四次战役；第三次战役中指挥部队突破“三八线”、攻占汉城。1953 年回国后历任中南军区参谋长、副总参谋长，副总参谋长兼福州部队司令员、党委第一书记。1958 年八届二中全会补选为候补中央委员。
      cites: [rmrb-1986-10-12-han-xianchu]
    - h: 《福建前线部队公告》
      from: 1966-05
      to: 1976-10
      text: |
        1967 年 2 月主持发布《福建前线部队公告》，中央军委随即批转全国。1968 年递补为中央委员，此后兼任中共福建省委第一书记，后调任兰州部队司令员、党委第二书记。生平说他因这份公告“受到林彪、‘四人帮’一伙的忌恨”，在“批林批孔”和“反击右倾翻案风”中又因抵制“四人帮”而“受到打击迫害”。
      cites: [rmrb-1986-10-12-han-xianchu]
    - h: 军委常委
      from: 1976-10
      to: 1986-10-03
      text: |
        1979 年任中央军委常委，1983 年在六届全国人大上当选全国人大常委会副委员长。1986 年 10 月 3 日在北京去世，终年 74 岁。
      cites: [rmrb-1986-10-12-han-xianchu]
  assess:
    - { voice: officialLater, text: 1967年2月，韩先楚同志主持发布了《福建前线部队公告》，当即由中央军委批转全国，在当时对回击极左思潮，保持部队稳定，安定社会秩序，起了很好的作用。（1986 年新华社生平）, cite: rmrb-1986-10-12-han-xianchu, quote: true }
    - { voice: editor, text: 生平说他在“批林批孔”中“受到打击迫害”，但没有说明具体所指；按同一份生平，他在这期间一直是中央委员和大军区司令员。, cite: rmrb-1986-10-12-han-xianchu }
