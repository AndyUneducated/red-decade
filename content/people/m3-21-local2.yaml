  bio: 祖籍福建南安，1914 年生于菲律宾的华侨家庭。1930 年代在闽东创建红色根据地，坚持三年游击战争。1949 年后任福建省省长、省委第一书记、福州军区司令员兼政委、华东局书记处书记，1958 年指挥炮击金门。文革中被打倒，1975 年出任交通部部长，1979 年起任海军第一政委、司令员，1983 年起任两届全国人大常委会副委员长。1999 年在北京去世。
  life:
    - h: 闽东
      from: 1914-05-07
      to: 1949-10
      text: |
        1914 年 5 月 7 日生于菲律宾奎松省，幼年回国读书。1928 年 5 月在厦门加入共青团，1930 年 7 月被捕，在狱中一年半。1932 年 3 月转为共产党员，1933 年 5 月领导“霍童暴动”，1934 年 2 月成立闽东苏维埃政府。红军主力长征后，他领导闽东军民坚持三年游击战争。
      cites: [rmrb-1999-04-29-ye-fei]
    - h: 福建前线
      from: 1949-10
      to: 1966-06
      text: |
        1949 年后历任南京军区副司令员兼福建军区司令员，福州军区司令员兼政委，福建省省长，福建省委副书记、第一书记，福建省政协主席，华东局书记处书记。组织指挥东山岛防御作战，1958 年“由毛主席亲自点将”指挥炮击金门。
      cites: [rmrb-1999-04-29-ye-fei]
    - h: 打倒与交通部
      from: 1966-06
      to: 1979-02
      text: |
        新华社生平对文革只写了一句：他“受到诬陷和迫害”，“与林彪、江青反革命集团的倒行逆施进行了针锋相对的斗争”。1975 年 1 月出任交通部部长，按中央整顿的指示抓班子、恢复规章制度、整顿生产秩序。粉碎“四人帮”后在交通部发展远洋船队、港口和长江水运，并创建了蛇口工业区。
      cites: [rmrb-1999-04-29-ye-fei]
    - h: 海军与人大
      from: 1979-02
      to: 1999-04-18
      text: |
