  bio: 江西永新人，红六军团出身，抗战中任三五九旅副政委，解放战争中随一野第二军进军新疆。1949 年后主持新疆十余年，任中共新疆分局、自治区党委第一书记和新疆军区司令员兼政委、新疆生产建设兵团第一政委。文革中被调离新疆，在九大上由中央委员降为候补中央委员，先后任南京军区副政委、沈阳军区副司令员。后任吉林省委第一书记，1981 年重回新疆主持工作，1986–1993 年任全国政协副主席。2001 年去世。
  life:
    - h: 红六军团与三五九旅
      from: 1913
      to: 1949-09
      text: |
        江西永新人，1928 年参加革命，1930 年入团、同年秋转入共产党。土地革命时期任中共湘赣省委秘书、红六军团政治部秘书长，参加长征；抗战中任八路军一二〇师三五九旅副政委，参加南泥湾大生产和 1944 年南下；解放战争中任一野第一兵团第二军政委，“一直到解放新疆”。
