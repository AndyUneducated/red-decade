    - { date: 1967, s: attacked, note: 受到诬陷和迫害, verify: true }
    - { date: 1975-01, s: restored, note: 出任交通部部长, cite: rmrb-1999-04-29-ye-fei }
    - { date: 1979-02, s: power, note: 海军第一政委, cite: rmrb-1999-04-29-ye-fei }
    - { date: 1999-04-18, s: dead, cite: rmrb-1999-04-29-ye-fei }
  cites: [rmrb-1999-04-29-ye-fei]

