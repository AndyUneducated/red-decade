    - { title: 第一书记, orgName: 中共山西省委员会, from: 1965-06, to: 1967-01-30, cite: lczf-wei-heng }
  bio: 山西陵川人，小学教师出身，1938 年参加抗日游击队并入党，在太岳区做农会和党的工作。1952 年起任山西省委常委、组织部长，后任省长，1965 年 6 月任山西省委第一书记、华北局书记处书记。1967 年 1 月山西造反派凭“五人大字报”夺权，他在太原五一广场被揪斗后遭单独监禁，1 月 30 日凌晨死在造反派私设的囚牢里。1979 年山西省委为他平反，1985 年又作出“彻底平反”的决定。
  life:
    - h: 太岳
      from: 1915
      to: 1949-10
      text: |
        原名魏来玉，陵川沙泊池村贫农家庭出身，幼时过继给魏姓亲戚。读完简易师范后在本县当小学教师。1938 年 1 月参加第二战区行营游击队，10 月入党，后任晋东南农救总会组织部长、太岳区农救总会主席、晋冀鲁豫边区临时参议会参议员，被选为中共七大代表；七大后任太岳区党委秘书长，1948 年任太岳四地委书记。
      cites: [lczf-wei-heng]
    - h: 山西省委
      from: 1949-10
      to: 1966-11
      text: |
        1952 年 4 月任山西省委常委、组织部长、省纪委书记，此后任省委第二副书记、书记处书记、副省长、代省长、省长，八大代表。1959 年 1 月在省委刊物《前进》上发表《发扬实事求是的科学精神》。1963 年冬起到文水、定襄等县蹲点搞“四清”。1965 年 6 月任山西省委第一书记、华北局书记处书记、山西省军区第一政委。
      cites: [lczf-wei-heng]
    - h: 晋祠三干会
      from: 1966-11
      to: 1967-01-12
      text: |
        1966 年 11 月山西省委在晋祠召开三级干部会讨论文革，会议第二天就被造反的人流和大字报淹没；11 月 2 日到 20 日，他在辩论、围攻、揪斗中度过，直到会议被强行结束。他急性阑尾炎发作，手术后伤口未愈，造反派头头就闯进病房要拉他去五一广场批斗，他对医护人员说：“不要紧，我准备上它二百次广场！”1967 年 1 月 10 日“五人大字报”贴出，诬省委“抗拒党中央”“是钻在党内一小撮走资本主义道路的当权派”；1 月 12 日造反派以“总指挥部”的名义夺了山西党政财文大权。
      cites: [rmrb-1986-01-26-wei-heng]
    - h: 五一广场与囚牢
      from: 1967-01-12
      to: 1967-01-30
      text: |
        1 月 15 日造反派在五一广场揪斗他，给他挂“反革命修正主义分子”的牌子，他把牌子打落在地，说：“我有错误甘愿向人民低头，决不向坏人低头！”暴徒按着他的头往铁栏杆上撞，围观群众喊“要文斗，不要武斗”，有人把棉帽、水果、干粮塞给他。此后秘书、警卫员都被赶走，他被单独监禁，1 月 30 日凌晨“屈死在造反派私设的囚牢里”。
      cites: [rmrb-1986-01-26-wei-heng, lczf-wei-heng]
  rehab:
    - { date: 1979-01, text: 中共山西省委决定为他平反昭雪、恢复名誉, cite: lczf-wei-heng }
    - { date: 1985-06, text: 中共山西省委作出为他彻底平反的决定，薄一波批注“十八载奇冤大案，终于得到昭雪”, cite: rmrb-1986-01-26-wei-heng }
  assess:
    - { voice: witness, text: 这次运动，我可能被打倒，但你们不要怕，人被整死了，真理还在，真理终究是会胜利的。（卫恒对身边工作人员的话，据 1986 年郭钦安等回忆文章）, cite: rmrb-1986-01-26-wei-heng, quote: true }
    - { voice: officialLater, text: 在‘文化大革命’的动乱中，面对林彪、江青反革命集团的淫威，他坚贞不屈，正气凛然（1985 年 6 月中共山西省委平反决定，据 1986 年回忆文章转引）, cite: rmrb-1986-01-26-wei-heng, quote: true }
    - { voice: judicial1980, text: 文敏生、卫恒、霍士廉、杨植霖（1980 年起诉书所列被诬陷、迫害的地方主要负责人）, cite: ws-1980-indictment, quote: true }
    - { voice: editor, text: 1979 年山西省委已为他平反，1985 年又作出一次“彻底平反”的决定；1986 年的回忆文章说“彻底否定‘文化大革命’竟如此艰难”。两份材料都没有写“五人大字报”署名者的名字。, cite: rmrb-1986-01-26-wei-heng }
  factions: [provincial]
  fate:
    - { date: 1965-06, s: power, note: 山西省委第一书记, cite: lczf-wei-heng }
    - { date: 1966-11, s: attacked, note: 晋祠三干会被冲垮，遭围攻揪斗, cite: rmrb-1986-01-26-wei-heng }
    - { date: 1967-01-15, s: detained, note: 五一广场揪斗后被单独监禁, cite: rmrb-1986-01-26-wei-heng }
    - { date: 1967-01-30, s: dead, cite: rmrb-1986-01-26-wei-heng }
  cites: [lczf-wei-heng, rmrb-1986-01-26-wei-heng, ws-1980-indictment]

- id: wang-xiaoyu
  name: 王效禹
  tier: 3
  role1966: 青岛市副市长
