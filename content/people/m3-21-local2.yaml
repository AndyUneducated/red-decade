  bio: 山东文登人，山东省立第一乡村师范学生出身。1949 年组建平原省并任省委书记，1953 年起任河南省委第一书记，因在合作化、反右中“看黑暗面多”受毛泽东批评，1958 年被定为“右倾反党集团分子”、撤职下放，1963 年甄别平反。1966 年 2 月调任黑龙江省委第一书记，八届十一中全会后转而支持造反派夺权，1967 年 3 月任全国第一个省级革命委员会的主任，此后在黑龙江造成大批冤假错案。1971 年被免职审查，1980 年在哈尔滨去世。
  life:
    - h: 文登
      from: 1908-12
      to: 1949-08
      text: |
        原名刘开浚，1908 年 12 月生于山东文登一个日趋破败的家庭，读书刻苦，在农村小学教书五年后，1929 年考入山东省立第一乡村师范学校。
      cites: [hljxxw-pan-fusheng]
    - h: 平原、河南与“右倾”
      from: 1949-08
      to: 1963-04
      text: |
        中华人民共和国成立前夕受中央派遣到新乡组建平原省并任省委书记，1953 年 1 月调任河南省委第一书记，发布“确保私有，四大自由，安定团结，发展生产”的布告。合作化高潮中他不赞成一下子都办高级社，主张说服无效时允许退社；反右中强调说理、不能多抓右派。1957 年青岛省市委书记会议上毛泽东批评他“看黑暗面多”；1958 年八大二次会议批他犯右倾机会主义错误，撤销省委第一书记职务，回河南后被定为“右倾反党集团分子”，1959 年春下放到西华农场任副场长。
      cites: [hljxxw-pan-fusheng]
    - h: 黑龙江夺权
      from: 1963-04
      to: 1967-12
      text: |
        1963 年 4 月调任全国供销合作总社主任，“右倾反党集团”问题得到甄别平反。1966 年 2 月调任黑龙江省委第一书记、东北局书记处书记。文革初期他要求各级党委坚守岗位，对江青揪“三家村”持保留态度；八届十一中全会后态度突然转变，单独表态支持红色造反团“造反”，放纵红卫兵炮轰、夺权。夺权后任黑龙江省红色造反者革命委员会顾问，1967 年 3 月被任命为黑龙江省革命委员会主任。12 月 7 日他与汪家道在北京向毛泽东、林彪和中央写检查，承认在处理哈尔滨“山上派”“山下派”两派斗争中“在重大问题上犯了严重错误”。
      cites: [hljxxw-pan-fusheng, ccrd-1967-12-07-pan-fusheng]
    - h: “无产阶级派性就是党性”
      from: 1967-12
      to: 1971-06
      text: |
        八届十二中全会上递补为中央委员，九大上当选中央委员。地方志传记说他诬指原省委为“资产阶级司令部”“黑省委”，把原省委一些领导干部划为“苏修叛国集团”成员；提出“不断出现右倾反右倾，乃是阶级斗争的一条规律”，部署反右倾、反复旧、反复辟的“总体战”，大抓“阶级报复案件”和“翻案集团”，造成大批冤假错案；他认为“无产阶级派性就是党性”，支持一派、压另一派，武斗不止。
      cites: [hljxxw-pan-fusheng]
    - h: 审查
      from: 1971-06
      to: 1982-04-23
      text: |
        1971 年 6 月中央免除他的职务，审查他在文革中所犯的错误。1980 年 4 月 29 日因脑溢血在哈尔滨去世，终年 72 岁。1981 年 10 月 27 日黑龙江省委作出审查结论；1982 年 4 月 23 日中央回电同意“不作组织处理”。
      cites: [hljxxw-pan-fusheng]
  assess:
    - { voice: doc, text: 我们在处理两派斗争中，在重大问题上犯了严重错误。（1967 年 12 月 7 日潘复生、汪家道的检查）, cite: ccrd-1967-12-07-pan-fusheng, quote: true }
    - { voice: officialLater, text: 潘复生在“文化大革命”时间，确实迫害了一些领导干部和群众，造成一些冤假错案，错误是严重的。（1982 年 4 月 23 日中共中央回电，据黑龙江省地方志人物传）, cite: hljxxw-pan-fusheng, quote: true }
    - { voice: editor, text: 同一个人，1958 年因“看黑暗面多”被打成右倾，1967 年成为全国第一个省级革命委员会的负责人；黑龙江的地方志传记对这两段都写得很直白。, cite: hljxxw-pan-fusheng }
  factions: [provincial]
  fate:
    - { date: 1958-05, s: purged, note: 八大二次会议上被批右倾，撤销河南省委第一书记, cite: hljxxw-pan-fusheng }
    - { date: 1963-04, s: restored, note: 全国供销合作总社主任, cite: hljxxw-pan-fusheng }
    - { date: 1966-02, s: power, note: 黑龙江省委第一书记, cite: hljxxw-pan-fusheng }
    - { date: 1967-03, s: rise, note: 黑龙江省革命委员会主任, cite: hljxxw-pan-fusheng }
    - { date: 1971-06, s: purged, note: 被免职审查, cite: hljxxw-pan-fusheng }
    - { date: 1980-04-29, s: dead, cite: hljxxw-pan-fusheng }
  cites: [hljxxw-pan-fusheng, ccrd-1967-12-07-pan-fusheng, ws-1967-red-flag-index]

- id: xie-xuegong
  name: 解学恭
  tier: 3
  role1966: 中共中央华北局书记处书记
  pinyin: Xiè Xuégōng
  gender: m
  aka:
    - { kind: other, name: 解学工 }
  party: 中国共产党
  positions:
    - { title: 主任, orgName: 天津市革命委员会, from: 1967-12-06, to: 1978-06, cite: difangwenge-tianjin-1978, verify: true }
    - { title: 第一书记, orgName: 中共天津市委员会, from: 1971-05, to: 1978-06, cite: difangwenge-tianjin-1978, verify: true }
  bio: 文革前任华北局书记处书记。1967 年起主持天津，任天津市革命委员会主任，1971 年起兼市委第一书记。批林批孔中天津市委“紧紧跟上”，向江青推荐宝坻县小靳庄作她的农村“点”；江青当众把他的名字改成“解学工”。粉碎“四人帮”后被指“捂盖子”，1978 年 6 月被中央免除天津党内外一切职务，1987 年被开除党籍。
  life:
    - h: 天津
      from: 1967
      to: 1974
      text: |
        1967 年起主持天津市工作，12 月天津市革命委员会成立时任主任，1971 年 5 月起兼中共天津市委第一书记。
      verify: true
    - h: 小靳庄
      from: 1974
      to: 1976-10
      text: |
        据陈大斌回忆，“批林批孔”运动开展后，天津市委领导中的一些人“紧紧跟上”，组织研究“儒法斗争史”，以天津站为工矿的“点”；江青还要一个农村的“点”，天津市委便推荐了宝坻县林亭口公社的小靳庄大队。江青不但给小靳庄的社员改名字，还当着全村人的面对他说：“你那个‘恭’是温良恭俭让的‘恭’，是封建主义的，儒家的思想；要改成工人阶级的‘工’！”此后天津市委给江青的报告上，他真的签了“解学工”。
      cites: [people-2014-xiaojinzhuang]
    - h: “捂盖子”与免职
      from: 1976-10
      to: 1987-03
      text: |
        粉碎“四人帮”后，天津的揭批查因市委主要负责人“捂盖子”而“冷冷清清”。1978 年 3 月 14 日市委组织工作会议为“万张集团案”等一批假案、错案宣布平反。5 月 23 日至 6 月 6 日，中央在北京召开天津汇报会议，李先念、汪东兴主持，李先念说“中央本来希望天津市委自己解决天津问题，但至今没有很好解决”。中央决定由林乎加任天津市委第一书记、市革委会主任，免除他在天津的党内外一切职务。中央两案审理领导小组认定他犯有严重错误，1987 年 3 月中央书记处会议决定开除他的党籍。
      cites: [difangwenge-tianjin-1978]
  assess:
    - { voice: witness, text: 你那个‘恭’是温良恭俭让的‘恭’，是封建主义的，儒家的思想；要改成工人阶级的‘工’！学工，向工人阶级学习嘛。（江青在小靳庄对解学恭说，据陈大斌回忆）, cite: people-2014-xiaojinzhuang, quote: true }
    - { voice: officialLater, text: 中共中央决定:任命林乎加为天津市委第一书记、市革委会主任，免除解学恭天津市委第一书记、市革委会主任和他在天津的党内外一切职务，继续清理问题，检查错误。（1978 年 6 月，据文革与当代史研究网转录资料）, cite: difangwenge-tianjin-1978, quote: true }
    - { voice: editor, text: 他在粉碎“四人帮”后又主持天津一年半多，直到 1978 年中央在北京专门开会才被免职；转录资料没有说明“捂盖子”具体压下了哪些案件。, cite: difangwenge-tianjin-1978 }
  factions: [provincial]
  fate:
    - { date: 1967-12-06, s: rise, note: 天津市革命委员会主任, verify: true }
    - { date: 1974, s: power, note: 向江青推荐小靳庄, cite: people-2014-xiaojinzhuang }
    - { date: 1978-06, s: purged, note: 免除天津党内外一切职务, cite: difangwenge-tianjin-1978 }
    - { date: 1987-03, s: purged, note: 开除党籍, cite: difangwenge-tianjin-1978 }
  cites: [people-2014-xiaojinzhuang, difangwenge-tianjin-1978]

- id: liu-jianxun
  name: 刘建勋
  born: 1913-10
  died: 1983-04-23
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 中共河南省委第一书记（9 月调华北局、北京市委）
  pinyin: Liú Jiànxūn
  gender: m
  birthplace: 河北沧县
  party: 中国共产党
  positions:
    - { title: 第一书记, orgName: 中共广西壮族自治区委员会, from: 1957-06, to: 1961-06, cite: czmingren-liu-jianxun }
    - { title: 第一书记, orgName: 中共河南省委员会, from: 1961-06, to: 1966-09, cite: czmingren-liu-jianxun }
    - { title: 书记处书记, orgName: 中共中央华北局, from: 1966-09, cite: czmingren-liu-jianxun }
    - { title: 主任, orgName: 河南省革命委员会, from: 1968-01, to: 1978-10-16, cite: czmingren-liu-jianxun }
    - { title: 第一书记, orgName: 中共河南省委员会, from: 1970-03, to: 1978-10-16, cite: czmingren-liu-jianxun }
  bio: 河北沧县人，1931 年入党，抗战中在太行区任县委书记、地委副书记。1949 年后任湖北省委第二书记、中央农村工作部副部长，1957 年任广西省委第一书记，1961 年任河南省委第一书记，在粮食严重困难中主持度荒。1966 年 9 月调任华北局书记处书记、北京市委常务书记，1967 年回河南任省革委会筹备小组组长，1968 年起任河南省革委会主任，1970 年再任省委第一书记。1978 年 10 月被调离，1983 年在北京去世。
  life:
    - h: 太行
      from: 1913-10
      to: 1949-10
      text: |
        1913 年 10 月生于河北沧县，1931 年 9 月入党。抗战爆发后到中共晋中特委工作，1938 年到太行根据地，先后任榆社、武乡县委书记，太行第三地委宣传部长、组织部长、地委副书记。
      cites: [czmingren-liu-jianxun]
    - h: 广西与河南
      from: 1949-10
      to: 1966-09
      text: |
        1949 年后任湖北省委副书记、第二书记，中南局秘书长兼农村工作部部长；1954 年调任中央书记处第二办公室副主任、中央农村工作部副部长。1957 年 6 月任广西省委第一书记，1958 年 5 月八大二次会议增补为候补中央委员。1961 年 6 月任河南省委第一书记。他到任时河南正面临严重的粮食困难，省委在农村实行牲畜分户喂养、田间管理分段包工到人等责任制，恢复小商小贩，向兄弟省区求援，实行“借地渡荒”。
      cites: [czmingren-liu-jianxun]
    - h: 北京与河南革委会
      from: 1966-09
      to: 1978-10
      text: |
        1966 年 9 月调任华北局书记处书记、北京市委常务书记，1967 年 4 月任北京市革命委员会常委。1967 年 7 月中央决定他任河南省革命委员会筹备小组组长，8 月任河南省军区第一政委；1968 年 1 月河南省革委会成立，任主任，10 月在八届十二中全会上递补为中央委员。1970 年 3 月当选河南省委第一书记，连任九、十、十一届中央委员，1975 年 8 月兼武汉军区政委。
      cites: [czmingren-liu-jianxun]
    - h: 调离
      from: 1978-10
      to: 1983-04-23
      text: |
        1978 年 10 月 16 日中央、中央军委通知调他到中央另行分配工作。1983 年 4 月 23 日在北京病逝。
      cites: [czmingren-liu-jianxun]
  assess:
    - { voice: editor, text: 这篇传记注明图文由他的儿子提供。它详细写了 1961 年后河南度荒的措施，对 1967 年以后只列职务，没有写他在河南两派对立中支持哪一派，也没有写 1978 年为什么被调离。, cite: czmingren-liu-jianxun }
  factions: [provincial]
  fate:
