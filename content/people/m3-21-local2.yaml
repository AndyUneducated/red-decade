  bio: 湖北红安人，红二十五军出身，抗美援朝中任志愿军副司令员，指挥部队攻占汉城。1953 年回国后任副总参谋长兼福州部队司令员，文革中又兼福建省革委会主任、省委第一书记。1967 年 2 月主持发布《福建前线部队公告》，经中央军委批转全国。后调任兰州部队司令员，1979 年任中央军委常委，1983 年任全国人大常委会副委员长。1986 年在北京去世。
  life:
