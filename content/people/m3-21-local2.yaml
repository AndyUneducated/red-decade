      text: |
        1949 年后历任南疆区党委第一书记、中共中央新疆分局第一书记、新疆军区司令员兼政委、新疆生产建设兵团第一政委、中共新疆维吾尔自治区党委第一书记、西北局书记处书记，是八届中央委员。
      cites: [cppcc-wang-enmao]
    - h: 调离与降级
      from: 1968
      to: 1977
      text: |
        政协简历在新疆和吉林之间排着“南京军区副政委、沈阳军区副司令、副政委”，没有注年份，也没有提文革。简历同时写明他是“中共第八届中央委员；中共第九届中央候补委员”，即九大上由中央委员降为候补中央委员。1980 年起诉书把他列入被林彪、江青集团诬陷的中央委员、候补中央委员。
