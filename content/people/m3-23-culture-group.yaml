  bio: 湖南长沙人，1938 年入党，抗战中研究古代思想史，1943 年出版《孔墨的思想》批评国民党“尊孔读经”，1947 年被国民党逮捕。1949 年后任湖南大学文学院院长，1952 年调中山大学，先后任历史系、哲学系主任。1950 年代写文章批判胡适、梁漱溟和中山大学的刘节。文革初被批斗、毒打，妻子陈慧敏被折磨成精神病后溺水身亡。1972 年在《红旗》发表儒法斗争文章，1973 年 8 月 7 日在《人民日报》发表《孔子——顽固地维护奴隶制的思想家》，成为批林批孔中“红极一时”的学者，1975 年当选全国人大常委。文革后受到不点名批判，1978 年 8 月在审查中病逝。1982 年广东省纪委结论“未发现与‘四人帮’有组织上的联系”，不给处分。
  life:
    - h: 批孔的学术立场
      from: 1907-08
      to: 1952
      text: |
        1907 年 8 月生于长沙一个文具商家庭。1938 年入党，1939 年流亡桂林编进步报刊，1941 年到重庆一边在大学任教一边做地下工作。1943 年出版《孔墨的思想》，矛头直指国民党推行的“尊孔读经”。1946 年参加民盟，1947 年 7 月因支持学生运动被捕，1948 年 5 月获释。1949 年后任湖南大学文学院院长兼历史系主任、湖南省人民政府委员、民盟中央委员。
      cites: [zhdsb-2014-yang-rongguo, ifeng-2007-yang-rongguo]
    - h: 中山大学
      from: 1952
      to: 1971
      text: |
        1952 年院系调整调入中山大学，先后任历史系主任、哲学系主任、校党委常委。在历次意识形态斗争中写过《胡适的反动观点和他对中国古代哲学的歪曲》《批判刘节先生的中国史学史讲话》等文章。文革初被隔离审查、抄家、毒打（左胸和肾脏受伤），送“五七”干校劳动；妻子陈慧敏受株连，被折磨成精神病患者，弃家出走后溺水身亡。
      cites: [ifeng-2007-yang-rongguo, zhdsb-2014-yang-rongguo]
    - h: “红极一时”的批孔学者
      from: 1971
      to: 1976-10
      text: |
        1971 年林彪事件后，人民出版社编辑找他修订《简明中国思想史》，他才逐渐被“解放”。1972 年第 12 期《红旗》发表他的《春秋战国时期思想领域内两条路线的斗争》，比毛泽东提出“批孔”还早。1973 年 8 月 7 日《人民日报》发表他的《孔子——顽固地维护奴隶制的思想家》。此后任广东省理论工作小组副组长、中山大学革委会副主任，1975 年当选四届全国人大常委；到各地作巡回报告，把“子见南子”解释为孔子“走后门”“走内线”。据李锦全的说法，他后来受批判的主要原因是 1976 年在广州一次“批孔连带批邓”的报告。
      cites: [ifeng-2007-yang-rongguo, zhdsb-2014-yang-rongguo, rmrb-1973-08-07-yang-rongguo]
    - h: “广东那个教授”
      from: 1976-10
      to: 1982-06
      text: |
        清查“四人帮”时报纸上不点名地批判他，称“广东那个教授”。他正因癌症住院，从特级病房被换到普通病房，1978 年 8 月在审查和批判中去世。1982 年 6 月中共广东省纪委作出结论：他在批林批孔期间“为迎合‘四人帮’所谓‘儒法斗争’的需要，不惜歪曲事实，散布了不少错误观点。但未发现杨荣国同志与‘四人帮’有组织上的联系”，同意不给处分。
      cites: [ifeng-2007-yang-rongguo, zhdsb-2014-yang-rongguo]
  assess:
    - { voice: doc, text: 他的思想的实质，是要维护奴隶主阶级的统治，论证劳动人民只能被剥削、被奴役、被统治。用一句话说，他就是要论证“剥削有理、造反有罪”。（杨荣国 1973 年《人民日报》文）, cite: rmrb-1973-08-07-yang-rongguo, quote: true }
    - { voice: officialLater, text: 杨荣国同志在‘批林批孔’期间，为迎合‘四人帮’所谓‘儒法斗争’的需要，不惜歪曲事实，散布了不少错误观点。但未发现杨荣国同志与‘四人帮’有组织上的联系。（1982 年广东省纪委结论）, cite: ifeng-2007-yang-rongguo, quote: true }
    - { voice: scholar, text: 在当时，绝不是杨先生主动地去附会毛泽东的“批孔”指示的，而倒极有可能是毛泽东先注意到了杨先生的文章。（《中华读书报》2014）, cite: zhdsb-2014-yang-rongguo, quote: true }
    - { voice: scholar, text: 杨荣国这样的学者，今日已成为学者的一个教训。因为他以学术为政治服务来治学术，已完全背离了学术精神。（谢泳，《历史学家茶座》文转引）, cite: ifeng-2007-yang-rongguo, quote: true }
  factions: [academics]
  fate:
    - { date: 1966, s: attacked, note: 隔离审查、抄家、毒打, cite: ifeng-2007-yang-rongguo }
    - { date: 1973, s: rise, note: 恢复工作，成为批孔学者, cite: ifeng-2007-yang-rongguo }
    - { date: 1975-01, s: power, note: 全国人大常委, cite: ifeng-2007-yang-rongguo, verify: true }
    - { date: 1976-10, s: attacked, note: 被不点名批判、审查, cite: ifeng-2007-yang-rongguo }
    - { date: 1978-08, s: dead, note: 癌症, cite: ifeng-2007-yang-rongguo }
  cites: [rmrb-1973-08-07-yang-rongguo, ifeng-2007-yang-rongguo, zhdsb-2014-yang-rongguo]

- id: zhou-yiliang
  name: 周一良
  born: 1913-01-19
  died: 2001-10-23
  deathKind: natural
  tier: 3
  role1966: 北京大学历史系副主任
  pinyin: Zhōu Yīliáng
  gender: m
  party: 中国共产党
  joinedParty: 1956
  positions:
    - { title: 历史系主任, orgName: 清华大学, from: 1951, to: 1952, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { title: 历史系教授、系主任, orgName: 北京大学, from: 1952, to: 1986, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { title: 注释组成员、党支部委员, orgName: 梁效, from: 1973-09, to: 1976-10, cite: aisixiang-song-chengyou-zhou-yiliang }
  bio: 至德周氏子弟，家塾读书至 18 岁，燕京大学历史系毕业，从陈寅恪问学，1944 年获哈佛大学博士，1946 年回国。1952 年院系调整后任北大历史系教授，1956 年入党，1958 年“史学革命”中在会上批判业师陈寅恪。文革初作为副系主任被批斗，1967 年参加反聂元梓的“井冈山兵团”，进过“牛棚”。1973 年 7 月发表《读柳宗元〈封建论〉》受到毛泽东肯定，同年进入“梁效”注释组并任党支部委员，任十大代表。1976 年 10 月后作为“梁效”成员被审查近三年，1979 年回历史系，晚年写自传《毕竟是书生》。
  life:
    - h: 燕京、哈佛与陈寅恪
      from: 1913-01-19
      to: 1952
      text: |
        8 岁到 18 岁在天津家塾读书，未入“洋学堂”。1932 年转回燕京大学历史系，受邓之诚、洪业启迪，到清华旁听陈寅恪的魏晋南北朝史，对陈执弟子礼，经陈推荐到史语所工作一年。1939 年入哈佛大学，1944 年以《唐代印度来华密宗三僧考》获博士学位。1946 年回国，任燕京大学国文系副教授，1947 年转清华外文系，1949 年到历史系，1951–1952 年任清华历史系主任。
      cites: [aisixiang-song-chengyou-zhou-yiliang]
    - h: “又红又专”的标杆
      from: 1952
      to: 1966-05
      text: |
        1952 年秋院系调整后到北大历史系，先后任亚洲史教研室主任、系副主任、系主任。1952 年加入民盟，1956 年入党。1953 年参加批判胡适，写《胡适与西洋汉学》；1958 年“史学革命”中按系党总支布置在会上批判陈寅恪的“帝王将相中心论”等，自谓“党指向哪里就打向哪里”。宋成有认为这源自出身和留美带来的“负罪”心理。
      cites: [aisixiang-song-chengyou-zhou-yiliang]
    - h: 两起三落
      from: 1966-05
      to: 1976-10
      text: |
        1966 年工作组进系时被勒令站到台前“低头认罪”，靠边站约一年。1967 年春夏登台批判聂元梓，成了“井冈山兵团”的“精神领袖”之一，不久被关进“牛棚”，1968 年 10 月离开“牛棚”。1973 年 7 月在《北京大学学报》发表《读柳宗元〈封建论〉》，正面评价秦始皇，受到毛泽东肯定。1973 年 9 月迟群、谢静宜主持成立两校“大批判组”，他进入注释组，任党支部委员；1973 年 8 月作为十大代表进入主席团。1974 年 1 月在首都体育馆批林批孔大会上解释《林彪与孔孟之道》中的典故，在《历史研究》发表《诸葛亮与法家路线》。1976 年 9 月名列毛泽东治丧委员会。
      cites: [aisixiang-song-chengyou-zhou-yiliang]
    - h: 审查与《毕竟是书生》
      from: 1976-10
      to: 2001-10-23
      text: |
        1976 年 10 月北京卫戍区部队查抄“梁效”驻地，他和其他成员一起成为审查对象，在首都体育馆的声讨大会上“陪斗”，此后近三年每天到审查地报到，子女的升学和工作也受到牵连。期间收到一封自称“老朋友”寄来的匿名信，内附“无耻之尤”字条。1979 年回历史系做敦煌书仪研究；1981 年他能否任博士生导师因“梁效”问题一度受阻，经系主任邓广铭力争才解决。1986 年退休。晚年写自传《毕竟是书生》，2001 年 10 月 23 日去世。
      cites: [aisixiang-song-chengyou-zhou-yiliang]
  assess:
    - { voice: witness, text: 回首几十年，逢6年份都有对我重要的事情发生。36年结婚，46年从美国回国，56年人党，66年文革，76年因梁效而受到审查，86年退休。（周一良晚年回忆，宋成有转引）, cite: aisixiang-song-chengyou-zhou-yiliang, quote: true }
    - { voice: scholar, text: 换言之，写作组和注释组的人员均由两校的党组织选拔，进入“梁效”的责任在组织而非个人。（宋成有）, cite: aisixiang-song-chengyou-zhou-yiliang, quote: true }
    - { voice: editor, text: 本站所收的是北大历史系同事宋成有的长文，立场偏向为他辩护；对他 1958 年批判陈寅恪和在“梁效”中的作为，批评者的说法更尖锐，尚未收录。, cite: aisixiang-song-chengyou-zhou-yiliang }
  factions: [academics, ccrg]
  fate:
    - { date: 1966-06, s: attacked, note: 被勒令“低头认罪”，靠边站, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { date: 1967, s: normal, note: 参加反聂元梓的“井冈山兵团”, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { date: 1968-10, s: attacked, note: 离开“牛棚”后集中学习、劳动, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { date: 1973-09, s: rise, note: 进入“梁效”, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { date: 1976-10, s: detained, note: 作为“梁效”成员被审查, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { date: 1979, s: restored, note: 回历史系工作, cite: aisixiang-song-chengyou-zhou-yiliang }
    - { date: 2001-10-23, s: dead, cite: aisixiang-song-chengyou-zhou-yiliang }
  cites: [aisixiang-song-chengyou-zhou-yiliang]

- id: tang-yijie
  name: 汤一介
  born: 1927-02-16
  died: 2014-09-09
  deathKind: natural
  deathPlace: 北京
  tier: 3
  role1966: 北京大学哲学系教师
  pinyin: Tāng Yījiè
  gender: m
  birthplace: 天津
  origin: 湖北黄梅
  party: 中国共产党
  joinedParty: 1949
  positions:
    - { title: 哲学系教师、教授, orgName: 北京大学, from: 1956, to: 2014-09-09, cite: pku-2014-tang-yijie, verify: true }
    - { title: 成员（组长一级）, orgName: 梁效, from: 1973, to: 1976-10, cite: pku-2014-tang-yijie }
  bio: 生于天津，原籍湖北黄梅，哲学家汤用彤之子，1949 年入党，1951 年北大哲学系毕业后在北京市委党校任教，1956 年回北大哲学系。妻子乐黛云 1958 年被划为右派。1957 年至 1970 年代末写过批判冯友兰、吴晗等的文章，晚年说“这些论文很少学术价值”。文革开始时被打为“黑帮分子”。1973 年进入“梁效”，1974 年 1 月在批林批孔大会上主讲《林彪与孔孟之道》材料。四人帮倒台后被隔离审查，1978 年平反，1983 年整党中被定为“犯一般性错误”。1980 年恢复讲课，此后转向儒学与中国哲学研究，2014 年去世。
  life:
    - h: 哲学工作者
      from: 1927-02-16
      to: 1966-05
      text: |
        1927 年 2 月 16 日生于天津，祖父汤霖是前清进士，父亲汤用彤是哲学史家。中学时接受共产主义，在西南联大附中时曾和同学相约去延安。1949 年入党，1951 年初未读完北大哲学系最后一学期就被调到北京市委党校任教，1956 年回北大哲学系当父亲的助手。他回忆，1949 年后他和几乎所有研究哲学的人都认为“只有政治上的领袖如列宁、斯大林、毛泽东等才能做哲学家”；1957 年起写了四五十篇论文，包括批判冯友兰“抽象继承法”和吴晗“道德继承问题”的文章。1958 年妻子乐黛云被划为右派下放劳动。
      cites: [thepaper-2014-tang-yijie, pku-2014-tang-yijie]
    - h: 梁效
      from: 1966-05
      to: 1976-10
      text: |
        文革开始时被打为“黑帮分子”。1973 年毛泽东提出调一批北大教授编批林批孔材料，他被选入“梁效”，后来说“我很愿意去，正好可以让我逃过反右回潮的灾难”；马王堆帛书出土后，他们为毛泽东要读的材料作注解、标音。1974 年 1 月在首都体育馆批林批孔大会上主讲《林彪与孔孟之道》材料。1974 年底江青到北大让他讲老子，他回忆“那个会上基本上是我们在听她讲老子”。
      cites: [thepaper-2014-tang-yijie, pku-2014-tang-yijie, aisixiang-song-chengyou-zhou-yiliang]
    - h: “我只能听我自己的”
      from: 1976-10
      to: 2014-09-09
      text: |
        四人帮倒台后被隔离审查，1978 年平反。他说那时突然发现一个问题：“我该听谁的？”1980 年 53 岁时恢复讲课，夏天在北大开设《魏晋玄学与佛教、道教》课程。1983 年开始的整党中，“梁效”成员受到各种处分，对他和胡经之等“组长一级成员”的定性是“犯一般性错误”。1985 年与其他学者在深圳召开“文化协调会议”，纪要提出中国还必须实现政治现代化和文化现代化。2014 年 9 月 9 日去世。
      cites: [thepaper-2014-tang-yijie, pku-2014-tang-yijie]
  assess:
    - { voice: witness, text: 我之所以走了一大段弯路，主要是因为我没有用自己的头脑来思考问题。（汤一介，澎湃新闻转引）, cite: thepaper-2014-tang-yijie, quote: true }
    - { voice: witness, text: 虽然我们是受人差遣，但我听命于他们的错误我都认账。（汤一介回忆）, cite: pku-2014-tang-yijie, quote: true }
    - { voice: officialLater, text: 对汤一介、胡经之等组长一级成员的定性是“犯一般性错误”。（1983 年整党结论，北大新闻网转载文）, cite: pku-2014-tang-yijie, quote: true }
  factions: [academics, ccrg]
  fate:
    - { date: 1966, s: attacked, note: 被打为“黑帮分子”, cite: thepaper-2014-tang-yijie }
    - { date: 1973, s: rise, note: 选入“梁效”, cite: thepaper-2014-tang-yijie }
    - { date: 1976-10, s: detained, note: 隔离审查, cite: thepaper-2014-tang-yijie }
    - { date: 1978, s: restored, note: 平反, cite: thepaper-2014-tang-yijie }
    - { date: 1980, s: normal, note: 恢复讲课资格, cite: thepaper-2014-tang-yijie }
    - { date: 2014-09-09, s: dead, cite: thepaper-2014-tang-yijie }
  cites: [thepaper-2014-tang-yijie, pku-2014-tang-yijie]

