  bio: 北京通州人，原名李锡范。1947 年经姐夫赵纪彬引荐到山东大学文史系旁听，1953 年山大中文系毕业，到中国人民大学读研究班。1954 年与蓝翎合写《关于〈红楼梦简论〉及其他》，发表在《文史哲》第 9 期，毛泽东读后称他们为“小人物”，一篇文章演变成全国文化界的大事。周扬转达毛泽东的意见“那不是战斗的岗位”，他没有去研究所而进了人民日报社，做了 32 年编辑。文革中被视为“文艺黑线下的评论家”，进过“牛棚”，半途被保出。1986 年起任中国艺术研究院常务副院长，主编《红楼梦大辞典》《中华艺术通史》，2018 年去世。
  life:
    - h: 山大与“小人物”
      from: 1947
      to: 1955
      text: |
        1947 年中学毕业后经姐夫赵纪彬（山大文史系教授）引荐到山东大学文史系旁听；1949 年考入华东大学，1951 年华大与山大合校，进山大中文系二年级，1953 年毕业，又入人民大学研究班。1954 年 5 月 4 日与蓝翎合写成《关于〈红楼梦简论〉及其他》，多家报刊不理睬，寄回母校，发表于《文史哲》1954 年第 9 期。毛泽东读到后十分重视，“小人物”的称呼由此而来。《文艺报》主编冯雪峰转载时加了编者按，毛泽东看后生气，认为对年轻人要求太高；随后郭沫若、茅盾、周扬相继讲话，“一篇小小文章”引起全国文化界的大波澜，他“目瞪口呆，再也插不上嘴了”。
      cites: [sdu-li-xifan, xinhua-2018-li-xifan]
    - h: 人民日报
      from: 1955
      to: 1986
      text: |
        他本想到研究所工作，写信给周扬，周扬回信转达毛泽东的意见“那不是战斗的岗位”，于是进了人民日报社，历任文艺部编辑、评论组长、副主任、常务副主任，做了 32 年编辑。文革中他照例被视为“文艺黑线下的评论家”，进“牛棚”、挨批判，“不过半截被保了出来”。
      cites: [sdu-li-xifan, xinhua-2018-li-xifan]
    - h: 中国艺术研究院
      from: 1986
      to: 2018-10-29
      text: |
        后任中国艺术研究院常务副院长，主编《红楼梦大辞典》和 14 卷本《中华艺术通史》，出版《红楼梦评论集》《红楼梦艺术世界》等。2018 年 10 月 29 日在北京家中逝世，享年 91 岁。
      cites: [xinhua-2018-li-xifan]
  assess:
    - { voice: officialLater, text: 开辟了从广阔的社会历史背景出发分析《红楼梦》艺术成就的研究道路。（2018 年新华社讣闻）, cite: xinhua-2018-li-xifan, quote: true }
    - { voice: witness, text: 当时详细情况我不了解，无非是毛主席对文艺界权威统治不太满意，他的思想是希望年轻人快快成长，不要挡住他们的路。（李希凡，2001 年《光明日报》）, cite: sdu-li-xifan, quote: true }
    - { voice: editor, text: 2001 年《光明日报》的文章说这场风波“主要还限于学术争论”；本站所收两篇文本都出自官方媒体，被批评一方和《文艺报》编者的遭遇几乎没有着墨。, cite: sdu-li-xifan }
