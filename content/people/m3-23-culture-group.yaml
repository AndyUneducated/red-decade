      cites: [china-2010-mu-xin]
    - h: 光明日报与中央文革
      from: 1957-11
      to: 1967-09
      text: |
        1957 年 11 月调光明日报社，先后任副总编辑、总编辑、党组书记。1966 年 5 月 28 日列入中央文革小组名单，是首任办事组组长。1967 年 9 月江青诬陷他是“特务”，9 月 6 日凌晨被从家中带走。
      cites: [china-2010-mu-xin, ipk-mu-xin-qincheng]
    - h: 秦城
      from: 1967-09
      to: 1975-05
      text: |
        据他的回忆，1968 年 1 月 13 日穿空军制服的军人把他送进秦城监狱，“这里不用名字”，只用代号。直到 1972 年 6 月 30 日近五年不让家人探望；近八年间只在 1969、1971 和 1972 年有过三次“审讯”，1971 年 5 月下旬起有一次延续 106 天的“提审”，逼他交代在《光明日报》“放过什么毒”和报社“五一六分子”名单。他引用的一份调查材料说，妻子张卉中 1972 年 1 月因向监管员要报纸学元旦社论被殴打，锁骨被打折；她出狱后不久含冤去世。1975 年 5 月获释。
