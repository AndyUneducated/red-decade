# M3 people round 2, batch 23: 文化组、写作班子与“文艺革命”的新贵。样板戏演员出身的副部长（刘庆棠、浩亮）、毛泽东的亲戚（王曼恬）、
# 一度主管文艺口后入狱的作家（金敬迈）、两大报的文革负责人（鲁瑛、穆欣），以及批孔与“梁效”的学者（杨荣国、周一良、汤一介）和 1954 年的“小人物”李希凡。
# Texts: 1983 年刘庆棠案起诉书与判决书，1980 年起诉书与 1981 年判决书（鲁瑛），1973 年《人民日报》杨荣国批孔文，《建国以来毛泽东文稿》1975 年批语（含编者注）；
# 《新快报》刘庆棠文，澎湃、凤凰网钱浩梁文，张志宏王曼恬文，冯乔金敬迈文与《广州日报》讣闻，钱江的鲁瑛访谈引言，中国网穆欣讣告与穆欣狱中回忆，
# 《历史学家茶座》与《中华读书报》杨荣国文，宋成有周一良文，澎湃与北大新闻网汤一介文，新华社李希凡讣闻与 2001 年《光明日报》李希凡文。

- id: liu-qingtang
  name: 刘庆棠
  born: 1932
  tier: 3
  role1966: 中央芭蕾舞团演员，《红色娘子军》洪常青扮演者
  pinyin: Liú Qìngtáng
  gender: m
  birthplace: 辽宁盖县
  party: 中国共产党
  positions:
    - { title: 副团长、党委书记, orgName: 中央芭蕾舞团, from: 1966-05, to: 1976-10, cite: ycwb-2004-liu-qingtang, verify: true }
    - { title: 副组长, orgName: 国务院文化组, from: 1971, to: 1975-01, cite: ycwb-2004-liu-qingtang }
    - { title: 副部长, orgName: 文化部, from: 1975-01, to: 1976-10, cite: ws-1983-liu-qingtang-case, verify: true }
  bio: 辽宁盖县人，1948 年进入中共辽南省委办的白山艺术学校，1956 年 24 岁时到北京舞蹈学校改学芭蕾，1959 年成为《天鹅湖》第一个中国籍“王子”，1964 年在芭蕾舞剧《红色娘子军》中演党代表洪常青。文革中任芭蕾舞团副团长、党委书记，1968–1969 年制造“5·16兵团文艺方面军”假案，牵连 374 人、6 人被逼自杀。1971 年任国务院文化组副组长，1975 年任文化部副部长，1976 年参与拍摄“与走资派作斗争”的电影。1976 年 10 月被隔离审查，1982 年被捕，1983 年被判有期徒刑十七年。
  life:
    - h: 从白山艺校到“王子”
      from: 1948-02
      to: 1964
      text: |
        1948 年 2 月考入中共辽南省委开办的白山艺术学校。1956 年从南美洲演出归来后，坚持要去北京舞蹈学校新开设的芭蕾舞专业，24 岁开始正式学芭蕾，很快成为“尖子”。1959 年北京舞蹈学校实验芭蕾舞团在苏联专家古雪夫帮助下排演《天鹅湖》，他饰演王子齐格弗里德，成为这部芭蕾经典的第一个中国籍“王子”。林默涵召集舞蹈界座谈后拍板把电影《红色娘子军》改编成芭蕾舞剧，他进入创作组，被定为党代表洪常青的扮演者。
      cites: [ycwb-2004-liu-qingtang]
    - h: “5·16兵团文艺方面军”
      from: 1966-05
      to: 1971
      text: |
        1966 年文革开始，《红色娘子军》成为“样板戏”，刚任芭蕾舞团副团长的他积极投入运动。据 1983 年起诉书和判决书，1968 年 3 月和 9 月他多次给江青写信，诬陷芭蕾舞团领导班子成员杨少甫等“进行反革命夺权”；1968 年 8 月亲自审讯北京舞蹈学校教师邸尔，把 1967 年 7 月文艺组音乐舞蹈口的一次全体会说成“5·16兵团文艺方面军”成立会，诬陷金敬迈、李英儒是“司令”“副司令”。江青指定他和军代表黄厚民负责文艺界的“清查”，1969 年 8 月起他插手中央乐团、中央音乐学院等七个单位。这起假案使 374 名干部群众遭到迫害，其中 6 人被逼自杀身死；邸尔 1969 年 11 月跳楼致残，金敬迈、李英儒被逮捕关押五年。
      cites: [ws-1983-liu-qingtang-case]
    - h: 文化组与文化部
      from: 1971
      to: 1976-10
      text: |
        1971 年 39 岁时任国务院文化组副组长，副部长级。1972 年春参加为尼克松演出的《红色娘子军》，秋天招待田中角荣时最后一次扮演洪常青。1975 年任文化部副部长。判决书认定，1975 年 10 月底他在上海与王洪文、马天水、徐景贤、王秀珍密谈，11 月 2 日在北海公园静憩轩与于会泳、浩亮秘密聚会，传达王洪文“要吃得饱饱的，睡得好好的，振奋精神，准备斗争”的话，随后到清华大学向迟群索取诬陷邓小平的材料。1976 年 2 月起布置各电影厂拍“与走资派作斗争”的影片，参与《反击》《盛大的节日》，指定北影编写《搏斗》，指挥芭蕾舞剧团排演舞剧《青春战歌》。
      cites: [ycwb-2004-liu-qingtang, ws-1983-liu-qingtang-case]
    - h: 审判
      from: 1976-10
      to: 2004
      text: |
        1976 年 10 月被隔离审查，1982 年 9 月 8 日被逮捕。1983 年 11 月 2 日北京市中级人民法院认定他犯积极参加反革命集团罪、反革命宣传煽动罪、诬告陷害罪，判处有期徒刑十七年，剥夺政治权利四年；庭审中有五名受害人出庭作证。服刑期间妻子同他离婚。2001 年他在广州一所大学的艺术学院任名誉院长，编排古代题材芭蕾舞剧《岳飞》。
      cites: [ws-1983-liu-qingtang-case, ycwb-2004-liu-qingtang]
  assess:
    - { voice: judicial1980, text: 被告人刘庆棠积极参加江青反革命集团，煽动打倒党和国家领导人及各级领导干部，制造假案，诬陷、迫害干部和群众，已构成积极参加反革命集团罪、反革命宣传煽动罪、诬告陷害罪。（1983 年判决书）, cite: ws-1983-liu-qingtang-case, quote: true }
    - { voice: witness, text: 跻于“样板戏”的芭蕾舞剧《红色娘子军》成为政治斗争的利器之一。（李小骥，2004）, cite: ycwb-2004-liu-qingtang, quote: true }
    - { voice: editor, text: 本站所收判决书出自 1983 年的北京市中级人民法院，是“两案”主犯之外对文艺界负责人的少数公开判决之一；2004 年的报刊文章则只写他的舞台生涯和晚年，对假案一字未提。, cite: ws-1983-liu-qingtang-case }
  factions: [ccrg]
  fate:
    - { date: 1959, s: rise, note: 《天鹅湖》第一个中国籍“王子”, cite: ycwb-2004-liu-qingtang }
    - { date: 1966-05, s: rise, note: 芭蕾舞团副团长, cite: ycwb-2004-liu-qingtang }
    - { date: 1971, s: power, note: 国务院文化组副组长, cite: ycwb-2004-liu-qingtang }
    - { date: 1975-01, s: power, note: 文化部副部长, cite: ws-1983-liu-qingtang-case, verify: true }
    - { date: 1976-10, s: detained, note: 隔离审查, cite: ycwb-2004-liu-qingtang }
    - { date: 1983-11-02, s: purged, note: 判处有期徒刑十七年, cite: ws-1983-liu-qingtang-case }
  cites: [ws-1983-liu-qingtang-case, ycwb-2004-liu-qingtang]

- id: qian-haoliang
  name: 钱浩梁
  born: 1934
  died: 2020-09-03
  deathKind: natural
  tier: 3
  role1966: 中国京剧院演员，《红灯记》李玉和扮演者
  pinyin: Qián Hàoliáng
  gender: m
  aka:
    - { kind: other, name: 浩亮 }
    - { kind: original, name: 钱正伦 }
  birthplace: 上海
  party: 中国共产党
  positions:
    - { title: 党委副书记, orgName: 中国京剧院, from: 1969-04, to: 1976-10, cite: ifeng-qian-haoliang, verify: true }
    - { title: 副部长, orgName: 文化部, from: 1975-01, to: 1976-10, cite: thepaper-2020-qian-haoliang, verify: true }
  bio: 上海人，京剧世家出身，1943 年进上海戏曲学校“正字科”，原名钱正伦。1964 年在中国京剧院现代京剧《红灯记》中演李玉和，江青看后让他取代老师李少春演 A 组。文革中领导“红灯记战斗兵团”造反，1969 年当选九大代表，任中国京剧院党委副书记；1972 年江青提出“应该让于会泳、浩亮、刘庆棠他们主持文化部的工作”，1975 年任文化部副部长。1976 年 10 月被隔离审查五年，1981 年定为“犯有严重政治错误，免予起诉”，开除党籍。1983 年到河北省艺术学校，1988 年重登舞台，2020 年去世。
  life:
    - h: 正字科与《红灯记》
      from: 1934
      to: 1966-05
      text: |
        1934 年生于上海，父亲钱麟童是上海新华京剧团的主要演员。1943 年进上海戏曲学校“正字科”，与顾正秋、张正芳等同学，名叫钱正伦；1950 年进中国实验戏曲学校。1964 年中国京剧院排演《红灯记》，李少春和他分饰 A、B 角李玉和，李少春手把手教他。江青看了 B 组演出，说“李少春演的李玉和不像个工人，倒像个站长。小钱演的李玉和，像个工人，演得也好”，让他改演 A 组。
      cites: [thepaper-2020-qian-haoliang, ifeng-qian-haoliang]
    - h: 从剧院造反派到副部长
      from: 1966-05
      to: 1976-10
      text: |
        1967 年初成立“红灯记战斗兵团”并任领导人，江青派戚本禹带人进驻中国京剧院，把它列为“左派”支持。凤凰网的文章说他“决不批斗自己的师辈们”，不同意批斗李少春，还替关肃霜在江青面前说情。1969 年 4 月与于会泳、刘庆棠等作为正式代表出席九大，不久任中国京剧院党委副书记。1972 年初江青在会上说“应该让于会泳、浩亮、刘庆棠他们主持文化部的工作”；1975 年任文化部副部长，但基本上不到部里上班。1975 年 11 月 2 日参加刘庆棠、于会泳在北海公园静憩轩的聚会。
      cites: [ifeng-qian-haoliang, thepaper-2020-qian-haoliang, ws-1983-liu-qingtang-case]
    - h: 免予起诉与重返舞台
      from: 1976-10
      to: 2020-09-03
      text: |
        1976 年 10 月被列为“与‘四人帮’有牵连的人”隔离审查。1981 年审查结束，结论是“犯有严重政治错误，免予起诉”，组织决定“敌我矛盾按人民内部矛盾处理，开除党籍，降一级工资”；年底他把名字从浩亮改回钱浩梁。1983 年河北省副省长高占祥让河北省文化厅收留他，到石家庄的河北省艺术学校任教。1988 年 12 月 6 日在中山公园义演《艳阳楼》，这是阔别舞台 12 年后的首次登台。1992 年 1 月脑溢血瘫痪，1998 年基本恢复。2020 年 9 月 3 日去世。
      cites: [thepaper-2020-qian-haoliang, ifeng-qian-haoliang]
  assess:
    - { voice: officialLater, text: 犯有严重政治错误，免于起诉。（1981 年审查结论，澎湃湃客文转引）, cite: thepaper-2020-qian-haoliang, quote: true }
    - { voice: witness, text: 除了跟着江青跑，坏事干得不多，民愤也较小，所以钱浩梁被定性为“犯有严重政治错误，免予起诉”。（凤凰网文）, cite: ifeng-qian-haoliang, quote: true }
    - { voice: editor, text: “浩亮”这个名字的来历有两种说法：澎湃湃客的文章说被定为样板戏后“他的名字，也由钱浩梁，改为了浩亮”；凤凰网的文章说这是他自取的艺名，江青给他改名是后来的传言。1983 年刘庆棠案判决书提到他时用的仍是“浩亮”。, cite: ifeng-qian-haoliang }
  factions: [ccrg]
  fate:
    - { date: 1964, s: rise, note: 《红灯记》李玉和, cite: thepaper-2020-qian-haoliang }
    - { date: 1967, s: rise, note: “红灯记战斗兵团”领导人, cite: ifeng-qian-haoliang }
    - { date: 1969-04, s: power, note: 九大代表、京剧院党委副书记, cite: ifeng-qian-haoliang }
    - { date: 1975, s: power, note: 文化部副部长, cite: thepaper-2020-qian-haoliang }
    - { date: 1976-10, s: detained, note: 隔离审查五年, cite: thepaper-2020-qian-haoliang }
    - { date: 1981, s: purged, note: 免予起诉，开除党籍, cite: ifeng-qian-haoliang }
    - { date: 1983, s: normal, note: 河北省艺术学校, cite: thepaper-2020-qian-haoliang }
    - { date: 2020-09-03, s: dead, cite: thepaper-2020-qian-haoliang }
  cites: [thepaper-2020-qian-haoliang, ifeng-qian-haoliang, ws-1983-liu-qingtang-case]

- id: wang-mantian
  name: 王曼恬
  born: 1913
  died: 1977-01-27
  deathKind: suicide
  deathPlace: 天津
  tier: 3
  role1966: 天津文艺界干部，毛泽东的表侄女
  pinyin: Wáng Màntián
  gender: f
  birthplace: 湖南湘乡
  party: 中国共产党
  positions:
    - { title: 副主任, orgName: 天津市革命委员会, from: 1968, to: 1976-10, cite: ipk-zhang-zhihong-suicides, verify: true }
    - { title: 党的核心小组成员, orgName: 文化部, from: 1975-01, to: 1975-11-18, cite: mzd-1975-11-18-wang-mantian, verify: true }
  bio: 湖南湘乡人，毛泽东的表侄女、王海容的姑妈。1930 年代在上海学美术，后到延安，1938 年与诗人鲁藜结婚；1955 年鲁藜被打成“胡风分子”后与他离婚。1968 年 2 月给江青写信举报天津的“黑会”“黑戏”，引出“二二一”事件；此后任天津市革委会副主任、市委书记。吴德主持国务院文化组时把她调来兼职，以牵制于会泳等人。1975 年 11 月写信请求免去文化部工作，毛泽东批“我看可以同意她回天津”。1976 年后成为清查重点，1977 年 1 月 27 日在监护中自缢。
  life:
    - h: 延安与天津
      from: 1913
      to: 1966-05
      text: |
        1913 年生于湖南湘乡。她的奶奶是毛泽东母亲文七妹的姐姐，父亲是王海容祖父王季范的胞兄。1930 年代在上海新华艺专学美术，做过地下工作，后到延安任美术教员。1938 年与诗人鲁藜结婚，育有一子二女。1955 年时任天津市文化局局长的鲁藜被打成“胡风分子”，她主动与他离婚。
      cites: [ipk-zhang-zhihong-suicides]
    - h: “二二一”事件
      from: 1968-02
      to: 1971
      text: |
        1968 年 2 月给江青写信，说天津开了一个“黑会”（全国工农兵文艺战士座谈会）、演了一出“黑戏”（话剧《新时代的“狂人”》）。2 月 21 日深夜，周恩来、陈伯达、康生、江青、姚文元、谢富治接见用卡车接来的天津群众一千余人，点名批判，要求整肃天津文艺界、政法界；散会后公安局长江枫被拘禁，副市长王亢之回天津服安眠药自杀。此后她出任天津市革委会副主任，又任分管文教的市委书记。
      cites: [ipk-zhang-zhihong-suicides]
    - h: 文化组里的“亲戚”
      from: 1971
      to: 1976-10
      text: |
        据吴德回忆，他兼任国务院文化组组长时，日常工作由江青的亲信于会泳等人主持，万里建议把王曼恬调来，因为她“能和毛主席见得上面、说得上话”；她写信请示毛泽东获同意，每周到文化组一两次。吴德说，有几次于会泳、刘庆棠、浩亮想整人，“王曼恬一说话，他们就缩回去了”。1975 年 11 月 16 日她写信给毛泽东，说“作为您的亲戚，深感影响不好”，请求免去文化部工作；11 月 18 日毛泽东批示：“请汪酌处。我看可以同意她回天津。”
      cites: [ipk-zhang-zhihong-suicides, mzd-1975-11-18-wang-mantian]
    - h: 清查与自缢
      from: 1976-10
      to: 1977-01-27
      text: |
        “四人帮”倒台后成为天津清查的重点，1976 年 12 月起市委多次开常委会让她讲清问题。1977 年 1 月 4 日在办公室服大量安眠药，被抢救过来，此后由二十多人的看护小组监护。1 月 18 日至 26 日，市文化局、天津大学、南开大学等五个单位先后开大会批斗她；1 月 22 日她给解学恭写信说“精神上受不了”。1 月 27 日晚在床上用撕开的床单和毛巾自缢身亡。据调查，1968 年 2 月到 1976 年 10 月她给江青等人写信 33 封，留下电话记录 23 份。
      cites: [ipk-zhang-zhihong-suicides]
  assess:
    - { voice: doc, text: 请汪〔２〕酌处。我看可以同意她回天津。（毛泽东 1975 年 11 月 18 日批语；“汪”指汪东兴）, cite: mzd-1975-11-18-wang-mantian, quote: true }
    - { voice: witness, text: 有几次于会泳、刘庆棠、浩亮想整人，王曼恬一说话，他们就缩回去了。（吴德回忆，张志宏文转述）, cite: ipk-zhang-zhihong-suicides, quote: true }
    - { voice: scholar, text: 其主要问题，就是向江青写密信，导致了后果严重的“二二一”事件；其次是积极紧跟江青，特别是在1976年积极鼓动“批邓”。（张志宏，据调查结论）, cite: ipk-zhang-zhihong-suicides, quote: true }
