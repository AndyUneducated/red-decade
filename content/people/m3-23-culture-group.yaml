    - { date: 1976-10, s: detained, note: 接受审查，后开除党籍, cite: ipk-qian-jiang-lu-ying }
    - { date: 1980, s: normal, note: 人民日报出版社编辑, cite: ipk-qian-jiang-lu-ying, verify: true }
  cites: [ws-1980-indictment, ws-1981-01-25-judgment, ipk-qian-jiang-lu-ying]

