  bio: 战争年代任《渤海日报》编辑、山东《大众日报》记者组组长，后调上海《解放日报》，任党委办公室主任等职。1966 年 6 月随“中央工作组”进入人民日报领导层，此后任该报主要负责人八年之久，1980 年起诉书和 1981 年判决书称他为《人民日报》总编辑。据起诉书，1974 年他和迟群、谢静宜、朱永嘉等受江青、张春桥、姚文元指使批“现代大儒”“宰相”“周公”；1976 年按姚文元、王洪文的指使派人到天安门广场和各部委、各省搜集材料，诬陷群众和“重新出来工作”的老干部。文革后被审查、开除党籍，1980 年代初恢复工作，在人民日报出版社任编辑。
  life:
    - h: 从渤海到上海
      from: 1927
      to: 1966-06
      text: |
        革命战争年代任《渤海日报》编辑、山东《大众日报》编辑和记者组组长，后调上海《解放日报》，担任驻山东记者站负责人、总编辑办公室副主任、党委办公室主任。
      cites: [ipk-qian-jiang-lu-ying]
    - h: 人民日报的八年
      from: 1966-06
      to: 1976-10
      text: |
        1966 年 6 月作为“中央工作组”成员进入人民日报领导层，此后任该报主要负责人八年之久。1980 年起诉书称，1974 年江青、张春桥、姚文元指使“清华大学党委书记迟群、中共北京市委书记谢静宜、‘人民日报’总编辑鲁瑛和上海写作组负责人朱永嘉等”利用舆论工具，在全国批“现代大儒”、批“宰相”、批“周公”，影射周恩来。1976 年 3 月南京出现反对张春桥的标语后，姚文元对他说“这股反革命逆流，看来有个司令部”，指使他派人到天安门广场搜集、编写材料；1976 年 1 月至 9 月，姚文元、王洪文又指使他派人到中央一些部门和福建、江西、浙江等七省搜集诬陷党政军领导干部的材料。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, ipk-qian-jiang-lu-ying]
    - h: 审查以后
      from: 1976-10
      to: 2007
      text: |
        1976 年 10 月后中央印发的批判材料中有专卷《“四人帮”及鲁瑛利用《人民日报》疯狂推行反革命修正主义路线的罪证材料》，称他为“‘四人帮’在人民日报的心腹”。他接受审查，被开除党籍，1980 年代初结束审查，在人民日报出版社任编辑。2005–2007 年间人民日报记者钱江多次登门采访他。
      cites: [ipk-qian-jiang-lu-ying]
  assess:
    - { voice: judicial1980, text: 姚文元指使鲁瑛派人到天安门广场，搜集、编写材料，这些材料经姚文元窜改，把群众反“四人帮”、悼念周恩来、拥护邓小平的革命言行诬陷为“发表反革命演说和反革命口号”。（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: witness, text: 我接触到的许多材料，把他描绘或直接写作“草包总编辑”。我当时倒也曾经想到，“草包”而担任人民日报主要领导8年之久，倒也真不容易了。（钱江）, cite: ipk-qian-jiang-lu-ying, quote: true }
    - { voice: editor, text: 他在起诉书和判决书中多次出现，但没有被列为被告。本站只收了钱江访谈系列的引言部分，他本人对这八年的说法尚未收录。, cite: ws-1980-indictment }
