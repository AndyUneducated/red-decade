- id: jin-jingmai
  name: 金敬迈
  born: 1930
  died: 2020-03-15
  deathKind: natural
  deathPlace: 广州
  tier: 3
  role1966: 广州军区战士话剧团创作员，《欧阳海之歌》作者
  pinyin: Jīn Jìngmài
  gender: m
  birthplace: 南京
  party: 中国共产党
  positions:
    - { title: 创作员, orgName: 广州军区战士话剧团, from: 1949-06, to: 1967-04, cite: chinawriter-2014-jin-jingmai, verify: true }
    - { title: 文艺口负责人, orgName: 中央文化革命小组, from: 1967-05-23, to: 1967-09, cite: chinawriter-2014-jin-jingmai, verify: true }
  bio: 南京人，抗战中随家流浪到四川，卖油条、擦皮鞋为生，1949 年 6 月在武汉参军，进入广州军区战士话剧团。1965 年 7 月长篇小说《欧阳海之歌》在《收获》发表，轰动全国。1967 年 5 月 1 日在天安门城楼受毛泽东、林彪接见，5 月 23 日戚本禹宣布全国文艺口由他负责。123 天后被扣上“收集中央领导同志黑材料”“阴谋绑架毛主席”等罪名，投入秦城监狱；刘庆棠又把他诬为“5·16兵团文艺方面军”的“司令”。1975 年 5 月获释到许昌农场劳动，1978 年平反。2020 年在广州去世。
  life:
    - h: 《欧阳海之歌》
      from: 1930
      to: 1967-04
      text: |
        1930 年生于南京。抗战爆发后随贫困家庭辗转洞庭湖沿岸，流浪到四川万县，靠卖油条、擦皮鞋维持生计。1949 年 6 月在武汉参加解放军，被挑进广州军区战士话剧团。1963 年到衡阳的 139 师找题材，听说临近的 140 师有个战士在铁轨上被火车轧死，害得所在的团评不上“四好”，当即赶去 140 师，后写成长篇小说《欧阳海之歌》，1965 年 7 月在上海《收获》发表。据说印了两三千万册，有领导担心“可不能超过《毛选》”。
      cites: [chinawriter-2014-jin-jingmai, chinawriter-2020-jin-jingmai]
    - h: 123 天
      from: 1967-04
      to: 1967-09
      text: |
        1967 年 4 月初接到总政通知进京。5 月 1 日毛泽东、林彪在天安门城楼接见他，毛泽东说“金敬迈，你是我们的大作家”。5 月 23 日戚本禹宣布全国文艺口由他负责，原文化部归他管。据冯乔的文章，他在点名批判的名单上划掉了肖望东、刘白羽等军人出身的老领导。1967 年 6 月电影资料馆有人建议把 1930 年代有关蓝苹的电影资料收上来，他去请示戚本禹时被江青撞见，后来这成了“收集中央领导同志黑材料”的罪名；8 月 11 日搭空军飞机回广东取东西，又被编成“策划绑架毛主席”。他在京城当了 123 天“大官”。
      cites: [chinawriter-2014-jin-jingmai]
    - h: 秦城、许昌与平反
      from: 1967-09
      to: 2020-03-15
      text: |
        被投入监狱后，每当他要交代收集材料的情况，专案组就紧张地打住“不要说了”。1968 年起刘庆棠又制造“5·16兵团文艺方面军”假案，诬陷他为“司令”、李英儒为“副司令”，经江青批准逮捕关押五年。1975 年 5 月 19 日获释，和李英儒一起到河南许昌部队农场劳动。1976 年 10 月回到广州，起初仍未平反，有人推说他反江青时江青还没有成为“四人帮”；1978 年邓小平说“像金敬迈那样受江青迫害的人还不平反，你们广州军区还要不要揭开盖子”，许世友在广州军区司令部大礼堂宣布给他彻底平反。2020 年 3 月 15 日在广州逝世。
      cites: [chinawriter-2014-jin-jingmai, ws-1983-liu-qingtang-case, chinawriter-2020-jin-jingmai]
  assess:
    - { voice: judicial1980, text: 诬陷中国人民解放军广州军区战士话剧团创作员金敬迈是“5·16兵团文艺方面军”的“司令”，总政文化部创作组组长李英儒是“副司令”。（1983 年刘庆棠案判决书）, cite: ws-1983-liu-qingtang-case, quote: true }
    - { voice: witness, text: 像金敬迈那样受江青迫害的人还不平反，你们广州军区还要不要揭开盖子。（邓小平 1978 年，冯乔文引）, cite: chinawriter-2014-jin-jingmai, quote: true }
    - { voice: editor, text: 他在 1967 年先是中央文革提拔的文艺口负责人，几个月后又成了江青下令关押的“犯人”。本站所收冯乔的文章以他本人的回忆为主，对他主管文艺口期间的作为着墨很少。, cite: chinawriter-2014-jin-jingmai }
  factions: [ccrg]
  fate:
    - { date: 1965-07, s: rise, note: 《欧阳海之歌》发表, cite: chinawriter-2014-jin-jingmai }
    - { date: 1967-05-23, s: power, note: 主管全国文艺口, cite: chinawriter-2014-jin-jingmai }
    - { date: 1967-09, s: detained, note: 被投入监狱, cite: chinawriter-2014-jin-jingmai, verify: true }
    - { date: 1975-05-19, s: sidelined, note: 释放到许昌农场劳动, cite: chinawriter-2014-jin-jingmai }
    - { date: 1978, s: restored, note: 许世友宣布彻底平反, cite: chinawriter-2014-jin-jingmai }
    - { date: 2020-03-15, s: dead, cite: chinawriter-2020-jin-jingmai }
  cites: [chinawriter-2014-jin-jingmai, chinawriter-2020-jin-jingmai, ws-1983-liu-qingtang-case]

