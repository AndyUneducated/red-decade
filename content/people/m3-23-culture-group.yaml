  bio: 河南扶沟人，1937 年参加革命、入党，1940 年起做新闻工作，历任晋绥日报采访通讯部主任、新华社多个前线分社社长。1957 年 11 月调光明日报社，先后任副总编辑、总编辑、党组书记。1966 年 5 月 28 日列入中央文革小组名单，任办事组组长。1967 年 9 月 6 日凌晨被抓走，1968 年 1 月 13 日送进秦城监狱，关押近八年，妻子张卉中也被关押，在狱中被打断锁骨，出狱后不久去世。1975 年 5 月获释，1979 年 12 月任外文局副局长，1980 年兼人民画报社社长，1984 年离休，2010 年去世。
