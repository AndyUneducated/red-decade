  bio: 上海工人，1966 年 11 月安亭事件后成为工总司中实力最大的“二兵团”头头。12 月 30 日与王洪文一起指挥攻打“工人赤卫队”的康平路事件，九十一人受伤。1967 年初因争夺权力与王洪文分裂，另立组织，后被压服。1980 年的起诉书称他为“打砸抢罪犯”。生卒年与后来经历未查实。
  life:
    - h: 二兵团
      from: 1966-11
      to: 1967-02
      text: |
        1966 年 11 月工总司成立、安亭卧轨后，他带领北上返沪的工人组成“第二兵团”，是工总司中人数最多的一支。12 月 30 日，张春桥从北京打电话说“胜利果实不能被赤卫队夺去，要告诉造反派不能置之不理”，经徐景贤传达，王洪文与他组织群众攻打驻康平路市委机关的“工人赤卫队”，按起诉书“伤残九十一人”。一月夺权后他与王洪文争夺新政权中的位置，双方分裂，二兵团最终被王洪文压服。
      verify: true
      cites: [ws-1980-indictment, ws-1982-xu-jingxian-case, macfarquhar-schoenhals]
  assess:
    - { voice: judicial1980, text: 王洪文伙同打砸抢罪犯耿金章，组织指挥一些不明真相的群众，攻打“工人赤卫队”，伤残九十一人（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 又紧密配合王洪文、耿金章一伙攻打“工人赤卫队”，制造了“康平路事件”，致使九十一人受伤（1982 年徐景贤案判决）, cite: ws-1982-xu-jingxian-case, quote: true }
    - { voice: editor, text: 他是上海工人造反派中与王洪文争权失败的一支，说明工总司并非铁板一块；可靠的生平资料很少，此条只写判决书和起诉书提到的部分。 }
