  bio: 上海奉贤人，1950 年代在上海市委宣传部门做文艺工作，1964 年起任市委写作班党支部书记，是张春桥、姚文元在上海的笔杆子。1966 年底从市委机关内部造反，与王洪文里应外合夺取上海市领导权，此后十年任市革委会副主任、市委书记，主管宣传、文教和专案。1976 年 10 月“四人帮”被拘禁后与王秀珍策划武装叛乱未遂。1982 年被上海市高级人民法院判处有期徒刑十八年。晚年写有回忆录，2007 年在上海去世。
  life:
    - h: 写作班
      from: 1933
      to: 1966
      text: |
        1933 年生于上海奉贤。建国初参加工作，在上海市委宣传部文艺处工作，写过剧本和评论。1964 年张春桥在上海市委宣传系统组建写作班，他任党支部书记，写作班以“丁学雷”等笔名发表文章。1982 年的判决书称他“原是中共上海市委员会写作班支部书记”。
      verify: true
      cites: [ws-1982-xu-jingxian-case, macfarquhar-schoenhals]
    - h: 从市委内部夺权
      from: 1966-12
      to: 1967-02
      text: |
        按 1982 年的起诉书，1966 年 12 月他“伙同王承龙、朱永嘉等人密谋策划，里应外合”，在市委机关内部制造“心脏爆炸，后院起火事件”，配合王洪文的工总司夺权。12 月 30 日的康平路事件中，他传达张春桥的电话，与王洪文、耿金章攻打“工人赤卫队”，九十一人受伤。1967 年 1 月至 2 月两次召开大会，宣布“彻底打倒”上海市委，“不再承认”陈丕显、曹荻秋的职务，将他们非法监禁。2 月 24 日上海市革委会成立，任副主任。
      cites: [ws-1982-xu-jingxian-case, ws-1980-indictment]
    - h: 上海十年
      from: 1967
      to: 1976-09
      text: |
        1968 年 2 月他组织文章称陈丕显是“老反革命”，3 月审定发表《旧华东局机关有鬼》，多次诬陷华东局书记处书记魏文伯是“大叛徒”。同年把京剧演员周信芳定为“反革命分子”关押，周被迫害致死；又诬陷上海音乐学院院长贺绿汀组织“翻案集团”。1969 年煤气公司技术员桑伟川写文章反驳“丁学雷”对小说《上海的早晨》的批判，被定为“现行反革命”判刑七年。他还参与指挥张春桥直接操纵的“游雪涛小组”从事跟踪、绑架和搜集情报。1971 年上海市委恢复，任书记，1973 年十大当选中央委员。1976 年 4 月在全市万人大会上称邓小平“必然合乎规律地变成走资派”。
      cites: [ws-1982-xu-jingxian-case]
      verify: true
    - h: 十月叛乱与审判
      from: 1976-10
      to: 2007
      text: |
        1976 年 10 月 8 日得知江青等人被拘禁，他与王秀珍决定发动武装叛乱，设立“一号”“二号”指挥点，他坐镇丁香花园的“一号指挥点”负总责，下令调集“二千五百人集中，三万一千民兵待命”。因中央派人召集上海负责人进京、上海军民抵制，叛乱未能发动。随后被隔离审查。1982 年 6 月上海市人民检察院起诉，7 月 13 日至 8 月 21 日公开审理，以积极参加反革命集团、阴谋颠覆政府、策动武装叛乱等罪判处有期徒刑十八年。刑满后在上海居住，2000 年代在香港出版回忆录《十年一梦》，2007 年去世。
      cites: [ws-1982-xu-jingxian-case]
      verify: true
  assess:
    - { voice: judicial1980, text: 被告人徐景贤是上述共同犯罪活动中的组织者、策划者之一，严重地危害了国家和人民的利益（1982 年上海市高级人民法院判决）, cite: ws-1982-xu-jingxian-case, quote: true }
    - { voice: judicial1980, text: 判处被告人徐景贤有期徒刑十八年，剥夺政治权利四年, cite: ws-1982-xu-jingxian-case, quote: true }
