      verify: true
      cites: [ccp-figures-bios, chen-pixian-memoir]
    - h: 投靠张春桥
      from: 1967
      to: 1976-09
      text: |
        1967 年 1 月上海夺权后，原市委书记处中只有他被张春桥“解放”，以“革命领导干部”身份结合进 2 月 24 日成立的上海市革委会，任副主任，主管工业生产。按 1982 年的起诉书，“张春桥、王洪文、马天水等人还以莫须有的罪名，诬陷、迫害中共地下党领导人和党员”。1971 年任上海市委书记，1973 年十大当选中央委员。1976 年按张春桥的意思在万人大会上称复出的老干部“从资产阶级民主派变成走资派”。8 月丁盛到上海说附近的部队“我指挥不动”，他随即批准向民兵发枪。
      cites: [ws-1982-xu-jingxian-case, ws-1981-01-25-judgment, ws-1980-indictment]
      verify: true
    - h: 进京与审查
      from: 1976-10
      to: 1988
      text: |
        1976 年 10 月“四人帮”被拘禁后，被中央召到北京开会，随后被隔离审查。审查期间出现精神病症状，经鉴定后没有和徐景贤、王秀珍一起被起诉。1988 年去世。
