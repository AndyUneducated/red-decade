  bio: 湖北新洲人，1926 年入党，抗战中在新四军和淮南根据地工作。建国后在华东、上海任司法和党务领导，1961 年华东局重建后任书记处书记，1965 年柯庆施去世后主持华东局。1966 年 3 月参加毛泽东批判“二月提纲”的谈话。1967 年被打倒，徐景贤等称他为“大叛徒”“老反革命”，长期被审查。1979 年恢复司法部后任首任部长，主持重建司法行政，1987 年去世。
