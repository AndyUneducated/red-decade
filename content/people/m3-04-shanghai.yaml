  bio: 河北唐县人，抗战时期在晋察冀、冀中做党的工作，1949 年随军南下上海，长期主管工业，1960 年代任上海市委书记处书记。一月夺权后是上海原市委领导中第一个被张春桥“解放”并结合进市革委会的老干部，此后十年任市革委会副主任、市委书记，主管经济。1976 年 8 月亲笔批准向民兵突击发枪七万余支。“四人帮”被捕后被隔离审查，审查中精神失常，未被起诉。1988 年去世。
  life:
