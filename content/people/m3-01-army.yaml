      from: 1914
      to: 1949
      text: |
        1914 年生于江西吉安。1930 年参加红军，1932 年入党，在红一军团做参谋工作，参加长征。抗战时期在八路军一一五师和延安的军事院校任职；解放战争中在东北任林彪总部作战部门负责人，后任纵队司令员、第四野战军第四十三军军长，参加辽沈、平津和渡海作战海南岛。
      verify: true
      cites: [klein-clark-1971]
    - h: 海军
      from: 1950
      to: 1967
      text: |
        建国后任中南军区、军事院校的领导职务，1955 年授中将军衔。1962 年调海军，任副司令员。1966 年后在海军批判萧劲光、苏振华等，1967 年起任海军第一政治委员，与第二政委王宏坤、政治部主任张秀川一起掌握海军党委（俗称“李王张”）。
      verify: true
      cites: [klein-clark-1971, macfarquhar-schoenhals]
    - h: 军委办事组与九大
      from: 1967-08
      to: 1971-09
      text: |
        1967 年 8 月军委办事组成立后为成员，1968 年任副总参谋长，1969 年 4 月当选政治局委员。据起诉书，“一九六八年四月三日，李作鹏伙同海军的第二政治委员王宏坤、海军政治部主任张秀川写材料，诬陷‘贺、叶配合刘、邓、陶企图篡军反党’”；1968 年 1 月他提出专案工作是“共产党打国民党”，10 月又说要“猛打、猛冲、猛追”，直接诬陷、迫害一百二十人，雷永通等三人被迫害致死。1970 年庐山会议上与叶群、吴法宪、邱会作一起在小组会上支持设国家主席、称“天才”。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, ws-1971-12-lin-chen-material-1]
    - h: 九一三之夜与受审
      from: 1971-09
      to: 2009
      text: |
        据判决书，“一九七一年九月十二日晚十一时三十五分和十三日零时六分，在林彪、叶群叛逃前，李作鹏两次篡改了周恩来总理的命令”；起诉书说他把须由周恩来、黄永胜、吴法宪、李作鹏“四个人一起下命令才能飞行”的命令改为“四个首长其中一个首长指示放飞才放飞”。13 日零时二十分山海关场站请示飞机强行起飞怎么办，他“没有采取阻止起飞的任何措施”，事后修改电话报告记录。1971 年 9 月 24 日被隔离审查；1981 年 1 月被判处有期徒刑十七年、剥夺政治权利五年。刑满后住北京，晚年写有回忆录（2011 年在香港出版），对“篡改命令”的认定提出异议。2009 年 1 月 3 日在北京去世。
      cites: [ws-1981-01-25-judgment, ws-1980-indictment, ws-1972-lin-material-3]
      verify: true
  assess:
    - { voice: official1966, text: 李作鹏在向驻山海关机场某部下达命令时，竟两次篡改中央命令（1972 年中共中央林彪集团材料之三）, cite: ws-1972-lin-material-3, quote: true }
    - { voice: judicial1980, text: 李作鹏没有采取阻止起飞的任何措施，致使林彪得以乘飞机叛逃, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: judicial1980, text: 判处被告人李作鹏有期徒刑十七年，剥夺政治权利五年, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: witness, text: 李作鹏晚年回忆录称自己对林彪出逃事先不知情，转述命令时并无篡改之意（本人回忆，未入库，需对照）。 }
