  bio: 江西兴国人，红军时期做后勤和政治工作，长期在林彪的东北、四野系统，1959 年起任总后勤部部长。1967 年初被总后造反派揪斗，经林彪、叶群出面保护后成为林彪的亲信，进入军委办事组、任副总参谋长，九大当选政治局委员。在总后“私设监狱，刑讯逼供”，直接迫害四百六十二人。九一三后受审，1981 年被判处有期徒刑十六年；判决书认定他揭发了同案犯。2002 年在西安去世。
  life:
