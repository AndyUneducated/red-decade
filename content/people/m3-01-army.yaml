      text: |
        1967 年武汉群众组织分为“百万雄师”和“工人总部”等造反派两大派，军区在“支左”中支持“百万雄师”，3 月宣布取缔“工人总部”。7 月谢富治、王力到武汉处理，表态支持造反派，20 日其住地被“百万雄师”群众和部分军人冲击，王力被绑架。武汉军区 7 月 26 日的公告说：“王任重和陈再道则是上述事件的罪魁祸首”，“陈再道罪责难逃，我们坚决同陈再道划清界限，坚决把他打倒”。他被调到北京，在京西宾馆遭到批斗殴打，随后撤职审查。
      cites: [ws-1967-07-26-wuhan-notice, macfarquhar-schoenhals]
      verify: true
