      cites: [ws-1980-indictment, macfarquhar-schoenhals]
      verify: true
    - h: 平反与晚年
      from: 1974
      to: 2004
      text: |
        1974 年 7 月毛泽东表示“杨余傅”案是听了林彪的一面之词，中央随即为三人平反（待核）。复任副总参谋长，1977 年任福州军区司令员，1980 年后任军委副秘书长、全国人大常委会副委员长，1988 年起任全国政协副主席。2004 年 2 月 14 日在北京去世。
