        1945 年生，林彪与叶群之子，小名“老虎”（出生地说法不一）。1963 年考入北京大学物理系（待核）。
      verify: true
      cites: [ding-kaiwen-lin]
    - h: 进入空军与“讲用报告”
      from: 1967-03
      to: 1970-09
      text: |
        1967 年 3 月进入空军党委办公室工作并入党。1969 年 2 月 16 日林彪写信给空军党委办公室的周宇驰、刘沛丰，要他们“让老虎多单独行动”，“以便锻炼他”。1969 年 10 月 17 日，“在林彪的指使下，吴法宪任命林彪的儿子林立果为空军司令部办公室副主任兼作战部副部长”。1970 年 7 月 31 日在空军司令部干部大会上宣读“讲用报告”，林彪听录音后说：“不仅思想象我的，语言也象我的”；吴法宪等吹捧他是“伟大的天才，全才，全局之才”，并宣称“空军的一切都可以由立果同志调动，空军的一切都可以由立果同志指挥”。庐山九届二中全会时随林彪、叶群上山，在山下联络王维国、陈励耘。
      cites: [ws-1971-12-lin-chen-material-1, ws-1972-lin-material-3, ws-1980-indictment]
    - h: “联合舰队”与《“571 工程”纪要》
      from: 1970-10
      to: 1971-09-11
      text: |
        据起诉书，1970 年 5 月 3 日周宇驰、王飞等“共推林立果为‘头’”，“一九七零年十月，林立果为头的‘调研小组’组成为‘联合舰队’”。他在北京、上海、广州建立十多处秘密据点。1971 年 2 月林彪、叶群、林立果在苏州密谋后，他到上海，3 月 21 日至 24 日与周宇驰、于新野、李伟信制订“《五七一工程》纪要”，提出“军事上先发制人”；3 月 31 日召集江腾蛟、王维国、陈励耘、周建平开会，指定南京、上海、杭州的“头”。9 月 7 日向“联合舰队”下达一级战备命令，8 日起传达林彪手令“盼照立果、宇驰同志传达的命令办”，部署用火焰喷射器、炸铁路桥等手段在途中谋杀毛泽东。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, ws-1972-lin-material-3]
    - h: 出逃与坠机
      from: 1971-09-11
      to: 1971-09-13
      text: |
        9 月 11 日晚得知毛泽东已离开上海北返，计划破产，转而准备南逃广州“另立中央”。12 日晚周恩来追查 256 号专机，他与林彪、叶群、刘沛丰等赶到山海关机场，13 日零点三十二分强行起飞，飞机在蒙古温都尔汗坠毁，机上九人全部死亡。其姐林立衡（林豆豆）当晚向八三四一部队报告了出逃动向。1980 年特别检察厅以他已死亡为由不再追究刑事责任。
      cites: [ws-1980-indictment, ws-1971-09-18-notice, ws-1972-lin-material-3]
