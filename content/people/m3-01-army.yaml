  bio: 江西吉安人，1930 年参加红军，长期在林彪身边做作战参谋工作，解放战争中在四野任纵队、军的指挥员。1955 年授中将，1962 年任海军副司令员。文革中借林彪支持在海军夺权，1967 年起任海军第一政委，进入军委办事组，1969 年当选政治局委员。九一三之夜他两次篡改周恩来关于 256 号专机的命令，事后又改动记录。1981 年被判处有期徒刑十七年，2009 年在北京去世。
  life:
