      text: |
        1914 年生于江西兴国。1929 年参加红军，1932 年入党，在中央红军总供给部、红一方面军做后勤和政治工作，参加长征。抗战时期在中央军委总供给部、八路军留守兵团任职；解放战争中到东北，在东北民主联军、第四野战军做政治工作。
