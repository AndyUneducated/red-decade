  rank: { rank: 上将, date: 1955-09 }
  bio: 秋收起义出身的红军将领，长期在林彪指挥的部队中任职，1955 年授上将，此后任广州军区司令员十三年。文革中主持广东军管，制造“广东地下党”等冤案。1968 年 3 月杨余傅事件后接任总参谋长、军委办事组组长，九大进入政治局，是林彪集团“黄吴李邱”之首。九一三事件后被隔离审查，1981 年被特别法庭以组织、领导反革命集团等罪判处有期徒刑十八年，1983 年在青岛病死。
  life:
    - h: 早年与红军
      from: 1910
      to: 1937
      text: |
        1910 年生于湖北咸宁的农民家庭。1927 年参加秋收起义，随部队上井冈山，同年入党。在红四军、红一军团中历任连长、团长、师长，参加中央苏区历次反“围剿”和长征。到陕北后入红军大学学习。
      verify: true
      cites: [klein-clark-1971, ccp-figures-bios]
    - h: 抗战、东北与华南
      from: 1937
      to: 1955
      text: |
        抗战时期在晋察冀军区任团长、军分区司令员。抗战胜利后到东北，任东北民主联军纵队司令员，属林彪指挥的第四野战军系统；1949 年随四野南下，任兵团司令员，后在华南军区任职。1955 年授上将军衔，任广州军区司令员。
      verify: true
      cites: [klein-clark-1971]
    - h: 广州军区与广东军管
      from: 1955
      to: 1968-03
      text: |
        任广州军区司令员十三年。文革中广州两派对立，军区支持“东风派”。据 1980 年起诉书，1967 年 6 月 23 日他批准广州市公安局军管会负责人报送的“关于揪叛徒调查工作的请示”和所附调查叶剑英的“第一号调查方案”；“一九六七年十月，黄永胜伙同广州部队政治委员刘兴元等提出对中共广东地下党进行‘审查’”，制造“广东地下党”冤案，“使七千一百多人遭到诬陷、迫害，林锵云等八十五人被迫害致死”。又从 1967 年 5 月到 1970 年 11 月在广州部队制造“反革命集团”冤案，诬陷副司令员文年生等“夺权搞政变”，株连七百多名干部。1968 年 2 月广东省革委会成立，他任主任。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
    - h: 总参谋长与九大
      from: 1968-03
      to: 1971-09
      text: |
        1968 年 3 月杨成武、余立金、傅崇碧被撤职后，调任总参谋长、军委办事组组长，1969 年 4 月九届一中全会当选政治局委员。据起诉书，1968 年 4 月他在总参说：“总参出了不少坏人，有黄克诚、罗瑞卿、张爱萍、王尚荣”等，“他们是不能翻案的，不能翻天的”；同年 11 月诽谤聂荣臻“这一辈子也没有干什么好事”。1970 年 11 月 3 日审批“同意”彭德怀专案组的报告，该报告提出要“撤销彭德怀党内外一切职务，永远开除党籍，判处无期徒刑，终身剥夺公民权利”。1969 年 10 月 18 日“林副主席指示第一个号令”由他以总参名义下达。1970 年庐山九届二中全会期间他留守北京，让人起草了支持林彪的发言稿，上山后见势不妙又销毁。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, ws-1972-lin-material-3, ws-1971-12-lin-chen-material-1]
    - h: 九一三与受审
      from: 1971-09
      to: 1983
      text: |
        据判决书，“一九七一年九月六日，黄永胜向林彪密报了毛泽东主席察觉林彪在密谋夺权的谈话”。起诉书说 9 月 10 日“黄永胜叶群频繁联系，五次通电话”，林彪还托人带给他一封亲笔信。林彪出逃后，他与吴法宪、邱会作等销毁了与林彪、叶群往来的信件和笔记本。9 月 24 日被隔离审查，29 日中共中央通知他与吴、李、邱“离职反省，彻底交代”。1980 年 11 月作为主犯受审，判决书说他只“供认了自己的部分犯罪事实”。1981 年 1 月 25 日被判处有期徒刑十八年、剥夺政治权利五年。1983 年 4 月 26 日因肝癌在青岛去世（死因、地点待核）。
      cites: [ws-1981-01-25-judgment, ws-1980-indictment, ws-1971-09-29-notice]
      verify: true
  assess:
