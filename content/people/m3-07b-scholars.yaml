    - { title: 学部委员, orgName: 中国科学院, from: 1955-06, to: 1969-10-07, verify: true }
  bio: 江西修水（义宁）人，生于长沙，陈三立之子，史学家，与王国维、梁启超、赵元任同为清华国学研究院导师。1949 年后留在广州，先后在岭南大学、中山大学任教。1953 年 12 月科学院请他北上任中古史研究所所长，他口述答复，提出“允许中古史研究所不宗奉马列主义，并不学习政治”和请毛泽东或刘少奇出具允许证明两个条件，事遂不成。1958 年被批“厚古薄今”，文革中被抄家、批斗、停发工资，1969 年 10 月 7 日在中山大学病逝，妻子唐筼 45 天后去世。
  life:
    - h: 清华导师
      from: 1890
      to: 1949
      text: |
        1890 年生于长沙，祖父陈宝箴、父亲陈三立。1902 年起留学日本、德国、瑞士、法国、美国，1925 年任清华国学研究院导师。1929 年为王国维撰写纪念碑铭，提出“独立之精神，自由之思想”。抗战中在西南联大和香港，1945 年后双目失明。
      verify: true
    - h: 对科学院的答复
      from: 1949
      to: 1957
      text: |
        1949 年 1 月南下广州，任岭南大学教授，1952 年院系调整后为中山大学教授。1953 年 12 月，学生汪篯奉命南下请他出任中国科学院中古史研究所所长。他口述的答复说“我认为研究学术，最主要的是要具有自由的意志和独立的精神”，提出两个条件：“允许中古史研究所不宗奉马列主义，并不学习政治”，以及“请毛公或刘公给一允许证明书，以作挡箭牌”，并说“我决不反对现在政权”。所长一职后来由陈垣出任。1955 年他仍被选为科学院学部委员。
      cites: [chen-yinke-1953-12-01-reply]
      verify: true
    - h: 批判与病逝
      from: 1958
      to: 1969-10-07
      text: |
        1958 年“厚今薄古”运动中被学生贴大字报批判，此后宣布不再开课。晚年在失明中口述《柳如是别传》。文革中中山大学的造反派抄家、批斗，停发工资，他的助手和护士被撤走。1969 年 10 月 7 日在中山大学寓所去世，妻子唐筼同年 11 月 21 日去世。
      verify: true
  assess:
    - { voice: doc, text: 我认为研究学术，最主要的是要具有自由的意志和独立的精神。（1953 年 12 月 1 日《对科学院的答复》）, cite: chen-yinke-1953-12-01-reply, quote: true }
    - { voice: doc, text: 我决不反对现在政权，在宣统三年时就在瑞士读过资本论原文。但我认为不能先存马列主义的见解，再研究学术。, cite: chen-yinke-1953-12-01-reply, quote: true }
    - { voice: editor, text: 这份答复由汪篯记录，副本存中山大学档案馆，1995 年陆键东《陈寅恪的最后二十年》首次公开全文；本站据的是网上转录本。, cite: chen-yinke-1953-12-01-reply }
