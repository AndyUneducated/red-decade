  bio: 湖北黄冈人，早年参加反清革命，35 岁后弃政向学，以《新唯识论》《原儒》建立“体用不二”的哲学体系，是现代新儒家的奠基人。1949 年受董必武、郭沫若电邀回北京任北大教授，1954 年定居上海，任全国政协委员。1966 年文革开始后被当作“反动学术权威”抄家、批斗、街头示众，被迫迁居。1968 年绝食、拒药后患肺炎，5 月 23 日在上海虹口医院去世。
  life:
    - h: 革命到新唯识论
      from: 1885
      to: 1949
      text: |
        1885 年生于湖北黄冈，原名继智。早年参加日知会、同盟会，辛亥革命时任湖北都督府参谋。1920 年代起在北京大学讲授佛教唯识学，后自成一家，出版《新唯识论》；抗战中在四川讲学著述。
      cites: [gmrb-2017-02-20-xiong-shili]
      verify: true
    - h: 北京与上海
      from: 1949-10
      to: 1966-05
      text: |
        1949 年 10 月应董必武、郭沫若电邀从广州回北京，继任北大教授。1954 年移居上海，1956 年增选为全国政协委员，并被聘为北大一级教授，此后连任第三、四届政协委员，写成《原儒》《明心篇》等。
      cites: [gmrb-2017-02-20-xiong-shili]
    - h: 抄家与去世
      from: 1966-06
      to: 1968-05-23
      text: |
        1966 年他被当作“反动学术权威”，淮海中路的住所被红卫兵轮番抄查，书籍手稿被撕毁或查封，本人被批斗、街头示众，后被迫迁到儿子在青云路的家中。北京来的红卫兵追问他所知的某中央领导的庐山旧事，他一律答“不知”，又被批斗。据传记记载，他此后给中央写信抗议，在街头自言自语“中国文化亡了”；1968 年一度绝食，后减食，患肺炎后不肯服药，5 月 23 日心力衰竭去世。
      cites: [gmrb-2017-02-20-xiong-shili]
      verify: true
  assess:
    - { voice: scholar, text: 1966年“文革”开始不久，熊十力被视为“反动学术权威”。（郭齐勇，2017 年《光明日报》）, cite: gmrb-2017-02-20-xiong-shili, quote: true }
    - { voice: scholar, text: “文化大革命”中，他受到冲击。1968年5月23日，熊十力因患肺炎而心力衰竭，在上海虹口医院病逝，享年84岁。（同上，学人小传）, cite: gmrb-2017-02-20-xiong-shili, quote: true }
    - { voice: editor, text: 死因官方记为肺炎、心力衰竭；此前的绝食和拒药是否算作抗议性的自绝，传记说法不一，这里标为有争议。 }
