    - { date: 1953-12-01, s: normal, note: 拒绝北上任中古史所长, cite: chen-yinke-1953-12-01-reply }
    - { date: 1958, s: attacked, note: 被批“厚古薄今”, verify: true }
    - { date: 1966, s: attacked, note: 抄家、批斗、停薪, verify: true }
    - { date: 1969-10-07, s: dead, note: 在中山大学去世（维基百科，未核原件）, cite: zhwiki-chen-yinke }
