  deathKind: natural
  deathPlace: 北京
  party: 中国共产党
  positions:
    - { title: 经济研究所研究员, orgName: 中国科学院, from: 1956, to: 1974-12-03, verify: true }
  bio: 上海人，会计学家、经济学家。1935 年入党，1949 年任上海市财政局长、税务局长，1952 年“三反”中被撤职。1956 年调中国科学院经济研究所，1957 年论证社会主义下商品生产和价值规律仍起作用，同年被划为右派。1964–1965 年在经济所“四清”批孙冶方时再次戴上右派帽子。文革中被批斗、监管，妻子汪璧 1968 年自杀，他与子女断绝往来。1969 年下放河南息县干校，留下大量日记和读书笔记。1974 年 12 月在北京病逝，遗稿《希腊城邦制度》《从理想主义到经验主义》在 1980–1990 年代出版。
  life:
    - h: 立信与上海财政
      from: 1915
      to: 1955
      text: |
        经济所所史记载，他生于上海一个小商人家庭，十二岁进立信会计师事务所，1934–1940 年间出版多部会计学专著；1935 年入党，在上海职业界救国会和江苏省委做职工与文化工作，1940 年进入苏南、苏中、山东根据地做财经工作。1949 年 5 月任上海市财政局长、税务局长，兼华东军政委员会财政部副部长，1953 年调中央建筑工程部任司长。1952 年“三反”中被撤销职务，直到 1985 年才由国务院撤销这一处分。
      cites: [cass-ie-gu-zhun]
      verify: true
    - h: 两次右派
      from: 1956
      to: 1965
      text: |
        1956 年调中国科学院经济研究所任研究员，1957 年在《经济研究》发表文章，论证社会主义制度下商品生产和价值规律仍然存在。同年作为中苏黑龙江流域联合考察中方副组长，因维护中方利益与苏方争执，被划为右派，1958–1961 年在河北赞皇、河南商城、北京清河劳动改造。1962 年经孙冶方力争回到经济所；1964 年经济所“四清”批判孙冶方的“价值规律论”，他再次被戴上右派帽子。
      cites: [cass-ie-gu-zhun]
      verify: true
    - h: 文革与息县
      from: 1966
      to: 1974-12-03
      text: |
        文革中被作为“牛鬼蛇神”批斗、监管和审查，与家人断绝音信。妻子汪璧任财政部副司长，受牵连于 1968 年自杀。1969 年随经济所下放河南息县（后到明港）五七干校，写下大量日记；1972 年回北京后写读书笔记，后编为《希腊城邦制度》《从理想主义到经验主义》。1974 年 12 月病逝于北京。1979 年 5 月中组部同意改正其右派问题，恢复党籍；1980 年 2 月为他和汪璧举行追悼会。
      cites: [cass-ie-gu-zhun]
      verify: true
  assess:
    - { voice: officialLater, text: 在“文化大革命”中，顾准被作为“牛鬼蛇神”受到批斗、监管和种种审查，与家人断绝音信。（中国社会科学院经济研究所所史）, cite: cass-ie-gu-zhun, quote: true }
    - { voice: officialLater, text: 1964年经济研究所开展“四清”运动，矛头直指孙冶方的“价值规律论”，顾准未能幸免，被再次戴上“右派”帽子。, cite: cass-ie-gu-zhun, quote: true }
