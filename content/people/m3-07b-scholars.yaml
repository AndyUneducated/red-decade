- id: fu-lei
  name: 傅雷
  born: 1908-04-07
  died: 1966-09-03
  tier: 3
  role1966: 翻译家
  pinyin: Fù Léi
  gender: m
  ethnicity: 汉族
  aka:
    - { kind: courtesy, name: 怒安 }
    - { kind: art, name: 怒庵 }
  birthplace: 江苏南汇
  origin: 江苏南汇
  deathKind: suicide
  deathPlace: 上海
  bio: 江苏南汇（今属上海）人，翻译家，译有巴尔扎克、罗曼·罗兰的大量作品，写给长子傅聪的信后来编成《傅雷家书》。1958 年被划为右派，同年底傅聪从波兰出走英国。1966 年 8 月底红卫兵连续几天抄家、批斗，抄出一面背面有蒋介石像的小镜子和一张有宋美龄照片的旧画报作为“反党罪证”。9 月 2 日夜他与妻子朱梅馥写下给内兄朱人秀的遗书，交代房租、寄存物和火葬费，随后两人自尽。1979 年平反。
  life:
    - h: 翻译家
      from: 1908
      to: 1957
      text: |
        1908 年生于江苏南汇，1927 年赴法国留学，1931 年回国，在上海美专任教，后专事翻译。1930–1950 年代译出罗曼·罗兰《约翰·克利斯朵夫》、巴尔扎克《高老头》《欧也妮·葛朗台》等，译文以传神著称。长子傅聪 1955 年在华沙肖邦钢琴比赛获奖，留在波兰学习。
      verify: true
    - h: 右派与傅聪出走
      from: 1958
      to: 1966-07
      text: |
        1958 年 4 月在上海作协被划为右派，此后只能以译稿维生。1958 年 12 月傅聪从波兰出走英国，被国内视为“叛逃”。1961 年摘去右派帽子。
      verify: true
    - h: 抄家与遗书
      from: 1966-08
      to: 1966-09-03
      text: |
        1966 年 8 月底上海音乐学院等处的红卫兵到家中抄家、批斗数日。他在遗书中说，所谓“反党罪证”是在家里搜出的一面小镜子和一张褪色的旧画报，实是亲戚寄存箱内之物，“我们至死也不承认是我们自己的东西”，又写道“何况光是教育出一个叛徒傅聪来，在人民面前已经死有余辜了”。遗书列出十三条托付，包括给保姆周菊娣的生活费和 53.30 元火葬费，署“一九六六年九月二日夜”。夫妇二人当夜自尽。
      cites: [fu-lei-1966-09-02-note]
    - h: 平反
      from: 1979
      to: 1979
      text: |
        1979 年 4 月上海市文联和作协上海分会为傅雷、朱梅馥举行追悼会，宣布 1958 年划右派是错误的，文革中所受诬陷一律平反。骨灰由一位素不相识的读者冒名保存下来，移入上海革命烈士公墓。
      verify: true
  assess:
    - { voice: doc, text: 我们纵有千万罪行，却从来不曾有过变天思想。（1966 年 9 月 2 日遗书）, cite: fu-lei-1966-09-02-note, quote: true }
    - { voice: doc, text: 只是含冤不白，无法洗刷的日子比坐牢还要难过。（1966 年 9 月 2 日遗书）, cite: fu-lei-1966-09-02-note, quote: true }
    - { voice: editor, text: 遗书通篇是事务性的托付，自称“来自旧社会的渣滓”，又反复申明清白；这是 1966 年 8–9 月上海抄家风潮中留下的少数当事人亲笔。, cite: fu-lei-1966-09-02-note }
  factions: [academics]
  fate:
