    - { date: 1961-09, s: normal, note: 摘帽（此前数据作 1961）（维基百科，未核原件）, cite: zhwiki-fu-lei }
    - { date: 1966-08, s: attacked, note: 抄家、批斗, cite: fu-lei-1966-09-02-note }
    - { date: 1966-09-03, s: dead, note: 与妻子朱梅馥一同自尽（维基百科，未核原件）, cite: zhwiki-fu-lei }
    - { date: 1979-04, s: restored, note: 追悼会，平反（维基百科，未核原件）, cite: zhwiki-fu-lei }
