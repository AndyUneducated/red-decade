  bio: 江西临川人，红军老干部，抗战中率大青山支队开辟绥远根据地，后任晋绥军区政委。1952 年起主政四川十余年，1958 年进政治局，1960 年任西南局第一书记，四川大饥荒期间仍大量外调粮食。文革中被刘结挺、张西挺和四川造反派称为“刘、邓埋在大西南的一颗定时炸弹”，1967 年 4 月中央通知把宜宾案定为他“一手制造”的冤案，他被打倒、批斗、关押。妻子肖里死于关押中，次子李明清 1967 年在北航被殴打后死去。1973 年当选十届中委，1975 年再任全国人大常委会副委员长，1989 年在北京去世。
