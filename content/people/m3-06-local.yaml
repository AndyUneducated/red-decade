  bio: 河南渑池人，宁都起义参加红军，1949 年后转入空军，任空军第三军军长、武汉军区空军副司令员。1967 年七二〇事件后升任武汉军区政委，次年任湖北省革委会副主任，1969 年进入九届中委和中央军委。1971 年 9 月初把毛泽东南巡时在武汉的谈话内容透露给李作鹏，被 1980 年起诉书列为林彪下决心行动的情报来源之一。九一三事件后被撤职审查，1973 年被开除党籍，1974 年中央文件称他是“林彪死党”。1982 年退出现役，1993 年在武汉去世。
