      cites: [ws-1974-05-21-hubei-instructions, ws-1980-indictment]
      verify: true
    - h: 济南与晚年
      from: 1973-12
      to: 2012
      text: |
        1973 年 12 月毛泽东主持八大军区司令员对调，他调任济南军区司令员，1980 年 1 月任南京军区顾问，1983 年离休。连任九至十一届中央委员。2012 年 12 月 31 日在大连去世。
      verify: true
  assess:
