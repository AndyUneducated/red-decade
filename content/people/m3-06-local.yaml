      verify: true
    - h: 泄密与九一三
      from: 1971-08
      to: 1971-11
      text: |
        1971 年 8 月中旬毛泽东南巡到武汉，同他和湖北负责人谈话，矛头指向林彪，叮嘱不要外传。按 1980 年起诉书，9 月 6 日“李作鹏在武汉得到武汉部队政治委员刘丰关于毛泽东主席在武汉同一些负责人谈话内容的密报”，当天回京告诉黄永胜、邱会作，黄永胜连夜电话告诉叶群；林彪、叶群据此“下决心采取行动杀害毛泽东主席”。11 月他被免职审查，其间自杀未遂。
