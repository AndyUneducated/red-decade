      verify: true
    - h: 武汉军区与七二〇事件
      from: 1955-12
      to: 1967-07
      text: |
        1955 年 12 月任武汉军区政委，其间兼任最高人民法院军事审判庭庭长，1963 年 12 月起任第二政委（第一政委由湖北省委第一书记王任重兼任）。1967 年军区在武汉两派之争中支持“百万雄师”，7 月 20 日谢富治、王力住地被冲击。7 月 26 日军区公告把陈再道定为“罪魁祸首”，27 日中央撤销陈再道、钟汉华的职务，由曾思玉、刘丰接任。
