    - h: 开除党籍
      from: 1972-02
      to: 1993
      text: |
        1972 年 2 月被撤销党内外一切职务，1973 年被开除党籍。1974 年 5 月中央关于湖北问题的指示要点说他“参与了林彪反党集团策动反革命政变的阴谋活动，是林彪反党集团在湖北的代理人”。他没有受到刑事起诉，1982 年经中央军委批准退出现役，按师级待遇安置，1993 年 3 月 9 日在武汉去世。
