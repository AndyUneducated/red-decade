  bio: 江西信丰人，中央苏区的红军老兵，抗战中在一一五师和冀鲁豫军区，解放战争中任华北野战军第四纵队司令员、第六十四军军长。1967 年七二〇事件后从沈阳军区副司令员调任武汉军区司令员，1968 年任湖北省革委会主任。1971 年 9 月毛泽东南巡谈话后，他没有像政委刘丰那样向林彪方面泄露，事后被中央定为“好人犯错误”。1973 年底八大军区司令员对调时调任济南军区司令员，1980 年后任南京军区顾问。2012 年在大连去世，年 101 岁。
