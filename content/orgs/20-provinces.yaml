# Provincial party committees (1949–) and revolutionary committees (1967–1979), the provinces not
# already in 00-central.yaml. Seats, dates and heads from general reference, all verify.
# Revolutionary committee founding dates follow the order in which the 29 were set up (黑龙江 1967-01-31
# … 西藏、新疆 1968-09-05). Party committees stopped working when the revolutionary committee took
# over and were rebuilt in 1970–1971; the exact month differs by province and is only approximate here.

