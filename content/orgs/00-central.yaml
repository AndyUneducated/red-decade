# Formal bodies (正式建制), as opposed to factions (political groupings, factions.yaml).
# kind: party | state | army | mass (官方群团) | popular (红卫兵、造反派等群众组织) | unit (院校、报社、工厂、科研)
# level: central | regional | provincial | basic
# under: hierarchy, time-scoped. links: this org → that org (lead, found, oppose, merge, takeover, replace).
# suspended: existed on paper but did not function. places: seat over time (ids in places.yaml).
# aliases: matched against people.yaml positions.orgName / the start of positions.title at build time.
# Dates and seats without a cite come from general reference and are marked verify.

