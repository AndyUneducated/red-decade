  - text: 将军，你看演得象不象
    by: jiang-qing
    cite: rmrb-1979-07-09-xu-guangda
    note: 看戏时拍着许光达的肩头问，1979 年《人民日报》记者顾雷所记
    voice: witness
  - text: 我没有见过，要是象就不是演戏了
    cite: rmrb-1979-07-09-xu-guangda
    note: 答江青，1979 年《人民日报》记者顾雷所记
    voice: witness
wei-heng:
  - text: 谁好谁坏，人民最后是会作出判决的
    cite: rmrb-1986-01-26-wei-heng
    note: 对身边的同志说，1986 年《人民日报》怀念文章所述
    voice: witness
  - text: 我有错误甘愿向人民低头，决不向坏人低头
    cite: rmrb-1986-01-26-wei-heng
    note: 被揪斗时，1986 年《人民日报》怀念文章所述
    voice: witness
  - text: 纸笔千年会说话
    cite: rmrb-1986-01-26-wei-heng
    note: 回应造反派说他的讲话、文章“统统是修正主义”，同一文章所述
    voice: witness
bo-yibo:
  - text: 省委对卫恒同志彻底平反昭雪的决定，我接到后，默默地读了两遍，很受感动
    cite: rmrb-1986-01-26-wei-heng
    note: 在山西省委决定上的批注，1986 年《人民日报》怀念卫恒文章所引
    voice: witness

li-peng:
  - text: 李鹏下台，谢国安民
    by: 1989 年游行标语
    cite: ws-1989-06-30-chen-xitong-report
    date: 1989
    note: 陈希同报告所引
    voice: officialLater
yan-jiaqi:
  - text: 废除戒严令，罢免李鹏总理职务
    cite: ws-1989-06-30-chen-xitong-report
    date: 1989
    note: 与包遵信在香港《明报》发表《兼告李鹏书》，陈希同报告所引
    voice: officialLater
bao-zunxin:
  - text: 目前宪法受到少数人的粗暴践踏
    cite: ws-1989-06-30-chen-xitong-report
    date: 1989
    note: 与严家其等致电全国人大常委会领导人，陈希同报告所引
    voice: officialLater
wang-dan:
  - text: 正好可以借戈尔巴乔夫访华压他们
    cite: ws-1989-06-30-chen-xitong-report
    date: 1989-05
    note: 谈选在 13 日开始绝食，陈希同报告所引
    voice: officialLater
wan-runnan:
  - text: 军队回去，戒严取消，李鹏下台，邓小平、杨尚昆退休，赵紫阳复出
    cite: ws-1989-06-30-chen-xitong-report
    date: 1989
    note: 提出的退出天安门广场的六个条件，陈希同报告所引
    voice: officialLater
jin-guantao:
  - text: 社会主义的尝试及其失败，是二十世纪人类的两大遗产之一
    cite: ws-1989-06-30-chen-xitong-report
    date: 1988-12-07
    note: 在北京大学未来学会讨论会上，陈希同报告所引
    voice: officialLater
ge-yang:
  - text: 金观涛对社会主义的否定不是太厉害了，而是客气了一点
    cite: ws-1989-06-30-chen-xitong-report
    note: 陈希同报告所引
    voice: officialLater
wei-jingsheng:
  - text: 难道独裁就等于人民的幸福吗
    cite: wjs-1978-fifth-modernization
    date: 1978-12-05
    note: 《第五个现代化》
    voice: doc
  - text: 让我们团结在这一伟大而真实的旗帜下，为谋求人民的安宁与幸福，为谋求人民的权利与自由，向社会制度的现代化进军吧
    cite: wjs-1978-fifth-modernization
    date: 1978-12-05
    note: 《第五个现代化》结尾
    voice: doc
liu-binyan:
  - text: 都是为了展示一个真理，就是中国共产党的腐败
    cite: rmrb-1987-01-25-liu-binyan
    note: 说《人妖之间》《千秋功罪》，人民日报社机关纪委开除其党籍的决定所引
    voice: officialLater

zhang-zhixin:
  - text: 张志新同志是一个很好的党员，坚持真理，坚持党性，坚持斗争，宁死不屈
    by: ren-zhongyi
    cite: people-2014-ren-zhongyi-zhang-zhixin
    date: 1979
    note: 人民网党史文章所述
    voice: officialLater
  - text: 张志新是刘胡兰式的英雄人物，《人民日报》应该刊登
    by: hu-yaobang
    cite: people-2014-ren-zhongyi-zhang-zhixin
    date: 1979
    note: 人民网党史文章所述
    voice: officialLater
ren-zhongyi:
  - text: 把这些说成是她的，是不公平的
    cite: people-2014-ren-zhongyi-zhang-zhixin
    date: 1979
    note: 为张志新平反定调时说她批评毛泽东的言论，人民网党史文章所述
    voice: officialLater
shi-yunfeng:
  - text: 全面审查文革中的错误
    cite: hyh-2024-blood-sacrifice-4
    date: 1974-10-26
    note: 散发的标语、传单，何与怀文章所引
    voice: scholar
yan-fengying:
  - text: 那些斗过严凤英，诬陷过严凤英，尤其是整过严凤英的人，没有一个敢承担责任
    by: 苏晓康
    cite: su-xiaokang-yan-fengying
    note: 《我们的“七仙女”》
    voice: witness
feng-youlan:
  - text: 我当时自以为是跟着毛主席、党中央走的，鼓励我的那些群众也是这样想的，至少也是这样说的
    cite: aisixiang-chen-xiaoping-liang-feng
    note: 反省自己在“批林批孔”中的表现，陈晓平文章所引
    voice: scholar
  - text: 不必急于求效，可以慢慢地改，总以采取老实态度为宜
    by: mao-zedong
    cite: aisixiang-chen-xiaoping-liang-feng
    note: 给冯友兰的回信，陈晓平文章所引
    voice: scholar
yang-rongguo:
  - text: 批判孔子的反动思想，对参加现实的阶级斗争，特别是对抓上层建筑意识形态领域的阶级斗争，是会有帮助的
    cite: rmrb-1973-08-07-yang-rongguo
    date: 1973-08-07
    note: 《孔子——顽固地维护奴隶制的思想家》
    voice: official1966
  - text: 杨荣国同志在‘批林批孔’期间，为迎合‘四人帮’所谓‘儒法斗争’的需要，不惜歪曲事实，散布了不少错误观点
    by: 中共广东省纪委
    cite: ifeng-2007-yang-rongguo
    date: 1982-06
    note: 结论，凤凰网文章所引
    voice: officialLater
tang-yijie:
  - text: 我该听谁的
    cite: thepaper-2014-tang-yijie
    note: 毛泽东去世、“四人帮”倒台后被隔离审查时，澎湃新闻所述
    voice: scholar
  - text: 当年因为是毛主席找的我们，我们都觉得特别骄傲
    cite: pku-2014-tang-yijie
    note: 说进入“梁效”
    voice: scholar
li-xifan:
  - text: 当时详细情况我不了解，无非是毛主席对文艺界权威统治不太满意，他的思想是希望年轻人快快成长，不要挡住他们的路
    cite: sdu-li-xifan
    note: 晚年谈往事
    voice: witness
li-qinglin:
  - text: 自失去自由，直至获释出狱生还家门，历时17个春秋，如此漫长的岁月，不堪回首
    cite: jwb-2007-li-qinglin
    note: 1994 年提前出狱后，《名人传记》所引
    voice: witness
mu-xin:
  - text: 既不许见面，也不许写信，音讯杳然，生死未卜，格外悬念
    cite: ipk-mu-xin-qincheng
    note: 回忆秦城监狱中与家人隔绝
    voice: witness
jin-jingmai:
  - text: 响鼓也用重锤敲，你写的这句话好啊
    by: 巴金
    cite: chinawriter-2014-jin-jingmai
    note: 对金敬迈说，冯乔文章所述
    voice: scholar
qian-haoliang:
  - text: 犯有严重政治错误，免于起诉
    by: 审查结论
    cite: thepaper-2020-qian-haoliang
    date: 1981
    note: 隔离审查五年后的定性，澎湃新闻所述
    voice: scholar
liu-qingtang:
  - text: 邓小平是右倾翻案的总代表
    cite: ws-1983-liu-qingtang-case
    date: 1975
    note: 在芭蕾舞剧团党委会上，1983 年起诉书所述
    voice: judicial1980
  - text: 要写表现走资派，而且是不肯改悔的走资派的作品
    cite: ws-1983-liu-qingtang-case
    note: 布置电影制片厂调整拍摄计划，1983 年起诉书所述
    voice: judicial1980
  - text: 被告人刘庆棠是江青反革命集团的重要骨干
    by: 北京市人民检察院分院
    cite: ws-1983-liu-qingtang-case
    date: 1983-11-02
    note: 起诉书
    voice: judicial1980

wang-jinxi:
  - text: 石油工人一声吼，地球也要抖三抖
    cite: rmrb-1972-01-27-wang-jinxi
    note: 王进喜的诗，1972 年新华社通讯所引
    voice: official1966
  - text: 打井要跟天斗，跟地斗，也要跟阶级敌人斗，跟错误思想斗
    cite: rmrb-1972-01-27-wang-jinxi
    note: 1972 年新华社通讯所引
    voice: official1966
  - text: 你们的王队长可真是个铁人啊
    by: 井场附近的老乡
    cite: rmrb-1972-01-27-wang-jinxi
    note: 1960 年大庆会战中，1972 年新华社通讯所述
    voice: official1966
shi-chuanxiang:
  - text: 时传祥是工贼
    by: jiang-qing
    cite: rmrb-1978-07-06-shi-chuanxiang
    note: 1978 年新华社平反报道所述
    voice: officialLater
  - text: 时传祥被资产阶级收买了
    by: chen-boda
    cite: rmrb-1978-07-06-shi-chuanxiang
    note: 1978 年新华社平反报道所述
    voice: officialLater
  - text: 难道文化大革命是要打倒一个掏粪工人
    by: zhou-enlai
    cite: rmrb-1978-07-06-shi-chuanxiang
    note: 听说时传祥受迫害时，1978 年新华社平反报道所述
    voice: officialLater
li-shunda:
  - text: 共产党员一定要讲真话
    cite: sxu-li-shunda
    note: 他坚持的信条，行龙《劳动模范李顺达的个人生活史》所述
    voice: scholar
wang-guofan:
  - text: 是我们整个国家的形象
    by: mao-zedong
    cite: thepaper-2024-wang-guofan
    date: 1955
    note: 为《中国农村的社会主义高潮》写的按语，说王国藩“穷棒子社”
    voice: officialLater
shi-laihe:
  - text: 党领导人民走社会主义道路，就是让大家都过上好日子，如果群众一直过不上好日子，那就是咱共产党人没本事
    cite: rmrb-2003-09-15-shi-laihe
    note: 2003 年《人民日报》通讯所述
    voice: officialLater
  - text: 谁离开生产出外串联不记工分、不发盘缠；贴大字报，集体一分钱不报销
    cite: rmrb-2003-09-15-shi-laihe
    note: 文革中在村里群众大会上宣布，2003 年《人民日报》通讯所述
    voice: officialLater
jin-xunhua:
  - text: 毛泽东思想时代的革命青年是不好侮的
    cite: rmrb-1969-12-06-jin-xunhua
    date: 1969-08-14
    note: 生前最后一页日记，1969 年《人民日报》所引
    voice: official1966
  - text: 金训华不愧是毛主席的红卫兵
    by: 《红旗》杂志评论员
    cite: ws-1969-jin-xunhua
    date: 1969-12-04
    note: 《革命青年的榜样》
    voice: official1966
men-he:
  - text: 无限忠于毛主席革命路线的好干部
    by: 中共中央、中央军委、中央文革
    cite: rmrb-1968-05-28-men-he
    date: 1968-05-27
    note: 追授的称号
    voice: official1966
