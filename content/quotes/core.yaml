    cite: ws-1980-indictment
    date: 1971-09-13
    note: 山海关机场请示林彪座机强行起飞怎么办时，1980 年起诉书所引
    voice: judicial1980
  - text: 被告人李作鹏有期徒刑十七年，剥夺政治权利五年
    by: 最高人民法院特别法庭
    cite: ws-1981-01-25-judgment
    date: 1981-01-25
    note: 判决书
    voice: judicial1980

qiu-huizuo:
  - text: 被告人邱会作有期徒刑十六年，剥夺政治权利五年
    by: 最高人民法院特别法庭
    cite: ws-1981-01-25-judgment
    date: 1981-01-25
    note: 判决书
    voice: judicial1980

lin-liguo:
  - text: 根据目前局势，要设想一个政变计划
    cite: ws-1972-lin-material-2
    date: 1971-03-18
    note: 在上海，1972 年中共中央下发的材料所引同案人供词
    voice: official1966
  - text: 主席一贯是这样，一会儿用这边力量，一会儿用那边力量，用这样的办法玩弄平衡
    cite: ws-1972-lin-material-2
    note: 同一材料所引
    voice: official1966

hua-guofeng:
  - text: 华国锋同志是伟大领袖毛主席亲自选定的接班人
    by: 《人民日报》
    cite: rmrb-1976-10-25-rally
    date: 1976-10-24
    note: 首都庆祝大会报道
    voice: official1966
  - text: 华国锋同志是由毛泽东同志在一九七六年“批邓”运动中提议担任党中央第一副主席兼国务院总理的
    by: 中共中央
    cite: ws-1981-resolution
    date: 1981-06-27
    note: 1981 年历史决议
    voice: official1981

chen-yonggui:
  - text: 我们要一齐高举毛泽东思想伟大红旗，互相学习，共同搞好无产阶级文化大革命，搞好社会主义建设！
    cite: rmrb-1967-05-02-may-day
    date: 1967-05-01
    note: 五一节天安门观礼时，《人民日报》报道
    voice: official1966

xu-jingxian:
  - text: 军队内有没有资产阶级、有没有走资派？
    cite: ws-1982-xu-jingxian-case
    note: 陪丁盛“视察”上海警备区基层单位时，1982 年判决书所引
    voice: judicial1980
  - text: 被告人徐景贤有期徒刑十八年，剥夺政治权利四年
    by: 上海市高级人民法院
    cite: ws-1982-xu-jingxian-case
    date: 1982
    note: 判决书
    voice: judicial1980

wang-xiuzhen:
  - text: 当前复辟势力很严重
    cite: ws-1982-08-21-wang-xiuzhen-case
    note: 向施尚英、薛干青部署时，1982 年判决书所引
    voice: judicial1980
  - text: 被告人王秀珍有期徒刑十七年，剥夺政治权利四年
    by: 判决书
    cite: ws-1982-08-21-wang-xiuzhen-case
    date: 1982-08-21
    voice: judicial1980

zhu-yongjia:
  - text: 被告人朱永嘉有期徒刑十四年，剥夺政治权利三年
    by: 上海市中级人民法院
    cite: ws-1982-zhu-yongjia-case
    date: 1982
    note: 判决书
    voice: judicial1980

liu-jieting:
  - text: 对立面不但要打隆昌、内江、自贡、宜宾，还要打成都
    cite: ws-1982-liu-zhang-case
    note: 1982 年判决书所引
    voice: judicial1980
  - text: 被告人刘结挺有期徒刑二十年，剥夺政治权利五年
    by: 四川省高级人民法院
    cite: ws-1982-liu-zhang-case
    date: 1982-03-24
    note: 判决书
    voice: judicial1980

zhang-xiting:
  - text: 我如果是隆昌县革命委员会的主任，我就有自卫的权利
    cite: ws-1982-liu-zhang-case
    note: 接刘结挺的话，1982 年判决书所引
    voice: judicial1980
  - text: 被告人张西挺有期徒刑十七年，剥夺政治权利五年
    by: 四川省高级人民法院
    cite: ws-1982-liu-zhang-case
    date: 1982-03-24
    note: 判决书
    voice: judicial1980

tian-han:
  - text: 以前我们反抗统治阶级时可以演反抗的戏，现在我们是统治阶级了，就不准演反抗的戏了，这是笑话！
    cite: ws-1971-03-02-tian-han-critique
    note: 1971 年批判文章所引
    voice: official1966

fu-lei:
  - text: 我们纵有千万罪行，却从来不曾有过变天思想
    cite: fu-lei-1966-09-02-note
    date: 1966-09-02
    note: 遗书
  - text: 只是含冤不白，无法洗刷的日子比坐牢还要难过
    cite: fu-lei-1966-09-02-note
    date: 1966-09-02
    note: 同上
  - text: 十一、现钞53.30元，作为我们火葬费
    cite: fu-lei-1966-09-02-note
    date: 1966-09-02
    note: 同上，交代后事的第十一条

chen-yinke:
  - text: 我认为研究学术，最主要的是要具有自由的意志和独立的精神
    cite: chen-yinke-1953-12-01-reply
    date: 1953-12-01
    note: 《对科学院的答复》，汪篯记录
  - text: 我要请的人，要带的徒弟都要有自由思想、独立精神
    cite: chen-yinke-1953-12-01-reply
    date: 1953-12-01
    note: 同上

qiao-guanhua:
  - text: 中国在任何时候、任何情况下，都不首先使用核武器
    cite: rmrb-1971-11-17-qiao-un
    date: 1971-11-15
    note: 第一次出席联合国大会的发言
  - text: 事实证明，我们中华民族完全有自立于世界民族之林的能力
    cite: rmrb-1971-11-17-qiao-un
    date: 1971-11-15
    note: 同一发言

jiang-tengjiao:
  - text: 被告人江腾蛟有期徒刑十八年，剥夺政治权利五年
    by: 最高人民法院特别法庭
    cite: ws-1981-01-25-judgment
    date: 1981-01-25
    note: 判决书
    voice: judicial1980

chi-qun:
  - text: 走资派还在走，不只邓小平一个人，要看到有这么一层人
    cite: ws-1982-chi-qun-case
    date: 1976-03
    note: 在清华大学和教育部，1982 年判决书所引
    voice: judicial1980
  - text: 东风来就装死装病，西风来就大搞翻案
    cite: ws-1982-chi-qun-case
    date: 1976-03
    note: 在教育部咒骂周荣鑫，同一判决书所引
    voice: judicial1980
  - text: 被告人迟群有期徒刑十八年，剥夺政治权利四年
    by: 判决书
    cite: ws-1982-chi-qun-case
    voice: judicial1980

sun-weishi:
  - text: 孙维世的脾气太直太爆了！不然她也不会死得那么惨！
    by: 邓颖超
    cite: dangshi-2012-sun-weishi
    note: 多年后提起孙维世时，2012 年党史文章所述
    voice: witness
  - text: 维世直到被害死，也没有屈服
    by: 任均（孙维世六姨）
    cite: dangshi-2012-sun-weishi
    note: 回忆，同一文章所引
    voice: witness

zhao-dan:
  - text: 文艺，是文艺家自己的事，如果党管文艺管得太具体，文艺就没有希望，就完蛋了
    cite: rmrb-1980-10-08-zhao-dan
    date: 1980-10-08
    note: 《管得太具体，文艺没希望》，病危时所写
  - text: 层层把关、审查审不出好作品，古往今来没有一个有生命力的好作品是审查出来的！
    cite: rmrb-1980-10-08-zhao-dan
    date: 1980-10-08
    note: 同上

lu-xianwen:
  - text: 当时我的思想上视粮食为珠宝，只要搞了粮食就能解决问题，发展到不讲政策，不讲方法，不择手段的严重程度
    cite: ws-1962-07-10-lu-xianwen-punishment
    date: 1962-05-26
    note: 检讨，1962 年处分决定所引

sun-yefang:
  - text: 政治要环绕生产，通过生产
    cite: ws-1970-02-24-sun-yefang-critique
    note: 1970 年批判文章所引
    voice: official1966

hu-yaobang:
  - text: 现在已经13年了，这样的事情不要声张了，处理完了就算了，慢慢让它平息下去。对没有处理的要处理完，主要是把受害者安排好
    cite: yhcqw-xie-chengnian-daoxian
    date: 1980
    note: 听零陵地委汇报道县杀人事件处理情况时，《炎黄春秋》网文章所引
    voice: witness

zhao-ziyang:
  - text: 谁把你们出卖了？只有文化大革命才有人被出卖。
    cite: ws-1989-06-30-chen-xitong-report
    note: 1989 年 6 月陈希同报告所引
    voice: officialLater

wan-li:
  - text: 万里同志是中国农村改革的先锋
    by: 《万里同志生平》
    cite: people-2015-07-23-wan-li
    date: 2015-07-22
    voice: officialLater

fang-lizhi:
  - text: 希望企业家作为中国的新生力量，同先进的知识分子结合起来，为争民主而斗争
    cite: ws-1989-06-30-chen-xitong-report
    note: 1989 年 6 月陈希同报告所引
    voice: officialLater

liu-xiaobo:
  - text: 被告人刘晓波还伙同他人起草、炮制了《零八宪章》，提出“取消一党垄断执政特权”、“在民主宪政的架构下建立中华联邦共和国”等多项主张，试图煽动颠覆现政权
    by: 判决书
    cite: ws-2009-liu-xiaobo-judgment
    date: 2009-12-25
    voice: judicial1980

wu-de:
  - text: 我们要认清这一政治事件的反动性，戳穿他们的阴谋诡计，提高革命警惕，不要上当
    cite: rmrb-1976-04-08-wude
    date: 1976-04-05
    note: 在天安门广场的广播讲话

zeng-siyu:
  - text: 曾思玉同志是好人犯错误，这是两类不同性质的矛盾，应严格加以区别
    by: 中共中央
    cite: ws-1974-05-21-hubei-instructions
    date: 1974-05-21
    note: 关于湖北问题的指示
    voice: official1966

ding-sheng:
  - text: 我最不放心的是六四五三部队
    cite: ws-1980-indictment
    note: 在上海同马天水、徐景贤、王秀珍密谈，1980 年起诉书所引
    voice: judicial1980

chen-xitong:
  - text: 在这种情况下，我们的党和政府如果还不采取坚决果断的措施，那么，就会再度严重贻误时机，进一步造成不可挽回的巨大损失，这是广大人民群众绝对不会允许的
    cite: ws-1989-06-30-chen-xitong-report
    date: 1989-06-30
    note: 关于制止动乱和平息反革命暴乱的情况报告

guo-moruo:
  - text: 他是继鲁迅之后，在中国共产党领导下，在毛泽东思想指引下，我国文化战线上又一面光辉的旗帜
    by: deng-xiaoping
    cite: rmrb-1978-06-19-guo-moruo
    date: 1978-06-18
    note: 追悼大会悼词
    voice: officialLater
