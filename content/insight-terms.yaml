# Word lists for the text-based insight pages (research/milestones.md, MI). Same fields as press-terms.yaml:
# terms are counted literally; occurrences inside an `except` string are not counted. Terms of one row must not
# contain each other (毛泽东 and 毛泽东同志 would count the same words twice).

# B 权威来源：官方文本（中央文件、社论、讲话、新闻）里援引谁。指名的是人，不是主义：毛泽东思想单列一行。
# 已建档的人用人物 id，人物卡片据此显示此人作为权威被援引的情况。
authorities:
  - id: marx-engels
    name: 马克思、恩格斯
    terms: [马克思, 恩格斯]
    except: [马克思主义, 马克思列宁主义]
  - id: lenin
    name: 列宁
    terms: [列宁]
    except: [列宁主义, 列宁格勒]
  - id: stalin
    name: 斯大林
    terms: [斯大林]
    except: [斯大林格勒, 斯大林主义]
  - id: mao-zedong
    name: 毛泽东（本人）
    terms: [毛主席, 毛泽东]
    except: [毛泽东思想, 毛泽东选集, 毛泽东著作]
  - id: mao-thought
    name: 毛泽东思想
    terms: [毛泽东思想]
  - id: lin-biao
    name: 林彪（作为权威）
    terms: [林副主席, 林彪同志]
  - id: hua
    name: 华国锋（作为权威）
    terms: [华主席, 华国锋同志]
  - id: deng-xiaoping
    name: 邓小平（作为权威）
    terms: [邓小平同志]
  - id: lu-xun
    name: 鲁迅
    terms: [鲁迅]

# E 检讨文体：本站收录的检讨、检查、认罪文本，逐篇统计下列用语。
selfcrit:
  texts:
    - ws-1960-08-26-shangcheng-self-criticism
    - ws-1966-10-liu-self-criticism
    - ccrd-1967-01-22-jiang-weiqing
    - ws-1967-07-09-liu-jiangong-review
    - ccrd-1967-12-07-pan-fusheng
  phrases:
    - id: i
      name: 我（单数）
      terms: [我]
      except: [我们, 我国, 我党, 我省, 我县, 我区, 我市, 我军]
    - id: we
      name: 我们
      terms: [我们]
    - id: error
      name: 错误
      terms: [错误]
    - id: crime
      name: 罪
      terms: [罪]
    - id: deep
      name: 深刻
      terms: [深刻]
    - id: thorough
      name: 彻底
      terms: [彻底]
    - id: let-down
      name: 辜负
      terms: [辜负]
    - id: mao
      name: 毛主席 / 毛泽东
      terms: [毛主席, 毛泽东]
      except: [毛泽东思想]
    - id: mao-thought
      name: 毛泽东思想
      terms: [毛泽东思想]
    - id: reactionary-line
      name: 资产阶级反动路线
      terms: [资产阶级反动路线]
    - id: class-struggle
      name: 阶级斗争
      terms: [阶级斗争]
    - id: masses
      name: 群众
      terms: [群众]
    - id: reform
      name: 改正 / 改造
      terms: [改正, 改造]
