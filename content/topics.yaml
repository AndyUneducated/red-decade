# 横向专题（M7）。专题只写框架文字；事件和研究结论用各自的 topics 字段加入专题。
- id: ethnic-religion
  name: 民族与宗教
  from: 1949
  to: 1990
  summary: 西藏、新疆、内蒙古和云南回族地区在这四十年里的制度安排、运动冲击与事后处理，以及宗教场所与信众的处境。这里把散在各时期的事件放在一起，看中央对民族地区的政策在“统一部署”和“特殊照顾”之间怎样摆动。
  sections:
    - h: 制度框架
      text: 1952 年的《民族区域自治实施纲要》和民族民主联合政府决定，1984 年的《民族区域自治法》，是这个专题的两端。中间的西藏自治区（1965）和各自治区革委会（1967–1968）都在这个框架内设立。
      cites: [ws-1952-02-22-national-coalition, ws-1965-08-25-tibet-region]
    - h: 文革中的边疆
      text: 1966 年 9 月中央电报要求伊犁、塔城等边境地区不采取群众直接“罢官”的办法，理由是“不使苏修有机可乘”；但内蒙古“内人党”案和“新疆叛徒集团”案说明，边疆并没有因此免于清查。
      cites: [ws-1967-border-areas, ws-1968-04-26-neirendang-report]
    - h: 宗教
      text: 1982 年中央 19 号文件是库内唯一系统回顾宗教政策的文件。它说文革中“根本取消了党对宗教的工作”，各种宗教的活动场所“解放初总共约有十万多所”，1982 年连同简易活动点“约有三万多所”；又说强行禁止的结果，“却使宗教活动在秘密和分散的状态下得到某些发展”。
      cites: [ws-1982-03-31-religion-document]
  gaps:
    - 云南沙甸事件（1975）尚无可核对的原始文件入库。
    - 新疆 1980 年代的事件（如 1981 年喀什事件）没有原始材料。
    - 寺庙、清真寺、教堂在 1966 年“破四旧”中被毁的具体数字，库内只有 1982 年文件的笼统表述。
  cites: [ws-1982-03-31-religion-document]

- id: hk-macau-taiwan
  name: 港澳台
  from: 1950
  to: 1990
  summary: 香港、澳门和台湾在这四十年里既是对外关系问题，也是内政叙事的一部分。文革外溢到香港和澳门，台湾则以“中华文化复兴运动”回应大陆的文革；1979 年以后，三地的问题转入“一国两制”和统一的框架。
  sections:
    - h: 文革的外溢
      text: 1967 年香港的“反英抗暴”与沙头角枪战、北京火烧英国代办处，是文革波及港英的一组事件。
      cites: [ws-1967-08-hk-british, rmrb-1967-07-10-hk-border]
    - h: 两岸对照
      text: 1958 年炮击金门时的《告台湾同胞书》与 1979 年元旦的《告台湾同胞书》用同一题目写出了不同的政策，却共用一个前提：国民党当局自己也坚持“一个中国”。台湾一侧，库内有蒋介石 1954 年号召“配合国军反攻”的国庆文告和 1974 年给中华文化复兴运动的致词，后者与大陆同年的批孔正好相反。
      cites: [ws-1958-10-06-taiwan-1, ws-1979-01-01-taiwan-message, ws-1954-10-10-chiang-national-day, ws-1974-chiang-culture-renaissance]
    - h: 一国两制
      text: 1984 年中英联合声明和 1987 年中葡联合声明用几乎相同的条文安排香港、澳门的回归，“五十年不变”。两份文本的一处差别是澳门文本不提“资本主义”。
      cites: [ws-1984-09-26-hongkong-declaration, ws-1987-04-13-macau-declaration]
  gaps:
    - 1966 年澳门“一二·三”事件的《人民日报》报道已找到版面，尚未入库。
    - 中华文化复兴运动 1966–1967 年发起时的文件未入库。
    - 台湾方面对大陆文革的官方回应，目前只有蒋介石的两篇文告。
  cites: [ws-1979-01-01-taiwan-message]

- id: global
  name: 全球
  from: 1963
  to: 1979
  summary: 中苏论战之后，中国把自己定位为世界革命的中心，“人民战争”和毛泽东思想被当作可输出的经验。这里收集文革在国外的回响、中国官方对外国运动的报道，以及外国政府对文革的判断如何变化。
  sections:
    - h: 输出“人民战争”
      text: 1965 年林彪的《人民战争胜利万岁》把“以农村包围城市”提升为世界范围的战略，称掌握人民战争的武器已是许多国家人民的“迫切需要”。
      cites: [ws-1965-09-03-people-war]
    - h: 外国怎样看文革
      text: 库内的外国判断主要来自美国政府档案。1974 年 11 月美国驻北京联络处的报告转述毛泽东说八年文革“已经够了”，判断中国此时承受不起另一场文革，同时注意到邓小平已代行总理职责；1975 年的谈话记录里，毛泽东当着邓小平谈身后之事。
      cites: [frus-v18-d91, frus-v18-d124]
    - h: 印度支那
      text: 中国对柬埔寨战争的报道把西哈努克和民族统一阵线放在台前，用“农村包围城市”和“小国能够打败大国”来讲述这场战争；同一时期对缅甸，则公开支持缅共的武装斗争。
      cites: [ws-cambodia-victorious-year, rmrb-1973-04-13-sihanouk-banquet, rmrb-1967-07-04-burma-protest]
  gaps:
    - 秘鲁“光辉道路”、印度纳萨尔派、法国毛派组织的原始文献尚未入库。
    - 1975 年金边解放、1977 年波尔布特访华的《人民日报》报道已找到版面，尚未入库。
    - 1965 年印尼“九·三〇”事件及其后的排华与中印尼断交，库内没有原始材料。
  cites: [ws-1965-09-03-people-war]
