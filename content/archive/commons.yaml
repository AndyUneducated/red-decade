cm-3232b70271:
  kind: photo
  title: Real Story of Red China Land Reform
  date: "1952"
  dateFrom: metadata
  file: Real Story of Red China Land Reform - NARA - 5730064.jpg
  url: https://commons.wikimedia.org/wiki/File:Real_Story_of_Red_China_Land_Reform_-_NARA_-_5730064.jpg
  author: Unknown author Unknown author or not provided
  license: Public domain
  description: ​图中文字，“中共土改真相”，“大陸人民厄運”，“這裏印出的八張照片，是由一個逃亡的共幹從大陸偷帶到香港的。照片所拍攝的事實發生在廣東佛岡縣，時間是民國四十一年七月廿三日。一名善良的農民被共斡押解到羣衆大會上受公審。他們所有的田，都沒有超過三畝（約合五分之一甲）。但照毛澤東在卅年前手訂的隋級劃分法，他們都已算做剝削人民的「惡霸地主」。他們被鬥爭，被判重刑。其中十一名當場被槍決。他們的財產全被沒收，分配給上千的贫農。其中最邀寵的，都拿不到二分田。土地的所有愈分散，中共的統治愈容易，這就是中共土改的真相。”
