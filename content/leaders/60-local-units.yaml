# Heads of local bodies, communes, mass organisations and grassroots units (content/orgs/50-mass.yaml,
# 60-local.yaml, 70-units.yaml and the units in 00-central.yaml), plus the early and Cultural Revolution
# gaps in the university lists. Compiled 2026-10-11 from school and newspaper histories, local
# histories and memoirs found on the web (校史“历任领导”页、地方志摘录、当事人回忆); none is checked
# against a corpus source, so all count as 待核 except where `cite` is given.
# Where only some dates in office are known, the band covers those dates and the note says 止点待核,
# rather than guessing an end.

# ── 基层典型 ──
chayashan-commune:
  - { name: 陈丙寅, title: 党委书记, from: 1958-04, to: 1958-11, note: 原遂平县委农工部部长；1958 年 4 月任嵖岈山大社党委书记，7 月改称卫星人民公社后续任；11 月 13 日毛泽东在遂平车站接见时仍在任，止点待核 }
  - { name: 钟青德, title: 社长, from: 1958-04, to: 1958, note: 原韩楼高级社社长、全国劳动模范；止点待核 }

