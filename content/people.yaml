  tier: 2
  role1966: 三线建设委员会副主任（成都）
  bio: 平江起义的领导者，长期任红三军团、八路军和西北野战军的主要指挥员，抗美援朝中任志愿军司令员，1954–1959 年任国防部长，1955 年授元帅衔。1959 年庐山会议上因给毛泽东写信批评“大跃进”被定为“右倾机会主义反党集团”头子，罢官。毛泽东 1965 年 12 月 21 日：“嘉靖皇帝罢了海瑞的官，一九五九年我们罢了彭德怀的官。彭德怀也是'海瑞'。”这把《海瑞罢官》的批判直接接到庐山会议。1966 年底被红卫兵从成都揪回北京，长期关押，1974 年死于狱中，1978 年平反。
  life:
    - h: 家世与旧军队
      from: 1898
      to: 1928
      text: |
        1898 年 10 月 24 日生于湖南湘潭乌石寨一个贫苦农民家庭，原名彭得华。幼年丧母，讨过饭，当过煤窑童工、湘阴西林围堤工。1916 年入湘军当兵，因作战勇敢升至排长、连长。1922 年考入湖南陆军讲武堂，次年回原部队，1926 年随部参加北伐，任国民革命军第八军营长、团长。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 平江起义与红三军团
      from: 1928
      to: 1937
      text: |
        1928 年 4 月加入中国共产党，7 月 22 日与滕代远、黄公略领导平江起义，组成红五军，任军长，同年底率部上井冈山与红四军会合。1930 年任红三军团总指挥，7 月一度攻占长沙。参与指挥中央苏区历次反“围剿”。长征中率三军团转战，遵义会议上支持毛泽东。1935 年到陕北后任陕甘支队司令员、西北革命军事委员会副主席，1936 年任红军前敌总指挥、西方野战军司令员。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 抗战与解放战争
      from: 1937
      to: 1950
      text: |
        1937 年 8 月任八路军副总指挥（后称副总司令），协助朱德指挥华北敌后作战，1940 年 8–12 月主持“百团大战”。1945 年七大当选中央委员、政治局委员。1947 年 3 月起以西北野战军司令员兼政委指挥陕北作战，以少胜多，保卫党中央转战陕北；1949 年率第一野战军进军西北。1945 年和 1959 年两次在党内受到对其华北工作的批评，“百团大战”后来也被列为罪名之一。
      cites: [ws-1959-08-16-peng-resolution]
      verify: true
    - h: 抗美援朝与国防部长
      from: 1950
      to: 1959
      text: |
        1950 年 10 月任中国人民志愿军司令员兼政治委员，率部入朝作战，1953 年 7 月代表中朝方面签署停战协定。1954 年任国务院副总理兼国防部长、中央军委副主席，主持军队正规化建设，1955 年授元帅衔。
      verify: true
      cites: [ccp-figures-bios]
    - h: 庐山会议与罢官
      from: 1959
      to: 1965
      text: |
        1959 年 7 月 14 日在庐山会议上给毛泽东写信，批评“大跃进”中的“浮夸风气”和“小资产阶级的狂热性”。毛泽东把信印发与会者，随即发起批判。8 月 16 日八届八中全会决议说他“带着‘入股’的思想参加了党”，把他与黄克诚、张闻天、周小舟定为“右倾机会主义反党集团”，调离国防工作，保留政治局委员职务“以观后效”。此后住北京西郊吴家花园，读书种地。1962 年写八万字长信（“八万言书”）申诉，被认为是“翻案”。1965 年 9 月毛泽东约谈后，11 月赴成都任西南三线建设委员会第三副主任。
      cites: [ws-1959-08-16-peng-resolution, ws-1959-08-eighth-plenum, ws-1981-resolution]
      verify: true
    - h: 文化大革命
      from: 1966
      to: 1974
      text: |
        1965 年 12 月毛泽东把《海瑞罢官》与“罢了彭德怀的官”联系起来，此后对吴晗的批判直接牵连到他。1966 年 12 月被北京红卫兵从成都揪回北京，此后被批斗、关押，专案组审讯百余次，肋骨被打断。1967 年 8 月《红旗》社论《从彭德怀的失败到中国赫鲁晓夫的破产》把他与刘少奇并列批判。1973 年确诊直肠癌，1974 年 11 月 29 日在关押中死于北京三〇一医院，以“王川”的化名火化。1980 年起诉书把他列为被林彪、江青集团诬陷迫害的领导人之一。
      cites: [ws-1966-05-16-notice-attachment@1965-12-21, ws-1967-08-16-peng-dehuai, ws-1980-indictment]
      verify: true
    - h: 平反与身后
      from: 1978
      text: |
        1978 年 12 月十一届三中全会纠正了对他的错误结论，12 月 24 日举行追悼大会，邓小平致悼词，骨灰由成都移入八宝山。1981 年决议称“庐山会议后期，毛泽东同志错误地发动了对彭德怀同志的批判”，八届八中全会决议“是完全错误的”。狱中写成的自述材料后整理出版为《彭德怀自述》。
      cites: [ws-1978-12-third-plenum, ws-1981-resolution]
      verify: true
    - h: 家庭
      text: |
        1938 年与浦安修在延安结婚，无子女，抚养多名侄儿女。浦安修在 1959 年后与他分居，文革中受牵连。
      verify: true
      cites: [ccp-figures-bios]
