- id: he-long
  name: 贺龙
  pinyin: Hè Lóng
  aka:
    - { kind: original, name: 贺文常 }
    - { kind: courtesy, name: 云卿 }
  gender: m
  ethnicity: 汉族
  birthplace: 湖南桑植洪家关
  origin: 湖南桑植
  classOrigin: 贫苦农民
  classNote: 1982 年平反决定称“他出身贫苦”。
  born: 1896-03-22
  died: 1969-06-09
  death: 被迫害致死
  deathKind: persecuted
  deathPlace: 北京
  party: 中国共产党
  joinedParty: 1927-08
  joinedRevolution: 1914
  positions:
    - { title: 国民革命军第二十军军长、南昌起义总指挥, orgName: 国民革命军第二十军, from: 1927-06, to: 1927-08, cite: ws-1982-he-long-rehab }
