  tier: 1
  role1966: 中共中央总书记、国务院副总理
  bio: 中共早期党员，百色起义领导者，抗战和解放战争中与刘伯承搭档指挥晋冀鲁豫、中原部队，淮海战役总前委书记。1956–1966 年任总书记，与刘少奇同处“一线”。文革中被打倒、下放江西，1973 年复出，1975 年主持整顿，1976 年再次被撤销一切职务；1977 年复出后成为“第二代中央领导集体的核心”，主导改革开放，直到 1997 年去世。1966 年 4 月主持书记处会议批判彭真，10 月作检讨。
  life:
    - h: 家世与留法
      from: 1904
      to: 1927
      text: |
        1904 年 8 月 22 日生于四川广安协兴乡牌坊村，原名邓先圣，入私塾时改名邓希贤。1919 年入重庆留法勤工俭学预备学校，1920 年赴法国，在工厂做工。1922 年加入旅欧中国少年共产党，1924 年转为中共党员，在周恩来领导下负责油印刊物《赤光》，被称为“油印博士”。1926 年初经苏联入莫斯科中山大学学习。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 从西北军到中央苏区与长征
      from: 1927
      to: 1937
      text: |
        1927 年春回国，到冯玉祥国民军联军所属中山军事学校负责政治工作，后到武汉，参加八七会议，此时改名邓小平。1927 年底至 1929 年任中共中央秘书长。1929 年受中央派遣到广西，化名邓斌，12 月 11 日发动百色起义，创建红七军和右江根据地，次年 2 月发动龙州起义，创建红八军。

        1931 年到中央苏区，任瑞金、会昌中心县委书记。1933 年因拥护毛泽东的主张被“左”倾领导者批判、撤职，与毛泽覃、谢唯俊、古柏一起被称为“邓、毛、谢、古”。此后在红军总政治部编《红星》报。长征途中任中央秘书长，出席遵义会议。
      cites: [ws-1997-02-19-deng-message]
      verify: true
    - h: 刘邓大军
      from: 1937
      to: 1949
      text: |
        1938 年起任八路军一二九师政治委员，与师长刘伯承一起创建晋冀豫等根据地，后任北方局太行分局书记、代理北方局书记。1945 年七大当选中央委员。解放战争中任晋冀鲁豫军区政委、中原局书记，1947 年夏与刘伯承率部强渡黄河，千里跃进大别山。1948 年 11 月任总前委书记，与刘伯承、陈毅、粟裕、谭震林指挥淮海战役，1949 年指挥渡江战役，随后进军西南。
      cites: [ws-1997-02-19-deng-message]
    - h: 西南与总书记十年
      from: 1949
      to: 1966
      text: |
        建国后任西南局第一书记，1952 年调中央任政务院副总理，1954 年任中共中央秘书长、组织部部长，1955 年增选为政治局委员。1956 年八大作关于修改党章的报告，八届一中全会当选政治局常委、总书记，主持中央书记处工作十年。1957 年反右派斗争中担任中央领导小组组长；1960–1963 年多次率团赴莫斯科与苏共论战。三年困难时期支持调整，1962 年 7 月谈恢复农业生产时引用“不管黄猫黑猫，只要捉住老鼠就是好猫”。
      cites: [ws-1997-02-19-deng-message, ws-1981-resolution]
      verify: true
    - h: 文化大革命
      from: 1966
      to: 1976
      text: |
        1966 年 4 月主持书记处会议批判彭真。6–7 月与刘少奇主持派工作组，八届十一中全会后被定为“资产阶级司令部”的二号人物，10 月 23 日在中央工作会议上作检讨。1980 年起诉书：“一九六六年十二月六日，林彪诬陷邓小平是‘黑帮分子’、‘反党分子’。”1969 年 10 月被下放江西新建县拖拉机修造厂劳动，长子邓朴方 1968 年在北大受迫害致残。

        1972 年致信毛泽东，1973 年 3 月恢复国务院副总理职务。1975 年 1 月任中共中央副主席、军委副主席、总参谋长，在周恩来病重时主持党政军日常工作，开展全面整顿。1976 年 4 月天安门事件后被定为“反革命政治事件的总后台”，4 月 7 日被撤销一切职务。
      cites: [ws-1966-05-16-notice-attachment@1966-04-09, ws-1980-indictment, ws-1981-01-25-judgment, ws-1981-resolution, ws-1997-02-19-deng-message]
      verify: true
    - h: 复出与改革开放
      from: 1977
      to: 1992
      text: |
        1977 年 7 月十届三中全会恢复其职务。他反对“两个凡是”，支持真理标准讨论；1978 年 12 月十一届三中全会后成为“第二代中央领导集体的核心”。主持平反冤假错案，1980–1981 年推动审判林彪、江青集团和起草《关于建国以来党的若干历史问题的决议》，主张对毛泽东“功绩是第一位的，错误是第二位的”。1979 年访美，同年对越南作战。

        提出“一国两制”，签订中英（1984）、中葡（1987）联合声明。1987 年十三大退出中央委员会，留任军委主席；1989 年支持对北京学生运动实行戒严，11 月十三届五中全会辞去军委主席。1992 年初视察南方发表谈话。
      cites: [ws-1997-02-19-deng-message]
      verify: true
    - h: 去世与身后
      from: 1997
      text: |
        1997 年 2 月 19 日二十一时零八分因帕金森病晚期并发肺部感染在北京逝世，享年九十三岁。告全党书称他为“我国社会主义改革开放和现代化建设的总设计师”，提到“八十年代末、九十年代初国内国际发生政治风波”时他坚决支持党和政府。2 月 25 日追悼大会由江泽民致悼词，3 月 2 日骨灰撒入大海。“邓小平理论”同年写入十五大党章。
      cites: [ws-1997-02-19-deng-message]
      verify: true
    - h: 家庭
      text: |
        第一任妻子张锡瑗 1930 年难产去世；第二任妻子金维映 1933 年离婚。1939 年在延安与卓琳结婚，生邓林、邓朴方、邓楠、邓榕（毛毛）、邓质方。邓榕著《我的父亲邓小平》《我的父亲邓小平：“文革”岁月》，是研究其文革经历的主要亲属叙述。
      verify: true
      cites: [ccp-figures-bios]
