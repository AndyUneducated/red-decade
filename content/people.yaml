  origin: 北京
  classOrigin: 资本家
  classNote: 1970 年死刑判决书记载“家庭出身资本家，本人成份学生”，并写明“父母系右派分子，其父是反革命分子”；1979 年无罪判决书照录出身、成份，删去了关于父母的一句。
  born: 1942-05-01
  died: 1970-03-05
  deathKind: executed
  deathPlace: 北京
  positions:
    - { title: 北京人民机器厂徒工, orgName: 北京人民机器厂, from: 1965, to: 1968-01, cite: ws-1970-yu-luoke-death-sentence }
  rehab:
    - { date: 1979, text: 北京市中级人民法院再审：原判“从认定的事实和适用法律上都是错误的”，宣告遇罗克无罪, cite: ws-1979-yu-luoke-acquittal }
  tier: 2
  role1966: 北京人民机器厂学徒工
  bio: 北京人，父母都是右派，因家庭出身两次考大学未被录取，做过农场工人、代课教师，1965 年起在北京人民机器厂当学徒工。1967 年 1 月 18 日以“北京家庭出身问题研究小组”名义在《中学文革报》发表《出身论》，反驳“老子英雄儿好汉，老子反动儿混蛋”的血统论。1968 年 1 月被捕，1970 年 3 月 5 日以“现行反革命”罪被判处死刑，立即执行，年二十七岁。1979 年北京市中级人民法院再审，宣告无罪。
  life:
    - h: 出身与求学
      from: 1942
      to: 1965
      text: |
        1942 年 5 月 1 日生于北京。父亲遇崇基是水利工程师，母亲王秋琳办过工厂，1957 年两人都被划为右派（待核）。1960 年他从北京第六十五中学毕业，因家庭出身两次报考大学都未被录取，先后在农场劳动、当代课教师，业余写作（待核）。据 1970 年判决书，他“家庭出身资本家，本人成份学生”。
      verify: true
      cites: [ws-1970-yu-luoke-death-sentence]
    - h: 与姚文元商榷
      from: 1965
      to: 1966-12
      text: |
        1965 年起在北京人民机器厂当学徒工。1966 年 2 月 13 日在上海《文汇报》发表《和机械唯物论进行斗争——与姚文元同志商榷》，对姚文元批判《海瑞罢官》的方法提出异议（待核）。
      verify: true
    - h: 《出身论》
      from: 1967-01
      to: 1967-04
      text: |
        1966 年夏秋，“老子英雄儿好汉，老子反动儿混蛋”的对联在北京中学流行，1966 年 10 月陈伯达讲话和 1967 年 1 月 1 日两报一刊社论都批评它是“剥削阶级的反动的血统论”。1967 年 1 月 18 日，遇罗克以“北京家庭出身问题研究小组”的名义，在他和弟弟遇罗文等人办的《中学文革报》创刊号上发表《出身论》，从这副对联谈起：“辩论这幅对联的过程，就是对出身不好的青年侮辱的过程。”文章写道，在文革初期“出身不好不仅低人一等，甚至被剥夺了背叛自己的家庭、保卫党中央、保卫毛主席、参加红卫兵的权利”，“有多少无辜青年，死于非命，溺死于唯出身论的深渊之中”。报纸在街头被争抢，此后他又写了多篇续文。1967 年 4 月中央文革小组成员戚本禹宣布《出身论》是“大毒草”，《中学文革报》停刊（待核）。
      verify: true
      cites: [ws-1967-yu-origin-theory, web-1966-10-16-chen-speech, ws-1967-01-01-to-the-end]
    - h: 被捕与处决
      from: 1968-01
      to: 1970-03-05
      text: |
        1968 年 1 月被捕（待核）。死刑判决书说他“自1963年以来，散布大量反动言论，书写数万字的反动信件、诗词和日记”，“在无产阶级文化大革命中又书写反动文章十余篇，印发全国各地，大造反革命舆论”，还“网罗本市和外地的反、坏分子十余人，策划组织反革命集团，并扬言进行阴谋暗杀活动”；“遇犯在押期间，反革命气焰仍很嚣张”。判决“经中国人民解放军北京市公、法军事管制委员会和最高人民法院批准”，“判处现行反革命分子遇罗克死刑，立即执行”。1970 年 3 月 5 日在北京工人体育场的公判大会后被枪决（待核）。
      verify: true
      cites: [ws-1970-yu-luoke-death-sentence]
    - h: 宣告无罪
      from: 1978-11
      to: 1979
      text: |
        据 1979 年北京市中级人民法院判决书，1978 年 11 月 1 日起他的父亲遇崇基多次申诉；再审查明，“原判以遇罗克犯反革命罪，判处死刑，从认定的事实和适用法律上都是错误的”，判决撤销北京市公检法军管会“（70）刑字第30号判决书”，“宣告遇罗克无罪”。无罪判决书称他“1968年1月以‘现行反革命’罪”被判处死刑，与原判的案号“（70）”不一致，1968 年 1 月应是被捕时间。1980 年 7 月《光明日报》发表长篇通讯《划破夜幕的陨星》（待核）。
      verify: true
      cites: [ws-1979-yu-luoke-acquittal]
  assess:
