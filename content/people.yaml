    - { voice: judicial1980, text: 陈伯达控制宣传舆论工具，进行反革命宣传煽动，一九六六年提出“横扫一切牛鬼蛇神”等口号, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: scholar, text: 陈伯达被捕，不在“1976年9月”，而是1970年10月18日，或者严格地说，在1970年10月18日被拘押，直至1976年9月才补办了逮捕手续（叶永烈《陈伯达传》，纠正《简明不列颠百科全书》条目）, cite: rmwz-2012-chen-boda, quote: true }
