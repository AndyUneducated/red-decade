  life:
    - h: 早年与红军保卫工作
      from: 1906
      to: 1937
      text: |
        1906 年 5 月 31 日生于四川南充。1926 年考入武汉中央军事政治学校（黄埔军校武汉分校），1928 年入党，随后到闽西参加红军。历任红四军纵队政委、红十二军政委，1932 年起任红一军团政治保卫局局长，参加长征。到陕北后任中国人民抗日红军大学教育长。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 抗战与解放战争
      from: 1937
      to: 1949
      text: |
        抗战中任抗日军政大学副校长、八路军野战政治部主任、第十八集团军野战政治部主任。七大后任晋察冀军区第二政委，解放战争中任华北军区第三兵团政委，参加平津战役。
      verify: true
      cites: [ccp-figures-bios]
    - h: 公安部长与总参谋长
      from: 1949
      to: 1965
      text: |
        1949 年 10 月任首任公安部长，兼公安军司令员、政委，主持镇压反革命、肃反等运动。1955 年授大将衔。1959 年庐山会议后，接替黄克诚任总参谋长、国务院副总理，任军委秘书长，在林彪长期休养期间主持军委日常工作。1962 年任中央书记处书记。1964 年主持全军“大比武”，据 1966 年报告，这被批判为“单纯军事观点”，与林彪“突出政治”的方针冲突。
      verify: true
      cites: [ws-1966-04-luo-report]
    - h: 倒台与关押
      from: 1965
      to: 1975
      text: |
        1965 年 12 月 8–15 日中央在上海开会，对他“进行了背靠背的斗争”。1966 年 3 月 4 日至 4 月 8 日中央召开讨论他问题的小组会议，3 月 18 日他跳楼自杀，摔伤双腿，会议“只好又转为背靠背的斗争”。4 月 30 日中央工作小组报告列其罪名首条为“敌视和反对毛泽东思想，诽谤和攻击毛泽东同志”，5 月 16 日经中央批转（中发〔66〕268 号）。此后被定为“彭罗陆杨反党集团”主要成员，又被指为“以罗瑞卿为首的地下黑公安部反革命集团”头子。

        1966 年底至 1967 年多次被拉到大会批斗，坐在箩筐里被抬上会场。此后长期关押，1973 年获释，1975 年毛泽东表示对他的审查结论“搞错了”（待核），恢复组织生活。
      cites: [ws-1966-04-luo-report, ws-1980-05-20-luo-rehab]
      verify: true
    - h: 复出与去世
      from: 1977
      text: |
        1977 年 8 月十一届一中全会后任中央军委秘书长，主持军委日常工作，支持真理标准讨论，主持《解放军报》发表《马克思主义的一个最基本的原则》。1978 年 8 月赴联邦德国海德堡治疗伤腿，8 月 3 日术后突发心肌梗塞去世。追悼大会由邓小平代表中央致悼词，为他平反。1980 年 5 月 20 日中央撤销 1966 年的批转文件。
      cites: [ws-1980-05-20-luo-rehab]
      verify: true
  assess:
    - { voice: official1966, text: 敌视和反对毛泽东思想，诽谤和攻击毛泽东同志（1966 年中央工作小组报告）, cite: ws-1966-04-luo-report, quote: true }
    - { voice: officialLater, text: 林彪、“四人帮”为了篡党窃国，采取阴谋手段，打击迫害老一辈的无产阶级革命家, cite: ws-1980-05-20-luo-rehab, quote: true }
    - { voice: scholar, text: 研究者多认为罗与林彪的冲突既有军队训练方针（“大比武”与“突出政治”）之争，也有林彪对罗主持军委日常工作、与贺龙等关系密切的戒心；毛泽东在 1965 年接受林彪方面的揭发，也与即将发动的文革需要军队稳固有关。, cite: macfarquhar-schoenhals }
