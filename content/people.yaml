  rank: { rank: 中华人民共和国元帅, date: 1955-09-27 }
  afterlife:
    - { date: 1972-01-10, text: 毛泽东临时决定出席追悼会，这是他最后一次出席追悼会；周恩来致悼词, verify: true }
  bio: 留法勤工俭学生出身的元帅、诗人。井冈山时期红四军的主要领导人之一，主力长征后留在南方坚持三年游击战争，皖南事变后任新四军代军长，解放战争中指挥华东野战军，建国后任上海市长、国务院副总理兼外交部长。1967 年 2 月在怀仁堂会议上与谭震林等抵制中央文革，被称为“二月逆流”，此后受到批判，外交部被冲击。1969 年疏散到石家庄，1972 年初病逝。
  life:
    - h: 早年与留法
      from: 1901
      to: 1925
      text: |
        1901 年 8 月 26 日生于四川乐至。1919 年赴法国勤工俭学，1921 年因参加留法学生运动被遣返。1922 年入北京中法大学，1923 年入党。曾以文学青年身份写诗和小说。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 南昌起义、井冈山与三年游击战争
      from: 1926
      to: 1937
      text: |
        1927 年参加南昌起义余部，与朱德一起保存部队，1928 年参加湘南起义，上井冈山，任红四军政治部主任、军委书记。1929 年古田会议前后，曾与毛泽东在建军问题上有分歧，后赴上海向中央汇报，带回支持毛泽东的“九月来信”。1934 年 10 月主力长征时因伤留在中央苏区，与项英领导赣粤边三年游击战争，写下《梅岭三章》。
      verify: true
      cites: [ccp-figures-bios]
    - h: 新四军与华东野战军
      from: 1937
      to: 1949
      text: |
        1937 年后任新四军第一支队司令员，开辟苏南、苏北根据地。1941 年 1 月皖南事变后任新四军代军长。解放战争中任华东野战军司令员兼政委，与粟裕一起指挥孟良崮、淮海等战役，1949 年指挥渡江战役，占领上海。
      verify: true
      cites: [ccp-figures-bios]
    - h: 上海市长与外交部长
      from: 1949
      to: 1966
      text: |
        1949 年 5 月任上海市市长，主持上海接管和经济恢复，至 1958 年。1954 年任国务院副总理，1955 年授元帅衔，1958 年 2 月接替周恩来兼任外交部长。1962 年 3 月广州会议上与周恩来一起为知识分子“脱帽加冕”，宣布多数知识分子是“人民的知识分子”。
      verify: true
      cites: [ccp-figures-bios]
    - h: 文化大革命
      from: 1966
      to: 1972
      text: |
        1967 年 2 月中旬在怀仁堂碰头会上与谭震林、叶剑英、李富春、李先念、徐向前、聂荣臻等激烈批评中央文革小组。1981 年决议说他们“对‘文化大革命’的错误作法提出了强烈的批评，但被诬为‘二月逆流’而受到压制和打击”。此后外交部造反派要求“打倒陈毅”；据 1980 年起诉书，1967 年 8 月 7 日王力说“揪陈毅大方向当然对”，“打倒刘、邓、陈的口号为什么不能喊”，外交部一度被造反派夺权。1968 年 12 月谢富治等制造的“中国（马列）共产党”假案中，他被诬为“副书记兼国防部长”；同年张春桥指使编造《陈毅反动言论集》。九大仍当选中央委员，但退出政治局。1969 年 10 月被疏散到石家庄，1970 年确诊结肠癌，1972 年 1 月 6 日在北京病逝。
      cites: [ws-1981-resolution, ws-1980-indictment]
      verify: true
    - h: 身后
      from: 1972
      text: |
        1972 年 1 月 10 日追悼会召开，毛泽东临时决定出席，在会上对陈毅夫人张茜说“陈毅同志是一个好同志”（待核）。1980 年起诉书把他列为被林彪、江青集团诬陷迫害的领导人之一；1981 年决议肯定“二月逆流”中的批评。诗作后结集为《陈毅诗词选集》。
      verify: true
      cites: [ws-1980-indictment, ws-1981-resolution]
    - h: 家庭
      text: |
        妻子张茜，1940 年在新四军结婚。子陈昊苏、陈丹淮、陈小鲁，女陈珊珊。
      verify: true
      cites: [ccp-figures-bios]
  assess:
    - { voice: official1981, text: 一九六七年二月前后，谭震林、陈毅、叶剑英、李富春、李先念、徐向前、聂荣臻等政治局和军委的领导同志，在不同的会议上对“文化大革命”的错误作法提出了强烈的批评，但被诬为“二月逆流”而受到压制和打击, cite: ws-1981-resolution, quote: true }
