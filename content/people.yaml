    - { date: 1966-09-08, s: attacked, note: 林彪在军委常委会议上说他“伸手夺权”, cite: ws-1982-he-long-rehab }
    - { date: 1967-01, s: purged, note: 被揪斗，转移西山隐居, verify: true }
    - { date: 1967-09, s: detained, note: 中央同意立案审查, cite: ws-1974-he-long-name }
