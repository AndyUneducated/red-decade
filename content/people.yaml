  bio: 报人、杂文家、史学者。抗战中在晋察冀游击区主持《晋察冀日报》，1944 年主编最早的《毛泽东选集》；建国后任《人民日报》总编辑，1957 年因该报宣传受毛泽东批评“书生办报”，1958 年调北京市委书记处书记。1961–1962 年以“马南邨”之名在《北京晚报》写《燕山夜话》，又与吴晗、廖沫沙在《前线》合写《三家村札记》。1965 年底以“向阳生”之名发表把海瑞问题引向“道德继承”的文章，彭真称“是我叫他那样写的”。1966 年 5 月被定为“三家村”黑店的“掌柜”，5 月 18 日自杀；起诉书与判决书均列为“被迫害致死”。
  life:
    - h: 书香子弟与左翼青年
      from: 1912
      to: 1937
      text: |
        1912 年 2 月 26 日生于福州，原名邓子健。1929 年入上海光华大学，1930 年入党，参加左翼社会科学家联盟；1933 年在上海被捕，后获释（待核）。1934 年入河南大学经济系，1937 年以“邓云特”之名出版《中国救荒史》。
      verify: true
