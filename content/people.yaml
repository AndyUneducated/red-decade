  tier: 1
  role1966: 北京市委第一书记、文化革命五人小组组长
  bio: 山西最早的中共党员之一，长期从事华北地下工作，曾坐国民党监狱六年；延安时期任中央党校教育长、组织部长，1945 年主持东北局。建国后任北京市委第一书记、市长十七年，又是中央书记处书记和法制建设的主要负责人。文革中第一个被打倒的政治局委员：主持起草《二月提纲》，坚持把批判吴晗限定在“学术”范围内、“在真理面前人人平等”，1966 年 4 月书记处会议上受批判，5 月被定为“彭罗陆杨反党集团”成员。关押、流放十二年后复出，主持 1982 年宪法修订，任全国人大常委会委员长。
  life:
    - h: 家世与早年革命
      from: 1902
      to: 1935
      text: |
        1902 年 10 月 12 日生于山西曲沃垤上村，原名傅懋恭。1922 年入山西省立第一中学，参加学生运动，1923 年入党，是山西最早的党员之一。此后在太原、天津从事工人运动和地下党工作，化名“彭真”。1929 年 6 月在天津被捕，在狱中领导绝食斗争，1935 年刑满获释。
      verify: true
      cites: [ccp-figures-bios, peng-zhen-chronicle]
    - h: 华北、延安与东北
      from: 1935
      to: 1948
      text: |
        出狱后在天津协助刘少奇主持北方局组织工作。1938 年任晋察冀分局书记，参与创建晋察冀根据地。1941 年到延安，任中央党校教育长，1944 年任中央组织部代部长，七大当选中央委员、政治局委员。1945 年 9 月 15 日东北局成立，他任书记，10 月起兼东北人民自治军政委；与林彪对东北战略有分歧。1946 年 6 月 16 日中共中央决定林彪任东北局书记兼东北民主联军总司令、政委，他改任副书记兼副政委，仍是五人常委之一，7 月参加哈尔滨东北局扩大会议。此后调离东北的时间待核。
      verify: true
      cites: [ccp-figures-bios, peng-zhen-chronicle, fzu-2017-northeast-bureau-1946]
    - h: 北京市委书记十七年
      from: 1948
      to: 1965
      text: |
        1948 年 12 月任北平市委书记，建国后任北京市委书记（后第一书记）、市长，同时任中央政法小组组长、全国人大常委会副委员长兼秘书长，参与起草 1954 年宪法。1956 年八大当选中央书记处书记，协助邓小平主持书记处。1962 年七千人大会上提出“毛主席也有错误”可以批评（待核）。1964 年 7 月任文化革命五人小组组长。
      verify: true
      cites: [peng-zhen-chronicle, ccp-figures-bios]
    - h: 二月提纲与倒台
      from: 1965
      to: 1966
      text: |
        1965 年 11 月姚文元文章发表后，北京报刊起初没有转载，后经周恩来督促才在《北京日报》《人民日报》刊出。1966 年 2 月主持五人小组起草《二月提纲》，主张学术讨论要“坚持实事求是，在真理面前人人平等”，不要“象学阀一样武断和以势压人”，2 月 12 日经中央批转。4 月 9–12 日书记处会议上受康生、陈伯达批判，周恩来、邓小平指出他“是反对毛主席的”。

        5 月 16 日政治局扩大会议通过《通知》，撤销《二月提纲》和五人小组，彭真与罗瑞卿、陆定一、杨尚昆被定为“反党集团”，北京市委被改组。
      cites: [ws-1966-02-outline, ws-1966-05-16-notice, ws-1966-05-16-notice-attachment@1966-04-09]
    - h: 关押与流放
      from: 1966
      to: 1978
      text: |
        1966 年 5 月 22 日起被软禁家中，7 月 9 日康生主持成立彭真专案小组。11 月 28 日江青公开点名，号召造反派批斗；从 12 月到 1968 年 7 月关进秦城监狱前，被批斗二百余次。1975 年 5 月 19 日根据中央决定获释，与妻子张洁清被送到陕西商洛干休所监视居住，专案结论仍定为“叛徒、反党分子”。1978 年 12 月 28 日全家从西安乘飞机回到北京。
      cites: [hybsl-2015-gao-tianding-peng-zhen]
    - h: 复出与法制建设
      from: 1979
      to: 1988
      text: |
        1979 年 2 月平反，9 月十一届四中全会增补为中央委员、政治局委员。主持制定刑法、刑事诉讼法等七部法律，1980 年任中央政法委书记，主持起诉林彪、江青反革命集团的工作。1980–1982 年主持宪法修改委员会的具体工作，1982 年宪法通过。1983–1988 年任第六届全国人大常委会委员长。
      verify: true
      cites: [peng-zhen-chronicle]
    - h: 晚年与去世
      from: 1988
      text: |
        1988 年 4 月卸任后退休。1997 年 4 月 26 日在北京病逝，终年九十五岁。新华社 5 月 2 日播发《彭真同志光辉战斗的一生》，说他 1989 年春夏之交发表《用宪法和法律统一思想》的讲话。
      verify: true
      cites: [peng-zhen-chronicle, rmrb-1997-05-03-peng-zhen-life]
