  tier: 2
  role1966: 中宣部部长、中央政治局常委、中央文革小组顾问
  bio: 黄埔军校出身，广州起义参加者，坐过国民党监狱四年；解放战争后长期主政中南、广东，是“中南王”。1966 年 6 月由中南局调京接替陆定一主管宣传，八届十一中全会后进入政治局常委，排名第四，兼任中央文革小组顾问。不到半年即被江青、陈伯达等公开打倒，成为第一个在文革中倒台的新任常委。1969 年在合肥病中被拒绝治疗而死。1981 年决议将其与刘少奇、彭德怀、贺龙并列为“受迫害而牺牲”的领导人。
  life:
    - h: 早年、广州起义与入狱
      from: 1908
      to: 1937
      text: |
        1908 年 1 月 16 日生于湖南祁阳，原名陶际华。少年时在武汉当学徒，1926 年考入黄埔军校第五期，同年入党。1927 年参加广州起义。此后在福建从事兵运，任福建省委秘书长、军委书记，1932 年领导厦门劫狱。1933 年在上海被捕，被判无期徒刑，关押于南京中央军人监狱，1937 年国共合作后获释。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 抗战与东北
      from: 1937
      to: 1949
      text: |
        出狱后在湖北组织应城抗日游击队，任鄂中区党委书记。1940 年到延安，任中央军委秘书长等职，整风中受审查。1945 年赴东北，历任辽吉省委书记、辽北省委书记、第四野战军政治部副主任，随军南下。
      verify: true
      cites: [ccp-figures-bios]
    - h: 主政广东与中南
      from: 1949
      to: 1966
      text: |
        建国后任广西省委代理书记、中南军区副政委，1951 年起主政广东，1955 年任广东省委第一书记，1961 年任中南局第一书记。1958 年鼓吹“大跃进”，后转向纠偏，1959 年发表《松树的风格》。1962 年广州会议上与周恩来、陈毅一起为知识分子“脱帽加冕”。1965 年任国务院副总理。
      verify: true
      cites: [ccp-figures-bios]
    - h: 文化大革命
      from: 1966
      to: 1969
      text: |
        1966 年 6 月调京任中央书记处常务书记兼中宣部部长，接替被打倒的陆定一；八届十一中全会后进入政治局常委，排名第四，并“兼任中央文化革命小组顾问”。他在工作组问题和保护干部上与中央文革小组意见相左，又在接见群众时为王任重等人说话。1966 年 12 月 27 日中央文革碰头会上江青、陈伯达当面批判他；1967 年 1 月 4 日陈伯达、江青在接见武汉群众时公开宣布他是“中国最大的保皇派”，此后被打倒、软禁于中南海。

        1969 年 10 月患胆囊癌，在林彪“一号命令”疏散中被押送到安徽合肥，11 月 30 日去世，终年六十一岁。
      cites: [ws-1966-tao-zhu-adviser, ws-1981-resolution]
      verify: true
    - h: 平反与身后
      from: 1978
      text: |
        1978 年 12 月追悼大会在人民大会堂举行，同月十一届三中全会纠正对他的错误结论。1981 年决议把他列为“受迫害而牺牲的”党和国家领导人之一。女儿陶斯亮 1978 年发表《一封终于发出的信——给爸爸陶铸》，是最早公开讲述文革高层受害者经历的文章之一。
      cites: [ws-1978-12-third-plenum, ws-1981-resolution]
      verify: true
    - h: 家庭
      text: |
        妻子曾志，井冈山时期的老党员，后任中组部副部长。女儿陶斯亮。
      verify: true
      cites: [ccp-figures-bios]
