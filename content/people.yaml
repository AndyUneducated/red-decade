  tier: 1
  role1966: 上海市委书记处书记、中央文革小组副组长
  bio: 1930 年代上海左翼文人，延安时期进入中共新闻宣传系统，1950–60 年代任上海市委宣传主管，1958 年以《破除资产阶级的法权思想》受毛泽东赏识。文革中任中央文革小组副组长、上海市革委会主任，1973 年进入政治局常委，1975 年任副总理，是“四人帮”的理论主将。1976 年被捕，1981 年判处死缓，拒绝在法庭上回答审问，2002 年获释，2005 年病逝。主持组织姚文元批判《海瑞罢官》的文章；1966 年 12 月 18 日单独接见蒯大富授意“把他们搞臭”，12 月 28 日电话指示“胜利果实不能被赤卫队夺去”，引发康平路武斗（据 1980 年起诉书）。
  life:
    - h: 早年与上海左翼文坛
      from: 1917
      to: 1937
      text: |
        1917 年 2 月 1 日生于山东巨野，在济南读中学，参加“华蒂文艺社”。1935 年到上海，从事左翼文学活动，加入左联外围组织。1936 年以笔名“狄克”发表《我们要执行自我批判》，批评萧军《八月的乡村》，鲁迅撰《三月的租界》予以回击；文革中此事成为知情人受牵连的原因之一。
      verify: true
      cites: [ccp-figures-bios]
    - h: 延安与新闻宣传
      from: 1937
      to: 1949
      text: |
        1937 年到延安，入陕北公学，1938 年入党。抗战期间在晋察冀边区从事宣传工作，任《晋察冀日报》副总编辑等职。解放战争后期任石家庄市政府秘书长、《石家庄日报》社长。1949 年随军南下，进入上海新闻系统。
      verify: true
      cites: [ccp-figures-bios]
    - h: 上海宣传主管
      from: 1949
      to: 1965
      text: |
        1950 年代任新华社华东总分社社长、上海《解放日报》社长兼总编辑，后任市委宣传部部长、市委书记处书记，是上海市委第一书记柯庆施的主要助手。1958 年 9 月在上海《解放》半月刊发表《破除资产阶级的法权思想》，毛泽东写按语让《人民日报》10 月转载。1965 年与江青在上海组织姚文元撰写批判《海瑞罢官》的文章。
      verify: true
      cites: [ws-1966-05-16-notice-attachment]
    - h: 文化大革命
      from: 1966
      to: 1976
      text: |
        1966 年 5 月任中央文革小组副组长。据特别法庭判决书：1966 年 12 月单独召见蒯大富，指使其“首先在社会上煽动‘打倒刘少奇’”；12 月 28 日制造上海康平路武斗事件，打伤九十一人；1967 年 1 月说“我们对所有的权都要夺”，策动上海“一月夺权”，2 月任上海市革命委员会主任；1967 年 5 月在济南支持王效禹制造武斗事件。判决书称他“是向人民民主政权实行夺权的肇始者和自始至终的煽动者、策划者”。

        1969 年九大进入政治局，1973 年十大任政治局常委。1975 年 1 月任国务院副总理兼总政治部主任，4 月在《红旗》发表《论对资产阶级的全面专政》。1976 年 3 月指使马天水、徐景贤在上海诬陷复出干部“从资产阶级民主派变成走资派”，并与王洪文在上海扩建“民兵武装”。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 审判与晚年
      from: 1976
      to: 2005
      text: |
        1976 年 10 月 6 日被隔离审查。1977 年 7 月十届三中全会称已经查明“张春桥是国民党特务分子”，永远开除其党籍；这一“特务”定性在 1980 年起诉书、1981 年判决书和 1981 年决议中都没有再出现。1980–1981 年受审时始终拒绝回答法庭审问，判决书记为“张春桥不回答法庭对他的审问”。1981 年 1 月 25 日判处死刑，缓期二年执行，剥夺政治权利终身。后改判无期徒刑、有期徒刑，2002 年获释，2005 年 4 月 21 日因胰腺癌在上海病逝。
      cites: [ws-1976-10-18-notice, ws-1977-07-tenth-third-plenum, ws-1981-01-25-judgment, ws-1981-resolution]
