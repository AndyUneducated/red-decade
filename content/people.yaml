    - { date: 1967-01, s: purged, note: 造反派宣布“不再承认”其第一书记职务, cite: ws-1982-xu-jingxian-case }
    - { date: 1967-02, s: detained, note: 被非法监禁, cite: ws-1982-xu-jingxian-case, verify: true }
