  bio: 黄埔军校出身，广州起义参加者，坐过国民党监狱四年；解放战争后长期主政中南、广东，是“中南王”。1966 年 6 月由中南局调京接替陆定一主管宣传，八届十一中全会后进入政治局常委，排名第四，兼任中央文革小组顾问。不到半年即被江青、陈伯达等公开打倒，成为第一个在文革中倒台的新任常委。1969 年在合肥病中被拒绝治疗而死。1981 年决议将其与刘少奇、彭德怀、贺龙并列为“受迫害而牺牲”的领导人。
  life:
    - h: 早年、广州起义与入狱
      from: 1908
      to: 1937
      text: |
        1908 年 1 月 16 日生于湖南祁阳，原名陶际华。少年时在武汉当学徒，1926 年考入黄埔军校第五期，同年入党。1927 年参加广州起义。此后在福建从事兵运，任福建省委秘书长、军委书记，1932 年领导厦门劫狱。1933 年在上海被捕，被判无期徒刑，关押于南京中央军人监狱，1937 年国共合作后获释。
