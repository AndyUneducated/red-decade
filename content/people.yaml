  bio: 广东客家人，云南讲武堂出身，黄埔军校教官，1927 年入党，参与领导广州起义。长征中向毛泽东密报张国焘的电报，此后长期任八路军和中央军委参谋长。建国后主政华南，1955 年授元帅衔，1966 年八届十一中全会增补为中央书记处书记。1967 年“二月逆流”参与者之一，1971 年后主持军委日常工作，1976 年 10 月与华国锋、汪东兴等策划逮捕“四人帮”，此后任党中央副主席、人大委员长，1979 年国庆讲话代表中央初步检讨文革。
  life:
    - h: 早年与黄埔
      from: 1897
      to: 1927
      text: |
        1897 年 4 月 28 日生于广东梅县雁洋堡，客家人。1917 年入云南陆军讲武堂，毕业后追随孙中山，参加护法战争。1924 年黄埔军校创办时任教授部副主任。北伐时任国民革命军第四军参谋长等职。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 入党与长征
      from: 1927
      to: 1937
      text: |
        1927 年 7 月在武汉秘密入党，12 月参与领导广州起义。1928 年赴莫斯科中山大学特别班学习，1930 年回国，到中央苏区任中革军委总参谋长等职。1935 年 9 月在川西北任红四方面军前敌指挥部参谋长期间，获悉张国焘企图以武力挟持中央的电报，立即向毛泽东报告，中央随即率一、三军团北上，毛泽东后来称他“诸葛一生唯谨慎，吕端大事不糊涂”。
      verify: true
      cites: [ccp-figures-bios]
    - h: 八路军参谋长与华南
      from: 1937
      to: 1966
      text: |
        抗战期间任八路军参谋长，曾任中共驻南京、重庆代表团成员，1941 年起任中央军委参谋长。1946 年任北平军调处执行部中共代表。1949 年任广州市长、华南分局第一书记，1955 年授元帅衔，后主持全军军事训练和军事科学院工作。
      verify: true
      cites: [ccp-figures-bios]
    - h: 文化大革命
      from: 1966
      to: 1976
      text: |
        1966 年 8 月八届十一中全会增补为中央书记处书记，任军委副主席。1967 年 2 月在怀仁堂会议上与陈毅、谭震林等批评中央文革小组，1981 年决议称他们“被诬为‘二月逆流’而受到压制和打击”。据判决书，1967 年 6 月黄永胜批准“第一号调查方案”，“阴谋陷害叶剑英为‘叛徒’”，1968 年 6 月又把诬陷他“密谋发动反革命政变”的材料交给叶群。1969 年 10 月被疏散到湖南。1971 年林彪事件后主持中央军委日常工作，1973 年十大当选中共中央副主席，1975 年任国防部长。
      cites: [ws-1981-resolution, ws-1981-01-25-judgment]
      verify: true
    - h: 粉碎“四人帮”与晚年
      from: 1976
      text: |
        1976 年毛泽东去世后，与华国锋、汪东兴等商定于 10 月 6 日逮捕王洪文、张春桥、江青、姚文元。1977 年十届三中全会公报把“粉碎王张江姚反党集团”的胜利归功于“英明领袖华国锋主席、叶剑英副主席和以华主席为首的党中央”；1981 年决议也说“华国锋、叶剑英、李先念等同志起了重要作用”。1978 年任全国人大常委会委员长，1979 年 9 月 29 日在建国三十周年大会上的讲话初步检讨了文革，1981 年决议称这篇讲话“对党在过去工作中的错误作了自我批评”。1981 年 9 月发表关于台湾回归的“叶九条”。1985 年退出中央领导职务，1986 年 10 月 22 日在北京去世。
      cites: [ws-1977-07-tenth-third-plenum, ws-1981-resolution]
      verify: true
  assess:
