- id: zhu-de
  name: 朱德
  born: 1886-12-01
  died: 1976-07-06
  tier: 2
  role1966: 全国人大常委会委员长
  pinyin: Zhū Dé
  aka:
    - { kind: original, name: 朱代珍 }
    - { kind: courtesy, name: 玉阶 }
  gender: m
  ethnicity: 汉族
  birthplace: 四川仪陇马鞍场
  origin: 四川仪陇
  classOrigin: 佃农
  classNote: 生于佃农家庭，过继给伯父，由族中集资读书（待核）。
  deathKind: natural
  deathPlace: 北京
  education:
    - { school: 云南陆军讲武堂, from: 1909, to: 1911, verify: true }
    - { school: 哥廷根大学（旁听）, from: 1923, to: 1925, verify: true }
    - { school: 莫斯科东方大学（军事班）, from: 1925, to: 1926, verify: true }
  party: 中国共产党
  joinedParty: 1922-11
  positions:
    - { title: 滇军旅长、云南陆军宪兵司令, orgName: 滇军, from: 1916, to: 1921, verify: true }
    - { title: 红四军军长, orgName: 红四军, from: 1928-04, to: 1930, verify: true }
    - { title: 中国工农红军总司令、中革军委主席, orgName: 中国工农红军, from: 1931-11, to: 1937-08, verify: true }
    - { title: 八路军（第十八集团军）总司令, orgName: 八路军, from: 1937-08, to: 1946, verify: true }
    - { title: 中国人民解放军总司令, orgName: 中国人民解放军, from: 1946, to: 1954, verify: true }
    - { title: 中华人民共和国副主席, orgName: 国家副主席, from: 1954-09, to: 1959-04, verify: true }
    - { title: 中共中央副主席, orgName: 中共中央, from: 1956-09, to: 1966-08, verify: true }
    - { title: 全国人大常委会委员长, orgName: 全国人大常委会, from: 1959-04, to: 1976-07-06, cite: ws-1976-07-07-zhu-obituary }
  rank: { rank: 中华人民共和国元帅, date: 1955-09-27 }
  bio: 旧式军人出身，辛亥革命参加者、滇军名将；1922 年在柏林由周恩来介绍入党。南昌起义后率余部上井冈山，与毛泽东会师，“朱毛”从此并称。长期任红军、八路军和解放军总司令，1955 年授元帅衔，建国后任国家副主席、全国人大常委会委员长。文革中被林彪等诬为“黑司令”，虽未被打倒但被边缘化，1969 年被疏散到广东从化。1976 年 7 月 6 日去世，在周恩来之后、毛泽东之前。
  life:
    - h: 家世与滇军
      from: 1886
      to: 1922
      text: |
        1886 年 12 月 1 日生于四川仪陇一个佃农家庭。1909 年考入云南陆军讲武堂，加入同盟会，1911 年参加昆明“重九起义”。护国战争中随蔡锷讨袁，以作战勇猛著称，升任滇军旅长；此后在川滇军阀混战中任职，一度吸食鸦片。1921 年任云南陆军宪兵司令、警务处长。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 留德与入党
      from: 1922
      to: 1926
      text: |
        1922 年到上海求见陈独秀要求入党未果，同年赴德国，11 月在柏林由周恩来、张申府介绍加入中国共产党。在哥廷根大学旁听，参与旅欧共产党活动，1925 年被德国当局驱逐，转赴莫斯科学习军事，1926 年回国。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 南昌起义与“朱毛”
      from: 1926
      to: 1937
      text: |
        1926 年回国后在杨森部和朱培德部做统战工作，任南昌公安局长、第三军军官教育团团长。参加 1927 年南昌起义，起义失败后收拢余部，转战闽粤赣，1928 年 1 月发动湘南起义，4 月上井冈山与毛泽东会师，组成红四军，任军长。1931 年任中华苏维埃共和国中革军委主席、红军总司令。长征中曾被张国焘裹挟南下，坚持反对分裂，1936 年随红二、四方面军北上。
      verify: true
      cites: [ccp-figures-bios]
    - h: 八路军与解放军总司令
      from: 1937
      to: 1949
      text: |
        1937 年 8 月任八路军总司令（后改称第十八集团军总司令），赴华北前线指挥。1940 年回延安，主持南泥湾等大生产运动。七大作军事报告《论解放区战场》，当选中央书记处书记。解放战争期间任中国人民解放军总司令，1949 年 4 月与毛泽东联名发布《向全国进军的命令》。
      verify: true
      cites: [ccp-figures-bios]
    - h: 建国后
      from: 1949
      to: 1966
      text: |
        建国后任中央人民政府副主席、人民革命军事委员会副主席，1954 年任国家副主席，1956 年任中共中央副主席，1959 年起任全国人大常委会委员长。1959 年庐山会议上对彭德怀的批评较温和，被毛泽东批评。1966 年八届十一中全会后在常委中排名降至第九位。
      verify: true
      cites: [ccp-figures-bios, ws-1976-07-07-zhu-obituary]
    - h: 文化大革命
      from: 1966
      to: 1976
      text: |
        据 1980 年起诉书，“一九六六年九月到一九六八年十二月，林彪、张春桥、吴法宪、和邱会作等诽谤、诬陷朱德是‘黑司令’、‘老机会主义者’、‘军阀’、‘野心很大，想当领袖’”；1968 年谢富治等制造“中国（马列）共产党”假案，诬陷他是这个“党”的“书记”；康生审定的报告也把他列入人大常委中被诬陷者名单。中南海住处外贴出大字报，1967 年 1 月一度被抄家。九大仍当选中央委员、政治局委员，但不再进入常委；1969 年 10 月被疏散到广东从化。1973 年十大重入常委。1976 年 7 月 6 日在北京去世，终年九十岁。讣告仍要求“深入开展批判邓小平反革命的修正主义路线”。
      cites: [ws-1980-indictment, ws-1976-07-07-zhu-obituary]
      verify: true
    - h: 家庭
      text: |
        先后与萧菊芳、陈玉珍、贺治华、伍若兰、康克清结婚。伍若兰 1929 年被国民党杀害。1929 年起与康克清共同生活。子朱琦，女朱敏。
      verify: true
      cites: [ccp-figures-bios]
  assess:
    - { voice: official1966, text: 朱德同志是中国共产党的优秀党员，是中国人民伟大的革命战士和无产阶级革命家，是党、国家和军队的卓越领导人之一（1976 年讣告）, cite: ws-1976-07-07-zhu-obituary, quote: true }
