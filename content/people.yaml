  tier: 1
  role1966: 中央文革小组组长
  bio: 中共理论家，1939 年起长期任毛泽东的政治秘书，起草过大量中央文件和毛的文稿，1958 年创办《红旗》并任总编辑。文革中任中央文革小组组长、政治局常委，排名一度居第四；1970 年庐山会议上与林彪一方提出“天才论”，被毛泽东批判倒台。1981 年被判处有期徒刑十八年，1988 年刑满，次年病逝。1980 年起诉书称“横扫一切牛鬼蛇神”等社论由其“组织编写和审定”。
  life:
    - h: 早年与入党
      from: 1904
      to: 1937
      text: |
        1904 年 7 月 29 日生于福建惠安，原名陈建相，字尚友。在集美学校师范部读书，1924 年后到上海，曾在国民党方面任职，参加北伐。1927 年入党，同年被派往莫斯科中山大学学习，1930 年回国。1931 年在北平从事地下工作时被捕，1932 年获释。

        这段经历在 1971 年被毛泽东定性：“陈伯达早期就是一个国民党反共分子。混入党内以后，又在一九三一年被捕叛变，成了特务。”此后的官方文件沿用这一说法；陈本人晚年否认“叛变”，获释经过的细节各方说法不一（待核）。1930 年代中期在北平中国大学任教，参与发起“新启蒙运动”。
      cites: [ws-1971-12-lin-chen-material-1]
      verify: true
    - h: 毛泽东的秘书
      from: 1937
      to: 1965
      text: |
        1937 年到延安，任教于陕北公学，1939 年起任毛泽东的政治秘书，著《中国四大家族》《人民公敌蒋介石》《窃国大盗袁世凯》等。1945 年七大当选中央候补委员。建国后任中宣部副部长、中国科学院副院长、中央政治研究室主任，参与起草毛泽东署名的大量文件。1956 年八大当选政治局候补委员。1958 年 6 月创办《红旗》杂志并任总编辑，同年积极鼓吹“大跃进”和人民公社。1962–1965 年参与起草“农业六十条”、四清《二十三条》等文件。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 中央文革小组组长
      from: 1966
      to: 1970
      text: |
        1966 年 5 月任中央文革小组组长，6 月 1 日率工作组接管《人民日报》，当日发表社论《横扫一切牛鬼蛇神》。8 月八届十一中全会进入政治局常委。10 月 16 日在中央工作会议上作《无产阶级文化大革命中的两条路线》讲话。据判决书，1967 年 7 月与江青、康生决定剥夺刘少奇的行动自由；1966 年底至 1968 年多次诬陷陆定一；1967 年 12 月在唐山称中共冀东组织“可能是国共合作的党”，造成冀东冤案。1969 年九大留任常委，九大政治报告最初由他起草，未被采用。

        1970 年 8 月九届二中全会上与林彪方面主张在宪法中设国家主席、称颂毛泽东“天才”，毛泽东写《我的一点意见》批判他，随后开展“批陈整风”。
      cites: [ws-1966-05-ccrg-list, ws-1971-12-lin-chen-material-1, ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 审判与晚年
      from: 1970
      to: 1989
      text: |
        1970 年庐山会议后被审查，后关押于秦城监狱。1980–1981 年受审，是供认犯罪事实的被告之一，1981 年 1 月 25 日被判处有期徒刑十八年，剥夺政治权利五年。保外就医期间于 1988 年刑满，1989 年 9 月 20 日在北京病逝。晚年接受其子陈晓农的访谈，口述整理为《陈伯达最后口述回忆》。
      cites: [ws-1981-01-25-judgment]
      verify: true
  assess:
    - { voice: official1966, text: 陈伯达早期就是一个国民党反共分子。混入党内以后，又在一九三一年被捕叛变，成了特务, cite: ws-1971-12-lin-chen-material-1, quote: true }
    - { voice: judicial1980, text: 陈伯达控制宣传舆论工具，进行反革命宣传煽动，一九六六年提出“横扫一切牛鬼蛇神”等口号, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: witness, text: 陈晓农整理的口述称陈伯达自认在文革中“犯了大罪”，但否认“叛徒”结论和庐山会议上的“阴谋”定性（亲属整理，待核）。 }
