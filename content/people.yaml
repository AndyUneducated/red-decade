      to: 1926
      text: |
        1896 年生于湖南桑植洪家关，出身贫苦。1914 年加入孙中山的中华革命党，在桑植、石门做兵运工作。1916 年领导湘西暴动，以“两把菜刀闹革命”夺取盐局武装，后任桑植讨袁民军总指挥。此后在湘西、川东拉起队伍，逐步升为湘西镇守使署部队的旅长、师长。
      cites: [ws-1982-he-long-rehab]
      verify: true
    - h: 北伐与南昌起义
      from: 1926
      to: 1927
      text: |
        大革命时期参加北伐，历任国民革命军师长、第二十军军长，是“国民革命军中著名的左派将领”。1927 年蒋介石、汪精卫先后“清党”后，仍站在共产党一边，在周恩来领导下率第二十军参加 8 月 1 日南昌起义，任起义军总指挥，并“志愿加入中国共产党”。起义部队南下广东失利。
      cites: [ws-1982-he-long-rehab, ws-1974-he-long-name]
    - h: 湘鄂西与红二方面军
      from: 1928
      to: 1937
      text: |
        1928 年回湘鄂西与周逸群等组织工农革命军，创建湘鄂西根据地，历任工农革命第四军军长、红二军团总指挥、红三军军长。1933 年 12 月蒋介石派熊贡卿“游说”收编，贺龙报告湘鄂西中央分局后，经分局决定公开审判处决熊贡卿，1934 年 3 月 17 日向中央报告；此事在文革中被林彪方面歪曲为“通敌”。1934 年与任弼时、萧克的红六军团会合，创建湘鄂川黔根据地。1936 年与任弼时率红二方面军长征，到达陕北。
      cites: [ws-1974-he-long-name, ws-1982-he-long-rehab]
    - h: 晋绥、西北与西南
      from: 1937
      to: 1954
      text: |
        抗战期间任八路军一二〇师师长，与关向应开辟晋绥抗日根据地，后任陕甘宁晋绥联防军司令员、晋绥军区司令员。七大当选中央委员。解放战争中任西北军区司令员、西北局第二书记，1949 年底随刘邓进军西南，建国初任西南军区司令员、西南局第三书记。
      cites: [ws-1982-he-long-rehab]
    - h: 建国后：体育与国防
      from: 1952
      to: 1965
      text: |
        1952 年 11 月任国家体委主任，长期主持体育工作。1954 年任国务院副总理、国防委员会副主席，1955 年授元帅衔，1956 年八大当选政治局委员，1959 年任中央军委副主席，分管国防工业和军队训练。1964 年组织全军“大比武”，并对林彪的“四好为纲”“向空军学习”等口号提过不同意见，据 1974 年复查报告，林彪等人因此“怀恨在心”。
      cites: [ws-1974-he-long-name, ws-1982-he-long-rehab]
      verify: true
    - h: 文化大革命
      from: 1966
      to: 1969
      text: |
        据 1982 年平反决定：1966 年 7 月康生“无中生有地诬陷贺龙同志搞所谓‘二月兵变’”；8 月中旬林彪指使吴法宪等人写材料，诬陷他在海军、空军等单位夺权；9 月 8 日林彪在军委常委会议上说他“伸手夺权”。1966 年底起被揪斗，1967 年初在周恩来安排下转移到北京西山隐居，后被隔离审查；1967 年 9 月中央同意对他进行审查，专案组由林彪、康生、江青、黄永胜、吴法宪、叶群、李作鹏等把持，诬陷他“通敌叛变”。关押期间医疗受限制，糖尿病病情恶化，“一九六九年六月八日，在贺龙同志病情恶化后”专案方面不采取抢救措施，6 月 9 日去世。
      cites: [ws-1974-he-long-name, ws-1982-he-long-rehab, ws-1980-indictment]
      verify: true
    - h: 平反与身后
      from: 1974
      text: |
        1974 年 9 月中央专案审查小组复查后报告“所谓‘通敌’问题，完全是颠倒历史，蓄意陷害”，9 月 29 日中央发出恢复名誉的通知。通知仍是在毛泽东、周恩来在世时、文革框架内发出的，只把责任归于林彪一伙，并称他“忠于毛主席革命路线”。1982 年中央再发彻底平反的决定，认为 1974 年的平反“不彻底”，把康生、江青也列为诬陷者，撤销全部原有文件。1981 年决议把他与刘少奇、彭德怀、陶铸并列为“受迫害而牺牲”的领导人。
      cites: [ws-1974-he-long-name, ws-1982-he-long-rehab, ws-1981-resolution]
    - h: 家庭
      text: |
        先后有几次婚姻，1942 年与薛明结婚。女儿贺捷生、子贺鹏飞等。薛明在文革中陪同他被关押，是他最后两年经历的主要亲历者。
      verify: true
      cites: [ccp-figures-bios]
  assess:
    - { voice: official1966, text: 贺龙同志是一个好同志，在毛主席、党中央的领导下，几十年来为党为人民的革命事业曾作出重大的贡献（1974 年通知）, cite: ws-1974-he-long-name, quote: true }
    - { voice: official1981, text: 但《通知》对贺龙同志的平反是不彻底的，有些提法是错误的（1982 年决定）, cite: ws-1982-he-long-rehab, quote: true }
    - { voice: judicial1980, text: 一九六六年八月，吴法宪受林彪的指使，于九月三日写了诬陷贺龙在空军阴谋夺权的材料送给林彪, cite: ws-1981-01-25-judgment, quote: true }
  factions: [marshals]
