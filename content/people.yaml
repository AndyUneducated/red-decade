    - h: 第一张大字报
      from: 1966-05-25
      to: 1966-08
      text: |
        1966 年 5 月 25 日下午两点多，她和哲学系宋一秀、夏剑豸、杨克明、赵正义、高云鹏、李醒尘共七人，在大饭厅东墙上贴出《宋硕、陆平、彭珮云在文化革命中究竟干些什么？》，矛头指向北京市委大学部副部长宋硕 5 月 14 日要求的“加强领导，坚守岗位”。大字报的起草与康生之妻曹轶欧到北大“调查”有关（待核）。

        6 月 1 日晚，大字报经毛泽东决定由中央人民广播电台播出，次日《人民日报》全文刊登，并配发评论员文章《欢呼北大的一张大字报》。1967 年的《红旗》社论说，毛泽东“把北京大学的全国第一张马列主义的大字报称为二十世纪六十年代的北京人民公社宣言”。8 月 5 日毛泽东写《炮打司令部》，开头即说：“全国第一张马列主义的大字报和人民日报评论员的评论，写得何等好呵！”8 月 18 日第一次接见红卫兵大会上，她作为“北京大学的代表”讲话。
      verify: true
      cites: [rmrb-1966-06-02-nie-dazibao, ws-1966-06-02-hail-pku, ws-1967-02-seize-power, ws-1967-08-bombard-anniv, rmrb-1966-08-19-first-rally]
    - h: 校文革与上海之行
      from: 1966-09
      to: 1967-04
      text: |
        1966 年 9 月北京大学文化革命委员会成立，她任主任。据 1982 年起诉书和 1983 年判决书，11 月 15 日王力把她秘密接到花园村“中央文革”记者站，江青、陈伯达、姚文元、王力、关锋、戚本禹等密谋后派她去上海“造反”。19 日她带领孙蓬一等到上海，与张春桥单独密谈，定下以“打倒常溪萍为突破口”、进而夺取上海市领导权的策略，召集“工总司”“上三司”等造反派头头开会，要他们“把矛头对准上海市委”，又煽动华东师范大学的学生“打进市委机关去，让市委后院起火”。12 月 16 日离沪，孙蓬一留下继续活动。

        常溪萍是 1964 年北大社教工作队党委副书记，1966 年 7 月和 9 月她两次写大字报诬其为“镇压北大社教运动的刽子手”，交江青转到上海张贴。常溪萍此后遭到“极其残酷的折磨”，1968 年 5 月 25 日“含冤去世”。

        1967 年 1 月，她得知戚本禹说“朱是反毛的”，即批准“新北大公社”与作家协会“革命造反团”组成“联合批判班子”批判《朱德将军传》，文章登在《新北大》报上，“印五十多万份，发往全国”。
      verify: true
      cites: [ws-1982-10-05-nie-yuanzi-case]
    - h: 揪叛徒与监改大院
      from: 1967-04
      to: 1969
      text: |
        1967 年 4 月 14 日康生亲笔写信，要她“组织调査组”，“系统地调查彭真、刘仁的问题”。她随即成立北京大学“揪叛徒兵团”，向康生、谢富治报告进展，经谢富治支持到全国各地查阅档案。兵团的报告诬陷“彭真、薄一波、安子文与胡仁奎、李伦狼狈为奸”，经康生批交“彭真专案组”；1968 年 7 月专案组以此为重要根据认定彭真是“大特务”。4 月 20 日北京市革命委员会成立，她任副主任（待核）。

        1967 年起北大分裂为拥护她的“新北大公社”和反对她的“井冈山兵团”，1968 年春两派武斗（待核）。据判决书，1968 年 4 月 7 日起“新北大公社”制造“反革命小集团”冤案，把邓朴方、邓楠等十余名师生绑架到校严刑拷打，邓朴方“下身瘫痪，终身残废”；5 月在她主持下建立“监改大院”，“对陆平、彭珮云等干部、学生和教师共一百余人集中监禁”。1967 年 7 月戚本禹在会上对“聂元梓、蒯大富、韩爱晶、王大宾、谭厚兰”等诬陷刘少奇、邓小平等人，这五人后来被称为首都红卫兵“五大领袖”；1968 年 7 月 28 日毛泽东召见五人后，工宣队、军宣队进驻北大（待核）。1969 年 4 月九大上她当选中央候补委员。
      verify: true
      cites: [ws-1982-10-05-nie-yuanzi-case, ws-1983-11-02-qi-benyu-case]
    - h: 审查、判刑与晚年
      from: 1969
      to: 2019
      text: |
        1969 年后在北京新华印刷厂等处接受审查、劳动，1971 年被隔离审查（待核）。1978 年 4 月 19 日由北京市公安局逮捕。1982 年 10 月 5 日北京市人民检察院分院起诉；1983 年 3 月 10 日北京市中级人民法院认定她“已构成反革命宣传煽动罪、诬告陷害罪”，“判处被告人聂元梓有期徒刑十七年，剥夺政治权利四年”。判决书说，她在庭审中“供认了部分事实，但不承认是犯罪”。1984 年保外就医（待核）。2005 年在香港出版《聂元梓回忆录》。2019 年 8 月 28 日在北京去世，年九十八岁。
      verify: true
      cites: [ws-1982-10-05-nie-yuanzi-case, nie-yuanzi-memoir]
