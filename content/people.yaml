  bio: 少年参加红军，长期在华中、苏中地区工作，建国后在上海任职，1965 年柯庆施去世后任上海市委第一书记。1966 年下半年在病中主持市委，1967 年 1 月上海“一月夺权”中被宣布“不再承认”为第一书记，此后被诬为“老反革命”“叛徒”，长期监禁。1975 年后恢复自由，1977 年复出任湖北省委第一书记，后任中央书记处书记、全国人大常委会副委员长。
  life:
    - h: 红军与新四军
      from: 1916
      to: 1949
      text: |
        1916 年生于江西上犹，少年参加红军和共青团，1931 年入党。三年游击战争时期留在赣粤边，后在新四军和苏中根据地工作，历任苏中区党委书记等职（待核）。
      verify: true
      cites: [chen-pixian-memoir]
    - h: 上海
      from: 1949
      to: 1966-05
      text: |
        建国后先在苏南、后到上海，1950 年代任上海市委书记处书记；1965 年柯庆施去世后任上海市委第一书记（待核）。1982 年徐景贤、王秀珍案起诉书都称他为“中共上海市委第一书记”。
      verify: true
      cites: [chen-pixian-memoir, ws-1982-xu-jingxian-case]
    - h: 一月夺权
      from: 1966-11
      to: 1967-02
      text: |
        1966 年他患病休养，下半年回到市委主持工作，在安亭事件中主张不承认“工总司”（待核）。据徐景贤案起诉书，12 月 18 日徐景贤等召开大会“对陈丕显、曹荻秋等党政领导干部，进行人身迫害，煽动夺上海市领导权”。1967 年 1 月至 2 月，徐景贤、王洪文等两次召开大会，诬陷“陈丕显‘进行反革命复辟活动’”，宣布“不再承认陈丕显为中共上海市委第一书记”，并将陈丕显、曹荻秋等非法监禁。
      verify: true
      cites: [ws-1982-xu-jingxian-case, chen-pixian-memoir]
    - h: “老反革命”与长期关押
      from: 1967-03
      to: 1975
      text: |
        据 1980 年起诉书，1968 年 1 月张春桥、姚文元诬陷他“是一个极其狡猾极其阴险的反革命两面派”，“是无产阶级最危险的敌人”。徐景贤案起诉书说，1967 年 3 月至 1968 年 10 月徐景贤、王秀珍等“多次组织、主持全市批斗大会，诬陷陈丕显是‘黑小鬼’、‘老反革命’”；1968 年 2 月徐景贤审定文章，公开称他是用“反革命两面派手法斗争了几十年的老反革命分子”；1970 年 11 月审定的审查报告又说他是“叛徒”、“现行反革命分子”。1971 年 2 月，新华书店职工罗元芬因“反对张春桥等人诬陷迫害陈丕显”被拘留关押、劳动教养三年。1973 年 3 月宣布的《审查情况》还诬陷他“对中央负责同志进行反革命侦控”。1975 年前后解除关押（待核）。
      verify: true
      cites: [ws-1980-indictment, ws-1982-xu-jingxian-case, ws-1982-08-21-wang-xiuzhen-case]
    - h: 复出
      from: 1977
      to: 1995
      text: |
        1977 年复出，任中共湖北省委第一书记；1982 年十二大后任中央书记处书记，主管政法工作；1988 年任全国人大常委会副委员长（待核）。2005 年出版回忆录《在“一月风暴”的中心》。1995 年 8 月 22 日在北京去世。
      verify: true
      cites: [chen-pixian-memoir]
  assess:
    - { voice: judicial1980, text: 诬陷上海市委第一书记陈丕显“是一个极其狡猾极其阴险的反革命两面派”，“是无产阶级最危险的敌人”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 致使陈丕显长期遭受迫害，曹荻秋被长期折磨致死（1982 年王秀珍案判决书）, cite: ws-1982-08-21-wang-xiuzhen-case, quote: true }
    - { voice: witness, text: 本人回忆录从市委一方叙述 1966 年 11 月到 1967 年 1 月上海的经过，需与徐景贤等人的回忆对照（待核）。, cite: chen-pixian-memoir }
  works:
