  tier: 2
  role1966: 北京市文联主席、作家
  bio: 满族作家，原名舒庆春，字舍予，北京人。1920 年代在伦敦教书时开始写小说，1936 年发表《骆驼祥子》；抗战时期主持中华全国文艺界抗敌协会。1949 年底回国，以话剧《龙须沟》获北京市“人民艺术家”称号，1957 年写成《茶馆》，任北京市文联主席、中国作协副主席。1966 年 8 月 23 日被红卫兵押到国子监孔庙批斗殴打，次日在太平湖投水身亡。1980 年起诉书把他列为被迫害致死的作家、艺术家首位。
  life:
    - h: 北京、伦敦与抗战
      from: 1899
      to: 1949
      text: |
        1899 年生于北京一个满族旗兵家庭，父亲在八国联军入侵北京时阵亡。1918 年北京师范学校毕业，1924 年到伦敦大学东方学院任汉语讲师，写出《老张的哲学》《赵子曰》《二马》。回国后在齐鲁大学、山东大学任教，1936 年发表《骆驼祥子》。抗战时期在武汉、重庆主持中华全国文艺界抗敌协会的日常工作，写成《四世同堂》前两部。1946 年赴美讲学（待核）。
