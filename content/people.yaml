# ── 林彪系 ──────────────────────────────────────────────────
- id: ye-qun
  name: 叶群
  pinyin: Yè Qún
  aka:
    - { kind: original, name: 叶静宜 }
  gender: f
  ethnicity: 汉族
  birthplace: 福建闽侯
  origin: 福建闽侯
  born: 1917
  died: 1971-09-13
  deathKind: accident
  deathPlace: 蒙古温都尔汗附近
  party: 中国共产党
  positions:
    - { title: 林彪办公室主任, orgName: 林彪办公室, sys: army, from: 1960, to: 1971-09-13, cite: enwiki-ye-qun }
    - { title: 中央军委办事组成员, orgName: 中央军委办事组, from: 1967-08, to: 1971-09-13, cite: enwiki-ye-qun }
    - { title: 中共第九届中央政治局委员, orgName: 中共中央政治局, from: 1969-04-28, to: 1971-09-13, cite: ws-1969-04-28-9th-cc-plenum }
  tier: 2
  role1966: 林彪办公室主任
  bio: 林彪之妻，1960 年代任林彪办公室主任，文革中代林彪联络、传话，1969 年进入中央政治局。1980 年起诉书列举她 1966 年口授诬陷刘少奇、贺龙的材料，同江青一起指使江腾蛟抄上海文艺界人士的家；1970 年庐山会议上在中南组“大讲要设国家主席和‘天才’问题”，此后与林立果策划政变。1971 年 9 月 13 日随林彪乘三叉戟出逃，在蒙古温都尔汗附近坠机身亡。
  life:
    - h: 早年与延安
      from: 1917
      to: 1949
      text: |
        1917 年生于福建闽侯，原名叶静宜。1930 年代中期在北平读书，参加一二·九运动，抗战爆发后到延安。1942 年与林彪结婚（待核）。
      verify: true
    - h: 林彪办公室
      from: 1949
      to: 1966-07
      text: |
        建国后随林彪生活和工作，1960 年代林彪主持军委日常工作后任林彪办公室主任，替林彪处理文件、联络各方（待核）。1966 年 5 月中央政治局扩大会议期间，林彪为她的历史和婚前“清白”写过书面“证明”，起因是陆定一之妻严慰冰的匿名信（待核）。
      verify: true
    - h: 文革初期的诬陷材料
      from: 1966-08
      to: 1968
      text: |
        据 1980 年起诉书，1966 年 8 月 11 日、12 日，林彪指使她两次找总参作战部副部长雷英夫，“把林彪、叶群捏造的诬陷刘少奇的材料口授给雷英夫”；8 月下旬到 9 月初，她把诬陷贺龙的材料口授给军委办公厅警卫处处长宋治国，叮嘱“以你主动向我反映情况的口气写，不要以我指示叫你了解的口气写”。1966 年 10 月，江青勾结叶群，经吴法宪找来江腾蛟，要他搜查郑君里、顾而已、赵丹、童芷苓等五人的家，“凡是书信、日记本、笔记本之类的东西都拿来”，搜得的东西“分两次送北京叶群住处”。1967 年 4 月，“在叶群的授意下”，蒯大富派人收集诬陷徐向前、叶剑英的材料；1968 年 6 月黄永胜把诬陷叶剑英“密谋发动反革命政变”的材料交给她。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
    - h: 政治局与庐山
      from: 1969-04
      to: 1970-10
      text: |
        1969 年 4 月 28 日九届一中全会选举她为中央政治局委员。据 1971 年、1972 年中共中央的林彪集团材料，1970 年她对吴法宪说：“如果不设国家主席，林彪怎么办，往那里摆？”8 月庐山九届二中全会前，她嘱咐陈伯达、吴法宪、李作鹏、邱会作“在小组会上要含着眼泪发言”；24 日下午在中南组，按林彪定的口径讲“天才，领袖，指针”，“大讲要设国家主席和‘天才’问题”。会后她不肯交出从会议记录中撕下的自己的发言记录。林立果对林彪的秘书说：“翻车了，倒大霉了，都是他妈的主任（指叶群）搞的”。10 月 15 日毛泽东在她的书面检讨上批评她“爱吹不爱批，爱听小道消息，经不起风浪”。
      cites: [ws-1969-04-28-9th-cc-plenum, ws-1971-12-lin-chen-material-1, ws-1972-lin-material-3]
    - h: 政变密谋与出逃
      from: 1970-10
      to: 1971-09-13
      text: |
        据 1980 年起诉书，1970 年 10 月林立果的“调研小组”组成“联合舰队”，“叶群为周宇驰、王飞等规定了人名代号”；1972 年材料影印了她亲笔写的代号单。1971 年 2 月林彪、叶群、林立果在苏州密谋后，派林立果到上海制订“《五七一工程》纪要”。9 月 5 日、6 日，她先后得到周宇驰、黄永胜关于毛泽东南巡谈话的密报；9 月 10 日黄永胜与她“五次通电话，最长的两次分别达九十分钟和一百三十五分钟”。

        9 月 12 日深夜，林彪、叶群、林立果得知周恩来追查飞机，乘车赶往山海关机场，“于九月十三日零点卅二分强行起飞外逃”。9 月 18 日中共中央通知：三叉戟“已于蒙古境内温都尔汗附近坠毁。林彪、叶群、林立果等全部烧死”。揭发林彪、叶群、林立果“私调飞机、阴谋叛国投敌”的，是他们的女儿林立衡。
      cites: [ws-1980-indictment, ws-1972-lin-material-3, ws-1971-09-18-notice]
  assess:
    - { voice: doc, text: 爱吹不爱批，爱听小道消息，经不起风浪（毛泽东 1970 年 10 月 15 日批叶群检讨，据 1971 年中央材料）, cite: ws-1971-12-lin-chen-material-1, quote: true }
    - { voice: official1966, text: 林彪、叶群、林立果等全部烧死，成为死有余辜的叛徒卖国贼（1971 年 9 月 18 日中共中央通知）, cite: ws-1971-09-18-notice, quote: true }
    - { voice: judicial1980, text: 叶群（原中共第九届中央政治局委员，林彪之妻）……都是林彪、江青反革命集团案的主犯（1981 年特别法庭判决书；因已死亡不再追究刑事责任）, cite: ws-1981-01-25-judgment }
