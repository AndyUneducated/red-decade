  tier: 1
  role1966: 中央书记处书记、中央文革小组顾问
  bio: 中共早期工运和特工干部，1930 年代在莫斯科任驻共产国际代表团副团长，延安时期主管中央社会部（情报与保卫），主持整风审干中的“抢救运动”。1962 年复出任书记处书记，文革中任中央文革小组顾问、政治局常委，1973 年任中央副主席，1975 年病逝时享有极高规格悼词。1980 年中共中央撤销悼词、开除党籍，1981 年判决书列为反革命集团主犯。五人小组成员中唯一站在毛泽东一边者：1966 年 2 月 3 日会上“以康生同志为代表”的一方主张揭露吴晗“政治问题、要害问题”。
  life:
    - h: 家世与早年
      from: 1898
      to: 1933
      text: |
        1898 年生于山东胶县大台庄一个地主家庭，原名张宗可。早年在青岛礼贤书院等处读书，曾在家乡任小学教员。1924 年到上海大学社会学系学习，1925 年入党，参与领导上海工人第三次武装起义。此后在上海从事工运和党的秘密工作，任沪东区委书记、江苏省委组织部长等职。1931 年后任中央特科负责人之一、中央组织部部长。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 莫斯科与延安
      from: 1933
      to: 1949
      text: |
        1933 年 7 月赴莫斯科，任中共驻共产国际代表团副团长（团长王明），参与苏联肃反时期对旅苏中共党员的审查。1937 年 11 月与王明一同回延安，此后转而靠近毛泽东。1938 年起任中央社会部部长、中央情报部部长，主管情报和保卫工作。1943 年整风后期主持审干，提出“抢救失足者”，大批干部被打成“特务”，后由毛泽东出面道歉、甄别。1947 年参加晋绥土改，有“左”的偏差。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 建国后的沉浮
      from: 1949
      to: 1965
      text: |
        建国初任山东分局书记，不久称病长期休养。1956 年八大由政治局委员降为候补委员。1958 年后回中央主管理论和对外宣传，参加中苏论战的写作班子（“钓鱼台写作班子”）。1962 年 9 月八届十中全会上指控小说《刘志丹》是“利用小说反党”，导致习仲勋等人被审查，同会增选为中央书记处书记。1964 年任文化革命五人小组成员。
      verify: true
      cites: [ccp-figures-bios]
    - h: 文化大革命
      from: 1966
      to: 1975
      text: |
        1966 年 2 月五人小组会议上主张揭露吴晗“政治问题”，与彭真分歧；5 月任中央文革小组顾问，并通过曹轶欧推动北京大学聂元梓等写出 5 月 25 日的大字报。8 月进入政治局常委。据起诉书和判决书：他与江青、陈伯达决定剥夺刘少奇行动自由，参与指挥刘少奇专案组；1967 年制造“新疆叛徒集团”冤案；1968 年与谢富治制造云南“赵健民特务案”，煽动挖“内人党”，内蒙古“有三十四万六千多名干部、群众遭到诬陷、迫害，一万六千二百二十二人被迫害致死”；1968 年 1 月下令对刘仁、冯基平等人“铐起来，进行严厉地突击地审讯”。

        1969 年九大、1973 年十大连任常委，十大任中央副主席。晚年患膀胱癌，1975 年曾对王海容、唐闻生说江青、张春桥有叛徒问题，托她们转告毛泽东（据亲历者回忆，待核）。1975 年 12 月 16 日在北京病逝。
      cites: [ws-1966-05-16-notice-attachment@1966-02-03, ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 身后
      from: 1975
      text: |
        1975 年 12 月 21 日追悼大会由邓小平致悼词，称他为“无产阶级革命家、理论家”“光荣的反修战士”，骨灰安放于八宝山革命公墓。1978 年十一届三中全会决定审查康生、谢富治。1980 年 10 月 16 日中共中央转发中纪委关于康生、谢富治问题的两个审查报告，称两人“政治品质表现恶劣”，“直接参与林彪、江青等人篡党夺权的反革命阴谋活动，犯下严重罪行”，撤销悼词并开除党籍，骨灰移出八宝山。1981 年判决书把他列为林彪、江青反革命集团案主犯。
      cites: [ws-1980-kang-xie-reports, ws-1981-01-25-judgment]
      verify: true
  assess:
    - { voice: officialLater, text: 直接参与林彪、江青等人篡党夺权的反革命阴谋活动，犯下严重罪行（1980 年中共中央批语）, cite: ws-1980-kang-xie-reports, quote: true }
    - { voice: judicial1980, text: 在康生、谢富治的唆使下，内蒙古自治区因“内人党”等冤案，有三十四万六千多名干部、群众遭到诬陷、迫害，一万六千二百二十二人被迫害致死, cite: ws-1980-indictment, quote: true }
    - { voice: scholar, text: 拜伦与皮克（John Byron, Robert Pack）的传记把康生描绘为“毛的特务头子”，强调他的苏联肃反经历对延安审干和文革专案的影响；该书多依据二手材料，细节需与中方档案对照。, cite: byron-pack-kang }
