      text: |
        1967 年 8 月底，毛泽东决定处理王力、关锋，两人于 8 月 30 日被隔离审查，此后关押于秦城监狱。1982 年获释，被开除党籍，没有受审。晚年继续研究先秦哲学和《庄子》，2005 年 3 月 3 日在北京去世。
