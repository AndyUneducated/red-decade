  bio: 红四方面军出身的军人，刘邓部下，1955 年授上将衔；1959 年起任公安部长，文革中倒向中央文革小组，“在全国煽动‘砸烂公检法’”，并兼任北京市革委会主任，参与“刘少奇、王光美专案组”逼供。1969 年进入政治局，1972 年病死时仍在任，获得悼词。1980 年中央撤销悼词、开除党籍；1981 年判决书把他列为林彪、江青反革命集团已死亡的主犯之一。
  life:
    - h: 早年与红四方面军
      from: 1909
      to: 1937
      text: |
        1909 年生于湖北黄安（今红安）。1930 年参加红军，1931 年入党，在红四方面军做政治工作，历任团政委、师政治部主任等职，参加长征。
      verify: true
      cites: [klein-clark-1971]
    - h: 抗战、解放战争与云南
      from: 1937
      to: 1959
      text: |
        抗战期间任八路军一二九师三八五旅政委、太岳纵队政委等职，长期在刘伯承、邓小平部下。解放战争中任第二野战军第三兵团政委，参加淮海、渡江和进军西南。建国后在西南工作，1955 年授上将衔，任云南省委第一书记、昆明军区第一政委。
      verify: true
      cites: [ccp-figures-bios]
    - h: 公安部长
      from: 1959
      to: 1966
      text: |
        1959 年 9 月接替调任总参谋长的罗瑞卿任公安部长，1965 年任国务院副总理。社教运动中带工作队在沈阳冶炼厂蹲点，1965 年 5 月 8 日中央把他的报告转发全国，称该厂运动“不论在政治上、经济上、思想上、组织上都获得了很大的成绩”。报告说查出了“一百零五名逃亡漏网、长期隐藏的地、富、反、坏分子”，并把全厂五千八百多名职工“减掉了二千零八十名”。
      cites: [ws-1965-05-08-xie-fuzhi-shenyang]
    - h: 文化大革命
      from: 1966
      to: 1972
      text: |
        文革开始后与中央文革小组站在一起。据 1980 年起诉书，“谢富治在全国煽动‘砸烂公检法’”，公安部除他和另一名兼职副部长外，其他副部长都被逮捕关押；他与康生等制造“罗瑞卿为首的地下黑公安部”等冤案。据判决书，他伙同江青、康生指挥“刘少奇、王光美专案组”逼供，制造伪证；与康生一起制造云南“赵健民特务案”，煽动“内人党”冤案；1968 年 12 月制造“中国（马列）共产党”假案，诬陷朱德、陈毅等人。1967 年 4 月任北京市革命委员会主任，据判决书，北京市领导干部刘仁、邓拓、吴晗、乐松生在此期间被迫害致死。1969 年九大当选政治局委员。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 死亡与身后
      from: 1972
      text: |
        1972 年 3 月 26 日病死于北京，中央发给悼词，骨灰安放八宝山。十一届三中全会后中纪委对他立案审查，1980 年 10 月 16 日中央转发审查报告，认定他“直接参与林彪、江青等人篡党夺权的反革命阴谋活动，犯下严重罪行”，撤销《悼词》，开除党籍。1981 年特别法庭判决把他列为林彪、江青反革命集团案主犯，因已死亡“不再追究刑事责任”。
      cites: [ws-1980-kang-xie-reports, ws-1981-01-25-judgment]
      verify: true
  assess:
