        1937 年到晋察冀边区，1938 年起主持《抗敌报》，后改名《晋察冀日报》，在游击环境中坚持出报。1944 年主持编辑五卷本《毛泽东选集》，是最早的毛选版本之一。
      verify: true
      cites: [ccp-figures-bios]
    - h: 《人民日报》总编辑
      from: 1949
      to: 1958
      text: |
