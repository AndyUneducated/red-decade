        刘少奇 1966 年 10 月检讨说，他“过份相信王光美同志在一个大队蹲点的经验，让她在几个地方作了介绍”，“后来又把她的讲话记录批发到全国”。1967 年的调查材料则把“桃园四清经验”说成“修正主义的四清，经济主义的四清”。
