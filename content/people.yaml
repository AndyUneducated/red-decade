    - { date: 2002, text: 骨灰葬于北京福田公墓，墓碑刻“先母李云鹤之墓”, verify: true }
  tier: 1
  role1966: 中央文革小组第一副组长
  bio: 1930 年代上海影剧演员，1937 年到延安，1938 年与毛泽东结婚。1960 年代以“京剧革命”和“样板戏”进入政治，文革中任中央文革小组第一副组长、代理组长，1969 年进入政治局，是“四人帮”的首要人物。1976 年 10 月 6 日被隔离审查，1981 年被特别法庭判处死刑缓期二年执行，1991 年在保外就医期间自杀。1966 年 2 月受林彪委托召开部队文艺工作座谈会，形成提出“文艺黑线专政”论的《纪要》。
  life:
    - h: 家世与早年
      from: 1914
      to: 1937
      text: |
        1914 年 3 月生于山东诸城，原名李进孩，后名李云鹤。幼年随母离家，辗转济南、天津。1929 年考入山东省立实验剧院学习话剧，1931 年到青岛大学图书馆做职员并旁听课程，与中共地下党员俞启威（黄敬）同居，1933 年经俞介绍入党。

        1933 年到上海，参加左翼戏剧活动，以艺名“蓝苹”演出《娜拉》《大雷雨》和电影《王老五》等。1934 年 10 月在上海被捕，数月后出狱；出狱经过与是否写过“自首”声明，日后成为她的政治隐患，文革中经手过此事的知情人多遭迫害。1936 年与影评人唐纳的婚变成为上海小报新闻。
      verify: true
      cites: [ccp-figures-bios]
    - h: 延安与毛泽东
      from: 1937
      to: 1949
      text: |
        1937 年 8 月到延安，入中央党校、鲁迅艺术学院学习、任教。1938 年 11 月与毛泽东结婚；中央部分领导人对此有保留，相传约定她不担任公开政治职务（此“约法三章”之说缺乏文件证据）。1940 年生女李讷。1947 年随毛转战陕北。
      verify: true
      cites: [ccp-figures-bios]
    - h: 建国后至文革前夜
      from: 1949
      to: 1965
      text: |
        建国后名义上任毛泽东秘书、中宣部电影处处长，1951 年参与发起批判电影《武训传》。1950 年代多次赴苏联治病。1963 年起介入京剧改革，抓《红灯记》《沙家浜》《智取威虎山》等“革命现代京剧”，1964 年京剧现代戏观摩演出大会后影响上升。1965 年在上海与张春桥组织姚文元写作《评新编历史剧〈海瑞罢官〉》，文章 11 月 10 日发表。
      verify: true
      cites: [ws-1966-05-16-notice-attachment]
    - h: 文化大革命
      from: 1966
      to: 1976
      text: |
        1966 年 2 月受林彪委托召开部队文艺工作座谈会，形成《纪要》；5 月任中央文革小组第一副组长，8 月后代理组长，此后以中央文革名义频繁接见红卫兵和造反派。据特别法庭判决书：1966 年 10 月勾结叶群指使江腾蛟非法搜查郑君里等五人的家；1967 年 5 月起直接控制“刘少奇、王光美专案组”；1967 年 7 月与康生、陈伯达决定剥夺刘少奇的行动自由；1968 年 7 月 21 日与康生密谋诬陷八届中央委员、候补委员八十八人。

        1969 年九大进入政治局。1973 年十大后与张春桥、姚文元、王洪文在政治局内结成“四人帮”。1974 年发起“批林批孔”，矛头指向周恩来；毛泽东随后批评她“不要搞四人帮”。1976 年 3 月在对十二省区负责人的谈话中点名诬陷一批干部，4 月推动把天安门事件定为“反革命”。
      cites: [ws-1966-03-army-arts, ws-1966-05-ccrg-list, ws-1981-01-25-judgment, ws-1981-resolution]
      verify: true
    - h: 审判与晚年
      from: 1976
      to: 1991
      text: |
        1976 年 10 月 6 日在中南海被隔离审查。1980 年 11 月起在特别法庭受审，没有委托律师，在法庭上多次与公诉人、证人争吵，判决书记为“江青破坏法庭秩序”。1981 年 1 月 25 日被认定为“林彪、江青反革命集团的首要分子”，判处死刑，缓期二年执行，剥夺政治权利终身。1983 年改判无期徒刑。1984 年起保外就医，1991 年 5 月 14 日在北京居所自缢身亡，新华社以简讯公布。
      cites: [ws-1981-01-25-judgment]
      verify: true
  assess:
    - { voice: judicial1980, text: 江青是林彪、江青反革命集团的首要分子, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: official1981, text: 毛泽东同志先是批准开展所谓“批林批孔”运动，在发现江青等人借机进行篡权活动以后，又对他们作了严厉批评，宣布他们是“四人帮”, cite: ws-1981-resolution, quote: true }
    - { voice: witness, text: 她在法庭上自称“我是毛主席的一条狗，毛主席让我咬谁我就咬谁”（据旁听者转述，原始庭审录音未公开，待核）。 }
    - { voice: scholar, text: 维特克（Roxane Witke）1972 年的访谈录与后来的传记研究多把江青的政治行为与她 1930 年代在上海的经历、在延安所受的排斥联系起来；也有研究者批评这类解释把她个人化、性别化，忽视了毛的授权。, cite: witke-jiang }
