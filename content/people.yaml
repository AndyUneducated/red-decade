      from: 1958
      to: 1965
      text: |
        1958 年任北京市委书记处书记，分管文教，主编市委理论刊物《前线》。1961 年 3 月起以“马南邨”之名在《北京晚报》开设《燕山夜话》专栏，至 1962 年 9 月结束，后结集五册（待核）；本站已收第五集全文，内有《说大话的故事》《为李三才辩护》《燕山碧血》等 28 篇。《说大话的故事》引管子“言不能过其实”，劝人“不要说大话，不要吹牛”。1961 年秋起又与吴晗、廖沫沙在《前线》合写《三家村札记》，三人合署“吴南星”。
      verify: true
      cites: [ws-1962-deng-tuo-yanshan-5, ccp-figures-bios]
    - h: “向阳生”与“三家村”
      from: 1965
      to: 1966
      text: |
        据《五·一六通知》附件大事记：1965 年 11 月 28 日彭真开会时问起吴晗，邓拓答“吴晗很紧张，因为他知道这次批判有来头。”12 月 12 日他以“向阳生”之名在《北京日报》《前线》发表《从〈海瑞罢官〉谈到“道德继承论”》，大事记称此文“企图把对吴晗的批判，从政治问题拉到所谓道德继承的‘学术’问题上去”，并由彭真亲自指导。12 月下旬彭真对上海市委的人说：“邓拓是左派，他署名向阳生的文章是我叫他那样写的。”1966 年 2 月 3 日的五人小组扩大会上，彭真又要刘仁、郑天翔证明“邓拓是拥护三面红旗的”。

        4 月 16 日北京市委在《北京日报》发表吴晗、邓拓、廖沫沙的材料。5 月 9 日《解放军报》《光明日报》发表《邓拓的〈燕山夜话〉是反党反社会主义的黑话》，5 月 10 日姚文元《评“三家村”》在上海发表，次日全国转载。
