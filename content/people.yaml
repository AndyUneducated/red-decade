    - { date: 1970-10-15, s: attacked, note: 毛泽东批评其书面检讨, cite: ws-1971-12-lin-chen-material-1 }
    - { date: 1971-09-13, s: dead, note: 随林彪出逃，坠机身亡, cite: ws-1971-09-18-notice }
  cites: [ws-1969-04-28-9th-cc-plenum, ws-1971-09-18-notice, ws-1971-12-lin-chen-material-1, ws-1972-lin-material-3, ws-1980-indictment, ws-1981-01-25-judgment]

