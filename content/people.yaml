      verify: true
      cites: [ccp-figures-bios]
    - h: 公安部长与总参谋长
      from: 1949
      to: 1965
      text: |
        1949 年 10 月任首任公安部长，兼公安军司令员、政委，主持镇压反革命、肃反等运动。1955 年授大将衔。1959 年庐山会议后，接替黄克诚任总参谋长、国务院副总理，任军委秘书长，在林彪长期休养期间主持军委日常工作。1962 年任中央书记处书记。1964 年主持全军“大比武”，据 1966 年报告，这被批判为“单纯军事观点”，与林彪“突出政治”的方针冲突。
