    - { title: 中国民主同盟中央副主席, orgName: 中国民主同盟, from: 1958, to: 1966, verify: true, note: 起诉书列为“中国民主同盟中央副主席” }
  rehab:
    - { date: 1979, text: 中共北京市委为吴晗及“三家村”冤案平反，恢复名誉, verify: true }
  tier: 2
  role1966: 北京市副市长、明史学者
  bio: 明史学者、北京市副市长、民盟中央副主席，京剧《海瑞罢官》作者。出身农家，由胡适提携入清华治明史，抗战中在昆明成为民主运动中的知名教授。建国后任副市长十七年。1965 年 11 月 10 日姚文元《评新编历史剧〈海瑞罢官〉》发表，揭开文革序幕；12 月 27 日他发表自我批评，自陈《论海瑞》“是根据庐山会议精神反对右倾机会主义的”，官方大事记称这“自己暴露了自己的要害”。1966 年 4 月被北京市委公开点名，与邓拓、廖沫沙合称“三家村”。1968 年被捕，1969 年 10 月 11 日死于关押中，起诉书与判决书均列为“被迫害致死”。1979 年平反。
  life:
    - h: 农家子与清华明史
      from: 1909
      to: 1937
      text: |
        1909 年 8 月 11 日生于浙江义乌苦竹塘村，原名吴春晗，字辰伯。1928 年入上海中国公学，受校长胡适赏识；1931 年经胡适推荐入清华大学史学系，专攻明史，1934 年毕业后留校任教。
      verify: true
      cites: [su-wang-wuhan-bio, ccp-figures-bios]
    - h: 昆明与民主运动
      from: 1937
      to: 1949
      text: |
        1937 年到昆明任云南大学教授，1940 年转西南联合大学。1943 年加入中国民主同盟，在昆明的民主运动中成为知名的左翼教授，并写成朱元璋传记的初稿。1946 年随清华复员回北平，1948 年进入华北解放区。
      verify: true
      cites: [su-wang-wuhan-bio]
    - h: 学者副市长与《海瑞罢官》
      from: 1949
      to: 1964
      text: |
        1949 年 11 月任北京市副市长，分管文教，兼民盟领导职务；1957 年秘密入党（待核）。1959 年响应毛泽东提倡“海瑞精神”的号召，先后写《海瑞骂皇帝》《论海瑞》，年底着手写京剧《海瑞罢官》，1961 年由北京京剧团上演。
      verify: true
      cites: [su-wang-wuhan-bio, ws-1966-05-16-notice-attachment@1966-01-02]
    - h: 姚文元文章与“自我批评”
      from: 1965
      to: 1966
      text: |
        据 1966 年《五·一六通知》附件大事记：1965 年 11 月 10 日姚文元文章在上海发表后，北京各报刊十八天不转载；11 月 28 日彭真开会时问“吴晗现在怎样？”，邓拓答“吴晗很紧张，因为他知道这次批判有来头。”

        12 月 27 日《北京日报》发表他的《关于〈海瑞罢官〉的自我批评》，称剧本以《论海瑞》为基础，而《论海瑞》“是根据庐山会议精神反对右倾机会主义的”，大事记认为这“自己暴露了自己的要害”。1966 年 1 月 2 日彭真召集的会议上，康生说吴晗 1959 年“六月写了《海瑞骂皇帝》，九月写了《论海瑞》，年底，也就是彭德怀罢官以后，开始着手写《海瑞罢官》”，要害是“罢官”。3 月，北京市委派他化名“老李”下乡参加四清工作队。
      cites: [ws-1966-05-16-notice-attachment@1965-11-28, ws-1966-05-16-notice-attachment@1966-01-02, ws-1966-05-16-notice-attachment@1965-12-27, ws-1966-05-16-notice-attachment@1966-03-02]
    - h: 点名、关押与死亡
      from: 1966
      to: 1969
      text: |
        1966 年 4 月 16 日，北京市委在《北京日报》以三个版发表吴晗、邓拓、廖沫沙的材料。5 月 18 日林彪在政治局扩大会议上说：“大大小小的邓拓、吴晗、廖沫沙，大大小小的‘三家村’，不少哩！”6 月《红旗》社论称吴晗、翦伯赞是史学界的“反共老手”；1967 年批彭德怀的文章称他为“资产阶级司令部的座上客”。

        此后被反复批斗，1968 年 3 月被捕关押（待核），1969 年 10 月 11 日死于关押中；妻子袁震已先于同年去世（待核）。1980 年起诉书列他为被诬陷的北京市副市长和民盟中央副主席之一，“刘仁、邓拓、吴晗、乐松生被迫害致死”。
      verify: true
      cites: [ws-1966-05-16-notice-attachment@1966-04-16, ws-1966-05-18-lin-speech, ws-1966-06-red-flag-long-live, ws-1967-08-16-peng-dehuai, ws-1980-indictment, su-wang-wuhan-bio]
    - h: 平反
      from: 1979
      text: |
        1979 年中共北京市委为“三家村”冤案平反，为吴晗恢复名誉并举行追悼会（待核）。1984 年苏双碧、王宏志出版《吴晗传》。
      verify: true
      cites: [su-wang-wuhan-bio]
  assess:
    - { voice: official1966, text: 吴晗的《海瑞罢官》同庐山会议联系起来，这就自己暴露了自己的要害（《五·一六通知》附件大事记）, cite: ws-1966-05-16-notice-attachment, quote: true }
    - { voice: official1966, text: 其中，有些人是反共老手。吴晗、翦伯赞就是这样的人物（1966 年 6 月《红旗》社论《无产阶级文化大革命万岁》）, cite: ws-1966-06-red-flag-long-live, quote: true }
