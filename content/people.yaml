  tier: 1
  role1966: 国防部长 → 中共中央唯一副主席
  bio: 红军和解放军最重要的野战指挥员之一，平型关、辽沈、平津战役的指挥者，1955 年授元帅衔。1959 年接替彭德怀任国防部长，推动“学习毛主席著作”和《毛主席语录》。文革中被确定为“毛主席的第一位助手和毛主席的接班人”，1969 年写入党章；1970 年庐山会议后与毛决裂，1971 年 9 月 13 日乘机出逃，坠毁于蒙古温都尔汗。8 月 18 日代表毛泽东讲话，号召“大破一切剥削阶级的旧思想，旧文化，旧风俗，旧习惯”。
  life:
    - h: 家世与早年
      from: 1907
      to: 1927
      text: |
        1907 年 12 月 5 日生于湖北黄冈回龙山林家大湾，原名林育容。少年时在武昌共进中学读书，受堂兄林育南（中共早期工运领袖）影响，参加进步学生活动，1925 年加入社会主义青年团。同年冬考入黄埔军校第四期，毕业后到叶挺独立团任见习排长，参加北伐。1927 年 8 月随部参加南昌起义。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 红军将领
      from: 1928
      to: 1937
      text: |
        1928 年随朱德、陈毅上井冈山，在红四军中由连长升至团长、纵队司令员、军长。1932 年任红一军团军团长，年仅二十四岁，参与指挥中央苏区历次反“围剿”。长征中率一军团为前锋，1935 年会理会议前曾写信要求改换军事指挥，受毛泽东批评。到陕北后任红军大学（后抗日军政大学）校长。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 抗战与东北
      from: 1937
      to: 1949
      text: |
        1937 年任八路军一一五师师长，9 月指挥平型关战斗。1938 年 3 月在山西被阎锡山部哨兵误伤，1938 年底赴苏联治疗，1942 年回延安。1945 年七大当选中央委员，同年赴东北，任东北民主联军总司令。1946 年四平战役后坚持“让开大路、占领两厢”，逐步扭转东北局势。1948 年 9–11 月指挥辽沈战役，随即入关与华北部队指挥平津战役。1949 年率第四野战军南下至海南岛。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 建国后至文革前
      from: 1949
      to: 1965
      text: |
        建国后任中南军政委员会主席、中南军区司令员。1950 年以健康原因未赴朝鲜指挥作战（具体缘由各说不一）。1954 年任国务院副总理，1955 年授元帅衔。1958 年 5 月八届五中全会增选为中央副主席。1959 年庐山会议后接替彭德怀任国防部长、主持军委日常工作，提出“四个第一”，推行“活学活用毛主席著作”，1964 年总政治部编印《毛主席语录》。1965 年 12 月上海会议上，林彪方面揭发罗瑞卿，罗被停职。
      verify: true
      cites: [ccp-figures-bios]
    - h: 文化大革命
      from: 1966
      to: 1971
      text: |
        1966 年 2 月委托江青召开部队文艺工作座谈会；5 月 18 日在政治局扩大会议上作关于“政变”的讲话。八届十一中全会后成为唯一的中央副主席，8 月 18 日在天安门大会上代表毛泽东讲话。1980 年起诉书指控他 8 月 11–14 日指使叶群、雷英夫编造诬陷刘少奇的材料，12 月 6 日诬陷邓小平是“黑帮分子”。1969 年九大党章写明：“林彪同志是毛泽东同志的亲密战友和接班人。”

        1970 年 8 月九届二中全会（庐山会议）上与陈伯达等坚持设国家主席、称毛为“天才”，遭毛泽东批判。此后毛采取“甩石头、挖墙角、掺沙子”的办法削弱林的军委办事组。据起诉书与判决书，林立果在 1971 年 3 月制订《“571 工程”纪要》，9 月 8 日林彪下达手令“盼照立果、宇驰同志传达的命令办”；谋杀计划失败后，9 月 13 日零时三十二分从山海关强行起飞外逃，在蒙古温都尔汗机毁人亡，同机叶群、林立果等九人全部死亡。
      cites: [ws-1966-08-18-lin-speech, ws-1969-04-constitution, ws-1971-12-lin-chen-material-1, ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 身后与争议
      from: 1971
      text: |
        1971 年 12 月起中共中央陆续下发三批《粉碎林陈反党集团反革命政变的斗争》材料，把林定为“资产阶级野心家、阴谋家、反革命两面派、叛徒、卖国贼”。1973 年十大前永远开除其党籍。1980–1981 年特别法庭把他列为林彪、江青反革命集团案主犯，因已死亡不再追究。

        争议集中在三点：一是林彪本人对“571 工程”和谋杀计划知情、参与到什么程度；二是 9 月 13 日出逃是主动叛逃还是被叶群、林立果裹挟；三是坠机原因（燃油、迫降失败等）。林的部下回忆（如吴法宪、邱会作、李作鹏回忆录）与官方结论有出入；官方结论以起诉书和判决书为准。
      cites: [ws-1971-12-lin-chen-material-1, ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 家庭
      text: |
        1937 年在延安与刘新民（张梅）结婚，生女林晓琳；1942 年与叶群结婚，生女林立衡（林豆豆）、子林立果。叶群、林立果与其同机身亡；林立衡在出逃前向中央警卫部队报告了林彪的行踪（据官方材料）。
      verify: true
      cites: [ws-1981-01-25-judgment]
  assess:
    - { voice: official1966, text: 林彪同志是毛泽东同志的亲密战友和接班人, cite: ws-1969-04-constitution, quote: true }
    - { voice: judicial1980, text: 外逃叛国，途中机毁人亡, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: scholar, text: 部分海外研究（如丁凯文主编《重审林彪罪案》）认为林在文革中多以消极、称病应对，政变计划主要出自林立果；另一些研究者认为林本人知情并默许。官方结论以起诉书、判决书为准。, cite: ding-kaiwen-lin }
  works:
