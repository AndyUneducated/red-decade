  bio: 中央办公厅秘书室出身的年轻历史写作者。1963 年《评〈李秀成自述〉》引起轩然大波，受到毛泽东赏识；1965 年 12 月发表《为革命而研究历史》，毛泽东称“很好，我看了三遍，缺点是没有点名”。1966 年进入中央文革小组，是批判刘少奇、组织群众冲击中央领导人最积极的成员之一：1967 年组织批斗刘少奇大会，指使红卫兵揪斗彭德怀、贴“打倒朱德”标语。1968 年 1 月被隔离审查，1983 年被判处有期徒刑十八年。晚年在上海出版回忆录，2016 年去世。
  life:
