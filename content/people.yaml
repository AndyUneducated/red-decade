    - { date: 1926, s: rise, note: 北伐中任师长、军长, cite: ws-1982-he-long-rehab }
    - { date: 1927-08-01, s: rise, note: 南昌起义总指挥，加入中国共产党, cite: ws-1974-he-long-name }
    - { date: 1928, s: power, note: 创建湘鄂西根据地, cite: ws-1982-he-long-rehab }
    - { date: 1936-07, s: power, note: 红二方面军总指挥, cite: ws-1982-he-long-rehab }
    - { date: 1937-08, s: power, note: 一二〇师师长, cite: ws-1982-he-long-rehab }
    - { date: 1949-12, s: power, note: 西南军区司令员, cite: ws-1982-he-long-rehab }
    - { date: 1954, s: power, note: 国务院副总理 }
