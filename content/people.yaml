      text: |
        1966 年 6 月 3 日新华社电：“由中共中央华北局第一书记李雪峰同志兼任北京市委第一书记，调中共吉林省委第一书记吴德同志任北京市委第二书记”。同日新市委决定派以张承先为首的工作组进驻北京大学，撤销陆平、彭珮云的一切职务。7 月 28 日新市委发布《关于撤销各大专学校工作组的决定》，称派工作组的办法“经验证明，已不适应上述的革命要求”。

        据刘少奇 1967 年 7 月的检讨，1966 年 8 月 1 日他“到李雪峰同志处同北京新市委的同志一起研究”，决定去建筑工业学院，“李雪峰同志也决定一同去”；8 月 3 日晚他与李雪峰、谷牧、戚本禹再到该院。
