    - h: 从“五人小组”到中央文革
      from: 1966
      to: 1966
      text: |
        1966 年 2 月 3 日参加彭真召集的五人小组扩大会，二月提纲规定的五人小组“办公室由许立群、胡绳、吴冷西、姚溱、王力、范若愚等同志组成”。三个月后二月提纲被撤销，他却被列入 5 月 28 日成立的中央文化革命小组，是少数从彭真的班子转到中央文革的人。12 月与贾一学、李鑫合写《红旗》社论《无产阶级专政和无产阶级文化大革命》。
      cites: [ws-1966-02-outline, ws-1966-05-ccrg-list, ws-1966-red-flag-index]
    - h: 揪“军内一小撮”与七二〇事件
      from: 1967-01
      to: 1967-08
      text: |
        据 1980 年起诉书，“一九六七年一月，林彪亲笔批示‘完全同意’‘中央文化革命小组’成员关锋、王力等提出的‘彻底揭穿军内一小撮走资本主义道路的当权派’的口号”。7 月与谢富治到武汉处理两派冲突，表态支持“工人总部”等造反派，20 日其住地被“百万雄师”群众和部分军人冲击，他本人被绑架、殴打。武汉军区 7 月 26 日的公告称这是“明目张胆地反对我们的伟大的领袖毛主席”的“叛变行动”，把王任重和陈再道定为“罪魁祸首”。王力回到北京时受到盛大欢迎。8 月 1 日《红旗》社论提出要把“军内一小撮走资本主义道路当权派揭露出来”。
      cites: [ws-1980-indictment, ws-1967-07-26-wuhan-notice, ws-1967-08-01-gun]
      verify: true
    - h: 八七讲话与倒台
      from: 1967-08
      to: 1982
      text: |
        8 月 7 日接见外交部造反派，据起诉书说：“揪陈毅大方向当然对”，“打倒刘、邓、陈的口号为什么不能喊”？外交部随即被造反派夺权，英国驻华代办处 8 月 22 日被焚。8 月底毛泽东表示王力、关锋“是坏人”，30 日两人被隔离审查，此后长期关押于秦城监狱。1982 年 1 月获释，被开除党籍，没有受审。晚年写成《王力反思录》，为自己在 1967 年的言行辩解，认为“八七讲话”是奉命行事。1996 年 10 月 21 日在北京去世。
