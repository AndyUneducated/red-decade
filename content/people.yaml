  tier: 1
  role1966: 国家主席、中共中央副主席
  bio: 中国共产党早期工人运动领袖、白区工作和党的建设方面的主要领导人，建国后长期位居党内第二，1959 年起任国家主席。文革中被定为“党内最大的走资本主义道路当权派”，1968 年被永远开除出党，1969 年在开封被迫害致死，1980 年平反。1966 年 6–7 月主持中央日常工作时决定向北京高校派工作组，10 月 23 日在中央工作会议上作检讨，其结构与《炮打司令部》的指控逐项对应。
  life:
    - h: 家世与早年
      from: 1898
      to: 1921
      text: |
        1898 年 11 月 24 日生于湖南宁乡炭子冲，兄弟中排行第九，乳名“九满”。幼读私塾，1916 年入长沙宁乡驻省中学，后入育才中学。1920 年加入中国社会主义青年团，在上海外国语学社学俄语。1921 年到莫斯科东方劳动者共产主义大学学习，同年在莫斯科加入中国共产党。
      cites: [ws-1980-02-29-liu-rehab]
      verify: true
    - h: 工人运动
      from: 1922
      to: 1929
      text: |
        1922 年回国，到安源与李立三领导路矿工人大罢工，后任安源路矿工人俱乐部总主任。1925 年任中华全国总工会副委员长，参与领导五卅运动。同年冬因病回湖南，在长沙被军阀赵恒惕逮捕，经全国总工会通电和各方营救，1926 年 1 月 16 日获释后转赴广州。1927 年任湖北省总工会秘书长，经历武汉“四·三”惨案和汪精卫“分共”。

        1929 年 8 月 22 日任满洲省委书记期间在沈阳奉天纱厂被捕，未暴露身份，半个多月后“不予起诉，取保释放”。这两次被捕在 1968 年都被定为“叛变”；1980 年的复查逐条否定，见下文“文化大革命”与“平反”。
      cites: [ws-1980-02-29-liu-rehab]
      verify: true
    - h: 白区工作与华中、延安
      from: 1930
      to: 1949
      text: |
        1932 年进入中央苏区，任中华全国总工会苏区执行局委员长，参加长征和遵义会议。1936 年以中央代表身份到天津主持北方局，化名“胡服”；同年初派人与南京方面接触谈判联合抗日。1936 年批准北方局请示，让关押在北平草岚子监狱的薄一波等人履行出狱手续，此事在 1967 年被定为“六十一人叛徒集团案”。

        1939 年在延安作《论共产党员的修养》讲演。1941 年皖南事变后任重建的新四军政治委员、中原局（后华中局）书记。1943 年 3 月任中央书记处书记、中央军委副主席。1945 年七大作《关于修改党章的报告》，系统阐述“毛泽东思想”。1946 年初主持起草关于“和平民主新阶段”的指示；1947 年任中央工作委员会书记，在西柏坡主持全国土地会议。
      cites: [ws-1980-02-29-liu-rehab]
      verify: true
    - h: 建国后十七年
      from: 1949
      to: 1965
      text: |
        建国后任中央人民政府副主席、中共中央副主席。1954 年任第一届全国人大常委会委员长，1956 年八大作政治报告，当选中央委员会副主席。1959 年 4 月当选国家主席，毛泽东退居“二线”后实际主持中央“一线”工作。

        1962 年 1 月七千人大会上作书面报告和讲话，认为三年困难的原因是“三分天灾，七分人祸”，主持“调整、巩固、充实、提高”。1963–1965 年主持“四清”运动，王光美的“桃园经验”被推广；1965 年 1 月在《二十三条》讨论中与毛泽东对运动性质发生分歧。1981 年决议列举了他在这一时期提出的“两种劳动制度、两种教育制度”等观点。
      cites: [ws-1981-resolution]
      verify: true
    - h: 文化大革命
      from: 1966
      to: 1969
      text: |
        1966 年 6–7 月在毛泽东离京期间与邓小平决定向北京高校派工作组。8 月 5 日毛泽东写《炮打司令部》，八届十一中全会改组领导机构，刘的排名由第二降至第八。10 月 23 日在中央工作会议上作检讨。12 月 18 日成立“刘少奇、王光美专案组”。1980 年平反决议说他“早在一九六六年冬即被隔离和批斗”；1981 年特别法庭判决书则认定 1967 年 7 月江青与康生、陈伯达决定“对刘少奇进行人身迫害，从此剥夺了他的行动自由”。两份官方文件对隔离起点的说法不同，本站并列。

        专案组在江青、康生、谢富治直接控制下，用逼供取得丁觉群、孟用潜等人的证词，于 1968 年提出《关于叛徒、内奸、工贼刘少奇罪行的审查报告》（平反决议记为九月提出，文件本身标为中发〔68〕155 号）。八届十二中全会据此把他“永远开除出党，撤销其党内外的一切职务”。1969 年 10 月在重病中被押送开封“监护”，11 月 12 日去世，死时用化名“刘卫黄”火化。
      cites: [ws-1968-liu-case-report, ws-1980-02-29-liu-rehab, ws-1981-01-25-judgment, ws-1967-08-bombard-anniv, ws-1966-10-liu-self-criticism]
      verify: true
    - h: 平反与身后
      from: 1978
      text: |
        1978 年 12 月中央以中发 75 号文件否定“六十一人叛徒集团”案。1979 年 2 月中央决定由中纪委和中组部复查刘少奇案。1980 年 2 月 29 日十一届五中全会通过平反决议，逐项否定 1925 年长沙“被捕叛变”、1927 年武汉“内奸”、1929 年沈阳“被捕叛变”等罪名，认定原审查报告“完全是林彪、江青、康生、陈伯达一伙的蓄意陷害”，并决定为他举行追悼会。5 月 17 日追悼大会在人民大会堂举行，骨灰按遗愿撒入大海。1981 年决议称“党内根本不存在所谓以刘少奇、邓小平为首的‘资产阶级司令部’”。
      cites: [ws-1980-02-29-liu-rehab, ws-1981-resolution]
      verify: true
    - h: 家庭
      text: |
        前妻何宝珍（平反决议称“何宝珍烈士”）1934 年在南京遇害。1948 年与王光美结婚。王光美文革中被专案组定为“美蒋特务”，关押十二年；1979 年 3 月中组部结论“政治历史清楚，没有问题”。其兄王光琦也被专案组指为刘“派遣”的情报员，平反决议指出公安部早在 1956 年已撤销对王光琦的怀疑。子女多人在文革中受牵连。
      cites: [ws-1980-02-29-liu-rehab]
      verify: true
