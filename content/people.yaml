      cites: [ws-1966-04-luo-report]
    - h: 倒台与关押
      from: 1965
      to: 1975
      text: |
        1965 年 12 月 8–15 日中央在上海开会，对他“进行了背靠背的斗争”。1966 年 3 月 4 日至 4 月 8 日中央召开讨论他问题的小组会议，3 月 18 日他跳楼自杀，摔伤双腿，会议“只好又转为背靠背的斗争”。4 月 30 日中央工作小组报告列其罪名首条为“敌视和反对毛泽东思想，诽谤和攻击毛泽东同志”，5 月 16 日经中央批转（中发〔66〕268 号）。此后被定为“彭罗陆杨反党集团”主要成员，又被指为“以罗瑞卿为首的地下黑公安部反革命集团”头子。

        1966 年底至 1967 年多次被拉到大会批斗，坐在箩筐里被抬上会场。此后长期关押，1973 年获释，1975 年毛泽东表示对他的审查结论“搞错了”（待核），恢复组织生活。
      cites: [ws-1966-04-luo-report, ws-1980-05-20-luo-rehab]
      verify: true
    - h: 复出与去世
      from: 1977
      text: |
        1977 年 8 月十一届一中全会后任中央军委秘书长，主持军委日常工作，支持真理标准讨论，主持《解放军报》发表《马克思主义的一个最基本的原则》。1978 年 8 月赴联邦德国海德堡治疗伤腿，8 月 3 日术后突发心肌梗塞去世。追悼大会由邓小平代表中央致悼词，为他平反。1980 年 5 月 20 日中央撤销 1966 年的批转文件。
      cites: [ws-1980-05-20-luo-rehab]
