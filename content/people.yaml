      from: 1949-12
      to: 1966-05
      text: |
        1949 年底应邀回国，1951 年因话剧《龙须沟》被北京市人民政府授予“人民艺术家”称号；1957 年写成话剧《茶馆》。历任北京市文联主席、中国文联副主席、中国作家协会副主席（待核）。
      verify: true
    - h: 八月二十三日与太平湖
      from: 1966-08-23
      to: 1966-08-24
      text: |
        1966 年 8 月 23 日，他在北京市文联与萧军、骆宾基等二十余位作家、艺术家一起被红卫兵押往国子监孔庙，在焚烧京剧戏装的火堆旁挨打，头部受伤，深夜被送往派出所，由家人接回。次日他离家出走，8 月 24 日夜在城西北的太平湖投水身亡（待核）。这几天正是“红八月”北京红卫兵打人最集中的时候。1980 年起诉书把他列在被迫害致死的“著名作家、艺术家”首位；1981 年判决书也列入“社会各界知名人士被迫害致死的”名单。
      verify: true
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, wang-youqin-victims]
    - h: 平反
      from: 1978
      text: |
        1978 年 6 月 3 日北京市在八宝山革命公墓为他举行骨灰安放仪式，宣布平反；因当年未留骨灰，盒中放的是他用过的眼镜、钢笔和毛笔（待核）。
