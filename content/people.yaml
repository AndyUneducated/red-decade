    - { title: 中华人民共和国主席, orgName: 国家主席, from: 1988-04, to: 1993-03, cite: ws-1998-09-yang-shangkun-obituary }
    - { title: 中央军委第一副主席, orgName: 中共中央军委, from: 1989-11, to: 1992-10, cite: ws-1998-09-yang-shangkun-obituary }
  rehab:
    - { date: 1978-12-22, text: 十一届三中全会“审查和纠正了过去对彭德怀、陶铸、薄一波、杨尚昆等同志所作的错误结论”, cite: ws-1978-12-third-plenum }
  bio: 早年留学莫斯科中山大学，属“二十八个半布尔什维克”之列；长征中与彭德怀同率红三军团，此后长期在中央机关工作，从抗战胜利后到 1965 年主持中共中央办公厅近二十年。1965 年 11 月被免去中央办公厅主任，1966 年 5 月被定为“彭罗陆杨反党集团”成员，“被监禁达12年之久”。1978 年底复出，此后任军委常务副主席、国家主席，1989 年参与处理“政治风波”，1993 年退休。
  life:
    - h: 家世与留苏
      from: 1907
      to: 1933
      text: |
        1907 年生于四川潼南。“1926年初由共青团员转为中国共产党党员”，同年 11 月到莫斯科中山大学学习。1931 年初回国，相继任中华全国总工会宣传部长和中共中央宣传部长。
      cites: [ws-1998-09-yang-shangkun-obituary]
    - h: 红三军团与长征
      from: 1933
      to: 1937
      text: |
        1933 年初到中央苏区，6 月任红一方面军政治部主任，1934 年 1 月任红三军团政委，并在六届五中全会上当选中央候补委员。与军团长彭德怀一起参加第五次反“围剿”和长征。遵义会议上“批评博古、李德在军事指挥上的严重错误，拥护毛泽东同志的正确主张”。1935 年 8 月任红军总政治部副主任，随右路军与张国焘斗争。
      cites: [ws-1998-09-yang-shangkun-obituary]
    - h: 北方局与中央机关
      from: 1937
      to: 1965
      text: |
        1937 年 8 月和 11 月先后任中共中央北方局副书记、书记。1941 年回延安，留中央机关工作。抗战胜利后任中央军委秘书长，后任中共中央办公厅主任；1947 年任中央后方委员会副书记，1948 年任中共中央副秘书长。建国后继续任中央办公厅主任，兼中央军委秘书长、中直机关党委书记，1956 年八大当选中央委员、书记处候补书记。
      cites: [ws-1998-09-yang-shangkun-obituary]
    - h: 倒台与监禁
      from: 1965
      to: 1978
      text: |
        1965 年 11 月被免去中央办公厅主任，调任广东省委书记处书记，罪名之一是中办机要部门为毛泽东等领导人谈话秘密录音（所谓“窃听”事件）。1966 年 5 月政治局扩大会议把他与彭真、罗瑞卿、陆定一并列为“反党集团”。据 1980 年起诉书，1968 年康生审定的报告把六十名全国人大常委会委员诬为“叛徒”“特务”等，他是其中之一。讣告称他在文革中“受到林彪、江青两个反革命集团的长期迫害，被监禁达12年之久”。
      cites: [ws-1998-09-yang-shangkun-obituary, ws-1980-indictment]
      verify: true
    - h: 复出、广东与军委
      from: 1978
      to: 1988
      text: |
        十一届三中全会后彻底平反。1978 年 12 月至 1980 年底任广东省委第二书记、广州市委第一书记，参与广东实行特殊政策、试办经济特区。1979 年 9 月补选为中央委员，1980 年 9 月任全国人大常委会副委员长兼秘书长，1981 年 7 月任中央军委常委兼秘书长，1982 年 9 月任军委常务副主席，协助邓小平主持军委日常工作，执行裁军一百万。1982 年进入中央政治局。
      cites: [ws-1998-09-yang-shangkun-obituary]
    - h: 国家主席与 1989 年
      from: 1988
      to: 1998
      text: |
        1988 年 4 月当选国家主席。讣告说他“同党和国家其他领导人一道，处理了发生在1989年春夏之交的政治风波”；作为军委常务副主席，他参与了 1989 年 5 月戒严和 6 月清场的决策与执行，这一点在官方叙述中只以此语带过。1989 年 11 月任军委第一副主席。1992 年 10 月和 1993 年 3 月先后退出政治局、军委和国家主席职务。1998 年 9 月 14 日在北京去世。
      cites: [ws-1998-09-yang-shangkun-obituary]
      verify: true
  assess:
    - { voice: officialLater, text: 杨尚昆同志在“文化大革命”的动乱岁月里，受到林彪、江青两个反革命集团的长期迫害，被监禁达12年之久（1998 年讣告）, cite: ws-1998-09-yang-shangkun-obituary, quote: true }
