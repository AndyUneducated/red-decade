- id: bian-zhongyun
  name: 卞仲耘
  pinyin: Biàn Zhòngyún
  gender: f
  ethnicity: 汉族
  birthplace: 安徽无为
  origin: 安徽无为
  born: 1916
  died: 1966-08-05
  deathKind: killed
  deathPlace: 北京师范大学附属女子中学
  party: 中国共产党
  joinedParty: 1941
  positions:
    - { title: 北京师范大学附属女子中学副校长、党总支书记, orgName: 北京师范大学附属女子中学, from: 1950, to: 1966-08-05, verify: true }
  tier: 3
  role1966: 北京师范大学女附中副校长
  bio: 北京师范大学附属女子中学副校长、党总支书记，该校当时没有正校长，她是实际负责人。1966 年 6 月学生贴大字报批判校领导，工作组撤出后，8 月 5 日下午她在校内被红卫兵学生批斗殴打，当天死亡，年五十岁，被认为是文革中北京第一位被学生打死的教育工作者。同一天毛泽东写下《炮打司令部》。她的丈夫王晶垚保存了遗体照片和当时的材料。本站尚无直接记载她的入库原文，全传待核。
  life:
    - h: 早年
      from: 1916
      to: 1949
      text: |
        1916 年生于安徽无为，1941 年在晋察冀根据地入党，抗战和解放战争时期从事教育和宣传工作（待核）。
      verify: true
      cites: [wang-youqin-victims]
    - h: 师大女附中
      from: 1949
      to: 1966-05
      text: |
        1949 年起在北京师范大学附属女子中学工作，后任副校长、党总支书记；学校没有正校长，她主持日常工作。这所学校的学生中有很多高级干部的女儿（待核）。
      verify: true
      cites: [wang-youqin-victims]
    - h: 八月五日
      from: 1966-06
      to: 1966-08-05
      text: |
        1966 年 6 月初，宋彬彬、刘进等学生贴出学校第一张大字报，批判校领导；工作组进校后，她被停职批判。7 月底工作组撤出，学校由学生组织主持。8 月 5 日下午，她和其他几位校领导被学生押着游斗、劳动，遭到木棍、皮带殴打，傍晚倒在校内，送往医院时已经死亡（待核）。她是文革中北京第一位被学生打死的教育工作者。同一天毛泽东写下《炮打司令部——我的一张大字报》。
      verify: true
      cites: [wang-youqin-victims, ws-1967-08-bombard-anniv]
    - h: 身后
      from: 1966-08
      text: |
        她的丈夫王晶垚当天拍下遗体照片，此后数十年持续收集材料、为她申冤（待核）。1978 年后为她平反。她的死因与参与者的责任，至今仍是当年在场者争论的焦点；2014 年宋彬彬等人公开道歉（待核）。
      verify: true
      cites: [wang-youqin-victims]
  assess:
    - { voice: witness, text: 王友琴据当年师生的口述，确认 8 月 5 日的殴打发生在校内学生组织主持的批斗中，并把卞仲耘列为北京第一位被打死的教育工作者（待核，需对照原书）。, cite: wang-youqin-victims }
  factions: [academics]
  fate:
    - { date: 1941, s: normal, note: 入党, verify: true }
    - { date: 1950, s: power, note: 任师大女附中副校长, verify: true }
    - { date: 1966-06, s: attacked, note: 学生大字报批判校领导, verify: true }
    - { date: 1966-08-05, s: dead, note: 被学生殴打致死, verify: true }
  cites: [wang-youqin-victims]
  verify: true

- id: yu-luoke
  name: 遇罗克
  pinyin: Yù Luókè
  gender: m
  ethnicity: 汉族
