        1963 年发表《评〈李秀成自述〉》，把太平天国忠王李秀成被俘后的自述定性为“投降变节”，引起史学界争论，周扬等人一度要求批评，毛泽东批示支持他。1967 年 8 月《人民日报》《红旗》社论在批判“叛徒集团”时还专门提到“一九六三年戚本禹同志的《评〈李秀成自述〉》一文发表时所引起的一场轩然大波”。此后调《红旗》任历史组组长。1965 年 12 月 8 日在《红旗》发表《为革命而研究历史》，“批评了以翦伯赞、吴晗为代表的反动的历史观，但没有指名”；12 月 21 日毛泽东说：“戚本禹的文章很好，我看了三遍，缺点是没有点名。”1966 年 1 月他写成批判《海瑞罢官》“要害问题”的文章，被许立群压下；3 月与林杰、阎长贵在《红旗》发表《翦伯赞同志的历史观点应当批判》，5 月发表《评〈前线〉〈北京日报〉的资产阶级立场》。
      cites: [ws-1966-05-16-notice-attachment, ws-1966-red-flag-index, ws-1967-08-09-renegades]
    - h: 中央文革小组
      from: 1966-05
      to: 1968-01
      text: |
        1966 年 5 月 28 日被列为中央文化革命小组组员，8 月作为中央文革代表与刘少奇、李雪峰一起去北京建筑工业学院。1967 年 4 月 1 日发表《爱国主义还是卖国主义？》，第一次在报刊上不点名地把刘少奇称为“党内最大的走资本主义道路当权派”（待核）。据 1980 年起诉书：1967 年 1 月底“在戚本禹的策动下，中国人民大学的一些人在北京街头贴出了‘打倒朱德’的大标语”；7 月 18 日由他“组织召开‘批斗刘少奇大会’，进行抄家，对刘少奇、王光美进行人身迫害”；7、8 月间与康生、谢富治等“煽动组织‘揪刘火线’围困中南海”。据 1981 年判决书，1967 年 7 月他“在康生同意下，指使北京航空学院学生韩爱晶组织实施对中共中央政治局委员彭德怀的人身迫害，致使彭德怀被打断肋骨，造成重伤”。
      cites: [ws-1966-05-ccrg-list, ws-1967-07-09-liu-jiangong-review, ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 倒台、判刑与晚年
      from: 1968-01
      to: 2016
      text: |
        王力、关锋倒台后，1968 年 1 月 13 日他也被隔离审查，关押于秦城监狱（待核）。1980 年 7 月 14 日被依法逮捕。北京市人民检察院分院起诉书列举他 1967 年 1 月 12 日在钓鱼台召集中办人员说“中南海冷冷清清，外面轰轰烈烈”，当晚中办秘书局七八十人闯进刘少奇、邓小平、陶铸住处围斗；7 月 18 日凌晨布置“有的搞刘少奇，有的搞邓小平，有的搞陶铸。王光美、卓琳也要搞”。1983 年 11 月 2 日北京市中级人民法院“判处被告人戚本禹有期徒刑十八年，剥夺政治权利四年”。1986 年刑满释放（待核），此后在上海居住。2016 年在香港出版《戚本禹回忆录》，坚持为文革和毛泽东辩护。2016 年 4 月 20 日在上海去世。
      verify: true
      cites: [ws-1983-11-02-qi-benyu-case, qi-benyu-memoir]
  assess:
