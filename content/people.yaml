      text: |
        1906 年 5 月 31 日生于四川南充。1926 年考入武汉中央军事政治学校（黄埔军校武汉分校），1928 年入党，随后到闽西参加红军。历任红四军纵队政委、红十二军政委，1932 年起任红一军团政治保卫局局长，参加长征。到陕北后任中国人民抗日红军大学教育长。
