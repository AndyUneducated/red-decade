  tier: 1
  role1966: 国务院总理、中共中央副主席
  bio: 中国共产党早期军事和组织工作的主要领导人，南昌起义的领导者，建国后任总理二十六年直到去世，长期主持外交。文革中始终位居中央领导核心，既执行毛泽东的部署、在接见红卫兵大会上讲话，又尽力维持国务院运转、保护干部；1966 年官方大事记称他督促彭真转载姚文元文章，4 月书记处会议上与邓小平一起指出彭真“是反对毛主席的”。1981 年决议说他“在‘文化大革命’中处于非常困难的地位”。
  life:
    - h: 家世与求学
      from: 1898
      to: 1924
      text: |
        1898 年 3 月 5 日生于江苏淮安，祖籍浙江绍兴。幼年过继给叔父，由嗣母陈氏启蒙。1910 年随伯父到东北，在沈阳东关模范学校读书。1913 年入天津南开学校，1917 年毕业后赴日本求学，未考取官费学校，1919 年回国。

        五四运动中在天津组织觉悟社，主编《天津学生联合会报》，1920 年 1 月因请愿被捕，关押半年。同年 11 月赴法国勤工俭学，1921 年在巴黎加入共产主义小组，1922 年参与创建旅欧中国少年共产党，后任中共旅欧支部负责人。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 大革命、南昌起义与中央工作
      from: 1924
      to: 1935
      text: |
        1924 年秋回国，任中共广东区委委员长、黄埔军校政治部主任。1927 年 3 月领导上海工人第三次武装起义。四一二政变后到武汉，任中央军事部长。1927 年 8 月 1 日任前敌委员会书记领导南昌起义。

        此后在上海主持中央军事、组织和特科工作，1931 年顾顺章叛变后主持中央机关紧急转移，同年底进入中央苏区，任苏区中央局书记、红军总政治委员，1932 年宁都会议后接替毛泽东指挥红一方面军。1932 年 2 月上海报纸刊出伪造的“伍豪等脱离共产党启事”，此事在文革中被江青等人重新翻出，1968 年和 1972 年周两次就此作说明。遵义会议后与毛泽东、王稼祥组成三人军事指挥小组。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 抗战与内战
      from: 1936
      to: 1949
      text: |
        1936 年 12 月西安事变中代表中共赴西安，促成和平解决。抗战期间长期在武汉、重庆主持南方局和统一战线工作。1945 年七大当选中央委员，1946 年在南京、上海参加国共谈判。1947 年起任中央军委副主席兼代总参谋长，在陕北和西柏坡协助毛泽东指挥作战。1949 年主持筹备新政治协商会议。
      verify: true
      cites: [ccp-figures-bios]
    - h: 建国后十七年
      from: 1949
      to: 1965
      text: |
        1949 年 10 月起任政务院总理兼外交部长，1954 年起任国务院总理。1954 年出席日内瓦会议，同年与印度、缅甸共同倡导和平共处五项原则，1955 年出席万隆会议。1956 年八大当选中央副主席。1956–1957 年与陈云等主张“反冒进”，1958 年 1 月南宁会议上受毛泽东批评，被迫检讨。1962 年在广州会议上宣布知识分子“绝大多数已经是劳动人民的知识分子”。1964 年三届人大提出“四个现代化”。
      cites: [ws-1981-resolution]
      verify: true
    - h: 文化大革命
      from: 1966
      to: 1976
      text: |
        文革前夕督促彭真转载姚文元文章，在《人民日报》按语中加入毛泽东语录；1966 年 4 月书记处会议上与邓小平一起批判彭真。8 月 18 日后在历次接见红卫兵大会上讲话，组织接待全国串联学生，同时开列保护名单，安排部分干部到中南海、三〇一医院等处避难。1967 年 2 月“二月抗争”后受江青等人攻击，北京出现以他为目标的“五一六兵团”传单。

        1971 年林彪事件后在毛泽东支持下主持中央日常工作，1972 年提出批判极左思潮，被毛泽东认为当时任务仍是“反对‘极右’”。1972 年 5 月确诊膀胱癌。1973 年十大再任副主席。1974 年“批林批孔”中，江青等人的“矛头是指向周恩来同志的”。1975 年 1 月四届人大重申“四个现代化”，此后长期住院，由邓小平主持日常工作。
      cites: [ws-1966-05-16-notice-attachment, rmrb-1966-08-18-zhou-speech, ws-1981-resolution, ws-1976-01-09-zhou-obituary]
      verify: true
    - h: 去世与身后
      from: 1976
      text: |
        1976 年 1 月 8 日九时五十七分因癌症在北京逝世，终年七十八岁。讣告称他“是中国人民伟大的无产阶级革命家”，号召学习他的“高尚革命品质”，同时号召“坚持无产阶级专政下的继续革命”。1 月 15 日追悼大会由邓小平致悼词，骨灰按遗愿撒于江河大地。

        当局限制悼念活动，3–4 月南京、北京等地群众自发悼念并抗议“四人帮”，4 月 5 日天安门事件被定为“反革命政治事件”，1978 年平反。1981 年决议称他“为尽量减少‘文化大革命’所造成的损失，为保护大批的党内外干部，作了坚持不懈的努力，费尽了心血”。
      cites: [ws-1976-01-09-zhou-obituary, ws-1981-resolution]
      verify: true
    - h: 家庭
      text: |
        1925 年 8 月与邓颖超在广州结婚，无子女，先后抚育过孙维世、李鹏等多名烈士子女。干女儿孙维世文革中被关押，1968 年死于狱中；特别法庭判决书把她列入被林彪、江青集团迫害致死的著名人士。
      cites: [ws-1981-01-25-judgment]
      verify: true
  assess:
    - { voice: official1966, text: 周恩来同志是中国共产党的优秀党员，是中国人民伟大的无产阶级革命家, cite: ws-1976-01-09-zhou-obituary, quote: true }
    - { voice: official1981, text: 他顾全大局，任劳任怨，为继续进行党和国家的正常工作，为尽量减少“文化大革命”所造成的损失，为保护大批的党内外干部，作了坚持不懈的努力，费尽了心血, cite: ws-1981-resolution, quote: true }
    - { voice: scholar, text: 海外研究（如高文谦《晚年周恩来》）强调周在文革中对毛的顺从与自保，认为他在刘少奇专案等事上签署过关键文件；大陆官方叙述则侧重他对干部的保护。两种评价并存。, cite: gao-wenqian-zhou }
