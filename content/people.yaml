  bio: 中共将领宋任穷之女，北京师范大学附属女子中学学生。1966 年 8 月 18 日在天安门城楼为毛泽东戴上红卫兵袖章，据说毛泽东问其名后说“要武嘛”，随后见报的署名文章题为《我给毛主席戴上了红袖章》，署名“宋要武”。8 月 5 日该校副校长卞仲耘被学生打死，她当时是学校学生负责人之一，其责任至今有争议。2014 年公开向卞仲耘等老师道歉。本站尚无直接记载她的入库原文，全传待核。
  life:
    - h: 家世与中学
      from: 1947
      to: 1966-05
      text: |
        1947 年生，父亲宋任穷是中共高级将领，1966 年时任中共中央东北局第一书记。就读北京师范大学附属女子中学（待核）。
      verify: true
    - h: 师大女附中与八月五日
      from: 1966-06
      to: 1966-08-05
      text: |
        1966 年 6 月初，她与同学刘进等贴出学校第一张大字报，矛头指向校领导。工作组撤出后，学校由学生组织主持，副校长卞仲耘等校领导被批斗；8 月 5 日卞仲耘在批斗中被学生殴打致死，是北京第一位被红卫兵打死的教育工作者（待核）。她当时是学校革命师生代表会的负责人之一，她在事件中的角色，王友琴等寻访者与宋本人及部分同学的说法存在分歧（待核）。
      verify: true
      cites: [wang-youqin-victims]
    - h: 天安门城楼
      from: 1966-08-18
      to: 1966-08
      text: |
        8 月 18 日第一次接见红卫兵大会上，新华社电讯写道：“在大会进行中，师大女附中一个‘红卫兵’，登上天安门城楼给毛主席戴上了‘红卫兵’的袖章。毛主席和她亲切握手。”电讯没有点名。据后来的报道，毛泽东问她的名字，听说是“彬彬”后说“要武嘛”；几天后报上刊出署名“宋要武”的文章《我给毛主席戴上了红袖章》，师大女附中随后改名“红色要武中学”（待核）。
      verify: true
      cites: [rmrb-1966-08-19-first-rally]
    - h: 此后
      from: 1968
      text: |
        此后到内蒙古插队，1970 年代就读长春地质学院，1980 年代赴美留学，获地球化学博士，改名宋岩（待核）。2014 年 1 月她在母校（今北京师范大学附属实验中学）的聚会上公开道歉，表示对卞仲耘等老师的悼念和歉意（待核）。
      verify: true
  assess:
    - { voice: official1966, text: 在大会进行中，师大女附中一个“红卫兵”，登上天安门城楼给毛主席戴上了“红卫兵”的袖章（1966 年 8 月 18 日新华社电）, cite: rmrb-1966-08-19-first-rally, quote: true }
    - { voice: witness, text: 王友琴的寻访认为卞仲耘之死是学校学生领导者主持的批斗所致，宋彬彬作为当时的负责人之一不能免责；宋本人晚年否认参与殴打，并称曾试图劝阻（待核，需对照原书）。, cite: wang-youqin-victims }
  works:
    - { title: 我给毛主席戴上了红袖章（署名宋要武）, date: 1966-08 }
  factions: [oldrg]
  fate:
    - { date: 1966-06, s: rise, note: 贴出学校第一张大字报, verify: true }
    - { date: 1966-08-18, s: rise, note: 新华社当日电只说“师大女附中一个‘红卫兵’”，未点名, cite: rmrb-1966-08-19-first-rally, verify: true }
    - { date: 1968, s: normal, note: 下乡插队, verify: true }
  cites: [rmrb-1966-08-19-first-rally, wang-youqin-victims]
  verify: true

- id: wang-hongwen
  name: 王洪文
  born: 1935-12
  died: 1992-08-03
  tier: 2
  role1966: 上海国棉十七厂保卫科干事
  pinyin: Wáng Hóngwén
  gender: m
  ethnicity: 汉族
  birthplace: 吉林长春
  origin: 吉林长春
  classOrigin: 贫农
  classNote: 出身长春郊区农民家庭（待核）。1977 年十届三中全会定性为“新生资产阶级分子”。
  deathKind: natural
  deathPlace: 北京（服刑期间）
  party: 中国共产党
  joinedParty: 1953
  positions:
    - { title: 上海国棉十七厂保卫科干事, orgName: 上海国棉十七厂, from: 1960, to: 1966-11, verify: true }
    - { title: 上海工人革命造反总司令部司令, orgName: 上海工人革命造反总司令部, from: 1966-11, to: 1967, verify: true }
    - { title: 上海市革命委员会副主任, orgName: 上海市革命委员会, from: 1967-02, to: 1976-10, cite: ws-1981-01-25-judgment }
    - { title: 中共上海市委书记, orgName: 中共上海市委, from: 1971, to: 1976-10, verify: true, note: 起诉书只记逮捕前任此职 }
    - { title: 中共中央副主席、政治局常委, orgName: 中共中央, from: 1973-08, to: 1976-10, cite: ws-1981-01-25-judgment }
  bio: 志愿军退伍军人，上海国棉十七厂保卫干部。1966 年 11 月组织“上海工人革命造反总司令部”（工总司），领导安亭事件和康平路武斗，在张春桥支持下成为上海“一月夺权”的工人领袖。1973 年十大上以三十八岁升任中共中央副主席，位列毛泽东、周恩来之后，被视为接班人人选。“四人帮”成员。1976 年 10 月被隔离审查，1977 年被永远开除党籍，1981 年被判处无期徒刑，1992 年在关押中病死。
  life:
    - h: 早年与入厂
      from: 1935
      to: 1966
      text: |
        1935 年生于吉林长春郊区。1950 年参加中国人民志愿军，在部队当通讯员，入朝作战，1953 年入党。1956 年复员，分配到上海国棉十七厂当保全工，后调厂保卫科任干事。
      verify: true
      cites: [klein-clark-1971]
    - h: 工总司与安亭事件
      from: 1966
      to: 1967
      text: |
        1966 年 6 月在厂里贴出批评厂党委的大字报。11 月 9 日组织成立“上海工人革命造反总司令部”（工总司），任司令。因上海市委不承认，11 月 10 日带领工人卧轨拦车于安亭，造成沪宁线中断；张春桥奉命前往处理，当场签字承认工总司“革命合法”，毛泽东事后表示支持。此后王洪文与张春桥结成紧密关系。

        据 1981 年判决书，“一九六六年十二月二十八日，王洪文参与制造了上海康平路武斗事件，打伤九十一人”；起诉书把 12 月 28 日记为张春桥给妻子打电话、指示“胜利果实不能被赤卫队夺去”的日期，冲突本身多记为 12 月 30 日。1967 年 1 月参与“一月夺权”，2 月任上海市革命委员会副主任。8 月 4 日“组织、指挥了围攻上海柴油机厂的武斗，关押和伤残六百五十人”。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 从上海到中央
      from: 1967
      to: 1976
      text: |
        1969 年九大当选中央委员。1971 年任上海市委书记。1972 年调中央工作，1973 年 8 月十大上作修改党章的报告，当选中共中央副主席、政治局常委，排名在毛泽东、周恩来之后。据起诉书，1974 年 10 月 17 日江青、张春桥、姚文元、王洪文在钓鱼台十七楼密谋，次日由王洪文飞长沙向毛泽东告状，说“北京现在大有庐山会议的味道”，以阻挠邓小平出任第一副总理。毛泽东在 1974–1975 年多次批评他们“不要搞四人帮”。王洪文与张春桥还以上海为基地扩建“民兵武装”，对上海骨干说“军队不能领导民兵”。
      cites: [ws-1980-indictment, ws-1981-01-25-judgment, ws-1976-10-18-notice]
      verify: true
    - h: 被捕、审判与死亡
      from: 1976
      text: |
        1976 年 10 月 6 日被隔离审查。1977 年 7 月十届三中全会认定他是“新生资产阶级分子”，永远开除党籍。1980 年 11 月起在最高人民法院特别法庭受审，认罪；1981 年 1 月 25 日被判处“无期徒刑，剥夺政治权利终身”，罪名包括组织、领导反革命集团罪、阴谋颠覆政府罪、策动武装叛乱罪、反革命伤人罪和诬告陷害罪。1992 年 8 月 3 日因肝病在北京病逝，终年五十六岁。
      cites: [ws-1976-10-18-notice, ws-1977-07-tenth-third-plenum, ws-1981-01-25-judgment]
      verify: true
  assess:
    - { voice: officialLater, text: 永远开除资产阶级野心家、阴谋家、反革命两面派、新生资产阶级分子王洪文的党籍，撤销其党内外一切职务（1977 年十届三中全会）, cite: ws-1977-07-tenth-third-plenum, quote: true }
    - { voice: judicial1980, text: 被告人王洪文，以推翻人民民主专政为目的，组织、领导反革命集团，是反革命集团案的主犯, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: doc, text: 你们要注意呢，不要搞成四人小宗派呢（毛泽东 1974 年 7 月 17 日，见 1976 年中央通知）, cite: ws-1976-10-18-notice, quote: true }
  factions: [rebels, shanghai]
  fate:
    - { date: 1950, s: normal, note: 应征参加志愿军，赴朝鲜（维基百科，未核原件）, cite: zhwiki-wang-hongwen }
    - { date: 1956-09, s: normal, note: 以预备役少尉转业进上海国棉十七厂（维基百科，未核原件）, cite: zhwiki-wang-hongwen }
    - { date: 1966-11-06, s: rise, note: 与潘国平、陈阿大等筹组工总司并任司令（此前数据作 1966-11-09“工总司成立”）（维基百科，未核原件）, cite: zhwiki-wang-hongwen }
    - { date: 1966-11-10, s: rise, note: 率工总司卧轨拦车，安亭事件（维基百科，未核原件）, cite: zhwiki-wang-hongwen }
    - { date: 1967-02, s: power, note: 上海市革委会副主任, cite: ws-1981-01-25-judgment }
    - { date: 1969-04, s: power, note: 九大中央委员（维基百科，未核原件）, cite: zhwiki-wang-hongwen }
    - { date: 1973-08, s: power, note: 中共中央副主席 }
    - { date: 1976-10-06, s: detained, note: 隔离审查, cite: ws-1976-10-18-notice }
    - { date: 1977-07, s: purged, note: 永远开除党籍, cite: ws-1977-07-tenth-third-plenum }
    - { date: 1981-01-25, s: detained, note: 判处无期徒刑, cite: ws-1981-01-25-judgment }
    - { date: 1992-08-03, s: dead }
  cites: [ws-1976-10-18-notice, ws-1977-07-tenth-third-plenum, ws-1980-indictment, ws-1981-01-25-judgment]

