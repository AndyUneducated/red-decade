  tier: 1
  role1966: 中共中央主席
  bio: 中国共产党创始人之一，1935 年遵义会议后逐步成为党和红军的最高领导人，1949 年起任中华人民共和国最高领导人直至去世。文化大革命的发动者和领导者：1965 年秋提出批判吴晗，1966 年 8 月 5 日写《炮打司令部》，8 月 18 日起八次在天安门接见红卫兵。1981 年决议：“这场'文化大革命'是毛泽东同志发动和领导的。”
  life:
    - h: 家世与早年
      from: 1893
      to: 1918
      text: |
        1893 年 12 月 26 日生于湖南湘潭韶山冲一个农民家庭，父毛贻昌（顺生）务农兼贩运粮食，母文七妹。幼年入私塾读经，十三岁辍学务农，同时自读《盛世危言》等书。

        1910 年入湘乡东山高等小学堂，1911 年到长沙，辛亥革命时在湖南新军当了半年列兵。1913 年考入湖南省立第四师范，次年并入第一师范，1918 年毕业。在校期间受伦理学教员杨昌济影响，1917 年在《新青年》发表《体育之研究》（署名“二十八画生”）。1918 年 4 月与蔡和森等发起新民学会。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 从五四到大革命
      from: 1918
      to: 1927
      text: |
        1918 年秋到北京，经杨昌济介绍在北京大学图书馆任助理员，结识李大钊，开始接触马克思主义。1919 年回长沙创办《湘江评论》，参与领导驱逐湖南督军张敬尧的运动。1920 年在长沙参与组建共产主义小组。

        1921 年 7 月作为湖南代表出席中共第一次全国代表大会，会后任中共湘区委员会书记。1923 年三大当选中央局成员。国共合作期间曾任国民党中央宣传部代理部长、广州农民运动讲习所所长。1927 年 3 月发表《湖南农民运动考察报告》。同年 8 月八七会议上提出“政权是由枪杆子中取得的”。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 井冈山、中央苏区与长征
      from: 1927
      to: 1935
      text: |
        1927 年 9 月领导湘赣边界秋收起义，失利后率部上井冈山，建立第一个农村革命根据地；同年 11 月被临时中央以“军事投机”撤销政治局候补委员。1928 年 4 月与朱德部会师，组成红四军。1929 年 12 月主持古田会议。1931 年 11 月任中华苏维埃共和国临时中央政府主席。

        1932 年 10 月宁都会议后被解除红一方面军总政委职务，此后长期不能过问军事。1934 年 10 月随中央红军长征。1935 年 1 月遵义会议上当选政治局常委，此后与周恩来、王稼祥组成三人军事指挥小组，在党和红军中的领导地位由此确立。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 延安时期
      from: 1935
      to: 1949
      text: |
        1935 年 10 月到达陕北。全面抗战爆发后提出持久战、敌后游击战的方针，写《实践论》《矛盾论》《论持久战》《新民主主义论》。1942 年起领导延安整风运动，1943 年 3 月任政治局主席和书记处主席。1945 年七大把毛泽东思想写入党章，七届一中全会选他为中央委员会主席。

        1945 年 8 月赴重庆与蒋介石谈判。1947 年 3 月撤离延安，化名“李德胜”转战陕北，1948 年到西柏坡，指挥辽沈、淮海、平津三大战役。1949 年 3 月主持七届二中全会。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 建国后十七年
      from: 1949
      to: 1965
      text: |
        1949 年 10 月 1 日宣告中华人民共和国成立，任中央人民政府主席，同年底至次年初访苏，签订《中苏友好同盟互助条约》。1950 年决定出兵朝鲜，长子毛岸英在朝鲜阵亡。1953 年提出过渡时期总路线，1954 年当选国家主席。

        1956 年作《论十大关系》，提出“百花齐放、百家争鸣”。1957 年 2 月作《关于正确处理人民内部矛盾的问题》，随后发动反右派斗争。1958 年发动“大跃进”和人民公社化运动。1959 年 4 月不再连任国家主席，退居“二线”；7–8 月庐山会议批判彭德怀。1962 年七千人大会上作自我批评，同年八届十中全会提出“千万不要忘记阶级斗争”。1981 年决议认为这一时期“他的个人专断作风逐步损害党的民主集中制，个人崇拜现象逐步发展”。
      cites: [ws-1981-resolution]
      verify: true
    - h: 文化大革命
      from: 1966
      to: 1976
      text: |
        1966 年 5 月主持通过《五·一六通知》，8 月在八届十一中全会期间写《炮打司令部——我的一张大字报》，把刘少奇、邓小平定为“资产阶级司令部”。8 月 18 日至 11 月 26 日八次在天安门接见红卫兵。1969 年九大把林彪作为“接班人”写入党章。

        1971 年 9 月林彪出逃身亡后，支持周恩来主持中央日常工作，又于 1972 年接待尼克松访华。1974 年批准开展“批林批孔”，发现江青等人借机篡权后批评他们是“四人帮”。1975 年支持邓小平整顿，年底又发动“批邓、反击右倾翻案风”。1976 年 4 月天安门事件后提议华国锋任第一副主席、国务院总理。
      cites: [ws-1966-05-16-notice, ws-1967-08-bombard-anniv, ws-1969-04-constitution, ws-1981-resolution]
      verify: true
    - h: 去世与身后
      from: 1976
      text: |
        1976 年 9 月 9 日零时十分在北京逝世。中共中央等四机关《告全党全军全国各族人民书》称他是“中国共产党、中国人民解放军、中华人民共和国的缔造者和英明领袖”，并号召“继承毛主席的遗志，坚持以阶级斗争为纲”。9 月 18 日天安门广场举行追悼大会。一个月后，江青等四人被隔离审查。

        遗体经防腐处理后保存于 1977 年落成的毛主席纪念堂。1981 年《关于建国以来党的若干历史问题的决议》认定他对文化大革命“负有主要责任”，同时坚持“他的功绩是第一位的，错误是第二位的”，把毛泽东思想与他“晚年所犯的错误”区别开来。
      cites: [ws-1976-09-09-mao-message, ws-1981-resolution]
    - h: 家庭
      text: |
        1907 年奉父母之命与罗氏成婚，罗氏 1910 年病故。1920 年与杨开慧结婚，生毛岸英、毛岸青、毛岸龙；杨开慧 1930 年在长沙被何键杀害。1928 年在井冈山与贺子珍结合，所生子女多数夭折或失散，存李敏。1938 年在延安与江青结婚，生李讷。
      verify: true
      cites: [ccp-figures-bios]
  assess:
    - { voice: official1966, text: 毛泽东主席是中国共产党、中国人民解放军、中华人民共和国的缔造者和英明领袖, cite: ws-1976-09-09-mao-message, quote: true }
    - { voice: official1981, text: 对于“文化大革命”这一全局性的、长时间的左倾严重错误，毛泽东同志负有主要责任, cite: ws-1981-resolution, quote: true }
    - { voice: official1981, text: 他虽然在“文化大革命”中犯了严重错误，但是就他的一生来看，他对中国革命的功绩远远大于他的过失, cite: ws-1981-resolution, quote: true }
    - { voice: scholar, text: 西方研究（如麦克法夸尔与沈迈克）把文革解释为毛为防止“修正主义”、重新安排接班而对党的机器发起的冲击；中国大陆官方叙述则把动机限定为对阶级斗争形势的错误估计。, cite: macfarquhar-schoenhals }
