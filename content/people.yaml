  bio: 红军时期就做政治工作的军队政工干部，1957 年起任总政治部副主任，1955 年授中将衔。1966 年 2 月作为林彪派出的代表参加江青在上海召开的部队文艺工作座谈会，3–4 月两次代中央为《纪要》起草批语，5 月成为中央文革小组中唯一来自军队的副组长，并任全军文革小组组长。1967 年 1 月被江青等点名批判、打倒，关押多年，1978 年后恢复名誉。
  life:
    - h: 早年与军队政工
      from: 1912
      to: 1965
      text: |
        1912 年生于湖南平江，1930 年参加红军并入党，长征中在红四方面军做政治工作。抗战中任八路军一二九师政治部副主任等职，解放战争中任中原军区、第二野战军兵团政治部主任，抗美援朝中任志愿军第三兵团政委。1955 年授中将衔，1957 年起任总政治部副主任，分管宣传、文化工作。
      verify: true
      cites: [ccp-figures-bios]
    - h: 部队文艺座谈会与《纪要》
      from: 1966-02
      to: 1966-04
      text: |
        1966 年 2 月 2 日至 20 日，“江青同志根据林彪同志的委托，在上海邀请刘志坚、谢镗忠、李曼村、陈亚丁四位同志，就部队文艺工作的若干问题进行了座谈”。《纪要》记载，来上海之前林彪对刘志坚指示：“江青同志昨天和我谈了话。她对文艺工作方面在政治上很强，在艺术上也是内行，她有很多宝贵的意见，你们要很好重视。”江青在给林彪的信中说，她“先后同刘志坚同志个别交谈八次”。据五一六通知附件，3 月 31 日他根据彭真的意见代中央为《纪要》起草批语，4 月 3 日觉得“太一般化”，又起草了第二稿，增加了“社会主义文化大革命的意义和重要性”。同月，他与叶剑英、肖华、杨成武联名就罗瑞卿问题另写一信报毛泽东和中央。
      cites: [ws-1966-03-army-arts, ws-1966-05-16-notice-attachment, ws-1966-04-luo-report]
    - h: 中央文革副组长与倒台
      from: 1966-05
      to: 1978
      text: |
        1966 年 5 月 28 日被列为中央文化革命小组副组长，是小组中唯一来自军队系统的副组长，同时主持全军文化革命小组。1966 年底至 1967 年初，在军队院校运动问题上与中央文革意见不合，1967 年 1 月被江青、陈伯达等点名批判、打倒，全军文革小组随即改组。此后被关押审查多年。1980 年起诉书把他列入被林彪、江青集团诬陷的中央委员、候补中央委员名单。
      cites: [ws-1980-indictment]
      verify: true
    - h: 平反与晚年
      from: 1978
      text: |
        1978 年后恢复名誉和工作，1982 年起任中央顾问委员会委员（待核）。2006 年在北京去世。
      verify: true
      cites: [ccp-figures-bios]
