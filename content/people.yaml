  bio: 早年以“两把菜刀闹革命”起家的湘西武装首领，北伐名将，南昌起义总指挥，此后入党。创建湘鄂西、湘鄂川黔根据地，率红二方面军长征，抗战中开辟晋绥根据地；建国后任西南军区司令员、国家体委主任、国务院副总理、中央军委副主席，1955 年授元帅衔。文革中被康生诬为搞“二月兵变”，被林彪定为“篡军反党”，1969 年在关押中死去。1974 年恢复名誉，1982 年彻底平反。1980 年起诉书：“一九六六年夏，康生……诬陷贺龙和彭真'私自调动军队搞二月兵变'”；8–9 月林彪指使吴法宪、叶群授意他人编写诬陷材料。
