  rank: { rank: 中将, date: 1955-09 }
  tier: 3
  role1966: 空军司令员
  bio: 红军出身的政治工作干部，1955 年授中将，1965 年起任空军司令员，文革中任军委办事组副组长、副总参谋长，1969 年进入中央政治局。1966 年受林彪指使编造诬陷贺龙的材料；1969 年 10 月把“空军的一切指挥权、调动权交给林立果”；1970 年庐山会议上在西南组宣讲“天才”和设国家主席。九一三事件后离职反省、被关押，1981 年特别法庭以组织、领导反革命集团罪等判处有期徒刑十七年。晚年在济南居住，2004 年去世，身后出版回忆录。
  life:
    - h: 红军与解放战争
      from: 1915
      to: 1949
      text: |
        1915 年生于江西永丰，1930 年参加红军，1932 年入党，长期做政治工作；抗战时期在八路军一一五师，解放战争中随林彪的东北野战军南下（待核）。
      verify: true
      cites: [wu-faxian-memoir]
    - h: 空军
      from: 1949
      to: 1966-07
      text: |
        建国后调空军，历任空军政治委员等职，1955 年授中将军衔；1965 年 5 月空军司令员刘亚楼去世后接任空军司令员（待核）。1966 年 4 月批判罗瑞卿的报告提到，刘亚楼临死前说受了罗瑞卿的骗，“杨成武、吴法宪同志也听刘亚楼同志在临死前说过”。
      verify: true
      cites: [ws-1966-04-luo-report]
    - h: 诬陷贺龙与整肃空军
      from: 1966-08
      to: 1969-04
      text: |
        据 1981 年判决书，1966 年 8 月他受林彪指使，9 月 3 日写了“诬陷贺龙在空军阴谋夺权的材料”送给林彪；1968 年 8 月伙同黄永胜捏造事实，诬陷罗瑞卿是“罪大恶极的反革命分子”。他在空军诬陷一些领导干部要“夺权”，“批准关押、迫害空军干部和群众一百七十四人，致使南京部队空军司令部参谋长顾前和空军学院副教育长刘善本被迫害致死”。1980 年起诉书还说，他和陈伯达、谢富治借 1967 年天津“中共中央非常委员会”传单案追查“后台”，说“还不是第二个大走资派”。1967 年 8 月起任军委办事组副组长，1968 年 3 月兼副总参谋长（待核）。
      verify: true
      cites: [ws-1981-01-25-judgment, ws-1980-indictment]
    - h: 林立果与庐山
      from: 1969-04
      to: 1971-09
      text: |
        1969 年 4 月 28 日当选中央政治局委员。10 月 17 日，在林彪口授“第一个号令”的同一天，他任命林立果为空军司令部办公室副主任兼作战部副部长；次日对林立果、王飞、周宇驰等说：“空军的一切都要向立果同志汇报，都可以由立果同志调动、指挥。”1981 年判决书认定，他“把空军的一切指挥权、调动权交给林立果，使林立果得以组成……‘联合舰队’”。1970 年 8 月 13 日修改宪法小组会上，他借“天才”问题向中央领导人发难，叶群转告他：“林彪说，你这次干得好。”24 日在庐山西南组宣讲“天才”和设国家主席，并要求简报“把气氛写得足一些”。10 月 14 日毛泽东在他的书面检讨上批道：“作为一个共产党人，为什么这样缺乏正大光明的气概。”
      cites: [ws-1969-04-28-9th-cc-plenum, ws-1972-lin-material-3, ws-1980-indictment, ws-1981-01-25-judgment, ws-1971-12-lin-chen-material-1]
    - h: 九一三之后
      from: 1971-09
      to: 2004
      text: |
        1971 年 9 月 13 日林彪出逃前，周恩来下令 256 号专机须有周恩来、黄永胜、吴法宪、李作鹏“四个人一起下命令才能飞行”。事后他销毁了与林彪、叶群来往的信件、笔记本、照片等。9 月 24 日被隔离审查（待核）；29 日中共中央通知说，黄永胜、吴法宪、李作鹏、邱会作“陷入很深，实难继续现任工作，已令他们离职反省，彻底交代”。1973 年十大开除党籍（待核）。

        1980 年 11 月作为林彪、江青反革命集团案主犯受审。1981 年 1 月 25 日特别法庭认定他犯组织、领导反革命集团罪、阴谋颠覆政府罪、诬告陷害罪，“判处被告人吴法宪有期徒刑十七年，剥夺政治权利五年”；判决书说他“供认了自己的犯罪事实”，并“揭发了林彪、江青等同案犯的犯罪事实”。此后保外就医，在济南居住（待核）。2004 年 10 月 17 日在济南去世；2006 年回忆录《岁月艰难》在香港出版。
