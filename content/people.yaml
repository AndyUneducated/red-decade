  bio: 上海的文艺评论家，1957 年反右中以批判文章崭露头角。1965 年 11 月 10 日在《文汇报》发表经毛泽东审阅的《评新编历史剧〈海瑞罢官〉》，被官方定为文革序幕；1966 年 5 月 10 日发表《评“三家村”》，次日全国转载。此后任中央文革小组组员、政治局委员，长期主管宣传舆论。“四人帮”成员。1976 年 10 月被隔离审查，1977 年被永远开除党籍，1981 年被判处有期徒刑二十年，1996 年刑满释放，2005 年病逝。
  life:
    - h: 家世与早年
      from: 1931
      to: 1957
      text: |
        1931 年生于浙江诸暨，父亲姚蓬子是左翼作家、出版商。1948 年在上海读中学时加入中国共产党。建国后在上海卢湾区团委、新文艺出版社、《萌芽》杂志等处从事宣传和文艺编辑工作。1955 年在批判胡风的运动中发表文章，开始以文艺批评成名。
      verify: true
      cites: [klein-clark-1971]
    - h: 文艺批评家
      from: 1957
      to: 1965
      text: |
        1957 年反右运动中发表《录以备考》，经毛泽东赏识并为《人民日报》转载。此后在上海《解放日报》《文汇报》发表大量批判文章，任《解放日报》编委，被称为“棍子”。与上海市委宣传部长张春桥关系密切。
      verify: true
      cites: [klein-clark-1971, macfarquhar-schoenhals]
    - h: 《评〈海瑞罢官〉》与《评“三家村”》
      from: 1965
      to: 1966
      text: |
        1965 年在江青、张春桥秘密组织下写作《评新编历史剧〈海瑞罢官〉》，稿件经毛泽东三次审阅，11 月 10 日在《文汇报》发表，北京各报起初拒绝转载。五一六通知附件把这篇文章列为文化战线两条道路斗争的开端。1966 年 5 月 10 日发表《评“三家村”——〈燕山夜话〉〈三家村札记〉的反动本质》，把批判对象从吴晗扩大到邓拓、廖沫沙和北京市委。5 月 28 日被列为中央文化革命小组组员。
      cites: [ws-1966-05-16-notice-attachment, ws-1965-hairui-critique-index, ws-1966-05-ccrg-list]
      verify: true
    - h: 掌管舆论
      from: 1967
      to: 1976
      text: |
        1967 年参与上海“一月夺权”，任上海市革委会副主任。1969 年九大当选政治局委员，主管宣传工作，控制《人民日报》《红旗》和新华社。据判决书，“一九七四年至一九七六年，姚文元指挥‘梁效’、‘池恒’、‘罗思鼎’等写作班子”，诬蔑复出干部是“从资产阶级民主派到走资派”；1976 年 3 月至 5 月，他“诬陷南京、北京等地悼念周恩来总理的群众是‘反革命’，诬陷邓小平是天安门广场‘反革命政治事件的总后台’”。
      cites: [ws-1981-01-25-judgment]
      verify: true
    - h: 被捕、审判与身后
      from: 1976
      text: |
        1976 年 10 月 6 日被隔离审查。1977 年 7 月十届三中全会认定他是“阶级异己分子”，永远开除党籍。1981 年 1 月 25 日特别法庭判处其“有期徒刑二十年，剥夺政治权利五年”，罪名为组织、领导反革命集团罪、阴谋颠覆政府罪、反革命宣传煽动罪和诬告陷害罪。1996 年 10 月刑满释放，在上海、湖北等地居住，研究历史。2005 年 12 月 23 日病逝，2006 年 1 月新华社发简短消息。
      cites: [ws-1976-10-18-notice, ws-1977-07-tenth-third-plenum, ws-1981-01-25-judgment]
