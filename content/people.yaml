  tier: 2
  role1966: 清华大学化工系学生
  bio: 清华大学工程化学系学生。1966 年 6 月反对王光美参与的清华工作组，被打成“反革命”；工作组撤出后成为清华井冈山兵团领袖。12 月 18 日张春桥单独召见他，25 日他带领五千余人上街，“把‘打倒刘少奇’的口号首先推向社会”；1967 年 7 月又带头“打倒徐向前”。1968 年挑起清华武斗，7 月 27 日武力对抗工宣队，造成五人死亡、七百三十一人受伤。1978 年被捕，1983 年以反革命宣传煽动罪、杀人罪、诬告陷害罪被判有期徒刑十七年。
  life:
    - h: 早年
      from: 1945
      to: 1966-05
      text: |
        1945 年生于江苏滨海的农民家庭，1963 年考入清华大学工程化学系（待核）。
      verify: true
    - h: 反工作组
      from: 1966-06
      to: 1966-08
      text: |
        1966 年 6 月清华工作组进校后，他贴大字报质疑工作组，提出要向工作组“夺权”（待核）。据 1967 年反工作组一方的调查报告，工作组从 6 月下旬起组织“反蒯”，他所在的化902班有十七名学生组成“十七人小组”批判他；工作组还对干部说“反蒯”是“触及灵魂”、“将功赎罪”的“大好机会”，“反蒯有功”就能“下楼”。他被定为“反革命”，绝食抗议（待核）。8 月初工作组撤出后获平反，成为清华造反派的头头。10 月刘少奇检讨，把“王光美同志参加过的清华大学前一段文化革命运动”作为错误路线的典型。
      verify: true
      cites: [ws-1966-qinghua-workteam-survey, ws-1966-10-liu-self-criticism]
    - h: “打倒刘少奇”与“打倒徐向前”
      from: 1966-12
      to: 1967-08
      text: |
        据 1980 年起诉书，1966 年 12 月 18 日下午张春桥在中南海西门传达室单独接见他，说“中央那一两个提出资产阶级反动路线的人至今仍不投降”，“你们革命小将应该联合起来，发扬彻底革命精神，痛打落水狗，把他们搞臭，不要半途而废”。25 日他带领清华五千余人上街游行，在天安门广场、王府井、西单、北京站等处张贴标语、大字报，判决书说他由此“把‘打倒刘少奇’的口号首先推向社会”。1967 年他任首都大专院校红代会核心组副组长、北京市革委会常委；4 月 10 日井冈山兵团在清华召开批斗王光美的大会（待核）。

        1980 年起诉书说，1967 年 4 月“在叶群的授意下”，他派人收集编造诬陷徐向前、叶剑英的材料。7 月 25 日他在天安门城楼听到林彪要在军队问题上“大做文章”，当场向王力探明底细；27 日指使“井冈山兵团军事动态组”在军事领导机关附近贴出“打倒徐向前”的大标语，随后派人抄了徐向前的住所和办公室，抢走装有绝密、机密文件的档案箱五个；30 日召开有全国大部分省市造反派头头参加的“全国形势讨论会”，“把‘打倒徐向前’的活动推向全国”。
      verify: true
      cites: [ws-1980-indictment, ws-1982-12-kuai-dafu-case]
    - h: 清华武斗
      from: 1967-04
      to: 1968-07
      text: |
        1967 年春清华井冈山分裂为蒯大富一方的“团派”和反对他的“四一四派”，1968 年 4 月起两派在校内长期武斗（待核）。据判决书，1968 年 5 月 29 日他召开“井冈山兵团文攻武卫总指挥部”头头会，决定 30 日凌晨三时攻打东区浴室楼，亲自下令拉闸断电、发出进攻信号，“造成学生卞雨林、许恭生，工人段洪水死亡”；7 月初又决定武力“封锁”科学馆，对进出的人可以开枪，学生杨志军被打死。他还派人制造、搜集枪支弹药。

        他把原清华党委干部罗征启、李康、文学宓、刘承娴、饶慰慈诬为“蒋南翔的第二套班子”、“反革命小集团”，1968 年 1 月和 4 月先后抓起来刑讯，亲自参与对文学宓的逼供。刘承娴被迫害致死，饶慰慈一度精神失常，罗征启之弟罗征敷“被用棉丝堵嘴而窒息死亡”。
      verify: true
      cites: [ws-1982-12-kuai-dafu-case]
    - h: 七二七与“五大领袖”
      from: 1968-07
      to: 1968-12
      text: |
        1968 年 7 月 27 日上午，“工农毛泽东思想宣传队”进入清华，宣传制止武斗、收缴武器。他与任传仲等紧急策划，决定“抵抗、还击”，下午在静斋楼道拔出手枪，叫嚷要和工人“拼了”；宣传队员王松林、张旭涛、潘志宏、韩忠现、李文元被杀害，“七百三十一人受伤”。7 月 28 日凌晨毛泽东在人民大会堂召见他和聂元梓、韩爱晶、谭厚兰、王大宾，要求结束武斗（待核）。12 月他被分配到宁夏三〇四厂当工人。
      verify: true
      cites: [ws-1982-12-kuai-dafu-case]
    - h: 清查与判刑
      from: 1970
      text: |
        1970 年起在清查“五一六”中被隔离审查（待核）。1978 年 4 月 19 日被北京市公安局逮捕。北京市中级人民法院认定他“已构成反革命宣传煽动罪、杀人罪、诬告陷害罪”，考虑到“其能主动揭发张春桥罪行的情节”，“判处被告人蒯大富有期徒刑十七年，剥夺政治权利四年”；判决书说他在庭审中“供认了大部分事实，但不承认是犯反革命罪”（判决书无落款日，一般记为 1983 年）。1987 年刑满释放，此后在外地经商（待核）。
      verify: true
      cites: [ws-1982-12-kuai-dafu-case]
  assess:
    - { voice: doc, text: 工作组利用干部急于要“下楼”、“解放”的心情，鼓动干部“反蒯”（1967 年反工作组一方的调查报告）, cite: ws-1966-qinghua-workteam-survey, quote: true }
    - { voice: judicial1980, text: 在张春桥的指使下，蒯大富于十二月二十五日在北京组织游行示威，张贴标语、大字报，散发传单，呼喊口号，公开煽动“打倒刘少奇！”“打倒邓小平！”（1980 年起诉书）, cite: ws-1980-indictment, quote: true }
    - { voice: judicial1980, text: 煽动打倒党和国家领导人，并策划组织武斗，武力对抗宣传队，诬陷迫害干部、群众，后果严重，已构成反革命宣传煽动罪、杀人罪、诬告陷害罪（北京市中级人民法院判决书）, cite: ws-1982-12-kuai-dafu-case, quote: true }
    - { voice: scholar, text: 魏昂德把北京高校造反派的分裂追溯到工作组时期的站队和对干部的不同态度，清华“团派”与“四一四派”是主要例证（待核）。, cite: walder-fractured }
  factions: [rebels]
