      text: |
        据《五·一六通知》附件大事记：1965 年 11 月 28 日彭真开会讨论转载姚文元文章，许立群在座。1966 年 1 月 13 日《人民日报》刊出思彤（王若水）提到“要害是罢官”的文章，几天后许立群责问为什么要讲庐山会议和要害问题。1 月 17 日他召集《人民日报》《光明日报》《北京日报》《红旗》《前线》《新建设》六个编辑部开会，称根据彭真指示要把三报三刊的学术批判“管起来”，并主张同时讨论历史人物、道德继承等问题，“有领导地造成‘一场混战’”。1 月 18 日至 27 日戚本禹问批判要害的文章能否发表，他答：“攻要害的文章不止你一篇，别人还有，现在都不能发表。”
      cites: [ws-1966-05-16-notice-attachment@1965-11-28, ws-1966-05-16-notice-attachment@1966-01-13, ws-1966-05-16-notice-attachment@1966-01-17]
    - h: 起草《二月提纲》
      from: 1966
      to: 1966
      text: |
        1966 年 2 月 3 日五人小组扩大会后，彭真要许立群和姚溱起草汇报提纲。2 月 4 日两人在钓鱼台“关起门来”起草，连同住一楼的五人小组成员康生、吴冷西也不知情。2 月 5 日政治局常委会和 2 月 8 日向毛泽东汇报时，都由许立群口头汇报；大事记称，他攻击关锋的杂文时，毛泽东说：“写点杂文有什么关系。”提纲规定五人小组设办公室，“许立群同志为主任”。

        2 月 18 日他与胡绳在北京召集学术界和报刊负责人传达提纲，3 月 1 日以本人名义发出《学术批判问题座谈会讨论简况》，称提纲是“学术界兴无灭资的纲领性文件”。3 月 11 日彭真让他打电话给上海市委宣传部长杨永直，说“学阀没有具体指是什么人”。
