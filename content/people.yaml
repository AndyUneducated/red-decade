  bio: 四川资阳人，早年参加革命，建国后任重庆市长，1955 年调上海，1965 年起任上海市长。1966 年 4 月 1 日深夜接到彭真两次电话。1966 年底在安亭事件、康平路事件中处于造反派与赤卫队之间，1967 年 1 月上海“一月夺权”中被宣布“不再承认”为市长，此后被诬为“叛徒”，长期关押批斗，1976 年 3 月被迫害致死。1980 年起诉书和 1981 年判决书把他与副市长金仲华列为上海被迫害致死的领导干部。
  life:
    - h: 早年
      from: 1909
      to: 1949
      text: |
        1909 年生于四川资阳。1920 年代末参加革命并入党，1930 年代曾被国民党当局逮捕，抗战时期在新四军和华中根据地工作（待核）。1972 年以后上海方面审查他的历史，正是以这段被捕经历把他定为“叛徒”。
      verify: true
    - h: 重庆与上海
      from: 1949
      to: 1966-05
      text: |
        建国后在西南工作，1952 年任重庆市市长；1955 年调上海，任市委书记处书记、副市长，1965 年柯庆施去世后任上海市市长（待核）。据《五·一六通知》附件大事记，1966 年 4 月 1 日“彭真同志在深夜向上海市委书记曹荻秋同志打了两次电话”，大事记说彭真“不是根据毛主席的指示向上海市委道歉，而是编造一套谎言”。
      verify: true
      cites: [ws-1966-05-16-notice-attachment@1966-04-01]
    - h: 安亭、康平路与一月夺权
      from: 1966-11
      to: 1967-02
      text: |
        1966 年 11 月上海工人造反派在安亭卧轨拦车，市委拒绝承认“工总司”，张春桥到场后签字同意其要求；12 月下旬，以老工人、党团员为主体的“工人赤卫队”也要求市委签字，曹荻秋签字后又被迫收回，两派在康平路市委机关前对峙（待核）。据 1982 年徐景贤案起诉书，12 月 18 日徐景贤等召开大会，“诬陷上海市委‘蓄意把群众打成反革命’”，又与王洪文等制造攻打“工人赤卫队”的“康平路事件”，“打伤九十一人”。12 月聂元梓到上海时也说，“打倒常是打开陈、曹……的一个缺口”。

        1967 年 1 月至 2 月，徐景贤、王洪文等两次召开大会，诬陷“曹荻秋是‘叛徒’”，宣布“彻底打倒”上海市委，“不再承认曹荻秋为上海市委书记、上海市市长”，并将陈丕显、曹荻秋等非法监禁。
      verify: true
      cites: [ws-1982-xu-jingxian-case, ws-1982-10-05-nie-yuanzi-case]
    - h: 批斗、“叛徒”结论与死亡
      from: 1967-03
      to: 1976-03-29
      text: |
        1968 年 1 月张春桥、姚文元诬陷他是“叛徒”（1980 年起诉书）。据王秀珍案起诉书，1968 年 6 月 28 日王秀珍主持全市电视批斗大会，“诬陷曹荻秋是‘叛徒’，进行人身迫害”；1973 年 3 月在全市区、县、局负责人会议上宣布《审查情况》，诬陷陈丕显、曹荻秋“被捕叛变”；9 月审定的《审查报告》称他是“埋藏在党内的可耻叛徒”。徐景贤案起诉书则说，1972 年 7 月审定他的审查报告时称其是“出卖了同志、出卖了组织”的“叛徒”。1975 年 1 月，马天水、徐景贤、王秀珍等“扣压曹荻秋写给党中央的申诉信”。1976 年 3 月他“被迫害致死”。
      cites: [ws-1980-indictment, ws-1982-08-21-wang-xiuzhen-case, ws-1982-xu-jingxian-case]
  assess:
    - { voice: judicial1980, text: 在张春桥、姚文元的指使、策动下，夺取了上海市的领导权，上海市领导干部十二人遭到诬陷迫害，市长曹荻秋、副市长金仲华被迫害致死（1981 年特别法庭判决书）, cite: ws-1981-01-25-judgment, quote: true }
    - { voice: judicial1980, text: 一九七五年一月，徐景贤和马天水、王秀珍等人，扣压曹荻秋写给党中央的申诉信（1982 年徐景贤案起诉书）, cite: ws-1982-xu-jingxian-case, quote: true }
