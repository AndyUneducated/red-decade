        6 月 18 日，北大一些学生在校内揪斗干部、教师，给他们戴高帽、抹黑脸（待核）。工作组出面制止，把事件写进《北京大学文化革命简报》第九号上报。刘少奇 1966 年 10 月检讨说，他主持的中央会议“批发了北京大学文化革命简报第九号到各地党委，认为北大工作组六月十八日处理乱斗现象的办法是正确的，及时的”，“把革命师生群众的革命行动，说成是反革命事件，这就给全国定了一种基调”。1967 年 8 月两报一刊编辑部文章说，刘少奇“批转北京大学工作组的一期简报，把革命事件说成是反革命事件，并且要全国仿效办理”。

