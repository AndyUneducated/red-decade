  bio: 中共宣传系统的元老，1945 年起长期任中宣部长，1956 年代表中央阐述“百花齐放、百家争鸣”方针。1966 年 2 月是“五人小组”成员、二月提纲参与者（“定一”）。1966 年 5 月与彭真、罗瑞卿、杨尚昆同被打倒，成为“彭罗陆杨反党集团”成员，起因之一是妻子严慰冰写匿名信攻击叶群。1980 年起诉书：“一九六六年五月，林彪捏造罪名，诬陷陆定一是'反革命分子'”，中宣部九名副部长分别被诬为“叛徒”、“特务”。关押近十三年，1979 年获释平反，1996 年去世。
  life:
    - h: 家世与早年
      from: 1906
      to: 1937
      text: |
        1906 年 6 月 9 日生于江苏无锡。1922 年入上海南洋大学电机系，1925 年参加五卅运动，同年入党。1926 年毕业后任共青团中央宣传部长，1928 年作为共青团代表赴莫斯科，任驻青年共产国际代表。1930 年回国，1934 年到中央苏区任红军总政治部宣传部长，参加长征。
      verify: true
      cites: [ccp-figures-bios, klein-clark-1971]
    - h: 延安的宣传家
      from: 1937
      to: 1949
      text: |
        抗战中任八路军总政治部宣传部长，1942 年起任延安《解放日报》总编辑，是整风运动和党报改版的主要执行者之一，1943 年发表《我们对于新闻学的基本观点》。1945 年七大当选中央委员，任中宣部长。
      verify: true
      cites: [ccp-figures-bios]
    - h: 中宣部长与“双百”
      from: 1949
      to: 1965
      text: |
        建国后长期主管宣传、文教，兼任中央文教小组组长。1956 年 5 月 26 日在怀仁堂作《百花齐放，百家争鸣》报告，系统阐述“双百”方针；次年反右运动中，中宣部亦主持了对文艺界“右派”的批判。1959 年任国务院副总理，1962 年任中央书记处书记，1965 年兼文化部长。
      verify: true
      cites: [ccp-figures-bios, macfarquhar-schoenhals]
    - h: 二月提纲与倒台
      from: 1966
      to: 1979
      text: |
        1966 年 2 月作为“文化革命五人小组”成员，参与起草《五人小组向中央的汇报提纲》（二月提纲）。5 月政治局扩大会议上与彭真、罗瑞卿、杨尚昆一起被打倒。据 1980 年起诉书，“一九六六年五月，林彪捏造罪名，诬陷陆定一是‘反革命分子’”；会上林彪当众出示证明叶群婚前“清白”的字条，矛头指向陆定一的妻子严慰冰——严在 1960–1966 年间写了大量匿名信揭发叶群（待核）。

        据判决书，“一九六六年底至一九六八年，陈伯达多次诬陷国务院副总理陆定一是‘现行反革命’、‘叛徒’、‘内奸’，并决定对他进行人身摧残”；起诉书还记陈伯达“提出要把陆定一‘交红卫兵审判’”。他被批斗、关押近十三年，严慰冰也被关押。
      cites: [ws-1966-02-outline, ws-1980-indictment, ws-1981-01-25-judgment]
      verify: true
    - h: 平反与晚年
      from: 1979
      text: |
        1979 年初获释，同年平反，6 月任全国政协副主席，9 月补选为中央委员。1982 年任中央顾问委员会常委。晚年撰文反思宣传工作，1996 年 5 月 9 日在北京去世。
      verify: true
      cites: [ccp-figures-bios]
  assess:
