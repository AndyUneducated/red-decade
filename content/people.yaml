  bio: 党内理论写作班子出身，长期在《红旗》杂志和中联部工作，参与起草 1963–1964 年批判苏共的“九评”。1966 年 2 月是“五人小组办公室”成员，5 月又被列入中央文革小组。1967 年 1 月与关锋提出“彻底揭穿军内一小撮走资本主义道路的当权派”的口号，经林彪批示“完全同意”；7 月在武汉被群众组织“百万雄师”和部分军人绑架，回京后被当作英雄迎接；8 月 7 日讲话鼓动夺外交部的权。8 月 30 日被隔离审查，此后关押十四年，1982 年获释并被开除党籍。
