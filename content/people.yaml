- id: zhu-de
  name: 朱德
  born: 1886-12-01
  died: 1976-07-06
  tier: 2
  role1966: 全国人大常委会委员长
  pinyin: Zhū Dé
  aka:
    - { kind: original, name: 朱代珍 }
    - { kind: courtesy, name: 玉阶 }
  gender: m
  ethnicity: 汉族
  birthplace: 四川仪陇马鞍场
  origin: 四川仪陇
  classOrigin: 佃农
  classNote: 生于佃农家庭，过继给伯父，由族中集资读书（待核）。
  deathKind: natural
  deathPlace: 北京
  education:
