      from: 1958
      to: 1966-05
      text: |
        1958 年《红旗》杂志创刊后任编委，后任副总编辑，以“何明”“庆云”等笔名写杂文。1966 年 1 月 8 日，据五一六通知附件，姚溱把“庆云（即关锋）的一篇杂文《从陈贾说起》”送给彭真，“为彭真同志整关锋同志提供材料”。1 月中旬他和戚本禹写成两篇批判《海瑞罢官》“要害问题”的文章，被中宣部压下。2 月 8 日彭真等向毛泽东汇报时，许立群攻击关锋的杂文，毛泽东说：“写点杂文有什么关系。”“何明（即关锋）的文章我早就看过，还不错。”4 月 5 日与林杰在《红旗》发表《〈海瑞骂皇帝〉和〈海瑞罢官〉是反党反社会主义的两株大毒草》，5 月 9 日以“何明”之名在《光明日报》发表《擦亮眼睛，辨别真伪》。
