# Reading-room metadata for primary texts (id = source id; full text in sources/text/<id>.txt).
# pairs: sentence-level rebuttals between two documents.
- id: ws-1966-02-outline
  summary: 文化革命五人小组 2 月 3 日会议后由许立群、姚溱起草，2 月 12 日由中央批转。主张“放”、“在真理面前人人平等”、“不要局限于政治问题”、对左派“整风”。
  significance: 文革前夕党内唯一一份试图为学术批判设定程序边界的中央文件。值得注意的是，提纲本身完全接受“兴无灭资”、“两条道路斗争”的框架——分歧在节奏与程序，而非是否批判。
  people: [peng-zhen, kang-sheng, lu-dingyi, wu-lengxi, xu-liqun, hu-sheng, yao-zhen, wang-li, liu-ren, zheng-tianxiang, wu-han]
  concepts: [equality-before-truth, class-struggle]

- id: ws-1966-05-16-notice
  summary: 撤销二月提纲和五人小组，另设隶属政治局常委的文化革命小组；逐条驳斥提纲十点；提出党内存在“赫鲁晓夫那样的人物”。
  significance: 1981 年决议称其为“'文化大革命'纲领性文件”。
  people: [peng-zhen, kang-sheng, mao-zedong]
  concepts: [khrushchev, capitalist-roaders, equality-before-truth, monsters, successor, revisionism]
  pairs:
    - against: ws-1966-02-outline
      point: （一）
      original: 这场大辩论的性质，是马克思列宁主义、毛泽东思想同资产阶级思想在意识形态领域内的一场大斗争
      rebuttal: 这个提纲用混乱的、自相矛盾的、虚伪的词句，模糊了当前文化思想战线上的尖锐的阶级斗争
    - against: ws-1966-02-outline
      point: （二）
      original: 在报刊上的讨论不要局限于政治问题，要把涉及到各种学术理论的问题，充分地展开讨论
      rebuttal: 这个提纲违背了一切阶级斗争都是政治斗争这一个马克思主义的基本论点
    - against: ws-1966-02-outline
      point: （三）
      original: 让各种不同意见（包括反马克思列宁主义的东西）都充分地放出来
      rebuttal: 它的所谓“放”，是资产阶级的自由化，只许资产阶级放，不许无产阶级放
    - against: ws-1966-02-outline
      point: （四）
      original: 要坚持实事求是，在真理面前人人平等的原则
      rebuttal: 这个口号是资产阶级的口号。他们用这个口号保护资产阶级，反对无产阶级
    - against: ws-1966-02-outline
      point: （五）
      original: 我们不仅要在政治上压倒对方，而且要在学术和业务的水准上真正大大地超过和压倒对方
      rebuttal: 这种对学术不分阶级界限的思想，也是很错误的
    - against: ws-1966-02-outline
      point: （六）
      original: 要有破有立（没有立，就不可能达到真正、彻底的破）
      rebuttal: 毛主席经常说，不破不立。破，就是批判，就是革命
    - against: ws-1966-02-outline
      point: （七）
      original: 不要象学阀一样武断和以势压人
      rebuttal: 究竟什么是“学阀”？谁是“学阀”？难道无产阶级不要专政，不要压倒资产阶级？
    - against: ws-1966-02-outline
      point: （八）
      original: 要在适当的时机，用内部少数人学习整风的办法，清理一下
      rebuttal: 提出要对“坚定的左派”进行“整风”。……主要目的，就是要整无产阶级左派
    - against: ws-1966-02-outline
      point: （九）
      original: 报刊上公开点名作重点批判要慎重，有的人要经过有关领导机构批准
      rebuttal: 提纲却反复强调斗争中要所谓“有领导”、要“谨慎”、要“慎重”、要“经过有关领导机构批准”
    - against: ws-1966-02-outline
      point: （十）
      original: 我们要通过这场斗争，在毛泽东思想指导下，开辟解决这个问题的道路
      rebuttal: 提纲却认为毛泽东思想还没有给我们开辟道路，而要重新开辟道路

- id: ws-1966-05-16-notice-attachment
  summary: 五一六通知原件附件之二《一九六五年九月到一九六六年五月文化战线上两条道路斗争大事记》，以日为单位记录从中央工作会议到政治局扩大会议的过程。
  significance: 本站 1965–1966 年事件的主要日期来源。须注意它是胜利一方在 1966 年 5 月编定的，带有明确的定性目的；例如特意说明《人民日报》按语末段“是周恩来同志加的”。
  people: [mao-zedong, peng-zhen, kang-sheng, zhou-enlai, wu-han, deng-tuo, yao-wenyuan, xu-liqun, hu-sheng, yao-zhen, jiang-qing, zhang-chunqiao, guan-feng, qi-benyu, lu-dingyi]
  concepts: [equality-before-truth, rebellion]

- id: ws-1966-03-army-arts
  summary: 江青 2 月在上海召开部队文艺座谈会后形成的纪要，经林彪、军委批准，4 月 10 日中央批发。
  significance: 提出“文艺黑线专政”论，否定建国以来文艺工作；是与二月提纲同期、方向相反的另一份中央文件。
  people: [jiang-qing, lin-biao, liu-zhijian]
  concepts: [black-line, two-lines, successor]

- id: ws-1966-05-ccrg-list
  summary: 中央文化革命小组名单。
  people: [chen-boda, kang-sheng, jiang-qing, wang-renzhong, liu-zhijian, zhang-chunqiao, wang-li, guan-feng, qi-benyu, yao-wenyuan]

- id: ws-1966-06-01-sweep
  summary: 《人民日报》6 月 1 日社论，陈伯达接管报社后发表。
  significance: “四旧”四项并列在本站语料中的首次出现。1980 年起诉书将其列为“制造反革命舆论”的证据。
  people: [chen-boda]
  concepts: [monsters, four-olds, khrushchev]

- id: ws-1966-06-02-hail-pku
  summary: 《人民日报》评论员文章，与聂元梓大字报同日刊发。
  people: [nie-yuanzi, lu-ping, song-shuo, peng-peiyun]
  concepts: [black-gang, monsters]

- id: ws-1966-08-08-sixteen-points
  summary: 八届十一中全会通过的《中共中央关于无产阶级文化大革命的决定》。
  significance: 同时包含最激进的动员语言（“不要怕出乱子”）与最明确的约束条款（“要用文斗，不用武斗”、学生“一律不整”、“要保护少数”）。此后运动的实际走向几乎全部背离了约束条款。
  people: [mao-zedong]
  concepts: [capitalist-roaders, four-olds, verbal-struggle, paris-commune, mass-democracy, mao-thought, reactionary-authority]

- id: ws-1966-08-12-plenum-communique
  summary: 八届十一中全会公报。
  people: [mao-zedong, lin-biao]
  concepts: [mao-thought, revisionism, khrushchev, successor]

- id: ws-1966-08-18-lin-speech
  summary: 林彪在第一次接见红卫兵大会上的讲话。
  people: [lin-biao, mao-zedong]
  concepts: [four-olds, rebellion, monsters, capitalist-roaders]

- id: ws-1966-08-23-very-good
  summary: 《人民日报》社论，为红卫兵上街“破四旧”背书。
  concepts: [four-olds, rebellion]

- id: ws-1966-08-xicheng-4
  summary: 首都红卫兵纠察队西城指挥部第四号通令《关于对地、富、反、坏、右、资的家进行查抄的意见》（七项规定草案）。
  significance: 罕见的红卫兵抄家内部规范。按“黑六类”出身划定对象，限期驱逐出京，同时明令“国家负责干部的家绝对不许查”——显示早期红卫兵的阶级路线保护干部、打击社会边缘群体。
  concepts: [bloodline, verbal-struggle, four-olds]

- id: ws-1966-08-xicheng-founding
  summary: 首都红卫兵纠察队西城分队成立宣言。
  concepts: [rebellion]

- id: ws-1966-10-liu-self-criticism
  summary: 刘少奇 1966 年 10 月 23 日在中央工作会议上的检讨。
  significance: 刘少奇对工作组“五十多天”的唯一系统自述，也是理解 1962 年（七千人大会、西楼会议、包产到户）与 1964 年（桃园经验、四清）如何被串成一条“路线”的关键文本。其结构与《炮打司令部》三项指控一一对应。
  people: [liu-shaoqi, wang-guangmei, mao-zedong, lin-biao, chen-boda, deng-xiaoping, peng-zhen]
  concepts: [two-lines, capitalist-roaders, successor, rebellion]

- id: ws-1967-08-bombard-anniv
  summary: 1967 年 8 月 5 日两报一刊社论，全文引用《炮打司令部》核心段落。
  significance: 《炮打司令部》原文目前通过本文转引获得。社论把原文的“某些领导同志”展开为“以中国赫鲁晓夫为首的资产阶级司令部”，点名彭德怀、彭真、罗瑞卿、陆定一、杨尚昆。
  people: [mao-zedong, liu-shaoqi, peng-dehuai, peng-zhen, luo-ruiqing, lu-dingyi, yang-shangkun, lin-biao]
  concepts: [bourgeois-hq, khrushchev, two-lines, capitalist-roaders]

- id: ws-1967-yu-origin-theory
  summary: 遇罗克《出身论》，1967 年 1 月 18 日《中学文革报》第 1 期。
  significance: 文革中最重要的异端思想文本之一。全篇以官方经典（毛泽东语录、十六条）为武器反驳血统论。
  people: [yu-luoke]
  concepts: [bloodline, successor, capitalist-roaders]

- id: ws-1980-indictment
  summary: 最高人民检察院特别检察厅对林彪、江青反革命集团案主犯的起诉书。
  significance: 1980 年官方对文革中迫害行为的司法叙述，含大量具体人数（如内蒙古“内人党”冤案 346,000 余人遭诬陷迫害、16,222 人被迫害致死）。须注意其框架只追究“两个反革命集团”，不涉及毛泽东本人。
  people: [lin-biao, jiang-qing, kang-sheng, zhang-chunqiao, ye-qun, wu-faxian, xie-fuzhi, liu-shaoqi, deng-xiaoping, he-long, peng-dehuai, zhu-de, lu-dingyi]

- id: ws-1981-resolution
  summary: 中共十一届六中全会《关于建国以来党的若干历史问题的决议》。
  significance: 迄今为止中共对文革的正式定性：“一场由领导者错误发动，被反革命集团利用，给党、国家和各族人民带来严重灾难的内乱”。
  people: [mao-zedong, liu-shaoqi, lin-biao, jiang-qing, deng-xiaoping]
  concepts: [continuous-revolution, bourgeois-hq, capitalist-roaders, class-struggle]

- id: ws-1966-08-31-lin-speech
  summary: 毛泽东第二次接见外地来京师生，林彪讲话。肯定红卫兵“走上街头，横扫‘四旧’”，同时要求“要用文斗，不用武斗”。
  significance: 缩写“四旧”首次见于已收官方文本，且带引号（C004）。
  people: [lin-biao, mao-zedong]
  concepts: [four-olds, verbal-struggle]

- id: ws-1966-10-01-mao-thought-road
  summary: 《红旗》1966 年第 13 期国庆社论。宣布《十六条》是“两条路线斗争的产物”，号召“彻底批判”资产阶级反动路线。
  significance: “资产阶级反动路线”首次公开出现（C011）。从此运动的主要矛头由“牛鬼蛇神”转向工作组时期的各级领导。
  concepts: [two-lines, four-olds, capitalist-roaders]

- id: ws-1966-11-shanghai-wgs
  summary: 上海工总司成立宣言（草案）。以“造反有理”开篇，宣布造上海市委与“资产阶级反动路线”的反，并提出“我们要夺权”。
  significance: 工人造反组织登场；“夺权”一词已出现在 1966 年 11 月的群众文献中，比一月夺权早两个月（C006）。
  people: [wang-hongwen]
  concepts: [rebellion, two-lines]

- id: ws-1966-12-liandong
  summary: 老红卫兵“联动”成立宣言。警告“资产阶级反动路线新形式”，宣誓捍卫毛主席革命路线。
  significance: 反中央文革的一方用的是同一套官方语言（C012）。
  concepts: [two-lines, rebellion]

- id: ws-1967-01-01-to-the-end
  summary: 1967 年元旦两报一刊社论，宣告“全面展开阶级斗争的一年”，号召工矿企业和农村开展文化大革命。
  significance: 一篇之中“资产阶级反动路线”41 次，却无一次“资产阶级司令部”（C003）。
  concepts: [two-lines, capitalist-roaders]

- id: ws-1967-11-06-october-road
  summary: 十月革命五十周年两报一刊社论。首次以“伟大理论”命名“无产阶级专政下继续革命”，并列出六条要点。
  significance: “继续革命”理论的命名时刻（C008）。
  concepts: [continuous-revolution, class-struggle]

- id: ws-1969-04-ninth-report
  summary: 林彪在九大的政治报告。把“继续革命”上溯到 1957 年，系统叙述“两个司令部”的斗争史。
  significance: 文革官方叙事的定型文本，1981 年决议主要针对的对象之一。
  people: [lin-biao, liu-shaoqi, mao-zedong]
  concepts: [continuous-revolution, bourgeois-hq, two-lines]
