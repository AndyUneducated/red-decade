# Political groupings as they appear in 1965–1966. One person may belong to several.
# kind: core | group | institution | mass | target | dissent
- id: mao
  name: 毛泽东
  kind: core
  color: '#b3122e'
  summary: 发动者与最终裁决者。1966 年的官方文本自称“以毛主席为首的无产阶级司令部”，这一称谓在 1967 年后才被系统化。
  cites: [ws-1967-08-bombard-anniv]
- id: ccrg
  name: 中央文革小组
  kind: group
  color: '#e0573a'
  from: 1966-05-28
  to: 1969-04
  summary: 1966 年 5 月 28 日设立，“隶属于政治局常委领导下”。组长陈伯达，顾问康生，副组长江青、王任重、刘志坚、张春桥，组员王力、关锋、戚本禹、姚文元等。1967 年后逐步取代政治局的日常职能。
  cites: [ws-1966-05-ccrg-list]
- id: lin
  name: 林彪系
  kind: group
  color: '#7a4a1e'
  from: 1959-09
  to: 1971-09
  summary: 以林彪、叶群为中心，含后来的黄永胜、吴法宪、李作鹏、邱会作等军队干部。1966 年 8 月林彪成为“毛主席的第一位助手和接班人”。
  cites: [ws-1966-10-liu-self-criticism, ws-1980-indictment]
- id: frontline
  name: 一线领导
  kind: institution
  color: '#2f5d8a'
  summary: 1959 年后主持中央日常工作的刘少奇、邓小平。1966 年 6–7 月派工作组；8 月起被定性为“资产阶级反动路线”，1967 年被称为“资产阶级司令部”。1981 年决议称：“党内根本不存在所谓以刘少奇、邓小平为首的'资产阶级司令部'。”
  cites: [ws-1966-10-liu-self-criticism, ws-1981-resolution]
- id: premier
  name: 国务院 / 周恩来
  kind: institution
  color: '#3f7f6e'
  summary: 周恩来及国务院系统。在 1966 年的文件中多次作为毛泽东指示的执行者出现（如 1965 年 11 月 30 日《人民日报》按语末段由周恩来所加）。
  cites: [ws-1966-05-16-notice-attachment@1965-11-30]
- id: plly
  name: 彭罗陆杨
  kind: target
  color: '#5b5b66'
  from: 1965-11
  to: 1966-05
  summary: 彭真、罗瑞卿、陆定一、杨尚昆。1966 年 5 月政治局扩大会议上被定为“反党集团”，是文革第一批被打倒的中央领导人。
  cites: [ws-1966-05-16-notice-attachment@1966-05-04, ws-1967-08-bombard-anniv]
- id: bjcommittee
  name: 旧北京市委 / 三家村
  kind: target
  color: '#6d6a8a'
  to: 1966-06-03
  summary: 彭真主持的北京市委，包括刘仁、郑天翔、邓拓，及《燕山夜话》《三家村札记》作者邓拓、吴晗、廖沫沙。1966 年 6 月 3 日改组。
  cites: [ws-1966-05-16-notice-attachment, ws-1980-indictment]
- id: propdept
  name: 中宣部（“阎王殿”）
  kind: target
  color: '#8a7f6d'
  to: 1966-07
  summary: 陆定一、周扬、许立群、姚溱、林默涵等。毛泽东 1966 年 3 月底称“中宣部是阎王殿”，“要打倒阎王，解放小鬼”。
  cites: [ws-1966-05-16-notice-attachment@1966-03-28]
- id: workteams
  name: 工作组
  kind: institution
  color: '#4a7aa8'
  from: 1966-06
  to: 1966-07-28
  summary: 6 月初由刘少奇主持的中央会议决定派往北京各大中学校，7 月 24 日决定撤回，7 月 28 日北京市委正式撤销。刘少奇自述：“第一位要负责任的，就是我。”
  cites: [ws-1966-10-liu-self-criticism, ws-1966-07-withdraw-workteams]
- id: oldrg
  name: 老红卫兵
  kind: mass
  color: '#c2410c'
  from: 1966-05-29
  to: 1967-01
  summary: 以清华附中、北京各中学干部子弟为主体的早期红卫兵。8 月下旬组建“首都红卫兵纠察队”，按“黑六类”出身查抄，同时规定“国家负责干部的家绝对不许查”。
  cites: [ws-1966-08-xicheng-4, ws-1966-08-xicheng-founding]
- id: rebels
  name: 造反派
  kind: mass
  color: '#d97706'
  from: 1966-06
  summary: 反对工作组、后被中央文革支持的学生和工人组织，如清华蒯大富、北大聂元梓、上海王洪文“工总司”。1966 年 10 月后取代老红卫兵成为运动主力。
  cites: [ws-1980-indictment]
- id: shanghai
  name: 上海市委
  kind: institution
  color: '#577590'
  summary: 第一书记陈丕显、市长曹荻秋。1965 年发表姚文元文章的地方；1966 年底与“工总司”冲突，1967 年“一月风暴”中被夺权。
  cites: [ws-1980-indictment]
- id: shgang
  name: 上海帮
  kind: group
  color: '#a8456b'
  from: 1966-12
  to: 1976-10-06
  summary: 张春桥、王洪文在上海的班底：马天水、徐景贤、王秀珍，以及陈阿大、叶昌明、王少庸、朱永嘉等。1967 年起控制上海市革委会和恢复后的市委，1976 年 10 月策划武装叛乱未遂。1982 年的起诉书称他们“都是江青反革命集团在上海的重要骨干”。
  cites: [ws-1982-xu-jingxian-case, ws-1981-01-25-judgment]
- id: provincial
  name: 地方党政军
  kind: institution
  color: '#4f6d5a'
  summary: 文革前主政大区、省区的党委书记和军区首长，如西南局李井泉、内蒙古乌兰夫、广西韦国清、武汉军区钟汉华；以及 1967–1968 年借“支左”接掌省区革委会的军队干部，如湖北曾思玉、内蒙古滕海清、江西程世清。前一类大多在 1966–1967 年被打倒，后一类在九一三事件后按与林彪的关系分别处理。
  cites: [ws-1980-indictment, ws-1974-05-21-hubei-instructions]
- id: marshals
  name: 军队元老
  kind: institution
  color: '#6b705c'
  summary: 朱德、彭德怀、贺龙、陈毅、叶剑英等老帅。1966 年起陆续遭到林彪、江青方面的诬陷。
  cites: [ws-1980-indictment]
- id: academics
  name: “反动学术权威”
  kind: target
  color: '#9c8c7a'
  summary: 被《五一六通知》和《十六条》列为批判对象的学者、作家、教师。1980 年起诉书列举老舍、翦伯赞、熊庆来、赵九章等被迫害致死者。
  cites: [ws-1966-08-08-sixteen-points, ws-1980-indictment]
- id: gaorao
  name: 高饶
  kind: target
  color: '#7d6b5d'
  from: 1953
  to: 1955-03-31
  summary: 高岗、饶漱石。1954 年 2 月七届四中全会揭发，1955 年 3 月全国代表会议定为“反党联盟”，两人都被开除党籍。决议说他们“始终没有在任何党的组织或任何党的会议上或公众中公开提出过任何反对党中央的纲领”。
  cites: [ws-1955-03-31-gao-rao-resolution]
- id: lushan
  name: 庐山会议与“右倾”
  kind: target
  color: '#8a6e4b'
  from: 1959-07
  summary: 1959 年庐山会议后被定为“以彭德怀为首的右倾机会主义反党集团”的彭德怀、黄克诚、张闻天、周小舟，以及在大跃进前后因主张放慢合作化、支持包产到户而被批为“右倾”“单干风”的邓子恢等人。1981 年决议说八届八中全会的决议“是完全错误的”。
  cites: [ws-1959-08-16-peng-resolution, ws-1981-resolution]
- id: reform
  name: 改革年代领导层
  kind: institution
  color: '#3d7a5c'
  from: 1978-12
  summary: 1978 年十一届三中全会后主持中央和国务院工作的一批领导人。1980 年五中全会恢复书记处，胡耀邦任总书记，胡耀邦、赵紫阳进入政治局常委；万里、习仲勋主持安徽农村改革和广东特殊政策。内部在“资产阶级自由化”问题上分歧，1987 年 1 月胡耀邦辞去总书记，1989 年 6 月赵紫阳被撤销全部职务。王震、姚依林、胡乔木站在反对自由化的一方。
  cites: [ws-1978-12-third-plenum, rmrb-1980-03-01-fifth-plenum, rmrb-1987-01-17-politburo, ws-1989-06-24-fourth-plenum]
- id: rightists
  name: 1957 年右派
  kind: target
  color: '#8e7a96'
  from: 1957-06
  summary: 1957 年反右派斗争中被划为右派的民主党派领导人和知识分子，官方后来公布共五十五万余人。1978 年全部摘帽，此后绝大多数改正；1980 年统战部提出章伯钧、罗隆基、彭文应、储安平、陈仁炳五人维持原案。
  cites: [ws-1980-ufwd-rightist-review]
- id: democracy
  name: 民主运动
  kind: dissent
  color: '#b45309'
  from: 1978-11
  summary: 1978 年西单“民主墙”以来，公开要求政治民主、言论自由和人权的学生、知识分子和普通市民。1989 年春的学潮是规模最大的一次，6 月 3–4 日被戒严部队以武力清场，组织者被通缉、判刑或流亡；遇难者家属后来组成“天安门母亲”群体。官方定性为“动乱”和“反革命暴乱”。
  cites: [ws-1989-06-30-chen-xitong-report, ws-1989-06-24-fourth-plenum, wp-tiananmen-mothers]
- id: dissent
  name: 异端思想
  kind: dissent
  color: '#1f7a8c'
  summary: 在运动内部以官方话语反驳官方逻辑的独立思考者，如遇罗克《出身论》。
  cites: [ws-1967-yu-origin-theory]
