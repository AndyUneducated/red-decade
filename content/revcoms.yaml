# 省级革命委员会（1967-01-31 至 1968-09-05，共 29 个），一省一行，日期照当时《人民日报》报道正文。
# kind：founded 报道直接写成立之日；rally 报道只写庆祝大会之日（多数省份如此，成立与大会多为同日或前后一日）；
# seized 未见成立报道，只记夺权日。province 用底图的省名。
- org: hlj-revcom
  province: 黑龙江省
  date: 1967-01-31
  kind: founded
  cite: rmrb-1967-02-02-heilongjiang-revcom
  quote: "一九六七年一月三十一日，全省红色造反者召开声势浩大的、有中国人民解放军参加的“黑龙江省红色造反者大联合大夺权誓师大会”……酝酿协商成立了黑龙江省红色造反者革命委员会"
  note: 初称“黑龙江省红色造反者革命委员会”。
