# 经济与人口序列。每个点是某份文献对某一年印出的一个数字，quote 照原文；
# value 换算到序列单位（1亿斤 = 5万吨，1万担 = 0.05万吨，亿度 = 亿千瓦时，公尺 = 米），原单位留在 quote 里。
# kind: reported 当时公布 / revised 后来的文献改动的数 / variant 同一年另一口径的数 /
# retro 国家统计局后来按统一口径回溯的逐年数（research/manifests/r4-retro.yaml，网页转录，未核原书）。
# 本库 1959–1976 年几乎没有当时公布的国家统计局公报，这些年份当时数的空白是史料空白，不是零。

# ── 农业 ────────────────────────────────────────────────
- id: grain
