id: revcom-1967-69
title: 收场的语法：革委会怎样结束 1967—1969 年
period: 1967 年 8 月至 1969 年 12 月
written: 2026-10
summary: 各省革委会成立社论用同一套句式把地方领导人接进既定的反党谱系；派性、左右、群众组织的地位在两年里被重新定义；纠偏的责任落在执行者身上；最新指示与战备成为动员和管制的理由。边疆和农村的暴力在这套叙述之外。
sections:
  - h: 成立社论的固定写法
    claims: [C020, C022]
    text: |
      1968 年各省革委会的成立社论有一个固定写法。河北社论说中国赫鲁晓夫“伙同其在河北省的代理人”，浙江说“中国赫鲁晓夫和他在浙江的一小撮代理人”，安徽点名“及其在安徽的代理人李葆华、黄岩之流”，福建、广西如出一辙。本地被打倒的领导人随即被接到早已定案的谱系上：陕西社论写“中国赫鲁晓夫及其死党彭德怀、高岗、习仲勋、刘澜涛等党内一小撮走资派”；1967 年 8 月中央对鞍山的决定说王鹤寿“还是个高饶反党集团的漏网分子”。旧案成了新罪名的证据。

      同年 7—8 月，在八届十二中全会召开之前，康生系统对旧体制的上层做了一次逐个机构的清点。据 1980 年的起诉书，“中共第八届中央委员、候补中央委员一百九十三名，有八十八名被分别诬陷为”叛徒、特务等，比例是 46%；八届中监委是 62%，三届人大常委 52%，四届政协常委 47%。四个比例几乎相同，这是对整个上层的系统定性，不是针对个人的专案。名单也没有被机械执行：人大常委名单上的朱德、叶剑英，八个月后都当选九届中央政治局委员。这些数字全部是控方口径，名单原件不在库内。

  - h: 派性与左右
    claims: [C016, C017]
    text: |
      “派性”这个词在 1968 年春有过一个短暂的正当版本。元旦社论和河北、浙江等地的成立社论用的是同一个公式：“打倒资产阶级、小资产阶级派性”。4 月 20 日的安徽社论却说，“在阶级社会中，没有什么抽象的、超阶级的派性”，“我们必须坚持无产阶级革命派的派性”。这个提法出现在两派还在争夺革委会席位的时候，此后再没有出现；1969 年的中央文件统一改用“资产阶级派性”，这个词从此是纯贬义，一直用到 1978 年三中全会公报。

      危险来自哪一边，也在这一年里转了方向。两面都要反对的公式一直在用——“无论来自右的方面，或是来自极‘左’方面，都要坚决抵制，坚决反对”——变的是哪一边被点名为当前的危险。1968 年春夏，安徽社论说“当前，要特别警惕和坚决反对右倾分裂主义，右倾投降主义，右倾保守主义”，辽宁的致敬电要“粉碎右倾翻案黑风”；1968 年 11 月以后，批评转向清队中“十分简单、很不利于对敌斗争的作法”，1969 年湖北省革委会把武汉的反复旧运动归于“极‘左’思潮”。转向前后，正是八届十二中全会和九大。

  - h: 群众组织的终点
    claims: [C018, C025]
    text: |
      三年前，《十六条》把文化革命小组、委员会、代表大会称为“无产阶级文化革命的权力机构”，说它们“不应当是临时性的组织，而应当是长期的常设的群众组织”。1969 年中央批转的湖北、四川文件，用几乎相同的条款结束了这一设想。湖北：“‘三代会’是群众组织，必须在革委会领导之下，不得凌驾于革委会之上”；四川：“上下不发生垂直领导关系”，“所有群众组织的小报、刊物和有线广播等一律取消”。同年 9 月，中央把武汉的“北斗星学会”和决派定为反革命地下组织：“对这类反革命的地下组织，必须坚决取缔。”群众组织在制度上被收归革委会，没有纵向联系，没有自己的报刊，也没有自己的名号。

      同一批文件还透露了另一件事。1967 年 12 月，8341 部队支左的经验见报时，要求部队“不匆匆忙忙急于表态”，两派都是革命群众组织，就“逐步地把他们联合起来”。两年后，湖北文件又要求解放军学习这一经验，“不要亲一派、疏一派，支一派、压一派”；四川省革委会在检讨中承认自己正是“亲一派、疏一派，支一派、压一派”。1969 年重申 1967 年的原则，等于承认这两年里地方革委会和支左部队普遍没有做到。

  - h: 纠偏的责任落在谁身上
    claims: [C019]
    text: |
      清队与镇压的纠偏，在 1969 年都被写成执行政策上的偏差。湖北省革委会的检讨承认“在准字上狠下功夫不够，个别单位甚至有逼、供、信和扩大化现象”，规定除确有证据的现行犯外，都应采取“一个不杀，大部不抓”的政策；清华工军宣队的文章把偏差归为执行者对复杂事物“爱作绝对肯定或绝对否定的简单结论”。但下令取缔“北斗星学会”和决派的，正是中共中央本身。

      五年后，中央对湖北的指示才说，毛泽东曾指出湖北清查北、决、扬“搞过了一点”，“就是说犯了扩大化的错误，错误的根子的在刘丰，省委也有责任”。两次表述里，纠偏的责任都落在地方执行者身上。清查涉及多少人、怎样处理，库内没有任何数字。

  - h: 最新指示与战备
    claims: [C021, C024]
    text: |
      1968 年的全国动员，以一条条“最新指示”为单位推进。九大报告把这一做法总结为：“最新指示一发表，立即宣传，立即行动，这种最宝贵的作风，必须巩固下来，坚持下去。”理由是“由于刘少奇一伙反革命修正主义分子封锁毛主席的指示，广大革命群众难以直接听到毛主席的声音”。每一条新指示带出一次全国性的行动：2 月的“办学习班”，8 月工宣队进校，10 月的五七干校，12 月知识青年上山下乡。柳河干校的学员“连夜翻山过河赶到校部，庆祝毛主席最新指示的发表”，还提议“把十月四日作为学校永久的纪念日”。指示由报刊首次公布，传递绕开了党的组织系统。

      1969 年下半年，战备成为地方处置一切问题的总理由。四川省革委会的检讨和邛崃县革委会的布告用了同一句话：“用战备的观点来观察一切，检查一切，落实一切”，县布告作“用战备观点观察一切，检查一切”。省里据此收缴武器、解散武斗队，县里据此取缔自由市场、打击投机倒把。珍宝岛冲突之后的对外危机，在地方文件里变成了对内管制的工具。

  - h: 边疆与农村
    claims: [C023, C026]
    text: |
      有两类地方，在这套叙述里位置特殊。一是边疆。中央从 1966 年 9 月起就把边境地区当作例外，新疆伊犁、塔城、阿尔泰等地“不采取群众直接‘罢官’的办法”，理由是“为了保障边境安全，不使苏修有机可乘”。两年后，边疆省区也是最后一批成立革委会的；广西的成立社论特意回击“中国靠近边疆的省、区成立不了革命委员会”的说法。9 月 5 日西藏、新疆同时成立，“至此，全国除台湾省以外的省、市、自治区都成立了革命委员会”。边防的考虑减缓了夺权，却没有使这些地方免于迫害：起诉书所列受害人数最多的内人党一案，“有三十四万六千多名干部、群众遭到诬陷、迫害”，就发生在内蒙古。

      二是农村。广东高州县陈焯的大字报，是本库唯一一份当时、当地、出自被管制一方的农村杀戮记录：“滥捕滥杀成风，很多地方的五类分子及其子孙已被杀绝，路上伏尸道左及河中流尸逐波”。他为此要求“立即解放地主富农”，结果以“大肆煽动五类分子起来造我无产阶级的反”的罪名，被“判处罪犯陈焯有期徒刑二十年劳改”。这些事实在两份定论文件里都没有位置：1980 年的起诉书全文没有“五类分子”，1981 年的决议只在讲 1978 年以后的工作时，提到为“原地主、富农分子改订了成分”。两件高州文本的底本来源不明，杀戮的范围与人数，需要广东的地方志来补。
