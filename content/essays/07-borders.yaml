id: borders
title: 边界上的文本：宗教、两岸与外部的观察
period: 1958 年至 1989 年
written: 2026-10
summary: 把视线移到边界上：1982 年的宗教文件怎样检讨文革并为 1988 年的拉萨决议定下双重表述；两份《告台湾同胞书》和两份联合声明里变与不变的措辞；对外报道里“农村包围城市”的模板和被省略的柬埔寨共产党；以及美国政府档案怎样读 1974 年的中国。
sections:
  - h: 宗教：禁止的后果
    claims: [C062, C064]
    text: |
      1982 年中央 19 号文件检讨文革的宗教政策，用了两种理由。一是侵犯：“他们强行禁止信教群众的正常宗教生活，把宗教界爱国人士以至一般信教群众当作‘专政对象’”。二是适得其反：“他们在宗教问题上使用暴力，结果却使宗教活动在秘密和分散的状态下得到某些发展”。文件给出的场所数字是，“解放初总共约有十万多所，现在连同寺观教堂、简易活动点和教徒自行建立的活动场所合计在内，约有三万多所”。两个数口径不同，减少的部分有多少发生在文革期间，文件没有说。

      六年后，西藏自治区人大关于拉萨骚乱的决议沿用了这份文件的双重表述。一面说“广大群众和僧尼正常的宗教活动受到了保护”，要“进一步清除‘左’的影响”；一面援引刑法中“以反革命为目的的”条文要求惩处分裂活动，与 1982 年文件“一定要警惕和反对任何利用宗教狂热来分裂人民”的说法相接。官方没有回到文革式的全面禁止。本库关于 1987—1989 年的拉萨只有官方文件，没有寺院、僧尼或目击者的叙述。

  - h: 两岸与港澳：改了哪几个字
    claims: [C065, C066, C067]
    text: |
      1958 年和 1979 年的两份《告台湾同胞书》相隔二十年，政策从炮击转为停火——“中国政府已经命令人民解放军从今天起停止对金门等岛屿的炮击”——但都把国民党当局自己的一个中国立场当作谈判的基础。1958 年说：“世界上只有一个中国，没有两个中国。这一点，也是你们同意的，见之于你们领导人的文告”；1979 年说：“台湾当局一贯坚持一个中国的立场，反对台湾独立。这就是我们共同的立场，合作的基础”。变化最大的是美国：1958 年，“归根结底，美帝国主义是我们的共同敌人”；1979 年，中美关系正常化成了“更可见潮流所至”的证据。

      两岸在 1974 年都把孔子当作政治符号，方向相反。大陆的批林批孔说林彪“就是一个地地道道的孔老二的信徒”；蒋介石同年给中华文化复兴运动的致词说，“孔孟之道，久已成為國民生活不可須臾離的大道”，“毀孔子即是與全民為敵，而自取滅亡”，并称这一运动“在反共的文化戰線上，已有顯著的進展”。

      1987 年的中葡联合声明几乎逐句照搬 1984 年的中英联合声明，只在一处改了字。香港是“保持香港原有的资本主义制度和生活方式，五十年不变”；澳门是“保持现行的社会、经济制度和生活方式，五十年不变”。澳门的文本里没有资本主义一词。改动的原因，库内材料没有说明。

  - h: 对外报道的模板
    claims: [C069, C068]
    text: |
      1965 年林彪的《人民战争胜利万岁》，把中国的经验写成一条可以输出的道路：“依靠农民，建立农村根据地，以农村包围城市，最后夺取城市，这是中国革命所走过的胜利的道路”，并说“掌握和运用人民战争这个武器来对付美帝国主义及其走狗，已经成为许多国家人民的迫切需要”。六年后，《人民日报》写柬埔寨的战争，正是用这个模板：民族解放武装力量“用枪杆子打出了农村包围城市的大好形势”，再配上毛泽东的语录，“小国人民只要敢于起来斗争，敢于拿起武器，掌握自己国家的命运，就一定能够战胜大国的侵略”。

      模板之外，还有省略。1967 年缅甸排华时，北京的集会公开声明“我们坚决支持缅甸人民在缅共领导下进行武装斗争”；而 1971—1973 年关于柬埔寨的报道只写西哈努克亲王和民族统一阵线，乔森潘以“王国民族团结政府副首相、民族解放人民武装力量总司令”的身份出现，英·萨利是“国内特使”，柬埔寨共产党一次也没有被提到。这只是库内五篇文本的检索结论，中方何时第一次公开点名柬埔寨共产党，还不能确定。

  - h: 外国政府怎样读
    claims: [C070]
    text: |
      库内 1974 年的两份美国政府档案，读文革的角度是高层权力。2 月，国家安全委员会的一份分析预计批林批孔中“It thus seems clear that high leaders are likely to fall during this new phase of mass criticism”。11 月，北京联络处的报告转述了毛泽东说文革八年已经够了的意思，判断“Apparently it was agreed that China could not afford another Cultural Revolution at this time”，并注意到“Teng Hsiao-ping now seems clearly to have moved into the Acting Premier’s role”。

      这是站外的一个声部，看的是谁上谁下，不是运动中的人。它的价值在于时间：当国内的报刊还在动员批林批孔时，外部的观察者已经在估计这场运动能走多远。本库只有美国一国的政府档案，苏联、日本和欧洲各国的判断没有原始材料。
