id: succession-1970-76
title: 写进文本的接班：1970—1976
period: 1970 年 3 月至 1980 年 11 月
written: 2026-10
summary: 从不设国家主席却写定“接班人”的宪法草案，到“刘少奇一类骗子”的代称、“极右”与“极左”的翻转、三项指示与天安门事件的定性、两张手迹，再到“四人帮”排名的改变，这七年的接班问题一直在文本的增删里进行。
sections:
  - h: 不设主席，写定人名
    claims: [C027]
    text: |
      1970 年 3 月 8 日，毛泽东提出修改宪法，同时提出“不设国家主席”。本库所收的 1970 年宪法修改草案照此办理，却在第二条按人名写定了元首和军权：“毛泽东主席是全国人民的伟大领袖，是我国无产阶级专政的元首，是全国全军的最高统帅。林彪副主席是毛主席的亲密战友和接班人，是全国全军的副统帅”。职位不设，人却写定了。

      九一三之后的中央专案材料，把庐山会议的分歧归结为一点：“核心的问题，是要设国家主席，是林彪急于想当国家主席，抢班夺权”。1975 年的宪法删去了所有人名，改为“中国共产党中央委员会主席统率全国武装力量”；张春桥的修宪报告说明，“由于不设国家主席，草案对一九五四年宪法关于国家机构的规定，作了相应的修改”。元首问题最终用党主席吸收军权的办法解决。1976 年 10 月的庆祝口号“热烈庆祝华国锋同志任中国共产党中央委员会主席、中国共产党中央军事委员会主席”，正是这一安排的结果。

  - h: 删去的接班人，代称的骗子
    claims: [C028, C029]
    text: |
      林彪死后，文本面对的是一个已经写进党章的接班人。1973 年的十大党章删去了九大党章中的“林彪同志是毛泽东同志的亲密战友和接班人”，接班人只以泛指的形式保留：“要培养千百万无产阶级革命事业接班人”。同时删去的还有“毛泽东思想是在帝国主义走向全面崩溃、社会主义走向全世界胜利的时代的马克思列宁主义”这一时代定义；党员义务的第一条由“活学活用马克思主义、列宁主义、毛泽东思想”改为“认真学习马克思主义、列宁主义、毛泽东思想，批判修正主义”。新增的一句是“全党同志要有敢于反潮流的革命精神”。

      在公开报刊上，这次删改之前有将近两年的沉默。1971 年 9 月 18 日的中央通知规定，事件“目前只传达到省、市、自治区党委常委以上的党组织。有关林彪的文字、图画、电影等均暂不改动”。此后内部下发的通知和专案材料直呼林彪之名，公开的社论用的却是“刘少奇一类骗子”：1972 年元旦社论、国庆社论、1973 年元旦社论和两篇《人民日报》文章共用了 21 次，没有一次出现林彪的名字。十大政治报告揭开了这层指代，它几乎原样重写了 1973 年元旦社论的句子，只换了人名：“开展对林彪一类骗子的革命大批判……提高了识别真假马克思主义的能力”。

  - h: 极右还是极左，秦始皇指谁
    claims: [C030, C031]
    text: |
      批林的方向本身也有过一次转折。1981 年决议说，“一九七二年，在批判林彪的过程中，周恩来同志正确地提出要批判极左思潮的意见”，而“毛泽东同志却错误地认为当时的任务仍然是反对‘极右’”。本库文本能把这个转折定在 1972 年 9 月到 1973 年 7 月之间：1972 年 9 月关于干部住房的文件仍要求“批判无政府主义，批判极‘左’思潮”，这是极左一词在本库官方文本中最后一次出现；从 1973 年 7 月起，“极右实质”成了批林的固定措辞，十大政治报告说，“也说出了林彪反党集团的极右实质”。粉碎“四人帮”之后，1977 年的十届三中全会仍说他们“是一伙彻头彻尾的极右派”。极左要到 1981 年决议才重新出现，并被用来定性这一整个时期。

      同一时期，秦始皇成了对立双方共用的影射符号。1972 年 1 月下发的林彪材料之二公布了《571 工程纪要》的原话：“打倒当代的秦始皇——Ｂ－５２，推翻挂着社会主义招牌的封建王朝”；同一份材料附上毛泽东 1958 年的话作答：“你骂我们是秦始皇，不对，我们超过了秦始皇一百倍”。1974 年的评法批儒文章把秦始皇写成“新兴封建地主阶级的杰出政治家”。1976 年 4 月，《人民日报》说天安门广场上的人“用影射和赤裸裸的反革命语言，猖狂地叫嚣‘秦始皇时代已经过去’”。评法批儒文章本身没有提到《571 工程纪要》，说两者彼此回应，是本站从时间顺序和用语推出的。

  - h: 一进一退的政策
    claims: [C032, C033]
    text: |
      政策上的回调，在这几年里常常是一进一退。推荐入学制下的“文化考查”是一例。1970 年的招生意见宣布“废除修正主义的招生考试制度，实行群众推荐，领导批准和学校复审相结合的办法”；1973 年的招生意见在推荐、政审之后加入考查，要“保证入学学生具有相当于初中毕业以上的实际文化程度”。同年 8 月，《人民日报》转载张铁生的信，编者按说他“似乎交了‘白卷’，然而对整个大学招生的路线问题，却交了一份颇有见解，发人深省的答卷”。1974 年的招生意见把上一年的考查定为“修正主义教育路线”的突出表现，点名批评“闭卷考试，单纯考书本知识，凭分录取”，但没有废除考查之名，而是把方法改为“调查访问，座谈讨论”。名称保留，内容被掏空。

      知青问题也是这样。1973 年，李庆霖来信经毛泽东复信之后，中央通知各省区派人“来中央汇报和统筹解决这一问题”；兵团案的通报承认迫害知青的案件“在其他地方也有发生，有的相当严重”，云南兵团“有的团，捆绑吊打成风，打人手段达几十种之多”。承认的范围很广，归因却没有触及政策本身：作案的干部“是林彪修正主义路线的余孽”，上山下乡则“是毛主席革命路线的伟大胜利”。

  - h: 1976 年的三次定性
    claims: [C034, C035, C036]
    text: |
      1976 年的几次定性，都可以在本库文本里逐日追踪。先是三项指示。1975 年 10 月 21 日，《人民日报》社论还号召“认真执行毛主席提出的学习理论反修防修，安定团结和把国民经济搞上去的三项指示”；不到五个月，1976 年 3 月 10 日的《人民日报》要“批判‘三项指示为纲’”，5 月 16 日称之为“邓小平翻案复辟的政治纲领”。批判的对象写作“三项指示为纲”，而不是三项指示本身。

      再是天安门事件。1976 年 4 月，《人民日报》说这是“有预谋、有计划、有组织地制造反革命政治事件”，政治局“根据伟大领袖毛主席提议”撤销邓小平党内外一切职务。1978 年 12 月的十一届三中全会改定为“完全是革命行动”，把颠倒是非归于“四人帮”；1980 年的起诉书把罪责落在姚文元身上，说他把群众“悼念周恩来、拥护邓小平的革命言行诬陷为‘发表反革命演说和反革命口号’”；1981 年的决议才写明，“当时，中央政治局和毛泽东同志对天安门事件的性质作出了错误的判断”。定性先后改写了三次，每一次承担责任的人都不同。

      最后是毛泽东去世后的继承之争，围绕的是他 4 月 30 日同一天的手迹。9 月 16 日的两报一刊社论写道：“毛主席嘱咐我们：‘按既定方针办’”；10 月 18 日的中央通知说，毛泽东亲笔写的是“照过去方针办”，“‘按既定方针办’六个字错了三个”，并把前者定为伪造。10 月 24 日的首都大会公开了同一天的另一张手迹：“毛主席又给华国锋同志亲笔写了‘你办事，我放心’”。两张手迹的原件都不在库内，内容只见于胜利一方的通知与报道。

  - h: 四人帮的名字与排序
    claims: [C037]
    text: |
      “四人帮”这个名字本身也有来历。它在本库中最早见于 1976 年 10 月 18 日的中央通知，出自通知所引 1975 年 5 月 3 日毛泽东的话：“不要搞四人帮，你们不要搞了，为什么照样搞呀”。此前本库所有文本都没有这个词。

      四人的排列次序后来改过一次。1976—1977 年的文件，从首都大会的报道（“热烈庆祝粉碎王洪文、张春桥、江青、姚文元反党集团篡党夺权阴谋的伟大胜利”）到 1977 年的十届三中全会公报，一律按十届一中全会的职位次序排列：王洪文是副主席，张春桥是政治局常委，江青、姚文元是政治局委员。从 1980 年的起诉书起，次序改为“以江青为首的江青、张春桥、姚文元、王洪文‘四人帮’反革命集团”，1981 年的决议照此书写。文本没有说明为什么改；由于 1978—1979 年的文本多只写四人帮而不列全名，改变的时间只能定在 1977 年 7 月到 1980 年 11 月之间。

      从国家主席到四人帮的排序，这七年的接班问题一直是在文本的增删里进行的。谁的名字写进宪法和党章，谁被换成一个代称，谁的手迹被公布，谁排在第一，都是政治结果的记录。
