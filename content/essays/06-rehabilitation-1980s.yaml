id: rehabilitation-1980s
title: 处遗：1980 年代怎样清理文革
period: 1979 年至 1989 年
written: 2026-10
summary: 法院改判了约四分之一的文革刑事案件；零陵各县 1987 年的处遗总结报出九千多名死者，杀人一县传一县；抚恤先落在干部身上，县级数字随处遗上升；平反常做两次，组织与个人分开处理。地方上的文革记录大多在整党中写成，而“宜粗不宜细”同时限制了处分和叙述。
sections:
  - h: 改判的规模
    claims: [C048, C049]
    text: |
      官方公布过的文革冤案规模，最具体的是法院系统的数字。1983 年 6 月的最高人民法院工作报告说，到 1981 年底，各级法院“已复查了‘文化大革命’中判处的刑事案件一百二十万件”，“改判纠正了冤、假、错案三十万零一千余件，涉及当事人三十二万六千余人”，大约每四件中有一件。原则是“全错的全平，部分错的部分平，不错的不平”。这个数字只计法院判处的刑事案件，不含党内处分、单位审查、群众专政和未经审判的打死。

      几乎同时开始的严打，提供了一个比较的尺度。1987 年的法院报告说，“自1983年8月到1986年底，全国各级人民法院共审结刑事案件140万余件，判决人犯172.1万多名”，是文革十年刑事冤案改判人数的五倍多。两组数字口径不同，前者是全部判决，后者只是改判；比较只说明 1980 年代刑事司法的规模，不说明两个时期性质相同。

  - h: 零陵：一县传一县
    claims: [C050, C051, C060]
    text: |
      1987 年，湖南零陵地区十一个县市各自写了处遗总结。把它们报出的文革死亡数相加，约是九千一百四十六人，其中道县一县就有四千五百零九人：“全县共死亡 4509 人，其中被杀 4070 人，被迫自杀 439 人”。宁远“被杀889人，还有的被迫自杀的204人，共计1093人”；江华“合计788人，占当时全县人口的3.3％”。各县口径不一，都是县委自报的数字。

      死者的成分各县差别很大。道县死者中四类分子及其子女占九成以上；江华的 788 人中“有四类分子343人，四类分子子女280人，贫下中农109人，其他56人”；东安则“属四类分子的 95 人、四类分子子女 137 人、 贫下中农 164 人”，贫下中农占了近四成，全县另有 1178 人“因抓所谓‘反共救国军’被打伤、打残”。按成分清除，并不能解释所有县的死亡。

      杀人是一县传一县的。新田县委说，道县、宁远的杀人“被新田一些造反派和部份不明真相的干部群众作为镇压阶级敌人，抓阶级斗争的经验加以推广”；江华县委说，“受外县杀人风的波及影响，1967年的9、10月间，我县出现了严重的杀人事件”，晚于道县的 8 月。这些都是县委在二十年后的自述。

  - h: 先干部，后群众
    claims: [C052, C053]
    text: |
      处遗的结论和抚恤，最初落在干部身上。广西灌阳 1982 年“对非正常死亡的13名国家干部工人的遗属发放了16726元抚恤金”，而“未作定性结论的118人，其中‘四类分子’102人”；苍梧先把 53 名干部、职工的死亡结论“由原来的结论‘非正常死亡’改为‘逝世’”。湖南双牌到 1987 年，才“对全县被杀和自缢的344人，发给抚恤金49650元”。1983 年广西统一部署处遗以后，有的县的抚恤对象才是全部被害者的家属。

      县级的死亡数字，也随处遗的推进而上升。灌阳县委 1982 年 5 月向上报的是“灌阳1967年至1968年共有241人非正常死亡”，同年 12 月县处遗办公室的统计是“全县在‘文化大革命’中被迫害致死的304人”。前一个数限于两年，后一个是整个文革；只有这一个县有前后两个数，能否推广，未核。

  - h: 两次平反，组织与个人分开
    claims: [C054, C055]
    text: |
      1980 年代的平反常常要做两次，第二次的理由是第一次不彻底。贺龙 1974 年平反，1982 年的文件说，“但《通知》对贺龙同志的平反是不彻底的，有些提法是错误的”；卫恒，“1979年1月，中共山西省委作出决定，为卫恒平反昭雪，恢复名誉”，1985 年 6 月再作“彻底平反的决定”。北京的“西纠”“联动”，“虽经北京市公安局于1979年7月进行了恢复平反，但由于当时对彻底否定‘文化大革命’的思想界限不清”，1984 年又发文彻底平反。

      同一份关于联动的文件，也显示了 1983 年以后处理文革暴力的办法：组织彻底平反，个人另行处理，“对这两个中学红卫兵组织中极少数犯有严重错误或罪行的人，应按中央《关于清理‘三种人’若干问题的补充通知》规定处理”。零陵地委处理道县杀人也是同一个原则：“既坚决慎重地查处极少数犯有严重杀人罪行的人员，又团结教育绝大多数”。极少数究竟是多少，库内材料没有给出。

  - h: 记录是在整党中写成的
    claims: [C056, C057]
    text: |
      本库的县级文革史料，大多产生于 1983—1987 年的整党。广西各县的文革大事记署名各县的整党领导小组办公室；北京大兴“八三一”事件的调查，署名县委的核查“三种人”领导小组。兴安县大事记的序言说，编写时“选择了那些在全县影响较大的事件，客观的加以记载，作为史料存查备考”。地方上的文革记录，是在清理“三种人”的过程中写成的，读这些材料，要记得它们首先是为了处理人。

      对中下层执行者的审判，也集中在少数几天。上海王秀珍、徐景贤两案的判决书都写明检察院“于一九八二年六月二十六日向本院提起公诉”；北京的赵登程、齐景和、刘庆棠，判决书的落款都是“一九八三年十一月二日”。这只是库内找到的案件，同期其他省份的审判没有系统收集。

  - h: 宜粗不宜细
    claims: [C061, C058, C059]
    text: |
      “宜粗不宜细”这句话在库内被援引了两次，作用在两个层面上。1985 年零陵地委处理道县杀人，要“坚持宜粗不宜细，宜宽不宜严，宜少不宜多的原则”，决定的是追究多少人；1988 年中宣部、新闻出版署关于文革图书的规定，“根据中央团结一致向前看，历史问题宜粗不宜细的一贯精神”，决定的是出版多少，并规定“有关‘文化大革命’的辞典等工具书，今后相当时期内，各出版社均不得安排”。前者限制处分，后者限制叙述。

      文革的词汇也没有随处遗消失。1983 年的整党决定以“帮派思想严重的人，打砸抢分子”指文革中的施暴者；1989 年 5 月的北京戒严令“严禁任何人以任何方式制造和散布谣言，进行串联、演讲，散发传单”，“严禁打、砸、抢、烧等一切破坏活动”。这只说明用词的延续，不说明两个时期的事件性质相同。同一年春天之前，官方统计已经承认经济失控：“１９８８年零售物价总水平比上年上升１８．５％”，3 月的政府工作报告说，“总的来看，在经济建设中，存在着急于求成的倾向”。物价与此后几个月的抗议之间是什么关系，本库只有官方材料，没有参与者的说法。
