id: numbers-famine
title: 数字是怎样产生的：粮食、口粮与死亡
period: 1953 年至 1982 年
written: 2026-10
summary: 1958 年的粮棉产量公布四个月后被下调三分之一；1955、1957 年的粮食产量各有两个官方数；统计公报中断了二十年。口粮标准由征购任务倒推，死亡人数在上报和揭发之间相差数倍，逮捕和处决是按年下达的控制数字。本文只讨论库内文件给出的数字怎样产生、怎样互相矛盾。
sections:
  - h: 公布四个月后下调三分之一
    claims: [C038, C039, C040]
    text: |
      1959 年 4 月，国家统计局公报宣布 1958 年“粮食总产量达到7，500亿斤，比上年增长了一倍”，棉花“比上年也增长了一倍”，钢产量（“包括一部分土钢”）一千一百零八万吨。四个月后，八届八中全会的公报说，“过去发表的一九五八年的农业产品产量的统计偏高”，“一九五八年的粮食的实际收获量为五千亿斤”，“棉花实际收获量为四千二百万担”，钢里“有三百零八万吨是土法生产的”。偏高被归于统计机关“对这个空前大丰收的产量估算缺乏经验”。

      同一个年份的数字给出两次，在库内并非孤例。1955 年的粮食产量，1956 年的公报写的是“3，680亿斤（18，400万吨）左右”；1960 年 4 月谭震林的报告用的是三千四百九十六亿斤，并以此为基数说四年里“共增加了一千九百零五亿斤”。用公报的数作基数，增量就只有一千七百多亿斤。报告没有说明为什么用较低的数。

      1957 年的情形更难解释。一五计划完成公报写“粮食总产量达到3，700亿斤”，1958 年的两个数往回推也都在这上下；但 1960 年 9 月中共中央压低口粮标准的指示写的是：“一九五七年全国粮食产量只有二千七百亿斤，而日子过的还比较好，就是一个证明”。这一处可能是录文或原件的笔误，也可能另有口径，在核实之前，本站的经济与人口页不收这个数。

  - h: 二十年没有公报
    claims: [C047, C046]
    text: |
      上面这些数字之所以要从会议公报、部长报告和中央指示里一个个拼出来，是因为常规的来源中断了。本库收到的国家统计局年度公报，在 1959 年 4 月之后，下一份是 1979 年 6 月的 1978 年公报，中间二十年一份也没有。这二十年的全国粮食数字，本库只找到 1958、1959、1971、1972 年几个，最后两个来自国务院 1972 年的粮食报告（“比去年实报五千零三亿斤”）。没有找到不等于没有发表，但经济与人口页的图上，这一段画成灰色。

      连“全国人口”的含义也在变。1953 年普查公报说，“全国人口总数为六亿零一百九十三万八千零三十五人”，其中包括“待解放的台湾省七百五十九万一千二百九十八人”和“国外华侨和留学生等一千一百七十四万三千三百二十人”，“直接调查登记的人口为五亿七千四百二十万五千九百四十人”。1978 年的公报注明“公报中全国人口数字，包括台湾省。经济文化建设数字，暂未包括台湾省”；1982 年度的公报又把 1981 年末的人口从上一份公报的“99，622万人”改为 100072 万人，注明“一九八一年和一九八二年全国人口数字中都包括现役军人”。比较不同年份的人口，先要对齐口径。

  - h: 口粮是倒推出来的
    claims: [C041]
    text: |
      1960 年 9 月的那份压低口粮指示，算法写得很清楚。起因是征购：“征购粮入库一百三十九亿斤，比去年同期的一百九十亿斤减少五十一亿斤”，“库存比去年同期减少了一百亿斤”，而北戴河会议商定的上调任务仍要“保证上调粮一百九十亿斤任务如数完成”。于是“淮河以北地区的口粮标准，应当压低到平均每人全年原粮三百斤左右”，“而各省的重灾区，则应当压低到平均每人三百斤以下”；城市里“每人每月必须压低口粮标准两斤左右（商品粮）”。

      指示用河北省委的一份调查来证明这个标准够用：“平均每人每天有零点八市斤原粮（全年合二百九十斤），加上二斤到二斤半菜，大小人口调剂着吃，劳动力可以维持通常的劳动”。五个月前，谭震林的报告刚说过粮食产量“增加到了一九五九年的五千四百零一亿斤”。口粮不是从需要往上算，而是从上调任务往下扣。三百斤是平均数，各地实际吃到多少，本库只有信阳等少数地方的材料。

  - h: 信阳：上报与揭发
    claims: [C042]
    text: |
      信阳是库内材料最集中的地方，也最能说明死亡数字是怎样产生的。1960 年 4 月，地委向上报的全区死亡数是“71658人（包括正常死亡在内）”。同年 12 月，地委的整风报告给出了各县的另一组数：“正阳县原报去冬今春死一万八千多人”，“现初步揭发已达八万多人”；“新蔡县原报去冬今春死三万来人”，“现在增加到近十万人”；遂平县嵖岈山公社，“现在揭发死人近四千人，占总人口百分之十”。

      瞒报是怎样做的，商城县委 1961 年揭发县委书记张念仲的报告有一句具体的记载：1960 年 4 月县里已掌握死亡二万八千多人，他“关于死人问题只准向地委报三千多人”，“向省委只报一万二千人，瞒报一万六千人”。上报数与揭发数相差数倍；而揭发数本身也只是整风中的“初步”数，各县时段和口径不一，不能相加。

  - h: 控制数字与名额
    claims: [C043, C044]
    text: |
      数字不只是事后统计，有时是事先下达的。公安部长谢富治 1960 年 2 月的报告回顾说：“一九五七年到一九五八年我们采取了连续紧的策略。一九五八年捕了一百万人”；1959 年改行“少杀、少捕、管制也要比过去少的政策”，“全国捕了反革命分子和其他犯罪分子二十一万三千三百五十六名，杀了四千四百八十一名”；对 1960 年，“我们拟定的控制数字是：捕十六万至十八万，杀三千至四千，新管十三万左右”。逮捕与处决按年计划，是这份报告自己的说法。

      右派的总数，本库只有一个来源，是 1980 年中央统战部的复查报告：“全国划了右派分子四十九万余人，以后又陆续划了几批，共计五十五万余人”，此后“先后五批摘掉约三十余万人的右派帽子”。报告承认反右“确实犯了扩大化的错误”，同时坚持章伯钧、罗隆基“并非错划，不应改正”。1981 年决议的措辞是“但是反右派斗争被严重地扩大化了”。

  - h: 进城与压回农村
    claims: [C045]
    text: |
      大跃进的代价也以人口流动的形式出现。“1957年底，我国职工人数已经达到2，451万人”；1958 年“全国职工平均人数达到3，200多万人，比上年增加了约800万人”。三年之后，1962 年 5 月中共中央、国务院决定，“全国职工人数应当在一九六一年年末的四千一百七十万人的基础上，再减少一千零五十六万人至一千零七十二万人”，“全国城镇人口应当在一九六一年年末一亿二千多万人的基础上，再减少二千万人”，办法是“把能去农村的职工都一律先减到农村去”。

      十年后同样的问题又出现了。国务院 1972 年的粮食报告说：“仅一九七〇、一九七一两年，就增加职工九百八十三万人，超过计划五百零九万人”。这句话写在一份粮食报告里，职工人数在这里是当作粮食问题来讨论的。
