id: red-august
title: 红八月与定论里的空白
period: 1966 年 6 月至 1981 年 6 月
written: 2026-10
summary: 1966 年 8 月，成文的约束与口头的动员同时存在，“四旧”从街头进入官方文本，抄家按出身划界。十五年后的起诉书和历史决议把叙事收束为两个集团迫害干部和知识分子，以出身为界、针对普通居民的街头暴力在其中没有位置。
sections:
  - h: 约束与动员同时写在纸上
    claims: [C007]
    text: |
      1966 年 8 月 8 日的《十六条》同时写着最强的约束和最强的动员。一面是“要用文斗，不用武斗”，“要保护少数，因为有时真理在少数人手里”；一面是“不要怕出乱子”。十天后，林彪在第一次接见红卫兵时的讲话只保留了动员的一面：“使他们威风扫地，永世不得翻身”。8 月 23 日的《好得很！》社论为街头行动背书。

      直到 8 月 31 日第二次接见，林彪才重申“我们一定要按照毛主席的教导，要用文斗，不用武斗。不要动手打人”；同一篇讲话仍然肯定红卫兵“横扫‘四旧’”。成文的约束和口头的动员在同一个月里并存，约束的重申晚于暴力，而且总是和对行动的肯定捆在一起。

  - h: “四旧”从街头进入官方
    claims: [C004]
    text: |
      “四旧”这个词的路径正好相反，是从街头走进官方文本的。四项并列的全称最早见于 6 月 1 日《人民日报》社论《横扫一切牛鬼蛇神》：“要彻底破除几千年来一切剥削阶级所造成的毒害人民的旧思想、旧文化、旧风俗、旧习惯”。《十六条》和林彪 8 月 18 日的讲话都用全称。

      缩写进入官方文本是在 8 月 31 日林彪的讲话，而且带着引号：“他们走上街头，横扫‘四旧’”——引号表明这是借来的说法。到 10 月 1 日，林彪的国庆讲话已不加引号，还配上了对仗：“破剥削阶级的四旧，立无产阶级的四新”。一个月之内，红卫兵的口号被官方吸收并规范化了。

  - h: 谁的家可以抄
    claims: [C005, C006]
    text: |
      红八月的暴力有明确的边界。北京西城区纠察队的第四号通令写道：“不是黑六类的家一律不查！国家负责干部的家绝对不许查！”这与《十六条》的规定相背——“这次运动的重点，是整党内那些走资本主义道路的当权派”。抄家的对象按出身划定，干部之家受到保护。遇罗克后来在《出身论》里抓住的正是这一点：“为了转移斗争的方向，他们便偷换了概念”。

      “造反”这个词也是这样被分配的。它最早的使用者是清华附中的干部子弟红卫兵，他们造反的立足点在国家一边：“我们只许左派造反，不许右派造反！你们胆敢造反，我们就立即镇压！这就是我们的逻辑。反正国家机器在我们手里”。西城纠察队自称“纠察队是革命的造反队，是无产阶级专政的工具”。到 11 月，上海工总司把造反的矛头指向本地党委：“上海市委也贯彻执行了一条资产阶级反动路线”。词没有反转，它的所指被重新分配了。

  - h: 两份定论没有留下位置
    claims: [C013, C010]
    text: |
      十五年后的两份定论文件——1980 年的起诉书和 1981 年的《历史决议》——都没有为这场以出身为界的街头暴力留出位置。决议全文没有出现红卫兵、抄家、武斗、四旧这些词，只说运动初期卷入的多数人，“除了极少数极端分子以外，他们也不赞成对党的各级领导干部进行残酷斗争”，受害者被设定为干部。起诉书里的抄家，指的是对彭真等人、对刘少奇和王光美（“进行抄家，对刘少奇、王光美进行人身迫害”）以及张春桥的特务组织；红卫兵出现时是“冒充红卫兵”。它列举的文艺界死者，“老舍、赵树理、周信芳、盖叫天、潘天寿、应云卫、郑君里、孙维世等迫害致死”，都归于林彪、江青两个集团，不涉及动手的学生。

      起诉书的数字也是同一个口径。内蒙古“内人党”一案，“有三十四万六千多名干部、群众遭到诬陷、迫害，一万六千二百二十二人被迫害致死”；冀东一案，“张文浩等二千九百五十五人被迫害致死”。这是司法口径，只追究十名被告，结构上排除了无法归到他们名下的死亡：群众武斗、清理阶级队伍中的基层暴力，以及 1966 年夏天的街头暴力。

      这不等于否认。起诉书受法律范围的限制，决议也自称对两个集团的罪行不多论列。但定论把叙事收束为两个集团迫害干部和知识分子之后，红八月以出身为界、针对普通居民的暴力，在官方叙述里成了一个空白。本站把那个月的社论、通令和讲话按日期排在一起，是为了让这个空白看得见。
