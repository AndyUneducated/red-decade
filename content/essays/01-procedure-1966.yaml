# 长文：段落之间空一行；“”内四字以上是引文，构建时与本节结论的证据原文逐字核对，‘’代表原文的“”。
id: procedure-1966
title: 先有行动，后有罪名：1966 年的程序之争
period: 1966 年 2 月至 1967 年 11 月
written: 2026-10
summary: 《二月提纲》与《五一六通知》的分歧不在方向而在程序；这一分歧被改写成立场问题，再升级为“政变”。“资产阶级反动路线”“资产阶级司令部”“继续革命”这些名称，都在行动之后才出现，又被追溯为行动的起因。
sections:
  - h: 提纲争的是程序
    claims: [C001, C009]
    text: |
      后来的叙述常把 1966 年 2 月的《二月提纲》说成一份为学术自由辩护的文件。逐句读下来并非如此。提纲完全接受当时的框架，说这场批判“是兴无灭资的斗争即社会主义及资本主义两条道路斗争中的一个组成部分”。它与后来的《五一六通知》分歧不在方向，而在做法：要“有领导地、认真地、积极地和谨慎地搞好这场斗争”，要“用摆事实、讲道理的方法……真正地驳倒和摧毁它们”，“报刊上公开点名作重点批判要慎重，有的人要经过有关领导机构批准”。

      《五一六通知》的办法，是把这些程序上的主张逐条改写成立场问题。提纲“反复强调斗争中要所谓‘有领导’、要‘谨慎’、要‘慎重’、要‘经过有关领导机构批准’”，在通知里成了阻挠斗争的证据。分歧原本是怎样做，通知把它改成了站在哪一边。

      还要提醒一点：本站关于这几个月的日期，大多来自通知所附的大事记。那是 1966 年 5 月胜利一方编定、随通知下发到“县委、文化机关党委和军队团级党委”的指控材料，彭真的每一步都被解释为对抗。读这段历史时，它是一个声部，不是中立的记录。

  - h: 同样的翻转到了基层
    claims: [C014]
    text: |
      5 月 25 日北京大学聂元梓等七人的大字报，把同样的翻转带进了一个单位。大字报引述北京市委大学部和北大党委的要求：宋硕说运动“急切需要加强领导，要求学校党组织加强领导，坚守岗位”；党委说“北大不宜贴大字报”，“要引导开小组会，写小字报”。这些正是提纲的程序主张。大字报的回答是：“这不是压制群众革命，不准群众革命，反对群众革命吗？我们绝对不答应！”

      “有领导”被重新定义为压制，大字报本身成了革命的标志。十天前通知在中央对提纲做的事，在基层由群众对本单位党委又做了一遍。需要说明，宋硕、陆平的话都是大字报的转述，北大党委的原始记录不在库内。

  - h: 一个指控，换了三次对象
    claims: [C015]
    text: |
      程序之争很快被升级为生死之争。“反革命政变”这一指控，在库内文本中最早出现在林彪 1966 年 5 月 18 日的讲话：“这是最大的问题，是防止反革命政变，防止颠覆，防止‘苦迭打’。”两天前的通知只说对方“一旦时机成熟，他们就会要夺取政权”，并没有政变的字样。林彪也没有拿出事实——“有很多现象，很多材料，我在这里不去详细说了”——他的依据是一份古今政变的清单。

      此后这个指控的对象换了三次。6 月的《红旗》社论把“采取‘宫廷’政变的形式，或者采取武装政变的形式”写成赫鲁晓夫式人物夺权的两种途径；1967 年 8 月的周年社论说刘少奇一方“凡是搞反革命政变、推翻无产阶级的政权所需要的一套，都拚命去抓”；1980 年的起诉书则把“阴谋杀害毛泽东主席、策动反革命武装政变失败”加在林彪本人身上。最先提出这项指控的人，成了最后一个被这样指控的人。

  - h: 罪名是逐步命名的
    claims: [C002, C003, C011]
    text: |
      罪名本身也是一步步起出来的。8 月 5 日毛泽东的《炮打司令部》，被引的原文只说“某些领导同志”。“资产阶级反动路线”这一罪名首次公开出现，是在 10 月 1 日《红旗》第 13 期社论；社论反过来把《十六条》说成“两条路线斗争的产物”，尽管《十六条》本身没有这个词。此后它迅速通行，1967 年元旦社论一篇就用了 41 次。

      被指控的刘少奇在 10 月 23 日的检讨里，只承认“这是一种右倾机会主义的路线错误”，没有接受那个标签；但检讨的结构是逐项复述《炮打司令部》的指控——“五十多天”、1962 年的右倾、1964 年“形式上是‘左’的而实际上是右倾的错误”。检讨是在别人设定的框架里写成的。

      “资产阶级司令部”又晚了将近一年。1966 年下半年到 1967 年上半年，库内官方文本用的都是“资产阶级反动路线”；司令部的说法集中出现在 1967 年 8 月的周年社论：“原来在无产阶级专政机构内部，存在着两个根本对抗的司令部”。罪名从路线升级为司令部，是事后加码。1981 年的决议则说，“党内根本不存在所谓以刘少奇、邓小平为首的‘资产阶级司令部’”。

  - h: 理论最后才到
    claims: [C008]
    text: |
      连运动的理论也是事后命名的。“无产阶级专政下继续革命”在 1966 年和 1967 年上半年的库内文本中都没有出现。它在 1967 年 11 月 6 日的两报一刊社论中第一次登场，社论说毛泽东“创造性地提出了无产阶级专政下继续革命的伟大理论”，并列出要点；1969 年九大报告用了 8 次，把它上溯到 1957 年。1981 年决议说，这些论点“曾被概括成为所谓‘无产阶级专政下继续革命的理论’”。

      从提纲到继续革命，这一年半里反复出现同一个次序：先有行动，再有罪名，最后有理论；罪名和理论又被追溯成行动的起因。读 1966 年的文本，先要分清哪个词那时已经存在，哪个是后来补上的。本站的“概念”页按首次出现的日期排列这些词，就是为此。
